/* ========================================================================
   5. 分子運動のエンジン
   ------------------------------------------------------------------------
   位置は箱に対する割合 f ∈ [0,1]³ で持ち，速度は本物の m/s で持つ．
   こうしておくとピストンを動かすとき（Lx を変えるとき）に位置を触らずに済み，
   それがそのまま「準静的な膨張」＝ 全分子を一斉に引き伸ばす操作になる．

   壁で跳ね返るたびに 2m|v⊥| を足していき，
       P = Σ(力積) / (表面積 × 時間) × (本物の分子数 / 描いた分子数)
   として圧力を「測る」．これは nRT/V とは独立な計算になっている．
   ======================================================================== */
const RAD_FRAC = 0.011;      /* 衝突半径．箱の高さに対する割合（基準の個数のとき）．
                                大きくすると排除体積のぶん圧力が高めに出る */
const RAD_REF  = 600;        /* RAD_FRAC がそのまま効く個数 */
const NCY = 16;              /* 衝突を探す格子の分割数（y, z 方向） */

function Gas(){
  this.N = 0;
  this.f = null;             /* 位置（箱に対する割合）  [3N] */
  this.v = null;             /* 速度 [m/s]              [3N] */
  this.Lx = 1; this.Ly = 1; this.Lz = 1;   /* 箱の辺 [m] */
  this.mass = 4.65e-26;
  this.T = 300;
  this.doColl = true;
  this.impulse = 0;          /* 直前の step で壁が受けた力積 [N s] */
  this.hits = 0;
  this.flash = [];           /* 壁を叩いた跡（見せるためのもの） */
  this.head = null; this.next = null; this.ncx = NCY;
}

/* 半径は個数の 3 乗根に反比例させる．
   ------------------------------------------------------------------------
   こうしないと充填率 η = N (4/3)π(RAD_FRAC·L)³ / L³ = N (4/3)π RAD_FRAC³ が
   個数に比例して増えてしまう（箱の大きさには依らない）．
   描く数を N に比例させたので，体積や n を上げると点が増え，
   排除体積のぶん「測った圧力」が nRT/V から 6 % も浮いてしまった．
   半径を N^(−1/3) 倍しておけば η が一定に保たれ，ずれは約 1 % のまま．
   上限 0.030 は，衝突を探す格子（1 辺 Ly/16）より直径が大きくならないようにするため． */
Gas.prototype.radFrac = function(){
  return Math.min(0.030, RAD_FRAC * Math.cbrt(RAD_REF / Math.max(1, this.N)));
};

Gas.prototype.setBox = function(Lx, Ly, Lz){
  this.Lx = Lx; this.Ly = Ly; this.Lz = Lz;
  /* 格子の x 分割数．セルは必ず衝突直径より大きくしておく（27 近傍で足りるように） */
  this.ncx = Math.max(4, Math.min(28, Math.round(NCY * Lx / Ly)));
  const nc = this.ncx * NCY * NCY;
  if (!this.head || this.head.length !== nc) this.head = new Int32Array(nc);
};

/* Maxwell 分布で振り直す．最後に標本全体の運動エネルギーを
   ちょうど (3/2)N k_B T に合わせる（N が有限なので数 % ずれるため） */
Gas.prototype.seed = function(N, mass, T){
  this.N = N; this.mass = mass; this.T = T;
  this.f = new Float64Array(3 * N);
  this.v = new Float64Array(3 * N);
  this.next = new Int32Array(N);
  const sig = Math.sqrt(KB * T / mass);
  for (let i = 0; i < 3 * N; i++){ this.f[i] = Math.random(); this.v[i] = gauss() * sig; }
  this.normalizeKE(T);
  this.flash.length = 0;
};
Gas.prototype.normalizeKE = function(T){
  let ke = 0;
  for (let i = 0; i < 3 * this.N; i++) ke += this.v[i] * this.v[i];
  ke *= 0.5 * this.mass;
  if (ke <= 0) return;
  const s = Math.sqrt(1.5 * this.N * KB * T / ke);
  for (let i = 0; i < 3 * this.N; i++) this.v[i] *= s;
};
/* 描く分子の数だけを変える．いまいる分子はそのまま残し，
   足りない分を Maxwell 分布から足す（多すぎる分は後ろから捨てる）．
   全部振り直すと，体積を変えたときに分子が一瞬で瞬間移動して見えてしまう． */
Gas.prototype.resizeN = function(N, T){
  if (N === this.N || N < 1) return;
  const f = new Float64Array(3 * N), v = new Float64Array(3 * N);
  const keep = Math.min(N, this.N);
  f.set(this.f.subarray(0, 3 * keep));
  v.set(this.v.subarray(0, 3 * keep));
  const sig = Math.sqrt(KB * T / this.mass);
  for (let i = 3 * keep; i < 3 * N; i++){ f[i] = Math.random(); v[i] = gauss() * sig; }
  this.f = f; this.v = v; this.N = N; this.T = T;
  this.next = new Int32Array(N);
  this.normalizeKE(T);
};

/* 熱浴につないで温度を変える．全員を同じ倍率 √(T′/T) 倍するだけなので，
   Maxwell 分布の「形」は崩れない（分布の幅だけが変わる） */
Gas.prototype.setT = function(T){
  if (!this.N || T <= 0) return;
  const s = Math.sqrt(T / this.T);
  for (let i = 0; i < 3 * this.N; i++) this.v[i] *= s;
  this.T = T;
};
/* 速さだけ全員そろえる（向きはそのまま）．エネルギーは変えない */
Gas.prototype.uniformSpeed = function(){
  const vr = Math.sqrt(3 * KB * this.T / this.mass);
  for (let i = 0; i < this.N; i++){
    const s = Math.hypot(this.v[3*i], this.v[3*i+1], this.v[3*i+2]);
    if (s < 1e-12) continue;
    const k = vr / s;
    this.v[3*i] *= k; this.v[3*i+1] *= k; this.v[3*i+2] *= k;
  }
};
/* 実際の（標本の）温度．エネルギーが保存しているかの確認に使う */
Gas.prototype.tempOf = function(){
  let ke = 0;
  for (let i = 0; i < 3 * this.N; i++) ke += this.v[i] * this.v[i];
  return this.mass * ke / (3 * this.N * KB);
};

/* dt [s]（物理時間）だけ進める．dtWall は画面上の経過時間で，壁の跡を消すのに使う */
Gas.prototype.step = function(dt, flashRate, dtWall){
  const N = this.N, f = this.f, v = this.v;
  const L = [this.Lx, this.Ly, this.Lz];
  let J = 0, hits = 0;
  for (let i = 0; i < N; i++){
    for (let d = 0; d < 3; d++){
      const k = 3*i + d;
      f[k] += v[k] * dt / L[d];
      if (f[k] < 0 || f[k] > 1){
        if (f[k] < 0) f[k] = Math.min(1, -f[k]); else f[k] = Math.max(0, 2 - f[k]);
        v[k] = -v[k];
        J += 2 * this.mass * Math.abs(v[k]);
        hits++;
        if (flashRate > 0 && Math.random() < flashRate && this.flash.length < 160){
          this.flash.push({ x:f[3*i], y:f[3*i+1], z:f[3*i+2], a:1,
                            s:Math.min(2.4, Math.abs(v[k]) / Math.sqrt(KB*this.T/this.mass)) });
        }
      }
    }
  }
  if (this.doColl) this.collisions();
  /* 壁の跡を薄くしていく（画面の時間で 0.42 秒かけて消える） */
  const fade = (dtWall || 0.016) / 0.42;
  for (let i = this.flash.length - 1; i >= 0; i--){
    this.flash[i].a -= fade;
    if (this.flash[i].a <= 0) this.flash.splice(i, 1);
  }
  this.impulse = J; this.hits = hits;
  return J;
};

/* 剛体球どうしの弾性衝突．一様格子で近傍だけ見る（O(N)）．
   運動量もエネルギーも厳密に保存する ―― だから熱浴を毎フレーム当てる必要がない． */
Gas.prototype.collisions = function(){
  const N = this.N, f = this.f, v = this.v;
  const Lx = this.Lx, Ly = this.Ly, Lz = this.Lz;
  const rm = this.radFrac() * Ly, D = 2 * rm, D2 = D * D;
  const ncx = this.ncx, head = this.head, next = this.next;
  head.fill(-1);
  const cell = function(i){
    let cx = (f[3*i]   * ncx) | 0, cy = (f[3*i+1] * NCY) | 0, cz = (f[3*i+2] * NCY) | 0;
    if (cx < 0) cx = 0; else if (cx >= ncx) cx = ncx - 1;
    if (cy < 0) cy = 0; else if (cy >= NCY) cy = NCY - 1;
    if (cz < 0) cz = 0; else if (cz >= NCY) cz = NCY - 1;
    return (cx * NCY + cy) * NCY + cz;
  };
  for (let i = 0; i < N; i++){ const c = cell(i); next[i] = head[c]; head[c] = i; }
  for (let i = 0; i < N; i++){
    let cx = (f[3*i] * ncx) | 0, cy = (f[3*i+1] * NCY) | 0, cz = (f[3*i+2] * NCY) | 0;
    if (cx < 0) cx = 0; else if (cx >= ncx) cx = ncx - 1;
    if (cy < 0) cy = 0; else if (cy >= NCY) cy = NCY - 1;
    if (cz < 0) cz = 0; else if (cz >= NCY) cz = NCY - 1;
    for (let ax = -1; ax <= 1; ax++){
      const bx = cx + ax; if (bx < 0 || bx >= ncx) continue;
      for (let ay = -1; ay <= 1; ay++){
        const by = cy + ay; if (by < 0 || by >= NCY) continue;
        for (let az = -1; az <= 1; az++){
          const bz = cz + az; if (bz < 0 || bz >= NCY) continue;
          for (let j = head[(bx * NCY + by) * NCY + bz]; j >= 0; j = next[j]){
            if (j <= i) continue;
            const dx = (f[3*j]   - f[3*i])   * Lx,
                  dy = (f[3*j+1] - f[3*i+1]) * Ly,
                  dz = (f[3*j+2] - f[3*i+2]) * Lz;
            const r2 = dx*dx + dy*dy + dz*dz;
            if (r2 >= D2 || r2 < 1e-30) continue;
            const r = Math.sqrt(r2), ux = dx/r, uy = dy/r, uz = dz/r;
            const vn = (v[3*j] - v[3*i]) * ux + (v[3*j+1] - v[3*i+1]) * uy + (v[3*j+2] - v[3*i+2]) * uz;
            if (vn >= 0) continue;                    /* すでに離れつつあるなら弾かない */
            v[3*i]   += vn*ux; v[3*i+1] += vn*uy; v[3*i+2] += vn*uz;
            v[3*j]   -= vn*ux; v[3*j+1] -= vn*uy; v[3*j+2] -= vn*uz;
          }
        }
      }
    }
  }
};

/* 速さのヒストグラム（Maxwell 分布と比べるため） */
Gas.prototype.speedHist = function(nb, vmax){
  const h = new Float64Array(nb), N = this.N;
  for (let i = 0; i < N; i++){
    const s = Math.hypot(this.v[3*i], this.v[3*i+1], this.v[3*i+2]);
    let b = Math.floor(s / vmax * nb);
    if (b >= nb) b = nb - 1;
    if (b >= 0) h[b]++;
  }
  const w = vmax / nb;
  for (let i = 0; i < nb; i++) h[i] /= N * w;          /* 確率密度に直す */
  return h;
};

/* ========================================================================
   6. 箱の描画
   ------------------------------------------------------------------------
   3 次元の箱を斜投影（cabinet 図法）で描く．奥行きは右上へずらし，
   奥のものほど小さく淡く描いて手前と区別する．
   ======================================================================== */
/* 箱の置き場所は呼び出し側で決めて opt で渡す
   （②では体積に比例して幅が変わるので，Sim 側でないと決められない）
     opt = { x0, y0, fw, fh, dep, ghostW, piston, showFixed, label, order } */
function drawBox(c, W, H, gas, opt){
  c.clearRect(0, 0, W, H);
  const dep = opt.dep, x0 = opt.x0, y0 = opt.y0, fw = opt.fw, fh = opt.fh;

  /* --- もとの体積の輪郭（定圧のとき） --- */
  if (opt.ghostW && Math.abs(opt.ghostW - fw) > 1.5){
    c.save();
    c.setLineDash([5, 4]); c.strokeStyle = '#b0bec5'; c.lineWidth = 1.4;
    c.strokeRect(x0, y0, opt.ghostW, fh);
    c.restore();
    /* 箱の実寸ラベルと同じ行に置くとぶつかるので，枠の内側の下端に書く */
    c.fillStyle = '#90a4ae'; c.font = '10px ' + CFONT; c.textAlign = 'center';
    c.fillText('はじめの体積', x0 + opt.ghostW / 2, y0 + fh - 7);
  }

  /* --- 奥の面と稜線 --- */
  const bx = x0 + dep, by = y0 - dep;
  c.strokeStyle = 'rgba(55,71,79,.22)'; c.lineWidth = 1;
  c.strokeRect(bx, by, fw, fh);
  c.beginPath();
  c.moveTo(x0, y0);           c.lineTo(bx, by);
  c.moveTo(x0 + fw, y0);      c.lineTo(bx + fw, by);
  c.moveTo(x0, y0 + fh);      c.lineTo(bx, by + fh);
  c.moveTo(x0 + fw, y0 + fh); c.lineTo(bx + fw, by + fh);
  c.stroke();

  /* --- 壁を叩いた跡（奥のぶん） --- */
  const px = function(fx, fy, fz){
    return [x0 + fx * fw + fz * dep, y0 + (1 - fy) * fh - fz * dep];
  };
  const flashes = gas.flash;
  /* 跡の大きさは箱の大きさに合わせる（スマートフォンで大きくなりすぎないように） */
  const fsc = Math.max(0.42, Math.min(1.1, fh / 430));
  for (let i = 0; i < flashes.length; i++){
    const q = flashes[i], p = px(q.x, q.y, q.z);
    c.beginPath();
    c.arc(p[0], p[1], (2 + 9 * (1 - q.a) * (0.5 + 0.5 * q.s)) * fsc, 0, 6.2832);
    c.strokeStyle = 'rgba(216,67,21,' + (q.a * 0.5).toFixed(3) + ')';
    c.lineWidth = 1.4; c.stroke();
  }

  /* --- 分子．奥のものから描く --- */
  const N = gas.N, f = gas.f, v = gas.v;
  const vp = Math.sqrt(2 * KB * gas.T / gas.mass);
  /* 描く半径は衝突半径とそろえる（円が触れた瞬間に弾むように見える）．
     数が増えると半径が小さくなるので，点で埋まらずに済むという利点もある．
     箱を大きくすると奥行きが増えて見通す気体の量が増えるぶん，
     投影した絵は正しく混んで見える． */
  const rBase = Math.max(1.4, gas.radFrac() * fh);
  const order = opt.order;
  if (!order || order.length !== N){
    opt.order = new Int32Array(N);
    for (let i = 0; i < N; i++) opt.order[i] = i;
  }
  const ord = opt.order;
  /* 奥行きでざっくり並べ替える（挿入ソート．ほぼ整列済みなので速い） */
  for (let a = 1; a < N; a++){
    const key = ord[a], kz = f[3*key+2];
    let b = a - 1;
    while (b >= 0 && f[3*ord[b]+2] < kz){ ord[b+1] = ord[b]; b--; }
    ord[b+1] = key;
  }
  /* fz = 0 が手前（視点に近い）．手前ほど大きく，はっきり描く */
  for (let a = 0; a < N; a++){
    const i = ord[a], fz = f[3*i+2];
    const p = px(f[3*i], f[3*i+1], fz);
    const s = Math.hypot(v[3*i], v[3*i+1], v[3*i+2]);
    const r = rBase * (1.12 - 0.40 * fz);
    c.globalAlpha = 1 - 0.42 * fz;
    c.fillStyle = speedColor(s / vp);
    c.beginPath(); c.arc(p[0], p[1], r, 0, 6.2832); c.fill();
  }
  c.globalAlpha = 1;

  /* --- 正面の枠 --- */
  c.strokeStyle = 'rgba(55,71,79,.55)'; c.lineWidth = 1.6;
  c.strokeRect(x0, y0, fw, fh);

  /* --- 右の壁（ピストン or 固定壁） --- */
  const wx = x0 + fw;
  if (opt.piston){
    c.fillStyle = '#8d6e63';
    c.beginPath();
    c.moveTo(wx, y0); c.lineTo(wx + dep, y0 - dep);
    c.lineTo(wx + dep, y0 - dep + fh); c.lineTo(wx, y0 + fh);
    c.closePath(); c.fill();
    c.fillRect(wx - 3, y0, 4, fh);
    /* ピストンの軸と，外から押している圧力の矢印 */
    c.strokeStyle = '#8d6e63'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(wx + dep, y0 - dep + fh/2); c.lineTo(W - 4, y0 - dep + fh/2); c.stroke();
    c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'right';
    c.fillText('P 一定', W - 5, y0 - dep + fh/2 - 6);
  } else {
    c.fillStyle = 'rgba(55,71,79,.75)';
    c.beginPath();
    c.moveTo(wx, y0); c.lineTo(wx + dep, y0 - dep);
    c.lineTo(wx + dep, y0 - dep + fh); c.lineTo(wx, y0 + fh);
    c.closePath(); c.fill();
    if (opt.showFixed){
      c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
      c.fillText('固定壁（V 一定）', wx + dep + 6, y0 - dep + fh / 2 + 4);
    }
  }

  /* --- 目盛り（箱の実寸） --- */
  if (opt.label){
    c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
    c.fillText(opt.label, x0 + 2, y0 + fh + 11);
  }
  return { x0:x0, y0:y0, fw:fw, fh:fh, dep:dep };
}

/* ------------------------------------------------------------------------
   Maxwell の速さ分布
   ------------------------------------------------------------------------ */
function drawMaxwell(c, x0, y0, W, H, gas, g, T){
  /* 右端の目盛りラベルは中央そろえなので，pr を狭くすると切れる */
  const pl = 40, pr = 22, pt = 16, pb = 32;
  const ax0 = x0 + pl, ay0 = y0 + pt, ax1 = x0 + W - pr, ay1 = y0 + H - pb;
  const vmax = 3.1 * vProb(g, T);
  const nb = 28, h = gas.speedHist(nb, vmax);
  /* 縦軸の上限は理論分布の山の 1.55 倍にとる（実測が飛び出しても収まるように） */
  const fmax = maxwell(g, T, vProb(g, T)) * 1.55;
  const X = function(v){ return ax0 + v / vmax * (ax1 - ax0); };
  const Y = function(f){ return ay1 - Math.min(1, f / fmax) * (ay1 - ay0); };

  axes(c, ax0, ay0, ax1, ay1, 'v [m/s]');
  ylabel(c, ax0 - 4, 0, ay0, ay1, 'f(v)', x0 + 11);

  /* 実測のヒストグラム */
  const bw = (ax1 - ax0) / nb;
  c.fillStyle = 'rgba(15,76,129,.30)';
  for (let i = 0; i < nb; i++){
    const yy = Y(h[i]);
    if (ay1 - yy > 0.4) c.fillRect(ax0 + i * bw + 0.5, yy, bw - 1, ay1 - yy);
  }
  /* Maxwell の理論曲線 */
  c.strokeStyle = '#d84315'; c.lineWidth = 2; c.beginPath();
  for (let i = 0; i <= 160; i++){
    const v = vmax * i / 160, yy = Y(maxwell(g, T, v));
    if (i === 0) c.moveTo(X(v), yy); else c.lineTo(X(v), yy);
  }
  c.stroke();
  /* 代表的な速さ．3 本は近いので，ラベルは高さをずらして重ならないようにする */
  const marks = [[vProb(g,T), 'v_p', 0], [vMean(g,T), 'v̄', 1], [vRms(g,T), 'v_rms', 2]];
  c.setLineDash([3, 3]); c.lineWidth = 1;
  c.font = '9px ' + CFONT; c.textAlign = 'center';
  for (let i = 0; i < marks.length; i++){
    const xx = X(marks[i][0]);
    if (xx > ax1 - 2) continue;
    const ly = ay0 + 7 + marks[i][2] * 10;
    c.strokeStyle = 'rgba(31,35,40,.34)';
    c.beginPath(); c.moveTo(xx, ly + 2); c.lineTo(xx, ay1); c.stroke();
    c.fillStyle = '#5c6670';
    c.fillText(marks[i][1], xx, ly);
  }
  c.setLineDash([]);
  /* 横軸の目盛り */
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  for (let i = 0; i <= 3; i++){
    const v = vmax * i / 3;
    c.fillText(String(Math.round(v)), X(v), ay1 + 11);
  }
  c.textAlign = 'left';
  c.fillStyle = '#15202b'; c.font = 'bold 10px ' + CFONT;
  c.fillText('速さの分布（棒 = 実測 / 線 = Maxwell）', ax0, y0 + 10);
}

/* ------------------------------------------------------------------------
   測った圧力の推移
   ------------------------------------------------------------------------ */
function drawPTrace(c, x0, y0, W, H, trace, ideal){
  const pl = 62, pr = 8, pt = 16, pb = 32;
  const ax0 = x0 + pl, ay0 = y0 + pt, ax1 = x0 + W - pr, ay1 = y0 + H - pb;
  axes(c, ax0, ay0, ax1, ay1, '時間 →');
  const lo = 0.7, hi = 1.3;                        /* nRT/V に対する比で描く */
  const Y = function(r){ return ay1 - (Math.max(lo, Math.min(hi, r)) - lo) / (hi - lo) * (ay1 - ay0); };

  /* nRT/V の線 */
  c.strokeStyle = '#d84315'; c.lineWidth = 1.6; c.setLineDash([5, 3]);
  c.beginPath(); c.moveTo(ax0, Y(1)); c.lineTo(ax1, Y(1)); c.stroke();
  c.setLineDash([]);
  c.fillStyle = '#d84315'; c.font = '9px ' + CFONT; c.textAlign = 'right';
  c.fillText('nRT/V', ax1 - 3, Y(1) - 4);

  /* 実測 */
  const n = trace.length;
  if (n > 1){
    c.strokeStyle = '#0f4c81'; c.lineWidth = 1.8; c.beginPath();
    for (let i = 0; i < n; i++){
      const xx = ax0 + i / (trace.cap - 1) * (ax1 - ax0);
      if (i === 0) c.moveTo(xx, Y(trace.at(i))); else c.lineTo(xx, Y(trace.at(i)));
    }
    c.stroke();
  }
  /* 縦軸の目盛り */
  const tw = yTicks(c, [0.8, 0.9, 1.0, 1.1, 1.2].map(function(r){
    return [fmt(ideal * r, 3), r];
  }), ax0 - 4, Y);
  ylabel(c, ax0 - 4, tw, ay0, ay1, 'P [Pa]', x0 + 11);
  c.textAlign = 'left';
  c.fillStyle = '#15202b'; c.font = 'bold 10px ' + CFONT;
  c.fillText('力積から測った圧力', x0 + 6, y0 + 10);
}

/* 一定長のリングバッファ */
function Ring(cap){
  this.cap = cap; this.buf = new Float64Array(cap); this.n = 0; this.i = 0;
}
Object.defineProperty(Ring.prototype, 'length', { get: function(){ return this.n; } });
Ring.prototype.push = function(v){
  this.buf[this.i] = v; this.i = (this.i + 1) % this.cap;
  if (this.n < this.cap) this.n++;
};
Ring.prototype.at = function(k){
  return this.buf[(this.i - this.n + k + this.cap * 2) % this.cap];
};
Ring.prototype.clear = function(){ this.n = 0; this.i = 0; };

/* ------------------------------------------------------------------------
   P–V 図
   ------------------------------------------------------------------------ */
function drawPV(c, x0, y0, W, H, st){
  const pl = 68, pr = 26, pt = 16, pb = 34;
  const ax0 = x0 + pl, ay0 = y0 + pt, ax1 = x0 + W - pr, ay1 = y0 + H - pb;
  const Vmax = st.Vmax, Pmax = st.Pmax;
  const X = function(V){ return ax0 + Math.max(0, Math.min(1, V / Vmax)) * (ax1 - ax0); };
  const Y = function(P){ return ay1 - Math.max(0, Math.min(1, P / Pmax)) * (ay1 - ay0); };

  axes(c, ax0, ay0, ax1, ay1, 'V [m³]');

  /* 等温線（薄く）．PV = nRT なので双曲線になる */
  c.strokeStyle = 'rgba(31,35,40,.13)'; c.lineWidth = 1;
  for (let k = 1; k <= 4; k++){
    const T = st.T1 * k * 0.7;
    c.beginPath();
    let pen = false;
    for (let i = 0; i <= 90; i++){
      const V = Vmax * (0.03 + 0.97 * i / 90), P = st.n * RG * T / V;
      if (P > Pmax){ pen = false; continue; }
      const xx = X(V), yy = Y(P);
      if (!pen){ c.moveTo(xx, yy); pen = true; } else c.lineTo(xx, yy);
    }
    c.stroke();
  }

  /* 仕事の面積（定圧のときだけ意味がある） */
  if (st.iso === 'P' && Math.abs(st.V2 - st.V1) > 1e-18){
    const xa = X(Math.min(st.V1, st.V2)), xb = X(Math.max(st.V1, st.V2));
    c.fillStyle = 'rgba(46,125,50,.16)';
    c.fillRect(xa, Y(st.P1), xb - xa, ay1 - Y(st.P1));
    c.fillStyle = '#2e7d32'; c.font = 'bold 10px ' + CFONT; c.textAlign = 'center';
    if (xb - xa > 34) c.fillText('W = PΔV', (xa + xb) / 2, (Y(st.P1) + ay1) / 2 + 3);
  }

  /* 経路 */
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(X(st.V1), Y(st.P1)); c.lineTo(X(st.V2), Y(st.P2)); c.stroke();
  /* 向きの矢印 */
  const mx = (X(st.V1) + X(st.V2)) / 2, my = (Y(st.P1) + Y(st.P2)) / 2;
  const dx = X(st.V2) - X(st.V1), dy = Y(st.P2) - Y(st.P1), dl = Math.hypot(dx, dy);
  if (dl > 10){
    const ux = dx / dl, uy = dy / dl;
    c.fillStyle = '#0f4c81'; c.beginPath();
    c.moveTo(mx + ux * 6, my + uy * 6);
    c.lineTo(mx - ux * 4 + uy * 4, my - uy * 4 - ux * 4);
    c.lineTo(mx - ux * 4 - uy * 4, my - uy * 4 + ux * 4);
    c.closePath(); c.fill();
  }
  /* 端点 */
  const pt2 = function(V, P, col, lab){
    c.fillStyle = col;
    c.beginPath(); c.arc(X(V), Y(P), 4.2, 0, 6.2832); c.fill();
    c.fillStyle = '#15202b'; c.font = 'bold 10px ' + CFONT; c.textAlign = 'left';
    c.fillText(lab, X(V) + 6, Y(P) - 5);
  };
  pt2(st.V1, st.P1, '#90a4ae', '① はじめ');
  pt2(st.V2, st.P2, '#0f4c81', '② いま');

  /* 目盛り */
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  for (let i = 1; i <= 3; i++) c.fillText(fmt(Vmax * i / 3, 2), X(Vmax * i / 3), ay1 + 12);
  const tw = yTicks(c, [1, 2, 3].map(function(i){ return [fmt(Pmax * i / 3, 3), Pmax * i / 3]; }), ax0 - 4, Y);
  ylabel(c, ax0 - 4, tw, ay0, ay1, 'P [Pa]', x0 + 11);
  c.textAlign = 'left';
  c.fillStyle = '#15202b'; c.font = 'bold 10px ' + CFONT;
  c.fillText('P–V 図（薄い曲線は等温線）', x0 + 6, y0 + 10);
}

/* ------------------------------------------------------------------------
   第一法則の棒グラフ  ΔU = Q − W
   ------------------------------------------------------------------------ */
function drawFirstLaw(c, x0, y0, W, H, b){
  /* 左に広くとる ―― 「ΔU 内部エネルギー」まで書くと隣の P–V 図にはみ出すため */
  const pl = 108, pr = 60, pt = 20, pb = 16;
  const ax0 = x0 + pl, ay0 = y0 + pt, ax1 = x0 + W - pr, ay1 = y0 + H - pb;
  const m = Math.max(Math.abs(b.Q), Math.abs(b.W), Math.abs(b.dU), 1e-12) * 1.18;
  const zero = (ax0 + ax1) / 2;
  const X = function(v){ return zero + v / m * (ax1 - ax0) / 2; };

  c.fillStyle = '#15202b'; c.font = 'bold 10px ' + CFONT; c.textAlign = 'left';
  c.fillText('第一法則  ΔU = Q − W', x0 + 8, y0 + 10);

  const rows = [
    ['Q  加えた熱',       b.Q,  '#e65100'],
    ['W  気体がした仕事', b.W,  '#2e7d32'],
    ['ΔU 内部エネルギー', b.dU, '#5e35b1']
  ];
  const bh = Math.min(20, (ay1 - ay0 - 16) / 3);
  const gap = (ay1 - ay0 - bh * 3) / 2;
  for (let i = 0; i < rows.length; i++){
    const yy = ay0 + i * (bh + gap);
    c.fillStyle = '#5c6670'; c.font = '9.5px ' + CFONT; c.textAlign = 'right';
    c.fillText(rows[i][0], ax0 - 4, yy + bh / 2 + 3);
    const xv = X(rows[i][1]);
    c.fillStyle = rows[i][2];
    c.fillRect(Math.min(zero, xv), yy, Math.abs(xv - zero), bh);
    c.fillStyle = '#15202b'; c.font = '9.5px ' + CFONT; c.textAlign = 'left';
    c.fillText(fmtd(rows[i][1], 3) + ' J', ax1 + 4, yy + bh / 2 + 3);
  }
  /* 0 の線 */
  c.strokeStyle = 'rgba(31,35,40,.4)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(zero, ay0 - 3); c.lineTo(zero, ay1); c.stroke();
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  c.fillText('0', zero, ay1 + 11);
}

/* ========================================================================
   7. パネルの組み立て
   ======================================================================== */
const app = document.getElementById('qsim');

/* ①で箱を画面にどう描くか．
   ------------------------------------------------------------------------
   画面上の一辺を体積の 3 乗根に比例させる．1 L のとき枠の 50 %，
   8 L で枠いっぱい，約 14 mL で下限．体積にして 580 倍の範囲を追える．

   このとき<b>描く分子の数は，本物の分子数 N に比例させる</b>のが肝心．

     描く数 ∝ （画面の箱の体積）×（数密度 N/V） ∝ occ³ × P/(k_B T)

   こうしておくと，T・P・V・n のどれを動かしても<b>画面の混み具合が実際の数密度と一致する</b>．
   ・V を 2 倍（T, P そのまま）… n も 2 倍，箱も 2 倍 ⇒ 混み具合は変わらない
   ・n を 2 倍（T, V そのまま）… P も 2 倍，箱はそのまま ⇒ 点が 2 倍に増える
   ・T を 2 倍（P, V そのまま）… n は半分 ⇒ 点が半分に減る
   箱だけ広げて点の数を据え置くと「膨らませると薄くなる」という嘘の絵になり，
   読み取り値の数密度とも食い違ってしまう． */
const V_ANCHOR   = 1e-3;   /* 基準の体積 1 L */
const T_ANCHOR   = 300;    /* 基準の温度 300 K */
const ND_ANCHOR  = ATM / (KB * T_ANCHOR);   /* 基準の数密度（1 気圧・300 K）[1/m³] */
const OCC_ANCHOR = 0.50;   /* そのときに描ける最大の何割を占めるか（上へ 8 倍の体積まで伸ばせる） */
const OCC_MIN    = 0.12;
const OCC_MAX    = 1.00;
const NSL_SPAN   = 400;    /* n のつまみが覆う圧力の幅（1/20 気圧 〜 20 気圧） */
const DOTS_MIN   = 30;
/* 上限は「基準 600 個 × 表示できる最大の体積比 8 倍」＝ 4800 を超えるように取る．
   ここで頭打ちすると，いちばん大きい箱だけ画面の密度が薄くなってしまう．
   物理は 4000 個でも 0.95 ms/コマなので余裕がある（重いのは描画のほう）． */
const DOTS_MAX   = 5000;

const CROSS = 2.2;      /* v_rms の分子が箱を 1 回横切るのにかける画面上の秒数 */
const TAU   = 3.0;      /* 圧力を平均する時定数（画面の秒）．
                           短くすると値が数 % 跳ねる．600 個・60 コマ/秒で
                           この時定数だと，平均に入る壁との衝突が約 1100 回になる */

function Sim(key, root){
  this.key = key;                 /* 'box' | 'process' */
  this.root = root;
  this.gasKey = 'N2';
  /* 教材ページには iframe がいくつも並ぶ．全部がいっせいに動き出すと
     落ち着いて読めないので，止まった状態で開く（読む人が選んで再生する） */
  this.playing = false;
  this.speed = 1;
  this.nDots = 600;

  /* ①の状態 / ②のはじめの状態 */
  this.T = 300; this.P = ATM; this.V = 1e-3;      /* 1 L の箱・1 気圧・300 K */
  this.T1 = 300; this.P1 = ATM; this.V1 = 1e-3;
  this.T2 = 300;
  this.iso = 'V';                 /* 'V' 定積 / 'P' 定圧 */

  this.nMode = 'V';               /* ①：n を変えたとき 'V' 定積 ⇒ P が動く / 'P' 定圧 ⇒ V が動く */
  this.nAnchor = ATM * 1e-3 / (RG * 300);   /* n のつまみの基準（＝等倍の位置） */
  this.dotsRef = 600;             /* ①：基準の状態（1 L・1 気圧・300 K）で描く数 */
  this.dotClamp = 0;              /* +1 = 上限，−1 = 下限に張り付いている */
  this.occCur = null;             /* いま描いている占有率（アニメで追いかける） */
  this.occTarget = null;
  this.occClamp = 0;              /* +1 = 画面上限，−1 = 画面下限 */

  this.gas = new Gas();
  this.gas.doColl = true;
  this.tRef = 300;
  this.Jbar = 0; this.tbar = 0; this.Pmeas = 0;
  this.trace = new Ring(160);
  this.traceT = 0;
  this.flashRate = 0.06;
  this.opt = {};

  this.build();
  this.recompute();
}

/* ------------------------------------------------------------------------
   いまの状態（②では T2 に応じて P・V が動く）
   ------------------------------------------------------------------------ */
Sim.prototype.now = function(){
  const g = gasOf(this.gasKey);
  if (this.key === 'box'){
    const n = this.P * this.V / (RG * this.T);
    return { g:g, n:n, T:this.T, P:this.P, V:this.V };
  }
  const n = this.P1 * this.V1 / (RG * this.T1);
  const T = this.T2;
  const V = this.iso === 'P' ? n * RG * T / this.P1 : this.V1;
  const P = this.iso === 'P' ? this.P1 : n * RG * T / this.V1;
  return { g:g, n:n, T:T, P:P, V:V };
};
Sim.prototype.tRange = function(){
  return [Math.max(20, this.T1 * 0.35), Math.min(6000, this.T1 * 2.6)];
};

/* ①：物質量を指定する．PV = nRT のどこを動かすかは nMode で決まる．
     定積 … V はそのまま，P = nRT/V が動く
     定圧 … P はそのまま，V = nRT/P が動く（箱がふくらむ） */
Sim.prototype.setN = function(n){
  if (!isFinite(n) || n <= 0) return;
  if (this.nMode === 'P') this.V = Math.max(1e-12, Math.min(1e6, n * RG * this.T / this.P));
  else                    this.P = Math.max(1e-3,  Math.min(1e10, n * RG * this.T / this.V));
};

/* T・P・V を直接いじったら，n のつまみの基準を取り直す（つまみが中央へ戻る） */
Sim.prototype.rebaseN = function(){ this.nAnchor = this.now().n; };

/* ①：体積 → 画面上の占有率．頭打ちしたかどうかも覚えておく */
Sim.prototype.occOf = function(V){
  const raw = OCC_ANCHOR * Math.cbrt(V / V_ANCHOR);
  this.occClamp = raw > OCC_MAX ? 1 : (raw < OCC_MIN ? -1 : 0);
  return Math.max(OCC_MIN, Math.min(OCC_MAX, raw));
};
/* 描く分子の数 ＝ 基準の数 ×（画面の箱の体積比）×（数密度の比）．
   占有率が頭打ちしたときは，その頭打ち後の値で数えるので画面の密度はずれない． */
Sim.prototype.dotFactor = function(){
  const nd = this.P / (KB * this.T);                      /* 数密度 N/V = P/k_BT */
  return Math.pow(this.occTarget / OCC_ANCHOR, 3) * (nd / ND_ANCHOR);
};
Sim.prototype.autoDots = function(){
  const raw = this.dotsRef * this.dotFactor();
  this.dotClamp = raw > DOTS_MAX ? 1 : (raw < DOTS_MIN ? -1 : 0);
  return Math.max(DOTS_MIN, Math.min(DOTS_MAX, Math.round(raw)));
};
/* ①：画面上の箱の一辺と，それを包む枠の高さ．
   枠を箱にぴったり合わせることで，体積を変えると<b>図そのものが</b>伸び縮みする．
   固定の枠に小さい箱を描くと，余白ばかりで変化が伝わらない． */
Sim.prototype.boxGeom = function(){
  const w = Math.max(240, this.cv.clientWidth || this.root.clientWidth || app.clientWidth || 640);
  const maxSide = Math.min(480, w * (w < 560 ? 0.95 : 0.70));
  const occ = this.occCur !== null ? this.occCur : OCC_ANCHOR;
  const side = Math.max(26, maxSide * occ);
  const dep = Math.max(5, Math.min(34, Math.round(side * 0.12)));
  return { side: side, dep: dep, h: Math.round(side + 28 + dep + 16) };
};

/* ------------------------------------------------------------------------
   組み立て
   ------------------------------------------------------------------------ */
Sim.prototype.build = function(){
  const self = this, isBox = this.key === 'box';
  const lay = el('div', 'layout');
  const left = el('div'), ctrl = el('div', 'controls');
  lay.appendChild(left); lay.appendChild(ctrl);
  this.root.appendChild(lay);

  /* --- 左：箱 --- */
  const st1 = el('div', 'stage');
  this.cv = document.createElement('canvas');
  st1.appendChild(this.cv); left.appendChild(st1);
  this.ctx = this.cv.getContext('2d');

  left.appendChild(el('div', 'legend',
    '<span><i class="dot" style="background:#1565c0"></i>遅い分子</span>' +
    '<span><i class="dot" style="background:#7ec496"></i>ふつう</span>' +
    '<span><i class="dot" style="background:#d84315"></i>速い分子</span>' +
    '<span><i style="background:#d84315"></i>壁を叩いた跡</span>' +
    (isBox ? '' : '<span><i style="background:#8d6e63"></i>ピストン</span>')));

  /* --- ①だけ：測った圧力のバー --- */
  if (isBox){
    const pb = el('div', 'pbar');
    pb.innerHTML =
      '<div class="t"><span>壁への力積から<b class="lbl">測った</b>圧力</span>' +
      '<span><b class="pm">—</b> Pa &nbsp;/&nbsp; <i>nRT</i>/<i>V</i> = <b class="pi">—</b> Pa</span></div>' +
      '<div class="track"><div class="fill"></div><div class="mark"></div></div>' +
      '<div class="sc"><span>0.5×</span><span>一致</span><span>1.5×</span></div>';
    left.appendChild(pb);
    this.pmEl = pb.querySelector('.pm');
    this.piEl = pb.querySelector('.pi');
    this.fillEl = pb.querySelector('.fill');
  }

  /* --- 左：下のグラフ --- */
  const st2 = el('div', 'stage');
  this.cv2 = document.createElement('canvas');
  st2.appendChild(this.cv2); left.appendChild(st2);
  this.ctx2 = this.cv2.getContext('2d');

  this.readout = el('div', 'readout'); left.appendChild(this.readout);
  this.msg = el('div', 'msg'); this.msg.hidden = true; left.appendChild(this.msg);

  /* --- 右：コントロール --- */
  ctrl.appendChild(el('p', 'ctlhead', isBox ? '気体と状態' : '気体と条件'));

  /* 気体 */
  const gf = el('label', 'fld');
  gf.appendChild(el('b', null, '気体'));
  const gsel = document.createElement('select');
  GAS.forEach(function(g){
    const o = document.createElement('option');
    o.value = g.k; o.textContent = g.sym + '（' + g.name + '）';
    gsel.appendChild(o);
  });
  gsel.value = this.gasKey;
  gsel.addEventListener('change', function(){
    self.gasKey = this.value; self.tRef = self.key === 'box' ? self.T : self.T2;
    self.reseed(); self.recompute(); self.draw(); self.updateReadout(); kick();
  });
  gf.appendChild(gsel);
  gf.appendChild(el('span', 'hint', '単原子（He, Ne, Ar）は並進だけ．二原子・直線分子は回転と振動が加わります'));
  ctrl.appendChild(gf);

  /* 数値入力をつくる小道具 */
  const mkNum = function(label, unit, get, set, hint, step){
    const w = el('label', 'fld');
    w.appendChild(el('b', null, label));
    const row = el('div', 'unit');
    const inp = document.createElement('input');
    inp.type = 'number'; inp.autocomplete = 'off'; inp.step = step || 'any';
    inp.value = get();
    inp.addEventListener('change', function(){
      const v = Number(this.value);
      if (!isFinite(v) || v <= 0){ this.classList.add('bad'); return; }
      this.classList.remove('bad');
      set(v);
      this.value = get();
      self.recompute(); self.draw(); self.updateReadout(); kick();
    });
    row.appendChild(inp);
    row.appendChild(el('span', 'u', unit));
    w.appendChild(row);
    if (hint) w.appendChild(el('span', 'hint', hint));
    ctrl.appendChild(w);
    return inp;
  };
  /* よく使う値をすぐ入れられるピル */
  const mkPills = function(items, apply){
    const row = el('div', 'pills');
    items.forEach(function(it){
      const b = el('button', 'pill', it[0]);
      b.type = 'button';
      b.addEventListener('click', function(){
        apply(it[1]);
        self.syncInputs(); self.recompute(); self.draw(); self.updateReadout(); kick();
      });
      row.appendChild(b);
    });
    ctrl.appendChild(row);
    return row;
  };

  if (isBox){
    this.inT = mkNum('温度 T', 'K',   function(){ return self.T; },
      function(v){ self.T = Math.max(1, Math.min(20000, v)); self.applyT(); self.rebaseN(); }, null, 1);
    this.inP = mkNum('圧力 P', 'Pa',  function(){ return self.P; },
      function(v){ self.P = Math.max(1e-3, Math.min(1e10, v)); self.rebaseN(); });
    mkPills([['1 気圧', ATM], ['1 bar', 1e5], ['10 気圧', 10*ATM], ['1/100 気圧', ATM/100]],
      function(v){ self.P = v; self.rebaseN(); });
    this.inV = mkNum('体積 V', 'm³',  function(){ return self.V; },
      function(v){ self.V = Math.max(1e-12, Math.min(1e6, v)); self.rebaseN(); });
    mkPills([['1 L', 1e-3], ['1 m³', 1], ['22.4 L', 22.414e-3]],
      function(v){ self.V = v; self.rebaseN(); });

    /* 物質量．PV = nRT があるので，n を動かせば P か V のどちらかが動く．
       どちらを動かすかを選べるようにした（定積：箱に詰め込む／定圧：風船をふくらます）． */
    this.inN = mkNum('物質量 n', 'mol', function(){ return Number(self.now().n.toPrecision(5)); },
      function(v){ self.setN(v); });

    const nmode = el('div', 'pills');
    this.nModeBtns = [];
    [['定積', 'V', '<i>V</i> 一定 ⇒ <i>P</i> が動く'],
     ['定圧', 'P', '<i>P</i> 一定 ⇒ <i>V</i> が動く']].forEach(function(it){
      const b = el('button', 'pill', it[0] + '<small>' + it[2] + '</small>');
      b.type = 'button';
      b.addEventListener('click', function(){
        self.nMode = it[1]; self.nAnchor = self.now().n;
        self.syncInputs(); self.recompute(); self.draw(); self.updateReadout(); kick();
      });
      nmode.appendChild(b); self.nModeBtns.push(b);
    });
    ctrl.appendChild(nmode);

    const mrow = el('div', 'ctlrow');
    mrow.appendChild(el('span', null, '<i>n</i> を増減'));
    const nsl = document.createElement('input');
    nsl.type = 'range'; nsl.min = '0'; nsl.max = '1000'; nsl.value = '500'; nsl.autocomplete = 'off';
    /* つまみは「基準の何倍にするか」．中央が等倍で，左右それぞれ 20 倍まで */
    nsl.addEventListener('input', function(){
      self.setN(self.nAnchor * Math.pow(NSL_SPAN, Number(this.value) / 1000 - 0.5));
      self.syncInputs(); self.recompute(); self.draw(); self.updateReadout(); kick();
    });
    mrow.appendChild(nsl); ctrl.appendChild(mrow);
    this.nSlider = nsl;
    ctrl.appendChild(el('span', 'hint',
      '<i>PV</i> = <i>nRT</i> があるので，4 つのうち自由に決められるのは<b> 3 つだけ</b>です．' +
      '<b>定積</b>なら箱の大きさはそのままで圧力が上がり（＝同じ容器に詰め込む），' +
      '<b>定圧</b>なら圧力はそのままで箱がふくらみます（＝風船をふくらます）．' +
      'どちらでも<b>描く分子の数は <i>n</i> に比例</b>します'));
  } else {
    /* 条件 */
    const cf = el('label', 'fld');
    cf.appendChild(el('b', null, '条件'));
    const cp = el('div', 'pills');
    this.isoBtns = [];
    [['定積', 'V', 'V 一定・固定壁'], ['定圧', 'P', 'P 一定・ピストン']].forEach(function(it){
      const b = el('button', 'pill', it[0] + '<small>' + it[2] + '</small>');
      b.type = 'button';
      b.addEventListener('click', function(){
        self.iso = it[1];
        self.recompute(); self.draw(); self.updateReadout(); kick();
      });
      cp.appendChild(b); self.isoBtns.push(b);
    });
    cf.appendChild(cp);
    ctrl.appendChild(cf);

    ctrl.appendChild(el('hr', 'sep'));
    ctrl.appendChild(el('p', 'ctlhead', 'はじめの状態 ①'));
    this.inT = mkNum('温度 T₁', 'K',  function(){ return self.T1; },
      function(v){ self.T1 = Math.max(20, Math.min(6000, v));
                   self.T2 = self.T1; self.tRef = self.T1; self.applyT(); }, null, 1);
    this.inP = mkNum('圧力 P₁', 'Pa', function(){ return self.P1; },
      function(v){ self.P1 = Math.max(1e-3, Math.min(1e10, v)); });
    mkPills([['1 気圧', ATM], ['1 bar', 1e5]], function(v){ self.P1 = v; });
    this.inV = mkNum('体積 V₁', 'm³', function(){ return self.V1; },
      function(v){ self.V1 = Math.max(1e-12, Math.min(1e6, v)); });
    mkPills([['1 L', 1e-3], ['1 m³', 1]], function(v){ self.V1 = v; });

    ctrl.appendChild(el('hr', 'sep'));
    ctrl.appendChild(el('p', 'ctlhead', 'いまの温度 ②'));
    const tw = el('div', 'tslider');
    this.tBig = el('div', 'tbig', '300 <small>K</small>');
    tw.appendChild(this.tBig);
    const ti = document.createElement('input');
    ti.type = 'range'; ti.min = '0'; ti.max = '1000'; ti.value = '0'; ti.autocomplete = 'off';
    ti.addEventListener('input', function(){
      const r = self.tRange();
      /* スライダーは 1000 段なので，そのままだと 599.77 K のような半端な値になる．
         読み取り値と見出しがずれて見えるので，きりのよい刻みに丸める */
      const q = (r[1] - r[0]) > 400 ? 1 : 0.1;
      self.T2 = Math.round((r[0] + (r[1] - r[0]) * Number(this.value) / 1000) / q) * q;
      self.applyT(); self.recompute(); self.draw(); self.updateReadout(); kick();
    });
    tw.appendChild(ti);
    this.tSlider = ti;
    tw.appendChild(el('span', 'hint',
      '<b>定積</b>ではピストンが動かないので，温度を上げると<b>圧力</b>が上がります．' +
      '<b>定圧</b>ではピストンが押し出されて<b>体積</b>が増え，そのぶん気体が仕事をします'));
    ctrl.appendChild(tw);
  }

  ctrl.appendChild(el('hr', 'sep'));
  ctrl.appendChild(el('p', 'ctlhead', '見え方'));

  /* 分子の数 */
  const nrow = el('div', 'ctlrow');
  nrow.appendChild(el('span', null, '描く分子'));
  const nin = document.createElement('input');
  /* 上限は DOTS_MAX と合わせる．合わせておかないと，体積を大きくして
     自動で 4000 個になったときにつまみが途中で止まり，触っただけで数が半減してしまう */
  nin.type = 'range'; nin.min = '100'; nin.max = String(DOTS_MAX); nin.step = '50';
  nin.value = String(this.nDots); nin.autocomplete = 'off';
  const nval = el('span', 'val', this.nDots + ' 個');
  nin.addEventListener('input', function(){
    const want = Number(this.value);
    if (want === self.nDots) return;    /* 値が動いていない ⇒ 基準を取り直さない */
    if (self.key === 'box'){
      /* スライダーは「いまの状態で何個描くか」．基準の状態へ換算して覚える */
      self.dotsRef = want / Math.max(1e-9, self.dotFactor());
    } else {
      self.nDots = want; nval.textContent = want + ' 個';
    }
    self.recompute(); self.draw(); self.updateReadout(); kick();
  });
  nrow.appendChild(nin); nrow.appendChild(nval); ctrl.appendChild(nrow);
  this.dotSlider = nin; this.dotLabel = nval;
  if (isBox) ctrl.appendChild(el('span', 'hint',
    '描く数は<b>本物の分子数 <i>N</i> に比例</b>させてあります．' +
    '<i>T</i>・<i>P</i>・<i>V</i>・<i>n</i> のどれを動かしても，' +
    '画面の混み具合が本当の数密度と合うようにしてあります．' +
    'このつまみは全体の細かさ（＝標本の大きさ）を決めます'));

  /* 速さ */
  const srow = el('div', 'ctlrow');
  srow.appendChild(el('span', null, '速さ'));
  const sin = document.createElement('input');
  sin.type = 'range'; sin.min = '10'; sin.max = '300'; sin.value = '100'; sin.autocomplete = 'off';
  /* 速さを変えるとスロー再生の倍率も変わるので，読み取り値も一緒に書き直す */
  sin.addEventListener('input', function(){ self.speed = Number(this.value) / 100; self.updateReadout(); kick(); });
  srow.appendChild(sin); ctrl.appendChild(srow);

  /* 衝突 */
  const cw2 = el('label', 'chk');
  const cin = document.createElement('input');
  cin.type = 'checkbox'; cin.checked = true; cin.autocomplete = 'off';
  cin.addEventListener('change', function(){
    self.gas.doColl = this.checked; self.updateReadout(); kick();
  });
  cw2.appendChild(cin);
  cw2.appendChild(el('span', null, '分子どうしの衝突（弾性衝突）'));
  ctrl.appendChild(cw2);

  /* ボタン */
  const row = el('div', 'btnrow');
  const pb2 = el('button', 'act primary', '▶ 動かす');
  pb2.type = 'button';
  pb2.addEventListener('click', function(){
    self.playing = !self.playing;
    this.textContent = self.playing ? '❚❚ 止める' : '▶ 動かす';
    this.className = self.playing ? 'act primary' : 'act';
    kick();
  });
  row.appendChild(pb2);

  if (isBox){
    const ub = el('button', 'act', '全員を同じ速さにする');
    ub.type = 'button';
    ub.addEventListener('click', function(){
      self.gas.uniformSpeed(); self.draw(); kick();
    });
    row.appendChild(ub);
    const rb = el('button', 'act', '振り直す');
    rb.type = 'button';
    rb.addEventListener('click', function(){
      self.reseed(); self.draw(); kick();
    });
    row.appendChild(rb);
  } else {
    const rb = el('button', 'act', 'はじめの状態に戻す');
    rb.type = 'button';
    rb.addEventListener('click', function(){
      self.T2 = self.T1; self.applyT();
      self.recompute(); self.draw(); self.updateReadout(); kick();
    });
    row.appendChild(rb);
  }
  ctrl.appendChild(row);

  /* 折りたたみ解説 */
  const dt = el('details', 'explain');
  dt.appendChild(el('summary', null, isBox
    ? 'この図の読み方（圧力とは何か，Maxwell 分布はどこから来るか）'
    : 'この図の読み方（なぜ C_P > C_V なのか，エントロピーはどう計算しているか）'));
  dt.appendChild(el('div', 'body', isBox ? BOX_NOTES : PROC_NOTES));
  this.root.appendChild(dt);
};

/* 入力欄を今の値に合わせ直す */
Sim.prototype.syncInputs = function(){
  if (this.key === 'box'){
    /* n から計算した P は 202650.06028477254 のような値になるので，桁を落として見せる
       （内部の this.P は丸めない．n と P の対応が崩れないように） */
    this.inT.value = Number(this.T.toPrecision(6));
    this.inP.value = Number(this.P.toPrecision(6));
    this.inV.value = Number(this.V.toPrecision(6));
    const nNow = this.now().n;
    if (this.inN) this.inN.value = Number(nNow.toPrecision(5));
    if (this.nSlider){
      /* つまみは「基準の何倍か」．範囲の外なら端に寄せる */
      const r = Math.log(nNow / this.nAnchor) / Math.log(NSL_SPAN) + 0.5;
      this.nSlider.value = String(Math.round(Math.max(0, Math.min(1, r)) * 1000));
    }
    if (this.nModeBtns){
      const md = this.nMode;
      this.nModeBtns.forEach(function(b, i){ b.classList.toggle('on', ['V','P'][i] === md); });
    }
  } else {
    this.inT.value = this.T1; this.inP.value = this.P1; this.inV.value = this.V1;
  }
};

/* 熱浴につないで温度を合わせる（Maxwell 分布の形は変えずに幅だけ変える） */
Sim.prototype.applyT = function(){
  const T = this.key === 'box' ? this.T : this.T2;
  if (this.gas.N) this.gas.setT(T);
  /* 画面上の速さが極端になったら，スロー再生の倍率を取り直す */
  const g = gasOf(this.gasKey), r = vRms(g, T) / vRms(g, this.tRef);
  if (r > 3.2 || r < 0.3) this.tRef = T;
  this.Jbar = 0; this.tbar = 0; this.trace.clear();
};

Sim.prototype.reseed = function(){
  const s = this.now();
  const L = Math.cbrt(this.key === 'box' ? s.V : this.V1);
  this.gas.setBox(this.key === 'box' ? L : s.V / (L * L), L, L);
  this.gas.seed(this.nDots, s.g.m, s.T);
  this.tRef = s.T;
  this.Jbar = 0; this.tbar = 0; this.trace.clear();
  this.opt.order = null;
};

/* ------------------------------------------------------------------------
   状態が変わったときの作り直し
   ------------------------------------------------------------------------ */
Sim.prototype.recompute = function(){
  const s = this.now(), g = s.g;

  /* 箱の形．②では正面の高さ・奥行きを V₁ の立方体に固定し，幅だけ体積に比例させる */
  const Lref = Math.cbrt(this.key === 'box' ? s.V : this.V1);
  this.Lref = Lref;
  const Lx = this.key === 'box' ? Lref : s.V / (Lref * Lref);
  this.gas.setBox(Lx, Lref, Lref);

  /* ①：画面上の箱の大きさと，それに見合う分子の数を決める */
  if (this.key === 'box'){
    this.occTarget = this.occOf(s.V);
    if (this.occCur === null) this.occCur = this.occTarget;
    this.nDots = this.autoDots();
    if (this.dotSlider){
      this.dotSlider.value = String(Math.max(100, Math.min(DOTS_MAX, this.nDots)));
      /* 頭打ちしているときは，画面の密度が実際とずれていることを断っておく */
      this.dotLabel.textContent = this.nDots + ' 個'
        + (this.dotClamp > 0 ? '（上限）' : this.dotClamp < 0 ? '（下限）' : '');
    }
    this.syncInputs();          /* n と P は連動するので，入力欄も合わせ直す */
  }

  if (!this.gas.N || this.gas.mass !== g.m) this.reseed();
  else {
    /* 数が変わっても，いまいる分子はそのまま残す（瞬間移動して見えないように） */
    if (this.gas.N !== this.nDots) this.gas.resizeN(this.nDots, s.T);
    this.gas.setT(s.T);
  }

  /* スロー再生の倍率．v_rms の分子が箱を CROSS 秒で横切るように合わせる */
  this.secPerWall = Lref / (vRms(g, this.tRef) * CROSS);

  /* ②：ボタンとスライダーの見た目 */
  if (this.key === 'process'){
    const self = this;
    this.isoBtns.forEach(function(b, i){ b.classList.toggle('on', ['V','P'][i] === self.iso); });
    const r = this.tRange();
    this.T2 = Math.max(r[0], Math.min(r[1], this.T2));
    this.tSlider.value = String(Math.round((this.T2 - r[0]) / (r[1] - r[0]) * 1000));
    this.tBig.innerHTML = Math.round(this.T2) + ' <small>K</small>' +
      (Math.abs(this.T2 - this.T1) > 0.5
        ? ' <small style="color:' + (this.T2 > this.T1 ? '#d84315' : '#1565c0') + '">（' +
          fmtd(this.T2 - this.T1, 3) + ' K）</small>' : '');
  }

  /* 注意書き */
  const n = s.n, N = n * NA, msgs = [];
  const lam = lambdaTh(g, s.T), sep = Math.cbrt(s.V / N);
  /* 判定に使うのは縮退度 NΛ³/V．理想気体からのずれはこれに比例する
     （最低次で PV/Nk_BT = 1 ∓ (NΛ³/V)/2^(5/2)）．
     Λ/間隔 = (NΛ³/V)^(1/3) なので，0.15 は NΛ³/V ≈ 3×10⁻³，ずれ 0.06 % にあたる．
     ここより手前で警告を出すと，室温の H₂ のような完全に古典的な状態まで拾ってしまう． */
  const degen = Math.pow(lam / sep, 3);
  if (lam / sep > 0.15)
    msgs.push('<b>古典近似が怪しい領域です．</b>熱的 de Broglie 波長 λ = ' + fmt(lam*1e12,3) +
      ' pm が分子の平均間隔 ' + fmt(sep*1e12,3) + ' pm に近づき，縮退度 <i>N</i>λ³/<i>V</i> = ' +
      fmt(degen,2) + ' になっています．この式（Sackur–Tetrode）は <i>N</i>λ³/<i>V</i> ≪ 1 の' +
      'ときだけ正しく，この先では量子統計（Bose・Fermi）が要ります．');
  /* 充填率 η から剛体球の第 2 ビリアル補正 Z ≈ 1 + 4η を見積もって，
     「理想気体からどれくらいずれるか」を数字で言う */
  const occ = N * Math.PI / 6 * Math.pow(g.d*1e-12, 3) / s.V;
  if (occ > 3e-3)
    msgs.push('<b>分子の大きさが無視できなくなってきました．</b>分子そのものが体積の ' +
      (occ*100).toFixed(occ > 0.01 ? 1 : 2) + ' % を占めています．剛体球なら ' +
      '<i>PV</i>/<i>Nk</i><sub>B</sub><i>T</i> ≈ 1 + 4<i>η</i> = ' + fmt(1 + 4*occ, 4) +
      ' となり，理想気体から ' + (Math.min(999, 4*occ*100)).toFixed(occ > 0.01 ? 0 : 1) +
      ' % ほどずれます（van der Waals の <i>b</i> にあたる効果）．');
  if (s.T < g.bp)
    msgs.push('<b>実際にはこの温度では気体でいられません．</b>' + g.sym + ' の 1 気圧での' +
      (g.sub ? '昇華点' : '沸点') + 'は ' + g.bp + ' K です．計算は理想気体としてそのまま続けます．');
  if (s.T > 2500 && g.lin)
    msgs.push('<b>この温度では実際には解離が始まります．</b>' + g.sym +
      ' の結合が切れ始めるので，分子のままとした計算は目安です．');
  if (msgs.length){ this.msg.innerHTML = msgs.join('<br>'); this.msg.hidden = false; }
  else this.msg.hidden = true;

  this.resize();
};

/* ------------------------------------------------------------------------
   1 コマ進める
   ------------------------------------------------------------------------ */
/* 1 コマぶん進める．描き直しが要るかどうかを返す．
   箱の大きさのアニメーションは，止めているときでも進める
   （体積を変えた瞬間に絵が固まったままだと，変わったことが伝わらない）． */
Sim.prototype.tick = function(dtWall){
  let need = false;
  this.lastTick = performance.now();
  if (this.occTarget !== null && this.occCur !== null){
    const d = this.occTarget - this.occCur;
    if (Math.abs(d) > 4e-4){
      this.occCur += d * (1 - Math.exp(-dtWall / 0.13));
      need = true;
    } else if (d !== 0){ this.occCur = this.occTarget; need = true; }
  }
  if (this.playing){ this.step(dtWall); need = true; }
  return need;
};

Sim.prototype.step = function(dtWall){
  const s = this.now();
  const dtPhys = dtWall * this.speed * this.secPerWall;
  const hits = Math.max(1, this.gas.hits);
  this.flashRate = Math.max(0, Math.min(0.6, 110 * dtWall / hits));
  const J = this.gas.step(dtPhys, this.flashRate, dtWall * this.speed);

  if (this.key === 'box'){
    /* 指数重み付き平均で「測った圧力」を出す．
       分子・分母を同じ重みで貯めてから割るので，コマ落ちがあっても偏らない */
    const gg = this.gas;
    const A = 2 * (gg.Lx*gg.Ly + gg.Ly*gg.Lz + gg.Lz*gg.Lx);
    const d = Math.exp(-dtWall / TAU);
    this.Jbar = this.Jbar * d + J;
    this.tbar = this.tbar * d + dtPhys;
    const scale = (s.n * NA) / gg.N;
    this.Pmeas = this.tbar > 0 ? this.Jbar / (A * this.tbar) * scale : 0;
    this.traceT += dtWall;
    if (this.traceT > 0.07 && this.tbar > 0){
      this.traceT = 0;
      this.trace.push(this.Pmeas / s.P);
    }
  }
};

/* ------------------------------------------------------------------------
   大きさを合わせる
   ------------------------------------------------------------------------ */
Sim.prototype.resize = function(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const isBox = this.key === 'box';
  const w = Math.max(240, this.cv.clientWidth || this.root.clientWidth || app.clientWidth || 640);
  /* ①は箱の大きさ（＝体積）に枠を合わせる．②は定圧でピストンが伸びるぶんを
     見込んで横長にする（条件を切り替えても枠の高さは変えない．
     切り替えるたびにページが跳ねると読みにくいので）． */
  const h = isBox
    ? Math.max(150, Math.min(620, this.boxGeom().h))
    : Math.min(Math.round(w / 1.85), 520);
  this.cv.width = Math.round(w * dpr); this.cv.height = Math.round(h * dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  this.cw = w; this.ch = h;

  const w2 = Math.max(240, this.cv2.clientWidth || w);
  this.wide2 = w2 >= 520;
  const h2 = this.wide2 ? Math.round(w2 / 2.8) : Math.round(w2 / 1.15);
  this.cv2.width = Math.round(w2 * dpr); this.cv2.height = Math.round(h2 * dpr);
  this.cv2.style.height = h2 + 'px';
  this.ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  this.cw2 = w2; this.ch2 = h2;
};

/* ------------------------------------------------------------------------
   描く
   ------------------------------------------------------------------------ */
Sim.prototype.draw = function(){
  const gg = this.gas;
  /* コマが来ていない（別のタブにいる，requestAnimationFrame が絞られている）ときは
     アニメーションが進まないので，大きさをその場で合わせてしまう．
     そうしないと体積を変えても箱が前の大きさのまま固まって見える． */
  if (this.occTarget !== null && this.occCur !== this.occTarget &&
      (!this.lastTick || performance.now() - this.lastTick > 400)){
    this.occCur = this.occTarget;
  }
  /* ①：アニメーションで箱の大きさが変わったら，枠の高さも追いかける */
  if (this.key === 'box' && Math.abs(this.ch - Math.max(150, Math.min(620, this.boxGeom().h))) > 1){
    this.resize();
  }
  const s = this.now();
  const W = this.cw, H = this.ch, pad = 14;
  const dep = Math.round(Math.min(30, H * 0.13));
  const availW = W - pad * 2 - dep;
  const availH = H - pad * 2 - dep;

  /* 正面の縦横比は箱の Lx : Ly をそのまま使う．
     ①は体積そのものを画面の大きさに反映させ，
     ②は体積が最大になったときでも収まるように高さの上限を先に決める */
  let fh = availH;
  if (this.key === 'box'){
    fh = Math.min(this.boxGeom().side, availW);
  } else {
    const r = this.tRange();
    const Vmax = this.iso === 'P' ? s.n * RG * r[1] / this.P1 : this.V1;
    const LxMax = Vmax / (this.Lref * this.Lref);
    fh = Math.min(fh, availW * this.Lref / LxMax);
  }
  let fw = fh * gg.Lx / gg.Ly;
  if (fw > availW){ const k = availW / fw; fw *= k; fh *= k; }

  /* 奥行きのずらし量は箱の大きさに合わせ直す．
     小さい箱に大きな奥行きが付くと，立方体に見えなくなるため
     （dep は必ず小さくなる側なので，上で確保した場所には収まる） */
  const dep2 = Math.max(5, Math.min(dep, Math.round(fh * 0.12)));

  /* 定圧のときだけ左詰め ―― ピストンが右へ伸びるのを見せるため．
     ①と②の定積は箱が動かないので，真ん中に置く */
  const x0 = (this.key === 'process' && this.iso === 'P')
           ? pad : Math.round((W - fw - dep2) / 2);
  const y0 = Math.round((H - fh - dep2) / 2) + dep2;

  this.opt.x0 = x0; this.opt.y0 = y0; this.opt.fw = fw; this.opt.fh = fh; this.opt.dep = dep2;
  this.opt.piston = this.key === 'process' && this.iso === 'P';
  this.opt.showFixed = this.key === 'process' && this.iso === 'V';
  this.opt.ghostW = this.key === 'process' && this.iso === 'P'
    ? fh * (this.V1 / (this.Lref * this.Lref)) / this.Lref : 0;
  /* 定圧では立方体でなくなるので「一辺」とは書かない．
     ①で画面の表示範囲を超えたときは，そのことも書き添える */
  this.opt.label = (this.key === 'process' && this.iso === 'P')
    ? '高さ・奥行き ' + fmtLen(this.Lref) + '　／　幅 ' + fmtLen(gg.Lx)
    : '箱の一辺 ' + fmtLen(this.Lref) + '（立方体）'
      + (this.key === 'box' && this.occClamp > 0 ? '　― これ以上は画面に入りません' :
         this.key === 'box' && this.occClamp < 0 ? '　― これ以上は小さく描けません' : '');
  drawBox(this.ctx, W, H, gg, this.opt);

  /* 下のグラフ */
  const c = this.ctx2, W2 = this.cw2, H2 = this.ch2;
  c.clearRect(0, 0, W2, H2);
  const halves = this.wide2
    ? [[0, 0, W2 / 2, H2], [W2 / 2, 0, W2 / 2, H2]]
    : [[0, 0, W2, H2 / 2], [0, H2 / 2, W2, H2 / 2]];
  if (this.wide2){
    c.strokeStyle = 'rgba(31,35,40,.10)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(W2 / 2, 8); c.lineTo(W2 / 2, H2 - 8); c.stroke();
  }
  if (this.key === 'box'){
    drawMaxwell(c, halves[0][0], halves[0][1], halves[0][2], halves[0][3], gg, s.g, s.T);
    drawPTrace(c, halves[1][0], halves[1][1], halves[1][2], halves[1][3], this.trace, s.P);
  } else {
    const r = this.tRange();
    const Vhi = this.iso === 'P' ? s.n * RG * r[1] / this.P1 : this.V1;
    const Phi = this.iso === 'P' ? this.P1 : s.n * RG * r[1] / this.V1;
    const stp = {
      n:s.n, T1:this.T1, V1:this.V1, P1:this.P1,
      V2:s.V, P2:s.P, iso:this.iso,
      Vmax: Vhi * 1.22, Pmax: Phi * 1.22
    };
    drawPV(c, halves[0][0], halves[0][1], halves[0][2], halves[0][3], stp);
    drawFirstLaw(c, halves[1][0], halves[1][1], halves[1][2], halves[1][3], this.balance());
  }
};

/* 長さを読みやすい単位で */
function fmtLen(L){
  if (L >= 1)     return fmt(L, 3) + ' m';
  if (L >= 1e-2)  return fmt(L * 1e2, 3) + ' cm';
  if (L >= 1e-3)  return fmt(L * 1e3, 3) + ' mm';
  if (L >= 1e-6)  return fmt(L * 1e6, 3) + ' µm';
  return fmt(L * 1e9, 3) + ' nm';
}

/* ------------------------------------------------------------------------
   ②：第一法則の収支
   ------------------------------------------------------------------------ */
Sim.prototype.balance = function(){
  const s = this.now(), g = s.g, n = s.n;
  const a = stateOf(g, n, this.T1, this.V1);
  const b = stateOf(g, n, s.T, s.V);
  const dU = b.U - a.U, dH = b.H - a.H, dS = b.S - a.S;
  const W = this.iso === 'P' ? this.P1 * (s.V - this.V1) : 0;
  return { dU:dU, dH:dH, dS:dS, W:W, Q:dU + W, a:a, b:b, n:n, g:g };
};

/* ------------------------------------------------------------------------
   読み取り値
   ------------------------------------------------------------------------ */
Sim.prototype.updateReadout = function(){
  const s = this.now(), g = s.g, n = s.n, N = n * NA;
  const R = [];
  const add = function(k, v){ R.push(['<span>' + k + '</span><span>' + v + '</span>', 0]); };
  const addHi = function(k, v){ R.push(['<span>' + k + '</span><span>' + v + '</span>', 1]); };
  const head = function(t){ R.push([t, 2]); };

  if (this.key === 'box'){
    const nd = N / s.V, lam = lambdaTh(g, s.T);
    const lmfp = mfp(g, s.T, nd);
    head('箱の中身');
    add('物質量 <i>n</i> = <i>PV</i>/<i>RT</i>', fmt(n, 4) + ' mol');
    add('分子の数 <i>N</i>', fmt(N, 4) + ' 個');
    add('数密度 <i>N</i>/<i>V</i>', fmt(nd, 4) + ' m⁻³');
    add('箱の一辺', fmtLen(this.Lref));
    head('分子の速さ');
    add('最確速さ <i>v</i><sub>p</sub>', fmt(vProb(g, s.T), 4) + ' m/s');
    add('平均速さ <i>v̄</i>', fmt(vMean(g, s.T), 4) + ' m/s');
    add('二乗平均速さ <i>v</i><sub>rms</sub>', fmt(vRms(g, s.T), 4) + ' m/s');
    add('標本の温度（確認用）', fmt(this.gas.tempOf(), 5) + ' K');
    head('分子どうしの出会い');
    add('平均自由行程 <i>λ</i>', fmtLen(lmfp));
    add('衝突頻度 <i>v̄</i>/<i>λ</i>', fmt(vMean(g, s.T) / lmfp, 3) + ' 回/s');
    add('熱的 de Broglie 波長', fmt(lam * 1e12, 3) + ' pm');
    /* 実際に進む物理時間は dtWall × speed × secPerWall なので，倍率にも speed を入れる */
    add('スロー再生', fmt(1 / (this.speed * this.secPerWall), 3) + ' 分の 1');
  } else {
    const b = this.balance();
    const cvm = cvMolar(g, s.T), cpm = cvm + RG;
    const parts = cvParts(g, s.T);
    head('いまの状態 ②');
    add('温度 <i>T</i>', fmt(s.T, 5) + ' K');
    addHi('圧力 <i>P</i>', fmt(s.P, 5) + ' Pa' + (this.iso === 'P' ? '（一定）' : ''));
    addHi('体積 <i>V</i>', fmt(s.V, 5) + ' m³' + (this.iso === 'V' ? '（一定）' : ''));
    add('物質量 <i>n</i>', fmt(n, 4) + ' mol');
    head('状態量（分配関数から）');
    add('内部エネルギー <i>U</i>', fmt(b.b.U, 5) + ' J');
    add('エンタルピー <i>H</i> = <i>U</i> + <i>PV</i>', fmt(b.b.H, 5) + ' J');
    add('エントロピー <i>S</i>', fmt(b.b.S, 5) + ' J/K');
    add('モルエントロピー <i>S</i><sub>m</sub>', fmt(b.b.S / n, 5) + ' J/(mol·K)');
    if (this.iso === 'V'){
      addHi('定積モル比熱 <i>C</i><sub><i>V</i>,m</sub>', fmt(cvm, 5) + ' J/(mol·K)');
      add('　＝ <i>C</i><sub><i>V</i>,m</sub>/<i>R</i>', fmt(cvm / RG, 4));
      add('　内訳 並進/回転/振動', fmt(parts.tr, 3) + ' / ' + fmt(parts.rot, 3) + ' / ' + fmt(parts.vib, 3));
      add('気体全体の熱容量 <i>nC</i><sub><i>V</i>,m</sub>', fmt(n * cvm, 4) + ' J/K');
    } else {
      addHi('定圧モル比熱 <i>C</i><sub><i>P</i>,m</sub>', fmt(cpm, 5) + ' J/(mol·K)');
      add('　＝ <i>C</i><sub><i>P</i>,m</sub>/<i>R</i>', fmt(cpm / RG, 4));
      add('　内訳 並進/回転/振動/<i>R</i>',
          fmt(parts.tr, 3) + ' / ' + fmt(parts.rot, 3) + ' / ' + fmt(parts.vib, 3) + ' / ' + fmt(RG, 3));
      add('気体全体の熱容量 <i>nC</i><sub><i>P</i>,m</sub>', fmt(n * cpm, 4) + ' J/K');
    }
    add('比熱比 <i>γ</i> = <i>C<sub>P</sub></i>/<i>C<sub>V</sub></i>', fmt(cpm / cvm, 4));
    head('①から②への変化');
    add('Δ<i>T</i>', fmtd(s.T - this.T1, 4) + ' K');
    add('Δ<i>U</i>', fmtd(b.dU, 4) + ' J');
    add('Δ<i>H</i>', fmtd(b.dH, 4) + ' J');
    add('Δ<i>S</i>', fmtd(b.dS, 4) + ' J/K');
    addHi('加えた熱 <i>Q</i>', fmtd(b.Q, 4) + ' J' + (this.iso === 'V' ? '（= Δ<i>U</i>）' : '（= Δ<i>H</i>）'));
    addHi('気体がした仕事 <i>W</i>', fmtd(b.W, 4) + ' J' + (this.iso === 'V' ? '（体積が変わらない）' : '（= <i>P</i>Δ<i>V</i>）'));
    /* 同じ ΔT を与えるのに必要な熱量を，両方の条件で比べる */
    const st1 = stateOf(g, n, this.T1, this.V1);
    const Qv = stateOf(g, n, s.T, this.V1).U - st1.U;
    const Qp = stateOf(g, n, s.T, n * RG * s.T / this.P1).H - st1.H;
    head('同じ Δ<i>T</i> に要る熱を比べる');
    add('定積なら <i>Q<sub>V</sub></i>', fmtd(Qv, 4) + ' J');
    add('定圧なら <i>Q<sub>P</sub></i>', fmtd(Qp, 4) + ' J');
    addHi('差 <i>Q<sub>P</sub></i> − <i>Q<sub>V</sub></i>', fmtd(Qp - Qv, 4) + ' J');
    add('　＝ <i>nR</i>Δ<i>T</i>', fmtd(n * RG * (s.T - this.T1), 4) + ' J');
  }

  this.readout.innerHTML = R.map(function(r){
    if (r[1] === 2) return '<div class="rohead">' + r[0] + '</div>';
    return '<div' + (r[1] ? ' class="hi"' : '') + '>' + r[0] + '</div>';
  }).join('');

  /* ①：測った圧力のバー */
  if (this.key === 'box'){
    const ratio = s.P > 0 ? this.Pmeas / s.P : 0;
    this.pmEl.textContent = this.tbar > 0 ? fmt(this.Pmeas, 4) : '測定中…';
    this.piEl.textContent = fmt(s.P, 4);
    this.fillEl.style.width = (Math.max(0, Math.min(1, (ratio - 0.5) / 1.0)) * 100).toFixed(1) + '%';
  }
};

/* ========================================================================
   8. 動かす
   ======================================================================== */
let rafId = null, last = 0;
const sims = {};
function loop(now){
  /* dt には下限 0 が要る．rAF に渡ってくる時刻が last より前に戻ることがあり
     （kick() の performance.now() とフレーム開始時刻のずれ，スリープからの復帰など），
     dt が負になると粒子が逆走して端で clamp され，縦一列に積み上がってしまう */
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  let busy = false;
  Object.keys(sims).forEach(function(k){
    const s = sims[k];
    if (s.root.hidden) return;
    if (!s.tick(dt)) return;          /* 動いてもいないしアニメも終わっていれば，何もしない */
    s.draw();
    if (s.playing){
      s.roAcc = (s.roAcc || 0) + dt;
      if (s.roAcc > 0.22){ s.roAcc = 0; s.updateReadout(); }  /* 読み取り値は毎コマ書き換えない */
    }
    busy = true;
  });
  rafId = busy ? requestAnimationFrame(loop) : null;
}
function kick(){
  if (rafId === null){ last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ========================================================================
   9. 立ち上げ
   ======================================================================== */
let only = null;
const mm = /[?&]only=(box|process)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');   /* 1 枚だけ ⇒ 押せるタブがないので隠す */

['box', 'process'].forEach(function(key){
  const p = app.querySelector('[data-panel="' + key + '"]');
  if (!p) return;
  if (only && only !== key){ p.parentNode.removeChild(p); return; }
  sims[key] = new Sim(key, p);
});

/* iframe に埋め込まれたとき，親ページへ必要な高さを知らせる．
   selectTab から呼ぶので，タブより前に置いておく（let の巻き上げ対策）． */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let active = only || 'box';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].resize(); sims[name].draw(); sims[name].updateReadout();
  kick();
  postHeight();   /* タブごとに必要な高さが違う */
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].resize(); sims[k].draw(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].recompute(); sims[k].draw(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

kick();

})();
</script>
