<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スリットを通る粒子 ― 単スリット／二重スリット シミュレーター</title><style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります。
   スタイルはすべて #qsim 配下にスコープしてあるので、
   既存ページに <div id="qsim">…</div> ごと貼り付けても衝突しません。
   （直貼りするときは、下の html,body ブロックだけ削除してください）
   ========================================================================== */
html, body { margin:0; background:#fafafa; }

#qsim{
  --bg:#fafafa;
  --panel:#ffffff;
  --panel-soft:#f4f6f9;
  --fg:#1f2328;
  --sub:#5c6670;
  --line:rgba(31,35,40,.12);
  --accent:#0f4c81;
  --accent-strong:#0a355a;
  --accent-soft:#e7eff7;
  --hist:#1565c0;
  --theory:#c62828;
  --dot:#f9a825;
  --speck:#1f2328;
  --warn:#8a5a00;
  --warnbg:#fdf5e3;
  --shadow:0 14px 32px rgba(20,34,51,.08);
  --radius-lg:20px;
  --radius-md:14px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color:var(--fg); font-family:var(--font); line-height:1.7;
  max-width:1120px; margin:0 auto; padding:16px 18px 22px;
  -webkit-text-size-adjust:100%;
}
#qsim *{box-sizing:border-box}
#qsim h1{font-size:1.34rem; line-height:1.3; margin:0 0 4px; color:#15202b; letter-spacing:.01em}
#qsim p{margin:.3em 0}
#qsim .lead{color:var(--sub); font-size:.86rem; margin:0}

/* --- タブ --- */
#qsim .tabs{display:flex; gap:8px; margin:14px 0 14px; flex-wrap:wrap}
#qsim .tab{
  font:inherit; font-size:.92rem; font-weight:700; cursor:pointer;
  padding:8px 18px; border-radius:999px; border:1px solid var(--line);
  background:rgba(255,255,255,.7); color:#15202b;
  transition:background-color .2s ease, color .2s ease, transform .2s ease;
}
#qsim .tab:hover{background:rgba(15,76,129,.10); color:var(--accent-strong); transform:translateY(-1px)}
#qsim .tab.is-active{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .panel[hidden]{display:none}
/* ?only=single / ?only=double で埋め込むとき：見出しとタブを隠す */
#qsim.is-embed{padding-top:6px}
#qsim.is-embed > h1,
#qsim.is-embed > .lead,
#qsim.is-embed > .tabs{display:none}

/* --- 2 カラム：左 = スクリーンの様子 / 右 = パラメーター --- */
#qsim .layout{
  display:grid; grid-template-columns:minmax(0,3fr) minmax(238px,1fr);
  gap:16px; align-items:start;
}
@media (max-width:860px){ #qsim .layout{grid-template-columns:1fr} }

/* --- 右カラム：コントロール --- */
#qsim .controls{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--shadow); padding:13px 14px;
}
#qsim .ctlhead{
  font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--sub); margin:0 0 8px;
}
#qsim .ctlhead + .ctlhead, #qsim .sep + .ctlhead{margin-top:0}
#qsim .sep{height:1px; background:var(--line); margin:13px 0 11px; border:0}
#qsim .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px 12px}
#qsim .fld{display:flex; flex-direction:column; gap:3px; font-size:.78rem; color:var(--sub)}
#qsim .fld b{font-weight:700; color:var(--fg); font-size:.82rem}
#qsim .fld .hint{font-size:.71rem; color:var(--sub); line-height:1.45}
#qsim .inp{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff}
#qsim .inp input{
  font:inherit; font-size:.88rem; width:100%; min-width:0; border:0; outline:0;
  padding:6px 8px; background:transparent; color:var(--fg);
}
#qsim .inp select{
  font:inherit; font-size:.8rem; border:0; border-left:1px solid var(--line);
  background:transparent; color:var(--fg); padding:0 3px; outline:0; cursor:pointer;
}
#qsim .inp:focus-within{border-color:var(--accent); box-shadow:0 0 0 2px rgba(15,76,129,.14)}
#qsim select.wide{
  font:inherit; font-size:.84rem; width:100%; padding:6px 8px; border-radius:9px;
  border:1px solid var(--line); background:#fff; color:var(--fg); cursor:pointer;
}

/* --- ボタン --- */
#qsim .btnrow{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
#qsim button.act{
  font:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.8); color:#15202b;
  padding:7px 10px; border-radius:9px; white-space:nowrap;
  transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
#qsim button.act:hover{border-color:rgba(15,76,129,.5); box-shadow:0 8px 18px rgba(20,34,51,.10); transform:translateY(-1px)}
#qsim button.act.primary{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim button.act.on{background:#b3261e; border-color:#b3261e; color:#fff}
#qsim .b-full{flex:1 1 100%}
#qsim .b-half{flex:1 1 calc(50% - 4px)}
#qsim .ctlrow{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  font-size:.76rem; color:var(--sub); margin-top:9px;
}
#qsim .ctlrow input[type=range]{flex:1 1 84px; min-width:70px; accent-color:var(--accent)}
#qsim .ctlrow .inp{flex:1 1 120px}
#qsim .chk{display:flex; align-items:flex-start; gap:6px; font-size:.75rem;
  color:var(--sub); cursor:pointer; margin-top:10px; line-height:1.45}
#qsim .chk input{accent-color:var(--accent); cursor:pointer; margin-top:3px}

/* --- 左カラム：キャンバス --- */
#qsim .stage{
  border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;
  background:var(--panel); box-shadow:var(--shadow);
}
#qsim canvas{display:block; width:100%; height:auto}
#qsim .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.75rem;
  color:var(--sub); margin:8px 2px 0}
#qsim .legend i{display:inline-block; width:15px; height:3px; border-radius:2px;
  vertical-align:middle; margin-right:5px}

/* --- 読み取り値 --- */
#qsim .readout{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
  gap:0 18px; margin-top:10px; font-size:.76rem;
}
#qsim .readout div{display:flex; justify-content:space-between; gap:10px;
  border-bottom:1px dotted var(--line); padding:3px 0}
#qsim .readout span:first-child{color:var(--sub)}
#qsim .readout span:last-child{font-variant-numeric:tabular-nums; font-weight:700}
#qsim sup{font-size:.72em}

/* --- 数式 --- */
#qsim .eq{
  font-size:.95rem; text-align:center; padding:11px 8px; margin:10px 0 0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  overflow-x:auto; white-space:nowrap;
}
#qsim .frac{display:inline-flex; flex-direction:column; vertical-align:middle;
  text-align:center; margin:0 .25em; font-size:.92em}
#qsim .frac .n{border-bottom:1.2px solid currentColor; padding:0 .35em}
#qsim .frac .d{padding:0 .35em}
#qsim .paren{font-size:2.1em; vertical-align:middle; font-weight:300; line-height:.6}
#qsim i{font-family:"Times New Roman",serif; font-size:1.06em}

/* --- 解説（折りたたみ） --- */
#qsim .explain{
  margin-top:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-md); padding:0 14px;
}
#qsim .explain > summary{
  cursor:pointer; list-style:none; padding:10px 0; font-size:.82rem; font-weight:700;
  color:var(--accent-strong);
}
#qsim .explain > summary::-webkit-details-marker{display:none}
#qsim .explain > summary::before{content:"▶ "; font-size:.72em; color:var(--sub)}
#qsim .explain[open] > summary::before{content:"▼ "}
#qsim .explain[open] > summary{border-bottom:1px solid var(--line)}
#qsim .explain .body{padding:4px 0 12px}
#qsim .note{
  font-size:.78rem; color:var(--sub); background:var(--panel-soft);
  border-left:3px solid var(--line); border-radius:0 8px 8px 0;
  padding:8px 12px; margin:9px 0;
}
#qsim .note.warn{color:var(--warn); background:var(--warnbg); border-left-color:currentColor}
#qsim .note b{color:inherit}
#qsim .foot{margin-top:12px; font-size:.73rem; color:var(--sub); text-align:center}
</style>
</head>
<body>
<div id="qsim">
  <h1>スリットを通る粒子 ― 存在確率分布シミュレーター</h1>
  <p class="lead">
    運動量 <i>p</i> = <i>mv</i> の粒子をスリットに 1 個ずつ飛ばし、スクリーン（平面 A）上のどこに到達するかを見ます。
    右のパラメーターを変えると、到達点の散らばり方がどう変わるかが分かります。
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="single" role="tab">① 単スリット</button>
    <button class="tab" data-tab="double" role="tab">② 二重スリット</button>
  </div>

  <section class="panel" data-panel="single"></section>
  <section class="panel" data-panel="double" hidden></section>

  <p class="foot">
    横軸 = スクリーン（平面 A）上の位置 x、縦軸 = |ψ(x)|<sup>2</sup>（ピーク値 1 で規格化）。
  </p>
</div>

<script>
(function () {
'use strict';

/* ========================================================================
   0. 物理定数
   ======================================================================== */
const H_PLANCK = 6.62607015e-34;          // Planck 定数 [J s]
const HBAR     = H_PLANCK / (2 * Math.PI);
const M_E      = 9.1093837015e-31;        // 電子質量 [kg]
const M_N      = 1.67492749804e-27;       // 中性子質量 [kg]
const U_AMU    = 1.66053906660e-27;       // 原子質量単位 [kg]
const MAX_HITS = 300000;                  // 記録する到達点の上限
const CFONT = '"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';  // canvas 用

/* ========================================================================
   1. 表示ユーティリティ
   ======================================================================== */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³',
             '4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

function supStr(n){ return String(n).split('').map(c => SUP[c] || c).join(''); }

/** HTML 用（×10^n を <sup> で） */
function fmtNum(v, n){
  n = n || 4;
  if (!isFinite(v)) return '&mdash;';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const parts = v.toExponential(n - 1).split('e');
    return parts[0] + '×10<sup>' + Number(parts[1]) + '</sup>';
  }
  return String(Number(v.toPrecision(n)));
}

/** プレーンテキスト用 */
function fmtNumPlain(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const parts = v.toExponential(n - 1).split('e');
    return parts[0] + '×10' + supStr(Number(parts[1]));
  }
  return String(Number(v.toPrecision(n)));
}

const LEN_TBL = [[1e3,'km'],[1,'m'],[1e-3,'mm'],[1e-6,'µm'],
                 [1e-9,'nm'],[1e-12,'pm'],[1e-15,'fm']];

function lenUnit(v){
  const a = Math.abs(v);
  for (let i = 0; i < LEN_TBL.length; i++){ if (a >= LEN_TBL[i][0]) return LEN_TBL[i]; }
  return null;
}
function fmtLen(v, n){          // HTML
  if (!isFinite(v)) return '&mdash;';
  if (v === 0) return '0 m';
  const u = lenUnit(v);
  return u ? String(Number((v / u[0]).toPrecision(n || 4))) + ' ' + u[1]
           : fmtNum(v, n) + ' m';
}
function fmtLenPlain(v, n){     // canvas
  if (!isFinite(v)) return '—';
  if (v === 0) return '0 m';
  const u = lenUnit(v);
  return u ? String(Number((v / u[0]).toPrecision(n || 4))) + ' ' + u[1]
           : fmtNumPlain(v, n) + ' m';
}

/** 目盛りの刻み幅を 1/2/5×10^k に丸める */
function niceStep(raw){
  const e = Math.floor(Math.log10(raw));
  const m = raw / Math.pow(10, e);
  const nm = m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10;
  return nm * Math.pow(10, e);
}

function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/* ========================================================================
   2. 物理モデル
   ---------------------------------------------------------------------
   Fraunhofer（近軸）近似 r ≒ L + x²/2L − xy/L で、望月先生のノートと同じ式：

     単スリット（幅 2a, −a ≦ y ≦ a）
        |ψ(x)|² ∝ ( sin(αx) / (αx) )² ,          α = p a /(ħL)

     二重スリット（a ≦ y ≦ a+b, −a−b ≦ y ≦ −a）
        |ψ(x)|² ∝ ( [sin(β x) − sin(αx)] / (κ b x) )²,  β = p(a+b)/(ħL), κ = p/(ħL)
                 = cos²(κ d x/2) · sinc²(κ b x/2),      d = 2a + b

   規格化積分（解析的に厳密）
        ∫|ψ|²dx ∝ Z_single = λL/(2a),  Z_double = λL/(2b)
   ======================================================================== */
function physics(P, mode){
  const p   = P.m * P.v;
  const lam = H_PLANCK / p;                 // de Broglie 波長
  const kap = p / (HBAR * P.L);             // κ = p/(ħL)
  const o   = { p:p, lam:lam, kap:kap };

  if (mode === 'single'){
    const alpha = kap * P.a;                // α = pa/(ħL)
    o.alpha   = alpha;
    o.w       = Math.PI / alpha;            // 第 1 暗線 = λL/(2a)
    o.Z       = Math.PI / alpha;            // ∫f dx
    o.feature = o.w;                        // 縞（ローブ）の周期
    o.f = function(x){
      const u = alpha * x;
      if (u === 0) return 1;
      const s = Math.sin(u) / u;
      return s * s;
    };
  } else {
    const d = 2 * P.a + P.b;
    const c = kap * P.b / 2;
    o.alpha   = kap * P.a;                  // pa/(ħL)
    o.beta    = kap * (P.a + P.b);          // p(a+b)/(ħL)
    o.d       = d;
    o.w       = Math.PI / c;                // 包絡線の第 1 暗線 = λL/b
    o.Z       = Math.PI / c / 2;            // = λL/(2b)
    o.fringe  = 2 * Math.PI / (kap * d);    // 縞間隔 = λL/d
    o.feature = o.fringe;
    o.f = function(x){
      const z  = c * x;
      const s  = (z === 0) ? 1 : Math.sin(z) / z;
      const co = Math.cos(kap * d * x / 2);
      return s * s * co * co;
    };
  }
  return o;
}

/* --- 棄却法サンプリング -------------------------------------------------
   包絡 f(x) ≦ 1/(1+(x/w)²) を利用し、Cauchy 分布 (尺度 w) を提案分布にする。
   採択率は単スリットで 1/π ≒ 32 %、二重スリットで 1/(2π) ≒ 16 %。
   窓で切らないので、裾まで含めた真の分布から抽出できる。            */
function sampleX(ph){
  const w = ph.w;
  for (let i = 0; i < 400; i++){
    const t  = Math.tan(Math.PI * (Math.random() - 0.5));
    const t2 = t * t;
    if (!isFinite(t2)) continue;
    const env = 1 / (1 + t2);
    if (env <= 0) continue;
    const x = w * t;
    if (!isFinite(x)) continue;
    if (Math.random() * env <= ph.f(x)) return x;
  }
  return 0;
}

/* ========================================================================
   3. プリセット
   ======================================================================== */
const V_E_100V = Math.sqrt(2 * 1.602176634e-19 * 100 / M_E);   // ≒ 5.93×10⁶ m/s

const PRESETS = [
  { name:'① 電子（m = 9.109×10⁻³¹ kg, v = 1.0 m/s）',
    L:1.0, m:M_E, v:1.0, a2:1.0e-3, a:1.0e-3, b:1.0e-3 },
  { name:'② 重い粒（m = 6.626×10⁻³ kg）→ δ関数的',
    L:1.0, m:6.626e-3, v:1.0, a2:1.0e-3, a:1.0e-3, b:1.0e-3 },
  { name:'③ 現実的な電子線（100 V 加速, スリット 200 nm）',
    L:1.0, m:M_E, v:V_E_100V, a2:1.0e-7, a:1.0e-7, b:2.0e-7 },
  { name:'④ 熱中性子（v = 2200 m/s）',
    L:2.0, m:M_N, v:2200, a2:2.0e-7, a:2.0e-7, b:4.0e-7 },
  { name:'⑤ C₆₀ 分子（v = 200 m/s）',
    L:1.25, m:720 * U_AMU, v:200, a2:2.5e-8, a:2.5e-8, b:5.0e-8 },
  { name:'⑥ 野球のボール（145 g, 40 m/s）→ δ関数的',
    L:1.0, m:0.145, v:40, a2:1.0e-3, a:1.0e-3, b:1.0e-3 }
];
// a2 : 単スリットの半幅 a（入力欄には 2a を表示）

/* ========================================================================
   4. 長さ入力（数値 + 単位）
   ======================================================================== */
const UNIT_OPTS = [['m',1],['mm',1e-3],['µm',1e-6],['nm',1e-9],['pm',1e-12]];

function makeLenField(labelHtml, hintHtml){
  const f = el('label','fld');
  f.appendChild(el('b', null, labelHtml));
  const box = el('span','inp');
  const inp = el('input'); inp.type = 'number'; inp.step = 'any';
  const sel = el('select');
  UNIT_OPTS.forEach(function(u){
    const o = el('option', null, u[0]); o.value = String(u[1]); sel.appendChild(o);
  });
  box.appendChild(inp); box.appendChild(sel); f.appendChild(box);
  if (hintHtml) f.appendChild(el('span','hint', hintHtml));
  f.inp = inp; f.sel = sel;
  f.get = function(){ return (parseFloat(inp.value) || 0) * parseFloat(sel.value); };
  f.set = function(meters){
    const u = lenUnit(meters) || [1,'m'];
    let lbl = u[1];
    if (lbl === 'km' || lbl === 'fm') lbl = 'm';              // 選択肢外は m に丸める
    let idx = 0;
    for (let i = 0; i < UNIT_OPTS.length; i++){ if (UNIT_OPTS[i][0] === lbl) idx = i; }
    sel.selectedIndex = idx;
    inp.value = String(Number((meters / UNIT_OPTS[idx][1]).toPrecision(6)));
  };
  return f;
}

function makeNumField(labelHtml, hintHtml, step){
  const f = el('label','fld');
  f.appendChild(el('b', null, labelHtml));
  const box = el('span','inp');
  const inp = el('input'); inp.type = 'number'; inp.step = step || 'any';
  box.appendChild(inp); f.appendChild(box);
  if (hintHtml) f.appendChild(el('span','hint', hintHtml));
  f.inp = inp;
  f.get = function(){ return parseFloat(inp.value) || 0; };
  f.set = function(v){ inp.value = String(Number(v.toPrecision(6))); };
  return f;
}

/* ========================================================================
   5. シミュレーター本体
   ======================================================================== */
function Sim(mode, root){
  const self = this;
  this.mode = mode;
  this.root = root;
  this.hitX = [];        // 到達位置 [m]
  this.hitJ = [];        // 斑点描画用の縦ゆらぎ 0..1
  this.flying = [];      // 飛行中の粒子
  this.N = 0;            // 総発射数
  this.running = false;
  this.speed = 2;
  this.manualRange = false;   // 表示範囲を手入力したか
  this.zAnchorX = 0;          // ズームスライダーを掴んだ時点の表示範囲
  this.emitAcc = 0;
  this.dpr = Math.min(window.devicePixelRatio || 1, 2);

  /* ---------- UI 構築：左 = スクリーンの様子／右 = パラメーター ---------- */
  const layout  = el('div','layout');
  const colMain = el('div','col-main');
  const colSide = el('aside','col-side');
  layout.appendChild(colMain); layout.appendChild(colSide);
  root.appendChild(layout);

  /* === 左カラム：キャンバス・凡例・読み取り値・式 === */
  const stage = el('div','stage');
  const cv = el('canvas');
  stage.appendChild(cv); colMain.appendChild(stage);

  colMain.appendChild(el('div','legend',
    '<span><i style="background:var(--theory)"></i>理論 |ψ(x)|<sup>2</sup></span>' +
    '<span><i style="background:var(--hist)"></i>到達点のヒストグラム（規格化済）</span>' +
    '<span><i style="background:var(--dot)"></i>飛行中の粒子</span>'));

  const readout = el('div','readout');
  colMain.appendChild(readout);

  if (mode === 'single'){
    colMain.appendChild(el('div','eq',
      '|ψ(<i>x</i>)|<sup>2</sup> = <i>A</i><sub>0</sub><sup>2</sup><i>a</i><sup>2</sup>' +
      '<span class="paren">(</span>' +
      '<span class="frac"><span class="n">sin(<i>pax</i>/ħ<i>L</i>)</span>' +

/* ------------------------------------------------------------------ */
Sim.prototype.applyPreset = function(i){
  const p = PRESETS[i];
  this.fields.L.set(p.L);
  this.fields.m.inp.value = p.m.toPrecision(6);
  this.fields.v.inp.value = String(Number(p.v.toPrecision(6)));
  if (this.mode === 'single') this.fields.a.set(2 * p.a2);
  else { this.fields.a.set(p.a); this.fields.b.set(p.b); }
};

Sim.prototype.readParams = function(){
  const P = {
    L: this.fields.L.get(),
    m: this.fields.m.get(),
    v: this.fields.v.get()
  };
  if (this.mode === 'single'){ P.a = this.fields.a.get() / 2; P.b = 0; }
  else { P.a = this.fields.a.get(); P.b = this.fields.b.get(); }
  P.ok = (P.L > 0 && P.m > 0 && P.v > 0 && P.a > 0 &&
          (this.mode === 'single' || P.b > 0));
  return P;
};

/** パラメーター変更時 → 統計をリセットして作り直し */
Sim.prototype.recompute = function(resetHits){
  this.P = this.readParams();
  if (!this.P.ok){ this.ph = null; this.updateReadout(); this.draw(); return; }
  this.ph = physics(this.P, this.mode);

  /* 自動表示範囲 */
  if (this.mode === 'single'){
    this.Xauto = 3.2 * this.ph.w;
  } else {
    this.Xauto = Math.min(2.2 * this.ph.w, 10 * this.ph.fringe);
  }
  if (resetHits) this.reset(true);
  /* 「自動」のときだけ範囲を追随させる。手入力した範囲はパラメーター変更後も保持
     （電子 ⇔ 重い粒 を同じ横軸で見比べるため） */
  if (this.manualRange && this.X > 0) this.rebuild();
  else this.setX(this.Xauto, 'auto');
};

/** 表示範囲の入力欄を読む [m] */
Sim.prototype.readRange = function(){
  return (parseFloat(this.rngIn.value) || 0) * parseFloat(this.rngSel.value);
};

/** 表示範囲の入力欄に値を書き戻す（単位は自動選択） */
Sim.prototype.showRange = function(X){
  const u = lenUnit(X) || [1, 'm'];
  let lbl = u[1];
  if (lbl === 'km' || lbl === 'fm') lbl = 'm';
  let idx = 0;
  for (let i = 0; i < UNIT_OPTS.length; i++){ if (UNIT_OPTS[i][0] === lbl) idx = i; }
  this.rngSel.selectedIndex = idx;
  this.rngIn.value = String(Number((X / UNIT_OPTS[idx][1]).toPrecision(4)));
};

/** 表示範囲を設定（src: 'box' | 'slider' | 'auto'） */
Sim.prototype.setX = function(X, src){
  if (!(X > 0) || !isFinite(X)) return;
  this.X = X;
  if (src !== 'box') this.showRange(X);
  if (src !== 'slider'){ this.zAnchorX = X; this.zmIn.value = '0'; }
  this.rebuild();
};

Sim.prototype.reset = function(quiet){
  this.hitX.length = 0; this.hitJ.length = 0;
  this.flying.length = 0; this.N = 0;
  if (!quiet) this.rebuild();
};

/** ビン・斑点キャンバスの作り直し（表示範囲変更・リセット時） */
Sim.prototype.rebuild = function(){
  if (!this.ph) return;
  if (!(this.X > 0) || !isFinite(this.X)) this.X = this.Xauto;
  const plotW = Math.max(40, this.W - this.padL - this.padR);
  this.nBins = Math.max(50, Math.min(240, Math.round(plotW / 4)));
  this.bins = new Float64Array(this.nBins);
  this.binW = 2 * this.X / this.nBins;
  for (let i = 0; i < this.hitX.length; i++) this.addToBin(this.hitX[i]);
  this.redrawSpeckle();
  this.updateReadout();
  this.draw();
};

Sim.prototype.addToBin = function(x){
  const i = Math.floor((x + this.X) / this.binW);
  if (i >= 0 && i < this.nBins) this.bins[i]++;
};

/* ------------------------------------------------------------------ */
Sim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = Math.round(Math.max(430, Math.min(620, w * 0.66)));
  if (this.W === w && this.Hc === h) return;      // ResizeObserver のループ防止
  this.W = w; this.Hc = h;
  this.cv.width  = Math.round(w * this.dpr);
  this.cv.height = Math.round(h * this.dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

  this.padL = 62; this.padR = 20; this.padT = 24; this.padB = 42;
  this.yScreen = this.padT + Math.round(0.40 * (h - this.padT - this.padB));
  this.bandH   = 20;
  this.ySlit   = this.padT + Math.round(0.54 * (this.yScreen - this.padT));
  this.ySrc    = this.padT + 12;
  this.yPlotTop  = this.yScreen + this.bandH + 30;
  this.yPlotBase = h - this.padB;

  /* 斑点用オフスクリーン */
  this.spk = document.createElement('canvas');
  this.spk.width  = this.cv.width;
  this.spk.height = Math.round(this.bandH * this.dpr);
  this.sctx = this.spk.getContext('2d');
  this.sctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

  if (!this.ph) this.recompute(false); else this.rebuild();
};

/* ------------------------------------------------------------------ */
Sim.prototype.xToPx = function(x){
  const plotW = this.W - this.padL - this.padR;
  return this.padL + (x + this.X) / (2 * this.X) * plotW;
};

/* ------------------------------------------------------------------ */
Sim.prototype.launch = function(n){
  if (!this.ph) return;
  for (let i = 0; i < n; i++){
    if (this.hitX.length >= MAX_HITS) return;
    const x = sampleX(this.ph);
    /* どの開口に「入る」ように描くか（見た目のみ。物理的な意味はない） */
    const gi = (this.mode === 'single') ? 0 : (Math.random() < 0.5 ? 0 : 1);
    this.flying.push({ t:0, x:x, gi:gi, gu:Math.random(), j:Math.random() });
  }
  if (this.kick) this.kick();
};

/** アニメーションなしで一気に加算 */
Sim.prototype.bulk = function(n){
  if (!this.ph) return;
  const room = MAX_HITS - this.hitX.length;
  n = Math.min(n, room);
  for (let i = 0; i < n; i++){
    const x = sampleX(this.ph);
    this.hitX.push(x); this.hitJ.push(Math.random());
    this.addToBin(x); this.N++;
    this.drawSpeck(x, this.hitJ[this.hitJ.length - 1]);
  }
  this.updateReadout(); this.draw();
};

/* ------------------------------------------------------------------ */
Sim.prototype.step = function(dt){
  if (!this.ph) return;
  /* 連射 */
  if (this.running){
    this.emitAcc += dt * 6 * this.speed;
    const k = Math.floor(this.emitAcc);
    if (k > 0){ this.emitAcc -= k; this.launch(Math.min(k, 40)); }
  }
  /* 飛行中の粒子を進める */
  const dur = 1.15 / this.speed;                 // 1 個あたりの飛行時間 [s]
  for (let i = this.flying.length - 1; i >= 0; i--){
    const f = this.flying[i];
    f.t += dt / dur;
    if (f.t >= 1){
      this.flying.splice(i, 1);
      if (this.hitX.length < MAX_HITS){
        this.hitX.push(f.x); this.hitJ.push(f.j);
        this.addToBin(f.x); this.N++;
        this.drawSpeck(f.x, f.j);
        this.flashX = f.x; this.flashT = 0.35;
      }
      this.dirtyRead = true;
    }
  }
  if (this.flashT > 0) this.flashT -= dt;
  /* 読み取り値の更新は 0.2 秒に 1 回まで（連射時の負荷対策） */
  this.readAcc = (this.readAcc || 0) + dt;
  if (this.dirtyRead && this.readAcc > 0.2){
    this.updateReadout(); this.dirtyRead = false; this.readAcc = 0;
  }
};

/* ========================================================================
   6. 描画
   ======================================================================== */
Sim.prototype.css = function(name){
  if (!this._cssCache) this._cssCache = {};
  if (this._cssCache[name] === undefined){
    this._cssCache[name] =
      getComputedStyle(document.getElementById('qsim')).getPropertyValue(name).trim();
  }
  return this._cssCache[name] || '#888';
};
Sim.prototype.clearCss = function(){ this._cssCache = null; };

Sim.prototype.drawSpeck = function(x, j){
  const px = this.xToPx(x);
  if (px < this.padL - 2 || px > this.W - this.padR + 2) return;
  const c = this.sctx;
  c.fillStyle = this.css('--speck');
  c.globalAlpha = 0.75;
  c.fillRect(px - 0.6, 2 + j * (this.bandH - 5), 1.5, 1.5);
  c.globalAlpha = 1;
};

Sim.prototype.redrawSpeckle = function(){
  if (!this.sctx) return;
  this.sctx.clearRect(0, 0, this.W, this.bandH);
  const start = Math.max(0, this.hitX.length - 200000);
  for (let i = start; i < this.hitX.length; i++) this.drawSpeck(this.hitX[i], this.hitJ[i]);
};

Sim.prototype.draw = function(){
  const c = this.ctx, W = this.W, H = this.Hc;
  c.clearRect(0, 0, W, H);
  c.fillStyle = this.css('--panel'); c.fillRect(0, 0, W, H);

  if (!this.ph){
    c.fillStyle = this.css('--sub');
    c.font = '14px ' + CFONT;
    c.textAlign = 'center';
    c.fillText('パラメーターはすべて正の値を入力してください。', W / 2, H / 2);
    return;
  }
  this.drawApparatus();
  this.drawBand();
  this.drawPlot();
};

/* --- 上段：装置の模式図 ------------------------------------------------ */
Sim.prototype.drawApparatus = function(){
  const c = this.ctx, W = this.W;
  const plotW = W - this.padL - this.padR;
  const scale = plotW / (2 * this.X);
  const fg = this.css('--fg'), sub = this.css('--sub'), line = this.css('--line');
  const font = CFONT;

  /* スリット部の描画倍率 g
     ―― 実寸のままだと見えない（または画面外へ発散する）ので、
        構造全体が図幅の 1.2 % ～ 28 % に収まるよう拡大／縮小する。 */
  const half = (this.mode === 'single') ? this.P.a : (this.P.a + this.P.b);
  const natural = half * scale;
  let g = 1;
  if (natural > 0){
    if      (natural < 0.012 * plotW) g = 0.012 * plotW / natural;
    else if (natural > 0.280 * plotW) g = 0.280 * plotW / natural;
  }
  this.slitG = g;

  const cx = this.xToPx(0);
  const px = function(xm){ return cx + xm * scale * g; };
  const L0 = this.padL - 6, R0 = W - this.padR + 6;
  const barY = this.ySlit - 5, barH = 10;
  /* 画面内へクランプして塗る（極端なパラメーターでの座標発散対策） */
  const bar = function(xa, xb){
    const A = Math.max(L0, Math.min(R0, xa));
    const B = Math.max(L0, Math.min(R0, xb));
    if (B > A) c.fillRect(A, barY, B - A, barH);
  };
  /* 開口が細くなりすぎたら最低 3 px は見えるように広げる */
  const widen = function(lo, hi){
    if (hi - lo >= 3) return [lo, hi];
    const m = (lo + hi) / 2;
    return [m - 1.5, m + 1.5];
  };

  /* --- 粒子源 --- */
  const srcW = Math.min(plotW * 0.42, 260);
  c.fillStyle = this.css('--panel');
  c.strokeStyle = line; c.lineWidth = 1;
  c.beginPath();
  c.rect(cx - srcW / 2, this.ySrc - 8, srcW, 16);
  c.fill(); c.stroke();
  c.fillStyle = sub; c.font = '11px ' + font; c.textAlign = 'center';
  c.fillText('粒子源（平面波として垂直入射）', cx, this.ySrc - 13);

  /* 入射を示す薄い矢印 */
  c.strokeStyle = line; c.lineWidth = 1;
  for (let i = -3; i <= 3; i++){
    const x = cx + i * (srcW / 8);
    c.beginPath(); c.moveTo(x, this.ySrc + 10); c.lineTo(x, this.ySlit - 16); c.stroke();
    c.beginPath();
    c.moveTo(x - 3, this.ySlit - 21); c.lineTo(x, this.ySlit - 16); c.lineTo(x + 3, this.ySlit - 21);
    c.stroke();
  }

  /* --- スリット板 --- */
  c.fillStyle = fg;
  let gaps;                                    // 開口の描画区間（px）
  if (this.mode === 'single'){
    gaps = [widen(px(-this.P.a), px(this.P.a))];
  } else {
    const a = this.P.a, b = this.P.b;
    gaps = [widen(px(-a - b), px(-a)), widen(px(a), px(a + b))];
    if (gaps[0][1] > gaps[1][0]){              // 拡幅で重なったら中央遮蔽を 2px 残す
      const m = (gaps[0][1] + gaps[1][0]) / 2;
      gaps[0][1] = m - 1; gaps[1][0] = m + 1;
    }
  }
  let cur = L0;
  for (let i = 0; i < gaps.length; i++){ bar(cur, gaps[i][0]); cur = gaps[i][1]; }
  bar(cur, R0);
  this.gaps = gaps;

  c.fillStyle = sub; c.font = '11px ' + font; c.textAlign = 'left';
  let gtxt = '';
  if (g > 1.05)      gtxt = '（横方向 ×' + fmtNumPlain(g, 3) + ' に拡大して描画）';
  else if (g < 0.95) gtxt = '（横方向 ×' + fmtNumPlain(g, 3) + ' に縮小して描画）';
  c.fillText('スリット' + gtxt, this.padL, barY - 7);

  /* --- L の矢印 --- */
  const ax = this.padL + 14;
  c.strokeStyle = sub; c.lineWidth = 1;
  c.beginPath(); c.moveTo(ax, this.ySlit + 6); c.lineTo(ax, this.yScreen - 2); c.stroke();
  c.beginPath();
  c.moveTo(ax - 3, this.ySlit + 11); c.lineTo(ax, this.ySlit + 6); c.lineTo(ax + 3, this.ySlit + 11);
  c.moveTo(ax - 3, this.yScreen - 7); c.lineTo(ax, this.yScreen - 2); c.lineTo(ax + 3, this.yScreen - 7);
  c.stroke();
  c.fillStyle = sub; c.textAlign = 'left'; c.font = '11px ' + font;
  c.fillText('L = ' + fmtLenPlain(this.P.L, 3), ax + 6, (this.ySlit + this.yScreen) / 2 + 4);

  /* --- 飛行中の粒子 --- */
  const dot = this.css('--dot');
  for (let i = 0; i < this.flying.length; i++){
    const f = this.flying[i];
    const gp = gaps[f.gi] || gaps[0];
    const xa = gp[0] + f.gu * (gp[1] - gp[0]);
    if (f.t < 0.45){
      /* スリットへ向かう区間 */
      const u = f.t / 0.45;
      const y = this.ySrc + u * (this.ySlit - this.ySrc);
      c.strokeStyle = dot; c.globalAlpha = 0.35; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(xa, Math.max(this.ySrc, y - 26)); c.lineTo(xa, y); c.stroke();
      c.globalAlpha = 1;
      c.fillStyle = dot;
      c.beginPath(); c.arc(xa, y, 3.4, 0, 6.2832); c.fill();
    } else {
      /* 通過後 */
      const u  = (f.t - 0.45) / 0.55;
      const y  = this.ySlit + u * (this.yScreen - this.ySlit);
      const xl = this.xToPx(f.x);

      /* 開口から広がる波面 */
      const R = u * (this.yScreen - this.ySlit);
      const centers = gaps.map(function(gp){ return (gp[0] + gp[1]) / 2; });
      c.strokeStyle = this.css('--accent'); c.lineWidth = 1;
      for (let k = 0; k < 3; k++){
        const r = R - k * 16;
        if (r <= 2) continue;
        c.globalAlpha = 0.30 * (1 - u * 0.75) * (1 - k * 0.28);
        for (let m = 0; m < centers.length; m++){
          c.beginPath(); c.arc(centers[m], this.ySlit, r, 0, Math.PI); c.stroke();
        }
      }
      c.globalAlpha = 1;

      if (this.chkLine.checked){
        c.strokeStyle = dot; c.globalAlpha = 0.5; c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(xa, this.ySlit); c.lineTo(xa + u * (xl - xa), y); c.stroke();
        c.globalAlpha = 1;
        c.fillStyle = dot;
        c.beginPath(); c.arc(xa + u * (xl - xa), y, 3.4, 0, 6.2832); c.fill();
      }
    }
  }

  /* --- スクリーン --- */
  c.strokeStyle = fg; c.lineWidth = 2;
  c.beginPath(); c.moveTo(this.padL - 6, this.yScreen); c.lineTo(W - this.padR + 6, this.yScreen); c.stroke();
  c.fillStyle = sub; c.font = '11px ' + font; c.textAlign = 'right';
  c.fillText('スクリーン（平面 A）', W - this.padR, this.yScreen - 6);

  /* 着弾フラッシュ */
  if (this.flashT > 0){
    const fx = this.xToPx(this.flashX);
    c.strokeStyle = dot; c.lineWidth = 2;
    c.globalAlpha = Math.max(0, this.flashT / 0.35);
    c.beginPath(); c.arc(fx, this.yScreen + 4, 3 + (1 - this.flashT / 0.35) * 9, 0, 6.2832);
    c.stroke(); c.globalAlpha = 1;
  }
};

/* --- 中段：到達点の斑点 ------------------------------------------------ */
Sim.prototype.drawBand = function(){
  const c = this.ctx;
  c.save();
  c.beginPath();
  c.rect(this.padL - 6, this.yScreen, this.W - this.padL - this.padR + 12, this.bandH);
  c.clip();
  c.drawImage(this.spk, 0, this.yScreen, this.W, this.bandH);
  c.restore();
  c.fillStyle = this.css('--sub');
  c.font = '10.5px ' + CFONT;
  c.textAlign = 'left';
  c.fillText('到達点の記録（実験）', this.padL, this.yScreen + this.bandH + 12);
};

/* --- 下段：理論曲線とヒストグラム -------------------------------------- */
Sim.prototype.drawPlot = function(){
  const c = this.ctx, W = this.W;
  const x0 = this.padL, x1 = W - this.padR;
  const plotW = x1 - x0;
  const yT = this.yPlotTop, yB = this.yPlotBase;
  const plotH = yB - yT;
  const YMAX = 1.16;
  const font = CFONT;
  const sub = this.css('--sub'), line = this.css('--line'), fg = this.css('--fg');
  const self = this;
  const toY = function(v){ return yB - (v / YMAX) * plotH; };

  /* 表示範囲に対して分布が極端に細いとき（重い粒などの δ 関数的な場合）は、
     確率「密度」では両方とも 0 に潰れて何も見えなくなるので、
     縦軸を「ビン内の確率」に自動で切り替える。 */
  const spike = this.ph.w < this.binW / 8;
  /* 中央ビンに入る確率（sinc² の裾 ∫≈ w/π²X から）*/
  const Pc = spike ? Math.max(0, 1 - 2 * this.ph.w / (Math.PI * Math.PI * this.binW)) : 1;

  /* 目盛り（縦） */
  c.strokeStyle = line; c.lineWidth = 1; c.fillStyle = sub;
  c.font = '10.5px ' + font; c.textAlign = 'right';
  [0, 0.25, 0.5, 0.75, 1].forEach(function(v){
    const y = toY(v);
    c.globalAlpha = v === 0 ? 1 : 0.55;
    c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
    c.globalAlpha = 1;
    c.fillText(v.toFixed(2), x0 - 7, y + 3.5);
  });

  /* 目盛り（横）―― fm より細かい／km より粗い領域は ×10ⁿ m 表記に切り替える */
  const step = niceStep(2 * this.X / 8);
  const uu = lenUnit(this.X);
  let unit;
  if (uu) unit = uu;
  else {
    const e = Math.floor(Math.log10(this.X)) - 1;
    unit = [Math.pow(10, e), '10' + supStr(e) + ' m'];
  }
  c.textAlign = 'center';
  for (let k = -Math.ceil(this.X / step); k <= Math.ceil(this.X / step); k++){
    const xv = k * step;
    if (Math.abs(xv) > this.X * 1.0001) continue;
    const px = this.xToPx(xv);
    c.strokeStyle = line; c.globalAlpha = k === 0 ? 0.9 : 0.4;
    c.beginPath(); c.moveTo(px, yT); c.lineTo(px, yB); c.stroke();
    c.globalAlpha = 1;
    c.fillStyle = sub;
    c.fillText(String(Number((xv / unit[0]).toPrecision(3))), px, yB + 15);
  }
  c.fillStyle = sub; c.font = '11px ' + font;
  c.fillText('スクリーン上の位置  x [' + unit[1] + ']', (x0 + x1) / 2, yB + 31);

  c.save();
  c.translate(15, (yT + yB) / 2);
  c.rotate(-Math.PI / 2);
  c.textAlign = 'center'; c.fillStyle = sub; c.font = '11px ' + font;
  c.fillText(spike ? 'ビン内の確率' : '|ψ(x)|²（ピーク = 1）', 0, 0);
  c.restore();

  /* --- ヒストグラム --- */
  if (this.N > 0){
    const sc = spike ? (1 / this.N) : (this.ph.Z / (this.N * this.binW));
    c.fillStyle = this.css('--hist'); c.globalAlpha = 0.42;
    for (let i = 0; i < this.nBins; i++){
      if (this.bins[i] === 0) continue;
      const v = Math.min(YMAX, this.bins[i] * sc);
      const bx0 = x0 + (i / this.nBins) * plotW;
      const bw  = plotW / this.nBins;
      c.fillRect(bx0, toY(v), Math.max(1, bw - 0.6), yB - toY(v));
    }
    c.globalAlpha = 1;
  }

  /* --- δ 関数的な場合：理論は「中央のビンに確率 Pc が集中」--- */
  if (spike){
    const bw  = plotW / this.nBins;
    const bx0 = x0 + Math.floor(this.nBins / 2) * bw;
    c.strokeStyle = this.css('--theory'); c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(x0, toY(0)); c.lineTo(bx0, toY(0));
    c.lineTo(bx0, toY(Pc)); c.lineTo(bx0 + bw, toY(Pc));
    c.lineTo(bx0 + bw, toY(0)); c.lineTo(x1, toY(0));
    c.stroke();
    c.fillStyle = this.css('--sub'); c.font = '10px ' + font; c.textAlign = 'center';
    c.fillText('※ 分布の幅（±' + fmtLenPlain(this.ph.w, 3) + '）が 1 ビンよりはるかに狭い ⇒ 実質 δ 関数。',
               (x0 + x1) / 2, yT + 13);
    c.fillText('縦軸を「ビン内の確率」に切り替えました（表示範囲を狭めれば密度で比較できます）',
               (x0 + x1) / 2, yT + 26);
    c.strokeStyle = line; c.lineWidth = 1;
    c.strokeRect(x0, yT, plotW, plotH);
    return;
  }

  /* --- 理論曲線（画素より細かい縞はスーパーサンプリングで最大値を採用） --- */
  const pxPerFeature = this.ph.feature * plotW / (2 * this.X);
  const coarse = pxPerFeature < 6;          // 1 縞が 6 px 未満なら画素で解像できない
  const S = coarse ? 24 : 1;
  const dx = 2 * this.X / plotW;
  /* 解像できないときは「縞 1 周期ぶんの窓」で平均と最大をとる
     → 平均 = 包絡線 × 1/2 で、ヒストグラムが従うべき値そのものになる */
  const win = coarse ? Math.max(dx, this.ph.feature) : dx;
  const vmax = new Float64Array(plotW + 1);
  const vavg = new Float64Array(plotW + 1);
  for (let i = 0; i <= plotW; i++){
    const xc = -this.X + i * dx;
    let mx = 0, sm = 0;
    for (let s = 0; s < S; s++){
      const xs = xc + (S === 1 ? 0 : (s / (S - 1) - 0.5) * win);
      const fv = this.ph.f(xs);
      sm += fv;
      if (fv > mx) mx = fv;
    }
    vmax[i] = mx; vavg[i] = sm / S;
  }
  const stroke = function(arr, alpha, width){
    c.strokeStyle = self.css('--theory');
    c.globalAlpha = alpha; c.lineWidth = width;
    c.beginPath();
    for (let i = 0; i <= plotW; i++){
      const y = toY(Math.min(arr[i], YMAX));
      if (i === 0) c.moveTo(x0 + i, y); else c.lineTo(x0 + i, y);
    }
    c.stroke(); c.globalAlpha = 1;
  };
  if (coarse){
    stroke(vmax, 0.30, 1.2);          // 縞の上端（包絡線）
    stroke(vavg, 1.0,  1.8);          // 縞の平均 ← ヒストグラムと比べる相手
    c.fillStyle = this.css('--sub'); c.font = '10px ' + font; c.textAlign = 'right';
    c.fillText('※ 縞が細かすぎて画素で解像できません（濃い線＝縞の平均、淡い線＝包絡線）。'
             + '「表示範囲」を小さくすると縞が見えます', x1, yT + 12);
  } else {
    stroke(vmax, 1.0, 1.8);
  }

  /* 枠 */
  c.strokeStyle = line; c.lineWidth = 1;
  c.strokeRect(x0, yT, plotW, plotH);
};

/* ========================================================================
   7. 数値の表示
   ======================================================================== */
Sim.prototype.updateReadout = function(){
  const R = [];
  if (!this.ph){
    this.readout.innerHTML =
      '<div><span>入力エラー</span><span>L, m, v, スリット幅 は正の値で</span></div>';
    return;
  }
  const ph = this.ph, P = this.P;

  R.push(['発射数 <i>N</i>', String(this.N) +
          (this.hitX.length >= MAX_HITS ? '（上限）' : '')]);
  R.push(['運動量 <i>p</i>', fmtNum(ph.p, 4) + ' kg m/s']);
  R.push(['de Broglie 波長 λ', fmtLen(ph.lam, 4)]);

  if (this.mode === 'single'){
    R.push(['<i>pa</i>/ħ<i>L</i>', fmtNum(ph.alpha, 4) + ' m<sup>−1</sup>']);
    R.push(['第 1 暗線 <i>x</i><sub>1</sub>', fmtLen(ph.w, 4)]);
    R.push(['半幅 <i>a</i>', fmtLen(P.a, 4)]);
  } else {
    R.push(['<i>pa</i>/ħ<i>L</i>', fmtNum(ph.alpha, 4) + ' m<sup>−1</sup>']);
    R.push(['<i>p</i>(<i>a</i>+<i>b</i>)/ħ<i>L</i>', fmtNum(ph.beta, 4) + ' m<sup>−1</sup>']);
    R.push(['縞間隔 λ<i>L</i>/<i>d</i>', fmtLen(ph.fringe, 4)]);
    R.push(['包絡線の暗線 λ<i>L</i>/<i>b</i>', fmtLen(ph.w, 4)]);
    R.push(['中心間距離 <i>d</i>', fmtLen(ph.d, 4)]);
  }
  R.push(['表示範囲', '±' + fmtLen(this.X, 3) +
          (this.manualRange ? '（手動）' : '（自動）')]);

  /* 表示範囲の外に落ちた粒子がどれくらいあるか */
  let nIn = 0;
  for (let i = 0; i < this.nBins; i++) nIn += this.bins[i];
  R.push(['範囲内の到達数',
          String(nIn) + (this.N > 0 ? '（' + (100 * nIn / this.N).toFixed(1) + ' %）' : '')]);

  /* 近軸近似の目安 */
  const ratio = ph.w / P.L;
  R.push(['近軸近似 <i>x</i><sub>1</sub>/<i>L</i>',
          fmtNum(ratio, 3) + (ratio > 0.2 ? ' <span style="color:var(--warn)">⚠</span>' : '')]);

  /* 適合度 χ²/ν（表示範囲内、期待度数 5 以上のビン） */
  if (ph.w < this.binW / 8){
    R.push(['χ²/ν（参考）', '—（δ関数領域）']);
  } else if (this.N > 30){
    let chi = 0, nu = 0;
    const K = 8;
    for (let i = 0; i < this.nBins; i++){
      const bx0 = -this.X + i * this.binW;
      let acc = 0;
      for (let s = 0; s < K; s++) acc += ph.f(bx0 + (s + 0.5) / K * this.binW);
      const E = this.N * (acc / K) * this.binW / ph.Z;
      if (E < 5) continue;
      const d = this.bins[i] - E;
      chi += d * d / E; nu++;
    }
    R.push(['χ²/ν（参考）',
            nu > 0 ? (chi / nu).toFixed(2) + '  (ν = ' + nu + ')' : '—']);
  } else {
    R.push(['χ²/ν（参考）', 'N を増やしてください']);
  }

  this.readout.innerHTML = R.map(function(r){
    return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
};

/* ========================================================================
   8. 起動
   ======================================================================== */
const app = document.getElementById('qsim');

/* ?only=single / ?only=double で片方だけを表示する（記事に個別に埋め込む用）。
   タブとページ見出しを隠して、その実験だけのコンパクト表示になる。 */
let only = null;
const m = /[?&]only=(single|double)/.exec(location.search);
if (m) only = m[1];
if (only) app.classList.add('is-embed');

const sims = {};
['single', 'double'].forEach(function(k){
  const p = app.querySelector('[data-panel="' + k + '"]');
  if (!p) return;
  if (only && only !== k){ p.parentNode.removeChild(p); return; }
  sims[k] = new Sim(k, p);
});

let active = only || 'single';
const tabs = app.querySelectorAll('.tab');

function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++){
    tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  }
  app.querySelectorAll('.panel').forEach(function(p){
    p.hidden = (p.dataset.panel !== name);
  });
  sims[name].resize();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);          // 二重スリット側は markup で hidden なので必ず呼ぶ

function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){                 // ?only= のときは URL の # で切り替えない
  window.addEventListener('hashchange', fromHash);
  fromHash();
}

/* autocomplete="off" を無視してフォーム値を復元するブラウザ対策。
   pageshow は復元の後に発火するので、ここで DOM の値を正として読み直す。 */
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){
    const s = sims[k];
    const domX = s.readRange();
    /* 入力欄は有効数字 4 桁で書き戻しているので、その丸め分は差と見なさない */
    if (domX > 0 && isFinite(domX) && Math.abs(domX / s.X - 1) > 1e-3){
      s.manualRange = true; s.X = domX;
    }
    s.recompute(false);
  });
});

/* ------------------------------------------------------------------
   iframe に埋め込まれたとき、親ページへ必要な高さを知らせる。
   親側で受け取れば iframe の高さ指定が不要になる（下の埋め込み例を参照）。
   送っているのは数値の高さだけ。                                     */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);   // <details> の開閉
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

/* メインループ。動かすものが無くなったら止める
   （1 ページに複数埋め込んでも、待機中は何も回らないようにするため）。*/
let last = 0, rafId = null;
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const s = sims[active];
  let busy = false;
  if (s){
    s.step(dt);
    busy = (s.flying.length > 0 || s.running || s.flashT > 0);
    if (busy) s.draw();
    else if (s.dirtyRead){ s.updateReadout(); s.dirtyRead = false; }
  }
  rafId = busy ? requestAnimationFrame(loop) : null;
}
function kick(){
  if (rafId === null){ last = performance.now(); rafId = requestAnimationFrame(loop); }
}
Sim.prototype.kick = kick;

})();
