<!DOCTYPE html>
<html lang="ja">
<head>

<title>重なり積分 ― 2 つの原子軌道は，どれだけ重なっているか</title>
<style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります．
   スタイルはすべて #qsim 配下にスコープしてあるので，
   既存ページに <div id="qsim">…</div> ごと貼り付けても衝突しません．

  --panel:#ffffff;
  --panel-soft:#f4f6f9;
  --fg:#1f2328;
  --sub:#5c6670;

  --accent:#0f4c81;
  --accent-strong:#0a355a;
  --accent-soft:#e7eff7;
  --pos:#0f4c81;         /* φ > 0 */
  --neg:#c62828;         /* φ < 0 */
  --dot:#f9a825;
  --nucA:#e53935;        /* 原子核 A */
  --nucB:#6a3d9a;        /* 原子核 B */
  --warn:#8a5a00;
  --warnbg:#fdf5e3;

/* --- タブ --- */

  font:inherit; font-size:.92rem; font-weight:700; cursor:pointer;

#qsim.is-embed > .lead{display:none}

/* --- 2 カラム：左 = 図 / 右 = パラメーター --- */

  display:grid; grid-template-columns:minmax(0,3fr) minmax(248px,1fr);

  font:inherit; font-size:.84rem; font-weight:700; cursor:pointer; text-align:center;

  font:inherit; font-size:.78rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.85); color:#15202b;

/* --- ボタン --- */

#qsim button.act{
  font:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.8); color:#15202b;
  padding:7px 10px; border-radius:9px; white-space:nowrap;
  transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}

#qsim .ctlrow{

}

/* --- 左カラム：キャンバス --- */
#qsim .stage{
  border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;

/* --- 読み取り値 --- */

/* --- 数式 --- */

}
/* 数式はブラウザ標準の MathML．数式フォントを明示しないと根号や括弧が

}

<body>
<div id="qsim">
  <h1>重なり積分 ― 2 つの原子軌道は，どれだけ重なっているか</h1>
  <p class="lead">
    距離 <i>R</i> だけ離した原子 A と原子 B に 1 つずつ軌道を置き，
    重なり積分 <b><i>S</i>(<i>R</i>) = ∫<i>φ</i><sub>A</sub><i>φ</i><sub>B</sub> d<i>V</i></b> を計算します．
    <i>S</i> は共有結合のいちばん底にある量で，永年方程式にも，STO-3G にも，バンド理論にも顔を出します．
    ①で<b>重なりの絵</b>を，②で <b><i>S</i>(<i>R</i>) の曲線</b>を見ます．1s だけでなく 4f まで選べます．
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="meet" role="tab">① 2 つの軌道を近づける</button>
    <button class="tab" data-tab="curve" role="tab">② S(R) の曲線を比べる</button>
  </div>

  <section class="panel" data-panel="meet"></section>
  <section class="panel" data-panel="curve" hidden></section>

  <p class="foot">
    長さはすべて Bohr 半径 <i>a</i><sub>0</sub> = 52.918 pm を単位にしています
    （原子 B の記号と紛れないよう，講義第 5 回にならって <i>a</i><sub>B</sub> ではなく <i>a</i><sub>0</sub> と書きます）．
  </p>
</div>
<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数と軌道の一覧
   ------------------------------------------------------------------------
   長さは Bohr 半径 a₀ を単位にする（水素原子のページと同じ）．
   軌道は水素様：核電荷（有効核電荷）Z′ の 1 電子軌道
     R_nl^{Z′}(r) = Z′^{3/2} R_nl(Z′ r)
   で，Z′ = 1 がちょうど水素原子の軌道になる．
   ======================================================================== */
const A0_PM = 52.917721067;           // Bohr 半径 [pm]
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

const ORB = [
  { k:'1s', n:1, l:0 }, { k:'2s', n:2, l:0 }, { k:'2p', n:2, l:1 },
  { k:'3s', n:3, l:0 }, { k:'3p', n:3, l:1 }, { k:'3d', n:3, l:2 },
  { k:'4s', n:4, l:0 }, { k:'4p', n:4, l:1 }, { k:'4d', n:4, l:2 }, { k:'4f', n:4, l:3 }
];
/* 結合軸（z 軸）まわりの量子数 m による結合の型の名前 */
const MTYPE = ['σ', 'π', 'δ', 'φ'];

/* ========================================================================
   1. 波動関数
   ------------------------------------------------------------------------
   動径関数は水素原子のページの Rnl と同じもの（ノート (16)）を，
   多項式の係数表 + Horner 法に直して速くしてある．
     R_nl(r) = e^{−r/n} Σ_{i=l}^{n−1} c_i r^i
   ======================================================================== */
function fact(n){ let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

const RAD = {};
function radGet(n, l){
  const key = n + ',' + l;
  if (RAD[key]) return RAD[key];
  const A = Math.sqrt(fact(n - l - 1) / (n * n * Math.pow(fact(n + l), 3)));
  const c = new Float64Array(n);
  for (let k = 2*l + 1; k <= n + l; k++){
    c[k - l - 1] += -A * Math.pow(-1, k) * Math.pow(fact(n + l), 2)
                  / (fact(k - 2*l - 1) * fact(k) * fact(n + l - k)) * Math.pow(2 / n, k - l);
  }
  return (RAD[key] = c);
}
/* 有効核電荷 Z′ = zeta の水素様動径関数（r は a₀ 単位） */
function radEval(n, l, zeta, r){
  const c = radGet(n, l), x = zeta * r;
  let p = 0;
  for (let i = n - 1; i >= 0; i--) p = p * x + c[i];
  return Math.sqrt(zeta * zeta * zeta) * Math.exp(-x / n) * p;
}

/* 付随 Legendre P_l^m(x)．Condon–Shortley 位相は付けない（水素のページと同じ） */
function plm(l, m, x){
  m = Math.abs(m);
  if (m > l) return 0;
  let pmm = 1;
  if (m > 0){
    const s = Math.sqrt(Math.max(0, 1 - x * x));
    let f = 1;
    for (let i = 1; i <= m; i++){ pmm *= f * s; f += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2*m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++){
    pll = ((2*ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}
function Nlm(l, m){
  const am = Math.abs(m);
  return Math.sqrt((2*l + 1) / (4 * Math.PI) * fact(l - am) / fact(l + am));
}

/* x–z 断面（結合軸 = z）での実軌道の値．m > 0 は cos 型（p_x, d_{x²−y²}, … 型）．
   断面では cos(mφ) が x > 0 側で 1，x < 0 側で (−1)^m になるだけ． */
function fieldVal(o, zeta, m, x, z){
  const r = Math.hypot(x, z);
  if (r < 1e-12) return (o.l === 0) ? radEval(o.n, 0, zeta, 0) * Nlm(0, 0) : 0;
  const ct = z / r;
  let v = radEval(o.n, o.l, zeta, r) * Nlm(o.l, m) * plm(o.l, m, ct);
  if (m > 0){
    v *= Math.SQRT2;
    if (x < 0 && (m % 2 === 1)) v = -v;
  }
  return v;
}

/* ========================================================================
   2. 重なり積分 S(R)
   ------------------------------------------------------------------------
   回転楕円体座標 ξ = (r_A + r_B)/R，η = (r_A − r_B)/R を使う．
     dV = (R/2)³ (ξ² − η²) dξ dη dφ，ξ ∈ [1,∞)，η ∈ [−1,1]
   φ 積分は m が同じ実軌道どうしなら（cos 型・sin 型とも）2π N_A N_B を出すだけ．
   残る 2 重積分を Gauss–Legendre 求積で数値計算する．ξ 方向は
   被積分関数が e^{−γ(ξ−1)}（γ = R(Z′_A/n_A + Z′_B/n_B)/2）で減衰するので，
   u = γ(ξ−1) に直して [0,5], [5,15], [15,45] の 3 区間で積分する
   （解析解のある 1s–1s と比べて機械精度で一致することを確認済み）．
   ======================================================================== */
function gauleg(n){
  const x = new Float64Array(n), w = new Float64Array(n), half = (n + 1) >> 1;
  for (let i = 0; i < half; i++){
    let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), z1, pp;
    do {
      let p1 = 1, p2 = 0;
      for (let j = 0; j < n; j++){
        const p3 = p2; p2 = p1;
        p1 = ((2*j + 1) * z * p2 - j * p3) / (j + 1);
      }
      pp = n * (z * p1 - p2) / (z * z - 1);
      z1 = z; z = z1 - p1 / pp;
    } while (Math.abs(z - z1) > 1e-15);
    x[i] = -z; x[n-1-i] = z;
    w[i] = 2 / ((1 - z*z) * pp * pp); w[n-1-i] = w[i];
  }
  return { x: x, w: w };
}
const GL = gauleg(24);
const UPANEL = [0, 5, 15, 45];

function overlap(oa, za, ob, zb, m, R){
  if (m > Math.min(oa.l, ob.l)) return 0;
  if (R < 1e-9) R = 1e-9;
  const gam = R * (za / oa.n + zb / ob.n) / 2;
  const pref = 2 * Math.PI * Nlm(oa.l, m) * Nlm(ob.l, m) * R * R * R / 8;
  let S = 0;
  for (let p = 0; p < 3; p++){
    const hu = (UPANEL[p+1] - UPANEL[p]) / 2, cu = (UPANEL[p+1] + UPANEL[p]) / 2;
    for (let i = 0; i < 24; i++){
      const xi = 1 + (cu + hu * GL.x[i]) / gam;
      const wxi = hu * GL.w[i] / gam;
      for (let j = 0; j < 24; j++){
        const eta = GL.x[j];
        const rA = R * (xi + eta) / 2, rB = R * (xi - eta) / 2;
        const ctA = (1 + xi * eta) / (xi + eta);
        const ctB = (xi * eta - 1) / (xi - eta);
        S += wxi * GL.w[j]
           * radEval(oa.n, oa.l, za, rA) * plm(oa.l, m, ctA)
           * radEval(ob.n, ob.l, zb, rB) * plm(ob.l, m, ctB)
           * (xi * xi - eta * eta);
      }
    }
  }
  return pref * S;
}

/* ---- S(R) 曲線（140 点）と，そこから読める量 ----
   同じ選択（軌道 A・B，m，Z′）に対しては 1 回だけ計算して使い回す． */
const curveCache = {};
function pairRmax(oa, za, ob, zb){
  return Math.min(40, 4 * (oa.n / za + ob.n / zb) + 6);
}
function getCurve(ia, za, ib, zb, m){
  const key = ia + ',' + ib + ',' + m + ',' + za.toFixed(2) + ',' + zb.toFixed(2);
  if (curveCache[key]) return curveCache[key];
  const oa = ORB[ia], ob = ORB[ib];
  const Rmax = pairRmax(oa, za, ob, zb), N = 140;
  const Rs = new Float64Array(N + 1), Ss = new Float64Array(N + 1);
  Rs[0] = 1e-4; Ss[0] = overlap(oa, za, ob, zb, m, 1e-4);   // 実質 R → 0 の極限
  for (let i = 1; i <= N; i++){
    Rs[i] = Rmax * i / N;
    Ss[i] = overlap(oa, za, ob, zb, m, Rs[i]);
  }
  /* |S| の最大と，符号が変わる R（隣り合う標本の間を割線法で 1 回締める） */
  let iMax = 0;
  for (let i = 0; i <= N; i++) if (Math.abs(Ss[i]) > Math.abs(Ss[iMax])) iMax = i;
  const zeros = [];
  for (let i = 1; i <= N; i++){
    if (Ss[i-1] !== 0 && Ss[i] !== 0 && (Ss[i-1] > 0) !== (Ss[i] > 0)){
      zeros.push(Rs[i-1] + (Rs[i] - Rs[i-1]) * Ss[i-1] / (Ss[i-1] - Ss[i]));
    }
  }
  const cv = { Rs: Rs, Ss: Ss, Rmax: Rmax, S0: Ss[0],
               maxAbs: Math.abs(Ss[iMax]), RmaxAbs: Rs[iMax], zeros: zeros };
  return (curveCache[key] = cv);
}
function curveAt(cv, R){
  const Rs = cv.Rs, n = Rs.length - 1;
  if (R <= Rs[0]) return cv.Ss[0];
  if (R >= Rs[n]) return cv.Ss[n];
  let lo = 0, hi = n;
  while (hi - lo > 1){ const mid = (lo + hi) >> 1; if (Rs[mid] <= R) lo = mid; else hi = mid; }
  const f = (R - Rs[lo]) / (Rs[hi] - Rs[lo]);
  return cv.Ss[lo] + f * (cv.Ss[hi] - cv.Ss[lo]);
}

/* ========================================================================
   3. 表示のヘルパ
   ======================================================================== */
function fmt(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
    return p[0] + '×10' + String(Number(p[1])).split('').map(function(c){ return SUP[c] || c; }).join('');
  }
  return String(Number(v.toPrecision(n)));
}
function el(tag, cls, html){

  if (html != null) e.innerHTML = html;

}

function Sim(key, root){
  this.key = key;            // 'meet' | 'curve'
  this.root = root;
  this.ia = 0;               // 軌道 A（ORB のインデックス）
  this.ib = 0;               // 軌道 B
  this.m  = 0;               // 結合軸まわりの |m|（σ=0, π=1, δ=2, φ=3）
  this.za = 1.0;             // 有効核電荷 Z′_A
  this.zb = 1.0;             // 有効核電荷 Z′_B
  this.R  = 1.4;             // 核間距離 [a₀]（既定は H₂ の平衡距離）
  this.pinned = [];          // ②：残した曲線
  this.hoverR = null;        // ②：カーソル位置の R
  this.drag = null;
  if (key === 'curve'){
    this.ia = 2; this.ib = 2;                       // 既定は 2p–2p σ
    this.pinned = [
      { ia:0, ib:0, m:0, za:1, zb:1 },              // 1s–1s
      { ia:2, ib:2, m:1, za:1, zb:1 }               // 2p–2p π
    ];
  }
  this.build();
  this.recompute();
}
Sim.prototype.oa = function(){ return ORB[this.ia]; };
Sim.prototype.ob = function(){ return ORB[this.ib]; };
Sim.prototype.mMax = function(){ return Math.min(this.oa().l, this.ob().l); };
Sim.prototype.label = function(p){
  p = p || this;
  const ztxt = (p.za !== 1 || p.zb !== 1)
    ? '（Z′ ' + Number(p.za).toFixed(2).replace(/\.?0+$/,'') + '/' + Number(p.zb).toFixed(2).replace(/\.?0+$/,'') + '）' : '';
  return ORB[p.ia].k + '–' + ORB[p.ib].k + ' ' + MTYPE[p.m] + ztxt;
};
Sim.prototype.curve = function(p){
  p = p || this;
  return getCurve(p.ia, p.za, p.ib, p.zb, p.m);
};

Sim.prototype.build = function(){

      '<span><i style="background:var(--neg)"></i>φ &lt; 0</span>' +
      '<span><i style="background:var(--nucA)"></i>原子核 A</span>' +
      '<span><i style="background:var(--nucB)"></i>原子核 B</span>' +

      '<span><i style="background:#9aa4b0"></i>残した曲線</span>' +

         '<mo stretchy="false">(</mo><mi mathvariant="bold">r</mi><mo stretchy="false">)</mo><mspace width="0.1667em"></mspace>' +
         '<msub><mi>φ</mi><mtext>B</mtext></msub>' +
         '<mo stretchy="false">(</mo><mi mathvariant="bold">r</mi><mo stretchy="false">)</mo><mspace width="0.1667em"></mspace>' +

       '<span class="cmt">中段が <i>φ</i><sub>A</sub>·<i>φ</i><sub>B</sub>．' +
       'この絵を空間全体で足し上げた 1 つの数が <i>S</i> です（実軌道なら ∗ は外れます）</span>')
    : ('<math display="block"><mrow>' +
         '<msub><mi>S</mi><mrow><mtext>1s–1s</mtext></mrow></msub><mo>=</mo>' +
         '<mrow><mo>(</mo><mn>1</mn><mo>+</mo><mi>ρ</mi><mo>+</mo>' +
         '<mfrac><msup><mi>ρ</mi><mn>2</mn></msup><mn>3</mn></mfrac><mo>)</mo></mrow>' +
         '<msup><mi>e</mi><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mi>ρ</mi></mrow></msup>' +
         '<mo>,</mo><mspace width="1.6em"></mspace>' +
         '<mi>ρ</mi><mo>=</mo><mfrac><mi>R</mi><msub><mi>a</mi><mn>0</mn></msub></mfrac>' +
       '</mrow></math>' +
       '<span class="cmt">1s–1s（Z′ = 1）は楕円座標で手計算できて，この閉じた式になります（講義第 5 回）．' +
       '数値計算はこの解析解と機械精度で一致します</span>')));

  /* ---------------- 右カラム ---------------- */
  const ctrl = el('div','controls');
  colSide.appendChild(ctrl);

  const mkOrbGrid = function(head, prop){
    ctrl.appendChild(el('p','ctlhead', head));
    const og = el('div','orbgrid');
    const btns = [];
    ORB.forEach(function(o, i){
      const b = el('button','orb', o.k);
      b.type = 'button';
      b.addEventListener('click', function(){
        self[prop] = i;
        if (self.m > self.mMax()) self.m = self.mMax();
        self.recompute();
      });
      og.appendChild(b); btns.push(b);
    });
    ctrl.appendChild(og);
    return btns;
  };
  this.aBtns = mkOrbGrid('軌道 A（左の原子）', 'ia');
  ctrl.appendChild(el('hr','sep'));
  this.bBtns = mkOrbGrid('軌道 B（右の原子）', 'ib');

  ctrl.appendChild(el('hr','sep'));
  ctrl.appendChild(el('p','ctlhead','結合の型（結合軸まわりの <span class="lc">m</span>）'));
  const mp = el('div','pills');
  this.mBtns = [];
  [0,1,2,3].forEach(function(mm){
    const b = el('button','pill', MTYPE[mm] + '（m = ' + (mm === 0 ? '0' : '±' + mm) + '）');

    b.addEventListener('click', function(){ self.m = mm; self.recompute(); });
    mp.appendChild(b); self.mBtns.push(b);
  });
  ctrl.appendChild(mp);
  ctrl.appendChild(el('span','hint',
    'm が違う軌道どうしの S は，φ 積分の直交性で厳密にゼロです．' +

  ctrl.appendChild(el('hr','sep'));
  ctrl.appendChild(el('p','ctlhead', this.key === 'meet' ? '距離と有効核電荷' : '有効核電荷'));

    rin.type = 'range'; rin.min = '0.2'; rin.max = '16'; rin.step = '0.02'; rin.value = String(this.R);
    rin.autocomplete = 'off';
    rin.addEventListener('input', function(){ self.R = Number(this.value); self.softUpdate(); });
    rrow.appendChild(rin); ctrl.appendChild(rrow);
    this.rin = rin;
  }

  const mkZ = function(label, prop){
    const row = el('div','ctlrow');
    const lab = el('span', null, '');
    row.appendChild(lab);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = '0.5'; inp.max = '4'; inp.step = '0.05'; inp.value = String(self[prop]);
    inp.autocomplete = 'off';
    inp.addEventListener('input', function(){
      self[prop] = Number(this.value);
      /* 曲線の再計算は 1 回 30 ms ほどなので，そのまま計算し直してよい */
      self.recompute();
    });
    row.appendChild(inp); ctrl.appendChild(row);
    return { lab: lab, inp: inp };
  };
  this.zaCtl = mkZ('Z′_A', 'za');
  this.zbCtl = mkZ('Z′_B', 'zb');
  ctrl.appendChild(el('span','hint',

  if (this.key === 'curve'){

        return p.ia === cur.ia && p.ib === cur.ib && p.m === cur.m && p.za === cur.za && p.zb === cur.zb;
      });
      if (dup){ self.pinHint.textContent = 'その曲線はもう残してあります．'; return; }
      if (self.pinned.length >= 7){ self.pinHint.textContent = '残せるのは 7 本までです．いったん消してください．'; return; }

      self.pinHint.textContent = '';

    });

    const cb = el('button','act','残した曲線を消す');
    cb.type = 'button';
    cb.addEventListener('click', function(){
      self.pinned = [];

    });

    ctrl.appendChild(row);
    this.pinHint = el('span','hint','はじめから 1s–1s と 2p–2p π を残してあります．2p–2p σ と見比べてみてください．');

  const dt = el('details','explain');
  dt.appendChild(el('summary', null, this.key === 'meet'

    : '曲線の読み方（指数減衰・直交性・Z′ の効果）'));
  dt.appendChild(el('div','body', this.key === 'meet' ? MEET_NOTES : CURVE_NOTES));
  this.root.appendChild(dt);

  /* ①：ドラッグで R を変える */
  if (this.key === 'meet'){
    const pd = function(e){
      const t = e.touches ? e.touches[0] : e;
      self.drag = { x: t.clientX, R: self.R };
      if (e.cancelable) e.preventDefault();
    };
    const pm = function(e){
      if (!self.drag) return;
      const t = e.touches ? e.touches[0] : e;
      const dR = (t.clientX - self.drag.x) / (self.scale || 20);
      self.R = Math.max(0.2, Math.min(self.curve().Rmax, self.drag.R + dR));
      self.rin.value = String(self.R);
      self.softUpdate();
      if (e.cancelable) e.preventDefault();
    };
    const pu = function(){ self.drag = null; };
    cv.addEventListener('mousedown', pd);
    window.addEventListener('mousemove', pm);
    window.addEventListener('mouseup', pu);
    cv.addEventListener('touchstart', pd, {passive:false});
    cv.addEventListener('touchmove', pm, {passive:false});
    window.addEventListener('touchend', pu);
  } else {
    cv.addEventListener('mousemove', function(e){
      const rect = cv.getBoundingClientRect();
      self.hoverR = self.pxToR((e.clientX - rect.left));
      self.draw(); self.updateReadout();
    });
    cv.addEventListener('mouseleave', function(){
      self.hoverR = null;
      self.draw(); self.updateReadout();
    });
  }
};

/* 選択が変わったとき：曲線を計算し直し，スライダーの上限も合わせる */
Sim.prototype.recompute = function(){
  if (this.m > this.mMax()) this.m = this.mMax();
  const cv = this.curve();
  if (this.key === 'meet'){
    this.rin.max = String(cv.Rmax);
    if (this.R > cv.Rmax){ this.R = cv.Rmax; this.rin.value = String(this.R); }
  }
  const self = this;
  this.aBtns.forEach(function(b, i){ b.classList.toggle('on', i === self.ia); });
  this.bBtns.forEach(function(b, i){ b.classList.toggle('on', i === self.ib); });
  this.mBtns.forEach(function(b, i){
    b.disabled = i > self.mMax();
    b.classList.toggle('on', i === self.m);
  });
  this.resize();
  this.softUpdate();
};
/* R だけが変わったとき（曲線は使い回す） */
Sim.prototype.softUpdate = function(){
  this.draw();
  this.updateReadout();
};

Sim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = (this.key === 'meet')
    ? Math.round(Math.max(430, Math.min(640, w * 0.82)))
    : Math.round(Math.max(340, Math.min(500, w * 0.62)));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  this.cv.width = Math.round(w * dpr);
  this.cv.height = Math.round(h * dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  this.draw();
};

Sim.prototype.draw = function(){
  if (!this.W) return;
  const c = this.ctx;
  c.clearRect(0, 0, this.W, this.H);
  if (this.key === 'meet') this.drawMeet(); else this.drawCurve();
};

/* ========================================================================
   6. タブ①：軌道の断面と積の色地図
   ------------------------------------------------------------------------
   上から  [A の軌道] [B の軌道] [積 φ_A·φ_B] [S(R) の小さな曲線]．
   上 3 枚は x–z 断面（z = 結合軸，横向き）．濃さはパネルごとに規格化して
   いるので，形は見えるが「積が小さくなっていく」ことは S の数値で読む．
   ======================================================================== */
Sim.prototype.drawMeet = function(){
  const c = this.ctx, W = this.W, H = this.H;
  const oa = this.oa(), ob = this.ob(), m = this.m, R = this.R;
  const gap = 8;
  const hA = Math.round(H * 0.155), hB = hA;
  const hD = Math.round(H * 0.185);
  const hC = H - hA - hB - hD - 3 * gap;
  const yA = 0, yB = hA + gap, yC = yB + hB + gap, yD = yC + hC + gap;

  /* 空間の窓：両方の軌道の裾が入るように */
  const mA = 3.4 * oa.n / this.za + 1.2;
  const mB = 3.4 * ob.n / this.zb + 1.2;
  const zmin = -mA, zmax = R + mB;
  this.scale = W / (zmax - zmin);                  // [px / a₀]（ドラッグでも使う）
  const zpx = function(z){ return (z - zmin) * this.scale; }.bind(this);

  const self = this;
  /* 1 枚ぶんの符号つきスカラー場を半解像度で描いて 2 倍に伸ばす */
  function drawField(y0, hPix, evalF){
    const gw = Math.max(2, W >> 1), gh = Math.max(2, hPix >> 1);
    const vals = new Float32Array(gw * gh);
    let vmax = 0;
    for (let j = 0; j < gh; j++){
      const x = ((j + 0.5) / gh - 0.5) * hPix / self.scale;   // 断面の横方向（x 座標）
      for (let i = 0; i < gw; i++){
        const z = zmin + (i + 0.5) / gw * (zmax - zmin);
        const v = evalF(x, z);
        vals[j * gw + i] = v;
        const av = Math.abs(v);
        if (av > vmax) vmax = av;
      }
    }
    const off = document.createElement('canvas');
    off.width = gw; off.height = gh;
    const octx = off.getContext('2d');
    const img = octx.createImageData(gw, gh);
    const d = img.data;
    for (let k = 0; k < vals.length; k++){
      const v = vals[k];
      const col = v >= 0 ? POSC : NEGC;
      const a = vmax > 0 ? Math.pow(Math.min(1, Math.abs(v) / vmax), 0.5) : 0;
      d[4*k] = col[0]; d[4*k + 1] = col[1]; d[4*k + 2] = col[2];
      d[4*k + 3] = Math.round(235 * a);
    }
    octx.putImageData(img, 0, 0);
    c.imageSmoothingEnabled = true;
    c.drawImage(off, 0, y0, W, hPix);
  }
  function nuclei(y0, hPix){
    const yc = y0 + hPix / 2;
    c.strokeStyle = 'rgba(31,35,40,.18)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, yc); c.lineTo(W, yc); c.stroke();     // 結合軸
    const draw = function(z, col, name){
      const x = zpx(z);
      c.fillStyle = col;
      c.beginPath(); c.arc(x, yc, 3.2, 0, 6.2832); c.fill();
      c.font = 'bold 10px ' + CFONT; c.textAlign = 'center';
      c.fillText(name, x, yc + 14);
    };
    draw(0, '#e53935', 'A');
    draw(R, '#6a3d9a', 'B');
  }
  function caption(y0, txt){
    c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
    c.fillText(txt, 8, y0 + 13);
  }
  function frame(y0, hPix){
    c.strokeStyle = 'rgba(31,35,40,.14)'; c.lineWidth = 1;
    c.strokeRect(0.5, y0 + 0.5, W - 1, hPix - 1);
  }

  const za = this.za, zb = this.zb;
  const fA = function(x, z){ return fieldVal(oa, za, m, x, z); };
  const fB = function(x, z){ return fieldVal(ob, zb, m, x, z - R); };

  drawField(yA, hA, fA); nuclei(yA, hA); frame(yA, hA);
  caption(yA, '軌道 A：' + oa.k + '（Z′ = ' + za.toFixed(2) + '）');
  drawField(yB, hB, fB); nuclei(yB, hB); frame(yB, hB);
  caption(yB, '軌道 B：' + ob.k + '（Z′ = ' + zb.toFixed(2) + '）');
  drawField(yC, hC, function(x, z){ return fA(x, z) * fB(x, z); });
  nuclei(yC, hC); frame(yC, hC);
  /* 表示する S は（曲線キャッシュの補間ではなく）毎回きちんと積分した値 */
  const S = this.Snow = overlap(oa, za, ob, zb, m, R);
  caption(yC, '積 φA·φB ―― これを足し上げると S = ' + fmt(S, 4));

  /* 目盛（1 / 5 / 10 a₀） */
  const bar1 = (zmax - zmin) > 30 ? 10 : (zmax - zmin) > 12 ? 5 : 1;
  const bpx = bar1 * this.scale;
  c.strokeStyle = 'rgba(31,35,40,.5)'; c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(W - 12 - bpx, yC + hC - 12); c.lineTo(W - 12, yC + hC - 12);
  c.moveTo(W - 12 - bpx, yC + hC - 16); c.lineTo(W - 12 - bpx, yC + hC - 8);
  c.moveTo(W - 12, yC + hC - 16); c.lineTo(W - 12, yC + hC - 8);
  c.stroke();
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'right';
  c.fillText(bar1 + ' a₀', W - 12, yC + hC - 20);

  /* ---- 下段：S(R) の小さな曲線と現在位置 ---- */
  const cv = this.curve();
  const padL = 34, padR = 10, padT = 6, padB = 13;
  const x0 = padL, x1 = W - padR, y0 = yD + padT, y1 = yD + hD - padB;
  frame(yD, hD);
  let smin = 0, smax = 1;
  for (let i = 0; i < cv.Ss.length; i++){
    if (cv.Ss[i] < smin) smin = cv.Ss[i];
    if (cv.Ss[i] > smax) smax = cv.Ss[i];
  }
  smin = Math.min(-0.05, smin * 1.12); smax = Math.max(0.1, smax * 1.06);
  const px = function(r){ return x0 + r / cv.Rmax * (x1 - x0); };
  const py = function(s){ return y1 - (s - smin) / (smax - smin) * (y1 - y0); };
  c.strokeStyle = 'rgba(31,35,40,.35)'; c.lineWidth = 1;
  c.setLineDash([5,4]);
  c.beginPath(); c.moveTo(x0, py(0)); c.lineTo(x1, py(0)); c.stroke();   // S = 0
  c.setLineDash([]);
  c.strokeStyle = '#0f4c81'; c.lineWidth = 1.8;
  c.beginPath();
  for (let i = 0; i < cv.Rs.length; i++){
    const X = px(cv.Rs[i]), Y = py(cv.Ss[i]);
    if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
  }
  c.stroke();
  c.fillStyle = '#f9a825';
  c.beginPath(); c.arc(px(Math.min(R, cv.Rmax)), py(S), 4, 0, 6.2832); c.fill();
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'left';  c.fillText('S(R)', x0 + 4, y0 + 10);
  c.textAlign = 'right'; c.fillText('R = ' + cv.Rmax.toFixed(0) + ' a₀', x1 - 2, y1 + 11);
  c.textAlign = 'left';  c.fillText('0', 2, py(0) + 3);
  c.fillText('1', 2, py(1) + 3);
};

/* ========================================================================
   7. タブ②：S(R) 曲線の重ね描き
   ======================================================================== */
Sim.prototype.plotGeom = function(){
  const padL = 44, padR = 12, padT = 10, padB = 26;
  let Rmax = this.curve().Rmax;
  const self = this;
  this.pinned.forEach(function(p){ Rmax = Math.max(Rmax, self.curve(p).Rmax); });
  return { x0: padL, x1: this.W - padR, y0: padT, y1: this.H - padB,
           Rmax: Rmax, Smin: -0.65, Smax: 1.05 };
};
Sim.prototype.pxToR = function(x){
  const g = this.plotGeom();
  return Math.max(0, Math.min(g.Rmax, (x - g.x0) / (g.x1 - g.x0) * g.Rmax));
};
Sim.prototype.drawCurve = function(){
  const c = this.ctx, g = this.plotGeom();
  const px = function(r){ return g.x0 + r / g.Rmax * (g.x1 - g.x0); };
  const py = function(s){ return g.y1 - (s - g.Smin) / (g.Smax - g.Smin) * (g.y1 - g.y0); };

  /* 枠と目盛 */
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(g.x0, g.y0, g.x1 - g.x0, g.y1 - g.y0);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  const step = g.Rmax > 24 ? 10 : g.Rmax > 12 ? 5 : 2;
  c.textAlign = 'center';
  for (let r = 0; r <= g.Rmax + 1e-9; r += step){
    const X = px(r);
    c.strokeStyle = 'rgba(31,35,40,.07)';
    c.beginPath(); c.moveTo(X, g.y0); c.lineTo(X, g.y1); c.stroke();
    c.fillText(String(r), X, g.y1 + 13);
  }
  c.textAlign = 'right';
  [1, 0.5, 0, -0.5].forEach(function(s){
    const Y = py(s);
    if (s === 0){ c.strokeStyle = 'rgba(31,35,40,.4)'; c.setLineDash([5,4]); }
    else c.strokeStyle = 'rgba(31,35,40,.07)';
    c.beginPath(); c.moveTo(g.x0, Y); c.lineTo(g.x1, Y); c.stroke();
    c.setLineDash([]);
    c.fillStyle = '#5c6670';
    c.fillText(String(s), g.x0 - 5, Y + 3);
  });
  c.textAlign = 'right'; c.fillText('R / a₀ →', g.x1 - 4, g.y1 - 5);
  c.textAlign = 'left';  c.fillText('重なり積分 S', g.x0 + 5, g.y0 + 12);

  const self = this;
  function stroke(cv, color, width){
    c.strokeStyle = color; c.lineWidth = width;
    c.beginPath();
    let started = false, lastY = null;
    for (let i = 0; i < cv.Rs.length; i++){
      if (cv.Rs[i] > g.Rmax) break;
      const X = px(cv.Rs[i]), Y = py(Math.max(g.Smin, Math.min(g.Smax, cv.Ss[i])));
      if (!started){ c.moveTo(X, Y); started = true; } else c.lineTo(X, Y);
      lastY = Y;
    }
    /* 標本の範囲（その組の Rmax）より先は，ほぼゼロの裾なので水平に延ばして描く */
    if (started && cv.Rmax < g.Rmax) c.lineTo(px(g.Rmax), lastY);
    c.stroke();
  }
  this.pinned.forEach(function(p, i){
    stroke(self.curve(p), PALETTE[i % PALETTE.length], 1.4);
  });
  stroke(this.curve(), '#0f4c81', 2.4);

  /* 凡例（図の右上） */
  c.font = 'bold 10px ' + CFONT; c.textAlign = 'left';
  let ly = g.y0 + 10;
  const lx = g.x1 - 168;
  c.fillStyle = '#0f4c81';
  c.fillText('■ ' + this.label(), lx, ly);
  this.pinned.forEach(function(p, i){
    ly += 13;
    c.fillStyle = PALETTE[i % PALETTE.length];
    c.fillText('■ ' + self.label(p), lx, ly);
  });

  /* カーソル位置の読み取り線 */
  if (this.hoverR != null){
    const X = px(this.hoverR);
    c.strokeStyle = 'rgba(31,35,40,.35)'; c.lineWidth = 1;
    c.setLineDash([3,3]);
    c.beginPath(); c.moveTo(X, g.y0); c.lineTo(X, g.y1); c.stroke();
    c.setLineDash([]);
    const mark = function(cv, color){
      const s = curveAt(cv, self.hoverR);
      c.fillStyle = color;
      c.beginPath(); c.arc(X, py(Math.max(g.Smin, Math.min(g.Smax, s))), 3.2, 0, 6.2832); c.fill();
    };
    this.pinned.forEach(function(p, i){ mark(self.curve(p), PALETTE[i % PALETTE.length]); });
    mark(this.curve(), '#0f4c81');
  }
};

/* ========================================================================
   8. 読み取り値
   ======================================================================== */
Sim.prototype.updateReadout = function(){
  const oa = this.oa(), ob = this.ob(), cv = this.curve();
  const R = [];
  if (this.key === 'meet'){
    const S = (this.Snow != null) ? this.Snow
            : overlap(oa, this.za, ob, this.zb, this.m, this.R);
    const s0txt = Math.abs(cv.S0 - 1) < 1e-6 ? '1（同じ軌道）'
                : Math.abs(cv.S0) < 1e-6 ? '0（同一中心で直交）'
                : fmt(cv.S0, 4);
    const kappa = Math.min(this.za / oa.n, this.zb / ob.n);
    R.push(['いまの組', this.label()]);
    R.push(['重なり積分 S', fmt(S, 4)]);
    R.push(['距離 R', fmt(this.R, 4) + ' a₀ ＝ ' + fmt(this.R * A0_PM, 4) + ' pm']);
    R.push(['R → 0 の極限', s0txt]);
    R.push(['|S| の最大', fmt(cv.maxAbs, 4) +
      (cv.RmaxAbs < 0.01 ? '（R → 0）' : '（R = ' + fmt(cv.RmaxAbs, 3) + ' a₀）')]);
    R.push(['S = 0 になる R', cv.zeros.length
      ? cv.zeros.map(function(z){ return fmt(z, 3); }).join(', ') + ' a₀' : 'なし（R > 0 で）']);
    R.push(['遠方の減衰', '∼ e^(−' + kappa.toFixed(2) + ' R/a₀)']);
  } else {
    const hr = this.hoverR;
    R.push(['カーソルの R', hr != null ? fmt(hr, 4) + ' a₀' : '—（図の上へ）']);
    R.push([this.label(), hr != null ? fmt(curveAt(cv, hr), 4) : '—']);
    const self = this;
    this.pinned.forEach(function(p){
      R.push([self.label(p), hr != null ? fmt(curveAt(self.curve(p), hr), 4) : '—']);
    });
    R.push(['|S| の最大（選択中）', fmt(cv.maxAbs, 4) +
      (cv.RmaxAbs < 0.01 ? '（R → 0）' : '（R = ' + fmt(cv.RmaxAbs, 3) + ' a₀）')]);
    R.push(['S = 0 になる R（選択中）', cv.zeros.length
      ? cv.zeros.map(function(z){ return fmt(z, 3); }).join(', ') + ' a₀' : 'なし（R > 0 で）']);
  }
  this.readout.innerHTML = R.map(function(r){
    return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
  if (this.key === 'meet'){
    this.rlab.textContent = 'R = ' + Number(this.R).toFixed(2) + ' a₀';
    this.zaCtl.lab.textContent = 'Z′_A = ' + Number(this.za).toFixed(2);
    this.zbCtl.lab.textContent = 'Z′_B = ' + Number(this.zb).toFixed(2);
  } else {
    this.zaCtl.lab.textContent = 'Z′_A = ' + Number(this.za).toFixed(2);
    this.zbCtl.lab.textContent = 'Z′_B = ' + Number(this.zb).toFixed(2);
  }
};

/* ========================================================================
   9. 立ち上げ
   ======================================================================== */
let only = null;
const mm = /[?&]only=(meet|curve)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');

const sims = {};
['meet', 'curve'].forEach(function(key){
  const p = app.querySelector('[data-panel="' + key + '"]');
  if (!p) return;
  if (only && only !== key){ p.parentNode.removeChild(p); return; }
  sims[key] = new Sim(key, p);
});

/* iframe に埋め込まれたとき，親ページへ必要な高さを知らせる */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let active = only || 'meet';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].resize(); sims[name].draw(); sims[name].updateReadout();
  postHeight();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].resize(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].recompute(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
