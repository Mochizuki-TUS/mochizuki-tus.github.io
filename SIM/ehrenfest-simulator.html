<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ehrenfest の定理 ― 質量を小さくすると軌道はぼやける</title>
<style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります．
   スタイルはすべて #qsim 配下にスコープしてあります．
   （直貼りするときは，下の html,body ブロックだけ削除してください）
   ========================================================================== */
html, body { margin:0; background:#fafafa; }

  --dot:#0f4c81;          /* 粒子 */
  --mark:#f9a825;
  --warn:#8a5a00;
  --warnbg:#fdf5e3;
  --shadow:0 14px 32px rgba(20,34,51,.08);
  --radius-md:14px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;

/* --- 右カラム --- */

/* --- 左カラム --- */
#qsim .stage{

}

#qsim .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.75rem;

#qsim .live{
  display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:9px; font-size:.76rem;

/* 数式はブラウザ標準の MathML．数式フォントを明示しないと根号や括弧が

}

/* 本文中の変数．text-transform:math-auto で 1 文字を数式イタリック
   （Unicode の Mathematical Italic）へ写像すると，MathML の <mi> と

  font-size:1.05em; font-style:italic;
}

#qsim .explain{

}
#qsim .explain > summary{

  color:var(--accent-strong);
}
#qsim .explain > summary::-webkit-details-marker{display:none}

#qsim .explain[open] > summary::before{content:"▼ "}
#qsim .explain[open] > summary{border-bottom:1px solid var(--line)}
#qsim .explain .body{padding:4px 0 12px}
#qsim .note{
  font-size:.78rem; color:var(--sub); background:var(--panel-soft);
  border-left:3px solid var(--line); border-radius:0 8px 8px 0;
  padding:8px 12px; margin:9px 0;
}

</style>
</head>
<body>
<div id="qsim">
  <h1>Ehrenfest の定理 ― 質量を小さくすると軌道はぼやける</h1>
  <p class="lead">
    原点から初速 <i>v</i><sub>0</sub>，角度 θ で質量 <i>m</i> の粒子を投げ上げます．
    古典力学なら放物線を描くだけですが，量子力学では波束が広がるため，
    <b>どこを通るかがぼやけます</b>．質量を変えて，古典力学がどこから成り立つのかを見てください．
  </p>

  <section class="panel"></section>

  <p class="foot">
    一様重力場 <i>V</i> = <i>m</i><i>g</i><i>y</i> では Schrödinger 方程式が厳密に解けるので，
    このページの波束はすべて厳密解です（数値近似はしていません）．
  </p>
</div>

<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数
   ======================================================================== */
const HBAR = 1.054571817e-34;      // ディラック定数 [J s]
const H_P  = 6.62607015e-34;       // Planck 定数 [J s]
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

const M_MIN = 1e-40, M_MAX = 1;    // 質量スライダーの範囲 [kg]

const PRESETS = [
  { name:'野球ボール（145 g）',        m:0.145 },
  { name:'米粒（20 mg）',              m:2e-5 },
  { name:'微粒子（1 µg）',             m:1e-9 },
  { name:'大腸菌（1 pg）',             m:1e-15 },
  { name:'ウイルス（1 fg）',           m:1e-18 },
  { name:'C60 フラーレン',             m:1.19680e-24 },
  { name:'陽子',                       m:1.67262192369e-27 },
  { name:'電子',                       m:9.1093837015e-31 },
  { name:'電子の 10⁻³ 倍（仮想）',     m:9.1093837015e-34 },
  { name:'電子の 10⁻⁶ 倍（仮想）',     m:9.1093837015e-37 }
];
/* 質量帯に目印を出すもの */
const STRIP_MARKS = [
  { lab:'電子',   m:9.1093837015e-31 },
  { lab:'陽子',   m:1.67262192369e-27 },
  { lab:'C60',    m:1.19680e-24 },
  { lab:'大腸菌', m:1e-15 },
  { lab:'1 µg',   m:1e-9 },
  { lab:'ボール', m:0.145 }
];

/* ========================================================================
   1. 表示ユーティリティ
   ======================================================================== */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³',
             '4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function supStr(n){ return String(n).split('').map(function(c){ return SUP[c] || c; }).join(''); }

function fmtNum(v, n){
  n = n || 4;
  if (!isFinite(v)) return '&mdash;';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10<sup>' + Number(p[1]) + '</sup>';
  }
  return String(Number(v.toPrecision(n)));
}
function fmtNumPlain(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10' + supStr(Number(p[1]));
  }
  return String(Number(v.toPrecision(n)));
}

const LEN_TBL = [[1e3,'km'],[1,'m'],[1e-2,'cm'],[1e-3,'mm'],[1e-6,'µm'],
                 [1e-9,'nm'],[1e-12,'pm'],[1e-15,'fm']];
function lenUnit(v){
  const a = Math.abs(v);
  for (let i = 0; i < LEN_TBL.length; i++) if (a >= LEN_TBL[i][0]) return LEN_TBL[i];
  return LEN_TBL[LEN_TBL.length - 1];
}
function fmtLen(v, n){
  if (!isFinite(v)) return '&mdash;';
  if (v === 0) return '0 m';
  const u = lenUnit(v);
  if (Math.abs(v) < 1e-16) return fmtNum(v, n) + ' m';
  return fmtNum(v / u[0], n || 4) + ' ' + u[1];
}
function fmtLenPlain(v, n){
  if (!isFinite(v)) return '—';
  if (v === 0) return '0 m';
  const u = lenUnit(v);
  if (Math.abs(v) < 1e-16) return fmtNumPlain(v, n) + ' m';
  return fmtNumPlain(v / u[0], n || 3) + ' ' + u[1];
}
function fmtTime(v, n){
  if (!isFinite(v)) return '&mdash;';
  const a = Math.abs(v);
  if (a >= 1)    return fmtNum(v, n) + ' s';
  if (a >= 1e-3) return fmtNum(v * 1e3, n) + ' ms';
  if (a >= 1e-6) return fmtNum(v * 1e6, n) + ' µs';
  return fmtNum(v * 1e9, n) + ' ns';
}
function niceStep(raw){
  const e = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / e;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e;
}
function el(tag, cls, html){
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}

/* 正規乱数（Box-Muller，2 値とも使う） */
let gSpare = null;
function gauss(){
  if (gSpare !== null){ const v = gSpare; gSpare = null; return v; }
  let u = 0;
  while (u <= 0) u = Math.random();
  const v = Math.random(), r = Math.sqrt(-2 * Math.log(u));
  gSpare = r * Math.sin(2 * Math.PI * v);
  return r * Math.cos(2 * Math.PI * v);
}

/* ========================================================================
   2. 物理
   ---------------------------------------------------------------------
   V(x,y) = m g y（一様重力場）．x と y は分離できて，y 方向は
       ψ(y,t) = exp(i[-mgty/ħ - mg²t³/6ħ]) · φ(y + gt²/2, t)
   の変換で自由粒子の φ に帰着する（Avron–Herbst）．よって

     ・中心 : ⟨y⟩ = y0 + v_y0 t − gt²/2      … 厳密に古典解
     ・幅   : σ(t) = √(σ0² + (ħt/2mσ0)²)     … 自由粒子と同じ（重力は無関係）

   さらに V が y の 1 次までなので，Wigner 関数は古典 Liouville 方程式に
   厳密に従う．つまり「初期の位置と速度を Gauss 分布からサンプルして
   古典的に飛ばす」だけで，各時刻の分布が |ψ|² と厳密に一致する．
   （Node で split-step 法と 10 桁まで照合済み）
   ======================================================================== */
function derive(P){
  const s = Math.sin(P.th), c = Math.cos(P.th);
  const T = 2 * P.v0 * s / P.g;                 // 古典的な飛行時間
  const R = P.v0 * P.v0 * Math.sin(2 * P.th) / P.g;
  const Hm = P.v0 * P.v0 * s * s / (2 * P.g);
  return {
    T: T, R: R, Hm: Hm,
    vx: P.v0 * c, vy: P.v0 * s,
    scale: Math.max(R, 2 * Hm, 1e-30),          // 軌道全体の大きさの目安
    sigOpt: Math.sqrt(HBAR * T / (2 * P.m)),    // σ(T) を最小にする σ0
    lamDB: H_P / (P.m * P.v0)
  };
}
function sigAt(P, t){                            // 波束の広がり
  const dv = HBAR / (2 * P.m * P.sig0);
  return Math.sqrt(P.sig0 * P.sig0 + dv * t * dv * t);
}
function dvOf(P){ return HBAR / (2 * P.m * P.sig0); }

/* 位相空間からのサンプリング（= |ψ|² からのサンプリング） */
function sample(P, D){
  const dv = dvOf(P);
  const x0 = P.sig0 * gauss(), y0 = P.sig0 * gauss();
  const vx = D.vx + dv * gauss(), vy = D.vy + dv * gauss();
  const disc = vy * vy + 2 * P.g * y0;
  let tl = NaN;
  if (disc >= 0){
    const r = (vy + Math.sqrt(disc)) / P.g;      // y = 0 を下向きに横切る時刻
    if (r > 0) tl = r;
  }
  return { x0:x0, y0:y0, vx:vx, vy:vy, tl:tl, xl: isFinite(tl) ? x0 + vx * tl : NaN };
}

/* ========================================================================
   3. 入力欄
   ======================================================================== */
function makeNumField(labelHtml, unitHtml, hintHtml){
  const f = el('label','fld');
  f.appendChild(el('b', null, labelHtml));
  const box = el('div','inp');
  const inp = el('input');
  inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off';
  box.appendChild(inp);
  if (unitHtml) box.appendChild(el('span','unit', unitHtml));
  f.appendChild(box);
  if (hintHtml) f.appendChild(el('span','hint', hintHtml));
  f.inp = inp;
  f.get = function(){ const v = parseFloat(inp.value.replace(/[, ]/g,'')); return isFinite(v) ? v : NaN; };
  f.set = function(v, n){ inp.value = String(Number(v.toPrecision(n || 6))); };
  return f;
}
/* 単位つき長さ入力（数値 + 単位セレクト） */
function makeLenField(labelHtml, hintHtml){
  const f = el('label','fld');
  f.appendChild(el('b', null, labelHtml));
  const box = el('div','inp');
  const inp = el('input');
  inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off';
  const sel = el('select','unit');
  sel.autocomplete = 'off';
  LEN_TBL.forEach(function(u){
    const o = el('option', null, u[1]); o.value = String(u[0]); sel.appendChild(o);
  });
  sel.value = '1';
  box.appendChild(inp); box.appendChild(sel);
  f.appendChild(box);
  if (hintHtml) f.appendChild(el('span','hint', hintHtml));
  f.inp = inp; f.sel = sel;
  f.get = function(){
    const v = parseFloat(inp.value.replace(/[, ]/g,''));
    return isFinite(v) ? v * Number(sel.value) : NaN;
  };
  f.set = function(v){
    const u = lenUnit(v);
    sel.value = String(u[0]);
    inp.value = String(Number((v / u[0]).toPrecision(5)));
  };
  return f;
}

/* ========================================================================
   4. シミュレーター本体
   ======================================================================== */
function Sim(root){
  const self = this;
  this.root = root;
  this.dpr = Math.min(window.devicePixelRatio || 1, 2);

  const layout  = el('div','layout');
  const colMain = el('div','col-main');
  const colSide = el('aside','col-side');
  layout.appendChild(colMain); layout.appendChild(colSide);
  root.appendChild(layout);

  const stage = el('div','stage');
  const cv = el('canvas');
  stage.appendChild(cv); colMain.appendChild(stage);

  colMain.appendChild(el('div','legend',
    '<span><i style="background:var(--cls)"></i>古典的な軌道（Newton）</span>' +
    '<span><i class="sq" style="background:rgba(106,61,154,.55)"></i>|ψ|<sup>2</sup>（波束）</span>' +
    '<span><i class="sq" style="background:rgba(106,61,154,.16)"></i>±1σ / ±2σ の帯</span>' +
    '<span><i class="sq" style="background:var(--dot)"></i>1 個ずつ飛ばした粒子</span>' +
    '<span>下段：地面に着いた位置の分布</span>'));

  /* 経過時間などの live 表示 */
  const live = el('div','live');
  const liveT   = el('b', null, '0 s');
  const liveXY  = el('b', null, '—');
  const liveSig = el('b', null, '—');
  const livePy  = el('b', null, '—');
  const liveN   = el('b', null, '0');
  [['経過時間', liveT], ['⟨x⟩, ⟨y⟩', liveXY], ['広がり σ(t)', liveSig],
   ['⟨p<sub>y</sub>⟩', livePy], ['着地した粒子', liveN]].forEach(function(p){
    const s = el('span', null, p[0]); s.appendChild(p[1]); live.appendChild(s);
  });
  colMain.appendChild(live);

  const readout = el('div','readout');
  colMain.appendChild(readout);

  colMain.appendChild(el('div','eq',
    '<math display="block"><mrow>' +
      '<mi>σ</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo>' +
      '<msqrt><mrow>' +
        '<msubsup><mi>σ</mi><mn>0</mn><mn>2</mn></msubsup><mo>+</mo>' +
        '<msup><mrow><mo>(</mo><mfrac>' +

/* ---------------- パラメーター ---------------- */
Sim.prototype.syncMassSlider = function(){
  const m = this.fM.get();
  if (!(m > 0)) return;
  const v = Math.log(Math.min(M_MAX, Math.max(M_MIN, m)) / M_MIN) / Math.log(M_MAX / M_MIN);
  this.mSlider.value = String(Math.round(v * 1000));
};

Sim.prototype.readParams = function(){
  const m = this.fM.get(), v0 = this.fV.get(), thd = this.fTh.get(), g = this.fG.get();
  this.ok = (m > 0 && v0 > 0 && g > 0 && thd > 0 && thd <= 90 &&
             isFinite(m) && isFinite(v0) && isFinite(g));
  if (!this.ok) return;
  this.P = { m:m, v0:v0, th:thd * Math.PI / 180, g:g, sig0:1 };
  this.D = derive(this.P);
  if (this.chkAuto.checked){
    this.P.sig0 = this.D.sigOpt;
    this.fS.set(this.P.sig0);
  } else {
    const s = this.fS.get();
    this.P.sig0 = (s > 0 && isFinite(s)) ? s : this.D.sigOpt;
  }
  /* 着地時刻もばらつくので，ほぼ全部が着地するまで再生する．
     t_land = [v_y + √(v_y²+2g y₀)]/g を線形化すると
       σ_t ≈ √( (2Δv/g)² + (σ₀/v_y)² )   */
  const dv = dvOf(this.P);
  const sigT_ = Math.sqrt(Math.pow(2 * dv / this.P.g, 2) +
                          Math.pow(this.P.sig0 / Math.max(this.D.vy, 1e-30), 2));
  this.Tend = Math.min(3 * this.D.T, Math.max(1.02 * this.D.T, this.D.T + 4 * sigT_));
  this.sigT = sigAt(this.P, this.D.T);
  this.sigEnd = sigAt(this.P, this.Tend);
  this.blur = this.sigT / this.D.scale;
};

/* 表示範囲（等スケール） */
Sim.prototype.setView = function(){
  const D = this.D, pad = 2.2 * this.sigEnd;
  let xlo, xhi;
  if (this.chkMan.checked){
    xlo = this.fX0.get(); xhi = this.fX1.get();
    if (!(isFinite(xlo) && isFinite(xhi) && xhi > xlo)){ xlo = -pad; xhi = D.R + pad; }
  } else {
    const ref = Math.max(D.scale, pad);
    xlo = -pad - 0.04 * ref;
    xhi = D.R + pad + 0.04 * ref;
    this.fX0.set(xlo); this.fX1.set(xhi);
  }
  const pw = this.xR - this.xL, ph = this.yA1 - this.yA0;
  const need = Math.max(xhi - xlo, 1e-30);
  let s = pw / need;                                  // px / m
  if (!this.chkMan.checked){
    const ref = Math.max(D.scale, pad);
    const ylo = -pad - 0.04 * ref;
    const yhi = D.Hm + pad + 0.04 * ref;
    s = Math.min(s, ph / Math.max(yhi - ylo, 1e-30));
    this.ymid = (ylo + yhi) / 2;
  } else {
    /* 手動のときは地面を下から 20 % の高さに置く */
    this.ymid = (ph * 0.5 - ph * 0.20) / s;
  }
  this.s = s;
  this.xmid = (xlo + xhi) / 2;
  this.cxPix = (this.xL + this.xR) / 2;
  this.cyPix = (this.yA0 + this.yA1) / 2;
};
Sim.prototype.PX = function(x){ return this.cxPix + (x - this.xmid) * this.s; };
Sim.prototype.PY = function(y){ return this.cyPix - (y - this.ymid) * this.s; };

Sim.prototype.recompute = function(resetShots){
  this.readParams();
  if (this.ok){
    this.setView();
    if (resetShots !== false){ this.resetRecords(); this.t = 0; this.newBatch(); }
  }
  /* 実測値（着地点の平均など）は draw の中で数えるので，読み取り値はその後で */
  this.draw();
  this.updateReadout();
};

/* ---------------- 粒子 ---------------- */
Sim.prototype.newBatch = function(){
  this.shots = [];
  this.committed = false;
  if (!this.ok) return;
  const n = parseInt(this.nSel.value, 10) || 1;
  for (let i = 0; i < n; i++) this.shots.push(sample(this.P, this.D));
};
/* この回の粒子を記録へ移す．committed で二重計上を防ぐ
   （繰り返し再生を切っていると，同じ回に対して何度も呼ばれうるため）． */
Sim.prototype.commitBatch = function(){
  if (this.committed) return;
  this.committed = true;
  for (let i = 0; i < this.shots.length; i++){
    const s = this.shots[i];
    if (isFinite(s.xl)) this.landed.push(s.xl); else this.notLanded++;
  }
  /* 上限を超えたら古い順に捨てる．このとき長さが 400000 のまま変わらなくなり，
     長さをキーにしているヒストグラムのキャッシュが効いたままになるので，明示的に捨てる． */
  if (this.landed.length > 400000){
    this.landed.splice(0, this.landed.length - 400000);
    this._bk = null;
  }
};
Sim.prototype.bulk = function(n){
  if (!this.ok) return;
  for (let i = 0; i < n; i++){
    const s = sample(this.P, this.D);
    if (isFinite(s.xl)) this.landed.push(s.xl); else this.notLanded++;
  }
  this.draw();
  this.updateReadout();
};
Sim.prototype.resetRecords = function(){
  this.landed = []; this.notLanded = 0;
  this._bk = null;
  this.nLanded = 0; this.hMean = NaN; this.hSd = NaN;
  this.clearTrail();
  this.newBatch();
};
Sim.prototype.clearTrail = function(){
  if (this.trail.width) this.trail.getContext('2d').clearRect(0, 0, this.trail.width, this.trail.height);
};

Sim.prototype.togglePlay = function(){
  if (!this.ok) return;
  this.playing = !this.playing;
  if (this.playing && this.t >= this.Tend){ this.t = 0; this.commitBatch(); this.newBatch(); }
  this.btnPlay.textContent = this.playing ? '⏸ 停止' : '▶ 再生';
  this.btnPlay.classList.toggle('primary', !this.playing);
  this.btnPlay.classList.toggle('on', this.playing);
  if (this.playing) kick();
};
Sim.prototype.rewind = function(){
  this.t = 0;
  this.newBatch();
  this.tSlider.value = '0';
  this.draw();
  if (this.playing) kick();
};

Sim.prototype.step = function(dtWall){
  if (!this.playing || !this.ok) return;
  const dur = Number(this.dSel.value) || 7;
  this.t += dtWall * this.Tend / dur;
  if (this.t >= this.Tend){
    this.paintTrail();
    this.commitBatch();
    if (this.chkLoop.checked){ this.t = 0; this.newBatch(); }
    else {
      this.t = this.Tend; this.playing = false;
      this.btnPlay.textContent = '▶ 再生';
      this.btnPlay.classList.add('primary'); this.btnPlay.classList.remove('on');
    }
  }
  this.tSlider.value = String(Math.round(this.t / this.Tend * 1000));
};

/* ---------------- レイアウト ---------------- */
Sim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = Math.round(Math.max(470, Math.min(680, w * 0.68)));
  if (this.W === w && this.Hc === h) return;
  this.W = w; this.Hc = h;
  this.cv.width  = Math.round(w * this.dpr);
  this.cv.height = Math.round(h * this.dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  this.trail.width = this.cv.width; this.trail.height = this.cv.height;
  this.trail.getContext('2d').setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

  const padT = 16, padB = 8, strip = 74;
  this.xL = 58; this.xR = w - 16;
  const usable = h - padT - padB - strip;
  this.yA0 = padT;
  this.yA1 = padT + Math.round(0.70 * (usable - 40));
  this.yB0 = this.yA1 + 30;
  this.yB1 = padT + usable - 12;
  this.yS0 = h - strip + 28;                    // 質量帯（バー上端）
  this.yS1 = this.yS0 + 17;

  if (this.P === undefined) this.recompute(true);
  else { this.setView(); this.clearTrail(); this.draw(); }
};

Sim.prototype.css = function(name){
  if (!this._c) this._c = {};
  if (this._c[name] === undefined){
    this._c[name] = getComputedStyle(document.getElementById('qsim'))
                      .getPropertyValue(name).trim() || '#888';
  }
  return this._c[name];
};

/* ========================================================================
   5. 描画
   ======================================================================== */
Sim.prototype.draw = function(){
  const c = this.ctx, W = this.W, H = this.Hc;
  c.clearRect(0, 0, W, H);
  c.fillStyle = this.css('--panel'); c.fillRect(0, 0, W, H);
  if (!this.ok){
    c.fillStyle = this.css('--sub'); c.font = '14px ' + CFONT; c.textAlign = 'center';
    c.fillText('m, v₀, g は正の値，θ は 0 < θ ≤ 90 の範囲で入力してください．', W / 2, H / 2);
    return;
  }
  this.drawScene();
  this.drawHist();
  this.drawStrip();
  this.updateLive();
};

/** 上段：x–y 平面 */
Sim.prototype.drawScene = function(){
  const c = this.ctx, P = this.P, D = this.D;
  const x0 = this.xL, x1 = this.xR, y0 = this.yA0, y1 = this.yA1;
  const sub = this.css('--sub'), line = this.css('--line');
  const self = this;

  c.save();
  c.beginPath(); c.rect(x0, y0, x1 - x0, y1 - y0); c.clip();

  /* 地面 */
  const gy = this.PY(0);
  c.fillStyle = 'rgba(31,35,40,.045)';
  c.fillRect(x0, gy, x1 - x0, y1 - gy);
  c.strokeStyle = line; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(x0, gy); c.lineTo(x1, gy); c.stroke();

  /* ±1σ / ±2σ の帯 */
  if (this.chkBand.checked) this.drawBand();

  /* 通った跡（別キャンバスに貯めてある） */
  if (this.chkTrail.checked && this.trail.width){
    c.drawImage(this.trail, 0, 0, this.W, this.Hc);
  }

  /* 古典軌道（地面に着くところまで） */
  c.strokeStyle = this.css('--cls'); c.lineWidth = 1.8;
  c.beginPath();
  for (let i = 0; i <= 220; i++){
    const t = D.T * i / 220;
    const px = this.PX(D.vx * t), py = this.PY(D.vy * t - 0.5 * P.g * t * t);
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.stroke();

  /* 古典的な着地点 */
  const rx = this.PX(D.R);
  c.strokeStyle = this.css('--cls'); c.lineWidth = 1.2; c.setLineDash([3,3]);
  c.beginPath(); c.moveTo(rx, gy - 9); c.lineTo(rx, gy + 9); c.stroke(); c.setLineDash([]);

  /* 現在パスの粒子 */
  this.drawShots(c, this.t, false);

  /* 波束の雲 */
  const t = this.t;
  const cx = this.PX(D.vx * t), cy = this.PY(D.vy * t - 0.5 * P.g * t * t);
  const sg = sigAt(P, t) * this.s;
  this.blob(c, cx, cy, sg);

  c.restore();

  /* 枠と軸 */
  c.strokeStyle = line; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);

  /* x 目盛り（地面の上） */
  const xlo = this.xmid - (this.cxPix - x0) / this.s;
  const xhi = this.xmid + (x1 - this.cxPix) / this.s;
  const stepX = niceStep((xhi - xlo) / 6);
  const u = lenUnit(Math.max(Math.abs(xlo), Math.abs(xhi)));
  c.fillStyle = sub; c.font = '10px ' + CFONT; c.textAlign = 'center';
  for (let k = Math.ceil(xlo / stepX); k * stepX <= xhi; k++){
    const v = k * stepX, px = this.PX(v);
    c.strokeStyle = line; c.globalAlpha = 0.45;
    c.beginPath(); c.moveTo(px, gy - 3); c.lineTo(px, gy + 3); c.stroke();
    c.globalAlpha = 1;
    if (gy < y1 - 14) c.fillText(fmtNumPlain(v / u[0], 3), px, Math.min(y1 - 4, gy + 14));
  }
  c.textAlign = 'left'; c.font = '10.5px ' + CFONT;
  c.fillText('位置 x [' + u[1] + ']', x0 + 6, y1 - 7);
  c.save();
  c.translate(15, (y0 + y1) / 2); c.rotate(-Math.PI / 2); c.textAlign = 'center';
  c.fillText('高さ y  →', 0, 0);
  c.restore();

  /* 縮尺バー */
  const barM = niceStep((xhi - xlo) / 5), barPx = barM * this.s;
  if (barPx > 24 && barPx < (x1 - x0) * 0.6){
    const bx = x1 - 14 - barPx, by = y0 + 16;
    c.strokeStyle = sub; c.lineWidth = 1.4;
    c.beginPath();
    c.moveTo(bx, by + 4); c.lineTo(bx, by); c.lineTo(bx + barPx, by); c.lineTo(bx + barPx, by + 4);
    c.stroke();
    c.fillStyle = sub; c.font = '10px ' + CFONT; c.textAlign = 'center';
    c.fillText(fmtLenPlain(barM, 2), bx + barPx / 2, by - 3);
  }

  /* 判定ラベル */
  const lab = this.blur < 1e-3 ? ['ほぼ完全に古典的な放物線', 'rgba(15,76,129,.85)']
            : this.blur < 0.08 ? ['軌道はまだ見えるが，ぼやけている', 'rgba(106,61,154,.9)']
            : ['もはや「軌道」とは呼べない', '#b3261e'];
  c.font = 'bold 11.5px ' + CFONT; c.textAlign = 'left'; c.fillStyle = lab[1];
  c.fillText(lab[0], x0 + 8, y0 + 16);
  c.font = '10.5px ' + CFONT; c.fillStyle = sub;
  c.fillText('ぼやけ σ(T)/（軌道の大きさ）= ' + fmtNumPlain(this.blur, 2), x0 + 8, y0 + 31);
};

/** 波束の雲（等方 Gauss なので放射グラデーション 1 枚で描ける） */
Sim.prototype.blob = function(c, cx, cy, sg){
  if (!isFinite(cx) || !isFinite(cy)) return;
  const R3 = Math.min(sg * 3, 6000);
  if (R3 < 1.2){
    c.fillStyle = 'rgba(106,61,154,.95)';
    c.beginPath(); c.arc(cx, cy, 2.2, 0, 6.2832); c.fill();
    return;
  }
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, R3);
  for (let k = 0; k <= 10; k++){
    const s = k / 10;
    g.addColorStop(s, 'rgba(106,61,154,' + (0.62 * Math.exp(-4.5 * s * s)).toFixed(4) + ')');
  }
  c.fillStyle = g;
  c.beginPath(); c.arc(cx, cy, R3, 0, 6.2832); c.fill();
};

/** ±kσ の帯．
    波束は等方なので，この帯は「半径 kσ(t) の円が軌道に沿って掃いた領域」＝円の合併．
    法線方向のオフセット曲線で描くと，σ が曲率半径より大きいときに自己交差して
    蝶のような形に化けるので，円をすべて同じ向きの部分パスとして積み，
    nonzero の巻き数規則で 1 回だけ塗る（＝正しい合併になる）． */
Sim.prototype.drawBand = function(){
  const c = this.ctx, P = this.P, D = this.D;
  const N = 130;
  const fill = function(k, alpha){
    c.beginPath();
    for (let i = 0; i <= N; i++){
      const t = D.T * i / N;
      const cx = this.PX(D.vx * t);
      const cy = this.PY(D.vy * t - 0.5 * P.g * t * t);
      const r = k * sigAt(P, t) * this.s;
      if (!(r > 0.4) || !isFinite(cx) || !isFinite(cy)) continue;
      c.moveTo(cx + r, cy);                    // 部分パスを分ける
      c.arc(cx, cy, Math.min(r, 20000), 0, 6.2832);
    }
    c.fillStyle = 'rgba(106,61,154,' + alpha + ')';
    c.fill();                                  // 既定の nonzero
  }.bind(this);
  fill(2, 0.09);
  fill(1, 0.13);
};

/** サンプルした粒子（経路と現在位置） */
Sim.prototype.drawShots = function(c, t, faded){
  const P = this.P, S = this.shots;
  if (!S.length) return;
  const NP = 34;
  c.lineWidth = 1;
  c.strokeStyle = faded ? 'rgba(15,76,129,.13)' : 'rgba(15,76,129,.30)';
  for (let i = 0; i < S.length; i++){
    const s = S[i];
    const te = isFinite(s.tl) ? Math.min(t, s.tl) : t;
    if (te <= 0) continue;
    c.beginPath();
    for (let j = 0; j <= NP; j++){
      const tt = te * j / NP;
      const px = this.PX(s.x0 + s.vx * tt);
      const py = this.PY(s.y0 + s.vy * tt - 0.5 * P.g * tt * tt);
      if (j === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.stroke();
  }
  /* 現在位置 / 着地マーク */
  for (let i = 0; i < S.length; i++){
    const s = S[i];
    const landed = isFinite(s.tl) && t >= s.tl;
    const te = landed ? s.tl : t;
    const px = this.PX(s.x0 + s.vx * te);
    const py = this.PY(s.y0 + s.vy * te - 0.5 * P.g * te * te);
    if (landed){
      c.fillStyle = faded ? 'rgba(15,76,129,.28)' : 'rgba(15,76,129,.6)';
      c.beginPath(); c.arc(px, py, 1.8, 0, 6.2832); c.fill();
    } else if (!faded){
      c.fillStyle = this.css('--dot');
      c.beginPath(); c.arc(px, py, 2.6, 0, 6.2832); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 1;
      c.beginPath(); c.arc(px, py, 2.6, 0, 6.2832); c.stroke();
    }
  }
};

/** 1 パス終了時に，その経路を跡キャンバスへ焼き付ける */
Sim.prototype.paintTrail = function(){
  if (!this.chkTrail.checked || !this.trail.width) return;
  const c = this.trail.getContext('2d');
  c.save();
  c.beginPath();
  c.rect(this.xL, this.yA0, this.xR - this.xL, this.yA1 - this.yA0);
  c.clip();
  this.drawShots(c, this.Tend, true);
  c.restore();
};

/** 下段：着地点のヒストグラム（x 軸は上段と共通） */
Sim.prototype.drawHist = function(){
  const c = this.ctx;
  const x0 = this.xL, x1 = this.xR, y0 = this.yB0, y1 = this.yB1;
  const sub = this.css('--sub'), line = this.css('--line');
  const plotW = x1 - x0, plotH = y1 - y0;

  c.strokeStyle = line; c.lineWidth = 1; c.strokeRect(x0, y0, plotW, plotH);

  /* ビン分け（画面座標で等分）．
     過去のパス分は数が多いので，内容が変わったときだけ数え直してキャッシュする． */
  const NB = Math.max(24, Math.min(140, Math.round(plotW / 7)));
  const xlo = this.xmid - (this.cxPix - x0) / this.s;
  const xhi = this.xmid + (x1 - this.cxPix) / this.s;
  const span = xhi - xlo;

  const key = this.landed.length + '|' + NB + '|' + xlo + '|' + span;
  if (this._bk !== key){
    const b = new Int32Array(NB);
    let s1 = 0, s2 = 0;
    for (let i = 0; i < this.landed.length; i++){
      const v = this.landed[i];
      s1 += v; s2 += v * v;
      const k = Math.floor((v - xlo) / span * NB);
      if (k >= 0 && k < NB) b[k]++;
    }
    this._bk = key;
    this._bc = { bins:b, n:this.landed.length, sum:s1, sum2:s2 };
  }
  const cache = this._bc;
  const bins = Int32Array.from(cache.bins);
  let sum = cache.sum, sum2 = cache.sum2, nAll = cache.n;
  /* 現在パスのうち，もう着地したもの（多くても数百個）．
     記録へ移した後は landed 側に入っているので数えない． */
  for (let i = 0; this.committed !== true && i < this.shots.length; i++){
    const s = this.shots[i];
    if (isFinite(s.tl) && this.t >= s.tl){
      const v = s.xl;
      nAll++; sum += v; sum2 += v * v;
      const k = Math.floor((v - xlo) / span * NB);
      if (k >= 0 && k < NB) bins[k]++;
    }
  }
  this.nLanded = nAll;

  let mx = 1;
  for (let i = 0; i < NB; i++) if (bins[i] > mx) mx = bins[i];

  c.fillStyle = 'rgba(15,76,129,.55)';
  const bw = plotW / NB;
  for (let i = 0; i < NB; i++){
    if (!bins[i]) continue;
    const h = bins[i] / mx * (plotH - 16);
    c.fillRect(x0 + i * bw + 0.5, y1 - h, Math.max(1, bw - 1), h);
  }

  /* 古典的な着地点（棒に重なるので白フチを付ける） */
  const rx = this.PX(this.D.R);
  if (rx > x0 && rx < x1){
    c.strokeStyle = this.css('--cls'); c.lineWidth = 1.6; c.setLineDash([4,3]);
    c.beginPath(); c.moveTo(rx, y0); c.lineTo(rx, y1); c.stroke(); c.setLineDash([]);
    c.font = '10px ' + CFONT; c.textAlign = 'center';
    c.lineWidth = 3; c.strokeStyle = '#fff';
    c.strokeText('古典の着地点', rx, y1 - 5);
    c.fillStyle = this.css('--cls');
    c.fillText('古典の着地点', rx, y1 - 5);
  }

  c.fillStyle = sub; c.font = '10.5px ' + CFONT; c.textAlign = 'left';
  c.fillText('地面に着いた位置の分布（' + nAll + ' 個）', x0 + 5, y0 + 12);
  if (nAll > 1){
    const mean = sum / nAll, sd = Math.sqrt(Math.max(0, sum2 / nAll - mean * mean));
    c.textAlign = 'right';
    c.fillText('平均 ' + fmtLenPlain(mean, 3) + ' ／ 標準偏差 ' + fmtLenPlain(sd, 3),
               x1 - 5, y0 + 12);
    this.hMean = mean; this.hSd = sd;
  } else { this.hMean = NaN; this.hSd = NaN; }
};

/** 最下段：質量を変えるとぼやけがどうなるかの帯 */
Sim.prototype.drawStrip = function(){
  const c = this.ctx, P = this.P, D = this.D;
  const x0 = this.xL, x1 = this.xR, y0 = this.yS0, y1 = this.yS1;
  const sub = this.css('--sub');
  const lo = Math.log10(M_MIN), hi = Math.log10(M_MAX);
  const toX = function(m){ return x0 + (Math.log10(m) - lo) / (hi - lo) * (x1 - x0); };

  /* σ(T)/scale は 1/√m．色で古典 → 量子を表す */
  for (let px = x0; px < x1; px++){
    const m = Math.pow(10, lo + (px - x0) / (x1 - x0) * (hi - lo));
    const sT = Math.sqrt(HBAR * D.T / m);            // σ0 最適時の着地時の広がり
    const r = sT / D.scale;
    const u = Math.max(0, Math.min(1, (Math.log10(r) + 6) / 7));   // 1e-6 → 1e1
    const R = Math.round(15 + 125 * u), G = Math.round(76 - 30 * u), B = Math.round(129 + 25 * u);
    c.fillStyle = 'rgb(' + R + ',' + G + ',' + B + ')';
    c.fillRect(px, y0, 1, y1 - y0);
  }
  c.strokeStyle = 'rgba(31,35,40,.18)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);

  /* 見出し（バーの 2 行上） */
  c.fillStyle = sub; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('質量 m [kg] を変えたときのぼやけ（σ₀ は各質量での最適値）', x0, y0 - 19);
  c.textAlign = 'right';
  c.fillText('右へ行くほど古典的 →', x1, y0 - 19);

  /* 代表的な粒子（バーのすぐ上） */
  c.font = '9px ' + CFONT; c.textAlign = 'center';
  for (let i = 0; i < STRIP_MARKS.length; i++){
    const mk = STRIP_MARKS[i], px = toX(mk.m);
    if (px < x0 || px > x1) continue;
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(px, y0); c.lineTo(px, y1); c.stroke();
    c.fillStyle = sub;
    c.fillText(mk.lab, px, y0 - 5);
  }

  /* 目盛り（バーの下） */
  c.fillStyle = sub; c.font = '9.5px ' + CFONT; c.textAlign = 'center';
  for (let e = -40; e <= 0; e += 8){
    const px = toX(Math.pow(10, e));
    c.fillText('10' + supStr(e), px, y1 + 11);
  }

  /* 現在位置 */
  const px = toX(Math.min(M_MAX, Math.max(M_MIN, P.m)));
  c.strokeStyle = '#111'; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(px, y0 - 4); c.lineTo(px, y1 + 4); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(px, y0 - 4); c.lineTo(px, y1 + 4); c.stroke();
};

/* ========================================================================
   6. 数値の表示
   ======================================================================== */
Sim.prototype.updateLive = function(){
  const P = this.P, D = this.D, t = this.t;
  this.liveT.textContent = fmtTimePlain(t);
  const x = D.vx * t, y = D.vy * t - 0.5 * P.g * t * t;
  this.liveXY.textContent = fmtLenPlain(x, 3) + ', ' + fmtLenPlain(y, 3);
  this.liveSig.textContent = fmtLenPlain(sigAt(P, t), 3);
  this.livePy.textContent = fmtNumPlain(P.m * (D.vy - P.g * t), 3) + ' kg m/s';
  this.liveN.textContent = String(this.nLanded || 0);
};
function fmtTimePlain(v){
  const a = Math.abs(v);
  if (a >= 1)    return fmtNumPlain(v, 3) + ' s';
  if (a >= 1e-3) return fmtNumPlain(v * 1e3, 3) + ' ms';
  if (a >= 1e-6) return fmtNumPlain(v * 1e6, 3) + ' µs';
  return fmtNumPlain(v * 1e9, 3) + ' ns';
}

Sim.prototype.updateReadout = function(){
  if (!this.ok){
    this.readout.innerHTML = '<div><span>入力エラー</span><span>値を確認してください</span></div>';
    return;
  }
  const P = this.P, D = this.D, R = [];
  R.push(['飛行時間 <i>T</i>（古典）', fmtTime(D.T, 4)]);
  R.push(['到達距離 <i>R</i>（古典）', fmtLen(D.R, 4)]);
  R.push(['最高点 <i>H</i>（古典）', fmtLen(D.Hm, 4)]);
  R.push(['de Broglie 波長 <i>h</i>/<i>m</i><i>v</i><sub>0</sub>', fmtLen(D.lamDB, 4)]);
  R.push(['初期の幅 σ<sub>0</sub>', fmtLen(P.sig0, 4)]);
  R.push(['速度のゆらぎ Δ<i>v</i> = ħ/2<i>m</i>σ<sub>0</sub>', fmtNum(dvOf(P), 4) + ' m/s']);
  R.push(['着地時の広がり σ(<i>T</i>)', fmtLen(this.sigT, 4)]);
  R.push(['ぼやけ σ(<i>T</i>)/（軌道の大きさ）', fmtNum(this.blur, 3)]);
  const opt = Math.abs(P.sig0 / D.sigOpt - 1) < 1e-6;
  R.push(['σ(<i>T</i>) を最小にする σ<sub>0</sub>', fmtLen(D.sigOpt, 4) + (opt ? '（採用中）' : '')]);
  if (this.nLanded > 1 && isFinite(this.hMean)){
    R.push(['着地点の平均（実測）', fmtLen(this.hMean, 4)]);
    R.push(['着地点の標準偏差（実測）', fmtLen(this.hSd, 4)]);
  }
  if (this.notLanded) R.push(['地面に戻らなかった粒子', String(this.notLanded) + ' 個']);
  const verdict = this.blur < 1e-3 ? 'ほぼ完全に古典的'
                : this.blur < 0.08 ? '軌道はまだ見えるがぼやける' : 'もはや軌道ではない';
  R.push(['判定', verdict]);

  this.readout.innerHTML = R.map(function(r, i){
    return '<div' + (r[0] === '判定' ? ' class="hi"' : '') +
           '><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
};

/* ========================================================================
   7. 起動
   ======================================================================== */
const app = document.getElementById('qsim');

/* ?only=... / ?embed=1 を付けると，見出しを隠して iframe 埋め込み用の体裁になる */
if (/[?&](only|embed)=/.test(location.search)) app.classList.add('is-embed');

let last = 0, rafId = null, lastRO = 0;
function loop(ts){
  rafId = null;
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
  last = ts;
  if (sim.playing){
    sim.step(dt);
    sim.draw();
    /* 読み取り値は innerHTML を組み直すので，毎フレームではなく 4 回/秒にする */
    if (ts - lastRO > 250){ lastRO = ts; sim.updateReadout(); }
    kick();
  } else {
    last = 0;
    sim.updateReadout();
  }
}
function kick(){ if (rafId === null) rafId = requestAnimationFrame(loop); }

const sim = new Sim(app.querySelector('.panel'));

/* Chrome のフォーム復元が初期化後に値を書き戻すことがあるので，読み直す */
window.addEventListener('pageshow', function(){ sim.syncMassSlider(); sim.recompute(true); });

/* iframe の高さを親へ知らせる */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
