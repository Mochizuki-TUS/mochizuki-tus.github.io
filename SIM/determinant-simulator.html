<body>
<div id="qsim">
  <h1>行列式は何を表しているのか ― 面積・体積・線形独立</h1>
  <p class="lead">
    行列式は「計算のしかたを覚える記号」ではありません。
    2 次元なら<b>2 本のベクトルが張る平行四辺形の面積</b>、
    3 次元なら<b>3 本が張る平行六面体の体積</b>です。
    だから <b>行列式が 0 ＝ つぶれている ＝ 線形従属</b>。
    どこまでつぶれたかを数えるのが <b>rank</b> で、
    そこから連立方程式の解の形（点・直線・平面）まで一本につながります。
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="d2" role="tab">① 2 次元 ― 行列式は面積</button>
    <button class="tab" data-tab="d3" role="tab">② 3 次元 ― 行列式は体積</button>
    <button class="tab" data-tab="sol" role="tab">③ det = 0 のとき、解はどうなるか</button>
  </div>

  <section class="panel" data-panel="d2"></section>
  <section class="panel" data-panel="d3" hidden></section>
  <section class="panel" data-panel="sol" hidden></section>

  <p class="foot">
    東京理科大学 望月研究室 ／ 講義ノート「(16) 行列式が 0 であることと 0 でないことは何を意味するのか？」より。
    導出は <a href="determinant-derivation.html">こちらのページ</a>にあります。
  </p>
</div>

<script>
(function () {
'use strict';
/* ========================================================================
   0. 共通の道具
   ======================================================================== */
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }
function fx(v, d){ const s = (Math.abs(v) < 5e-13 ? 0 : v).toFixed(d === undefined ? 3 : d); return s === '-0.000' ? '0.000' : s; }

/* ========================================================================
   1. 行列式
   ------------------------------------------------------------------------
   列にベクトルを並べる。det2([a,b]) は a, b が張る平行四辺形の符号つき面積、
   det3([f,g,h]) は平行六面体の符号つき体積。
   ======================================================================== */
function det2(a, b){ return a[0] * b[1] - a[1] * b[0]; }
function det3(f, g, h){
  /* Sarrus ではなく余因子展開。3 次までなら同じだが、式の形が講義ノートと揃う */
  return f[0] * (g[1] * h[2] - g[2] * h[1])
       - g[0] * (f[1] * h[2] - f[2] * h[1])
       + h[0] * (f[1] * g[2] - f[2] * g[1]);
}
/* ベクトルの道具 */
function sub(a, b){ return a.map(function(v, i){ return v - b[i]; }); }
function add(a, b){ return a.map(function(v, i){ return v + b[i]; }); }
function scal(a, k){ return a.map(function(v){ return v * k; }); }
function dot(a, b){ let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
function nrm(a){ return Math.sqrt(dot(a, a)); }
function cross(a, b){
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}

/* ========================================================================
   2. 階数（rank）と自由度
   ------------------------------------------------------------------------
   行基本変形（部分ピボット選択つき Gauss の消去法）で階段形にして、
   0 でない行の数を数える。しきい値は行列の大きさに対する相対値で取る。
   ======================================================================== */
function rowEchelon(M){
  const A = M.map(function(r){ return r.slice(); });
  const m = A.length, n = A[0].length;
  let scale = 0;
  for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) scale = Math.max(scale, Math.abs(A[i][j]));
  const tol = Math.max(1e-12, 1e-10 * scale);
  const piv = [];
  let r = 0;
  for (let c = 0; c < n && r < m; c++){
    let best = r, bv = Math.abs(A[r][c]);
    for (let i = r + 1; i < m; i++) if (Math.abs(A[i][c]) > bv){ bv = Math.abs(A[i][c]); best = i; }
    if (bv <= tol) continue;                       // この列にピボットは立たない
    const t = A[r]; A[r] = A[best]; A[best] = t;
    const p = A[r][c];
    for (let j = 0; j < n; j++) A[r][j] /= p;      // ピボットを 1 に
    for (let i = 0; i < m; i++){
      if (i === r) continue;
      const f = A[i][c];
      if (Math.abs(f) <= tol) continue;
      for (let j = 0; j < n; j++) A[i][j] -= f * A[r][j];   // 既約階段形まで進める
    }
    piv.push(c); r++;
  }
  for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) if (Math.abs(A[i][j]) < tol) A[i][j] = 0;
  return { R: A, piv: piv, rank: piv.length };
}
function rankOf(M){ return rowEchelon(M).rank; }

/* 同次連立方程式 Mx = 0 の解空間の基底。
   自由変数を 1 つずつ 1 にして、束縛変数を後ろから決める。 */
function nullBasis(M){
  const { R, piv } = rowEchelon(M);
  const n = M[0].length;
  const isPiv = new Array(n).fill(false);
  piv.forEach(function(c){ isPiv[c] = true; });
  const free = [];
  for (let c = 0; c < n; c++) if (!isPiv[c]) free.push(c);
  return free.map(function(fc){
    const v = new Array(n).fill(0);
    v[fc] = 1;
    for (let i = piv.length - 1; i >= 0; i--){
      const c = piv[i];
      let s = 0;
      for (let j = c + 1; j < n; j++) s += R[i][j] * v[j];
      v[c] = -s;                                    // ピボットは 1 に正規化済み
    }
    return v;
  });
}

/* ========================================================================
   3. 面積・体積を「行列式を使わずに」求める（答え合わせ用）
   ======================================================================== */
/* 底辺 × 高さ。a を底辺にとり、b から下ろした垂線の長さを掛ける。 */
function areaByHeight(a, b){
  const la = nrm(a);
  if (la < 1e-14) return 0;
  const t = dot(a, b) / (la * la);                  // b の a 方向成分
  const perp = sub(b, scal(a, t));                  // 垂直成分＝高さ
  return la * nrm(perp);
}
/* 底面積 × 高さ。f, g の張る平行四辺形を底面にする。 */
function volByHeight(f, g, h){
  const nvec = cross(f, g);
  const base = nrm(nvec);                            // |f×g| ＝ 底面積
  if (base < 1e-14) return 0;
  return base * Math.abs(dot(h, nvec)) / base;       // 高さ＝|h·n|/|n|
}
/* 3 本のベクトルが張るものの次元（rank）から、幾何的な言葉を返す */
function spanName(rk, dim){
  if (dim === 2) return rk === 2 ? '平面ぜんぶ（2 次元）' : rk === 1 ? '1 本の直線（1 次元）' : '原点だけ（0 次元）';
  return rk === 3 ? '空間ぜんぶ（3 次元）' : rk === 2 ? '1 枚の平面（2 次元）'
       : rk === 1 ? '1 本の直線（1 次元）' : '原点だけ（0 次元）';
}

/* ========================================================================
   4. プリセット
   ======================================================================== */
const P2 = [
  { n:'講義ノートの例：|A| = 6',        a:[2, 1],   b:[2, 4] },
  { n:'講義ノートの例：|B| = 0（重なる）', a:[2, 1],   b:[4, 2] },
  { n:'単位行列（面積 1 の正方形）',      a:[1, 0],   b:[0, 1] },
  { n:'せん断（面積は変わらない）',       a:[1, 0],   b:[1.6, 1] },
  { n:'回転 30°（面積も向きもそのまま）', a:[0.866, 0.5], b:[-0.5, 0.866] },
  { n:'向きが裏返る（det < 0）',         a:[1, 0],   b:[0.6, -1.4] },
  { n:'つぶれかけ（det ≒ 0）',           a:[2, 1],   b:[2.2, 1.05] }
];
const P3 = [
  { n:'講義ノートの例：|C| = 0（同じ平面）', f:[1, 2, 3], g:[2, -1, 1], h:[1, 1, 2] },
  { n:'単位ベクトル 3 本（体積 1）',        f:[1, 0, 0], g:[0, 1, 0], h:[0, 0, 1] },
  { n:'一般の 3 本（体積 9）',              f:[2, 0, 1], g:[1, 2, 0], h:[0, 1, 2] },
  { n:'3 本とも同じ直線の上（rank 1）',      f:[1, 2, 3], g:[2, 4, 6], h:[-1, -2, -3] },
  { n:'つぶれかけ（薄い板）',                f:[1, 2, 3], g:[2, -1, 1], h:[1, 1, 2.15] }
];
const PS = [
  { n:'講義ノート 例② ―― 自由度 1', M:[[1, 2, -1], [2, -1, 3], [4, 3, 1]] },
  { n:'講義ノート 例③ ―― 自由度 2', M:[[2, -1, 1], [4, -2, 2], [-6, 3, -3]] },
  { n:'det ≠ 0 ―― 自明な解だけ',     M:[[1, 2, -1], [2, -1, 3], [4, 3, 2]] },
  { n:'すべて 0 ―― 自由度 3',        M:[[0, 0, 0], [0, 0, 0], [0, 0, 0]] }
];

const app = document.getElementById('qsim');
const sims = {};

function Sim(key, root){
  this.key = key;
  this.rootEl = root;
  this.a = [2, 1]; this.b = [2, 4];
  this.f = [1, 2, 3]; this.g = [2, -1, 1]; this.h = [1, 1, 2];
  this.M = [[1, 2, -1], [2, -1, 3], [4, 3, 1]];
  this.az = 0.62; this.elv = 0.42;
  this.showUnit = true;
  this.build();
  this.setPreset(0);
}

/* --------------------------------------------------------------------
   3 次元の投影。方位角 az と仰角 elv で回してから、平行投影で貼る。
   -------------------------------------------------------------------- */
Sim.prototype.proj = function(v, sc, cx, cy){
  const ca = Math.cos(this.az), sa = Math.sin(this.az);
  const ce = Math.cos(this.elv), se = Math.sin(this.elv);
  const x1 = ca * v[0] + sa * v[1];
  const y1 = -sa * v[0] + ca * v[1];
  const X = x1, Y = ce * v[2] - se * y1;
  return [cx + X * sc, cy - Y * sc, se * v[2] + ce * y1];
};

Sim.prototype.build = function(){
  const self = this;
  const lay = el('div', 'layout');
  const main = el('div', 'col-main'), side = el('div', 'col-side');
  lay.appendChild(main); lay.appendChild(side);
  this.rootEl.appendChild(lay);

  const stage = el('div', 'stage');
  const cv = document.createElement('canvas');
  stage.appendChild(cv); main.appendChild(stage);
  this.cv = cv; this.ctx = cv.getContext('2d');

  /* ---- 3 次元の図は、マウスでつかんで回せるようにする ----
     外部ライブラリは使わず、Pointer Events で自前に処理する。
     touch-action:pan-y にしてあるので、スマートフォンでは
     「縦になぞる＝ページのスクロール」「横になぞる＝回転」になる
     （上下の回転はスライダーで）。 */
  if (this.key !== 'd2'){
    cv.style.cursor = 'grab';
    cv.style.touchAction = 'pan-y';
    let drag = null;
    /* 回すだけなら読み取り値は変わらないので、絵とスライダーだけを更新する。
       requestAnimationFrame に載せると、裏に回ったタブで止まってしまう。 */
    const redraw = function(){ self.syncCtl(); self.draw(); };
    cv.addEventListener('pointerdown', function(e){
      drag = { x: e.clientX, y: e.clientY, az: self.az, elv: self.elv };
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      cv.style.cursor = 'grabbing';
      e.preventDefault();
    });
    cv.addEventListener('pointermove', function(e){
      if (!drag) return;
      self.az = drag.az + (e.clientX - drag.x) * 0.008;
      while (self.az >  Math.PI) self.az -= 2 * Math.PI;   // スライダーの範囲へ畳む
      while (self.az < -Math.PI) self.az += 2 * Math.PI;
      self.elv = clamp(drag.elv + (e.clientY - drag.y) * 0.008, -1.2, 1.35);
      redraw();
      e.preventDefault();
    });
    const release = function(e){
      if (!drag) return;
      drag = null; cv.style.cursor = 'grab';
      try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    cv.addEventListener('pointerup', release);
    cv.addEventListener('pointercancel', release);
    cv.addEventListener('pointerleave', release);
    /* ダブルクリックで最初の向きに戻す */
    cv.addEventListener('dblclick', function(){ self.az = 0.62; self.elv = 0.42; self.refresh(); });
  }

  main.appendChild(el('div', 'legend', this.key === 'd2'
    ? '<span><i style="background:#0f4c81"></i>ベクトル a</span>' +
      '<span><i style="background:#c62828"></i>ベクトル b</span>' +
      '<span><i style="background:#2e7d32"></i>2 本が張る平行四辺形＝|det|</span>' +
      '<span><i style="background:#f9a825"></i>もとの単位正方形</span>'
    : this.key === 'd3'
    ? '<span><i style="background:#0f4c81"></i>f</span>' +
      '<span><i style="background:#c62828"></i>g</span>' +
      '<span><i style="background:#6a3d9a"></i>h</span>' +
      '<span><i style="background:#2e7d32"></i>3 本が張る平行六面体＝|det|</span>'
    : '<span><i style="background:#0f4c81"></i>1 本目の式が表す平面</span>' +
      '<span><i style="background:#c62828"></i>2 本目</span>' +
      '<span><i style="background:#6a3d9a"></i>3 本目</span>' +
      '<span><i style="background:#f9a825"></i>3 枚の交わり＝解</span>'));

  this.readout = el('div', 'readout'); main.appendChild(this.readout);
  this.eqbox = el('div', 'eq'); main.appendChild(this.eqbox);

  const ctrl = el('div', 'controls'); side.appendChild(ctrl);
  ctrl.appendChild(el('p', 'ctlhead', '例'));
  const pf = el('label', 'fld');
  pf.appendChild(el('b', null, 'プリセット'));
  const sel = el('select', 'wide');
  const LIST = this.key === 'd2' ? P2 : this.key === 'd3' ? P3 : PS;
  LIST.forEach(function(q, i){
    const o = document.createElement('option'); o.textContent = q.n; o.value = String(i); sel.appendChild(o);
  });
  sel.autocomplete = 'off';
  sel.addEventListener('change', function(){ self.setPreset(parseInt(this.value, 10)); });
  pf.appendChild(sel); ctrl.appendChild(pf);
  this.sel = sel;

  ctrl.appendChild(el('hr', 'sep'));
  this.sl = {};
  const mk = function(key, idx, label, lo, hi){
    const row = el('label', 'ctlrow');
    const lab = el('span', null, label);
    row.appendChild(lab);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = String(lo); inp.max = String(hi); inp.step = '0.05';
    inp.autocomplete = 'off';
    inp.addEventListener('input', function(){
      self[key][idx] = Number(this.value);
      self.sel.value = ''; self.refresh();
    });
    row.appendChild(inp); ctrl.appendChild(row);
    self.sl[key + idx] = { inp: inp, lab: lab };
  };
  const mkM = function(i, j, label){
    const row = el('label', 'ctlrow');
    const lab = el('span', null, label);
    row.appendChild(lab);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = '-6'; inp.max = '6'; inp.step = '0.5';
    inp.autocomplete = 'off';
    inp.addEventListener('input', function(){
      self.M[i][j] = Number(this.value);
      self.sel.value = ''; self.refresh();
    });
    row.appendChild(inp); ctrl.appendChild(row);
    self.sl['M' + i + j] = { inp: inp, lab: lab };
  };

  if (this.key === 'd2'){
    ctrl.appendChild(el('p', 'ctlhead', 'ベクトル a'));
    mk('a', 0, 'a_x', -4, 4); mk('a', 1, 'a_y', -4, 4);
    ctrl.appendChild(el('p', 'ctlhead', 'ベクトル b'));
    mk('b', 0, 'b_x', -4, 4); mk('b', 1, 'b_y', -4, 4);
    const c1 = el('label', 'chk');
    const i1 = document.createElement('input');
    i1.type = 'checkbox'; i1.checked = true; i1.autocomplete = 'off';
    i1.addEventListener('change', function(){ self.showUnit = this.checked; self.refresh(); });
    c1.appendChild(i1); c1.appendChild(el('span', null, 'もとの単位正方形も描く'));
    ctrl.appendChild(c1);
    const br = el('div', 'btnrow');
    const bb = el('button', 'act b-full', 'b を a に重ねる（det → 0）'); bb.type = 'button';
    bb.addEventListener('click', function(){
      const k = nrm(self.b) / Math.max(1e-9, nrm(self.a));
      self.b = [self.a[0] * k, self.a[1] * k];
      self.sel.value = ''; self.refresh();
    });
    br.appendChild(bb); ctrl.appendChild(br);
  } else if (this.key === 'd3'){
    ctrl.appendChild(el('p', 'ctlhead', '3 本目のベクトル h'));
    mk('h', 0, 'h_x', -4, 4); mk('h', 1, 'h_y', -4, 4); mk('h', 2, 'h_z', -4, 4);
    ctrl.appendChild(el('p', 'fld', '<span class="hint">'
      + 'f と g はプリセットで固定です。<b>h だけを動かして</b>、'
      + '体積がどう変わるかを見てください。</span>'));
    const br = el('div', 'btnrow');
    const bb = el('button', 'act b-full', 'h を f, g の平面へ落とす（det → 0）'); bb.type = 'button';
    bb.addEventListener('click', function(){
      const n = cross(self.f, self.g), nn = dot(n, n);
      if (nn > 1e-12) self.h = sub(self.h, scal(n, dot(self.h, n) / nn));
      self.sel.value = ''; self.refresh();
    });
    br.appendChild(bb); ctrl.appendChild(br);
  } else {
    ctrl.appendChild(el('p', 'ctlhead', '係数行列（3 行目だけ動かせます）'));
    mkM(2, 0, '3 行 1 列'); mkM(2, 1, '3 行 2 列'); mkM(2, 2, '3 行 3 列');
    ctrl.appendChild(el('p', 'fld', '<span class="hint">'
      + '3 行目を動かすと rank が変わります。<b>rank が下がった瞬間に、'
      + '原点以外の解が現れる</b>のを確かめてください。</span>'));
  }

  ctrl.appendChild(el('hr', 'sep'));
  if (this.key !== 'd2'){
    ctrl.appendChild(el('p', 'ctlhead', '視点'));
    const rot = function(k, label, lo, hi){
      const row = el('label', 'ctlrow');
      const lab = el('span', null, label);
      row.appendChild(lab);
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = String(lo); inp.max = String(hi); inp.step = '0.01';
      inp.autocomplete = 'off';
      inp.addEventListener('input', function(){ self[k] = Number(this.value); self.refresh(); });
      row.appendChild(inp); ctrl.appendChild(row);
      self.sl[k] = { inp: inp, lab: lab };
    };
    rot('az', '横に回す', -3.14, 3.14);
    rot('elv', '上下に回す', -1.2, 1.35);
  }

  const det = document.createElement('details');
  det.className = 'explain';
  const sm = document.createElement('summary');
  sm.textContent = this.key === 'd2' ? 'なぜ行列式が面積になるのか'
                 : this.key === 'd3' ? 'なぜ行列式が体積になるのか'
                 : 'rank と自由度 ―― 解はどんな形をしているか';
  det.appendChild(sm);
  this.body = el('div', 'body');
  det.appendChild(this.body);
  main.appendChild(det);
};

Sim.prototype.setPreset = function(i){
  const LIST = this.key === 'd2' ? P2 : this.key === 'd3' ? P3 : PS;
  const q = LIST[i];
  if (!q) return;
  if (this.key === 'd2'){ this.a = q.a.slice(); this.b = q.b.slice(); }
  else if (this.key === 'd3'){ this.f = q.f.slice(); this.g = q.g.slice(); this.h = q.h.slice(); }
  else this.M = q.M.map(function(r){ return r.slice(); });
  this.sel.value = String(i);
  this.refresh();
};

Sim.prototype.syncCtl = function(){
  const self = this;
  if (this.key === 'd2'){
    [['a', 0, 'a_x'], ['a', 1, 'a_y'], ['b', 0, 'b_x'], ['b', 1, 'b_y']].forEach(function(t){
      const s = self.sl[t[0] + t[1]];
      s.inp.value = String(self[t[0]][t[1]]);
      s.lab.innerHTML = t[2] + ' = ' + fx(self[t[0]][t[1]], 2);
    });
  } else if (this.key === 'd3'){
    ['x', 'y', 'z'].forEach(function(nm, i){
      const s = self.sl['h' + i];
      s.inp.value = String(self.h[i]);
      s.lab.innerHTML = 'h_' + nm + ' = ' + fx(self.h[i], 2);
    });
  } else {
    [0, 1, 2].forEach(function(j){
      const s = self.sl['M2' + j];
      s.inp.value = String(self.M[2][j]);
      s.lab.innerHTML = '3 行 ' + (j + 1) + ' 列 = ' + fx(self.M[2][j], 1);
    });
  }
  if (this.sl.az){
    this.sl.az.inp.value = String(this.az); this.sl.az.lab.innerHTML = '横に回す';
    this.sl.elv.inp.value = String(this.elv); this.sl.elv.lab.innerHTML = '上下に回す';
  }
};

Sim.prototype.refresh = function(){
  this.syncCtl();
  this.draw();
  this.updateReadout();
  postHeight();
};

/* ========================================================================
   5. 描画
   ======================================================================== */
const DPR = Math.min(window.devicePixelRatio || 1, 2);

Sim.prototype.resize = function(){
  const w = Math.max(300, this.cv.parentNode.clientWidth);
  const h = Math.round(clamp(w * 0.58, 280, 460));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  this.cv.width = Math.round(w * DPR); this.cv.height = Math.round(h * DPR);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
};
function arrow2(c, x0, y0, x1, y1, col, w){
  const dx = x1 - x0, dy = y1 - y0;
  if (Math.hypot(dx, dy) < 2) return;
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w || 2.6;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  const a = Math.atan2(dy, dx), s = 9;
  c.beginPath(); c.moveTo(x1, y1);
  c.lineTo(x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38));
  c.lineTo(x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38));
  c.closePath(); c.fill();
}

/* --------------------------------------------------------------------
   ①：2 次元 ―― 行列式は面積
   -------------------------------------------------------------------- */
Sim.prototype.draw2 = function(){
  const c = this.ctx, W = this.W, H = this.H, a = this.a, b = this.b;
  const L = 5;
  const sc = Math.min((W - 60) / (2 * L), (H - 50) / (2 * L));
  const cx = W / 2, cy = H / 2;
  const X = v => cx + v * sc, Y = v => cy - v * sc;
  c.clearRect(0, 0, W, H);
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);

  /* 方眼 */
  c.strokeStyle = 'rgba(31,35,40,.07)'; c.lineWidth = 1; c.beginPath();
  for (let k = -L; k <= L; k++){ c.moveTo(X(k), 0); c.lineTo(X(k), H); c.moveTo(0, Y(k)); c.lineTo(W, Y(k)); }
  c.stroke();
  c.strokeStyle = 'rgba(31,35,40,.4)'; c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(0, Y(0)); c.lineTo(W, Y(0)); c.moveTo(X(0), 0); c.lineTo(X(0), H); c.stroke();
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let k = -4; k <= 4; k++) if (k) c.fillText(String(k), X(k), Y(0) + 3);
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let k = -4; k <= 4; k++) if (k) c.fillText(String(k), X(0) - 4, Y(k));

  /* もとの単位正方形 */
  if (this.showUnit){
    c.fillStyle = 'rgba(249,168,37,.16)';
    c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(1), Y(0)); c.lineTo(X(1), Y(1)); c.lineTo(X(0), Y(1));
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(249,168,37,.85)'; c.lineWidth = 1.6; c.setLineDash([4, 3]); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#8a5a00'; c.font = '10px ' + CFONT; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('面積 1', X(0.5), Y(0.5));
  }

  /* 平行四辺形 */
  const d = det2(a, b);
  const ab = [a[0] + b[0], a[1] + b[1]];
  c.fillStyle = d >= 0 ? 'rgba(46,125,50,.20)' : 'rgba(198,40,40,.16)';
  c.beginPath();
  c.moveTo(X(0), Y(0)); c.lineTo(X(a[0]), Y(a[1]));
  c.lineTo(X(ab[0]), Y(ab[1])); c.lineTo(X(b[0]), Y(b[1]));
  c.closePath(); c.fill();
  c.strokeStyle = d >= 0 ? 'rgba(46,125,50,.85)' : 'rgba(198,40,40,.8)';
  c.lineWidth = 1.8; c.stroke();

  /* 高さ（底辺 a に下ろした垂線）を点線で */
  const la = nrm(a);
  if (la > 1e-9){
    const t = dot(a, b) / (la * la), foot = [a[0] * t, a[1] * t];
    c.strokeStyle = 'rgba(31,35,40,.5)'; c.lineWidth = 1.2; c.setLineDash([3, 3]);
    c.beginPath(); c.moveTo(X(b[0]), Y(b[1])); c.lineTo(X(foot[0]), Y(foot[1])); c.stroke();
    c.setLineDash([]);
    c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText('高さ', (X(b[0]) + X(foot[0])) / 2 + 5, (Y(b[1]) + Y(foot[1])) / 2);
  }

  arrow2(c, X(0), Y(0), X(a[0]), Y(a[1]), '#0f4c81');
  arrow2(c, X(0), Y(0), X(b[0]), Y(b[1]), '#c62828');
  c.font = 'bold 12px ' + CFONT; c.textAlign = 'left'; c.textBaseline = 'bottom';
  c.fillStyle = '#0f4c81'; c.fillText('a', X(a[0]) + 6, Y(a[1]) - 3);
  c.fillStyle = '#c62828'; c.fillText('b', X(b[0]) + 6, Y(b[1]) - 3);

  c.font = 'bold 13px ' + CFONT; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillStyle = Math.abs(d) < 1e-9 ? '#c62828' : '#2e7d32';
  c.fillText(Math.abs(d) < 1e-9 ? '面積 0 ―― 2 本が 1 本の直線に乗っています'
    : '面積 = |det| = ' + fx(Math.abs(d), 3) + (d < 0 ? '（向きは裏返し）' : ''), 10, 8);
};

/* --------------------------------------------------------------------
   ②：3 次元 ―― 行列式は体積
   -------------------------------------------------------------------- */
Sim.prototype.draw3 = function(){
  const c = this.ctx, W = this.W, H = this.H, f = this.f, g = this.g, h = this.h;
  const self = this;
  const L = 4.6;
  const sc = Math.min(W, H * 1.7) / (2.6 * L);
  const cx = W / 2, cy = H / 2 + H * 0.06;
  const P = v => self.proj(v, sc, cx, cy);
  c.clearRect(0, 0, W, H);
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);

  /* 座標軸 */
  [[[L, 0, 0], 'x'], [[0, L, 0], 'y'], [[0, 0, L], 'z']].forEach(function(t){
    const o = P([0, 0, 0]), q = P(t[0]);
    c.strokeStyle = 'rgba(31,35,40,.30)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(o[0], o[1]); c.lineTo(q[0], q[1]); c.stroke();
    c.fillStyle = '#5c6670'; c.font = '11px ' + CFONT;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(t[1], q[0] + 8, q[1]);
  });

  /* 平行六面体の 6 面を、奥から順に塗る */
  const V = [[0,0,0], f, g, h, add(f,g), add(f,h), add(g,h), add(add(f,g),h)];
  const FACES = [[0,1,4,2],[0,1,5,3],[0,2,6,3],[3,5,7,6],[2,4,7,6],[1,4,7,5]];
  const d = det3(f, g, h);
  const flat = Math.abs(d) < 1e-6;
  const polys = FACES.map(function(F){
    const pts = F.map(function(i){ return P(V[i]); });
    const z = pts.reduce(function(s, p){ return s + p[2]; }, 0) / 4;
    return { pts: pts, z: z };
  }).sort(function(p, q){ return p.z - q.z; });
  polys.forEach(function(pl){
    c.beginPath();
    pl.pts.forEach(function(p, i){ if (i === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]); });
    c.closePath();
    c.fillStyle = flat ? 'rgba(198,40,40,.13)' : 'rgba(46,125,50,.15)';
    c.fill();
    c.strokeStyle = flat ? 'rgba(198,40,40,.55)' : 'rgba(46,125,50,.6)';
    c.lineWidth = 1.2; c.stroke();
  });

  /* 3 本のベクトル */
  const o = P([0, 0, 0]);
  [[f, '#0f4c81', 'f'], [g, '#c62828', 'g'], [h, '#6a3d9a', 'h']].forEach(function(t){
    const q = P(t[0]);
    arrow2(c, o[0], o[1], q[0], q[1], t[1], 2.8);
    c.fillStyle = t[1]; c.font = 'bold 12px ' + CFONT;
    c.textAlign = 'left'; c.textBaseline = 'bottom';
    c.fillText(t[2], q[0] + 6, q[1] - 3);
  });

  c.font = 'bold 13px ' + CFONT; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillStyle = flat ? '#c62828' : '#2e7d32';
  c.fillText(flat ? '体積 0 ―― 3 本が同じ平面（または直線）に乗っています'
    : '体積 = |det| = ' + fx(Math.abs(d), 3) + (d < 0 ? '（左手系）' : '（右手系）'), 10, 8);

  c.fillStyle = 'rgba(92,102,112,.9)'; c.font = '10px ' + CFONT;
  c.textAlign = 'right'; c.textBaseline = 'bottom';
  c.fillText('ドラッグで回せます（ダブルクリックで戻る）', W - 8, H - 5);
};

/* --------------------------------------------------------------------
   ③：det = 0 のとき、解はどうなるか
   -------------------------------------------------------------------- */
Sim.prototype.drawSol = function(){
  const c = this.ctx, W = this.W, H = this.H, M = this.M, self = this;
  const L = 3.2;
  const sc = Math.min(W, H * 1.7) / (2.7 * L);
  const cx = W / 2, cy = H / 2;
  const P = v => self.proj(v, sc, cx, cy);
  c.clearRect(0, 0, W, H);
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);

  [[[L, 0, 0], 'x₁'], [[0, L, 0], 'x₂'], [[0, 0, L], 'x₃']].forEach(function(t){
    const o = P([0, 0, 0]), q = P(t[0]);
    c.strokeStyle = 'rgba(31,35,40,.30)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(o[0], o[1]); c.lineTo(q[0], q[1]); c.stroke();
    c.fillStyle = '#5c6670'; c.font = '11px ' + CFONT;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(t[1], q[0] + 10, q[1]);
  });

  /* 各行 n·x = 0 は原点を通る平面。n に垂直な 2 本を作って四角形で描く。 */
  const COL = ['rgba(15,76,129,', 'rgba(198,40,40,', 'rgba(106,61,154,'];
  M.forEach(function(row, i){
    const n = row.slice();
    if (nrm(n) < 1e-9) return;                       // 0 = 0 は平面にならない
    let t = Math.abs(n[0]) < 0.9 * nrm(n) ? [1, 0, 0] : [0, 1, 0];
    let u = cross(n, t); u = scal(u, L / Math.max(1e-9, nrm(u)));
    let v = cross(n, u); v = scal(v, L / Math.max(1e-9, nrm(v)));
    const q = [add(u, v), sub(u, v), scal(add(u, v), -1), scal(sub(u, v), -1)].map(P);
    c.beginPath();
    q.forEach(function(p, k){ if (k === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]); });
    c.closePath();
    c.fillStyle = COL[i] + '.13)'; c.fill();
    c.strokeStyle = COL[i] + '.55)'; c.lineWidth = 1.3; c.stroke();
  });

  /* 解空間 */
  const nb = nullBasis(M);
  const o = P([0, 0, 0]);
  if (nb.length === 1){
    const v = scal(nb[0], L * 1.15 / Math.max(1e-9, nrm(nb[0])));
    const p1 = P(v), p2 = P(scal(v, -1));
    c.strokeStyle = '#f9a825'; c.lineWidth = 4.4;
    c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(p2[0], p2[1]); c.stroke();
  } else if (nb.length === 2){
    let u = scal(nb[0], L / Math.max(1e-9, nrm(nb[0])));
    let w = sub(nb[1], scal(nb[0], dot(nb[1], nb[0]) / dot(nb[0], nb[0])));
    w = scal(w, L / Math.max(1e-9, nrm(w)));
    const q = [add(u, w), sub(u, w), scal(add(u, w), -1), scal(sub(u, w), -1)].map(P);
    c.beginPath();
    q.forEach(function(p, k){ if (k === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]); });
    c.closePath();
    c.fillStyle = 'rgba(249,168,37,.34)'; c.fill();
    c.strokeStyle = '#f9a825'; c.lineWidth = 2.4; c.stroke();
  } else if (nb.length === 3){
    c.fillStyle = 'rgba(249,168,37,.22)'; c.fillRect(0, 0, W, H);
  }
  c.fillStyle = '#f9a825';
  c.beginPath(); c.arc(o[0], o[1], 5.4, 0, 6.2832); c.fill();
  c.strokeStyle = '#8a5a00'; c.lineWidth = 1.4; c.stroke();

  const rk = rankOf(M);
  c.font = 'bold 13px ' + CFONT; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillStyle = nb.length ? '#8a5a00' : '#2e7d32';
  c.fillText('rank = ' + rk + '　自由度 = 3 − ' + rk + ' = ' + nb.length
    + '　⇒ 解は ' + (nb.length === 0 ? '原点だけ' : nb.length === 1 ? '1 本の直線' : nb.length === 2 ? '1 枚の平面' : '空間ぜんぶ'), 10, 8);

  c.fillStyle = 'rgba(92,102,112,.9)'; c.font = '10px ' + CFONT;
  c.textAlign = 'right'; c.textBaseline = 'bottom';
  c.fillText('ドラッグで回せます（ダブルクリックで戻る）', W - 8, H - 5);
};

Sim.prototype.draw = function(){
  this.resize();
  if (!this.W) return;
  if (this.key === 'd2') this.draw2();
  else if (this.key === 'd3') this.draw3();
  else this.drawSol();
};

/* ========================================================================
   6. 数式・読み取り値・解説
   ======================================================================== */
const EQ2 =
  '<math display="block"><mrow>'
  + '<mrow><mo>|</mo><mtable>'
  + '<mtr><mtd><msub><mi>a</mi><mi>x</mi></msub></mtd><mtd><msub><mi>b</mi><mi>x</mi></msub></mtd></mtr>'
  + '<mtr><mtd><msub><mi>a</mi><mi>y</mi></msub></mtd><mtd><msub><mi>b</mi><mi>y</mi></msub></mtd></mtr>'
  + '</mtable><mo>|</mo></mrow>'
  + '<mo>=</mo><msub><mi>a</mi><mi>x</mi></msub><msub><mi>b</mi><mi>y</mi></msub>'
  + '<mo>−</mo><msub><mi>a</mi><mi>y</mi></msub><msub><mi>b</mi><mi>x</mi></msub>'
  + '<mo>=</mo><mo form="prefix" lspace="0em" rspace="0em">±</mo>'
  + '<mo stretchy="false">(</mo><mtext>平行四辺形の面積</mtext><mo stretchy="false">)</mo>'
  + '</mrow></math>'
  + '<span class="cmt">符号は<b>向き</b>を表します。<i>a</i> から <i>b</i> へ反時計回りなら +、時計回りなら −</span>';

const EQ3 =
  '<math display="block"><mrow>'
  + '<mrow><mo>|</mo><mtable>'
  + '<mtr><mtd><msub><mi>f</mi><mn>1</mn></msub></mtd><mtd><msub><mi>g</mi><mn>1</mn></msub></mtd><mtd><msub><mi>h</mi><mn>1</mn></msub></mtd></mtr>'
  + '<mtr><mtd><msub><mi>f</mi><mn>2</mn></msub></mtd><mtd><msub><mi>g</mi><mn>2</mn></msub></mtd><mtd><msub><mi>h</mi><mn>2</mn></msub></mtd></mtr>'
  + '<mtr><mtd><msub><mi>f</mi><mn>3</mn></msub></mtd><mtd><msub><mi>g</mi><mn>3</mn></msub></mtd><mtd><msub><mi>h</mi><mn>3</mn></msub></mtd></mtr>'
  + '</mtable><mo>|</mo></mrow>'
  + '<mo>=</mo><mrow><mo>(</mo><mi mathvariant="bold">f</mi><mo>×</mo><mi mathvariant="bold">g</mi><mo>)</mo></mrow>'
  + '<mo>·</mo><mi mathvariant="bold">h</mi>'
  + '<mo>=</mo><mo form="prefix" lspace="0em" rspace="0em">±</mo>'
  + '<mo stretchy="false">(</mo><mtext>平行六面体の体積</mtext><mo stretchy="false">)</mo>'
  + '</mrow></math>'
  + '<span class="cmt"><b>|f×g| が底面積</b>、<b>h をその法線に射影した長さが高さ</b>。掛ければ体積です</span>';

const EQS =
  '<math display="block"><mrow>'
  + '<mi mathvariant="bold">M</mi><mi mathvariant="bold">x</mi><mo>=</mo><mn>0</mn>'
  + '<mspace width="2.2em"></mspace>'
  + '<mtext>自由度</mtext><mo>=</mo><mi>n</mi><mo>−</mo><mtext>rank&#8201;</mtext><mi mathvariant="bold">M</mi>'
  + '</mrow></math>'
  + '<span class="cmt">自由度が 0 なら解は原点だけ。1 なら直線、2 なら平面が<b>まるごと解</b>になります</span>';

Sim.prototype.updateReadout = function(){
  const R = [];
  if (this.key === 'd2'){
    const a = this.a, b = this.b, d = det2(a, b);
    const M = [[a[0], b[0]], [a[1], b[1]]];
    const rk = rankOf(M), fr = 2 - rk;
    R.push(['ベクトル a', '(' + fx(a[0], 2) + ' , ' + fx(a[1], 2) + ')']);
    R.push(['ベクトル b', '(' + fx(b[0], 2) + ' , ' + fx(b[1], 2) + ')']);
    R.push(['行列式（式のまま）', fx(a[0], 2) + '×' + fx(b[1], 2) + ' − ' + fx(a[1], 2) + '×' + fx(b[0], 2)]);
    R.push(['det', fx(d, 4), Math.abs(d) < 1e-9 ? 'bad' : 'hi']);
    R.push(['|det| ＝ 平行四辺形の面積', fx(Math.abs(d), 4)]);
    R.push(['底辺 |a| × 高さ（検算）', fx(areaByHeight(a, b), 4)]);
    R.push(['向き', Math.abs(d) < 1e-9 ? '―' : (d > 0 ? '+（反時計回り）' : '−（裏返し）')]);
    R.push(['rank', String(rk)]);
    R.push(['2 本の関係', rk === 2 ? '線形独立' : rk === 1 ? '線形従属（同じ直線の上）' : '両方とも 0', rk === 2 ? 'hi' : 'bad']);
    R.push(['張られるもの', spanName(rk, 2)]);
    this.eqbox.innerHTML = EQ2;
    this.body.innerHTML = NOTE2;
  } else if (this.key === 'd3'){
    const f = this.f, g = this.g, h = this.h, d = det3(f, g, h);
    const M = [[f[0], g[0], h[0]], [f[1], g[1], h[1]], [f[2], g[2], h[2]]];
    const rk = rankOf(M);
    const n = cross(f, g);
    R.push(['f', '(' + f.map(function(v){ return fx(v, 2); }).join(' , ') + ')']);
    R.push(['g', '(' + g.map(function(v){ return fx(v, 2); }).join(' , ') + ')']);
    R.push(['h', '(' + h.map(function(v){ return fx(v, 2); }).join(' , ') + ')']);
    R.push(['det', fx(d, 4), Math.abs(d) < 1e-6 ? 'bad' : 'hi']);
    R.push(['|det| ＝ 平行六面体の体積', fx(Math.abs(d), 4)]);
    R.push(['底面積 |f×g|', fx(nrm(n), 4)]);
    R.push(['底面積 × 高さ（検算）', fx(volByHeight(f, g, h), 4)]);
    R.push(['rank', String(rk)]);
    R.push(['3 本の関係', rk === 3 ? '線形独立' : '線形従属', rk === 3 ? 'hi' : 'bad']);
    R.push(['張られるもの', spanName(rk, 3), rk === 3 ? 'hi' : 'bad']);
    if (rk === 2){
      /* f と g が平行だと f×g が 0 になってしまうので、平面を張る別の 2 本で法線を取り直す */
      let nv = n;
      if (nrm(nv) < 1e-9) nv = cross(f, h);
      if (nrm(nv) < 1e-9) nv = cross(g, h);
      R.push(['乗っている平面の法線', '(' + nv.map(function(v){ return fx(v, 2); }).join(' , ') + ')']);
    }
    this.eqbox.innerHTML = EQ3;
    this.body.innerHTML = NOTE3;
  } else {
    const M = this.M, rk = rankOf(M), nb = nullBasis(M);
    const d = det3([M[0][0], M[1][0], M[2][0]], [M[0][1], M[1][1], M[2][1]], [M[0][2], M[1][2], M[2][2]]);
    let worst = 0;
    nb.forEach(function(v){
      M.forEach(function(r){ worst = Math.max(worst, Math.abs(r[0] * v[0] + r[1] * v[1] + r[2] * v[2])); });
    });
    /* 「+ −1.0 x₂」ではなく「− 1.0 x₂」と読めるように符号をまとめる */
    const eqLine = function(r){
      let s = '';
      r.forEach(function(v, j){
        const a = Math.abs(v);
        if (j === 0) s += (v < 0 ? '−' : '') + fx(a, 1);
        else s += (v < 0 ? ' − ' : ' + ') + fx(a, 1);
        s += ' x' + '₁₂₃'[j];
      });
      return s + ' = 0';
    };
    R.push(['1 本目の式', eqLine(M[0])]);
    R.push(['2 本目の式', eqLine(M[1])]);
    R.push(['3 本目の式', eqLine(M[2])]);
    R.push(['det M', fx(d, 4), Math.abs(d) < 1e-9 ? 'bad' : 'hi']);
    R.push(['rank M', String(rk)]);
    R.push(['自由度 = 3 − rank', String(3 - rk), (3 - rk) > 0 ? 'bad' : 'hi']);
    R.push(['自明でない解', nb.length ? 'ある（不定解）' : 'ない（x = 0 だけ）', nb.length ? 'bad' : 'hi']);
    R.push(['解の形', nb.length === 0 ? 'x = (0, 0, 0)'
      : nb.length === 1 ? 'x = k (' + nb[0].map(function(v){ return fx(v, 2); }).join(', ') + ')'
      : nb.length === 2 ? 'x = k (' + nb[0].map(function(v){ return fx(v, 2); }).join(', ') + ') + l ('
                        + nb[1].map(function(v){ return fx(v, 2); }).join(', ') + ')'
      : 'どんな x でも解']);
    R.push(['解空間', spanName(nb.length, 3).replace('平面ぜんぶ（2 次元）', '1 枚の平面（2 次元）')]);
    R.push(['検算 |M·x| の最大', nb.length ? worst.toExponential(2) : '—']);
    this.eqbox.innerHTML = EQS;
    this.body.innerHTML = NOTES;
  }
  this.readout.innerHTML = R.map(function(t){
    return '<div' + (t[2] ? ' class="' + t[2] + '"' : '') + '><span>' + t[0] + '</span><span>' + t[1] + '</span></div>';
  }).join('');
};

/* ------------------------------------------------------------------ */
const NOTE2 =
  '<div class="note key"><b>行列式は「面積」です。</b>'
  + '2 本のベクトルを<b>列に並べて</b>行列を作り、その行列式を取る。'
  + 'すると出てくる数は、<b>その 2 本が張る平行四辺形の面積</b>そのものです。'
  + '講義ノートの例なら a = (2, 1), b = (2, 4) で |A| = 8 − 2 = 6。'
  + '外側の長方形 4×5 = 20 から余分な三角形と長方形を引いても 6 ―― ぴったり合います。'
  + '読み取り値の「底辺 |a| × 高さ」も同じ 6 になっているはずです。</div>'
  + '<div class="note"><b>行列は「変換」でもあります。</b>'
  + '黄色い単位正方形（面積 1）が、この行列によって緑の平行四辺形に写されています。'
  + 'つまり <b>|det| は「面積が何倍になるか」の倍率</b>です。'
  + 'せん断のプリセットを選ぶと、形はゆがむのに面積が 1 のままなのが見えます。'
  + '回転も同じで、det = 1 ―― <b>回転は面積を変えない</b>からです。</div>'
  + '<div class="note"><b>符号は「向き」を表します。</b>'
  + 'a から b へ<b>反時計回り</b>に回るとき +、<b>時計回り</b>なら −。'
  + '「向きが裏返る」プリセットを選ぶと det が負になります。'
  + '面積そのものは |det| で、符号は<b>裏返ったかどうか</b>の情報を余分に持っている、と考えてください。</div>'
  + '<div class="note key"><b>det = 0 が意味すること。</b>'
  + '「b を a に重ねる」を押してみてください。平行四辺形がつぶれて<b>面積が 0</b> になり、'
  + '2 本のベクトルは<b>同じ 1 本の直線</b>に乗ります。'
  + 'これが<b>線形従属</b>です。逆に det ≠ 0 なら、2 本は<b>線形独立</b>で、'
  + '平面上のどんな点でも a と b の組み合わせで表せます。'
  + '講義ノートの c = (2, 1), d = (4, 2) がまさにこれで、d = 2c なので |B| = 4 − 4 = 0 です。</div>';

const NOTE3 =
  '<div class="note key"><b>3 次元では体積になります。</b>'
  + '3 本のベクトルを列に並べた行列の行列式は、<b>その 3 本が張る平行六面体の体積</b>です。'
  + '式で書けば <b>(f×g)·h</b> ―― <b>|f×g| が底面積</b>で、'
  + '<b>h を底面の法線に射影した長さが高さ</b>。掛ければ体積、という素直な話です。'
  + '読み取り値で「底面積 × 高さ」と |det| が一致しているのを確かめてください。</div>'
  + '<div class="note"><b>h を動かしてみてください。</b>'
  + 'h を f, g の平面に近づけると、平行六面体が<b>ぺしゃんこ</b>になっていき、'
  + '体積が 0 に近づきます。「h を f, g の平面へ落とす」を押すと、ちょうど 0 になります。</div>'
  + '<div class="note key"><b>det = 0 でも、つぶれ方は 1 通りではありません。</b>'
  + '<b>rank = 2</b> なら 3 本は<b>1 枚の平面</b>に乗っています（体積 0、面積はある）。'
  + '<b>rank = 1</b> なら<b>1 本の直線</b>にまで潰れています（面積も 0）。'
  + '講義ノートの f = (1,2,3), g = (2,−1,1), h = (1,1,2) は前者で、'
  + '実際 <b>h = 0.6f + 0.2g</b> と書けます ―― h は新しい方向を何も持ち込んでいません。'
  + 'この「どこまで潰れたか」を数えるのが <b>rank</b> です。</div>'
  + '<div class="note"><b>右手系と左手系。</b>'
  + '2 次元の符号が「裏返り」だったのと同じで、3 次元の符号は<b>右手系か左手系か</b>を表します。'
  + '単位ベクトル 3 本のプリセット（det = 1）から、どれか 2 本を入れ替えると det = −1 になります。'
  + '<b>行列式は、列を 2 つ入れ替えるたびに符号が変わる</b>のです。</div>';

const NOTES =
  '<div class="note key"><b>同次連立方程式 Mx = 0 には、いつでも x = 0 という解があります。</b>'
  + 'これを<b>自明な解</b>といいます。知りたいのは「それ以外に解があるか」。'
  + '<b>det ≠ 0 なら逆行列があるので x = M<sup>−1</sup>0 = 0</b> ―― 自明な解しかありません。'
  + '<b>det = 0 のときだけ</b>、原点以外の解が現れます。</div>'
  + '<div class="note"><b>3 本の式は、原点を通る 3 枚の平面です。</b>'
  + '<i>a</i>x₁ + <i>b</i>x₂ + <i>c</i>x₃ = 0 は、法線 (<i>a</i>, <i>b</i>, <i>c</i>) を持つ平面。'
  + '解とは<b>3 枚が共通に持っている点の集まり</b>です。'
  + 'ふつうは原点 1 点だけ（自由度 0）。ところが平面どうしが同じ向きを向き始めると、'
  + '交わりが<b>直線</b>（自由度 1）や<b>平面</b>（自由度 2）に太っていきます。</div>'
  + '<div class="note key"><b>自由度 = n − rank。</b>'
  + '<b>rank は「本当に効いている式の本数」</b>です。'
  + '講義ノート 例②では、3 本目の式が 1 本目・2 本目から作れてしまうので rank = 2。'
  + '未知数 3 つに対して式が実質 2 本しかないので、<b>1 つは自由に選んでよい</b> ―― 自由度 1、'
  + '解は x = k(−1, 1, 1) という<b>直線</b>になります。'
  + '例③では 3 本の式がすべて同じ式の定数倍で rank = 1。'
  + '自由度 2 で、解は 2x₁ − x₂ + x₃ = 0 という<b>平面</b>まるごとです。</div>'
  + '<div class="note"><b>3 行目のスライダーを動かしてみてください。</b>'
  + 'rank が 3 のあいだは解が原点だけ（黄色い点）。'
  + 'rank が 2 に落ちた瞬間に<b>黄色い直線</b>が現れ、1 まで落ちると<b>黄色い平面</b>に広がります。'
  + '<b>det が 0 を横切るその瞬間に、解が「点」から「線」へ化ける</b>のが見どころです。</div>'
  + '<div class="note key"><b>これが永年方程式の正体です。</b>'
  + '量子化学で「行列式を 0 と置く」のは、まさにこの理由からです。'
  + '<math><mrow><mo>(</mo><mi mathvariant="bold">H</mi><mo>−</mo><mi>ε</mi><mi mathvariant="bold">S</mi><mo>)</mo></mrow>'
  + '<mi mathvariant="bold">c</mi><mo>=</mo><mn>0</mn></math> で '
  + '<b>c = 0 では波動関数が消えてしまう</b>ので、自明でない解が要る。'
  + 'そのためには行列式が 0 でなければならない ―― そこから固有値 <i>ε</i> が決まります。'
  + '<a href="lagrange-simulator.html" target="_blank" rel="noopener noreferrer">Lagrange の未定乗数法のページ</a>で、'
  + 'その様子を実際に動かせます。</div>';

/* ========================================================================
   7. 立ち上げ
   ======================================================================== */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let only = null;
const mm = /[?&]only=(d2|d3|sol)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');

['d2', 'd3', 'sol'].forEach(function(key){
  const q = app.querySelector('[data-panel="' + key + '"]');
  if (!q) return;
  if (only && only !== key){ q.parentNode.removeChild(q); return; }
  sims[key] = new Sim(key, q);
});

let active = only || 'd2';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(q){ q.hidden = (q.dataset.panel !== name); });
  sims[name].refresh();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].draw(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].refresh(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
