<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水素原子 ― 軌道の形とぼやけた電子雲</title>
<style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります。
   スタイルはすべて #qsim 配下にスコープしてあるので、
   既存ページに <div id="qsim">…</div> ごと貼り付けても衝突しません。
   （直貼りするときは、下の html,body ブロックだけ削除してください）
   ========================================================================== */
html, body { margin:0; background:#fafafa; }

#qsim{
  --bg:#fafafa;
  --panel:#ffffff;
  --panel-soft:#f4f6f9;
  --fg:#1f2328;
  --sub:#5c6670;
  --line:rgba(31,35,40,.12);
  --accent:#0f4c81;
  --accent-strong:#0a355a;
  --accent-soft:#e7eff7;
  --qm:#0f4c81;          /* 波動関数・確率 */
  --pos:#0f4c81;         /* Y > 0 */
  --neg:#c62828;         /* Y < 0 */
  --dot:#f9a825;
  --proton:#e53935;      /* 陽子 */
  --warn:#8a5a00;
  --warnbg:#fdf5e3;
  --shadow:0 14px 32px rgba(20,34,51,.08);
  --radius-lg:20px;
  --radius-md:14px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color:var(--fg); font-family:var(--font); line-height:1.7;
  max-width:1120px; margin:0 auto; padding:16px 18px 22px;
  -webkit-text-size-adjust:100%;
}
#qsim *{box-sizing:border-box}
#qsim h1{font-size:1.34rem; line-height:1.3; margin:0 0 4px; color:#15202b; letter-spacing:.01em}
#qsim p{margin:.3em 0}
#qsim .lead{color:var(--sub); font-size:.86rem; margin:0}

/* --- タブ --- */
#qsim .tabs{display:flex; gap:8px; margin:14px 0 14px; flex-wrap:wrap}
#qsim .tab{
  font:inherit; font-size:.92rem; font-weight:700; cursor:pointer;
  padding:8px 18px; border-radius:999px; border:1px solid var(--line);
  background:rgba(255,255,255,.7); color:#15202b;
  transition:background-color .2s ease, color .2s ease, transform .2s ease;
}
#qsim .tab:hover{background:rgba(15,76,129,.10); color:var(--accent-strong); transform:translateY(-1px)}
#qsim .tab.is-active{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .panel[hidden]{display:none}
/* 埋め込みのとき：見出しは隠す。
   タブは残す ―― 埋め込み先からでも ①② を押し比べられるようにするため。
   ?only=… で 1 枚だけ埋め込んだときは、押せるタブが 1 つもないので隠す。 */
#qsim.is-embed{padding-top:6px}
#qsim.is-embed > h1,
#qsim.is-embed > .lead{display:none}
#qsim.is-embed > .tabs{margin:2px 0 12px}
#qsim.is-single > .tabs{display:none}

/* --- 2 カラム：左 = 図 / 右 = パラメーター --- */
#qsim .layout{
  display:grid; grid-template-columns:minmax(0,3fr) minmax(248px,1fr);
  gap:16px; align-items:start;
}
@media (max-width:860px){ #qsim .layout{grid-template-columns:1fr} }

/* --- 右カラム：コントロール --- */
#qsim .controls{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--shadow); padding:13px 14px;
}
#qsim .ctlhead{
  font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--sub); margin:0 0 8px;
}
/* 見出しの中でも量子数は小文字のまま見せる（m を M にしない） */
#qsim .ctlhead .lc{text-transform:none; font-size:1.05em}
#qsim .hint{display:block; font-size:.71rem; color:var(--sub); line-height:1.45; margin-top:6px}
#qsim .sep{height:1px; background:var(--line); margin:13px 0 11px; border:0}
#qsim .fld{display:flex; flex-direction:column; gap:3px; font-size:.78rem; color:var(--sub)}
#qsim .fld b{font-weight:700; color:var(--fg); font-size:.82rem}
#qsim .fld .hint{font-size:.71rem; color:var(--sub); line-height:1.45}

/* --- 軌道の一覧（クリックで選ぶ） --- */
#qsim .orbgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:2px}
#qsim .orb{
  font:inherit; font-size:.9rem; font-weight:700; cursor:pointer; text-align:center;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.85); color:#15202b;
  padding:8px 2px 6px; border-radius:10px; line-height:1.15;
  transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
#qsim .orb small{display:block; font-size:.62rem; font-weight:400; color:var(--sub); margin-top:1px}
#qsim .orb:hover{border-color:rgba(15,76,129,.55); box-shadow:0 8px 18px rgba(20,34,51,.10); transform:translateY(-1px)}
#qsim .orb.on{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .orb.on small{color:rgba(255,255,255,.78)}

/* --- 小さいピル（m の選択など） --- */
#qsim .pills{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
#qsim .pill{
  font:inherit; font-size:.78rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.85); color:#15202b;
  padding:5px 11px; border-radius:999px; white-space:nowrap;
  transition:border-color .18s ease, transform .18s ease;
}
#qsim .pill:hover:not(:disabled){border-color:rgba(15,76,129,.55); transform:translateY(-1px)}
#qsim .pill.on{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .pill:disabled{opacity:.32; cursor:default}

/* --- ボタン --- */
#qsim .btnrow{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:8px}
#qsim button.act{
  font:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.8); color:#15202b;
  padding:7px 10px; border-radius:9px; white-space:nowrap;
  transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
#qsim button.act:hover{border-color:rgba(15,76,129,.5); box-shadow:0 8px 18px rgba(20,34,51,.10); transform:translateY(-1px)}
#qsim button.act.primary{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim button.act.on{background:#b3261e; border-color:#b3261e; color:#fff}
#qsim .ctlrow{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  font-size:.76rem; color:var(--sub); margin-top:9px;
}
#qsim .ctlrow input[type=range]{flex:1 1 84px; min-width:70px; accent-color:var(--accent)}
#qsim .chk{display:flex; align-items:flex-start; gap:6px; font-size:.75rem;
  color:var(--sub); cursor:pointer; margin-top:9px; line-height:1.45}
#qsim .chk input{accent-color:var(--accent); cursor:pointer; margin-top:3px}

/* --- 左カラム：キャンバス --- */
#qsim .stage{
  border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;
  background:var(--panel); box-shadow:var(--shadow);
}
/* 電子雲は加算合成で描くので、背景を暗くしないと「ぼやけ」が見えない */
#qsim .stage.dark{background:#0c141f; border-color:#0c141f}
#qsim .stage.dark canvas{cursor:grab}
#qsim .stage.dark canvas:active{cursor:grabbing}
#qsim canvas{display:block; width:100%; height:auto; touch-action:none}
#qsim .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.75rem;
  color:var(--sub); margin:8px 2px 0}
#qsim .legend i{display:inline-block; width:15px; height:3px; border-radius:2px;
  vertical-align:middle; margin-right:5px}

/* --- 読み取り値 --- */
#qsim .readout{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
  gap:0 18px; margin-top:10px; font-size:.76rem;
}
#qsim .readout div{display:flex; justify-content:space-between; gap:10px;
  border-bottom:1px dotted var(--line); padding:3px 0}
#qsim .readout span:first-child{color:var(--sub)}
#qsim .readout span:last-child{font-variant-numeric:tabular-nums; font-weight:700}
#qsim sup{font-size:.72em}

/* --- 数式 --- */
#qsim .eq{
  text-align:center; padding:11px 8px; margin:10px 0 0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  overflow-x:auto;
}
/* 数式はブラウザ標準の MathML。数式フォントを明示しないと根号や括弧が
   中身の高さに伸びない（macOS は STIX Two Math、Windows は Cambria Math が標準） */
#qsim math{
  font-size:1.05em;
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  line-height:normal;
}
#qsim .eq math[display="block"]{font-size:1.12rem; margin:0 auto}
#qsim .eq .cmt{color:var(--sub); font-size:.82rem; display:block; margin-top:4px}
/* 本文中の変数。text-transform:math-auto で 1 文字を数式イタリック
   （Unicode の Mathematical Italic）へ写像すると、MathML の <mi> と
   まったく同じ字形になる。未対応ブラウザ用に素の italic を残す。 */
#qsim i{
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  font-size:1.05em; font-style:italic;
}
@supports (text-transform: math-auto){
  #qsim i{font-style:normal; text-transform:math-auto}
}

/* --- 解説（折りたたみ） --- */
#qsim .explain{
  margin-top:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-md); padding:0 14px;
}
#qsim .explain > summary{
  cursor:pointer; list-style:none; padding:10px 0; font-size:.82rem; font-weight:700;
  color:var(--accent-strong);
}
#qsim .explain > summary::-webkit-details-marker{display:none}
#qsim .explain > summary::before{content:"▶ "; font-size:.72em; color:var(--sub)}
#qsim .explain[open] > summary::before{content:"▼ "}
#qsim .explain[open] > summary{border-bottom:1px solid var(--line)}
#qsim .explain .body{padding:4px 0 12px}
#qsim .note{
  font-size:.78rem; color:var(--sub); background:var(--panel-soft);
  border-left:3px solid var(--line); border-radius:0 8px 8px 0;
  padding:8px 12px; margin:9px 0;
}
#qsim .note.warn{color:var(--warn); background:var(--warnbg); border-left-color:currentColor}
#qsim .note b{color:inherit}
#qsim .foot{margin-top:12px; font-size:.73rem; color:var(--sub); text-align:center}
</style>
</head>
<body>
<div id="qsim">
  <h1>水素原子 ― 軌道の形と、ぼやけた電子雲</h1>
  <p class="lead">
    陽子 1 個のつくる Coulomb ポテンシャル <i>V</i> = −<i>e</i><sub>0</sub><sup>2</sup>/4π<i>ε</i><sub>0</sub><i>r</i> の中の電子。
    Schrödinger 方程式を極座標で解くと <i>ψ</i> = <i>R</i><sub><i>n</i><i>l</i></sub>(<i>r</i>)<i>Y</i><sub><i>l</i><i>m</i></sub>(<i>θ</i>,<i>φ</i>) となり、
    <b>1s, 2s, 2p, 3s, 3p, 3d, …</b> が出てきます。①でその形を、②で<b>ぼやけた電子そのもの</b>を見ます。
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="shape" role="tab">① 動径分布関数と球面調和関数</button>
    <button class="tab" data-tab="cloud" role="tab">② ぼやけた電子雲を回す</button>
  </div>

  <section class="panel" data-panel="shape"></section>
  <section class="panel" data-panel="cloud" hidden></section>

  <p class="foot">
    長さはすべて Bohr 半径 <i>a</i><sub>B</sub> = 4π<i>ε</i><sub>0</sub><i>ħ</i><sup>2</sup>/<i>m</i><sub>e</sub><i>e</i><sub>0</sub><sup>2</sup> = 52.918 pm を単位にしています。
  </p>
</div>
<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数と軌道の一覧
   ------------------------------------------------------------------------
   長さは Bohr 半径 a_B、エネルギーは Hartree、時間は原子単位で計算する
   （ħ = m_e = e₀²/4πε₀ = 1）。表示するときだけ pm / eV / fs へ直す。
   ======================================================================== */
const A0_PM  = 52.917721067;          // Bohr 半径 [pm]
const E_H_EV = 27.211386245988;       // 1 Hartree [eV]
const T_AU_S = 2.4188843265857e-17;   // 時間の原子単位 [s]
const CFONT  = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

/* ノート (16) の表と同じ 10 個。n ≤ 4、l ≤ n−1 */
const ORB = [
  { k:'1s', n:1, l:0 }, { k:'2s', n:2, l:0 }, { k:'2p', n:2, l:1 },
  { k:'3s', n:3, l:0 }, { k:'3p', n:3, l:1 }, { k:'3d', n:3, l:2 },
  { k:'4s', n:4, l:0 }, { k:'4p', n:4, l:1 }, { k:'4d', n:4, l:2 }, { k:'4f', n:4, l:3 }
];

/* 実軌道の慣用名。kind = 0 が cos 型、1 が sin 型 */
const RNAME = {
  '0,0,0':'s',
  '1,0,0':'p_z',  '1,1,0':'p_x',  '1,1,1':'p_y',
  '2,0,0':'d_z²', '2,1,0':'d_xz', '2,1,1':'d_yz', '2,2,0':'d_x²−y²', '2,2,1':'d_xy',
  '3,0,0':'f_z³', '3,1,0':'f_xz²','3,1,1':'f_yz²','3,2,0':'f_z(x²−y²)','3,2,1':'f_xyz',
  '3,3,0':'f_x(x²−3y²)', '3,3,1':'f_y(3x²−y²)'
};

/* ========================================================================
   1. 波動関数（ノート (15)(16) の式をそのまま）
   ======================================================================== */
function fact(n){ let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

/* ノート (16) の R(r)。原子単位（a_B = 1）。
     R = √{(n−l−1)!/(n²((n+l)!)³)} · e^(−r/n)/r · Σ_{k=2l+1}^{n+l} c_k (2r/n)^(k−l)
     c_k = (−1)^k ((n+l)!)² / {(k−2l−1)! k! (n+l−k)!}
   先頭の項が必ず (−1)^(2l+1) = −1 なので、そのままだと r → 0 で R < 0 になる。
   ノート (16) の表（1s = 2e^(−r) など）は正で始まるので、全体符号を反転して合わせた。
   |ψ|² には効かない、Laguerre 多項式の流儀の違い。 */
function Rnl(n, l, r){
  if (r <= 0) return 0;
  const A = Math.sqrt(fact(n - l - 1) / (n * n * Math.pow(fact(n + l), 3)));
  let s = 0;
  for (let k = 2*l + 1; k <= n + l; k++){
    s += Math.pow(-1, k) * Math.pow(fact(n + l), 2)
       / (fact(k - 2*l - 1) * fact(k) * fact(n + l - k))
       * Math.pow(2 * r / n, k - l);
  }
  return -A * Math.exp(-r / n) / r * s;
}

/* 付随 Legendre P_l^m(x)。Condon–Shortley 位相 (−1)^m は付けない
   ―― ノート (16) 下段の表（p_x = ½√(3/π) sinθ cosφ など）と向きを揃えるため。 */
function plm(l, m, x){
  m = Math.abs(m);
  if (m > l) return 0;
  let pmm = 1;
  if (m > 0){
    const s = Math.sqrt(Math.max(0, 1 - x * x));
    let f = 1;
    for (let i = 1; i <= m; i++){ pmm *= f * s; f += 2; }      /* (2m−1)!! sᵐ */
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2*m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++){
    pll = ((2*ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

/* 実球面調和関数（ノート (16) 下段の表そのもの）。ct = cosθ
     m = 0        : N_l0 P_l(cosθ)
     m ≠ 0 cos 型 : √2 N_lm P_l^|m|(cosθ) cos(|m|φ)
     m ≠ 0 sin 型 : √2 N_lm P_l^|m|(cosθ) sin(|m|φ)
     N_lm = √{(2l+1)/4π · (l−|m|)!/(l+|m|)!} */
function Ylm(l, m, kind, ct, ph){
  const am = Math.abs(m);
  const N = Math.sqrt((2*l + 1) / (4 * Math.PI) * fact(l - am) / fact(l + am));
  const P = plm(l, am, ct);
  if (am === 0) return N * P;
  return Math.SQRT2 * N * P * (kind ? Math.sin(am * ph) : Math.cos(am * ph));
}
/* 複素軌道 ψ_nlm ∝ e^{imφ} のときの |Y|²。φ に依らない（＝軸対称） */
function Yabs2(l, m, ct){
  const am = Math.abs(m);
  const N = Math.sqrt((2*l + 1) / (4 * Math.PI) * fact(l - am) / fact(l + am));
  const P = plm(l, am, ct);
  return N * N * P * P;
}

/* ========================================================================
   2. 表示のヘルパ
   ======================================================================== */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
             '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(v){ return String(v).split('').map(function(c){ return SUP[c] || c; }).join(''); }
function fmt(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10' + sup(Number(p[1]));
  }
  return String(Number(v.toPrecision(n)));
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function axes(c, x0, y0, x1, y1, xlab, ylab){
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'right'; c.fillText(xlab, x1 - 3, y1 - 4);
  c.textAlign = 'left';  c.fillText(ylab, x0 + 4, y0 + 12);
}
/* ボックス–Muller。sin 側も捨てずに使う */
let _g2 = null;
function gauss(){
  if (_g2 !== null){ const v = _g2; _g2 = null; return v; }
  let u = 0;
  while (u === 0) u = Math.random();
  const v = Math.random(), r = Math.sqrt(-2 * Math.log(u));
  _g2 = r * Math.sin(2 * Math.PI * v);
  return r * Math.cos(2 * Math.PI * v);
}

/* ========================================================================
   3. 解説（折りたたみ）
   ======================================================================== */
const SHAPE_NOTES =
  '<div class="note"><b>動径分布関数 <i>P</i>(<i>r</i>) = <i>r</i>²|<i>R</i>(<i>r</i>)|² が「殻」の正体です。</b>\n' +
  '|<i>R</i>|² そのものは 1s なら <i>r</i> = 0 で最大です（原点がいちばん濃い）。\n' +
  'ところが「半径 <i>r</i> と <i>r</i>+d<i>r</i> のあいだの薄い球殻」に電子を見つける確率は\n' +
  '|<i>R</i>|² × <i>r</i>²d<i>r</i> なので、<b>球殻の面積 ∝ <i>r</i>² を掛けた形</b>で考えなければいけません。\n' +
  'これが <i>P</i>(<i>r</i>) で、1s では <i>r</i> = <i>a</i><sub>B</sub> にきれいな山ができます。\n' +
  '<b>Bohr 半径が「いちばんありそうな半径」として自然に出てくる</b>のがここです。</div>\n' +
  '<div class="note"><b>節の数は式を見なくても数えられます。</b>\n' +
  '動径の節（<i>P</i> が 0 になる <i>r</i> > 0）は <i>n</i> − <i>l</i> − 1 個、\n' +
  '角度の節（<i>Y</i> が 0 になる面）は <i>l</i> 個、合わせて必ず <i>n</i> − 1 個です。\n' +
  '2s には 1 個、3s には 2 個の球状の節があり、2p には節面が 1 枚あります\n' +
  '（<i>p</i><sub><i>z</i></sub> なら <i>xy</i> 面、<i>p</i><sub><i>x</i></sub> なら <i>yz</i> 面）。\n' +
  '<b>節が増えるほどエネルギーが上がる</b>のは、1 次元の井戸や調和振動子とまったく同じ事情です。</div>\n' +

/* ========================================================================
   4. シミュレーター本体
   ======================================================================== */
function Sim(key, root){
  this.key   = key;          // 'shape' | 'cloud'
  this.root  = root;
  this.oi    = 0;            // 軌道（ORB のインデックス）
  this.m     = 0;            // |m|
  this.kind  = 0;            // 実軌道の 0 = cos 型 / 1 = sin 型
  this.basis = 'real';       // 'real' | 'plus' | 'minus'
  this.nDots = 6000;
  this.twinkle = 0.20;       // 1 秒あたり測り直す割合
  this.spin  = true;         // 視点を回す
  this.slab  = false;        // 断面だけ見る
  /* 教材ページには iframe がいくつも並ぶ。全部がいっせいに動き出すと
     落ち着いて読めないので、止まった状態で開く（読む人が選んで再生する） */
  this.playing = false;
  this.speed = 1;
  this.yaw = 0.55; this.pitch = 0.34;
  this.drag = null;
  this.build();
  this.recompute();
}
Sim.prototype.orb  = function(){ return ORB[this.oi]; };
/* 符号つきの m。実軌道は +|m| と −|m| の重ね合わせなので流れは 0 */
Sim.prototype.mSig = function(){
  return this.basis === 'plus' ? this.m : this.basis === 'minus' ? -this.m : 0;
};
Sim.prototype.label = function(){
  const o = this.orb();
  if (this.basis === 'real'){
    /* RNAME は 's', 'p_x', 'd_xy' … と軌道の文字から始まるので n を前に付けるだけ */
    return o.n + (RNAME[o.l + ',' + this.m + ',' + (this.m ? this.kind : 0)] || o.k.slice(1));
  }
  return 'ψ (n = ' + o.n + ', l = ' + o.l + ', m = ' + (this.mSig() > 0 ? '+' : '−') + this.m + ')';
};

/* ---- 角度分布 ---- */
Sim.prototype.angAt = function(ct, ph){
  const o = this.orb();
  return this.basis === 'real' ? Math.pow(Ylm(o.l, this.m, this.kind, ct, ph), 2)
                               : Yabs2(o.l, this.m, ct);
};

/* ---- 動径分布 P(r) = r²|R|² の逆関数表をつくる ----
   これで「P(r) に従う r」を一様乱数 1 個から引ける（逆関数法）。 */
Sim.prototype.buildRadial = function(){
  const o = this.orb(), NB = 3000, rmax = 22 * o.n + 16;
  const xs = new Float64Array(NB + 1), cd = new Float64Array(NB + 1);
  let acc = 0, peak = 0, pv = -1, mean = 0;
  for (let i = 0; i <= NB; i++){
    const r = rmax * i / NB, R = Rnl(o.n, o.l, r), p = R * R * r * r;
    xs[i] = r;
    if (i > 0){ acc += p * (rmax / NB); mean += p * r * (rmax / NB); }
    cd[i] = acc;
    if (p > pv){ pv = p; peak = r; }
  }
  for (let i = 0; i <= NB; i++) cd[i] /= acc;
  this.tab = { xs: xs, cd: cd };
  this.rPeak = peak;
  this.rMean = mean / acc;
  this.pMax  = pv;
  /* 表示範囲：確率の 97 % が入る半径。99 % まで取ると外側の薄い裾に引きずられて
     肝心の殻が小さくなってしまうので、少し内側で切っている。 */
  let i97 = NB;
  for (let i = 0; i <= NB; i++) if (cd[i] >= 0.97){ i97 = i; break; }
  this.rView = Math.max(xs[i97] * 1.05, this.rPeak * 2.2);
  /* 棄却法に使う |Y|² の最大値 */
  let ym = 0;
  for (let i = 0; i <= 240; i++){
    const ct = -1 + 2 * i / 240;
    if (this.basis === 'real'){
      for (let j = 0; j <= 240; j++) ym = Math.max(ym, this.angAt(ct, j * 2 * Math.PI / 240));
    } else ym = Math.max(ym, this.angAt(ct, 0));
  }
  this.yMax = ym;
};
Sim.prototype.sampleR = function(){
  const t = this.tab, u = Math.random();
  let lo = 0, hi = t.cd.length - 1;
  while (hi - lo > 1){ const mid = (lo + hi) >> 1; if (t.cd[mid] < u) lo = mid; else hi = mid; }
  const d = t.cd[hi] - t.cd[lo];
  const f = d > 1e-300 ? (u - t.cd[lo]) / d : 0;
  return t.xs[lo] + f * (t.xs[hi] - t.xs[lo]);
};
/* 1 個の質点を |ψ|² に従って置き直す（＝ 1 回の測定） */
Sim.prototype.placeDot = function(i){
  const r = this.sampleR();
  let ct, ph, tries = 0;
  do {
    ct = 2 * Math.random() - 1;
    ph = 2 * Math.PI * Math.random();
    tries++;
  } while (Math.random() * this.yMax > this.angAt(ct, ph) && tries < 400);
  const st = Math.sqrt(Math.max(0, 1 - ct * ct));
  this.dots[3*i]     = r * st;      // ρ（z 軸からの距離）
  this.dots[3*i + 1] = r * ct;      // z
  this.dots[3*i + 2] = ph;          // φ
};
Sim.prototype.seedDots = function(){
  this.dots = new Float64Array(3 * this.nDots);
  for (let i = 0; i < this.nDots; i++) this.placeDot(i);
  this.tw = 0;                       // 測り直しの端数キャリー
  this.next = 0;                     // 次に測り直す番号
};

/* ---- 物理量（表示用） ---- */
Sim.prototype.phys = function(){
  const o = this.orb(), n = o.n, l = o.l;
  const E = -E_H_EV / (2 * n * n);
  const rMeanExact = 0.5 * (3 * n * n - l * (l + 1));
  /* 最確半径 ρ = r_peak（θ = π/2）での公転周期。原子単位で ω = |m|/ρ² */
  const ms = Math.abs(this.mSig());
  const per = ms > 0 ? 2 * Math.PI * this.rPeak * this.rPeak / ms * T_AU_S : NaN;
  return { n: n, l: l, E: E, rMeanExact: rMeanExact, period: per };
};

    pb.addEventListener('click', function(){
      self.playing = !self.playing;
      this.textContent = self.playing ? '❚❚ 止める' : '▶ 動かす';
      this.className = self.playing ? 'act primary' : 'act';
      kick();
    });
    row.appendChild(pb);
    const rb = el('button','act','測り直す');
    rb.type = 'button';
    rb.addEventListener('click', function(){ self.seedDots(); self.draw(); kick(); });
    row.appendChild(rb);
    ctrl.appendChild(row);

    /* ドラッグで視点 */
    const pd = function(e){
      const t = e.touches ? e.touches[0] : e;
      self.drag = { x: t.clientX, y: t.clientY };
      if (e.cancelable) e.preventDefault();
    };
    const pm = function(e){
      if (!self.drag) return;
      const t = e.touches ? e.touches[0] : e;
      self.yaw   += (t.clientX - self.drag.x) * 0.008;
      self.pitch += (t.clientY - self.drag.y) * 0.006;
      self.pitch = Math.max(-1.45, Math.min(1.45, self.pitch));
      self.drag = { x: t.clientX, y: t.clientY };
      self.draw();
      if (e.cancelable) e.preventDefault();
    };
    const pu = function(){ self.drag = null; };
    cv.addEventListener('mousedown', pd);
    window.addEventListener('mousemove', pm);
    window.addEventListener('mouseup', pu);
    cv.addEventListener('touchstart', pd, {passive:false});
    cv.addEventListener('touchmove', pm, {passive:false});
    window.addEventListener('touchend', pu);
  }

  /* 折りたたみ解説 */
  const dt = el('details','explain');
  dt.appendChild(el('summary', null, this.key === 'shape'
    ? 'この図の読み方（動径分布関数・節・縮退）'
    : '「ぼやけた電子」をどう作っているか（確率の流れと測定）'));
  dt.appendChild(el('div','body', this.key === 'shape' ? SHAPE_NOTES : CLOUD_NOTES));
  this.root.appendChild(dt);
};

Sim.prototype.recompute = function(){
  const o = this.orb();
  if (this.m > o.l) this.m = o.l;
  if (this.m === 0) this.basis = 'real';
  this.buildRadial();
  /* 見やすい速さ：最確半径にいる質点が 5 秒で 1 周するように合わせる。
     本当の周期（fs のオーダー）は読み取り値に出している。 */
  this.flowScale = (2 * Math.PI / 5) * this.rPeak * this.rPeak / Math.max(1, this.m);
  if (this.key === 'cloud') this.seedDots();
  /* ボタンの見た目 */
  const self = this;
  this.orbBtns.forEach(function(b, i){ b.classList.toggle('on', i === self.oi); });
  this.mBtns.forEach(function(b, i){
    b.disabled = i > o.l;
    b.classList.toggle('on', i === self.m && i <= o.l);
  });
  this.bBtns.forEach(function(b, i){
    b.disabled = (self.m === 0 && i > 0);
    b.classList.toggle('on', ['real','plus','minus'][i] === self.basis);
  });
  this.kindRow.style.display = (this.basis === 'real' && this.m > 0) ? '' : 'none';
  this.kBtns.forEach(function(b, i){
    b.classList.toggle('on', i === self.kind);
    b.textContent = RNAME[o.l + ',' + self.m + ',' + i] || (i ? 'sin 型' : 'cos 型');
  });
  this.basisHint.innerHTML = this.m === 0
    ? 'm = 0 では実軌道と複素軌道が同じものになります'
    : (this.basis === 'real'
        ? '実軌道は m = +|m| と −|m| の和・差。形は見やすいが L<sub>z</sub> の固有状態ではなく、確率の流れは 0'
        : 'e<sup>imφ</sup> 型。L<sub>z</sub> = m&#8463; の固有状態で、確率が z 軸のまわりを流れます');
  this.resize();
  this.draw();
  this.updateReadout();
  kick();
};

Sim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = (this.key === 'shape')
    ? Math.round(Math.max(360, Math.min(540, w * 0.74)))
    : Math.round(Math.max(330, Math.min(520, w * 0.60)));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  this.cv.width = Math.round(w * dpr);
  this.cv.height = Math.round(h * dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  this.draw();
};

Sim.prototype.draw = function(){
  if (!this.W) return;
  if (this.key === 'shape'){ this.ctx.clearRect(0, 0, this.W, this.H); this.drawShape(); }
  else this.drawCloud();
};

/* ========================================================================
   5. タブ①：動径分布関数と球面調和関数
   ======================================================================== */
Sim.prototype.drawShape = function(){
  const c = this.ctx, W = this.W, H = this.H, o = this.orb();
  const padL = 40, padR = 14, gap = 14;
  const X0 = padL, X1 = W - padR;
  const hTop = Math.round((H - gap) * 0.46);
  const Ay0 = 0, AB = hTop - 14, Ay1 = hTop;     /* AB = 枠の下端。下 14 px は目盛の帯 */
  const By0 = Ay1 + gap, By1 = H;

  /* ---------------- 上：R(r) と P(r) = r²|R|² ---------------- */
  const RV = this.rView;
  const px = function(r){ return X0 + r / RV * (X1 - X0); };
  axes(c, X0, Ay0, X1, AB, '半径 r / a_B →', '① 動径分布関数 P(r) = r²|R(r)|²');

  /* R(r) の縦スケール */
  let rmax = 1e-30;
  for (let i = 1; i <= 600; i++) rmax = Math.max(rmax, Math.abs(Rnl(o.n, o.l, RV * i / 600)));
  const yR0 = Ay0 + (AB - Ay0) * 0.40;                    /* R = 0 の高さ */
  const yR = function(v){ return yR0 - v / rmax * (AB - Ay0) * 0.24; };
  const yP = function(v){ return AB - 6 - v / this.pMax * (AB - Ay0 - 30); }.bind(this);

  /* 動径の節（R が符号を変える r > 0） */
  const nodes = [];
  let ps = 0;
  for (let i = 1; i <= 2400; i++){
    const r = RV * i / 2400, v = Rnl(o.n, o.l, r);
    const s = v > 0 ? 1 : v < 0 ? -1 : 0;
    if (s !== 0){
      if (ps !== 0 && s !== ps) nodes.push(r - RV / 4800);
      ps = s;
    }
  }
  c.setLineDash([3,3]); c.strokeStyle = 'rgba(31,35,40,.30)'; c.lineWidth = 1;
  nodes.forEach(function(r){
    c.beginPath(); c.moveTo(px(r), Ay0 + 16); c.lineTo(px(r), AB - 4); c.stroke();
  });
  c.setLineDash([]);
  if (nodes.length){
    c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
    c.fillText('節', px(nodes[0]), Ay0 + 26);
  }

  /* R(r)：薄いグレーの補助線（0 の線つき） */
  c.strokeStyle = 'rgba(31,35,40,.16)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(X0, yR(0)); c.lineTo(X1, yR(0)); c.stroke();
  c.fillStyle = '#8a94a6'; c.font = '9px ' + CFONT; c.textAlign = 'right';
  c.fillText('R = 0', X1 - 4, yR(0) - 3);
  c.strokeStyle = '#8a94a6'; c.lineWidth = 1.4;
  c.beginPath();
  for (let i = 1; i <= 700; i++){
    const r = RV * i / 700, Y = yR(Rnl(o.n, o.l, r));
    if (i === 1) c.moveTo(px(r), Y); else c.lineTo(px(r), Y);
  }
  c.stroke();

  /* P(r)：塗り＋太線 */
  c.beginPath();
  c.moveTo(px(0), AB - 6);
  for (let i = 0; i <= 700; i++){
    const r = RV * i / 700, R = Rnl(o.n, o.l, r);
    c.lineTo(px(r), yP(R * R * r * r));
  }
  c.lineTo(px(RV), AB - 6); c.closePath();
  c.fillStyle = 'rgba(15,76,129,.16)'; c.fill();
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.2;
  c.beginPath();
  for (let i = 0; i <= 700; i++){
    const r = RV * i / 700, R = Rnl(o.n, o.l, r), Y = yP(R * R * r * r);
    if (i === 0) c.moveTo(px(r), Y); else c.lineTo(px(r), Y);
  }
  c.stroke();

  /* 最確半径と ⟨r⟩ */
  c.strokeStyle = '#f9a825'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(px(this.rPeak), yP(this.pMax)); c.lineTo(px(this.rPeak), AB - 6); c.stroke();
  c.fillStyle = '#8a5a00'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  c.fillText('最確 ' + fmt(this.rPeak, 3) + ' a_B', px(this.rPeak), yP(this.pMax) - 5);
  c.fillStyle = '#c62828';
  c.beginPath(); c.arc(px(this.rMean), AB - 6, 3.2, 0, 6.2832); c.fill();
  c.textAlign = 'left';
  c.fillText('⟨r⟩', px(this.rMean) + 5, AB - 9);

  /* 目盛 */
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  const step = RV > 60 ? 20 : RV > 30 ? 10 : RV > 12 ? 5 : 1;
  for (let r = 0; r <= RV; r += step) c.fillText(String(r), px(r), Ay1 - 2);

  /* ---------------- 下：Y(θ,φ) の断面 2 枚 ---------------- */
  const bw = (X1 - X0 - 12) / 2;
  this.drawPolar(X0,           By0, X0 + bw, By1, 'vert');
  this.drawPolar(X0 + bw + 12, By0, X1,      By1, 'horiz');
};

/* |Y| を半径にした極座標プロット。青が Y > 0、赤が Y < 0
     'vert'  … z 軸を含む縦の断面。sin 型（p_y, d_xy …）は φ = 0 の面で
               ちょうど 0 になってしまうので、山が立つ φ = π/2|m| の面で切る。
     'horiz' … xy 面（赤道面）。φ をそのまま画面の角度に使う。 */
Sim.prototype.drawPolar = function(x0, y0, x1, y1, plane){
  const c = this.ctx, self = this;
  const vert = (plane === 'vert');
  /* sin 型を切る方位角 */
  const ph0 = (this.basis === 'real' && this.m > 0 && this.kind === 1)
            ? Math.PI / (2 * this.m) : 0;
  const deg = Math.round(ph0 * 180 / Math.PI);
  axes(c, x0, y0, x1, y1,
       '',
       (vert ? '② 縦の断面（z を含む' + (deg ? '、φ = ' + deg + '° の' : ' xz ') + '面）'
             : '③ xy 断面（赤道面）') + ' の Y(θ,φ)');
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + 6;
  const rad = Math.min(x1 - x0, y1 - y0) / 2 * 0.80;
  const ymax = Math.sqrt(this.yMax);
  const NA = 720;

  /* 角度 a → 方向ベクトル。画面は（右 = sx, 上 = sy） */
  const val = function(a){
    const o2 = self.orb();
    let ct, ph;
    if (vert){ ct = Math.cos(a); ph = Math.sin(a) >= 0 ? ph0 : ph0 + Math.PI; }
    else     { ct = 0;           ph = a; }
    return self.basis === 'real' ? Ylm(o2.l, self.m, self.kind, ct, ph)
                                 : Math.sqrt(Yabs2(o2.l, self.m, ct));
  };
  const sx = vert ? Math.sin : Math.cos;      /* 画面の右向き成分 */
  const sy = vert ? Math.cos : Math.sin;      /* 画面の上向き成分 */

  /* 座標軸 */
  c.strokeStyle = 'rgba(31,35,40,.16)'; c.lineWidth = 1;
  c.beginPath();
  c.moveTo(cx - rad - 6, cy); c.lineTo(cx + rad + 6, cy);
  c.moveTo(cx, cy - rad - 6); c.lineTo(cx, cy + rad + 6);
  c.stroke();
  c.setLineDash([2,3]); c.strokeStyle = 'rgba(31,35,40,.14)';
  c.beginPath(); c.arc(cx, cy, rad, 0, 6.2832); c.stroke();
  c.setLineDash([]);
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT;
  c.textAlign = 'center';
  c.fillText(vert ? 'z' : 'y', cx, cy - rad - 9);
  c.textAlign = 'left';
  c.fillText(vert && deg ? 'φ=' + deg + '°' : 'x', cx + rad + 8, cy + 3);

  /* 符号ごとに塗る（連続した区間ごとに扇形を作る） */
  const pts = new Float64Array(NA + 1), sgn = new Int8Array(NA + 1);
  for (let i = 0; i <= NA; i++){
    const v = val(i * 2 * Math.PI / NA);
    pts[i] = Math.abs(v) / ymax * rad;
    sgn[i] = v >= 0 ? 1 : -1;
  }
  let i = 0;
  while (i < NA){
    let j = i;
    while (j < NA && sgn[j + 1] === sgn[i]) j++;
    c.beginPath(); c.moveTo(cx, cy);
    for (let k = i; k <= Math.min(j + 1, NA); k++){
      const a = k * 2 * Math.PI / NA;
      c.lineTo(cx + pts[k] * sx(a), cy - pts[k] * sy(a));
    }
    c.closePath();
    c.fillStyle = sgn[i] > 0 ? 'rgba(15,76,129,.22)' : 'rgba(198,40,40,.20)';
    c.fill();
    c.strokeStyle = sgn[i] > 0 ? '#0f4c81' : '#c62828';
    c.lineWidth = 1.8; c.stroke();
    i = j + 1;
  }

  /* この断面での最大値 */
  let vm = 0;
  for (let k = 0; k <= NA; k++) vm = Math.max(vm, pts[k]);
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'right';
  c.fillText(vm < rad * 0.02 ? 'この断面では 0' : '|Y|max = ' + fmt(vm / rad * ymax, 3),
             x1 - 5, y1 - 5);
};

/* ========================================================================
   6. タブ②：ぼやけた電子雲
   ======================================================================== */
Sim.prototype.step = function(dt){
  const ms = this.mSig(), N = this.nDots, d = this.dots;
  /* 確率の流れ dφ/dt = ħm/(m_e ρ²)。実軌道と m = 0 では 0 */
  if (ms !== 0){
    const k = this.flowScale * ms * dt * this.speed;
    for (let i = 0; i < N; i++){
      const rho = d[3*i];
      if (rho < 1e-8) continue;
      let dp = k / (rho * rho);
      if (dp > 0.35) dp = 0.35; else if (dp < -0.35) dp = -0.35;
      d[3*i + 2] += dp;
    }
  }
  if (this.spin) this.yaw += 0.20 * dt * this.speed;
  /* 測定でちらつく：1 秒あたり twinkle 割の点を測り直す */
  if (this.twinkle > 0){
    this.tw += this.twinkle * N * dt;
    let k2 = Math.floor(this.tw);
    this.tw -= k2;
    if (k2 > N) k2 = N;
    for (let j = 0; j < k2; j++){
      this.placeDot(this.next);
      this.next = (this.next + 1) % N;
    }
  }
};

const NBK = 6;
/* 質点 1 個は「にじんだ光の粒」として描く。四角い点を並べるより
   ずっと「ぼやけた電子」らしく見える。奥ゆき別に 6 枚つくっておく。
   点の数を増やしたぶんだけ 1 個を暗くして、全体の明るさを揃える。 */
Sim.prototype.makeSprites = function(){
  const k = Math.min(1.6, Math.sqrt(6000 / this.nDots));
  const out = [];
  for (let b = 0; b < NBK; b++){
    const t = b / (NBK - 1);                       /* 0 = 奥, 1 = 手前 */
    const R = Math.round(92 + 118 * t), G = Math.round(146 + 90 * t);
    const size = Math.round(5 + 4 * t) * 2 + 1;    /* 奇数にして中心を合わせる */
    const cvs = document.createElement('canvas');
    cvs.width = cvs.height = size;
    const g = cvs.getContext('2d'), rad = size / 2;
    /* 明るくしすぎると中心が白く飽和して殻の構造が消える。控えめに。 */
    const a = (0.055 + 0.105 * t) * k;
    const gr = g.createRadialGradient(rad, rad, 0, rad, rad, rad);
    gr.addColorStop(0,    'rgba(' + R + ',' + G + ',255,' + a.toFixed(3) + ')');
    gr.addColorStop(0.34, 'rgba(' + R + ',' + G + ',255,' + (a * 0.42).toFixed(3) + ')');
    gr.addColorStop(1,    'rgba(' + R + ',' + G + ',255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    out.push({ img: cvs, h: rad });
  }
  this.sprites = out;
  this.spritesFor = this.nDots;
};

Sim.prototype.drawCloud = function(){
  const c = this.ctx, W = this.W, H = this.H, N = this.nDots, d = this.dots;
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#0c141f'; c.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2 + 4;
  const RV = this.rView;
  const S = Math.min(W, H) * 0.445 / RV;
  const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
  const yaw = this.yaw;
  const slabH = this.slab ? RV * 0.13 : Infinity;

  if (!this.bk || this.bkN !== N){
    this.bk = []; for (let k = 0; k < NBK; k++) this.bk.push(new Float32Array(2 * N));
    this.bkN = N;
  }
  const cnt = this.cnt || (this.cnt = new Int32Array(NBK));
  cnt.fill(0);

  let shown = 0;
  for (let i = 0; i < N; i++){
    const rho = d[3*i], z = d[3*i + 1], a = d[3*i + 2] + yaw;
    const X = rho * Math.cos(a), Y = rho * Math.sin(a);
    const dep = Y * cp + z * sp;                 /* 奥ゆき（+ が奥） */
    if (dep > slabH || dep < -slabH) continue;
    const sy = Y * sp - z * cp;
    let b = Math.floor((1 - dep / RV) * 0.5 * NBK);
    if (b < 0) b = 0; else if (b >= NBK) b = NBK - 1;
    const p = cnt[b]++;
    this.bk[b][2*p]     = cx + S * X;
    this.bk[b][2*p + 1] = cy + S * sy;
    shown++;
  }
  this.shown = shown;

  /* 加算合成。重なったところが白く飽和して「濃い殻」に見える */
  if (!this.sprites || this.spritesFor !== N) this.makeSprites();
  c.globalCompositeOperation = 'lighter';
  /* 断面表示では 3 分の 1 くらいしか残らないので、2 度重ねて明るさを揃える */
  const passes = this.slab ? 2 : 1;
  for (let b = NBK - 1; b >= 0; b--){          /* 奥から手前へ */
    const sp = this.sprites[b], arr = this.bk[b], nn = cnt[b], hh = sp.h;
    for (let q = 0; q < passes; q++)
      for (let p = 0; p < nn; p++) c.drawImage(sp.img, arr[2*p] - hh, arr[2*p+1] - hh);
  }
  c.globalCompositeOperation = 'source-over';

  /* 最確半径の球（＝この半径の球面が「殻」の中心） */
  c.setLineDash([5,5]); c.strokeStyle = 'rgba(249,168,37,.85)'; c.lineWidth = 1.4;
  c.beginPath(); c.arc(cx, cy, S * this.rPeak, 0, 6.2832); c.stroke();
  c.setLineDash([]);

  /* z 軸（複素軌道ではこの軸のまわりを流れる） */
  const zt = -S * RV * 1.02 * cp, zb = S * RV * 1.02 * cp;
  c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(cx, cy + zt); c.lineTo(cx, cy + zb); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.45)'; c.font = '10px ' + CFONT; c.textAlign = 'center';
  c.fillText('z', cx, cy + zt - 4);

  /* 陽子 */
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, 11);
  g.addColorStop(0, 'rgba(255,120,110,.95)');
  g.addColorStop(1, 'rgba(229,57,53,0)');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, 11, 0, 6.2832); c.fill();
  c.fillStyle = '#ff6b60'; c.beginPath(); c.arc(cx, cy, 2.6, 0, 6.2832); c.fill();

  /* 目盛（1 a_B） */
  const bar = S * (RV > 30 ? 10 : RV > 12 ? 5 : 1);
  const bl = RV > 30 ? '10 a_B' : RV > 12 ? '5 a_B' : '1 a_B';
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(W - 18 - bar, H - 16); c.lineTo(W - 18, H - 16);
  c.moveTo(W - 18 - bar, H - 20); c.lineTo(W - 18 - bar, H - 12);
  c.moveTo(W - 18, H - 20); c.lineTo(W - 18, H - 12); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.72)'; c.font = '10px ' + CFONT; c.textAlign = 'right';
  c.fillText(bl + ' = ' + fmt((RV > 30 ? 10 : RV > 12 ? 5 : 1) * A0_PM, 3) + ' pm', W - 18, H - 22);

  /* いま何を見ているか */
  c.textAlign = 'left'; c.font = 'bold 12px ' + CFONT;
  c.fillStyle = 'rgba(255,255,255,.86)';
  c.fillText(this.label(), 14, 20);
  c.font = '10px ' + CFONT; c.fillStyle = 'rgba(255,255,255,.52)';
  c.fillText(this.mSig() !== 0
      ? '確率が z 軸のまわりを流れています（内側ほど速い差動回転）'
      : '定常状態：確率の流れはゼロ。動いて見えるのは「測り直し」のぶんだけ', 14, 35);
  if (this.slab){
    c.fillStyle = 'rgba(249,168,37,.75)';
    c.fillText('断面表示：手前と奥を切り落としています（' + shown + ' / ' + N + ' 個）', 14, 50);
  }
};

/* ========================================================================
   7. 読み取り値
   ======================================================================== */
Sim.prototype.updateReadout = function(){
  const o = this.orb(), F = this.phys(), ms = this.mSig();
  const R = [
    ['軌道', this.label()],
    ['量子数 (n, l, m)', '(' + o.n + ', ' + o.l + ', ' + (this.basis === 'real' ? (this.m ? '±' + this.m : '0') : (ms > 0 ? '+' : '−') + this.m) + ')'],
    ['エネルギー E_n', fmt(F.E, 5) + ' eV'],
    ['最確半径', fmt(this.rPeak, 4) + ' a_B ＝ ' + fmt(this.rPeak * A0_PM, 4) + ' pm'],
    ['平均半径 ⟨r⟩', fmt(this.rMean, 4) + ' a_B（厳密 ' + F.rMeanExact + '）'],
    ['動径の節 / 角度の節', (o.n - o.l - 1) + ' / ' + o.l + '（合計 ' + (o.n - 1) + '）'],
    ['縮退度（スピン込み）', o.n * o.n + '（' + 2 * o.n * o.n + '）']
  ];
  if (this.key === 'cloud'){
    R.push(['確率の流れ', ms !== 0 ? 'あり ⟨L_z⟩ = ' + (ms > 0 ? '+' : '−') + this.m + ' ℏ' : 'なし（定常）']);
    R.push(['最確半径での公転周期', isFinite(F.period) ? fmt(F.period * 1e15, 4) + ' fs' : '—（回らない）']);
    R.push(['まいた質点', this.nDots + ' 個' + (this.slab ? '（表示 ' + (this.shown || 0) + '）' : '')]);
  } else {
    R.push(['|Y| の最大値', fmt(Math.sqrt(this.yMax), 4)]);
    R.push(['表示範囲', '0 – ' + fmt(this.rView, 3) + ' a_B（確率の 97 %）']);
  }
  this.readout.innerHTML = R.map(function(r){
    return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
  if (this.nlab) this.nlab.textContent = '質点の数 ' + this.nDots;
};

/* ========================================================================
   8. アニメーション
   ======================================================================== */
let rafId = null, last = 0;
const sims = {};
function loop(now){
  /* dt には下限 0 が要る。rAF に渡ってくる時刻が last より前に戻ることがあり
     （kick() の performance.now() とフレーム開始時刻のずれ、スリープからの復帰など）、
     dt が負になると粒子が逆走して端で clamp され、縦一列に積み上がってしまう */
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  let busy = false;
  Object.keys(sims).forEach(function(k){
    const s = sims[k];
    if (s.key !== 'cloud' || !s.playing || s.root.hidden) return;
    s.step(dt);
    s.draw();
    busy = true;
  });
  rafId = busy ? requestAnimationFrame(loop) : null;
}
function kick(){
  if (rafId === null){ last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ========================================================================
   9. 立ち上げ
   ======================================================================== */
let only = null;
const mm = /[?&]only=(shape|cloud)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');   /* 1 枚だけ ⇒ タブを隠す */

['shape', 'cloud'].forEach(function(key){
  const p = app.querySelector('[data-panel="' + key + '"]');
  if (!p) return;
  if (only && only !== key){ p.parentNode.removeChild(p); return; }
  sims[key] = new Sim(key, p);
});

/* iframe に埋め込まれたとき、親ページへ必要な高さを知らせる。
   selectTab から呼ぶので、タブより前に置いておく（let の巻き上げ対策）。 */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let active = only || 'shape';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].resize(); sims[name].draw(); sims[name].updateReadout();
  kick();
  postHeight();   /* タブごとに必要な高さが違う */
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].resize(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].recompute(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

kick();

})();
</script>
