<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トンネル効果 ― 透過率・反射率と波束の時間発展</title>
<style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります。
   スタイルはすべて #qsim 配下にスコープしてあるので、
   既存ページに <div id="qsim">…</div> ごと貼り付けても衝突しません。
   （直貼りするときは、下の html,body ブロックだけ削除してください）
   ========================================================================== */
html, body { margin:0; background:#fafafa; }

#qsim{
  --bg:#fafafa;
  --panel:#ffffff;
  --panel-soft:#f4f6f9;
  --fg:#1f2328;
  --sub:#5c6670;
  --line:rgba(31,35,40,.12);
  --accent:#0f4c81;
  --accent-strong:#0a355a;
  --accent-soft:#e7eff7;
  --wave:#1565c0;        /* |ψ|² */
  --re:#0f4c81;          /* Re ψ */
  --barrier:#8a94a6;     /* ポテンシャル障壁 */
  --theory:#c62828;      /* 透過率 T */
  --refl:#00796b;        /* 反射率 R */
  --dot:#f9a825;
  --warn:#8a5a00;
  --warnbg:#fdf5e3;
  --shadow:0 14px 32px rgba(20,34,51,.08);
  --radius-lg:20px;
  --radius-md:14px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color:var(--fg); font-family:var(--font); line-height:1.7;
  max-width:1120px; margin:0 auto; padding:16px 18px 22px;
  -webkit-text-size-adjust:100%;
}
#qsim *{box-sizing:border-box}
#qsim h1{font-size:1.34rem; line-height:1.3; margin:0 0 4px; color:#15202b; letter-spacing:.01em}
#qsim p{margin:.3em 0}
#qsim .lead{color:var(--sub); font-size:.86rem; margin:0}

/* --- タブ --- */
#qsim .tabs{display:flex; gap:8px; margin:14px 0 14px; flex-wrap:wrap}
#qsim .tab{
  font:inherit; font-size:.92rem; font-weight:700; cursor:pointer;
  padding:8px 18px; border-radius:999px; border:1px solid var(--line);
  background:rgba(255,255,255,.7); color:#15202b;
  transition:background-color .2s ease, color .2s ease, transform .2s ease;
}
#qsim .tab:hover{background:rgba(15,76,129,.10); color:var(--accent-strong); transform:translateY(-1px)}
#qsim .tab.is-active{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .panel[hidden]{display:none}
/* ?only=… で埋め込むとき：見出しとタブを隠す */
#qsim.is-embed{padding-top:6px}
#qsim.is-embed > h1,
#qsim.is-embed > .lead,
#qsim.is-embed > .tabs{display:none}

/* --- 2 カラム：左 = 図 / 右 = パラメーター --- */
#qsim .layout{
  display:grid; grid-template-columns:minmax(0,3fr) minmax(238px,1fr);
  gap:16px; align-items:start;
}
@media (max-width:860px){ #qsim .layout{grid-template-columns:1fr} }

/* --- 右カラム：コントロール --- */
#qsim .controls{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--shadow); padding:13px 14px;
}
#qsim .ctlhead{
  font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--sub); margin:0 0 8px;
}
#qsim .sep{height:1px; background:var(--line); margin:13px 0 11px; border:0}
#qsim .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px 12px}
#qsim .fld{display:flex; flex-direction:column; gap:3px; font-size:.78rem; color:var(--sub)}
#qsim .fld b{font-weight:700; color:var(--fg); font-size:.82rem}
#qsim .fld .hint{font-size:.71rem; color:var(--sub); line-height:1.45}
#qsim .inp{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff}
#qsim .inp input{
  font:inherit; font-size:.88rem; width:100%; min-width:0; border:0; outline:0;
  padding:6px 8px; background:transparent; color:var(--fg);
}
#qsim .inp select{
  font:inherit; font-size:.8rem; border:0; border-left:1px solid var(--line);
  background:transparent; color:var(--fg); padding:0 3px; outline:0; cursor:pointer;
}
#qsim .inp:focus-within{border-color:var(--accent); box-shadow:0 0 0 2px rgba(15,76,129,.14)}
#qsim select.wide{
  font:inherit; font-size:.84rem; width:100%; padding:6px 8px; border-radius:9px;
  border:1px solid var(--line); background:#fff; color:var(--fg); cursor:pointer;
}

/* --- ボタン --- */
#qsim .btnrow{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
#qsim button.act{
  font:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.8); color:#15202b;
  padding:7px 10px; border-radius:9px; white-space:nowrap;
  transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
#qsim button.act:hover{border-color:rgba(15,76,129,.5); box-shadow:0 8px 18px rgba(20,34,51,.10); transform:translateY(-1px)}
#qsim button.act.primary{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim button.act.on{background:#b3261e; border-color:#b3261e; color:#fff}
#qsim .b-full{flex:1 1 100%}
#qsim .b-half{flex:1 1 calc(50% - 4px)}
#qsim .ctlrow{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  font-size:.76rem; color:var(--sub); margin-top:9px;
}
#qsim .ctlrow input[type=range]{flex:1 1 84px; min-width:70px; accent-color:var(--accent)}
#qsim .ctlrow .inp{flex:1 1 120px}
#qsim .chk{display:flex; align-items:flex-start; gap:6px; font-size:.75rem;
  color:var(--sub); cursor:pointer; margin-top:10px; line-height:1.45}
#qsim .chk input{accent-color:var(--accent); cursor:pointer; margin-top:3px}

/* --- 左カラム：キャンバス --- */
#qsim .stage{
  border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;
  background:var(--panel); box-shadow:var(--shadow);
}
#qsim canvas{display:block; width:100%; height:auto}
#qsim .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.75rem;
  color:var(--sub); margin:8px 2px 0}
#qsim .legend i{display:inline-block; width:15px; height:3px; border-radius:2px;
  vertical-align:middle; margin-right:5px}

/* --- 読み取り値 --- */
#qsim .readout{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
  gap:0 18px; margin-top:10px; font-size:.76rem;
}
#qsim .readout div{display:flex; justify-content:space-between; gap:10px;
  border-bottom:1px dotted var(--line); padding:3px 0}
#qsim .readout span:first-child{color:var(--sub)}
#qsim .readout span:last-child{font-variant-numeric:tabular-nums; font-weight:700}
#qsim sup{font-size:.72em}

/* --- 数式 --- */
#qsim .eq{
  text-align:center; padding:11px 8px; margin:10px 0 0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  overflow-x:auto;
}
/* 数式はブラウザ標準の MathML。数式フォントを明示しないと根号や括弧が
   中身の高さに伸びない（macOS は STIX Two Math、Windows は Cambria Math が標準） */
#qsim math{
  font-size:1.05em;
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  line-height:normal;
}
#qsim .eq math[display="block"]{font-size:1.12rem; margin:0 auto}
#qsim .eq .cmt{color:var(--sub); font-size:.82rem; display:block; margin-top:4px}
/* 本文中の変数。text-transform:math-auto で 1 文字を数式イタリック
   （Unicode の Mathematical Italic）へ写像すると、MathML の <mi> と
   まったく同じ字形になる。未対応ブラウザ用に素の italic を残す。 */
#qsim i{
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  font-size:1.05em; font-style:italic;
}
@supports (text-transform: math-auto){
  #qsim i{font-style:normal; text-transform:math-auto}
}

/* --- 解説（折りたたみ） --- */
#qsim .explain{
  margin-top:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-md); padding:0 14px;
}
#qsim .explain > summary{
  cursor:pointer; list-style:none; padding:10px 0; font-size:.82rem; font-weight:700;
  color:var(--accent-strong);
}
#qsim .explain > summary::-webkit-details-marker{display:none}
#qsim .explain > summary::before{content:"▶ "; font-size:.72em; color:var(--sub)}
#qsim .explain[open] > summary::before{content:"▼ "}
#qsim .explain[open] > summary{border-bottom:1px solid var(--line)}
#qsim .explain .body{padding:4px 0 12px}
#qsim .note{
  font-size:.78rem; color:var(--sub); background:var(--panel-soft);
  border-left:3px solid var(--line); border-radius:0 8px 8px 0;
  padding:8px 12px; margin:9px 0;
}
#qsim .note.warn{color:var(--warn); background:var(--warnbg); border-left-color:currentColor}
#qsim .note b{color:inherit}
#qsim .foot{margin-top:12px; font-size:.73rem; color:var(--sub); text-align:center}
</style>
</head>
<body>
<div id="qsim">
  <h1>トンネル効果 ― 透過率・反射率と波束の時間発展</h1>
  <p class="lead">
    高さ <i>V</i><sub>0</sub>、厚み <i>L</i> の箱型ポテンシャルに、運動エネルギー <i>E</i> の粒子を当てます。
    古典的には <i>E</i> &lt; <i>V</i><sub>0</sub> なら必ず跳ね返されますが、量子論では通り抜ける確率が残ります。
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="stationary" role="tab">① 透過率・反射率（定常状態）</button>
    <button class="tab" data-tab="packet" role="tab">② 波束の時間発展</button>
  </div>

  <section class="panel" data-panel="stationary"></section>
  <section class="panel" data-panel="packet" hidden></section>

  <p class="foot">
    横軸 = 位置 x、障壁は 0 ≦ x ≦ L に置いてあります。
  </p>
</div>

<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数と単位系
   ---------------------------------------------------------------------
   内部では 長さ nm・エネルギー eV・時間 fs で計算する（数値が O(1) に収まる）。
     ħ  = 0.6582 eV·fs
     α ≡ ħ²/2m [eV·nm²]  →  E = α k²,  k = √(E/α)  (k は nm⁻¹)
   ======================================================================== */
const HBAR   = 0.6582119569;              // ħ [eV·fs]
const ALPHA_C = 3.4706588949e-32;         // α = ALPHA_C / m(kg)  [eV·nm²]
const M_E    = 9.1093837015e-31;          // 電子質量 [kg]
const M_P    = 1.67262192369e-27;         // 陽子質量 [kg]
const M_N    = 1.67492749804e-27;         // 中性子質量 [kg]
const U_AMU  = 1.66053906660e-27;         // 原子質量単位 [kg]
const NGRID  = 2048;                      // 波束計算の格子点数（2 のべき乗）
const CFONT  = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

/* ========================================================================
   1. 表示ユーティリティ
   ======================================================================== */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³',
             '4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function supStr(n){ return String(n).split('').map(function(c){ return SUP[c] || c; }).join(''); }

function fmtNum(v, n){
  n = n || 4;
  if (!isFinite(v)) return '&mdash;';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10<sup>' + Number(p[1]) + '</sup>';
  }
  return String(Number(v.toPrecision(n)));
}
function fmtNumPlain(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10' + supStr(Number(p[1]));
  }
  return String(Number(v.toPrecision(n)));
}
/** 桁が極端に小さい透過率を 10^x 表記で示す */
function fmtProb(T, log10T){
  if (T > 1e-300 && T > 0) return fmtNum(T, 4);
  if (isFinite(log10T)){
    const e = Math.floor(log10T), man = Math.pow(10, log10T - e);
    return String(Number(man.toPrecision(3))) + '×10<sup>' + e + '</sup>';
  }
  return '0';
}

const LEN_TBL = [[1,'m'],[1e-3,'mm'],[1e-6,'µm'],[1e-9,'nm'],[1e-12,'pm']];
function lenUnit(v){
  const a = Math.abs(v);
  for (let i = 0; i < LEN_TBL.length; i++){ if (a >= LEN_TBL[i][0]) return LEN_TBL[i]; }
  return null;
}
/** m 単位の長さを人間向けに */
function fmtLen(v, n){
  if (!isFinite(v)) return '&mdash;';
  if (v === 0) return '0 m';
  const u = lenUnit(v);
  return u ? String(Number((v / u[0]).toPrecision(n || 4))) + ' ' + u[1]
           : fmtNum(v, n) + ' m';
}
/** nm 単位の長さ（キャンバス用のプレーン文字列） */
function fmtNmPlain(vnm, n){
  const v = vnm * 1e-9;
  const u = lenUnit(v);
  return u ? String(Number((v / u[0]).toPrecision(n || 3))) + ' ' + u[1]
           : fmtNumPlain(v, n) + ' m';
}
function niceStep(raw){
  const e = Math.floor(Math.log10(raw));
  const m = raw / Math.pow(10, e);
  const nm = m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10;
  return nm * Math.pow(10, e);
}
function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/* ========================================================================
   2. 物理（定常状態）
   ---------------------------------------------------------------------
   V(x) = 0 (x<0, x>L),  V0 (0≦x≦L)
     領域 I  : ψ = A e^{ikx} + B e^{-ikx}     k = √(2mE)/ħ
     領域 II : ψ = D e^{bx} + F e^{-bx}       b = √(2m(V0−E))/ħ
     領域 III: ψ = C e^{ikx}
   接続条件から（ノート (6) と同じ）
     D = i(k−ib)e^{i(k+ib)L}C/(2b),  F = −i(k+ib)e^{i(k−ib)L}C/(2b)
     A = [(k−ib)D + (k+ib)F]/(2k),   B = [(k+ib)D + (k−ib)F]/(2k)
   E > V0 のときは b = ik'（ノート (7)）。以下では b を複素数として一括で扱う。
   ======================================================================== */
function cadd(a, b){ return [a[0] + b[0], a[1] + b[1]]; }
function csub(a, b){ return [a[0] - b[0], a[1] - b[1]]; }
function cmul(a, b){ return [a[0]*b[0] - a[1]*b[1], a[0]*b[1] + a[1]*b[0]]; }
function cdiv(a, b){
  const d = b[0]*b[0] + b[1]*b[1];
  return [(a[0]*b[0] + a[1]*b[1]) / d, (a[1]*b[0] - a[0]*b[1]) / d];
}
function cexp(z){
  const r = Math.exp(Math.min(700, z[0]));
  return [r * Math.cos(z[1]), r * Math.sin(z[1])];
}
function cabs2(a){ return a[0]*a[0] + a[1]*a[1]; }

/** 透過率・反射率（閉じた式。桁落ち・オーバーフローを避けて log10T も返す） */
function stationaryTR(E, V0, L, alpha){
  const o = { T:0, R:1, log10T:-Infinity, bL:0, kappaL:0, over:false };
  if (!(E > 0) || !(L >= 0) || !(alpha > 0)) return o;
  if (L === 0) { o.T = 1; o.R = 0; o.log10T = 0; return o; }
  const d = V0 - E;
  if (Math.abs(d) < 1e-9 * Math.max(Math.abs(V0), 1)){       // E ≒ V0
    o.T = 1 / (1 + V0 * L * L / (4 * alpha));
    o.R = 1 - o.T; o.log10T = Math.log10(o.T);
    return o;
  }
  if (d > 0){                                                 // E < V0（トンネル）
    const b = Math.sqrt(d / alpha), bL = b * L;
    o.b = b; o.bL = bL;
    if (bL > 20){       // sinh(bL) ≒ e^{bL}/2 → T ≒ 16E(V0−E)/V0² · e^{−2bL}
      o.log10T = Math.log10(16 * E * d / (V0 * V0)) - 2 * bL / Math.LN10;
      o.T = Math.pow(10, o.log10T);                           // 桁が小さいと 0 になる
      o.R = 1 - o.T; o.over = true;
      return o;
    }
    const s = Math.sinh(bL);
    o.T = 1 / (1 + V0 * V0 * s * s / (4 * E * d));
    o.R = 1 - o.T; o.log10T = Math.log10(o.T);
    return o;
  }
  const kp = Math.sqrt(-d / alpha), kpL = kp * L;              // E > V0（障壁上の反射）
  o.kappa = kp; o.kappaL = kpL;
  const s = Math.sin(kpL);
  o.T = 1 / (1 + V0 * V0 * s * s / (4 * E * (-d)));
  o.R = 1 - o.T; o.log10T = Math.log10(o.T);
  return o;
}

/** 定常状態の波動関数（入射波の振幅を 1 に規格化）。ψ(x) を返す */
function makeStationaryPsi(E, V0, L, alpha){
  const k = Math.sqrt(E / alpha);
  const d = V0 - E;
  let bc;                                   // 複素数の b
  if (Math.abs(d) < 1e-9 * Math.max(Math.abs(V0), 1)) bc = [1e-6, 0];   // E≒V0 の特異点回避
  else if (d > 0) bc = [Math.sqrt(d / alpha), 0];
  else bc = [0, Math.sqrt(-d / alpha)];

  /* C = e^{−Re(b)L} と選ぶと、途中の値が桁あふれしない */
  const C = [Math.exp(-Math.min(700, bc[0] * L)), 0];
  const ik = [0, k];
  const eikL = cexp([0, k * L]);
  const D = cdiv(cmul(cmul(cadd(bc, ik), cmul(eikL, cexp([-bc[0]*L, -bc[1]*L]))), C),
                 [2*bc[0], 2*bc[1]]);
  const F = cdiv(cmul(cmul(csub(bc, ik), cmul(eikL, cexp([ bc[0]*L,  bc[1]*L]))), C),
                 [2*bc[0], 2*bc[1]]);
  const ibc = [-bc[1], bc[0]];                                 // i·b
  const A = cdiv(cadd(cmul(D, csub([k,0], ibc)), cmul(F, cadd([k,0], ibc))), [2*k, 0]);
  const B = cdiv(cadd(cmul(D, cadd([k,0], ibc)), cmul(F, csub([k,0], ibc))), [2*k, 0]);

  const iA = cdiv([1,0], A);                                   // A で割って規格化
  const Bn = cmul(B, iA), Cn = cmul(C, iA);
  const Dn = cmul(D, iA), Fn = cmul(F, iA);

  return {
    k:k, bc:bc,
    T: cabs2(Cn), R: cabs2(Bn),
    psi: function(x){
      if (x < 0)  return cadd(cexp([0, k*x]), cmul(Bn, cexp([0, -k*x])));
      if (x > L)  return cmul(Cn, cexp([0, k*x]));
      return cadd(cmul(Dn, cexp([bc[0]*x, bc[1]*x])),
                  cmul(Fn, cexp([-bc[0]*x, -bc[1]*x])));
    }
  };
}

/* ========================================================================
   3. 波束の時間発展（分割演算子法 / split-step Fourier）
   ---------------------------------------------------------------------
     iħ ∂ψ/∂t = [ −α ∂²/∂x² + V(x) ] ψ      （α = ħ²/2m）
     1 ステップ: e^{−iVdt/2ħ} → FFT → e^{−iαk²dt/ħ} → IFFT → e^{−iVdt/2ħ}
   端は吸収層を置き、逃げた確率は左右それぞれに積算しておく。
   ======================================================================== */
function fft(re, im, inverse){
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++){
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1){
    const ang = 2 * Math.PI / len * (inverse ? 1 : -1);
    const wr = Math.cos(ang), wi = Math.sin(ang);
    const half = len >> 1;
    for (let i = 0; i < n; i += len){
      let cr = 1, ci = 0;
      for (let m = 0; m < half; m++){
        const p = i + m, q = p + half;
        const vr = re[q]*cr - im[q]*ci;
        const vi = re[q]*ci + im[q]*cr;
        re[q] = re[p] - vr; im[q] = im[p] - vi;
        re[p] += vr;        im[p] += vi;
        const nr = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = nr;
      }
    }
  }
  if (inverse){ for (let i = 0; i < n; i++){ re[i] /= n; im[i] /= n; } }
}

function Packet(P){
  const N = NGRID;
  this.N = N;
  this.alpha = P.alpha;
  this.L = P.L; this.V0 = P.V0; this.E = P.E;

  const k0 = Math.sqrt(P.E / P.alpha);
  const sigma = P.sigmaFactor / k0;                 // 波束の幅 [nm]
  this.k0 = k0; this.sigma = sigma;
  this.lambda = 2 * Math.PI / k0;

  const Lx = 24 * sigma + 3 * P.L;                  // 計算領域の長さ [nm]
  const dx = Lx / N;
  this.Lx = Lx; this.dx = dx;
  this.x0 = -(0.62 * Lx);                           // 領域の左端
  this.xL = this.x0;  this.xR = this.x0 + Lx;

  /* 格子が足りるか（波長と、障壁内の減衰長を解像できるか） */
  this.ok = (dx < this.lambda / 8);
  if (P.E < P.V0){
    const b = Math.sqrt((P.V0 - P.E) / P.alpha);
    this.ok = this.ok && (dx < 0.5 / b);
  }
  if (!this.ok) return;

  this.re = new Float64Array(N);
  this.im = new Float64Array(N);
  this.V  = new Float64Array(N);
  this.x  = new Float64Array(N);
  this.mask = new Float64Array(N);
  this.kk = new Float64Array(N);

  const absW = 0.08 * Lx;                            // 吸収層の厚み
  for (let i = 0; i < N; i++){
    const x = this.xL + i * dx;
    this.x[i] = x;
    /* 障壁は「格子セルのどれだけが障壁に重なっているか」で与える。
       単純に x が範囲内かで決めると、障壁の実効幅が格子間隔だけずれてしまい、
       T ∝ e^{−2bL} が指数関数的に効くので薄い障壁で誤差が大きくなる。 */
    const ov = Math.min(x + dx/2, P.L) - Math.max(x - dx/2, 0);
    this.V[i] = P.V0 * Math.max(0, Math.min(ov, dx)) / dx;
    const dl = x - this.xL, dr = this.xR - x;
    const q = Math.min(dl, dr);
    this.mask[i] = q >= absW ? 1 : Math.pow(Math.sin(0.5 * Math.PI * q / absW), 2);
    const j = (i < N/2) ? i : i - N;
    this.kk[i] = 2 * Math.PI * j / Lx;
  }
  /* 波束の初期条件 ψ = exp(−(x−xc)²/4σ²) e^{ik0x}
     出発点は吸収層より内側に置く（かかっていると最初から確率が削られてしまう） */
  const xc = this.xL + absW + 5 * sigma;
  this.xc0 = xc;
  let norm = 0;
  for (let i = 0; i < N; i++){
    const g = Math.exp(-Math.pow(this.x[i] - xc, 2) / (4 * sigma * sigma));
    const ph = k0 * this.x[i];
    this.re[i] = g * Math.cos(ph);
    this.im[i] = g * Math.sin(ph);
    norm += g * g;
  }
  norm = 1 / Math.sqrt(norm * dx);
  let pk = 0;
  for (let i = 0; i < N; i++){
    this.re[i] *= norm; this.im[i] *= norm;
    const p = this.re[i]*this.re[i] + this.im[i]*this.im[i];
    if (p > pk) pk = p;
  }
  this.peak0 = pk;

  this.t = 0;
  this.absL = 0; this.absR = 0;
  /* 時間刻み。分割演算子法の誤差は V0·dt/ħ で決まる（質量には依らない）。
     dt = 0.01 fs だと薄い障壁で偽の透過が 10⁻³ 程度出るので 1/4 にしてある。 */
  this.dt = 0.0025;                                            // [fs]

  /* 位相因子を先に作っておく */
  const dt = this.dt;
  this.vc = new Float64Array(N); this.vs = new Float64Array(N);
  this.tc = new Float64Array(N); this.ts = new Float64Array(N);
  for (let i = 0; i < N; i++){
    const a = -this.V[i] * dt / (2 * HBAR);
    this.vc[i] = Math.cos(a); this.vs[i] = Math.sin(a);
    const c = -P.alpha * this.kk[i] * this.kk[i] * dt / HBAR;
    this.tc[i] = Math.cos(c); this.ts[i] = Math.sin(c);
  }
}

Packet.prototype.step = function(){
  const N = this.N, re = this.re, im = this.im;
  let i, ar, ai;
  for (i = 0; i < N; i++){                            // 半ステップの位置空間
    ar = re[i]*this.vc[i] - im[i]*this.vs[i];
    ai = re[i]*this.vs[i] + im[i]*this.vc[i];
    re[i] = ar; im[i] = ai;
  }
  fft(re, im, false);
  for (i = 0; i < N; i++){                            // 1 ステップの運動量空間
    ar = re[i]*this.tc[i] - im[i]*this.ts[i];
    ai = re[i]*this.ts[i] + im[i]*this.tc[i];
    re[i] = ar; im[i] = ai;
  }
  fft(re, im, true);
  for (i = 0; i < N; i++){                            // 半ステップの位置空間
    ar = re[i]*this.vc[i] - im[i]*this.vs[i];
    ai = re[i]*this.vs[i] + im[i]*this.vc[i];
    re[i] = ar; im[i] = ai;
  }
  /* 吸収層。減った分は左右どちらの側で失われたかを記録する */
  const dx = this.dx;
  for (i = 0; i < N; i++){
    const m = this.mask[i];
    if (m === 1) continue;
    const before = (re[i]*re[i] + im[i]*im[i]) * dx;
    re[i] *= m; im[i] *= m;
    const lost = before - (re[i]*re[i] + im[i]*im[i]) * dx;
    if (this.x[i] < 0) this.absL += lost; else this.absR += lost;
  }
  this.t += this.dt;
};

/** 反射側・障壁内・透過側の確率 */
Packet.prototype.split = function(){
  let l = 0, m = 0, r = 0;
  const dx = this.dx;
  for (let i = 0; i < this.N; i++){
    const p = (this.re[i]*this.re[i] + this.im[i]*this.im[i]) * dx;
    if (this.x[i] < 0) l += p;
    else if (this.x[i] <= this.L) m += p;
    else r += p;
  }
  return { R: l + this.absL, mid: m, T: r + this.absR };
};

/** 波束が持つ運動量分布で平均した透過率 ⟨T⟩ */
function packetAverageT(P, sigma){
  const k0 = Math.sqrt(P.E / P.alpha);
  const dk = 1 / (2 * sigma);
  const n = 401, lo = Math.max(1e-6, k0 - 5*dk), hi = k0 + 5*dk;
  let wsum = 0, tsum = 0, rsum = 0;
  for (let i = 0; i < n; i++){
    const k = lo + (hi - lo) * i / (n - 1);
    const w = Math.exp(-Math.pow((k - k0) / dk, 2) / 2);
    const E = P.alpha * k * k;
    const tr = stationaryTR(E, P.V0, P.L, P.alpha);
    wsum += w; tsum += w * tr.T; rsum += w * tr.R;
  }
  return { T: tsum / wsum, R: rsum / wsum };
}

const UNIT_OPTS = [['m',1],['mm',1e-3],['µm',1e-6],['nm',1e-9],['pm',1e-12]];

function makeLenField(labelHtml, hintHtml){
  const f = el('label','fld');
  f.appendChild(el('b', null, labelHtml));
  const box = el('span','inp');
  const inp = el('input'); inp.type = 'number'; inp.step = 'any'; inp.min = '0';
  const sel = el('select');
  UNIT_OPTS.forEach(function(u){
    const o = el('option', null, u[0]); o.value = String(u[1]); sel.appendChild(o);
  });
  box.appendChild(inp); box.appendChild(sel); f.appendChild(box);
  if (hintHtml) f.appendChild(el('span','hint', hintHtml));
  f.inp = inp; f.sel = sel;
  f.get = function(){ return (parseFloat(inp.value) || 0) * parseFloat(sel.value); };
  f.set = function(meters){
    const u = lenUnit(meters) || [1,'m'];
    let lbl = u[1];
    let idx = 0;
    for (let i = 0; i < UNIT_OPTS.length; i++){ if (UNIT_OPTS[i][0] === lbl) idx = i; }
    sel.selectedIndex = idx;
    inp.value = String(Number((meters / UNIT_OPTS[idx][1]).toPrecision(6)));
  };
  return f;
}
function makeNumField(labelHtml, hintHtml){
  const f = el('label','fld');
  f.appendChild(el('b', null, labelHtml));
  const box = el('span','inp');
  const inp = el('input'); inp.type = 'number'; inp.step = 'any';
  box.appendChild(inp); f.appendChild(box);
  if (hintHtml) f.appendChild(el('span','hint', hintHtml));
  f.inp = inp;
  f.get = function(){ return parseFloat(inp.value) || 0; };
  f.set = function(v){ inp.value = String(Number(v.toPrecision(6))); };
  return f;
}

    '<div class="note"><math><mrow><mi>b</mi><mi>L</mi></mrow></math> が大きいところでは <math><mrow><mi>sinh</mi><mo>&#x2061;</mo><mspace width="0.1667em"></mspace><mi>b</mi><mi>L</mi><mo>≒</mo><msup><mi>e</mi><mrow><mi>b</mi><mi>L</mi></mrow></msup><mo lspace="0em" rspace="0em">/</mo><mn>2</mn></mrow></math> として、' +
    '<math><mrow><mi>T</mi><mo>≒</mo><mn>16</mn><mi>E</mi><mo stretchy="false">(</mo><msub><mi>V</mi><mn>0</mn></msub><mo>−</mo><mi>E</mi><mo stretchy="false">)</mo><mo lspace="0em" rspace="0em">/</mo><msubsup><mi>V</mi><mn>0</mn><mn>2</mn></msubsup><mo>⋅</mo><msup><mi>e</mi><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mn>2</mn><mi>b</mi><mi>L</mi></mrow></msup></mrow></math> を使っています（そのままでは sinh が桁あふれするため）。' +
    'ノート (8) のガモフ因子 <math><mrow><mi>T</mi><mo>≒</mo><msup><mi>e</mi><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mn>2</mn><mi>b</mi><mi>L</mi></mrow></msup></mrow></math> も併記してあるので、' +
    '粗い近似がどれくらい効くかを比べられます。</div>';

  if (mode === 'packet'){
    notesHtml +=
      '<div class="note">波束の計算は <b>分割演算子法（split-step Fourier 法）</b>で、' +
      '時間依存 Schrödinger 方程式をそのまま数値的に解いています。格子点は ' + NGRID + ' 点、' +
      '端には吸収層を置いて、外へ出た確率は左右それぞれに積算しています。</div>' +
      '<div class="note warn">⚠ 波束は必ず<b>エネルギーの幅</b>を持つので、実測の透過確率は' +
      '単一エネルギーの <math><mrow><mi>T</mi><mo stretchy="false">(</mo><mi>E</mi><mo stretchy="false">)</mo></mrow></math> とは一致しません。比べる相手は、' +
      '波束の運動量分布で平均した <math><mrow><mo stretchy="false">⟨</mo><mi>T</mi><mo stretchy="false">⟩</mo></mrow></math> の方です（どちらも表示しています）。' +
      '波束の幅を広げるほど両者は近づきます。</div>' +
      '<div class="note">検算：確率の合計はどの条件でも 1 に保たれ（8 桁）、' +
      '実測の透過確率は <math><mrow><mo stretchy="false">⟨</mo><mi>T</mi><mo stretchy="false">⟩</mo></mrow></math> と 1 % 程度で一致します。' +
      'ただし <math><mrow><mo stretchy="false">⟨</mo><mi>T</mi><mo stretchy="false">⟩</mo></mrow></math> が <math><mrow><msup><mn>10</mn><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mn>6</mn></mrow></msup></mrow></math> より小さい条件では、実測値は' +
      '<b>数値計算の底</b>（格子と時間刻みで決まる誤差）に埋もれてしまい意味を持ちません。' +
      'その場合は表示に「※数値の底」と出るので、①のタブの厳密式を見てください。</div>';
  } else {
    notesHtml +=
      '<div class="note">上段の波は定常散乱状態 <math><mrow><mi>ψ</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mi>i</mi><mi>E</mi><mi>t</mi><mo lspace="0em" rspace="0em">/</mo><mi>ℏ</mi></mrow></msup></mrow></math> です。' +
      '左側で入射波と反射波が干渉して定在波のうねりができ、障壁内では指数関数的に減衰し、' +
      '右側では振幅の小さい進行波だけが残ります。時間を止めても <math><mrow><msup><mrow><mo stretchy="false">|</mo><mi>ψ</mi><mo stretchy="false">|</mo></mrow><mn>2</mn></msup></mrow></math> は変わりません' +
      '（定常状態だから）。</div>';
  }
  notes.innerHTML = notesHtml;

  /* ---------- 参照を保持 ---------- */
  this.cv = cv;
  this.ctx = cv.getContext('2d');
  this.readout = readout;
  this.fields = { m:fM, V0:fV0, L:fL, E:fE };
  this.btnRun = btnRun;
  this.chkLog = chkLogIn;
  this.sigIn = sigIn;
  this.sigOut = sigOut;

  const ctls = root.querySelectorAll('input,select');
  for (let i = 0; i < ctls.length; i++) ctls[i].setAttribute('autocomplete', 'off');

  this.applyPreset(mode === 'packet' ? 1 : 0);

  /* ---------- イベント ---------- */
  function onParam(){ presetSel.selectedIndex = 0; self.recompute(); }
  [fM, fV0, fL, fE].forEach(function(f){
    f.inp.addEventListener('input', onParam);
    if (f.sel) f.sel.addEventListener('change', onParam);
  });
  presetSel.addEventListener('change', function(){
    const i = parseInt(presetSel.value, 10);
    if (!isNaN(i)){ self.applyPreset(i); self.recompute(); presetSel.value = String(i); }
  });

  function syncRunBtn(){
    if (mode === 'stationary'){
      btnRun.textContent = self.running ? '⏸ 波の振動を止める' : '▶ 波を振動させる';
      btnRun.classList.toggle('on', self.running);
    } else {
      /* 再生／一時停止は同じ主ボタンのまま、ラベルだけ切り替える */
      btnRun.textContent = self.running ? '⏸ 一時停止' : '▶ 再生';
    }
  }
  this.syncRunBtn = syncRunBtn;
  /* 初期表示でも一度呼んでおく。呼ばないと「停止中」なのに
     クリック後の停止状態と見た目が食い違ってしまう */
  syncRunBtn();

  btnRun.addEventListener('click', function(){
    self.running = !self.running;
    syncRunBtn();
    self.dirty = true;
    if (self.kick) self.kick();
  });
  if (btnReset){
    btnReset.addEventListener('click', function(){
      /* 再生中なら再生したまま、停止中なら停止したまま最初に戻す */
      self.buildPacket();
      self.updateReadout(); self.draw();
      if (self.kick) self.kick();
    });
  }
  spdIn.addEventListener('input', function(){
    self.speed = Math.pow(10, (spdIn.value / 100) * 1.6 - 0.64);
    spdOut.textContent = '×' + self.speed.toFixed(1);
  });
  spdIn.dispatchEvent(new Event('input'));

  if (sigIn){
    sigIn.addEventListener('input', function(){ self.recompute(); });
  }
  if (chkLogIn) chkLogIn.addEventListener('change', function(){ self.draw(); });

  /* ---------- リサイズ ---------- */
  this.resize();
  if (window.ResizeObserver){
    this.ro = new ResizeObserver(function(){ self.resize(); });
    this.ro.observe(stage);
  } else {
    window.addEventListener('resize', function(){ self.resize(); });
  }
}

/* ------------------------------------------------------------------ */
Sim.prototype.applyPreset = function(i){
  const p = PRESETS[i];
  this.fields.m.inp.value  = p.m.toPrecision(6);
  this.fields.V0.inp.value = String(p.V0);
  this.fields.E.inp.value  = String(p.E);
  this.fields.L.set(p.L);
};

Sim.prototype.readParams = function(){
  const m  = this.fields.m.get();
  const V0 = this.fields.V0.get();
  const E  = this.fields.E.get();
  const Lm = this.fields.L.get();                 // [m]
  const P = {
    m:m, V0:V0, E:E, Lm:Lm,
    L: Lm * 1e9,                                  // [nm]
    alpha: m > 0 ? ALPHA_C / m : 0,
    sigmaFactor: this.sigIn ? Number(this.sigIn.value) : 20
  };
  P.ok = (m > 0 && V0 > 0 && E > 0 && Lm > 0 && isFinite(P.L));
  return P;
};

Sim.prototype.recompute = function(){
  this.P = this.readParams();
  if (!this.P.ok){ this.tr = null; this.updateReadout(); this.draw(); return; }
  const P = this.P;
  this.tr  = stationaryTR(P.E, P.V0, P.L, P.alpha);
  this.psi = makeStationaryPsi(P.E, P.V0, P.L, P.alpha);
  this.gamow = Math.exp(-2 * Math.min(700, this.tr.bL || 0));
  this.gamowLog10 = -2 * (this.tr.bL || 0) / Math.LN10;

  if (this.mode === 'packet') this.buildPacket();
  else {
    /* 定常状態の表示範囲：障壁を中央に、波長 3.5 個ぶんくらい */
    const lam = 2 * Math.PI / Math.sqrt(P.E / P.alpha);
    this.xView = Math.max(3.5 * lam, 1.2 * P.L);
  }
  this.updateReadout();
  this.draw();
  if (this.kick) this.kick();
};

Sim.prototype.buildPacket = function(){
  const P = this.P;
  this.pk = new Packet(P);
  if (this.pk.ok) this.avgT = packetAverageT(P, this.pk.sigma);
  else this.avgT = null;
  if (this.sigOut && this.pk.sigma) this.sigOut.textContent = 'σ = ' + fmtNmPlain(this.pk.sigma, 2);
};

/* ------------------------------------------------------------------ */
Sim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = Math.round(Math.max(430, Math.min(620, w * 0.66)));
  if (this.W === w && this.Hc === h) return;
  this.W = w; this.Hc = h;
  this.cv.width  = Math.round(w * this.dpr);
  this.cv.height = Math.round(h * this.dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

  this.padL = 58; this.padR = 18; this.padT = 20; this.padB = 40;
  const inner = h - this.padT - this.padB;
  this.yA0 = this.padT;                       // エネルギー図 + Re ψ
  this.yA1 = this.padT + Math.round(0.40 * inner);
  this.yB0 = this.yA1 + 24;                   // |ψ|²
  this.yB1 = this.yB0 + Math.round(0.26 * inner);
  this.yC0 = this.yB1 + 34;                   // 下段（T-E 曲線 / 確率バー）
  this.yC1 = h - this.padB;

  if (!this.P) this.recompute(); else this.draw();
};

Sim.prototype.css = function(name){
  if (!this._c) this._c = {};
  if (this._c[name] === undefined){
    this._c[name] = getComputedStyle(document.getElementById('qsim'))
                      .getPropertyValue(name).trim() || '#888';
  }
  return this._c[name];
};

/* ------------------------------------------------------------------ */
Sim.prototype.step = function(dt){
  if (!this.P || !this.P.ok) return;
  if (this.mode === 'stationary'){
    if (this.running){ this.phase -= dt * this.speed * 4.2; this.dirty = true; }
    return;
  }
  if (!this.pk || !this.pk.ok || !this.running) return;
  const nst = Math.max(1, Math.round(dt * 60 * 16 * this.speed));
  for (let i = 0; i < Math.min(nst, 96); i++) this.pk.step();
  this.dirty = true;
  this.readAcc = (this.readAcc || 0) + dt;
  if (this.readAcc > 0.15){ this.updateReadout(); this.readAcc = 0; }
};

/* ========================================================================
   7. 描画
   ======================================================================== */
Sim.prototype.draw = function(){
  const c = this.ctx, W = this.W, H = this.Hc;
  c.clearRect(0, 0, W, H);
  c.fillStyle = this.css('--panel'); c.fillRect(0, 0, W, H);
  if (!this.P || !this.P.ok){
    c.fillStyle = this.css('--sub'); c.font = '14px ' + CFONT; c.textAlign = 'center';
    c.fillText('m, V₀, L, E はすべて正の値を入力してください。', W / 2, H / 2);
    return;
  }
  if (this.mode === 'packet' && (!this.pk || !this.pk.ok)){
    this.drawFrames();
    c.fillStyle = this.css('--warn'); c.font = '13px ' + CFONT; c.textAlign = 'center';
    c.fillText('この条件では波束計算の格子が足りません（障壁が波長に対して厚すぎます）。',
               W / 2, (this.yA0 + this.yB1) / 2 - 8);
    c.fillStyle = this.css('--sub'); c.font = '12px ' + CFONT;
    c.fillText('厚みを小さくするか、①のタブで透過率だけを確認してください。',
               W / 2, (this.yA0 + this.yB1) / 2 + 14);
    return;
  }
  this.drawFrames();
  this.drawTop();
  if (this.mode === 'stationary') this.drawTRCurve();
  else this.drawBars();
};

Sim.prototype.drawFrames = function(){
  const c = this.ctx, line = this.css('--line');
  c.strokeStyle = line; c.lineWidth = 1;
  c.strokeRect(this.padL, this.yA0, this.W - this.padL - this.padR, this.yA1 - this.yA0);
  c.strokeRect(this.padL, this.yB0, this.W - this.padL - this.padR, this.yB1 - this.yB0);
};

/** 上段（エネルギー図 + Re ψ）と中段（|ψ|²） */
Sim.prototype.drawTop = function(){
  const c = this.ctx, P = this.P;
  const x0 = this.padL, x1 = this.W - this.padR, plotW = x1 - x0;
  const font = CFONT;
  const sub = this.css('--sub'), line = this.css('--line');

  /* x の表示範囲 */
  let xa, xb;
  if (this.mode === 'packet'){ xa = this.pk.xL; xb = this.pk.xR; }
  else { xa = -this.xView; xb = P.L + this.xView; }
  const toPx = function(x){ return x0 + (x - xa) / (xb - xa) * plotW; };

  /* --- 上段：エネルギー図 --- */
  const yA0 = this.yA0, yA1 = this.yA1;
  const Vmax = Math.max(P.V0, P.E) * 1.3;
  const toEy = function(v){ return yA1 - (v / Vmax) * (yA1 - yA0 - 4) - 2; };

  /* 障壁 */
  c.fillStyle = this.css('--barrier');
  c.globalAlpha = 0.25;
  const bx0 = Math.max(x0, toPx(0)), bx1 = Math.min(x1, toPx(P.L));
  c.fillRect(bx0, toEy(P.V0), Math.max(1, bx1 - bx0), yA1 - toEy(P.V0));
  c.globalAlpha = 1;
  c.strokeStyle = this.css('--barrier'); c.lineWidth = 1.6;
  c.beginPath();
  c.moveTo(x0, toEy(0)); c.lineTo(bx0, toEy(0)); c.lineTo(bx0, toEy(P.V0));
  c.lineTo(bx1, toEy(P.V0)); c.lineTo(bx1, toEy(0)); c.lineTo(x1, toEy(0));
  c.stroke();

  /* E の準位 */
  c.strokeStyle = this.css('--dot'); c.lineWidth = 1.4;
  c.setLineDash([5, 4]);
  c.beginPath(); c.moveTo(x0, toEy(P.E)); c.lineTo(x1, toEy(P.E)); c.stroke();
  c.setLineDash([]);
  c.fillStyle = this.css('--sub'); c.font = '10.5px ' + font; c.textAlign = 'left';
  c.fillText('E = ' + fmtNumPlain(P.E, 4) + ' eV', x0 + 5, toEy(P.E) - 4);
  c.fillText('V₀ = ' + fmtNumPlain(P.V0, 4) + ' eV', bx0 + 4, toEy(P.V0) - 4);

  /* Re ψ（E の準位を中心に描く） */
  const amp = (yA1 - yA0) * 0.20;
  c.strokeStyle = this.css('--re'); c.lineWidth = 1.6;
  c.beginPath();
  const yE = toEy(P.E);
  for (let i = 0; i <= plotW; i++){
    const x = xa + (xb - xa) * i / plotW;
    let re;
    if (this.mode === 'packet'){
      const j = Math.min(this.pk.N - 1, Math.max(0, Math.round((x - this.pk.xL) / this.pk.dx)));
      re = this.pk.re[j] / Math.sqrt(this.pk.peak0);
    } else {
      const z = this.psi.psi(x);
      re = (z[0] * Math.cos(this.phase) - z[1] * Math.sin(this.phase)) / 2.2;
    }
    const y = yE - re * amp;
    if (i === 0) c.moveTo(x0 + i, y); else c.lineTo(x0 + i, y);
  }
  c.stroke();

  c.fillStyle = sub; c.font = '10.5px ' + font; c.textAlign = 'right';
  c.fillText('エネルギー図と Re ψ', x1 - 4, yA0 + 12);

  /* --- 中段：|ψ|² --- */
  const yB0 = this.yB0, yB1 = this.yB1;
  let pmax;
  if (this.mode === 'packet') pmax = this.pk.peak0 * 1.15;
  else pmax = 4.4;
  const toPy = function(p){ return yB1 - Math.min(p / pmax, 1) * (yB1 - yB0 - 3) - 1.5; };

  /* 障壁の範囲を薄く塗る */
  c.fillStyle = this.css('--barrier'); c.globalAlpha = 0.14;
  c.fillRect(bx0, yB0, Math.max(1, bx1 - bx0), yB1 - yB0);
  c.globalAlpha = 1;

  c.beginPath();
  c.moveTo(x0, yB1);
  for (let i = 0; i <= plotW; i++){
    const x = xa + (xb - xa) * i / plotW;
    let p;
    if (this.mode === 'packet'){
      const j = Math.min(this.pk.N - 1, Math.max(0, Math.round((x - this.pk.xL) / this.pk.dx)));
      p = this.pk.re[j]*this.pk.re[j] + this.pk.im[j]*this.pk.im[j];
    } else {
      const z = this.psi.psi(x);
      p = z[0]*z[0] + z[1]*z[1];
    }
    c.lineTo(x0 + i, toPy(p));
  }
  c.lineTo(x1, yB1); c.closePath();
  c.fillStyle = this.css('--wave'); c.globalAlpha = 0.30; c.fill(); c.globalAlpha = 1;
  c.strokeStyle = this.css('--wave'); c.lineWidth = 1.5;
  c.beginPath();
  for (let i = 0; i <= plotW; i++){
    const x = xa + (xb - xa) * i / plotW;
    let p;
    if (this.mode === 'packet'){
      const j = Math.min(this.pk.N - 1, Math.max(0, Math.round((x - this.pk.xL) / this.pk.dx)));
      p = this.pk.re[j]*this.pk.re[j] + this.pk.im[j]*this.pk.im[j];
    } else {
      const z = this.psi.psi(x);
      p = z[0]*z[0] + z[1]*z[1];
    }
    const y = toPy(p);
    if (i === 0) c.moveTo(x0 + i, y); else c.lineTo(x0 + i, y);
  }
  c.stroke();
  c.fillStyle = sub; c.font = '10.5px ' + font; c.textAlign = 'right';
  c.fillText('存在確率密度 |ψ|²', x1 - 4, yB0 + 12);

  /* x 軸の目盛り */
  const span = xb - xa;
  const step = niceStep(span / 7);
  const u = lenUnit(step * 1e-9) || [1e-9, 'nm'];
  c.textAlign = 'center'; c.font = '10.5px ' + font;
  for (let k = Math.ceil(xa / step); k * step <= xb; k++){
    const xv = k * step, px = toPx(xv);
    c.strokeStyle = line; c.globalAlpha = (k === 0 ? 0.85 : 0.35);
    c.beginPath(); c.moveTo(px, this.yA0); c.lineTo(px, this.yA1); c.stroke();
    c.beginPath(); c.moveTo(px, yB0); c.lineTo(px, yB1); c.stroke();
    c.globalAlpha = 1; c.fillStyle = sub;
    c.fillText(String(Number((xv * 1e-9 / u[0]).toPrecision(3))), px, yB1 + 14);
  }
  c.fillStyle = sub; c.font = '11px ' + font;
  c.fillText('位置 x [' + u[1] + ']', (x0 + x1) / 2, yB1 + 28);
};

/** 下段：透過率・反射率の E 依存性（定常状態タブ） */
Sim.prototype.drawTRCurve = function(){
  const c = this.ctx, P = this.P;
  const x0 = this.padL, x1 = this.W - this.padR, plotW = x1 - x0;
  const y0 = this.yC0, y1 = this.yC1, plotH = y1 - y0;
  const font = CFONT, sub = this.css('--sub'), line = this.css('--line');
  const logMode = this.chkLog && this.chkLog.checked;

  const Emax = Math.max(P.V0 * 3, P.E * 1.2);
  const toX = function(E){ return x0 + E / Emax * plotW; };
  let toY;
  let lo = -12;
  if (logMode){
    const cur = this.tr.log10T;
    lo = Math.min(-2, Math.floor(Math.min(cur, -2) / 2) * 2);
    lo = Math.max(lo, -60);
    toY = function(t){
      const v = (t <= 0 ? lo : Math.max(lo, Math.log10(t)));
      return y1 - (v - lo) / (0 - lo) * plotH;
    };
  } else {
    toY = function(t){ return y1 - t * plotH; };
  }

  /* 枠と目盛り */
  c.strokeStyle = line; c.lineWidth = 1;
  c.strokeRect(x0, y0, plotW, plotH);
  c.fillStyle = sub; c.font = '10px ' + font; c.textAlign = 'right';
  if (logMode){
    for (let e = 0; e >= lo; e -= Math.max(2, Math.round(-lo / 5))){
      const y = y1 - (e - lo) / (0 - lo) * plotH;
      c.globalAlpha = 0.4; c.strokeStyle = line;
      c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.globalAlpha = 1;
      c.fillText('10' + supStr(e), x0 - 6, y + 3.5);
    }
  } else {
    [0, 0.5, 1].forEach(function(v){
      const y = y1 - v * plotH;
      c.globalAlpha = v === 0 ? 1 : 0.45; c.strokeStyle = line;
      c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.globalAlpha = 1;
      c.fillText(v.toFixed(1), x0 - 6, y + 3.5);
    });
  }

  /* V0 の位置 */
  c.strokeStyle = this.css('--barrier'); c.setLineDash([4, 3]); c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(toX(P.V0), y0); c.lineTo(toX(P.V0), y1); c.stroke();
  c.setLineDash([]);
  c.fillStyle = sub; c.textAlign = 'center'; c.font = '10px ' + font;
  c.fillText('E = V₀', toX(P.V0), y0 - 3);

  /* T と R の曲線 */
  const self = this;
  const curve = function(pick, color, wid){
    c.strokeStyle = color; c.lineWidth = wid; c.beginPath();
    for (let i = 0; i <= plotW; i++){
      const E = Emax * i / plotW;
      if (E <= 0) continue;
      const tr = stationaryTR(E, P.V0, P.L, P.alpha);
      const v = pick(tr);
      const y = toY(v);
      if (i === 0) c.moveTo(x0 + i, y); else c.lineTo(x0 + i, y);
    }
    c.stroke();
  };
  if (!logMode) curve(function(t){ return t.R; }, this.css('--refl'), 1.6);
  curve(function(t){ return t.T; }, this.css('--theory'), 1.8);

  /* 現在の E */
  const px = toX(P.E);
  c.strokeStyle = this.css('--dot'); c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(px, y0); c.lineTo(px, y1); c.stroke();
  c.fillStyle = this.css('--theory');
  c.beginPath(); c.arc(px, toY(this.tr.T), 3.6, 0, 6.2832); c.fill();
  if (!logMode){
    c.fillStyle = this.css('--refl');
    c.beginPath(); c.arc(px, toY(this.tr.R), 3.6, 0, 6.2832); c.fill();
  }

  /* 横軸の目盛り */
  const estep = niceStep(Emax / 7);
  c.textAlign = 'center'; c.font = '10px ' + font; c.fillStyle = sub;
  for (let e = 0; e <= Emax * 1.0001; e += estep){
    const px2 = toX(e);
    if (e > 0){
      c.strokeStyle = line; c.globalAlpha = 0.3;
      c.beginPath(); c.moveTo(px2, y0); c.lineTo(px2, y1); c.stroke();
      c.globalAlpha = 1;
    }
    c.fillStyle = sub;
    c.fillText(String(Number(e.toPrecision(3))), px2, y1 + 13);
  }

  c.fillStyle = sub; c.font = '10.5px ' + font; c.textAlign = 'left';
  c.fillText(logMode ? '透過率 T（対数目盛）' : '透過率 T と反射率 R', x0 + 5, y0 + 12);
  c.textAlign = 'center'; c.font = '11px ' + font;
  c.fillText('入射エネルギー E [eV]', (x0 + x1) / 2, y1 + 27);
};

/** 下段：反射・障壁内・透過の確率バー（波束タブ） */
Sim.prototype.drawBars = function(){
  const c = this.ctx;
  const x0 = this.padL, x1 = this.W - this.padR, plotW = x1 - x0;
  const y0 = this.yC0, y1 = this.yC1;
  const font = CFONT, sub = this.css('--sub');
  const s = this.pk.split();
  const bh = 18, by = y0 + 6;

  c.fillStyle = sub; c.font = '10.5px ' + font; c.textAlign = 'left';
  c.fillText('確率の内訳（t = ' + this.pk.t.toFixed(1) + ' fs）', x0, y0 + 2);

  let cur = x0;
  const seg = [[s.R, this.css('--refl'), '反射'],
               [s.mid, this.css('--barrier'), '障壁内'],
               [s.T, this.css('--wave'), '透過']];
  for (let i = 0; i < seg.length; i++){
    const w = Math.max(0, seg[i][0]) * plotW;
    c.fillStyle = seg[i][1]; c.globalAlpha = 0.75;
    c.fillRect(cur, by, w, bh); c.globalAlpha = 1;
    if (w > 44){
      c.fillStyle = '#fff'; c.font = '10.5px ' + font; c.textAlign = 'center';
      c.fillText(seg[i][2] + ' ' + (100 * seg[i][0]).toFixed(1) + '%', cur + w / 2, by + 12.5);
    }
    cur += w;
  }
  c.strokeStyle = this.css('--line'); c.lineWidth = 1;
  c.strokeRect(x0, by, plotW, bh);

  /* 停止したまま最初の状態なら、再生を促す案内を出す */
  if (!this.running && this.pk.t === 0){
    c.fillStyle = this.css('--accent'); c.font = 'bold 12.5px ' + font;
    c.textAlign = 'center';
    c.fillText('▶ 再生 を押すと、波束が障壁に向かって動き出します',
               (x0 + x1) / 2, by + bh + 34);
  }

  /* 理論値（波束平均）の目印 */
  if (this.avgT){
    const mx = x0 + this.avgT.R * plotW;
    c.strokeStyle = this.css('--theory'); c.lineWidth = 2;
    c.beginPath(); c.moveTo(mx, by - 4); c.lineTo(mx, by + bh + 4); c.stroke();
    c.fillStyle = this.css('--theory'); c.font = '10px ' + font; c.textAlign = 'left';
    c.fillText('← ⟨R⟩ / ⟨T⟩ →', Math.min(mx + 4, x1 - 70), by + bh + 15);
  }
};

/* ========================================================================
   8. 数値の表示
   ======================================================================== */
Sim.prototype.updateReadout = function(){
  if (!this.P || !this.P.ok || !this.tr){
    this.readout.innerHTML =
      '<div><span>入力エラー</span><span>m, V₀, L, E は正の値で</span></div>';
    return;
  }
  const P = this.P, tr = this.tr, R = [];
  const k = Math.sqrt(P.E / P.alpha);
  const lam = 2 * Math.PI / k;

  R.push(['ħ²/2<i>m</i>', fmtNum(P.alpha, 4) + ' eV nm<sup>2</sup>']);
  R.push(['波数 <i>k</i> = √(2<i>m</i><i>E</i>)/ħ', fmtNum(k, 4) + ' nm<sup>−1</sup>']);
  R.push(['de Broglie 波長 λ', fmtLen(lam * 1e-9, 4)]);

  if (P.E < P.V0){
    R.push(['減衰係数 <i>b</i>', fmtNum(tr.b, 4) + ' nm<sup>−1</sup>']);
    R.push(['<i>b</i><i>L</i>', fmtNum(tr.bL, 4)]);
  } else {
    R.push(['障壁内の波数 <i>k</i>′', fmtNum(tr.kappa, 4) + ' nm<sup>−1</sup>']);
    R.push(['<i>k</i>′<i>L</i>', fmtNum(tr.kappaL, 4) +
            '（' + fmtNum(tr.kappaL / Math.PI, 3) + ' π）']);
  }

  R.push(['<b>透過率 T（厳密式）</b>', fmtProb(tr.T, tr.log10T)]);
  R.push(['<b>反射率 R = 1 − T</b>', fmtNum(tr.R, 5)]);

  if (P.E < P.V0){
    R.push(['ガモフ因子 e<sup>−2<i>b</i><i>L</i></sup>',
            fmtProb(this.gamow, this.gamowLog10)]);
  }

  if (this.mode === 'packet' && this.pk && this.pk.ok){
    const s = this.pk.split();
    R.push(['波束の幅 σ', fmtLen(this.pk.sigma * 1e-9, 3)]);
    R.push(['波束平均 ⟨T⟩（理論）', fmtNum(this.avgT.T, 4)]);
    R.push(['<b>数値計算の透過確率</b>', fmtNum(s.T, 4) +
            (this.avgT.T < 1e-6 ? ' <span style="color:var(--warn)">※数値の底</span>' : '')]);
    R.push(['数値計算の反射確率', fmtNum(s.R, 4)]);
    R.push(['確率の合計（保存の確認）', fmtNum(s.R + s.mid + s.T, 6)]);
    R.push(['経過時間 <i>t</i>', this.pk.t.toFixed(2) + ' fs']);
  }
  R.push(['障壁の厚み <i>L</i>', fmtLen(P.Lm, 4)]);

  this.readout.innerHTML = R.map(function(r){
    return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
};

/* ========================================================================
   9. 起動
   ======================================================================== */
const app = document.getElementById('qsim');

/* メインループ（動かすものが無ければ止める）。
   selectTab() から kick() を呼ぶので、変数の宣言はそれより前に置く。 */
let last = 0, rafId = null;
function loop(now){
  /* dt には下限 0 が要る。rAF に渡ってくる時刻が last より前に戻ることがあり
     （kick() の performance.now() とフレーム開始時刻のずれ、スリープからの復帰など）、
     dt が負になると定常状態の位相が逆回転し、波束のほうは nst が 1 に丸められて
     時間が戻ったはずなのに 1 ステップ進んでしまう */
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  const s = sims[active];
  let busy = false;
  if (s){
    s.step(dt);
    busy = !!(s.running && s.P && s.P.ok);
    if (s.dirty){ s.draw(); s.dirty = false; }
  }
  rafId = busy ? requestAnimationFrame(loop) : null;
}
function kick(){
  if (rafId === null){ last = performance.now(); rafId = requestAnimationFrame(loop); }
}
Sim.prototype.kick = kick;

let only = null;
const mm = /[?&]only=(stationary|packet)/.exec(location.search);
if (mm) only = mm[1];
if (only) app.classList.add('is-embed');

const sims = {};
['stationary', 'packet'].forEach(function(key){
  const p = app.querySelector('[data-panel="' + key + '"]');
  if (!p) return;
  if (only && only !== key){ p.parentNode.removeChild(p); return; }
  sims[key] = new Sim(key, p);
});

let active = only || 'stationary';
const tabs = app.querySelectorAll('.tab');

function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++){
    tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  }
  app.querySelectorAll('.panel').forEach(function(p){
    p.hidden = (p.dataset.panel !== name);
  });
  sims[name].resize();
  kick();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);

function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){
  window.addEventListener('hashchange', fromHash);
  fromHash();
}

window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].recompute(); });
});

/* iframe に埋め込まれたとき、親ページへ必要な高さを知らせる */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

kick();

})();
</script>
