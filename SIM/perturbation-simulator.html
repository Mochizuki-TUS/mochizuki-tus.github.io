<style>
/* 配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります．

}

}

#qsim .foot{margin-top:12px; font-size:.73rem; color:var(--sub); text-align:center}
</style>
</head>
<body>
<div id="qsim">
  <h1>摂動論 ― 反発を「おそるおそる」入れて，He を解く</h1>
  <p class="lead">
    解ける問題（電子間反発なしの He）に，解けない項をつまみ <i>λ</i> でおそるおそる混ぜていく——それが摂動論です．
    ①では He の電子間反発を <i>λ</i> で入れて 1 次補正（第 4 回）を，
    ②では厳密に解ける 2 準位モデルで<b>摂動級数がいつ当たり，いつ壊れるか</b>を見ます．
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="he" role="tab">① He ― 反発を λ で入れる</button>
    <button class="tab" data-tab="two" role="tab">② 2 準位モデル ― 級数の当たり外れ</button>
  </div>

  <section class="panel" data-panel="he"></section>
  <section class="panel" data-panel="two" hidden></section>

  <p class="foot">
    エネルギーは講義の流儀に合わせて eV 表記，<i>ε</i><sub>1s</sub> = −13.606 eV です．
  </p>
</div>
<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数（講義第 4 回・第 9 回の数値）
   ------------------------------------------------------------------------
   He 型イオン（電子 2 個，核電荷 Z）：
     E⁽⁰⁾ = 2Z²ε₁ₛ（反発無視），E⁽¹⁾ = ⟨ψ⁽⁰⁾|Ĥᴾ|ψ⁽⁰⁾⟩ = −(5/4)Zε₁ₛ
     E⁽²⁾ = −0.15767 Hartree = −4.291 eV（1/Z 展開：Z によらない定数）
   ======================================================================== */
const E1S = -13.606;
const EH  = 27.211386;
const E2_HA = -0.157666;                   // 1/Z 展開の 2 次係数 [Hartree]
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

const IONS = [
  { name:'H⁻',   Z:1, exp:-14.36  },
  { name:'He',   Z:2, exp:-79.005 },
  { name:'Li⁺',  Z:3, exp:-198.09 },
  { name:'Be²⁺', Z:4, exp:-371.62 },
  { name:'B³⁺',  Z:5, exp:-599.60 }
];
const HF_HE = -77.879;
function E0(Z){ return 2 * Z * Z * E1S; }
function E1(Z){ return -1.25 * Z * E1S; }               // 正の値
function Evar(Z){ return 2 * E1S * Math.pow(Z - 5/16, 2); }

function fmt(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  return String(Number(v.toPrecision(n)));
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

/* ========================================================================
   1. 解説
   ======================================================================== */
const HE_NOTES =
  '<div class="note"><b>1 次補正は「壊さずに測る」だけです．</b>\n' +
  '<i>E</i>⁽¹⁾ = ⟨<i>ψ</i>⁽⁰⁾|<i>Ĥ</i><sup>P</sup>|<i>ψ</i>⁽⁰⁾⟩——\n' +
  '波動関数は無摂動のまま，そこに摂動項を乗せて期待値を取るだけ．\n' +
  'He では 6 重積分が 1 本の公式 ∬e<sup>−<i>a</i>(<i>r</i>₁+<i>r</i>₂)</sup>/<i>r</i><sub>12</sub>d<i>V</i>₁d<i>V</i>₂ = 20π²/<i>a</i>⁵ に落ちて，\n' +
  '<i>E</i>⁽¹⁾ = −(5/4)<i>Z</i><i>ε</i><sub>1s</sub> = +34.0 eV（Z = 2）が出ます（講義第 4 回）．\n' +
  '反発だから正．−108.8 eV が −74.8 eV まで戻ってきます．</div>\n' +
  '<div class="note"><b>「摂動が小さい」は本当か，割り算で確かめられます．</b>\n' +
  'He では |<i>E</i>⁽¹⁾/<i>E</i>⁽⁰⁾| = 34.0/108.8 = 31 %．正直，小さくありません．\n' +
  'それでも 1 次で誤差 5 %，2 次で 0.1 % に入るのは，\n' +
  'この級数（1/<i>Z</i> 展開）の実際の収束が速いおかげです．\n' +
  '<i>Z</i> を増やすと（Li⁺, Be²⁺, …）反発の相対的な重みが 1/<i>Z</i> で下がるので，\n' +
  'どんどん「摂動論向き」の問題になっていきます．イオンを切り替えて比べてください．</div>\n' +
  '<div class="note"><b>2 次補正は Z によらない定数，−4.29 eV です．</b>\n' +
  '「2 次も見る」を入れると曲線が λ² で下に曲がります．\n' +
  '1/<i>Z</i> 展開では <i>E</i> = (−2<i>Z</i>² + (5/4)<i>Z</i>)<i>ε</i><sub>1s</sub>/(−1)…の形を原子単位で書くと\n' +
  '<i>E</i> = −<i>Z</i>² + (5/8)<i>Z</i> − 0.1577 + …[Hartree] となり，<b>2 次の項に <i>Z</i> が入りません</b>．\n' +
  'He では −74.83 − 4.29 = −79.12 eV．実験 −79.005 eV まであと 0.1 eV です．\n' +
  '基底状態の 2 次補正が<b>必ず負</b>（下がる）なのは，分母 <i>E</i><sub><i>i</i></sub>⁽⁰⁾ − <i>E</i><sub>0</sub>⁽⁰⁾ &gt; 0 だからです．</div>\n' +
  '<div class="note"><b>変分（第 3 回）とここで答え合わせができます．</b>\n' +
  '1 次摂動 −74.83 eV は，変分のページの曲線の「Z′ = Z の点」と同じ値です\n' +
  '（無摂動波動関数で期待値を取る，という操作が同じだから）．\n' +
  '変分はさらに Z′ を緩めて −77.49 eV，Hartree–Fock は −77.88 eV，2 次摂動は −79.12 eV．\n' +
  '<b>「どの近似がどこまで迫るか」の物差し</b>としてこの図を使ってください．</div>\n' +
  '<div class="note warn">⚠ <b>λ は実在のつまみではありません．</b>\n' +
  '自然界の He はいつも λ = 1 です．λ は「解ける極限と本物を連続でつなぐ」ための\n' +
  '理論の補助線で，最後に λ = 1 と置きます．\n' +
  'この「つなぐ」考え方は断熱接続と呼ばれ，Green 関数の摂動展開や\n' +
  '密度汎関数理論の交換相関汎関数の構成にも顔を出します．</div>';

const TWO_NOTES =
  '<div class="note"><b>2 準位モデルは「摂動論の実験室」です．</b>\n' +
  '<i>Ĥ</i>(<i>λ</i>) = [[0, <i>λ</i><i>V</i>], [<i>λ</i><i>V</i>, Δ]] は永年方程式で厳密に解けます．\n' +
  '厳密解 <i>E</i><sub>∓</sub> = (Δ ∓ √(Δ² + 4<i>λ</i>²<i>V</i>²))/2 と，\n' +
  '摂動級数 <i>E</i> = −<i>λ</i>²<i>V</i>²/Δ + <i>λ</i>⁴<i>V</i>⁴/Δ³ − 2<i>λ</i>⁶<i>V</i>⁶/Δ⁵ + … を\n' +
  '同じ図に重ねられるので，<b>級数がどこまで信用できるか</b>が目で見えます．\n' +
  'なお非対角だけの摂動なので 1 次補正はゼロ（⟨1|<i>Ĥ</i>′|1⟩ = 0）．最初に効くのは 2 次です．</div>\n' +
  '<div class="note"><b>分母効果：準位が近いほど，強く混ざり，深く下がる．</b>\n' +
  '2 次補正 −<i>λ</i>²<i>V</i>²/Δ と混成の重み ≈ (<i>λ</i><i>V</i>/Δ)² は，どちらも<b>準位差 Δ が分母</b>です．\n' +
  'Δ スライダーを小さくしていくと，同じ結合 <i>V</i> でも急激に効き始めます．\n' +
  '「空の反結合性軌道が近くにあると構造が歪んで安定化する」——\n' +
  '2 次の Jahn–Teller 効果（擬 Jahn–Teller）そのもので，強誘電体の分極の起源も この形の式で議論されます（講義第 4 回）．</div>\n' +
  '<div class="note"><b>級数には「有効範囲」があります：λ < Δ/2V．</b>\n' +
  '厳密解 √(Δ² + 4λ²V²) は λ = ±iΔ/2V で特異になるので，\n' +
  'べき級数の収束半径は λ<sub>c</sub> = Δ/2V．図の縦の破線がそれです．\n' +
  'λ<sub>c</sub> を超えると，<b>次数を上げるほど悪くなる</b>（発散する）様子が見えます．\n' +
  '「摂動が小さい」の正確な意味は「結合 λV が準位差の半分より小さい」ことです．</div>\n' +
  '<div class="note"><b>下の図は避けた交差（avoided crossing）です．</b>\n' +
  'Δ を動かすと 2 本の準位は交わりそうで交わらず，最接近距離は 2λV．\n' +
  '固有状態は交差点付近で入れ替わり（混成 50 %），\n' +
  'Δ ≫ λV の遠方では元の 2 準位に戻ります．\n' +
  'バンドの反交差，分子の断熱ポテンシャル，量子ビットの操作——至るところに出る図形です．</div>\n' +
  '<div class="note warn">⚠ <b>縮退（Δ = 0）では，この級数は最初から使えません．</b>\n' +
  '分母がゼロになるからです．縮退がある場合は，先に縮退した部分空間の中で\n' +
  '行列を対角化してから摂動を組み直します（縮退摂動論）．\n' +
  'それはちょうど永年方程式（第 11 回）を解くことと同じ操作です．\n' +
  'また，摂動を「無限次まで」足し上げる道具が自己エネルギーと Dyson 方程式——\n' +
  'Green 関数と Feynman 図形のページへ続きます．</div>';

const app = document.getElementById('qsim');

/* ========================================================================
   2. タブ①：He の 1 次（＋2 次）摂動
   ======================================================================== */
function HeSim(root){
  this.root = root;
  this.ion = 1;
  this.lam = 1.0;
  this.second = false;
  this.drag = null;
  this.build();
  this.update();
}
HeSim.prototype.Z = function(){ return IONS[this.ion].Z; };
/* E(λ)：1 次（＋2 次）までの摂動級数 [eV] */
HeSim.prototype.Elam = function(lam){
  const Z = this.Z();
  let E = E0(Z) + lam * E1(Z);
  if (this.second) E += lam * lam * E2_HA * EH;
  return E;
};
HeSim.prototype.build = function(){
  const self = this;
  const lay = el('div','layout');
  const colMain = el('div','col-main'), colSide = el('div','col-side');
  lay.appendChild(colMain); lay.appendChild(colSide);
  this.root.appendChild(lay);

  const stage = el('div','stage');
  const cv = document.createElement('canvas');
  stage.appendChild(cv); colMain.appendChild(stage);
  this.cv = cv; this.ctx = cv.getContext('2d');

  colMain.appendChild(el('div','legend',
    '<span><i style="background:var(--accent)"></i>摂動級数 E(λ)</span>' +
    '<span><i style="background:var(--dot)"></i>いまの λ</span>' +
    '<span><i style="background:var(--ok)"></i>実験値</span>' +
    '<span>横にドラッグでも λ を動かせます</span>'));

  this.readout = el('div','readout');
  colMain.appendChild(this.readout);

  colMain.appendChild(el('div','eq',
    '<math display="block"><mrow>' +
      '<msub><mi>E</mi><mn>0</mn></msub><mo stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo>' +
      '<mo>≅</mo>' +
      '<munder><mrow><mn>2</mn><msup><mi>Z</mi><mn>2</mn></msup><msub><mi>ε</mi><mrow><mn>1</mn><mtext>s</mtext></mrow></msub></mrow><msup><mi>E</mi><mrow><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow></msup></munder>' +
      '<mo>+</mo><mi>λ</mi>' +
      '<munder><mrow><mrow><mo>⟨</mo><msup><mi>ψ</mi><mrow><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow></msup><mo>|</mo>' +
      '<msup><mover><mi>H</mi><mo>^</mo></mover><mtext>P</mtext></msup><mo>|</mo>' +
      '<msup><mi>ψ</mi><mrow><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow></msup><mo>⟩</mo></mrow></mrow>' +

  lin.autocomplete = 'off';

  lrow.appendChild(lin); ctrl.appendChild(lrow);

  const w = el('label','chk');

  const pd = function(e){

HeSim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = Math.round(Math.max(400, Math.min(560, w * 0.72)));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  this.cv.width = Math.round(w * dpr);
  this.cv.height = Math.round(h * dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};

HeSim.prototype.draw = function(){
  if (!this.W) return;
  const c = this.ctx, W = this.W, H = this.H;
  c.clearRect(0, 0, W, H);
  const io = IONS[this.ion], Z = io.Z;
  const gap = 8;
  const hTop = Math.round(H * 0.60);
  const hBot = H - hTop - gap;
  const yBot = hTop + gap;

  /* ---------- 上：E(λ) ---------- */
  const padL = 64, padR = 16, padT = 8, padB = 22;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = hTop - padB;
  const Etop = this.Elam(1);
  let Elo = E0(Z), Ehi = Math.max(Etop, io.exp, Z === 2 ? HF_HE : -1e9);
  const pad = (Ehi - Elo) * 0.10;
  Elo -= pad * 0.4; Ehi += pad;
  this.scaleX = (x1 - x0);
  const px = function(l){ return x0 + l * (x1 - x0); };
  const py = function(E){ return y1 - (E - Elo) / (Ehi - Elo) * (y1 - y0); };

  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'center';
  [0, 0.25, 0.5, 0.75, 1].forEach(function(l){
    c.strokeStyle = 'rgba(31,35,40,.06)';
    c.beginPath(); c.moveTo(px(l), y0); c.lineTo(px(l), y1); c.stroke();
    c.fillText(String(l), px(l), y1 + 13);
  });
  c.textAlign = 'right'; c.fillText('λ →', x1 - 2, y1 + 13);
  c.textAlign = 'left'; c.fillText('E [eV]', x0 + 5, y0 + 12);

  /* 実験・変分・HF の水平線 */
  /* ラベルの重なりを避けるため，位置（左/右）と上下（線の上/下）を線ごとに指定 */
  const lines = [[io.exp, '#2e7d32', '実験 ' + io.exp.toFixed(2), 'right', 12],
                 [Evar(Z), '#6a3d9a', '変分（第 3 回） ' + Evar(Z).toFixed(2), 'left', -4]];
  if (Z === 2) lines.push([HF_HE, '#8a5a00', 'Hartree–Fock ' + HF_HE.toFixed(2), 'right', -4]);
  c.setLineDash([5,4]); c.lineWidth = 1.3;
  lines.forEach(function(ln){
    c.strokeStyle = ln[1];
    c.beginPath(); c.moveTo(x0, py(ln[0])); c.lineTo(x1, py(ln[0])); c.stroke();
    c.fillStyle = ln[1]; c.font = 'bold 10px ' + CFONT;
    c.textAlign = ln[3];
    c.fillText(ln[2], ln[3] === 'left' ? x0 + 6 : x1 - 6, py(ln[0]) + ln[4]);
  });
  c.setLineDash([]);

  /* E(λ) の曲線（2 次を入れると曲がる） */
  const self = this;
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.2;
  c.beginPath();
  for (let i = 0; i <= 200; i++){
    const l = i / 200;
    const X = px(l), Y = py(self.Elam(l));
    if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
  }
  c.stroke();
  /* 1 次だけの直線（2 次表示中は比較のため薄く残す） */
  if (this.second){
    c.strokeStyle = 'rgba(15,76,129,.35)'; c.lineWidth = 1.2; c.setLineDash([3,3]);
    c.beginPath(); c.moveTo(px(0), py(E0(Z))); c.lineTo(px(1), py(E0(Z) + E1(Z))); c.stroke();
    c.setLineDash([]);
  }

  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('E⁽⁰⁾ = ' + E0(Z).toFixed(1) + ' eV（反発なし）', px(0) + 5, py(E0(Z)) - 6);
  c.fillStyle = '#f9a825';
  c.beginPath(); c.arc(px(this.lam), py(this.Elam(this.lam)), 5.5, 0, 6.2832); c.fill();

  /* ---------- 下：近似の物差し（水平準位図） ---------- */
  c.strokeStyle = 'rgba(31,35,40,.14)';
  c.strokeRect(0.5, yBot + 0.5, W - 1, hBot - 1);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('どこまで実験に迫れたか（λ = 1）', 8, yBot + 14);
  /* 反発無視（−108.8 など）は桁違いに深く軸を潰すので，左端の注記にして
     実験〜1 次摂動のあいだをズームして見せる */
  const items = [
    ['1 次摂動', E0(Z) + E1(Z), '#0f4c81'],
    ['2 次摂動', E0(Z) + E1(Z) + E2_HA * EH, '#00838f'],
    ['変分', Evar(Z), '#6a3d9a']
  ];
  if (Z === 2) items.push(['HF', HF_HE, '#8a5a00']);
  items.push(['実験', io.exp, '#2e7d32']);
  const vals = items.map(function(t){ return t[1]; });
  const span = Math.max.apply(null, vals) - Math.min.apply(null, vals);
  const ex0 = Math.min.apply(null, vals) - span * 0.10;
  const ex1 = Math.max.apply(null, vals) + span * 0.10;
  const bx0 = 150, bx1 = W - 56;
  const bpx = function(E){ return bx0 + (E - ex0) / (ex1 - ex0 + 1e-9) * (bx1 - bx0); };
  const ybase = yBot + hBot * 0.60;
  c.strokeStyle = 'rgba(31,35,40,.25)';
  c.beginPath(); c.moveTo(bx0 - 30, ybase); c.lineTo(bx1 + 20, ybase); c.stroke();
  /* 左端の注記（反発無視ははるか深い） */
  c.fillStyle = '#9aa4b0'; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('← 反発無視', 8, ybase - 6);
  c.fillText(E0(Z).toFixed(1) + ' eV', 8, ybase + 14);
  items.forEach(function(t, i){
    const X = bpx(t[1]);
    c.strokeStyle = t[2]; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(X, ybase - 13); c.lineTo(X, ybase + 13); c.stroke();
    c.fillStyle = t[2]; c.font = 'bold 10px ' + CFONT; c.textAlign = 'center';
    const up = i % 2 === 0;
    c.fillText(t[0], X, ybase + (up ? -19 : 27));
    c.font = '9px ' + CFONT;
    c.fillText(t[1].toFixed(2), X, ybase + (up ? -30 : 38));
  });
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'left'; c.fillText('← 深い（束縛しすぎ）', bx0 - 30, yBot + hBot - 6);
  c.textAlign = 'right'; c.fillText('浅い →', bx1 + 20, yBot + hBot - 6);
};

HeSim.prototype.update = function(){
  const io = IONS[this.ion], Z = io.Z;
  const self = this;
  this.ionBtns.forEach(function(b, i){ b.classList.toggle('on', i === self.ion); });
  this.llab.textContent = 'λ = ' + this.lam.toFixed(2);
  this.resize();
  this.draw();
  const Epert1 = E0(Z) + E1(Z);
  const Epert2 = Epert1 + E2_HA * EH;
  const R = [
    ['イオン', io.name + '（Z = ' + Z + '）'],
    ['E(λ)（いまの λ = ' + this.lam.toFixed(2) + '）', fmt(this.Elam(this.lam), 6) + ' eV'],
    ['E⁽⁰⁾ = 2Z²ε₁ₛ', fmt(E0(Z), 6) + ' eV'],
    ['E⁽¹⁾ = ⟨Ĥᴾ⟩ = −(5/4)Zε₁ₛ', '+' + fmt(E1(Z), 5) + ' eV'],
    ['1 次まで（λ = 1）', fmt(Epert1, 6) + ' eV'],
    ['2 次まで（λ = 1）', fmt(Epert2, 6) + ' eV'],
    ['変分（第 3 回）', fmt(Evar(Z), 6) + ' eV'],
    ['実験値', fmt(io.exp, 6) + ' eV'],
    ['摂動の相対の大きさ |E⁽¹⁾/E⁽⁰⁾|', fmt(Math.abs(E1(Z)/E0(Z))*100, 3) + ' %']
  ];
  this.readout.innerHTML = R.map(function(x){
    return '<div><span>' + x[0] + '</span><span>' + x[1] + '</span></div>';
  }).join('');
};

/* ========================================================================
   3. タブ②：2 準位モデル
   ------------------------------------------------------------------------
   Ĥ(λ) = [[0, λV], [λV, Δ]]．
   厳密解 E∓ = (Δ ∓ √(Δ² + 4λ²V²))/2．
   基底状態の摂動級数は √(1+x) の Taylor 展開から作れて
     E = −λ²V²/Δ + λ⁴V⁴/Δ³ − 2λ⁶V⁶/Δ⁵ + …（収束半径 λc = Δ/2V）
   ======================================================================== */
function TwoSim(root){
  this.root = root;
  this.D = 1.0;          // 準位差 Δ
  this.V = 0.3;          // 結合
  this.lam = 1.0;
  this.order = 4;        // 表示する最高次数
  this.drag = null;
  this.build();
  this.update();
}
/* 基底状態の 2n 次までの部分和．√(1+x) の係数を漸化式で作る */
TwoSim.prototype.series = function(lam, order){
  const x = 4 * lam * lam * this.V * this.V / (this.D * this.D);
  let sum = 0, coef = 0.5, xp = x;      // binom(1/2,1) = 1/2
  for (let k = 1; 2 * k <= order; k++){
    sum += coef * xp;
    coef *= (0.5 - k) / (k + 1);
    xp *= x;
  }
  return -this.D * sum / 2;
};
TwoSim.prototype.exact = function(lam){
  return (this.D - Math.sqrt(this.D * this.D + 4 * lam * lam * this.V * this.V)) / 2;
};
TwoSim.prototype.exactUp = function(lam){
  return (this.D + Math.sqrt(this.D * this.D + 4 * lam * lam * this.V * this.V)) / 2;
};
TwoSim.prototype.build = function(){
  const self = this;
  const lay = el('div','layout');

  this.root.appendChild(lay);

  const stage = el('div','stage');
  const cv = document.createElement('canvas');
  stage.appendChild(cv); colMain.appendChild(stage);
  this.cv = cv; this.ctx = cv.getContext('2d');

  colMain.appendChild(el('div','legend',
    '<span><i style="background:var(--accent)"></i>厳密解（永年方程式）</span>' +
    '<span><i style="background:var(--neg)"></i>2 次まで</span>' +
    '<span><i style="background:#6a3d9a"></i>4 次・6 次まで</span>' +
    '<span><i style="background:rgba(31,35,40,.4)"></i>収束半径 λc（破線）</span>'));

  this.readout = el('div','readout');
  colMain.appendChild(this.readout);

  colMain.appendChild(el('div','eq',
    '<math display="block"><mrow>' +
      '<msub><mi>E</mi><mo>−</mo></msub><mo>=</mo>' +
      '<mfrac><mrow><mi>Δ</mi><mo>−</mo><msqrt><mrow><msup><mi>Δ</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mi>λ</mi><mn>2</mn></msup><msup><mi>V</mi><mn>2</mn></msup></mrow></msqrt></mrow><mn>2</mn></mfrac>' +
      '<mo>=</mo>' +
      '<mo>−</mo><mfrac><mrow><msup><mi>λ</mi><mn>2</mn></msup><msup><mi>V</mi><mn>2</mn></msup></mrow><mi>Δ</mi></mfrac>' +
      '<mo>+</mo><mfrac><mrow><msup><mi>λ</mi><mn>4</mn></msup><msup><mi>V</mi><mn>4</mn></msup></mrow><msup><mi>Δ</mi><mn>3</mn></msup></mfrac>' +
      '<mo>−</mo><mo>⋯</mo>' +
      '<mspace width="1.2em"></mspace>' +
      '<mo stretchy="false">(</mo><mtext>収束は </mtext><mi>λ</mi><mo>&lt;</mo>' +
      '<msub><mi>λ</mi><mtext>c</mtext></msub><mo>=</mo><mfrac><mi>Δ</mi><mrow><mn>2</mn><mi>V</mi></mrow></mfrac><mo stretchy="false">)</mo>' +
    '</mrow></math>' +
    '<span class="cmt">2 次補正 −λ²V²/Δ が講義第 4 回の −Σ|⟨i|Ĥᴾ|n⟩|²/(E_i⁽⁰⁾−E_n⁽⁰⁾) の最小の実例です</span>'));

  const ctrl = el('div','controls');
  colSide.appendChild(ctrl);
  ctrl.appendChild(el('p','ctlhead','モデルのパラメーター'));
  const mkS = function(label, prop, min, max, step){
    const row = el('div','ctlrow');
    const lab = el('span', null, '');
    row.appendChild(lab);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = String(min); inp.max = String(max); inp.step = String(step);
    inp.value = String(self[prop]); inp.autocomplete = 'off';
    inp.addEventListener('input', function(){ self[prop] = Number(this.value); self.update(); });
    row.appendChild(inp); ctrl.appendChild(row);
    return lab;
  };
  this.dlab = mkS('Δ', 'D', 0.1, 3, 0.01);
  this.vlab = mkS('V', 'V', 0.05, 1.5, 0.01);
  this.llab = mkS('λ', 'lam', 0, 1.5, 0.005);
  ctrl.appendChild(el('span','hint',
    'Δ は無摂動の準位差，V は 2 準位をつなぐ行列要素 ⟨2|Ĥ′|1⟩．単位は任意（eV と思って構いません）．'));

  ctrl.appendChild(el('hr','sep'));
  ctrl.appendChild(el('p','ctlhead','級数を何次まで描くか'));
  const op = el('div','pills');
  this.oBtns = [];
  [2, 4, 6].forEach(function(o){
    const b = el('button','pill', o + ' 次まで');
    b.type = 'button';
    b.addEventListener('click', function(){ self.order = o; self.update(); });
    op.appendChild(b); self.oBtns.push(b);
  });
  ctrl.appendChild(op);
  ctrl.appendChild(el('span','hint',
    'λ < λc なら次数を上げるほど厳密解に近づき，λ > λc では上げるほど暴れます．'));

  const dt = el('details','explain');
  dt.appendChild(el('summary', null, 'この図の読み方（分母効果・収束半径・避けた交差）'));
  dt.appendChild(el('div','body', TWO_NOTES));
  this.root.appendChild(dt);

  const pd = function(e){
    const t = e.touches ? e.touches[0] : e;
    self.drag = { x: t.clientX, lam: self.lam };
    if (e.cancelable) e.preventDefault();
  };
  const pm = function(e){
    if (!self.drag) return;
    const t = e.touches ? e.touches[0] : e;
    const dl = (t.clientX - self.drag.x) / (self.scaleX || 300);
    self.lam = Math.max(0, Math.min(1.5, self.drag.lam + dl));
    self.update();
    if (e.cancelable) e.preventDefault();
  };
  const pu = function(){ self.drag = null; };
  cv.addEventListener('mousedown', pd);
  window.addEventListener('mousemove', pm);
  window.addEventListener('mouseup', pu);
  cv.addEventListener('touchstart', pd, {passive:false});
  cv.addEventListener('touchmove', pm, {passive:false});
  window.addEventListener('touchend', pu);
};

TwoSim.prototype.resize = HeSim.prototype.resize;

TwoSim.prototype.draw = function(){
  if (!this.W) return;
  const c = this.ctx, W = this.W, H = this.H, self = this;
  c.clearRect(0, 0, W, H);
  const gap = 8;
  const hTop = Math.round(H * 0.58);
  const hBot = H - hTop - gap;
  const yBot = hTop + gap;
  const LMAX = 1.5;

  /* ---------- 上：E(λ) 級数 vs 厳密 ---------- */
  const padL = 52, padR = 14, padT = 8, padB = 22;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = hTop - padB;
  const Emin = this.exact(LMAX);
  let Elo = Math.min(Emin * 1.5, -0.2), Ehi = Math.max(0.12, -Elo * 0.25);
  /* 発散する級数も見せたいので，範囲は厳密解基準で決めて外はクリップ */
  this.scaleX = (x1 - x0) / LMAX;
  const px = function(l){ return x0 + l / LMAX * (x1 - x0); };
  const py = function(E){ return y1 - (E - Elo) / (Ehi - Elo) * (y1 - y0); };

  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'center';
  [0, 0.5, 1, 1.5].forEach(function(l){
    c.strokeStyle = 'rgba(31,35,40,.06)';
    c.beginPath(); c.moveTo(px(l), y0); c.lineTo(px(l), y1); c.stroke();
    c.fillText(String(l), px(l), y1 + 13);
  });
  c.textAlign = 'right'; c.fillText('λ →', x1 - 2, y1 + 13);
  c.textAlign = 'left'; c.fillText('基底状態のエネルギー E₋(λ)', x0 + 5, y0 + 12);
  /* E = 0 の線 */
  c.strokeStyle = 'rgba(31,35,40,.18)';
  c.beginPath(); c.moveTo(x0, py(0)); c.lineTo(x1, py(0)); c.stroke();

  /* 収束半径 */
  const lc = this.D / (2 * this.V);
  if (lc < LMAX){
    c.strokeStyle = 'rgba(31,35,40,.4)'; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(px(lc), y0); c.lineTo(px(lc), y1); c.stroke();
    c.setLineDash([]);
    c.fillStyle = '#5c6670'; c.textAlign = 'center'; c.font = 'bold 10px ' + CFONT;
    c.fillText('λc = ' + lc.toFixed(2), px(lc), y0 + 12);
  }

  const strokeF = function(f, col, wdt, dash){
    c.strokeStyle = col; c.lineWidth = wdt;
    if (dash) c.setLineDash(dash);
    c.beginPath();
    let started = false;
    for (let i = 0; i <= 340; i++){
      const l = LMAX * i / 340;
      let E = f(l);
      if (E < Elo - (Ehi - Elo) || E > Ehi + (Ehi - Elo) * 0.5){ started = false; continue; }
      E = Math.max(Elo - (Ehi - Elo), Math.min(Ehi + (Ehi - Elo), E));
      const X = px(l), Y = py(E);
      if (!started){ c.moveTo(X, Y); started = true; } else c.lineTo(X, Y);
    }
    c.stroke(); c.setLineDash([]);
  };
  const cols = { 2:'#c62828', 4:'#6a3d9a', 6:'#b07800' };
  for (let o = 2; o <= this.order; o += 2){
    strokeF(function(l){ return self.series(l, o); }, cols[o], 1.5, [6,4]);
  }
  strokeF(function(l){ return self.exact(l); }, '#0f4c81', 2.4, null);

  c.fillStyle = '#f9a825';
  c.beginPath(); c.arc(px(this.lam), py(Math.max(Elo, this.exact(this.lam))), 5.5, 0, 6.2832); c.fill();

  /* ---------- 下：避けた交差 E±(Δ) ---------- */
  c.strokeStyle = 'rgba(31,35,40,.14)';
  c.strokeRect(0.5, yBot + 0.5, W - 1, hBot - 1);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('避けた交差：準位差 Δ を振ったときの 2 つの固有値（λV = ' + (this.lam * this.V).toFixed(2) + ' 固定）', 8, yBot + 14);
  const DMAX = 3;
  const gx0 = 52, gx1 = W - 14, gy0 = yBot + 20, gy1 = yBot + hBot - 16;
  const gpx = function(D){ return gx0 + (D + DMAX) / (2 * DMAX) * (gx1 - gx0); };
  const lv = this.lam * this.V;
  const emax = DMAX / 2 + Math.sqrt(DMAX * DMAX + 4 * lv * lv) / 2;
  const gpy = function(E){ return gy1 - (E + emax) / (2 * emax) * (gy1 - gy0); };
  /* 無摂動（交差する 2 直線） */
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1; c.setLineDash([3,3]);
  c.beginPath(); c.moveTo(gpx(-DMAX), gpy(0)); c.lineTo(gpx(DMAX), gpy(0)); c.stroke();
  c.beginPath(); c.moveTo(gpx(-DMAX), gpy(-DMAX)); c.lineTo(gpx(DMAX), gpy(DMAX)); c.stroke();
  c.setLineDash([]);
  /* 固有値 */
  ['#0f4c81', '#9aa4b0'].forEach(function(col, k){
    c.strokeStyle = col; c.lineWidth = 2;
    c.beginPath();
    for (let i = 0; i <= 300; i++){
      const D = -DMAX + 2 * DMAX * i / 300;
      const s = Math.sqrt(D * D + 4 * lv * lv);
      const E = k === 0 ? (D - s) / 2 : (D + s) / 2;
      const X = gpx(D), Y = gpy(E);
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    }
    c.stroke();
  });
  /* いまの Δ の位置とギャップ */
  c.strokeStyle = 'rgba(249,168,37,.9)'; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(gpx(this.D), gy0); c.lineTo(gpx(this.D), gy1); c.stroke();
  c.fillStyle = '#5c6670'; c.textAlign = 'center';
  c.fillText('いまの Δ', gpx(this.D), gy1 + 12);
  c.fillText('最接近 2λV = ' + (2 * lv).toFixed(2), gpx(0), gpy(0) - 26);
  c.textAlign = 'right'; c.fillText('Δ →', gx1 - 2, gy1 + 12);
};

TwoSim.prototype.update = function(){
  const self = this;
  this.dlab.textContent = 'Δ = ' + this.D.toFixed(2);
  this.vlab.textContent = 'V = ' + this.V.toFixed(2);
  this.llab.textContent = 'λ = ' + this.lam.toFixed(2);
  this.oBtns.forEach(function(b, i){ b.classList.toggle('on', [2,4,6][i] === self.order); });
  this.resize();
  this.draw();
  const ex = this.exact(this.lam);
  const s2 = this.series(this.lam, 2), s4 = this.series(this.lam, 4), s6 = this.series(this.lam, 6);
  const lc = this.D / (2 * this.V);
  const th = 0.5 * Math.atan2(2 * this.lam * this.V, this.D);
  const R = [
    ['厳密解 E₋(λ)', fmt(ex, 5)],
    ['2 次まで', fmt(s2, 5) + '（誤差 ' + fmt(Math.abs(s2 - ex), 3) + '）'],
    ['4 次まで', fmt(s4, 5) + '（誤差 ' + fmt(Math.abs(s4 - ex), 3) + '）'],
    ['6 次まで', fmt(s6, 5) + '（誤差 ' + fmt(Math.abs(s6 - ex), 3) + '）'],
    ['収束半径 λc = Δ/2V', fmt(lc, 4) + (this.lam < lc ? '（いまは収束域）' : '（いまは発散域！）')],
    ['状態 2 の混ざりの重み sin²θ', fmt(Math.pow(Math.sin(th), 2), 4)],
    ['1 次の混成係数 λV/Δ', fmt(this.lam * this.V / this.D, 4)]
  ];
  this.readout.innerHTML = R.map(function(x){
    return '<div><span>' + x[0] + '</span><span>' + x[1] + '</span></div>';
  }).join('');
};

/* ========================================================================
   4. 立ち上げ
   ======================================================================== */
let only = null;
const mm = /[?&]only=(he|two)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');

const sims = {};
[['he', HeSim], ['two', TwoSim]].forEach(function(kv){
  const p = app.querySelector('[data-panel="' + kv[0] + '"]');
  if (!p) return;
  if (only && only !== kv[0]){ p.parentNode.removeChild(p); return; }
  sims[kv[0]] = new kv[1](p);
});

let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let active = only || 'he';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].update();
  postHeight();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].W = 0; sims[k].update(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].update(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
