<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調和振動子 ― ばねと波動関数</title>
<style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります。
   スタイルはすべて #qsim 配下にスコープしてあるので、
   既存ページに <div id="qsim">…</div> ごと貼り付けても衝突しません。
   （直貼りするときは、下の html,body ブロックだけ削除してください）
   ========================================================================== */
html, body { margin:0; background:#fafafa; }

#qsim{
  --bg:#fafafa;
  --panel:#ffffff;
  --panel-soft:#f4f6f9;
  --fg:#1f2328;
  --sub:#5c6670;
  --line:rgba(31,35,40,.12);
  --accent:#0f4c81;
  --accent-strong:#0a355a;
  --accent-soft:#e7eff7;
  --wave:#1565c0;        /* |ψ|² */
  --re:#0f4c81;          /* Re ψ */
  --barrier:#8a94a6;     /* ポテンシャル障壁 */
  --theory:#c62828;      /* 透過率 T */
  --refl:#00796b;        /* 反射率 R */
  --dot:#f9a825;
  --warn:#8a5a00;
  --warnbg:#fdf5e3;
  --cls:#c62828;        /* 古典 */
  --qm:#0f4c81;         /* 量子 */
  --zpe:#f9a825;        /* 零点エネルギー */
  --bose:#1565c0;       /* ボース粒子 */

  --radius-lg:20px;

}

  font:inherit; font-size:.92rem; font-weight:700; cursor:pointer;

}

#qsim .tab.is-active{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .panel[hidden]{display:none}
/* 埋め込みのとき：見出しは隠す。
   タブは残す ―― 埋め込み先からでも ①②③ を押し比べられるようにするため。
   ?only=… で 1 枚だけ埋め込んだときは、押せるタブが 1 つもないので隠す。 */

#qsim.is-embed > h1,
#qsim.is-embed > .lead{display:none}
#qsim.is-embed > .tabs{margin:2px 0 12px}

/* --- 2 カラム：左 = 図 / 右 = パラメーター --- */

/* --- 右カラム：コントロール --- */

}

}

/* --- ボタン --- */

  font:inherit; font-size:.82rem; font-weight:700; cursor:pointer;

}

#qsim .b-full{flex:1 1 100%}

#qsim .ctlrow{

}

#qsim .ctlrow .inp{flex:1 1 120px}

/* --- 左カラム：キャンバス --- */

/* --- 読み取り値 --- */

}

#qsim .readout span:first-child{color:var(--sub)}
#qsim .readout span:last-child{font-variant-numeric:tabular-nums; font-weight:700}

/* --- 数式 --- */
#qsim .eq{

  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);

}
/* 数式はブラウザ標準の MathML。数式フォントを明示しないと根号や括弧が

#qsim math{

}
#qsim .eq math[display="block"]{font-size:1.12rem; margin:0 auto}
#qsim .eq .cmt{color:var(--sub); font-size:.82rem; display:block; margin-top:4px}
/* 本文中の変数。text-transform:math-auto で 1 文字を数式イタリック
   （Unicode の Mathematical Italic）へ写像すると、MathML の <mi> と

#qsim i{
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",

}

/* --- 解説（折りたたみ） --- */
#qsim .explain{

  border-radius:var(--radius-md); padding:0 14px;
}
#qsim .explain > summary{
  cursor:pointer; list-style:none; padding:10px 0; font-size:.82rem; font-weight:700;
  color:var(--accent-strong);
}
#qsim .explain > summary::-webkit-details-marker{display:none}
#qsim .explain > summary::before{content:"▶ "; font-size:.72em; color:var(--sub)}
#qsim .explain[open] > summary::before{content:"▼ "}
#qsim .explain[open] > summary{border-bottom:1px solid var(--line)}
#qsim .explain .body{padding:4px 0 12px}
#qsim .note{
  font-size:.78rem; color:var(--sub); background:var(--panel-soft);
  border-left:3px solid var(--line); border-radius:0 8px 8px 0;

}

<body>
<div id="qsim">
  <h1>調和振動子 ― ばねと波動関数を並べて見る</h1>
  <p class="lead">
    ばね定数 <i>k</i> = <i>m</i><i>ω</i><sup>2</sup> のばねに繋がれた質点。古典力学ならエネルギーは連続で、
    いちばん下は「止まっている」状態です。量子力学で解くと <i>E</i> = (<i>n</i> + 1/2)<i>ħ</i><i>ω</i> と飛び飛びになり、
    しかも<b>いちばん下でも止まれません</b>。
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="wave" role="tab">① ばねと波動関数</button>
    <button class="tab" data-tab="zero" role="tab">② 零点エネルギーと絶対零度</button>
    <button class="tab" data-tab="cloud" role="tab">③ 質点をまいて振動させる</button>
    <button class="tab" data-tab="sq" role="tab">④ 生成・消滅演算子</button>
    <button class="tab" data-tab="fbo" role="tab">⑤ ボース粒子とフェルミ粒子</button>
  </div>

  <section class="panel" data-panel="wave"></section>
  <section class="panel" data-panel="zero" hidden></section>
  <section class="panel" data-panel="cloud" hidden></section>
  <section class="panel" data-panel="sq" hidden></section>
  <section class="panel" data-panel="fbo" hidden></section>

  <p class="foot">
    横軸はどの図も同じ位置 <i>x</i>（つり合いの位置が 0）です。上のばねの錘と、下の波動関数は真上・真下で対応しています。
  </p>
</div>

<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数と系のプリセット
   ======================================================================== */
const HBAR = 1.054571817e-34;      // [J s]
const KB   = 1.380649e-23;         // [J/K]
const QE   = 1.602176634e-19;      // [C]
const U    = 1.66053906660e-27;    // 原子質量単位 [kg]
const C_CM = 2.99792458e10;        // 光速 [cm/s]（波数 cm⁻¹ → 角振動数に使う）
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

/* wn = 振動数を波数 [cm⁻¹] で与える書き方（分子分光の慣習）。ω = 2πc·wn。
   bond があるものは、零点振動の広がりを結合長と比べられる。 */
const PRESETS = [
  { n:'CO 分子の伸縮振動',        m: 6.856 * U, wn: 2170, bond: 112.8e-12 },
  { n:'H₂ 分子の伸縮振動',        m: 0.5039 * U, wn: 4401, bond: 74.1e-12 },
  /* Si は gruneisen_Si.yaml（望月先生の第一原理計算）の値。phonopy の frequency は
     ν［THz］なので E = hν。Γ 点の光学モードが 15.28 THz = 509.6 cm⁻¹。 */
  { n:'Si の光学フォノン（Γ点）',  m: 28.09 * U, wn: 509.6 },
  { n:'Si の音響フォノン（最も軟らかいモード）', m: 28.09 * U, wn: 12.25 },
  { n:'I₂ 分子（重くて柔らかい）', m: 63.45 * U, wn: 214.5, bond: 266.6e-12 },
  { n:'机の上のばね（100 g, 10 N/m）', m: 0.1, w: Math.sqrt(10 / 0.1) },
  { n:'振り子時計（1 秒振り子）',  m: 0.5, w: 2 * Math.PI / 2 }
];
function omegaOf(p){ return p.w !== undefined ? p.w : 2 * Math.PI * C_CM * p.wn; }

const T_PRESETS = [
  { n:'ほぼ絶対零度（1 mK）',        T: 1e-3 },
  { n:'宇宙背景放射（2.7 K）',       T: 2.725 },
  { n:'液体ヘリウム（4.2 K）',       T: 4.2 },
  { n:'液体窒素（77 K）',            T: 77 },
  { n:'室温（300 K）',               T: 300 },
  { n:'白熱電球のフィラメント（2800 K）', T: 2800 }
];

/* ========================================================================
   1. 波動関数（無次元 X = √(mω/ħ)·x）
   ======================================================================== */
/* ψ̃ₙ₊₁ = X√(2/(n+1))·ψ̃ₙ − √(n/(n+1))·ψ̃ₙ₋₁ で漸化的に作る。
   ノートの閉じた形（2ⁿn! を含む）は n が大きいと桁あふれするため。
   規格化は ∫|ψ̃|²dX = 1。 */
const PI4 = Math.pow(Math.PI, -0.25);
function psiT(n, X){
  const g = PI4 * Math.exp(-X * X / 2);
  if (n === 0) return g;
  let p0 = g, p1 = Math.SQRT2 * X * g;
  for (let k = 1; k < n; k++){
    const p2 = X * Math.sqrt(2 / (k + 1)) * p1 - Math.sqrt(k / (k + 1)) * p0;
    p0 = p1; p1 = p2;
  }
  return p1;
}
/* 古典確率密度（同じエネルギーの古典粒子が X の近くにいる時間の割合）
   P_cl(X) = 1/(π√(A²−X²)),  A = √(2n+1) */
function pClass(n, X){
  const A2 = 2 * n + 1, r = A2 - X * X;
  return r > 1e-9 ? 1 / (Math.PI * Math.sqrt(r)) : NaN;
}

/* 熱平衡（Bose–Einstein / 調和振動子の分配関数） */
function meanN(x){ return x > 700 ? 0 : 1 / Math.expm1(x); }        // x = ħω/kT
function entropyK(x){                                              // S/kB
  if (x > 700) return 0;
  return x / Math.expm1(x) - Math.log(1 - Math.exp(-x));
}

/* ========================================================================
   1b. 第 2 量子化（タブ④⑤）
   ------------------------------------------------------------------------
   ④ は「1 本の調和振動子に量子を 1 個入れる／出す」話（ノート (2)〜(5)）。
   ⑤ は「準位がたくさんあるところへ粒子を詰める」話で、
      ボース粒子とフェルミ粒子の違いがそのまま見える。
   ======================================================================== */
const NQMAX = 12;                    // タブ④で扱う量子の数の上限
const NLV   = 8;                     // タブ⑤で並べる準位の数
const XSQ   = 7.0;                   // タブ④の横軸 ξ の範囲（n を変えても固定）
const PSIMAX = 0.80;                 // 縦の目盛りも固定する（|φ₀| = π^(−1/4) = 0.751）

/* (21) の係数。up なら √(n+1)、そうでなければ √n */
function ladderCoef(n, up){ return Math.sqrt(up ? n + 1 : n); }

/* 占有数から作る粒子密度 n(X) = Σ n_k |φ_k(X)|²。積分すると粒子数 N になる */
function density(occ, X){
  let s = 0;
  for (let k = 0; k < occ.length; k++){
    if (occ[k]) s += occ[k] * Math.pow(psiT(k, X), 2);
  }
  return s;
}
function totalN(occ){ let s = 0; for (let k = 0; k < occ.length; k++) s += occ[k]; return s; }
/* 全エネルギー（ħω 単位）。ε_k = (k + ½)ħω */
function totalE(occ){ let s = 0; for (let k = 0; k < occ.length; k++) s += occ[k] * (k + 0.5); return s; }
/* いちばん上の占有準位。誰もいなければ −1 */
function topLevel(occ){
  for (let k = occ.length - 1; k >= 0; k--) if (occ[k] > 0) return k;
  return -1;
}
/* 正孔＝「いちばん上にいる粒子より下にある空席」。フェルミ粒子でだけ意味を持つ */
function holesOf(occ){
  const top = topLevel(occ), h = [];
  for (let k = 0; k < top; k++) if (occ[k] === 0) h.push(k);
  return h;
}
/* この系で「量子」を何と呼ぶか（プリセットごと） */
function quantumName(p){
  if (p.n.indexOf('フォノン') >= 0) return 'フォノン';
  if (p.n.indexOf('分子') >= 0) return '振動量子（分子振動のフォノン）';
  return '振動の量子';
}

/* ========================================================================
   2. 表示のヘルパ
   ======================================================================== */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
             '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(v){ return String(v).split('').map(function(c){ return SUP[c] || c; }).join(''); }
const SUB = {'-':'₋','0':'₀','1':'₁','2':'₂','3':'₃','4':'₄',
             '5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
function subs(v){ return String(v).split('').map(function(c){ return SUB[c] || c; }).join(''); }
function fmt(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10' + sup(Number(p[1]));
  }
  return String(Number(v.toPrecision(n)));
}
const LEN = [[1,'m'],[1e-2,'cm'],[1e-3,'mm'],[1e-6,'µm'],[1e-9,'nm'],[1e-12,'pm'],[1e-15,'fm']];
function flen(v, n){
  if (!isFinite(v) || v === 0) return '0';
  const a = Math.abs(v);
  for (let i = 0; i < LEN.length; i++){
    if (a >= LEN[i][0]) return fmt(v / LEN[i][0], n || 4) + ' ' + LEN[i][1];
  }
  return fmt(v * 1e15, n || 4) + ' fm';
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function axes(c, x0, y0, x1, y1, xlab, ylab){
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'right'; c.fillText(xlab, x1 - 2, y1 - 4);
  c.textAlign = 'left';  c.fillText(ylab, x0 + 3, y0 + 11);
}

/* ========================================================================
   3. シミュレーター本体
   ======================================================================== */

const WAVE_NOTES = '<div class="note"><b>①の絵と③の絵は同じ横軸です。</b>\n真上の錘が右端まで来たとき、真下の赤い点も右端にいます。\n古典の粒子は折り返し点の近くで遅くなるので、そこに<b>長く留まります</b>\n―― 赤い曲線（古典の確率密度）が両端で持ち上がるのはそのためです。</div>\n<div class="note"><b>n = 0：古典なら「静止」、量子では「止まれない」。</b>\n古典力学では、ばねに繋がれた質点の最低エネルギー状態は\n<i>E</i> = 0、つまりつり合いの位置で完全に静止した状態です（②の赤い破線）。\nところが Schrödinger 方程式を解くと、いちばん下の解でも\n<i>E</i><sub>0</sub> = <i>ħ</i><i>ω</i>/2 だけ浮いていて、\n波動関数は幅 σ<sub>x</sub> = √(<i>ħ</i>/2<i>m</i><i>ω</i>) の山になります。\n①の薄い枠が「古典の静止位置」、濃い錘が「量子でも残ってしまう揺れ」です。</div>\n<div class="note"><b>n を上げると、量子と古典が近づいていきます。</b>\nn = 0 では |ψ|² は真ん中が最も高く、古典（両端が高い）とまるで逆です。\nところが n を 20 まで上げると、細かく振動しながらも<b>全体の形が古典の曲線に沿ってきます</b>。\nこれが<b>対応原理</b>です。</div>\n<div class=\"note\">\n机の上のばね（100 g, 10 N/m）のような<b>巨視的な</b>振動子は、室温で ⟨n⟩ ≒ 4×10<sup>12</sup> です。\n1 段の間隔が全体の 10<sup>−12</sup> しかないので階段は連続に見えます。\nところが<b>結晶のフォノンはまるで違います</b>。Si を第一原理計算した結果では、\n室温での ⟨n⟩ は光学モード（Γ点, 15.28 THz）で 0.095、\n最も軟らかい音響モード（0.37 THz）で 16.5、\nBrillouin 帯・全分枝で平均すると 0.59 です。\n<b>n = 0, 1, 2, … が数えられる範囲にいる</b>ので、量子性がそのまま観測にかかります\n（Si の比熱が室温で Dulong–Petit の法則(1原子あたりの定積比熱の上限が 3 k<sub>B</sub> であること)の 80 % に留まるのがその証拠です）。</div>\n<div class="note warn">⚠ ①のばねの動きは<b>見やすい速さに落としてあります</b>。\n実際の周期は右の読み取り値のとおりで、CO 分子なら 15 fs ほど、\n机の上のばねなら 0.6 秒ほどです。</div>\n<div class="note"><b>σ<sub>x</sub>σ<sub>p</sub> = (n + 1/2)<i>ħ</i></b> です。\nn = 0 のときだけ <i>ħ</i>/2 ちょうど、つまり<b>不確定性原理の等号</b>が成り立ちます。\n基底状態は「不確定性原理が許すギリギリまで小さくまとまった状態」なのです。</div>';
const ZERO_NOTES = '<div class="note"><b>絶対零度とは「止まる」ことではありません。</b>\n温度を下げると粒子はどんどん下の準位へ落ちていき、\n<i>T</i> → 0 で全部が n = 0 に入ります（左のグラフ）。\nでもその n = 0 が <i>ħ</i><i>ω</i>/2 を持っている以上、\n<b>いくら冷やしてもエネルギーはここから下がりません</b>。\n右のグラフで、青い線が <i>ħ</i><i>ω</i>/2 の床に貼りついて止まるのがそれです。</div>\n<div class="note"><b>なぜ ħω/2 が下限なのか（ノート (3)）。</b>\n古典的には <i>E</i> = <i>p</i>²/2<i>m</i> + ½<i>m</i><i>ω</i>²<i>x</i>² です。\nここで「位置も運動量も同時にゼロにはできない」ことを認めると、\n相加相乗平均から\nΔ<i>p</i>²/2<i>m</i> + ½<i>m</i><i>ω</i>²Δ<i>x</i>² ≧ <i>ω</i>·Δ<i>x</i>Δ<i>p</i>\nとなり、不確定性原理 Δ<i>x</i>Δ<i>p</i> ≧ <i>ħ</i>/2 を入れると\nΔ<i>E</i> ≧ <i>ħ</i><i>ω</i>/2。\n<b>零点エネルギーは、不確定性原理がエネルギーに課した下限そのもの</b>です。</div>\n<div class="note"><b>熱力学第三法則との関係。</b>\n第三法則には 2 つの言い方があります。\n<br>(i) <b>Nernst</b>：<i>T</i> → 0 でエントロピー <i>S</i> → 0（基底状態がただ 1 つだから）。\n<br>(ii) <b>到達不能性</b>：有限回の操作では <i>T</i> = 0 に到達できない。\n<br>冷却とは「エントロピーを外へ捨てる」操作ですが、<i>T</i> が下がるほど\n捨てられる <i>S</i> が減っていく（右の読み取り値で <i>S</i>/<i>k</i><sub>B</sub> が急速に 0 へ向かうのが見えます）。\nだから何段重ねても 0 に届きません。</div>\n<div class="note warn">⚠ <b>零点エネルギーそのものが「到達できないこと」を証明するわけではありません。</b>\n両者は「基底状態がただ 1 つに決まっていて、その下が無い」という<b>同じ事実</b>から出ています。\n零点エネルギーは<b>絶対零度がどんな状態か</b>（止まった状態ではなく、揺れ続ける基底状態）を教え、\n第三法則は<b>そこへ到達する手続き</b>が有限回では終わらないことを言っています。</div>\n<div class="note"><b>高温では古典に戻ります。</b>\n<i>k</i><sub>B</sub><i>T</i> ≫ <i>ħ</i><i>ω</i> になると ⟨<i>E</i>⟩ → <i>k</i><sub>B</sub><i>T</i>\n（赤い破線）。これは古典統計力学の<b>等分配則</b>そのもので、\nPlanck の公式のページで「紫外破綻を起こした式」として出てくるものと同じです。\n実際、Planck が使った ⟨<i>E</i>⟩ = <i>h</i><i>ν</i>/(e<sup><i>h</i><i>ν</i><i>/</i><i>k</i><i>T</i></sup>−1) は、\nこの ⟨<i>E</i>⟩ から零点エネルギー <i>ħ</i><i>ω</i>/2 を引いたものです。</div>';

const CLOUD_NOTES = '<div class="note"><b>なぜタブ①では「動く点」と「分布」が噛み合わなかったのか。</b>\nエネルギー固有状態 ψ<sub>n</sub> は<b>定常状態</b>なので、|ψ<sub>n</sub>|² は時間が経っても\nまったく変わりません。だから「振動する粒子」の絵とは、そもそも対応しません。\nタブ①で動いていた赤い点は<b>古典の</b>粒子で、比較のために置いてあるものです。</div>\n<div class="note"><b>噛み合うのは「コヒーレント状態」です。</b>\n基底状態の Gauss をそのまま横にずらした状態を作ると、\n<b>形をまったく崩さずに、中心だけが古典解どおりに振動し続けます</b>。\n調和振動子だけが持つ特別な性質で（ポテンシャルが 2 次だから）、\nSchrödinger が 1926 年に「古典粒子に一番近い量子状態」として見つけたものです。\nここで見ているのがそれです。</div>\n<div class="note"><b>質点のまき方と転がし方。</b>\n位相空間 (<i>x</i>, <i>p</i>) 上で Wigner 分布（この状態では等方な Gauss）に従って\n質点をまき、あとは<b>1 個ずつ古典的に転がしているだけ</b>です。\nポテンシャルが 2 次までなら、これが厳密に量子の答えを再現します\n（Ehrenfest の定理のページで使ったのとまったく同じ手口です）。\n青いヒストグラムが青い曲線に重なるのは、偶然ではなく必然です。</div>\n<div class="note"><b>⟨n⟩ を動かしてみてください。</b>\n振幅は <i>A</i> = √(2⟨n⟩)·<i>x</i><sub>0</sub> で伸びますが、\n<b>ぼやけ幅 σ = √(<i>ħ</i>/2<i>m</i><i>ω</i>) は ⟨n⟩ を変えても縮みません</b>。\nσ/<i>A</i> = 1/(2√⟨n⟩) なので、⟨n⟩ を大きくすると相対的にぼやけが見えなくなり、\n「1 個の粒子がきちんと振動している」ように見えてきます。これが古典力学の正体です。\n逆に ⟨n⟩ = 0 にすると振幅が 0 になり、<b>動かないのに揺れている</b>基底状態になります。</div>\n<div class="note"><b>質量を軽くすると、ぼやけが効いてきます。</b>\nσ ∝ 1/√(<i>m</i><i>ω</i>) なので、右のプリセットで軽い系（H₂ 分子など）に変えると\n同じ ⟨n⟩ でもぼやけが目立ちます。単スリットのページで見た\n「質量を下げると分布が広がる」のと同じことが、ここでも起きています。</div>';

const SQ_NOTES = "<div class=\"note\"><b>「量子を 1 個つくる」と「準位が 1 段上がる」は、同じことです。</b> 調和振動子では <i>E</i><sub>n</sub> = (n + 1/2)<i>ℏ</i><i>ω</i> ですから、段が 1 つ上がるたびにエネルギーがきっかり <i>ℏ</i><i>ω</i> ずつ増えます。それなら「<i>ℏ</i><i>ω</i> を持った粒子が 1 個増えた」と読んでも、まったく同じ計算になります。<b>この「粒子」に、系ごとに名前がついています</b> ―― 結晶の格子振動なら<b>フォノン</b>、電磁場なら<b>フォトン</b>。右のプリセットを変えると、その名前が読み取り値に出ます。</div><div class=\"note\"><b>なぜ係数が 1 ではなく √(n+1) なのか。</b> 波動関数はいつも規格化されていてほしいので、â† を当てた結果の「長さ」を測ってやる必要があります。測ると ‖â†ψ<sub>n</sub>‖² = n + 1 になる ―― だから √(n+1) で割って初めて ψ<sub>n+1</sub> になります。<b>この係数には物理があります。</b>すでに n 個いるところへ 1 個足すほうが、空っぽのところへ足すより (n+1) 倍起こりやすい。これが<b>誘導放出</b>、つまりレーザーの原理です。</div><div class=\"note warn\"><b>â|0⟩ = 0 ―― 梯子には下端があります。</b> 「â を当てると n が 1 減る」を繰り返すと、いつか n が負になってしまいます。ところが ‖âψ<sub>n</sub>‖² = n は長さの 2 乗ですから、負にはなれません。<b>唯一の逃げ道が â|0⟩ = 0 で止まること</b>で、そこから n = 0, 1, 2, … と決まります。級数を切ったときに出てきた量子化と、同じ結論が別の道から出ています。</div><div class=\"note\"><b>節の数を数えてみてください。</b> â† を 1 回当てるたびに、波動関数の<b>節（ゼロを横切る点）が 1 つ増えます</b>。節が増えれば曲がりが増え、曲がりが増えれば運動エネルギーが上がる ―― それが「1 段ぶん <i>ℏ</i><i>ω</i> 高い」の中身です。</div><div class=\"note\"><b>量子が 0 個でも、エネルギーは 0 ではありません。</b> <i>Ĥ</i> = <i>ℏ</i><i>ω</i>(<i>N̂</i> + 1/2) ですから、<i>N̂</i> の固有値が 0 でも <i>ℏ</i><i>ω</i>/2 が残ります。タブ②で見た零点エネルギーは、この 1/2 のことです。<b>「真空」は空っぽではなく、揺れている</b>のです。</div>";

const FBO_NOTES = "<div class=\"note\"><b>同じ操作を、両方に当てています。</b> 「k = 0 に 1 個つくる」を 4 回押してみてください。ボース側は 4 個とも k = 0 に積み上がり、フェルミ側は 1 個入ったきり、あとは <b>ĉ†<sub>0</sub> ĉ†<sub>0</sub> = 0</b> で弾かれます。これが Pauli の排他律です。</div><div class=\"note\"><b>違いの出どころは、たった 1 つの符号です。</b> ボース粒子は <b>â â† − â† â = 1</b>（引き算）、フェルミ粒子は <b>ĉ ĉ† + ĉ† ĉ = 1</b>（足し算）。後者からは ĉ†ĉ† = −ĉ†ĉ†、つまり <b>ĉ†ĉ† = 0</b> がただちに出ます。「2 個を入れ替えると符号が変わる」という多体波動関数の約束が、演算子の関係式のほうへ丸ごと移された姿です。</div><div class=\"note\"><b>電子の励起は「電子の消滅 ＋ 正孔の生成」です。</b> 「いちばん上の粒子を 1 つ上げる」を押すと、フェルミ側では ĉ†<sub>l</sub> ĉ<sub>k</sub> が働いて、空いた席が<b>正孔</b>として残ります。半導体の伝導も、発光も、この電子–正孔の対で語られます。講義ノートの Introduction が「電子の消滅と正孔の生成を考えないといけない」と言っているのは、これです。</div><div class=\"note\"><b>下のグラフが、いちばんの見どころです。</b> 同じ N 個でも、ボース粒子は全員が k = 0 に入るので<b>細く尖った</b>分布になり、フェルミ粒子は上へ上へと積むしかないので<b>広く平たい</b>分布になります。N = 8 で比べると、全エネルギーは 4 <i>ℏ</i><i>ω</i> と 32 <i>ℏ</i><i>ω</i>、広がりは 0.71 と 2.00。<b>物質に体積があるのは、これが理由です。</b>白色矮星や中性子星がつぶれずにいられるのも、この「押し上げられた」エネルギーによる圧力です。</div><div class=\"note\"><b>タブ④と⑤は、何が違うのか。</b> ④は<b>振動子 1 本</b>に量子が n 個入る話、⑤は<b>準位がたくさん</b>あってそこへ粒子が N 個入る話です。見た目は違いますが、使っている代数はまったく同じ â, â† です。<b>「準位が n 番目にいる」と「粒子が n 個いる」が同じ数学だ</b>と気づくこと ―― それが第 2 量子化の出発点です。</div><div class=\"note warn\">⚠ <b>ここではスピンを省いています。</b> 本物の電子はスピン ↑↓ を持つので、1 つの準位に <b>2 個</b>まで入れます。状態を (準位, スピン) の組で数え直せば、そのまま同じ話になります。</div>";

const app = document.getElementById('qsim');

function Sim(key, root){
  this.key = key;
  this.root = root;
  this.pi = 0;                       // プリセット番号
  this.n = 0;                        // 量子数
  this.T = 300;                      // 温度 [K]（タブ②）
  this.phase = 0;                    // アニメーションの位相
  /* 教材ページには iframe がいくつも並ぶ。全部がいっせいに動き出すと
     落ち着いて読めないので、止まった状態で開く（読む人が選んで再生する） */
  this.playing = false;
  this.speed = 1;
  this.showCl = true;                // 古典確率密度を重ねる
  this.nbar = 6;                     // コヒーレント状態の ⟨n⟩（タブ③）
  this.nDots = 400;                  // まく質点の数（タブ③）
  /* タブ④：1 本の振動子に入っている量子の数 */
  this.nq = 0;
  this.prevNq = null;                // ひとつ前の状態（重ねて描く）
  this.lastOp = null;                // 'up' | 'dn' | 'zero'
  this.tOp = 1;                      // 操作のアニメーション 0 → 1
  this.showPrev = true;
  this.msg = ''; this.msgCls = '';
  /* タブ⑤：準位ごとの占有数 */
  this.occB = []; this.occF = []; this.kSel = 0;
  this.msgB = ''; this.msgF = '';
  if (key === 'fbo') this.setGround(2);
  if (key === 'cloud') this.seedCloud();
  this.build();
  this.recompute();
}

Sim.prototype.build = function(){
  const self = this;
  const lay = el('div','layout');
  const colMain = el('div','col-main'), colSide = el('div','col-side');
  lay.appendChild(colMain); lay.appendChild(colSide);
  this.root.appendChild(lay);

  const stage = el('div','stage');
  const cv = document.createElement('canvas');
  stage.appendChild(cv); colMain.appendChild(stage);
  this.cv = cv; this.ctx = cv.getContext('2d');

  /* タブ⑤は、梯子の段を直接クリックしても準位を選べるようにする */
  if (this.key === 'fbo'){
    cv.style.cursor = 'pointer';
    cv.addEventListener('click', function(e){
      if (!self.geo) return;
      const r = cv.getBoundingClientRect();
      const y = (e.clientY - r.top) * (self.H / r.height);
      if (y < self.geo.T0 || y > self.geo.T1) return;
      const k = Math.floor((self.geo.base - y) / self.geo.rowH);
      if (k < 0 || k >= NLV) return;
      self.kSel = k;
      if (self.kin) self.kin.value = String(k);
      self.recompute();
    });
  }

  if (this.key === 'wave'){
    colMain.appendChild(el('div','legend',
      '<span><i style="background:var(--spring)"></i>古典のばね（同じエネルギー）</span>' +
      '<span><i style="background:var(--qm)"></i>波動関数 ψ<sub>n</sub></span>' +
      '<span><i style="background:var(--cls)"></i>古典の確率密度</span>' +
      '<span><i style="background:var(--zpe)"></i>零点エネルギー</span>'));
  } else if (this.key === 'cloud'){
    colMain.appendChild(el('div','legend',
      '<span><i style="background:var(--qm)"></i>まいた質点と、そのヒストグラム</span>' +
      '<span><i style="background:var(--cls)"></i>群れの中心（古典解）</span>' +
      '<span><i style="background:var(--zpe)"></i>ぼやけ幅 σ = √(ħ/2mω)</span>'));
  } else if (this.key === 'sq'){
    colMain.appendChild(el('div','legend',
      '<span><i style="background:var(--zpe)"></i>量子（フォノン／フォトン）1 個</span>' +
      '<span><i style="background:var(--qm)"></i>いまの波動関数 ψ<sub>n</sub></span>' +
      '<span><i style="background:rgba(31,35,40,.45)"></i>ひとつ前の波動関数</span>' +
      '<span><i style="background:var(--cls)"></i>節（ゼロを横切る点）</span>'));
  } else if (this.key === 'fbo'){
    colMain.appendChild(el('div','legend',
      '<span><i style="background:var(--bose)"></i>ボース粒子</span>' +
      '<span><i style="background:var(--fermi)"></i>フェルミ粒子</span>' +
      '<span><i style="background:var(--hole)"></i>正孔（上に粒子がいるのに空いた席）</span>' +
      '<span><i style="background:var(--zpe)"></i>分布の広がり ±√⟨ξ²⟩</span>'));
  } else {
    colMain.appendChild(el('div','legend',
      '<span><i style="background:var(--qm)"></i>各準位にいる確率 P<sub>n</sub></span>' +
      '<span><i style="background:var(--cls)"></i>古典の予想 ⟨E⟩ = k<sub>B</sub>T</span>' +
      '<span><i style="background:var(--zpe)"></i>零点エネルギー ħω/2</span>'));
  }

  const readout = el('div','readout');
  colMain.appendChild(readout);

Sim.prototype.setT = function(T){
  this.T = Math.min(1e4, Math.max(1e-4, T));
  if (this.tin) this.tin.value = String(Math.round(Math.log(this.T / 1e-4) / Math.log(1e8) * 1000));
};

/* ---- 物理量をまとめて出す ---- */
Sim.prototype.phys = function(){
  const p = PRESETS[this.pi], m = p.m, w = omegaOf(p);
  const hw = HBAR * w;
  const x0 = Math.sqrt(HBAR / (m * w));          // 長さの単位（X = x/x0）
  return {
    p: p, m: m, w: w, hw: hw, k: m * w * w, x0: x0,
    period: 2 * Math.PI / w,
    sigX: x0 * Math.sqrt(this.n + 0.5),          // σx
    sigP: (HBAR / x0) * Math.sqrt(this.n + 0.5), // σp
    amp: x0 * Math.sqrt(2 * this.n + 1),         // 古典振幅
    E: hw * (this.n + 0.5)
  };
};

/* ========================================================================
   3b. 生成・消滅の操作（タブ④⑤）
   ======================================================================== */
/* ---- タブ④：1 本の振動子に量子を出し入れする ---- */
Sim.prototype.opQ = function(up){
  if (!up && this.nq === 0){
    this.prevNq = null; this.lastOp = 'zero'; this.tOp = 1;
    this.msg = '<b>â|0⟩ = 0</b> ―― 真空からは、もう 1 個も消せません。' +
               'これが梯子の下端で、ここから n = 0, 1, 2, … と数が決まります。';
    this.msgCls = 'zero';
    this.recompute(); return;
  }
  if (up && this.nq >= NQMAX){
    this.msg = 'このページでは n = ' + NQMAX + ' までにしてあります（実際には上限はありません）。';
    this.msgCls = 'zero';
    this.recompute(); return;
  }
  this.prevNq = this.nq;
  this.nq += up ? 1 : -1;
  this.lastOp = up ? 'up' : 'dn';
  this.tOp = 0;
  const co = ladderCoef(this.prevNq, up);
  this.msg = '<b>' + (up ? 'â†' : 'â') + '|' + this.prevNq + '⟩ = ' +
             (Math.abs(co - 1) < 1e-12 ? '' : '√' + (up ? this.prevNq + 1 : this.prevNq) + ' ') +
             '|' + this.nq + '⟩</b>　（係数 ' + co.toFixed(4) + '）　' +
             'エネルギーは ' + (up ? '+' : '−') + 'ℏω、波動関数は ψ' + subs(this.prevNq) +
             ' から ψ' + subs(this.nq) + ' に変わりました。';
  this.msgCls = '';
  if (this.nin3) this.nin3.value = String(this.nq);
  this.recompute();
};
Sim.prototype.setQ = function(n){
  this.prevNq = null; this.lastOp = null; this.tOp = 1;
  this.nq = Math.max(0, Math.min(NQMAX, n));
  this.msg = this.nq === 0
    ? 'n = 0 にしました。量子が 1 個も入っていない状態 ―― <b>真空 |0⟩</b> です。'
    : ('n = ' + this.nq + ' にしました。真空から作るなら <b>ψ' + subs(this.nq) +
       ' = (â†)' + sup(this.nq) + 'ψ₀ ／ √' + this.nq + '!</b> ―― â† を ' +
       this.nq + ' 回当てるだけです。');
  this.msgCls = '';
  if (this.nin3) this.nin3.value = String(this.nq);
  this.recompute();
};

/* ---- タブ⑤：準位がたくさんあるところへ粒子を詰める ---- */
Sim.prototype.setGround = function(N){
  this.occB = []; this.occF = [];
  for (let k = 0; k < NLV; k++){ this.occB.push(0); this.occF.push(0); }
  N = Math.max(0, Math.min(NLV, N));
  this.occB[0] = N;
  for (let k = 0; k < N; k++) this.occF[k] = 1;
  this.msgB = N === 0 ? '空です' : 'N = ' + N + ' 個ぜんぶが k = 0 に入ります（何個でも重なれる）';
  this.msgF = N === 0 ? '空です'
            : 'N = ' + N + ' 個が k = 0 〜 ' + (N - 1) + ' に 1 個ずつ入ります（下から詰めるしかない）';
  /* 立ち上げのときはまだ canvas が無いので、描き直しは呼ばない */
  if (this.cv) this.recompute();
};
/* 選んだ準位に 1 個つくる／消す。同じ操作を両方に当てて、結果の違いを見る */
Sim.prototype.opAt = function(k, create){
  if (create){
    this.occB[k]++;
    this.msgB = 'â†' + subs(k) + ' を当てました → n' + subs(k) + ' = ' + this.occB[k] +
                '（何個でも入る）';
    if (this.occF[k] === 0){
      this.occF[k] = 1;
      this.msgF = 'ĉ†' + subs(k) + ' を当てました → n' + subs(k) + ' = 1';
    } else {
      this.msgF = 'ĉ†' + subs(k) + ' ĉ†' + subs(k) + ' = 0 ―― すでに 1 個いるので入れません（Pauli の排他律）';
    }
  } else {
    if (this.occB[k] > 0){
      this.occB[k]--;
      this.msgB = 'â' + subs(k) + ' を当てました → n' + subs(k) + ' = ' + this.occB[k];
    } else {
      this.msgB = 'â' + subs(k) + '|0⟩ = 0 ―― その準位には誰もいません';
    }
    if (this.occF[k] === 1){
      this.occF[k] = 0;
      this.msgF = 'ĉ' + subs(k) + ' を当てました → n' + subs(k) + ' = 0（空席＝正孔）';
    } else {
      this.msgF = 'ĉ' + subs(k) + '|0⟩ = 0 ―― その準位には誰もいません';
    }
  }
  this.recompute();
};
/* いちばん上にいる粒子を 1 つ上へ。フェルミ側は空いている準位まで飛ぶ */
Sim.prototype.excite = function(){
  const tb = topLevel(this.occB);
  if (tb < 0) this.msgB = '粒子がいません';
  else if (tb >= NLV - 1) this.msgB = 'これ以上は上に準位がありません';
  else {
    this.occB[tb]--; this.occB[tb + 1]++;
    this.msgB = 'â†' + subs(tb + 1) + ' â' + subs(tb) + ' を当てました（k = ' + tb +
                ' から ' + (tb + 1) + ' へ）';
  }
  const tf = topLevel(this.occF);
  if (tf < 0) this.msgF = '粒子がいません';
  else {
    let to = -1;
    for (let k = tf + 1; k < NLV; k++) if (this.occF[k] === 0){ to = k; break; }
    if (to < 0) this.msgF = '上に空いている準位がありません';
    else {
      this.occF[tf] = 0; this.occF[to] = 1;
      this.msgF = 'ĉ†' + subs(to) + ' ĉ' + subs(tf) + ' を当てました ―― 電子が k = ' + tf +
                  ' から ' + to + ' へ。<b>空いた k = ' + tf + ' が正孔</b>です';
    }
  }
  this.recompute();
};

/* ========================================================================
   4. 描画
   ======================================================================== */
Sim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = (this.key === 'wave')
    ? Math.round(Math.max(360, Math.min(560, w * 0.80)))
    : (this.key === 'cloud')
      ? Math.round(Math.max(300, Math.min(430, w * 0.56)))
      : (this.key === 'sq')
        ? Math.round(Math.max(320, Math.min(430, w * 0.52)))
        : (this.key === 'fbo')
          ? Math.round(Math.max(420, Math.min(600, w * 0.74)))
          : Math.round(Math.max(250, Math.min(340, w * 0.44)));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  this.cv.width = Math.round(w * dpr);
  this.cv.height = Math.round(h * dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  this.draw();
};

/* 表示する X の範囲。折り返し点 √(2n+1) の外側に 3.0 だけ余白を取る。
   ②のポテンシャルの縦は V(XMAX) = XMAX²/2 に合わせるので、
   この 1 本でパネル②の縦スケールも決まる（放物線がちょうど枠に収まる）。 */
function xmaxOf(n){ return Math.sqrt(2 * n + 1) + 2.4; }

Sim.prototype.draw = function(){
  if (!this.W) return;
  this.ctx.clearRect(0, 0, this.W, this.H);
  if (this.key === 'wave') this.drawWave();
  else if (this.key === 'cloud') this.drawCloud();
  else if (this.key === 'sq') this.drawSq();
  else if (this.key === 'fbo') this.drawFbo();
  else this.drawZero();
};

/* ---- ばねの絵 ---- */
function drawSpring(c, xa, xb, y, coils, amp){
  const lead = 9;
  const x0 = xa + lead, x1 = xb - lead;
  const seg = (x1 - x0) / (coils * 2);
  c.beginPath();
  c.moveTo(xa, y); c.lineTo(x0, y);
  for (let i = 0; i < coils * 2; i++) c.lineTo(x0 + seg * (i + 0.5), y + (i % 2 ? amp : -amp));
  c.lineTo(x1, y); c.lineTo(xb, y);
  c.stroke();
}

Sim.prototype.drawWave = function(){
  const c = this.ctx, W = this.W, H = this.H, n = this.n, F = this.phys();
  const XMAX = xmaxOf(n);
  const padL = 40, padR = 14;
  const X0 = padL, X1 = W - padR;
  const px = function(X){ return X0 + (X + XMAX) / (2 * XMAX) * (X1 - X0); };

  /* 3 段の高さ配分 */
  const gapY = 12;
  const hA = Math.round((H - gapY * 2) * 0.22);      // ばね
  const hB = Math.round((H - gapY * 2) * 0.46);      // ポテンシャルと準位
  const hC = (H - gapY * 2) - hA - hB;               // |ψ|²
  const Ay0 = 0,               Ay1 = Ay0 + hA;
  const By0 = Ay1 + gapY,      By1 = By0 + hB;
  const Cy0 = By1 + gapY,      Cy1 = Cy0 + hC;

  const A = Math.sqrt(2 * n + 1);                   // 古典振幅（X 単位）
  const xc = A * Math.cos(this.phase);              // いまの古典位置

  /* ============ A：古典のばね ============ */
  axes(c, X0, Ay0, X1, Ay1, '', '① 古典：ばねに繋がれた質点');
  const ym = (Ay0 + Ay1) / 2 + 6;

  /* 折り返し点 */
  c.setLineDash([3,3]); c.strokeStyle = 'rgba(198,40,40,.45)'; c.lineWidth = 1;
  [-A, A].forEach(function(t){
    c.beginPath(); c.moveTo(px(t), Ay0 + 16); c.lineTo(px(t), Ay1 - 4); c.stroke();
  });
  c.setLineDash([]);
  /* つり合いの位置 */
  c.strokeStyle = 'rgba(31,35,40,.22)';
  c.beginPath(); c.moveTo(px(0), Ay0 + 16); c.lineTo(px(0), Ay1 - 4); c.stroke();

  /* 壁 */
  const wallX = X0 + 6;
  c.strokeStyle = '#5c6670'; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(wallX, ym - 22); c.lineTo(wallX, ym + 22); c.stroke();
  c.lineWidth = 1;
  for (let i = -22; i < 22; i += 6){
    c.beginPath(); c.moveTo(wallX, ym + i); c.lineTo(wallX - 6, ym + i + 6); c.stroke();
  }

  /* ばね本体 */
  const bw = 22, bh = 26;
  const bx = px(xc);
  c.strokeStyle = '#5c6670'; c.lineWidth = 1.6;
  drawSpring(c, wallX, bx - bw / 2, ym, 12, 7);

  /* 古典の最低状態（E = 0：完全に静止）を薄く置いて対比する */
  c.fillStyle = 'rgba(31,35,40,.10)';
  c.fillRect(px(0) - bw / 2, ym - bh / 2, bw, bh);
  c.strokeStyle = 'rgba(31,35,40,.28)'; c.lineWidth = 1;
  c.strokeRect(px(0) - bw / 2, ym - bh / 2, bw, bh);

  /* 錘 */
  c.fillStyle = '#0f4c81';
  c.fillRect(bx - bw / 2, ym - bh / 2, bw, bh);

  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  c.fillText('古典の最低状態（E = 0：静止）', px(0), ym + bh / 2 + 13);
  c.fillStyle = '#c62828';
  c.fillText('折り返し点 ±A', px(A), Ay0 + 13);

  /* ============ B：ポテンシャルと準位 ============ */
  /* 縦軸は ħω を単位に取る。V(X) = X²/2、Eₙ = n + 1/2 */
  axes(c, X0, By0, X1, By1, '位置 x →', '② ポテンシャルとエネルギー準位（単位 ħω）');
  const eTop = XMAX * XMAX / 2;          // V(XMAX)。放物線が枠の上端にちょうど届く
  const py = function(E){ return By1 - 6 - (E / eTop) * (By1 - By0 - 22); };

  /* 準位（現在の n の上下 6 本ぶんだけ描く） */
  const nLo = Math.max(0, n - 6), nHi = n + 6;
  for (let k = nLo; k <= nHi; k++){
    const E = k + 0.5;
    if (py(E) < By0 + 16) break;
    const t = Math.sqrt(2 * k + 1);
    c.strokeStyle = (k === n) ? 'rgba(15,76,129,.55)' : 'rgba(31,35,40,.13)';
    c.lineWidth = (k === n) ? 1.6 : 1;
    c.beginPath(); c.moveTo(px(-t), py(E)); c.lineTo(px(t), py(E)); c.stroke();
  }
  /* 零点エネルギー */
  c.setLineDash([4,3]); c.strokeStyle = '#f9a825'; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(X0 + 1, py(0.5)); c.lineTo(X1 - 1, py(0.5)); c.stroke();
  c.setLineDash([]);
  c.fillStyle = '#8a5a00'; c.font = '9px ' + CFONT; c.textAlign = 'left';
  c.fillText('ħω/2（零点エネルギー）', X0 + 4, py(0.5) - 3);
  /* 古典の底 E = 0。n が大きいと py(0.5) と py(0) が数 px しか離れないので、
     ラベルは反対側（右端）に置いて重ならないようにする。 */
  c.strokeStyle = 'rgba(198,40,40,.45)'; c.setLineDash([2,3]);
  c.beginPath(); c.moveTo(X0 + 1, py(0)); c.lineTo(X1 - 1, py(0)); c.stroke();
  c.setLineDash([]);
  c.fillStyle = '#c62828'; c.textAlign = 'right';
  c.fillText('古典の最低エネルギー E = 0', X1 - 4, py(0) - 3);

  /* ポテンシャル曲線 */
  c.strokeStyle = 'rgba(31,35,40,.55)'; c.lineWidth = 1.8;
  c.beginPath();
  for (let i = 0; i <= 300; i++){
    const X = -XMAX + 2 * XMAX * i / 300, V = X * X / 2;
    const Y = py(V);
    if (Y < By0 + 12){ if (i === 0) continue; }
    if (i === 0) c.moveTo(px(X), Y); else c.lineTo(px(X), Math.max(Y, By0 + 12));
  }
  c.stroke();

  /* いまの準位の上に ψₙ を描く */
  const amp = Math.min(26, (By1 - By0) * 0.13);
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2;
  c.beginPath();
  for (let i = 0; i <= 600; i++){
    const X = -XMAX + 2 * XMAX * i / 600;
    const Y = py(n + 0.5) - psiT(n, X) * amp;
    if (i === 0) c.moveTo(px(X), Y); else c.lineTo(px(X), Y);
  }
  c.stroke();
  c.fillStyle = '#0f4c81'; c.font = '10px ' + CFONT; c.textAlign = 'right';
  c.fillText('ψ' + String(n).split('').map(function(d){ return '₀₁₂₃₄₅₆₇₈₉'[+d]; }).join(''),
             X1 - 4, py(n + 0.5) - 5);

  /* ============ C：|ψ|² と古典確率密度 ============ */
  axes(c, X0, Cy0, X1, Cy1, '位置 x →', '③ どこにいる確率が高いか');
  let pMax = 0;
  for (let i = 0; i <= 400; i++){
    const X = -XMAX + 2 * XMAX * i / 400;
    pMax = Math.max(pMax, Math.pow(psiT(n, X), 2));
  }
  const qy = function(v){ return Cy1 - 5 - Math.min(v / (pMax * 1.35), 1) * (Cy1 - Cy0 - 22); };

  if (this.showCl){
    c.strokeStyle = 'rgba(198,40,40,.85)'; c.lineWidth = 1.6;
    c.beginPath();
    let started = false;
    for (let i = 0; i <= 900; i++){
      const X = -A + 2 * A * i / 900;
      const v = pClass(n, X);
      if (!isFinite(v)) { started = false; continue; }
      const Y = qy(v);
      if (!started){ c.moveTo(px(X), Y); started = true; } else c.lineTo(px(X), Y);
    }
    c.stroke();
  }
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.2;
  c.beginPath();
  for (let i = 0; i <= 700; i++){
    const X = -XMAX + 2 * XMAX * i / 700;
    const Y = qy(Math.pow(psiT(n, X), 2));
    if (i === 0) c.moveTo(px(X), Y); else c.lineTo(px(X), Y);
  }
  c.stroke();

  /* 古典粒子の現在位置 */
  c.fillStyle = '#c62828';
  c.beginPath(); c.arc(px(xc), Cy1 - 5, 4, 0, 6.2832); c.fill();
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  c.fillText('古典の粒子（折り返し点の近くで遅くなる）', (X0 + X1) / 2, Cy0 + 12);
};

/* ---- タブ②：占有確率と ⟨E⟩(T) ---- */
Sim.prototype.drawZero = function(){
  const c = this.ctx, W = this.W, H = this.H, F = this.phys();
  const x = F.hw / (KB * this.T);
  const gap = 34, padL = 38, padR = 12, padT = 18, padB = 26;
  const pw = (W - padL * 2 - padR - gap) / 2;
  const A0 = padL, A1 = padL + pw, B0 = A1 + gap + padL, B1 = W - padR;
  const yT = padT, yB = H - padB;

  /* ---- 左：準位と占有確率 ---- */
  axes(c, A0, yT, A1, yB, '確率 →', '各準位にいる確率 Pₙ');
  const NL = 9;
  const p0 = x > 700 ? 1 : (1 - Math.exp(-x));
  const rowH = (yB - yT - 14) / NL;
  for (let k = 0; k < NL; k++){
    const P = x > 700 ? (k === 0 ? 1 : 0) : p0 * Math.exp(-k * x);
    const y = yB - 8 - k * rowH;
    c.strokeStyle = 'rgba(31,35,40,.18)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(A0 + 26, y); c.lineTo(A1 - 6, y); c.stroke();
    c.fillStyle = (k === 0) ? '#f9a825' : '#0f4c81';
    const bw = Math.max(0, P) * (A1 - A0 - 34);
    c.fillRect(A0 + 26, y - rowH * 0.36, bw, rowH * 0.36);
    c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'right';
    c.fillText('n=' + k, A0 + 22, y + 3);
    if (P > 0.02){
      c.textAlign = 'left'; c.fillStyle = '#15202b';
      c.fillText((P * 100).toFixed(P > 0.2 ? 0 : 1) + ' %', A0 + 30 + bw, y - 2);
    }
  }

  /* ---- 右：⟨E⟩(T) ---- */
  const tLo = 1e-4 * F.hw / KB, tHi = 1e4 * F.hw / KB;   // ħω/kB を基準に 8 桁
  const eLo = 0.12, eHi = 1e4;   // 床 ħω/2 が枠の下端に貼りつかない程度に下を取る
  const qx = function(T){ return B0 + Math.log(T / tLo) / Math.log(tHi / tLo) * (B1 - B0); };
  const qy = function(E){                                 // E は ħω 単位
    return yB - Math.log(Math.max(E, eLo) / eLo) / Math.log(eHi / eLo) * (yB - yT);
  };
  axes(c, B0, yT, B1, yB, '温度 T →（対数）', '⟨E⟩／ħω（対数）');

  /* 零点エネルギーの床。下側は「どうやっても入れない領域」なので塗って示す。 */
  c.fillStyle = 'rgba(249,168,37,.13)';
  c.fillRect(B0 + 1, qy(0.5), B1 - B0 - 2, yB - qy(0.5));
  c.setLineDash([4,3]); c.strokeStyle = '#f9a825'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(B0, qy(0.5)); c.lineTo(B1, qy(0.5)); c.stroke();
  c.setLineDash([]);
  c.fillStyle = '#8a5a00'; c.font = '9px ' + CFONT; c.textAlign = 'left';
  c.fillText('ħω/2', B0 + 4, qy(0.5) - 4);
  c.textAlign = 'center';
  c.fillText('どんなに冷やしてもここへは入れない', (B0 + B1) / 2, (qy(0.5) + yB) / 2 + 3);

  /* 古典の予想 ⟨E⟩ = kT（＝紫外破綻を生んだ等分配則） */
  c.setLineDash([2,3]); c.strokeStyle = 'rgba(198,40,40,.75)'; c.lineWidth = 1.4;
  c.beginPath();
  for (let i = 0; i <= 120; i++){
    const T = tLo * Math.pow(tHi / tLo, i / 120);
    const E = KB * T / F.hw;
    const Y = qy(E);
    if (i === 0) c.moveTo(qx(T), Y); else c.lineTo(qx(T), Y);
  }
  c.stroke(); c.setLineDash([]);
  c.fillStyle = '#c62828'; c.textAlign = 'right';
  c.fillText('古典（等分配則）⟨E⟩ = k_B T', B1 - 4, yT + 22);

  /* 量子の ⟨E⟩ */
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.2;
  c.beginPath();
  for (let i = 0; i <= 240; i++){
    const T = tLo * Math.pow(tHi / tLo, i / 240);
    const xx = F.hw / (KB * T);
    const E = meanN(xx) + 0.5;
    const Y = qy(E);
    if (i === 0) c.moveTo(qx(T), Y); else c.lineTo(qx(T), Y);
  }
  c.stroke();

  /* いまの温度 */
  const Enow = meanN(x) + 0.5;
  if (this.T >= tLo && this.T <= tHi){
    c.strokeStyle = 'rgba(15,76,129,.45)'; c.setLineDash([2,3]); c.lineWidth = 1;
    c.beginPath(); c.moveTo(qx(this.T), yT); c.lineTo(qx(this.T), yB); c.stroke();
    c.setLineDash([]);
    c.fillStyle = '#c62828';
    c.beginPath(); c.arc(qx(this.T), qy(Enow), 4.2, 0, 6.2832); c.fill();
  }
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  c.fillText('ħω/k_B = ' + fmt(F.hw / KB, 3) + ' K', (B0 + B1) / 2, yB + 12);
};

/* ========================================================================
   タブ③：質点をたくさんまいて振動させる（コヒーレント状態）
   ------------------------------------------------------------------------
   エネルギー固有状態 ψₙ は |ψₙ|² が時間によらないので、「振動している粒子」
   の絵とは噛み合わない。噛み合うのは<コヒーレント状態>で、これは
   幅が基底状態と同じまま、中心だけが古典解どおりに振動する状態。

   実装は Ehrenfest のシミュレーターと同じ考え方：
   位相空間 (X, P) から Wigner 分布に従って質点をまき、あとは古典的に転がす。
   調和振動子（2 次のポテンシャル）では、これが厳密に量子の答えを与える。
     無次元化：X = x/x₀,  P = p x₀/ħ,  x₀ = √(ħ/mω)
     運動方程式は単なる回転： X(t) = X₀cosθ + P₀sinθ,  θ = ωt
     コヒーレント状態の Wigner 分布は (X, P) とも σ = 1/√2 の Gauss
     初期中心は (A, 0)、A = √(2⟨n⟩)
   ======================================================================== */

/* 箱–Muller。sin 側も捨てずに使う（捨てると分布がわずかに歪む） */
let _g2 = null;
function gauss(){
  if (_g2 !== null){ const v = _g2; _g2 = null; return v; }
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  v = Math.random();
  const r = Math.sqrt(-2 * Math.log(u));
  _g2 = r * Math.sin(2 * Math.PI * v);
  return r * Math.cos(2 * Math.PI * v);
}

Sim.prototype.seedCloud = function(){
  const N = this.nDots, A = Math.sqrt(2 * this.nbar);
  const S = Math.SQRT1_2;                 // 1/√2（基底状態の位相空間での幅）
  this.dots = new Float64Array(2 * N);
  for (let i = 0; i < N; i++){
    this.dots[2*i]     = A + S * gauss();   // X₀
    this.dots[2*i + 1] =     S * gauss();   // P₀
  }
};

Sim.prototype.drawCloud = function(){
  const c = this.ctx, W = this.W, H = this.H, F = this.phys();
  const nb = this.nbar;
  const A = Math.sqrt(2 * nb);            // 振幅（X 単位）
  const S = Math.SQRT1_2;                 // ぼやけ σ（X 単位）
  const XMAX = Math.max(A + 4 * S, 3.2) * 1.12;
  const th = this.phase;
  const xc = A * Math.cos(th);            // 中心（＝古典解）

  const padL = 38, padR = 14;
  const X0 = padL, X1 = W - padR;
  const px = function(X){ return X0 + (X + XMAX) / (2 * XMAX) * (X1 - X0); };

  const gapY = 12;
  const hA = Math.round((H - gapY) * 0.46);
  const Ay0 = 0, Ay1 = Ay0 + hA;
  const By0 = Ay1 + gapY, By1 = H;

  /* ============ 上：ばねと質点の群れ ============ */
  axes(c, X0, Ay0, X1, Ay1, '', '① 質点を ' + this.nDots + ' 個まいて、それぞれ古典的に転がす');
  const ym = (Ay0 + Ay1) / 2 + 8;

  /* 折り返し点と中心 */
  c.setLineDash([3,3]); c.strokeStyle = 'rgba(198,40,40,.35)'; c.lineWidth = 1;
  [-A, A].forEach(function(t){
    c.beginPath(); c.moveTo(px(t), Ay0 + 16); c.lineTo(px(t), Ay1 - 4); c.stroke();
  });
  c.setLineDash([]);

  /* 壁 */
  const wallX = X0 + 6;
  c.strokeStyle = '#5c6670'; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(wallX, ym - 24); c.lineTo(wallX, ym + 24); c.stroke();
  c.lineWidth = 1;
  for (let i = -24; i < 24; i += 6){
    c.beginPath(); c.moveTo(wallX, ym + i); c.lineTo(wallX - 6, ym + i + 6); c.stroke();
  }
  /* ばねは「群れの中心」に繋ぐ */
  c.strokeStyle = 'rgba(92,102,112,.55)'; c.lineWidth = 1.4;
  drawSpring(c, wallX, px(xc) - 4, ym, 12, 6);

  /* 質点の群れ。縦は見やすさのためのばらつき（物理量ではない） */
  const N = this.nDots;
  c.fillStyle = 'rgba(15,76,129,.55)';
  for (let i = 0; i < N; i++){
    const X = this.dots[2*i] * Math.cos(th) + this.dots[2*i+1] * Math.sin(th);
    const yy = ym + ((i * 2654435761 % 1000) / 1000 - 0.5) * 34;
    c.beginPath(); c.arc(px(X), yy, 1.9, 0, 6.2832); c.fill();
  }
  /* 中心（古典解） */
  c.strokeStyle = '#c62828'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(px(xc), ym - 26); c.lineTo(px(xc), ym + 26); c.stroke();
  c.fillStyle = '#c62828'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  c.fillText('群れの中心＝古典解', px(xc), Ay0 + 13);

  /* ============ 下：分布とヒストグラム ============ */
  axes(c, X0, By0, X1, By1, '位置 x →', '② その瞬間の |ψ|² と、質点のヒストグラム');
  const NB = 61;
  const bins = new Float64Array(NB);
  for (let i = 0; i < N; i++){
    const X = this.dots[2*i] * Math.cos(th) + this.dots[2*i+1] * Math.sin(th);
    const k = Math.floor((X + XMAX) / (2 * XMAX) * NB);
    if (k >= 0 && k < NB) bins[k] += 1;
  }
  const bw = 2 * XMAX / NB;
  const peak = 1 / (Math.sqrt(2 * Math.PI) * S);          // Gauss の頂点
  const qy = function(v){ return By1 - 6 - Math.min(v / (peak * 1.25), 1) * (By1 - By0 - 20); };

  /* ヒストグラム（確率密度に直す） */
  c.fillStyle = 'rgba(15,76,129,.22)';
  for (let k = 0; k < NB; k++){
    if (!bins[k]) continue;
    const dens = bins[k] / (N * bw);
    const x0 = px(-XMAX + bw * k), x1 = px(-XMAX + bw * (k + 1));
    c.fillRect(x0, qy(dens), x1 - x0, By1 - 6 - qy(dens));
  }

  /* 厳密な |ψ(x,t)|²（幅は基底状態と同じ、中心だけ動く） */
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.2;
  c.beginPath();
  for (let i = 0; i <= 400; i++){
    const X = -XMAX + 2 * XMAX * i / 400;
    const d = Math.exp(-(X - xc) * (X - xc) / (2 * S * S)) / (Math.sqrt(2 * Math.PI) * S);
    const Y = qy(d);
    if (i === 0) c.moveTo(px(X), Y); else c.lineTo(px(X), Y);
  }
  c.stroke();

  /* 基底状態の幅を目盛として描く */
  c.strokeStyle = 'rgba(249,168,37,.9)'; c.lineWidth = 2;
  c.beginPath();
  c.moveTo(px(xc - S), By0 + 16); c.lineTo(px(xc + S), By0 + 16);
  c.moveTo(px(xc - S), By0 + 12); c.lineTo(px(xc - S), By0 + 20);
  c.moveTo(px(xc + S), By0 + 12); c.lineTo(px(xc + S), By0 + 20);
  c.stroke();
  c.fillStyle = '#8a5a00'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  c.fillText('±σ（ぼやけ幅。⟨n⟩ を変えても縮まない）', px(xc), By0 + 30);
};

/* ========================================================================
   4b. 描画（タブ④⑤）
   ======================================================================== */
/* 枠と軸の名前。横軸の名前は軸の真下に中央そろえ、
   縦軸の名前は 90 度回して軸の左に置く（グラフの基本の作法）。 */
function frameL(c, x0, y0, x1, y1, xlab, ylab){
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '11px ' + CFONT;
  if (xlab){
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(xlab, (x0 + x1) / 2, y1 + 17);
  }
  if (ylab){
    const off = Math.min(42, Math.max(13, x0 - 9));
    c.save(); c.translate(x0 - off, (y0 + y1) / 2); c.rotate(-Math.PI / 2);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(ylab, 0, 0); c.restore();
  }
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
}
/* ψₙ の節（ゼロ点）を拾う。符号が変わるところを二分法で詰める */
function nodesOf(n){
  const out = [];
  if (n === 0) return out;
  const L = Math.sqrt(2 * n + 1) + 1.5, NS = 400;
  let prev = psiT(n, -L);
  for (let i = 1; i <= NS; i++){
    const X = -L + 2 * L * i / NS, v = psiT(n, X);
    if (prev === 0 || (prev < 0) !== (v < 0)){
      let a = -L + 2 * L * (i - 1) / NS, b = X;
      for (let j = 0; j < 40; j++){
        const m = (a + b) / 2;
        if ((psiT(n, a) < 0) !== (psiT(n, m) < 0)) b = m; else a = m;
      }
      out.push((a + b) / 2);
    }
    prev = v;
  }
  return out;
}

/* ---- タブ④：梯子と波動関数 ---- */
Sim.prototype.drawSq = function(){
  const c = this.ctx, W = this.W, H = this.H;
  const n = this.nq, pn = this.prevNq, t = this.tOp;
  const yT = 16, yB = H - 40;
  /* 右の絵の縦軸の名前を左の絵の枠にぶつけないよう、間はやや広く取る */
  const gap = W < 620 ? 42 : 58;
  const lw = Math.min(250, Math.max(126, (W - 120) * 0.34));
  const A0 = 44, A1 = A0 + lw;
  const B0 = A1 + gap, B1 = W - 14;

  /* ============ 左：エネルギーの梯子 ============ */
  const NM = Math.min(NQMAX, Math.max(6, n + 2, (pn === null ? 0 : pn) + 2));
  frameL(c, A0, yT, A1, yB, '', 'エネルギー E ／ ℏω');
  const eTop = NM + 1.3;
  const py = function(E){ return yB - 8 - (E / eTop) * (yB - yT - 16); };

  for (let k = 0; k <= NM; k++){
    const y = py(k + 0.5), cur = (k === n);
    c.strokeStyle = cur ? '#1565c0' : 'rgba(31,35,40,.16)';
    c.lineWidth = cur ? 2.4 : 1;
    c.beginPath(); c.moveTo(A0 + 26, y); c.lineTo(A1 - 10, y); c.stroke();
    c.fillStyle = cur ? '#1565c0' : '#5c6670';
    c.font = (cur ? 'bold ' : '') + '9px ' + CFONT;
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText('n=' + k, A0 + 22, y);
  }
  /* 古典の底。いちばん下の段はここから ℏω/2 だけ浮いている */
  c.setLineDash([3,3]); c.strokeStyle = 'rgba(198,40,40,.5)'; c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(A0 + 1, py(0)); c.lineTo(A1 - 1, py(0)); c.stroke();
  c.setLineDash([]);
  c.fillStyle = '#c62828'; c.font = '9px ' + CFONT;
  c.textAlign = 'left'; c.textBaseline = 'bottom';
  c.fillText('E = 0（古典の底）', A0 + 27, py(0) - 3);

  /* 量子を丸で表す。6 個ずつ積んで、いま乗っている段の上に置く */
  c.textBaseline = 'middle';
  const per = 6, dg = 11;
  for (let i = 0; i < n; i++){
    const row = Math.floor(i / per), col = i % per;
    const inRow = Math.min(per, n - row * per);
    const x = (A0 + A1) / 2 - (inRow - 1) * dg / 2 + col * dg;
    const y = py(n + 0.5) - 9 - row * 10;
    c.fillStyle = '#f9a825'; c.strokeStyle = 'rgba(138,90,0,.55)'; c.lineWidth = 1;
    c.beginPath(); c.arc(x, y, 4.2, 0, 6.2832); c.fill(); c.stroke();
  }
  if (n === 0){
    c.fillStyle = '#8a5a00'; c.font = 'bold 9px ' + CFONT; c.textAlign = 'center';
    c.fillText('真空 |0⟩（量子 0 個）', (A0 + A1) / 2, py(0.5) - 12);
  }

  /* 直前の操作を矢印で示す */
  if (pn !== null && pn !== n && this.lastOp !== 'zero'){
    const up = this.lastOp === 'up';
    const ya = py(pn + 0.5), yb = py(n + 0.5), ycur = ya + (yb - ya) * t;
    const ax = A1 - 20, col = up ? '#1565c0' : '#00695c';
    c.globalAlpha = 0.4 + 0.6 * t;
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 2;
    c.beginPath(); c.moveTo(ax, ya); c.lineTo(ax, ycur); c.stroke();
    const dir = up ? -1 : 1;
    c.beginPath();
    c.moveTo(ax, ycur); c.lineTo(ax - 4.5, ycur - dir * 8); c.lineTo(ax + 4.5, ycur - dir * 8);
    c.closePath(); c.fill();
    c.font = 'bold 10px ' + CFONT; c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(up ? 'â†' : 'â', ax - 6, (ya + yb) / 2 - 7);
    c.font = '9px ' + CFONT;
    c.fillText((up ? '+' : '−') + 'ℏω', ax - 6, (ya + yb) / 2 + 6);
    c.globalAlpha = 1;
  }

  /* ============ 右：波動関数 ============ */
  frameL(c, B0, yT, B1, yB, 'ξ = √(mω/ℏ) x', '波動関数 ψ');
  const px = function(X){ return B0 + (X + XSQ) / (2 * XSQ) * (B1 - B0); };
  const wy = function(v){ return (yT + yB) / 2 - v / PSIMAX * (yB - yT - 10) / 2; };
  c.strokeStyle = 'rgba(31,35,40,.30)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(B0, wy(0)); c.lineTo(B1, wy(0)); c.stroke();
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let s = -6; s <= 6; s += 2){
    c.strokeStyle = 'rgba(31,35,40,.22)';
    c.beginPath(); c.moveTo(px(s), yB); c.lineTo(px(s), yB + 4); c.stroke();
    c.fillText(String(s), px(s), yB + 5);
  }

  const curve = function(m, style, width, dash, alpha){
    c.globalAlpha = alpha; c.strokeStyle = style; c.lineWidth = width;
    c.setLineDash(dash || []);
    c.beginPath();
    for (let i = 0; i <= 700; i++){
      const X = -XSQ + 2 * XSQ * i / 700, Y = wy(psiT(m, X));
      if (i === 0) c.moveTo(px(X), Y); else c.lineTo(px(X), Y);
    }
    c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
  };
  if (pn !== null && pn !== n){
    const al = this.showPrev ? 0.9 : (1 - t);
    if (al > 0.02) curve(pn, 'rgba(31,35,40,.45)', 1.6, [5,4], al);
  }
  curve(n, '#0f4c81', 2.6, null, 0.3 + 0.7 * t);

  /* 節（ゼロ点）に印をつける。節の数がそのまま量子の数 */
  const nd = nodesOf(n);
  c.fillStyle = '#c62828';
  nd.forEach(function(X){
    c.beginPath(); c.arc(px(X), wy(0), 2.6, 0, 6.2832); c.fill();
  });
  c.font = '10px ' + CFONT; c.textAlign = 'right'; c.textBaseline = 'top';
  c.fillStyle = '#0f4c81';
  c.fillText('ψ' + subs(n) + '（節が ' + nd.length + ' 個 ＝ 量子 ' + n + ' 個）', B1 - 6, yT + 5);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
};

/* ---- タブ⑤：ボース／フェルミの詰まり方 ---- */
Sim.prototype.drawFbo = function(){
  const c = this.ctx, W = this.W, H = this.H, self = this;
  const padL = 46, padR = 14, gapX = 26;
  const colW = (W - padR - padL * 2 - gapX) / 2;
  const L0 = padL, L1 = L0 + colW;
  const R0 = L1 + gapX + padL, R1 = W - padR;
  const yT = 30, yB = H - 38;
  const gapY = 42;
  const hTop = Math.round((yB - yT - gapY) * 0.55);
  const T0 = yT, T1 = T0 + hTop, D0 = T1 + gapY, D1 = yB;

  /* 見出し。狭いときは説明を落として名前だけにする（隣とぶつかるので） */
  const wide = colW > 210;
  c.font = 'bold 11px ' + CFONT; c.textAlign = 'center'; c.textBaseline = 'bottom';
  c.fillStyle = '#1565c0';
  c.fillText(wide ? 'ボース粒子 ― いくらでも重なれる' : 'ボース粒子', (L0 + L1) / 2, T0 - 9);
  c.fillStyle = '#7b1fa2';
  c.fillText(wide ? 'フェルミ粒子 ― 1 準位に 1 個まで' : 'フェルミ粒子', (R0 + R1) / 2, T0 - 9);

  const rowH = (T1 - T0 - 10) / NLV;
  const ly = function(k){ return T1 - 6 - rowH * (k + 0.5); };
  this.geo = { T0: T0, T1: T1, rowH: rowH, base: T1 - 6 };

  const ladder = function(x0, x1, occ, fermi){
    frameL(c, x0, T0, x1, T1, '', '準位 k');
    c.fillStyle = 'rgba(249,168,37,.18)';
    c.fillRect(x0 + 1, ly(self.kSel) - rowH / 2, x1 - x0 - 2, rowH);
    const top = topLevel(occ);
    for (let k = 0; k < NLV; k++){
      const y = ly(k), has = occ[k] > 0;
      c.strokeStyle = has ? (fermi ? '#7b1fa2' : '#1565c0') : 'rgba(31,35,40,.18)';
      c.lineWidth = has ? 2.2 : 1;
      c.beginPath(); c.moveTo(x0 + 26, y); c.lineTo(x1 - 8, y); c.stroke();
      c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT;
      c.textAlign = 'right'; c.textBaseline = 'middle';
      c.fillText('k=' + k, x0 + 22, y);
      if (has){
        const cnt = occ[k], shown = Math.min(cnt, 7);
        for (let i = 0; i < shown; i++){
          const xx = (x0 + x1) / 2 - (shown - 1) * 5 + i * 10;
          c.fillStyle = fermi ? '#7b1fa2' : '#1565c0';
          c.beginPath(); c.arc(xx, y - 7, 4, 0, 6.2832); c.fill();
        }
        if (cnt > 7){
          c.fillStyle = '#15202b'; c.font = 'bold 9px ' + CFONT; c.textAlign = 'left';
          c.fillText('×' + cnt, (x0 + x1) / 2 + shown * 5 + 4, y - 7);
        }
      } else if (fermi && k < top){
        c.strokeStyle = '#c62828'; c.lineWidth = 1.4; c.setLineDash([2,2]);
        c.beginPath(); c.arc((x0 + x1) / 2, y - 7, 4, 0, 6.2832); c.stroke();
        c.setLineDash([]);
        c.fillStyle = '#c62828'; c.font = '9px ' + CFONT; c.textAlign = 'left';
        c.fillText('正孔', (x0 + x1) / 2 + 8, y - 7);
      }
    }
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  };
  ladder(L0, L1, this.occB, false);
  ladder(R0, R1, this.occF, true);

  /* 密度は 2 枚で縦の目盛りをそろえる。そろえないと差が見えない */
  let vmax = 0.05;
  for (let i = 0; i <= 240; i++){
    const X = -XSQ + 2 * XSQ * i / 240;
    vmax = Math.max(vmax, density(this.occB, X), density(this.occF, X));
  }
  vmax *= 1.18;

  const dens = function(x0, x1, occ, line, fill){
    frameL(c, x0, D0, x1, D1, 'ξ = √(mω/ℏ) x', '粒子の分布 n(x)');
    const px = function(X){ return x0 + (X + XSQ) / (2 * XSQ) * (x1 - x0); };
    const dy = function(v){ return D1 - 4 - (v / vmax) * (D1 - D0 - 12); };
    c.beginPath();
    for (let i = 0; i <= 300; i++){
      const X = -XSQ + 2 * XSQ * i / 300, Y = dy(density(occ, X));
      if (i === 0) c.moveTo(px(X), Y); else c.lineTo(px(X), Y);
    }
    c.lineTo(px(XSQ), dy(0)); c.lineTo(px(-XSQ), dy(0)); c.closePath();
    c.fillStyle = fill; c.fill();
    c.strokeStyle = line; c.lineWidth = 2; c.stroke();
    /* 横軸の目盛り */
    c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT;
    c.textAlign = 'center'; c.textBaseline = 'top';
    for (let t = -6; t <= 6; t += 3){
      c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(px(t), D1); c.lineTo(px(t), D1 + 4); c.stroke();
      c.fillText(String(t), px(t), D1 + 5);
    }
    /* 広がり ±√⟨ξ²⟩。⟨ξ²⟩ は 1 粒子あたり E/N になる */
    const N = totalN(occ);
    if (N > 0){
      const rms = Math.sqrt(totalE(occ) / N);
      c.strokeStyle = '#f9a825'; c.lineWidth = 1.6;
      const yy = D0 + 11;
      c.beginPath();
      c.moveTo(px(-rms), yy); c.lineTo(px(rms), yy);
      c.moveTo(px(-rms), yy - 4); c.lineTo(px(-rms), yy + 4);
      c.moveTo(px(rms), yy - 4); c.lineTo(px(rms), yy + 4);
      c.stroke();
      c.fillStyle = '#8a5a00'; c.font = '9px ' + CFONT;
      c.textAlign = 'center'; c.textBaseline = 'top';
      c.fillText('±' + rms.toFixed(2), (px(-rms) + px(rms)) / 2, yy + 5);
    }
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  };
  dens(L0, L1, this.occB, '#1565c0', 'rgba(21,101,192,.16)');
  dens(R0, R1, this.occF, '#7b1fa2', 'rgba(123,31,162,.16)');
};

/* ========================================================================
   5. 読み取り値
   ======================================================================== */
Sim.prototype.updateReadout = function(){
  const F = this.phys(), n = this.n;
  const R = [];
  if (this.key === 'wave'){
    R.push(['量子数 n', String(n)]);
    R.push(['ħω', fmt(F.hw / QE, 4) + ' eV']);
    R.push(['ばね定数 k = mω²', fmt(F.k, 4) + ' N/m']);
    R.push(['Eₙ = (n+½)ħω', fmt(F.E / QE, 4) + ' eV']);
    R.push(['零点エネルギー ħω/2', fmt(F.hw / 2 / QE, 4) + ' eV']);
    R.push(['古典の振幅 A', flen(F.amp, 4)]);
    R.push(['位置のゆらぎ σx', flen(F.sigX, 4)]);
    R.push(['運動量のゆらぎ σp', fmt(F.sigP, 4) + ' kg m/s']);
    R.push(['σx σp / ħ', fmt(n + 0.5, 4) + (n === 0 ? '（＝1/2：下限ちょうど）' : '')]);
    R.push(['古典の振動周期', fmt(F.period, 4) + ' s']);
    if (F.p.bond) R.push(['σx ÷ 結合長', (F.sigX / F.p.bond * 100).toFixed(2) + ' %']);
    R.push(['ħω/k_B（温度に直すと）', fmt(F.hw / KB, 4) + ' K']);
  } else if (this.key === 'cloud'){
    const S = Math.sqrt(HBAR / (2 * F.m * F.w));      // ぼやけ幅 σ（＝基底状態の幅）
    const A = Math.sqrt(2 * this.nbar) * F.x0;        // 振幅
    R.push(['平均量子数 ⟨n⟩', fmt(this.nbar, 4)]);
    R.push(['エネルギー ⟨E⟩', fmt((this.nbar + 0.5) * F.hw / QE, 4) + ' eV']);
    R.push(['振幅 A', flen(A, 4)]);
    R.push(['ぼやけ幅 σ', flen(S, 4)]);
    R.push(['σ ÷ A', this.nbar > 0 ? fmt(S / A, 4) : '—（振幅 0）']);
    R.push(['まいた質点の数', String(this.nDots)]);
    R.push(['見え方', this.nbar === 0 ? '基底状態：揺れているが動かない'
                    : (S / A < 0.05 ? '古典的（ぼやけが振幅の 5 % 未満）'
                                    : '量子的（ぼやけが無視できない）')]);
    R.push(['ħω/k_B', fmt(F.hw / KB, 4) + ' K']);
  } else if (this.key === 'sq'){
    const n2 = this.nq;
    const co = this.lastOp === 'up' ? ladderCoef(this.prevNq, true)
             : this.lastOp === 'dn' ? ladderCoef(this.prevNq, false) : null;
    R.push(['量子の数 n（N̂ = â†â の固有値）', String(n2)]);
    R.push(['この系での量子の呼び名', quantumName(F.p)]);
    R.push(['Eₙ = (n+½)ħω', fmt((n2 + 0.5) * F.hw / QE, 4) + ' eV']);
    R.push(['1 個ぶんのエネルギー ħω', fmt(F.hw / QE, 4) + ' eV']);
    R.push(['零点エネルギー ħω/2', fmt(F.hw / 2 / QE, 4) + ' eV']);
    R.push(['直前の操作', this.lastOp === 'up' ? 'â†（1 個つくった）'
                        : this.lastOp === 'dn' ? 'â（1 個消した）'
                        : this.lastOp === 'zero' ? 'â を当てたが 0 になった' : '—']);
    R.push(['そのときの係数', co === null ? '—' : fmt(co, 6)]);
    R.push(['波動関数の節の数', String(n2)]);
    R.push(['真空からの作り方', n2 === 0 ? '|0⟩ そのもの'
                             : 'ψ₀ に â† を ' + n2 + ' 回']);
    R.push(['位置のゆらぎ σx', flen(F.x0 * Math.sqrt(n2 + 0.5), 4)]);
    R.push(['ħω/k_B（温度に直すと）', fmt(F.hw / KB, 4) + ' K']);
  } else if (this.key === 'fbo'){
    const NB2 = totalN(this.occB), NF2 = totalN(this.occF);
    const EB = totalE(this.occB), EF = totalE(this.occF);
    const rB = NB2 > 0 ? Math.sqrt(EB / NB2) : 0;
    const rF = NF2 > 0 ? Math.sqrt(EF / NF2) : 0;
    R.push(['粒子数 N（ボース ／ フェルミ）', NB2 + ' ／ ' + NF2]);
    R.push(['全エネルギー ボース', fmt(EB, 4) + ' ħω']);
    R.push(['全エネルギー フェルミ', fmt(EF, 4) + ' ħω']);
    R.push(['その差', fmt(EF - EB, 4) + ' ħω = ' + fmt((EF - EB) * F.hw / QE, 4) + ' eV']);
    R.push(['広がり √⟨ξ²⟩ ボース', NB2 ? rB.toFixed(3) : '—']);
    R.push(['広がり √⟨ξ²⟩ フェルミ', NF2 ? rF.toFixed(3) : '—']);
    R.push(['広がりの比 フェルミ ÷ ボース',
            (NB2 && NF2 && rB > 0) ? (rF / rB).toFixed(3) + ' 倍' : '—']);
    R.push(['いちばん上の占有準位', (topLevel(this.occB) < 0 ? '—' : 'k = ' + topLevel(this.occB))
            + ' ／ ' + (topLevel(this.occF) < 0 ? '—' : 'k = ' + topLevel(this.occF))]);
    R.push(['正孔の数（フェルミ）', String(holesOf(this.occF).length)]);
    R.push(['選んでいる準位', 'k = ' + this.kSel + '（ε = ' + fmt(this.kSel + 0.5, 3) + ' ħω）']);
    R.push(['ħω', fmt(F.hw / QE, 4) + ' eV']);
  } else {
    const x = F.hw / (KB * this.T);
    const nb = meanN(x), E = (nb + 0.5) * F.hw;
    const P0 = x > 700 ? 1 : 1 - Math.exp(-x);
    R.push(['温度 T', fmt(this.T, 4) + ' K']);
    R.push(['ħω/k_B T', fmt(x, 4)]);
    R.push(['基底状態にいる確率 P₀', (P0 * 100).toFixed(P0 > 0.999 ? 4 : 2) + ' %']);
    R.push(['平均量子数 ⟨n⟩', fmt(nb, 4)]);
    R.push(['⟨E⟩', fmt(E / QE, 4) + ' eV']);
    R.push(['⟨E⟩ ÷ (ħω/2)', fmt(E / (F.hw / 2), 5)]);
    R.push(['古典の予想 k_B T', fmt(KB * this.T / QE, 4) + ' eV']);
    R.push(['エントロピー S/k_B', fmt(entropyK(x), 4)]);
    R.push(['ħω/k_B', fmt(F.hw / KB, 4) + ' K']);
    R.push(['ばね定数 k = mω²', fmt(F.k, 4) + ' N/m']);
  }
  this.readout.innerHTML = R.map(function(r){
    return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
  if (this.nlab) this.nlab.innerHTML = 'n = ' + n;
  if (this.tlab) this.tlab.innerHTML = 'T = ' + fmt(this.T, 4) + ' K';
  if (this.nlab2) this.nlab2.innerHTML = '⟨n⟩ = ' + fmt(this.nbar, 3);
  if (this.dlab) this.dlab.innerHTML = '質点の数 ' + this.nDots;
  if (this.nlab3) this.nlab3.innerHTML = 'n = ' + this.nq;
  if (this.klab) this.klab.innerHTML = 'k = ' + this.kSel;
  if (this.msgEl){
    this.msgEl.className = 'msg' + (this.msgCls ? ' ' + this.msgCls : '');
    this.msgEl.innerHTML = this.msg ||
      '右の <b>â†</b> と <b>â</b> のボタンで、量子を 1 個ずつ出し入れしてみてください。';
  }
  if (this.msgElB){
    this.msgElB.innerHTML = '<span class="who">ボース粒子</span>' + this.msgB;
    this.msgElF.innerHTML = '<span class="who">フェルミ粒子</span>' + this.msgF;
  }
};

Sim.prototype.recompute = function(){
  this.resize();
  this.draw();
  this.updateReadout();
  kick();
};

/* ========================================================================
   6. アニメーション
   ======================================================================== */
let rafId = null, last = 0;
const sims = {};
function loop(now){
  /* dt には下限 0 が要る。rAF に渡ってくる時刻が last より前に戻ることがあり
     （kick() の performance.now() とフレーム開始時刻のずれ、スリープからの復帰など）、
     dt が負になると粒子が逆走して端で clamp され、縦一列に積み上がってしまう */
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  let busy = false;
  Object.keys(sims).forEach(function(k){
    const s = sims[k];
    if (s.root.hidden) return;
    /* タブ④は、演算子を当てた瞬間だけ短く動く */
    if (s.key === 'sq'){
      if (s.tOp < 1){ s.tOp = Math.min(1, s.tOp + dt * 2.6); s.draw(); busy = true; }
      return;
    }
    if ((s.key !== 'wave' && s.key !== 'cloud') || !s.playing) return;
    s.phase += dt * 1.15 * s.speed;             // 見やすい速さ（物理の ω ではない）
    if (s.phase > 1e6) s.phase = 0;
    s.draw();
    busy = true;
  });
  rafId = busy ? requestAnimationFrame(loop) : null;
}
function kick(){
  if (rafId === null){ last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ========================================================================
   7. 立ち上げ
   ======================================================================== */
let only = null;
const mm = /[?&]only=(wave|zero|cloud|sq|fbo)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');   /* 1 枚だけ ⇒ タブを隠す */

['wave', 'zero', 'cloud', 'sq', 'fbo'].forEach(function(key){
  const p = app.querySelector('[data-panel="' + key + '"]');
  if (!p) return;
  if (only && only !== key){ p.parentNode.removeChild(p); return; }
  sims[key] = new Sim(key, p);
});

/* iframe に埋め込まれたとき、親ページへ必要な高さを知らせる。
   selectTab から呼ぶので、タブより前に置いておく（let の巻き上げ対策）。 */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let active = only || 'wave';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].resize(); sims[name].draw(); sims[name].updateReadout();
  kick();
  postHeight();   /* タブごとに必要な高さが違う。埋め込み先の枠を合わせ直す */
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].resize(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].recompute(); });
});

window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

kick();

})();
</script>
