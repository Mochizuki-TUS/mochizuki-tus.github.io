<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planck の公式 ― 温度と光の色</title>
<style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります．
   スタイルはすべて #qsim 配下にスコープしてあります．
   （直貼りするときは，下の html,body ブロックだけ削除してください）
   ========================================================================== */
html, body { margin:0; background:#fafafa; }

#qsim{
  --bg:#fafafa;
  --panel:#ffffff;
  --panel-soft:#f4f6f9;
  --fg:#1f2328;
  --sub:#5c6670;
  --line:rgba(31,35,40,.12);
  --accent:#0f4c81;
  --accent-strong:#0a355a;
  --planck:#c62828;
  --mark:#f9a825;
  --warn:#8a5a00;
  --warnbg:#fdf5e3;
  --shadow:0 14px 32px rgba(20,34,51,.08);
  --radius-md:14px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color:var(--fg); font-family:var(--font); line-height:1.7;
  max-width:1120px; margin:0 auto; padding:16px 18px 22px;
  -webkit-text-size-adjust:100%;
}
#qsim *{box-sizing:border-box}
#qsim h1{font-size:1.34rem; line-height:1.3; margin:0 0 4px; color:#15202b; letter-spacing:.01em}
#qsim p{margin:.3em 0}
#qsim .lead{color:var(--sub); font-size:.86rem; margin:0}

#qsim .panel{margin-top:14px}
#qsim.is-embed{padding-top:6px}
#qsim.is-embed > h1,
#qsim.is-embed > .lead{display:none}

#qsim .layout{
  display:grid; grid-template-columns:minmax(0,3fr) minmax(238px,1fr);
  gap:16px; align-items:start;
}
@media (max-width:760px){ #qsim .layout{grid-template-columns:1fr} }

#qsim .controls{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--shadow); padding:13px 14px;
}
#qsim .ctlhead{
  font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--sub); margin:0 0 8px;
}
#qsim .sep{height:1px; background:var(--line); margin:13px 0 11px; border:0}
#qsim .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px 12px}
#qsim .fld{display:flex; flex-direction:column; gap:3px; font-size:.78rem; color:var(--sub)}
#qsim .fld b{font-weight:700; color:var(--fg); font-size:.82rem}
#qsim .fld .hint{font-size:.71rem; color:var(--sub); line-height:1.45}
#qsim .inp{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff}
#qsim .inp input{
  font:inherit; font-size:.88rem; width:100%; min-width:0; border:0; outline:0;
  padding:6px 8px; background:transparent; color:var(--fg);
}
#qsim .inp .unit{
  font-size:.8rem; color:var(--sub); padding:6px 8px; border-left:1px solid var(--line);
  background:var(--panel-soft); white-space:nowrap;
}
#qsim .inp:focus-within{border-color:var(--accent); box-shadow:0 0 0 2px rgba(15,76,129,.14)}
#qsim select.wide{
  font:inherit; font-size:.84rem; width:100%; padding:6px 8px; border-radius:9px;
  border:1px solid var(--line); background:#fff; color:var(--fg); cursor:pointer;
}
#qsim .ctlrow{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  font-size:.76rem; color:var(--sub); margin-top:9px;
}
#qsim .ctlrow input[type=range]{flex:1 1 100%; accent-color:var(--accent)}
#qsim .chk{display:flex; align-items:flex-start; gap:6px; font-size:.75rem;
  color:var(--sub); cursor:pointer; margin-top:9px; line-height:1.45}
#qsim .chk input{accent-color:var(--accent); cursor:pointer; margin-top:3px}

#qsim .stage{
  border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;
  background:var(--panel); box-shadow:var(--shadow);
}
#qsim canvas{display:block; width:100%; height:auto}
#qsim .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.75rem;
  color:var(--sub); margin:8px 2px 0}
#qsim .legend i{display:inline-block; width:15px; height:3px; border-radius:2px;
  vertical-align:middle; margin-right:5px}

#qsim .readout{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
  gap:0 18px; margin-top:10px; font-size:.76rem;
}
#qsim .readout div{display:flex; justify-content:space-between; gap:10px;
  border-bottom:1px dotted var(--line); padding:3px 0}
#qsim .readout span:first-child{color:var(--sub)}
#qsim .readout span:last-child{font-variant-numeric:tabular-nums; font-weight:700}
#qsim sup{font-size:.72em}

#qsim .eq{
  text-align:center; padding:11px 8px; margin:10px 0 0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  overflow-x:auto;
}
/* 数式はブラウザ標準の MathML．数式フォントを明示しないと根号や括弧が
   中身の高さに伸びない（macOS は STIX Two Math，Windows は Cambria Math が標準） */
#qsim math{
  font-size:1.05em;
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  line-height:normal;
}
#qsim .eq math[display="block"]{font-size:1.12rem; margin:0 auto}
#qsim .eq .cmt{color:var(--sub); font-size:.82rem; display:block; margin-top:4px}
/* 本文中の変数．text-transform:math-auto で 1 文字を数式イタリック
   （Unicode の Mathematical Italic）へ写像すると，MathML の <mi> と
   まったく同じ字形になる．未対応ブラウザ用に素の italic を残す． */
#qsim i{
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  font-size:1.05em; font-style:italic;
}
@supports (text-transform: math-auto){
  #qsim i{font-style:normal; text-transform:math-auto}
}

#qsim .explain{
  margin-top:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-md); padding:0 14px;
}
#qsim .explain > summary{
  cursor:pointer; list-style:none; padding:10px 0; font-size:.82rem; font-weight:700;
  color:var(--accent-strong);
}
#qsim .explain > summary::-webkit-details-marker{display:none}
#qsim .explain > summary::before{content:"▶ "; font-size:.72em; color:var(--sub)}
#qsim .explain[open] > summary::before{content:"▼ "}
#qsim .explain[open] > summary{border-bottom:1px solid var(--line)}
#qsim .explain .body{padding:4px 0 12px}
#qsim .note{
  font-size:.78rem; color:var(--sub); background:var(--panel-soft);
  border-left:3px solid var(--line); border-radius:0 8px 8px 0;
  padding:8px 12px; margin:9px 0;
}
#qsim .note.warn{color:var(--warn); background:var(--warnbg); border-left-color:currentColor}
#qsim .note b{color:inherit}
#qsim .foot{margin-top:12px; font-size:.73rem; color:var(--sub); text-align:center}
</style>
</head>
<body>
<div id="qsim">
  <h1>Planck の公式 ― 温度と光の色</h1>
  <p class="lead">
    温度 <i>T</i> を入れると，その黒体が出す光のスペクトルと，目に映る色が分かります．
    鉄を熱すると赤 → 橙 → 黄 → 白と変わっていくのも，恒星の色から表面温度が読めるのも，この式のおかげです．
  </p>

  <section class="panel"></section>

  <p class="foot">
    色は CIE 1931 等色関数でスペクトルを積分し，sRGB に変換して表示しています．
  </p>
</div>

<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数
   ======================================================================== */
const H_P   = 6.62607015e-34;      // Planck 定数 [J s]
const C_L   = 2.99792458e8;        // 光速 [m/s]
const K_B   = 1.380649e-23;        // Boltzmann 定数 [J/K]
const SIGMA = 5.670374419e-8;      // Stefan–Boltzmann 定数 [W/(m² K⁴)]
const B_WIEN  = 2.897771955e-3;    // Wien の変位則 λ_max·T [m K]
const NU_WIEN = 5.878925757e10;    // ν_max/T [Hz/K]
const T_SUN = 5772;                // 太陽表面温度（明るさの基準）
/* 目に見えるかどうかの下限．暗順応した目の検出限界（約 10⁻⁶ cd/m²）を
   太陽表面（約 2×10⁹ cd/m²）で割った値のあたり．これより暗い黒体は，
   どんなに暗い部屋でも光っては見えない． */
const VIS_MIN = 1e-15;
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

/* ========================================================================
   1. 表示ユーティリティ
   ======================================================================== */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³',
             '4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function supStr(n){ return String(n).split('').map(function(c){ return SUP[c] || c; }).join(''); }

function fmtNum(v, n){
  n = n || 4;
  if (!isFinite(v)) return '&mdash;';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10<sup>' + Number(p[1]) + '</sup>';
  }
  return String(Number(v.toPrecision(n)));
}
function fmtNumPlain(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10' + supStr(Number(p[1]));
  }
  return String(Number(v.toPrecision(n)));
}
const LEN_TBL = [[1,'m'],[1e-3,'mm'],[1e-6,'µm'],[1e-9,'nm'],[1e-12,'pm']];
function fmtLen(v, n){
  if (!isFinite(v) || v === 0) return '&mdash;';
  const a = Math.abs(v);
  for (let i = 0; i < LEN_TBL.length; i++){
    if (a >= LEN_TBL[i][0]) return String(Number((v / LEN_TBL[i][0]).toPrecision(n || 4))) + ' ' + LEN_TBL[i][1];
  }
  return fmtNum(v, n) + ' m';
}
function fmtLenPlain(v, n){
  if (!isFinite(v) || v === 0) return '—';
  const a = Math.abs(v);
  for (let i = 0; i < LEN_TBL.length; i++){
    if (a >= LEN_TBL[i][0]) return String(Number((v / LEN_TBL[i][0]).toPrecision(n || 3))) + ' ' + LEN_TBL[i][1];
  }
  return fmtNumPlain(v, n) + ' m';
}
function niceStep(raw){
  const e = Math.floor(Math.log10(raw));
  const m = raw / Math.pow(10, e);
  const nm = m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10;
  return nm * Math.pow(10, e);
}
function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/* ========================================================================
   2. Planck の公式（ノート (8) の式）
   ---------------------------------------------------------------------
     U(ν) = (8πh/c³) · ν³/(e^{hν/kT} − 1)        [J s /m³]
     U(λ) = (8πhc/λ⁵) · 1/(e^{hc/λkT} − 1)       [J /m⁴]
   ======================================================================== */
function Unu(nu, T){
  if (!(nu > 0) || !(T > 0)) return 0;
  const x = H_P * nu / (K_B * T);
  if (x > 700) return 0;
  return 8 * Math.PI * H_P / (C_L*C_L*C_L) * nu*nu*nu / Math.expm1(x);
}
function Ulam(lam, T){
  if (!(lam > 0) || !(T > 0)) return 0;
  const x = H_P * C_L / (lam * K_B * T);
  if (x > 700) return 0;
  return 8 * Math.PI * H_P * C_L / Math.pow(lam, 5) / Math.expm1(x);
}

/* ========================================================================
   3. 色の計算（CIE 1931 等色関数 → XYZ → sRGB）
   ---------------------------------------------------------------------
   等色関数は Wyman, Sloan & Shirley (2013) の多ローブ Gauss 近似．
   1000 K 以上の黒体軌跡を文献値と比べて，2000 K 以上では
   色度座標の差が 0.002 以下であることを確認済み．
   ======================================================================== */
function gLobe(x, mu, s1, s2){
  const t = (x - mu) * (x < mu ? 1/s1 : 1/s2);
  return Math.exp(-0.5 * t * t);
}
function xBar(l){ return 1.056*gLobe(l,599.8,37.9,31.0) + 0.362*gLobe(l,442.0,16.0,26.7) - 0.065*gLobe(l,501.1,20.4,26.2); }
function yBar(l){ return 0.821*gLobe(l,568.8,46.9,40.5) + 0.286*gLobe(l,530.9,16.3,31.1); }
function zBar(l){ return 1.217*gLobe(l,437.0,11.8,36.0) + 0.681*gLobe(l,459.0,26.0,13.8); }

/** 黒体の XYZ（相対値）．Y は明るさに比例する */
function blackbodyXYZ(T){
  let X = 0, Y = 0, Z = 0;
  for (let l = 360; l <= 830; l += 2){
    const s = Ulam(l * 1e-9, T);
    if (s === 0) continue;
    X += s * xBar(l); Y += s * yBar(l); Z += s * zBar(l);
  }
  return [X, Y, Z];
}
function gammaEncode(c){
  c = Math.max(0, Math.min(1, c));
  return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1/2.4) - 0.055;
}
/** XYZ → sRGB（色域外は白を足して彩度を落とす）．scale は線形光での明るさ倍率 */
function xyzToRGB(X, Y, Z, scale){
  let r =  3.2406*X - 1.5372*Y - 0.4986*Z;
  let g = -0.9689*X + 1.8758*Y + 0.0415*Z;
  let b =  0.0557*X - 0.2040*Y + 1.0570*Z;
  const mn = Math.min(r, g, b);
  if (mn < 0){ r -= mn; g -= mn; b -= mn; }          // 色域外 → 白を足す
  const mx = Math.max(r, g, b);
  if (!(mx > 0)) return [0, 0, 0];
  const s = (scale === undefined ? 1 : scale) / mx;   // まず max=1 に規格化
  return [gammaEncode(r*s), gammaEncode(g*s), gammaEncode(b*s)];
}
function rgbCss(rgb){
  return 'rgb(' + Math.round(rgb[0]*255) + ',' + Math.round(rgb[1]*255) + ',' + Math.round(rgb[2]*255) + ')';
}
function rgbHex(rgb){
  return '#' + rgb.map(function(v){
    return ('0' + Math.round(v*255).toString(16)).slice(-2);
  }).join('').toUpperCase();
}
/** 温度 → 色（色みだけ）と色度座標・相対輝度 */
const YSUN = blackbodyXYZ(T_SUN)[1];
function colorOf(T){
  const xyz = blackbodyXYZ(T);
  const sum = xyz[0] + xyz[1] + xyz[2];
  if (!(sum > 0)) return { rgb:[0,0,0], x:NaN, y:NaN, rel:0, visible:false };
  const rel = xyz[1] / YSUN;                          // 太陽表面を 1 とした輝度比
  /* 検出限界より暗いときは「色」を出さない．
     この領域は可視域が Wien の裾の裾なので，等色関数の近似誤差だけで
     色度が決まってしまい，数値としても意味を持たない． */
  if (!(rel > VIS_MIN)) return { rgb:[0,0,0], x:NaN, y:NaN, rel:rel, visible:false };
  return {
    rgb: xyzToRGB(xyz[0]/sum, xyz[1]/sum, xyz[2]/sum),
    x: xyz[0]/sum, y: xyz[1]/sum,
    rel: rel, visible:true
  };
}
/** 明るさも反映した色．10¹² 倍の幅を対数で圧縮して表示する．
    下限を 10⁻¹² にしてあるのは，帯の左端 800 K でも輝度比が約 4×10⁻¹² あり，
    10⁻⁸ で切ると 1100 K 以下（本文で例に挙げた 900 K を含む）が
    まとめて真っ黒に潰れて「明るさの違い」が見えなくなるためです． */
function colorWithBrightness(T){
  const c = colorOf(T);
  if (!c.visible) return [0, 0, 0];
  const lv = Math.max(0, Math.min(1, (Math.log10(c.rel) + 12) / 12));
  const xyz = blackbodyXYZ(T);
  const sum = xyz[0] + xyz[1] + xyz[2];
  return xyzToRGB(xyz[0]/sum, xyz[1]/sum, xyz[2]/sum, lv);
}
/** 可視域（380–780 nm）の波長 → だいたいの色（スペクトル帯の描画用） */
function spectrumRGB(l){
  const X = xBar(l), Y = yBar(l), Z = zBar(l);
  const s = X + Y + Z;
  if (!(s > 0)) return [0,0,0];
  return xyzToRGB(X/s, Y/s, Z/s);
}

/* ========================================================================
   4. プリセット
   ======================================================================== */
const PRESETS = [
  { name:'宇宙マイクロ波背景放射（2.725 K）',   T:2.725 },
  { name:'人のからだ（310 K）',                 T:310 },
  { name:'鉄がうっすら赤くなる（約 900 K）',     T:900 },
  { name:'鉄が明るく赤熱する（約 1300 K）',      T:1300 },
  { name:'ろうそくの炎（約 1700 K）',           T:1700 },
  { name:'溶けた鉄（約 1900 K）',               T:1900 },
  { name:'白熱電球のフィラメント（2800 K）',     T:2800 },
  { name:'ベテルギウス（赤色超巨星, 3600 K）',   T:3600 },
  { name:'太陽の表面（5772 K）',                T:5772 },
  { name:'シリウス A（9940 K）',                T:9940 },
  { name:'リゲル（青色超巨星, 12100 K）',        T:12100 },
  { name:'非常に高温の星（30000 K）',           T:30000 }
];

/* ========================================================================
   5. 入力フィールド
   ======================================================================== */
function makeNumField(labelHtml, unitHtml, hintHtml){
  const f = el('label','fld');
  f.appendChild(el('b', null, labelHtml));
  const box = el('span','inp');
  const inp = el('input'); inp.type = 'number'; inp.step = 'any'; inp.min = '0';
  box.appendChild(inp);
  if (unitHtml) box.appendChild(el('span','unit', unitHtml));
  f.appendChild(box);
  if (hintHtml) f.appendChild(el('span','hint', hintHtml));
  f.inp = inp;
  f.get = function(){ return parseFloat(inp.value) || 0; };
  f.set = function(v){ inp.value = String(Number(v.toPrecision(6))); };
  return f;
}

/* ========================================================================
   6. シミュレーター本体
   ======================================================================== */
function Sim(root){
  const self = this;
  this.root = root;
  this.dpr = Math.min(window.devicePixelRatio || 1, 2);

  const layout  = el('div','layout');
  const colMain = el('div','col-main');
  const colSide = el('aside','col-side');
  layout.appendChild(colMain); layout.appendChild(colSide);
  root.appendChild(layout);

  const stage = el('div','stage');
  const cv = el('canvas');
  stage.appendChild(cv); colMain.appendChild(stage);

  colMain.appendChild(el('div','legend',
    '<span><i style="background:var(--planck)"></i>Planck の公式 U(ν) または U(λ)</span>' +
    '<span><i style="background:var(--mark)"></i>ピーク（Wien の変位則）</span>' +
    '<span>下の帯：その温度の光の色</span>'));

  const readout = el('div','readout');
  colMain.appendChild(readout);

  /* 数式は MathML．U(ν) の括弧は中身が 1 文字なので stretchy="false" で固定 */
  colMain.appendChild(el('div','eq',
    '<math display="block"><mrow>' +
      '<mi>U</mi><mo stretchy="false">(</mo><mi>ν</mi><mo stretchy="false">)</mo><mo>=</mo>' +
      '<mfrac>' +
        '<mrow><mn>8</mn><mi>π</mi><mi>h</mi></mrow>' +
        '<msup><mi>c</mi><mn>3</mn></msup>' +
      '</mfrac>' +
      '<mo>⋅</mo>' +
      '<mfrac>' +
        '<msup><mi>ν</mi><mn>3</mn></msup>' +
        '<mrow><msup><mi>e</mi>' +
          '<mrow><mi>h</mi><mi>ν</mi><mo lspace="0em" rspace="0em">/</mo><mi>k</mi><mi>T</mi></mrow>' +
        '</msup><mo>−</mo><mn>1</mn></mrow>' +
      '</mfrac>' +
    '</mrow></math>'));

  /* ---------- 右カラム ---------- */
  const ctrl = el('div','controls');
  colSide.appendChild(ctrl);
  ctrl.appendChild(el('p','ctlhead','温度'));

  const presetFld = el('label','fld');
  presetFld.appendChild(el('b', null, '身のまわりの例'));
  const presetSel = el('select','wide');
  presetSel.appendChild(el('option', null, '（選んで温度を設定）'));
  PRESETS.forEach(function(p, i){
    const o = el('option', null, p.name); o.value = String(i); presetSel.appendChild(o);
  });
  presetFld.appendChild(presetSel);

  const fT = makeNumField('<i>T</i>：温度', 'K', '直接入力もできます');

  const grid = el('div','grid');
  grid.appendChild(presetFld); grid.appendChild(fT);
  ctrl.appendChild(grid);

  /* 温度スライダー（対数） */
  const slrow = el('label','ctlrow');
  slrow.appendChild(el('span', null, '3 K &nbsp;―&nbsp; 30000 K（対数）'));
  const tSlider = el('input');
  tSlider.type = 'range'; tSlider.min = '0'; tSlider.max = '1000'; tSlider.value = '0';
  slrow.appendChild(tSlider);
  ctrl.appendChild(slrow);

  ctrl.appendChild(el('hr','sep'));
  ctrl.appendChild(el('p','ctlhead','グラフ'));

  const c1 = el('label','chk');
  const chkNuIn = el('input'); chkNuIn.type = 'checkbox';
  c1.appendChild(chkNuIn);
  c1.appendChild(el('span', null, '横軸を振動数 ν にする（既定は波長 λ）'));
  ctrl.appendChild(c1);

  const c2 = el('label','chk');
  const chkLogIn = el('input'); chkLogIn.type = 'checkbox';
  c2.appendChild(chkLogIn);
  c2.appendChild(el('span', null, '縦軸を対数で表示する（片対数）'));
  ctrl.appendChild(c2);

  /* ---------- 解説 ---------- */
  const det = el('details','explain');
  det.appendChild(el('summary', null, '式の前提と，図を読むときの注意点'));
  const notes = el('div','body');
  det.appendChild(notes);
  root.appendChild(det);

  notes.innerHTML =
    '<div class="note">グラフは望月先生のノート (8) の <b>Planck の公式</b> そのものです．' +
    '空洞内の単位体積・単位振動数あたりのエネルギー <i>U</i>(ν) を表しています．' +
    '波長で表すときは <math><mrow><mi>U</mi><mo stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo><mi>d</mi><mi>λ</mi><mo>=</mo><mi>U</mi><mo stretchy="false">(</mo><mi>ν</mi><mo stretchy="false">)</mo><mi>d</mi><mi>ν</mi></mrow></math> の関係から ' +
    '<math><mrow><mi>U</mi><mo stretchy="false">(</mo><mi>λ</mi><mo stretchy="false">)</mo><mo>=</mo><mn>8</mn><mi>π</mi><mi>h</mi><mi>c</mi><mo lspace="0em" rspace="0em">/</mo><msup><mi>λ</mi><mn>5</mn></msup><mo>⋅</mo><mn>1</mn><mo lspace="0em" rspace="0em">/</mo><mo stretchy="false">(</mo><msup><mi>e</mi><mrow><mi>h</mi><mi>c</mi><mo lspace="0em" rspace="0em">/</mo><mi>λ</mi><mi>k</mi><mi>T</mi></mrow></msup><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></math> になります．</div>' +
    '<div class="note warn">⚠ <b>ピークの位置は横軸の取り方で変わります．</b>' +
    'λ で見たときのピーク <math><mrow><msub><mi>λ</mi><mtext>max</mtext></msub><mi>T</mi><mo>=</mo><mn>2.898</mn><mo>×</mo><msup><mn>10</mn><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mn>3</mn></mrow></msup><mtext>&#xA0;m·K</mtext></mrow></math> と，' +
    'ν で見たときのピーク <math><mrow><msub><mi>ν</mi><mtext>max</mtext></msub><mo lspace="0em" rspace="0em">/</mo><mi>T</mi><mo>=</mo><mn>5.879</mn><mo>×</mo><msup><mn>10</mn><mn>10</mn></msup><mtext>&#xA0;Hz/K</mtext></mrow></math> は' +
    '別物で，<math><mrow><mi>c</mi><mo lspace="0em" rspace="0em">/</mo><msub><mi>ν</mi><mtext>max</mtext></msub><mo>≠</mo><msub><mi>λ</mi><mtext>max</mtext></msub></mrow></math> です' +
    '（同じ物理でも「単位波長あたり」と「単位振動数あたり」で数え方が違うため）．' +
    '両方の値を表示してあるので見比べてみてください．</div>' +
    '<div class="note"><b>色の出し方</b>：スペクトルに CIE 1931 等色関数を掛けて 360–830 nm で積分し，' +
    'XYZ 表色系から sRGB に変換しています．色域からはみ出す色は白を足して彩度を落としています．' +
    '2000 K 以上では，色度座標が文献の黒体軌跡と 0.002 以内で一致することを確認済みです．</div>' +
    '<div class="note">上の大きな色見本は<b>明るさをそろえた「色み」</b>です．' +
    '実際の明るさは温度でとてつもなく変わり，900 K の鉄は太陽表面の 10<sup>−10</sup> 程度しかありません' +
    '（暗い部屋でやっと赤く見えるのはこのためです）．' +
    '下の帯の下段は，その明るさの違いを<b>対数目盛で圧縮して</b>色に反映させたものです．</div>' +
    '<div class="note warn">⚠ <b>低温では「色」を出しません．</b>' +
    '可視光の明るさが暗順応した目の検出限界（太陽表面の約 10<sup>−15</sup>）を下回る場合は，' +
    '色見本を黒にして「可視光はほとんど出ていません」と表示します．' +
    'たとえば体温 310 K では可視光の明るさが太陽表面の 1.6×10<sup>−30</sup> しかなく，' +
    '検出限界より 14 桁も暗いので，光っては見えません（サーモグラフィが赤外線を使うのはこのため）．' +
    'この領域は可視域が Wien の裾のさらに裾にあたり，等色関数の近似誤差だけで色度が決まってしまうため，' +
    '数値としても意味を持ちません．おおよそ 600 K 以下がこれに当たります．</div>' +
    '<div class="note">なお実際の鉄や恒星は完全な黒体ではないので，色は目安です．' +
    '恒星の場合は，この考え方をもとに色指数から表面温度を推定します．</div>';

  /* ---------- 参照 ---------- */
  this.cv = cv;
  this.ctx = cv.getContext('2d');
  this.readout = readout;
  this.fT = fT;
  this.tSlider = tSlider;
  this.chkLog = chkLogIn;
  this.chkNu = chkNuIn;

  const ctls = root.querySelectorAll('input,select');
  for (let i = 0; i < ctls.length; i++) ctls[i].setAttribute('autocomplete', 'off');

  this.setT(1300);

  /* ---------- イベント ---------- */
  fT.inp.addEventListener('input', function(){
    presetSel.selectedIndex = 0;
    self.syncSlider(); self.recompute();
  });
  presetSel.addEventListener('change', function(){
    const i = parseInt(presetSel.value, 10);
    if (!isNaN(i)){ self.setT(PRESETS[i].T); self.recompute(); presetSel.value = String(i); }
  });
  tSlider.addEventListener('input', function(){
    presetSel.selectedIndex = 0;
    const v = Number(tSlider.value) / 1000;
    self.fT.set(3 * Math.pow(10000, v));         // 3 K ～ 30000 K
    self.recompute();
  });
  chkNuIn.addEventListener('change', function(){ self.draw(); });
  chkLogIn.addEventListener('change', function(){ self.draw(); });

  this.resize();
  if (window.ResizeObserver){
    this.ro = new ResizeObserver(function(){ self.resize(); });
    this.ro.observe(stage);
  } else {
    window.addEventListener('resize', function(){ self.resize(); });
  }
}

Sim.prototype.setT = function(T){ this.fT.set(T); this.syncSlider(); };
Sim.prototype.syncSlider = function(){
  const T = this.fT.get();
  if (!(T > 0)) return;
  const v = Math.log(Math.max(3, Math.min(30000, T)) / 3) / Math.log(10000);
  this.tSlider.value = String(Math.round(v * 1000));
};

Sim.prototype.recompute = function(){
  const T = this.fT.get();
  this.T = T;
  this.ok = (T > 0 && isFinite(T));
  if (this.ok){
    this.lamMax = B_WIEN / T;
    this.nuMax  = NU_WIEN * T;
    this.color  = colorOf(T);
    this.colorB = colorWithBrightness(T);
    this.exit   = SIGMA * Math.pow(T, 4);           // 放射発散度 [W/m²]
    this.uTot   = 4 * SIGMA * Math.pow(T, 4) / C_L; // 全エネルギー密度 [J/m³]
  }
  this.updateReadout();
  this.draw();
};

Sim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = Math.round(Math.max(430, Math.min(620, w * 0.70)));
  if (this.W === w && this.Hc === h) return;
  this.W = w; this.Hc = h;
  this.cv.width  = Math.round(w * this.dpr);
  this.cv.height = Math.round(h * this.dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

  this.padL = 62; this.padR = 18; this.padT = 18; this.padB = 40;
  const inner = h - this.padT - this.padB;
  this.yA0 = this.padT;                             // スペクトル
  this.yA1 = this.padT + Math.round(0.46 * inner);
  this.ySw0 = this.yA1 + 66;                        // 色見本（軸ラベルと重ならない位置に）
  this.ySw1 = this.ySw0 + Math.round(0.26 * inner);
  this.ySt0 = this.ySw1 + 30;                       // 温度帯
  this.ySt1 = h - this.padB;
  if (this.T === undefined) this.recompute(); else this.draw();
};

Sim.prototype.css = function(name){
  if (!this._c) this._c = {};
  if (this._c[name] === undefined){
    this._c[name] = getComputedStyle(document.getElementById('qsim'))
                      .getPropertyValue(name).trim() || '#888';
  }
  return this._c[name];
};

/* ========================================================================
   7. 描画
   ======================================================================== */
Sim.prototype.draw = function(){
  const c = this.ctx, W = this.W, H = this.Hc;
  c.clearRect(0, 0, W, H);
  c.fillStyle = this.css('--panel'); c.fillRect(0, 0, W, H);
  if (!this.ok){
    c.fillStyle = this.css('--sub'); c.font = '14px ' + CFONT; c.textAlign = 'center';
    c.fillText('温度 T は正の値を入力してください．', W / 2, H / 2);
    return;
  }
  this.drawSpectrum(); this.drawSwatch(); this.drawStrip();
};

/** 上段：スペクトル（波長 or 振動数） */
Sim.prototype.drawSpectrum = function(){
  const c = this.ctx, T = this.T;
  const x0 = this.padL, x1 = this.W - this.padR, plotW = x1 - x0;
  const y0 = this.yA0, y1 = this.yA1, plotH = y1 - y0;
  const sub = this.css('--sub'), line = this.css('--line');
  const useNu = this.chkNu.checked;
  const logMode = this.chkLog.checked;

  const xmax = useNu ? 4 * this.nuMax : 4 * this.lamMax;
  const peak = useNu ? this.nuMax : this.lamMax;
  const f = useNu ? function(v){ return Unu(v, T); } : function(v){ return Ulam(v, T); };
  const fpeak = f(peak);
  const toX = function(v){ return x0 + v / xmax * plotW; };
  const loDec = 6;
  const toY = logMode
    ? function(u){
        if (!(u > 0)) return y1;
        const r = Math.log10(u / fpeak);
        return y1 - Math.max(0, (r + loDec) / loDec) * plotH;
      }
    : function(u){ return y1 - Math.min(1, u / fpeak) * plotH * 0.94; };

  /* 可視域の帯（スペクトルの色） */
  const visLo = useNu ? C_L / 780e-9 : 380e-9;
  const visHi = useNu ? C_L / 380e-9 : 780e-9;
  if (visLo < xmax){
    const bandY = y1 + 4, bandH = 11;
    const pa = Math.max(x0, toX(visLo)), pb = Math.min(x1, toX(visHi));
    for (let px = Math.floor(pa); px <= pb; px++){
      const v = (px - x0) / plotW * xmax;
      const lnm = (useNu ? C_L / v : v) * 1e9;
      if (lnm < 360 || lnm > 830) continue;
      c.fillStyle = rgbCss(spectrumRGB(lnm));
      c.fillRect(px, bandY, 1.4, bandH);
    }
    c.strokeStyle = line; c.lineWidth = 1;
    c.strokeRect(pa, bandY, Math.max(1, pb - pa), bandH);
    if (pb - pa > 60){
      c.fillStyle = sub; c.font = '9.5px ' + CFONT; c.textAlign = 'center';
      c.fillText('可視光', (pa + pb) / 2, bandY + bandH + 10);
    }
  }

  /* 曲線 */
  c.strokeStyle = this.css('--planck'); c.lineWidth = 2;
  c.beginPath();
  for (let i = 0; i <= plotW; i++){
    const v = xmax * i / plotW;
    const y = toY(f(v));
    if (i === 0) c.moveTo(x0 + i, y); else c.lineTo(x0 + i, y);
  }
  c.stroke();
  if (!logMode){
    c.lineTo(x1, y1); c.lineTo(x0, y1); c.closePath();
    c.fillStyle = this.css('--planck'); c.globalAlpha = 0.10; c.fill(); c.globalAlpha = 1;
  }

  /* ピーク */
  const pxk = toX(peak);
  c.strokeStyle = this.css('--mark'); c.lineWidth = 1.4; c.setLineDash([4,3]);
  c.beginPath(); c.moveTo(pxk, y0); c.lineTo(pxk, y1); c.stroke(); c.setLineDash([]);
  c.fillStyle = this.css('--mark');
  c.beginPath(); c.arc(pxk, toY(fpeak), 3.6, 0, 6.2832); c.fill();
  c.fillStyle = sub; c.font = '10.5px ' + CFONT; c.textAlign = 'left';
  c.fillText(useNu ? 'ν_max = ' + fmtNumPlain(this.nuMax, 3) + ' Hz'
                   : 'λ_max = ' + fmtLenPlain(this.lamMax, 3),
             Math.min(pxk + 6, x1 - 120), y0 + 13);

  /* 枠と目盛り */
  c.strokeStyle = line; c.lineWidth = 1; c.strokeRect(x0, y0, plotW, plotH);
  const uUnit = useNu ? [1, 'Hz'] : (LEN_TBL.filter(function(u){ return xmax >= u[0]; })[0] || [1e-9,'nm']);
  const step = niceStep(xmax / 6);
  c.textAlign = 'center'; c.font = '10px ' + CFONT;
  for (let k = 1; k * step <= xmax * 1.0001; k++){
    const v = k * step, px = toX(v);
    c.strokeStyle = line; c.globalAlpha = 0.3;
    c.beginPath(); c.moveTo(px, y0); c.lineTo(px, y1); c.stroke(); c.globalAlpha = 1;
    c.fillStyle = sub;
    c.fillText(useNu ? fmtNumPlain(v / 1e12, 3) : String(Number((v / uUnit[0]).toPrecision(3))),
               px, y1 + 30);
  }
  c.fillStyle = sub; c.font = '11px ' + CFONT;
  c.fillText(useNu ? '振動数 ν [THz]' : '波長 λ [' + uUnit[1] + ']', (x0 + x1) / 2, y1 + 44);
  c.save();
  c.translate(15, (y0 + y1) / 2); c.rotate(-Math.PI / 2); c.textAlign = 'center';
  c.fillText(useNu ? 'U(ν)' : 'U(λ)', 0, 0);
  c.restore();
  if (logMode){
    c.textAlign = 'right'; c.font = '10px ' + CFONT;
    c.fillText('（対数目盛）', x1 - 4, y0 + 13);
  }
};

/** 中段：色見本 */
Sim.prototype.drawSwatch = function(){
  const c = this.ctx;
  const x0 = this.padL, x1 = this.W - this.padR;
  const y0 = this.ySw0, y1 = this.ySw1;
  const gap = 14, wHalf = (x1 - x0 - gap) / 2;

  const draw = function(px, w, rgb, title, sub2, self){
    c.fillStyle = rgbCss(rgb);
    c.fillRect(px, y0, w, y1 - y0);
    c.strokeStyle = self.css('--line'); c.lineWidth = 1;
    c.strokeRect(px, y0, w, y1 - y0);
    c.fillStyle = self.css('--sub'); c.font = '10.5px ' + CFONT; c.textAlign = 'left';
    c.fillText(title, px, y0 - 6);
    if (sub2){
      c.textAlign = 'right';
      c.fillText(sub2, px + w, y0 - 6);
    }
  };
  draw(x0, wHalf, this.color.rgb, '光の色（明るさをそろえた場合）',
       this.color.visible ? rgbHex(this.color.rgb) : '', this);
  draw(x0 + wHalf + gap, wHalf, this.colorB,
       '明るさも反映（対数で圧縮）', '', this);

  /* 大きな温度表示 */
  const cx = x0 + wHalf / 2;
  const lum = 0.2126*this.color.rgb[0] + 0.7152*this.color.rgb[1] + 0.0722*this.color.rgb[2];
  c.fillStyle = lum > 0.5 ? 'rgba(20,25,30,.78)' : 'rgba(255,255,255,.9)';
  c.font = 'bold 22px ' + CFONT; c.textAlign = 'center';
  c.fillText(fmtNumPlain(this.T, 5) + ' K', cx, (y0 + y1) / 2 + (this.color.visible ? 8 : -6));

  /* 目に見えないほど暗いときは，色を出さずに理由を書く */
  if (!this.color.visible){
    c.fillStyle = 'rgba(255,255,255,.82)'; c.font = '12.5px ' + CFONT;
    c.fillText('可視光はほとんど出ていません（' +
               (this.lamMax > 780e-9 ? 'ピークは赤外 ' + fmtLenPlain(this.lamMax, 3) : '短波長すぎます') + '）',
               cx, (y0 + y1) / 2 + 16);
    c.fillStyle = 'rgba(255,255,255,.55)'; c.font = '11px ' + CFONT;
    c.fillText('目には光って見えません', x0 + wHalf + gap + wHalf / 2, (y0 + y1) / 2 + 4);
  }
};

/** 下段：温度の帯 */
Sim.prototype.drawStrip = function(){
  const c = this.ctx;
  const x0 = this.padL, x1 = this.W - this.padR, plotW = x1 - x0;
  const y0 = this.ySt0, y1 = this.ySt1;
  const hHalf = (y1 - y0) / 2;
  const T0 = 800, T1 = 20000;
  const toX = function(T){ return x0 + Math.log(T / T0) / Math.log(T1 / T0) * plotW; };

  if (!this._strip || this._stripW !== plotW){
    this._strip = []; this._stripW = plotW;
    for (let px = 0; px <= plotW; px++){
      const T = T0 * Math.pow(T1 / T0, px / plotW);
      this._strip.push([rgbCss(colorOf(T).rgb), rgbCss(colorWithBrightness(T))]);
    }
  }
  for (let px = 0; px <= plotW; px++){
    c.fillStyle = this._strip[px][0]; c.fillRect(x0 + px, y0, 1.4, hHalf);
    c.fillStyle = this._strip[px][1]; c.fillRect(x0 + px, y0 + hHalf, 1.4, hHalf);
  }
  c.strokeStyle = this.css('--line'); c.lineWidth = 1;
  c.strokeRect(x0, y0, plotW, y1 - y0);
  c.beginPath(); c.moveTo(x0, y0 + hHalf); c.lineTo(x1, y0 + hHalf); c.stroke();

  const sub = this.css('--sub');
  c.fillStyle = sub; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('上：色みだけ／下：明るさも反映（800 K – 20000 K）', x0, y0 - 6);

  [1000, 2000, 3000, 5000, 10000, 20000].forEach(function(T){
    const px = toX(T);
    c.fillStyle = sub; c.font = '9.5px ' + CFONT; c.textAlign = 'center';
    c.fillText(T >= 1000 ? (T / 1000) + 'k' : String(T), px, y1 + 12);
  });

  if (this.T >= T0 && this.T <= T1){
    const px = toX(this.T);
    c.strokeStyle = '#111'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(px, y0 - 3); c.lineTo(px, y1 + 3); c.stroke();
    c.strokeStyle = '#fff'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(px, y0 - 3); c.lineTo(px, y1 + 3); c.stroke();
  }
};

/* ========================================================================
   8. 数値の表示
   ======================================================================== */
Sim.prototype.updateReadout = function(){
  if (!this.ok){
    this.readout.innerHTML = '<div><span>入力エラー</span><span>T は正の値で</span></div>';
    return;
  }
  const T = this.T, R = [];
  R.push(['温度 <i>T</i>', fmtNum(T, 5) + ' K']);
  R.push(['λ<sub>max</sub>（Wien の変位則）', fmtLen(this.lamMax, 4)]);
  R.push(['ν<sub>max</sub>（振動数で見たピーク）', fmtNum(this.nuMax, 4) + ' Hz']);
  R.push(['ν<sub>max</sub> に対応する波長', fmtLen(C_L / this.nuMax, 4)]);
  R.push(['放射発散度 σ<i>T</i><sup>4</sup>', fmtNum(this.exit, 4) + ' W/m<sup>2</sup>']);
  R.push(['全エネルギー密度', fmtNum(this.uTot, 4) + ' J/m<sup>3</sup>']);

  const col = this.color;
  R.push(['色度座標 (<i>x</i>, <i>y</i>)',
          col.visible ? fmtNum(col.x, 4) + ', ' + fmtNum(col.y, 4)
                      : '—（可視光がほぼ無い）']);
  R.push(['色（sRGB）', col.visible ? rgbHex(col.rgb) : '見えない']);
  R.push(['可視光の明るさ（太陽表面 = 1）',
          col.rel > 0 ? fmtNum(col.rel, 3) : '≈ 0']);
  R.push(['目の検出限界（暗順応）との比',
          col.rel > 0 ? fmtNum(col.rel / VIS_MIN, 3) + ' 倍' : '≈ 0']);

  this.readout.innerHTML = R.map(function(r){
    return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
};

/* ========================================================================
   9. 起動
   ======================================================================== */
const app = document.getElementById('qsim');

/* ?only=... / ?embed=1 を付けると，見出しを隠して iframe 埋め込み用の体裁になる */
if (/[?&](only|embed)=/.test(location.search)) app.classList.add('is-embed');

const sim = new Sim(app.querySelector('.panel'));

/* Chrome のフォーム復元が初期化後に値を書き戻すことがあるので，読み直す */
window.addEventListener('pageshow', function(){ sim.syncSlider(); sim.recompute(); });

/* iframe の高さを親へ知らせる */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
</body>
</html>
