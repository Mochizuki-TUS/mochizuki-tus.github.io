<body>
<div id="qsim">
  <h1>Lagrange の未定乗数法 ― 拘束条件つきで、いちばん低いところを探す</h1>
  <p class="lead">
    「<b>ある条件を守りながら</b>、何かを最小（最大）にする」。物理はこの形の問題だらけです。
    ここでは分子 AB のエネルギー期待値を例にとって、
    係数 <i>c</i><sub>A</sub>, <i>c</i><sub>B</sub> の平面の上で<b>何が起きているのか</b>を見ます。
    そこから<b>永年方程式</b>が出てきて、<b>結合性軌道と反結合性軌道</b>にたどり着きます。
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="con" role="tab">① 拘束条件つきの最小化</button>
    <button class="tab" data-tab="lam" role="tab">② 未定乗数 ε の正体と永年方程式</button>
    <button class="tab" data-tab="orb" role="tab">③ 結合性・反結合性軌道</button>
  </div>

  <section class="panel" data-panel="con"></section>
  <section class="panel" data-panel="lam" hidden></section>
  <section class="panel" data-panel="orb" hidden></section>

  <p class="foot">
    東京理科大学 望月研究室 ／ 講義「マテリアル計算科学」第 11 回「永年方程式と共有結合」より。
    式の導出は <a href="lagrange-derivation.html">こちらのページ</a>にあります。
  </p>

<script>
(function () {
'use strict';
/* ========================================================================
   0. 共通の道具
   ======================================================================== */
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }
function fmt(v, d){
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-4 || a >= 1e6)){
    const m = /^(-?[\d.]+)e([+-]\d+)$/.exec(v.toExponential(d === undefined ? 3 : d));
    return m ? m[1] + '×10<sup>' + Number(m[2]) + '</sup>' : String(v);
  }
  return v.toFixed(d === undefined ? 3 : d);
}

/* ========================================================================
   1. 分子 AB のモデル（講義ノート 第11回「永年方程式と共有結合」）
   ------------------------------------------------------------------------
   Ψ = c_A ψ_A + c_B ψ_B（c は実数）とすると
     ⟨Ψ|H|Ψ⟩ = α_A c_A² + α_B c_B² + 2β c_A c_B          … これを最小化したい
     ⟨Ψ|Ψ⟩   =     c_A² +     c_B² + 2S c_A c_B  = 2      … 拘束条件（総電子数 2）
   拘束の下でのエネルギー期待値は E = ⟨Ψ|H|Ψ⟩/⟨Ψ|Ψ⟩ = ½⟨Ψ|H|Ψ⟩。
   ======================================================================== */

/* ⟨Ψ|H|Ψ⟩ ―― 最小化したい量そのもの */
function hExp(p, cA, cB){ return p.aA * cA * cA + p.aB * cB * cB + 2 * p.beta * cA * cB; }
/* ⟨Ψ|Ψ⟩ ―― 規格化（拘束条件の左辺） */
function norm(p, cA, cB){ return cA * cA + cB * cB + 2 * p.S * cA * cB; }
/* 拘束条件 g = ⟨Ψ|Ψ⟩ − 2 */
function gCon(p, cA, cB){ return norm(p, cA, cB) - 2; }
/* Rayleigh 商。拘束の外でも意味を持つ「1 電子あたりのエネルギー」 */
function rayleigh(p, cA, cB){
  const n = norm(p, cA, cB);
  return Math.abs(n) < 1e-12 ? NaN : hExp(p, cA, cB) / n;
}
/* Lagrange 関数 F = ½⟨Ψ|H|Ψ⟩ − ε(⟨Ψ|Ψ⟩ − 2) */
function lagF(p, eps, cA, cB){ return 0.5 * hExp(p, cA, cB) - eps * gCon(p, cA, cB); }

/* 勾配。∇(½⟨Ψ|H|Ψ⟩) と ∇⟨Ψ|Ψ⟩ が平行になる点が答え。 */
function gradH(p, cA, cB){ return [p.aA * cA + p.beta * cB, p.aB * cB + p.beta * cA]; }
function gradG(p, cA, cB){ return [2 * (cA + p.S * cB), 2 * (cB + p.S * cA)]; }
function gradF(p, eps, cA, cB){
  const h = gradH(p, cA, cB), g = gradG(p, cA, cB);
  return [h[0] - eps * g[0], h[1] - eps * g[1]];
}

/* ========================================================================
   2. 永年方程式
   ------------------------------------------------------------------------
   |α_A − 2ε   β − 2εS |
   |β − 2εS    α_B − 2ε| = 0
   展開すると 4(1−S²)ε² + (4βS − 2α_A − 2α_B)ε + (α_Aα_B − β²) = 0。
   ======================================================================== */
function secDet(p, eps){
  return (p.aA - 2 * eps) * (p.aB - 2 * eps) - Math.pow(p.beta - 2 * eps * p.S, 2);
}
function secRoots(p){
  const A = 4 * (1 - p.S * p.S);
  const B = 4 * p.beta * p.S - 2 * p.aA - 2 * p.aB;
  const C = p.aA * p.aB - p.beta * p.beta;
  if (Math.abs(A) < 1e-12){                       // S = 1（完全に重なった極限）は 1 次式
    return Math.abs(B) < 1e-12 ? [] : [-C / B];
  }
  const disc = B * B - 4 * A * C;
  if (disc < 0) return [];                        // 実数解なし（α, β, S が実なら起きない）
  const sq = Math.sqrt(disc);
  const r = [(-B - sq) / (2 * A), (-B + sq) / (2 * A)];
  r.sort(function(x, y){ return x - y; });
  return r;                                        // [低い方（結合性）, 高い方（反結合性）]
}

/* ε に対応する係数 (c_A, c_B)。⟨Ψ|Ψ⟩ = 2 に規格化して返す。
   (α_A − 2ε)c_A + (β − 2εS)c_B = 0 から比を取る。 */
function coefFor(p, eps, sign){
  const a = p.aA - 2 * eps, b = p.beta - 2 * eps * p.S;
  let cA, cB;
  if (Math.abs(b) > Math.abs(a)){ cA = b; cB = -a; }   /* 数値的に安定な方を選ぶ */
  else if (Math.abs(a) > 1e-14){ cA = p.beta - 2 * eps * p.S; cB = -(p.aA - 2 * eps); }
  else { cA = 1; cB = 0; }
  if (Math.abs(cA) < 1e-14 && Math.abs(cB) < 1e-14){ cA = 1; cB = 0; }
  const n = norm(p, cA, cB);
  if (!(n > 1e-14)) return [NaN, NaN];
  /* 全体の符号は物理的に意味を持たないので、大きい方の成分が正になるようにそろえる。
     こうすると結合性が (+,+)、反結合性が (+,−) と読みやすく出る。 */
  let sg = (Math.abs(cA) >= Math.abs(cB) ? cA : cB) < 0 ? -1 : 1;
  const k = Math.sqrt(2 / n) * sg * (sign === undefined ? 1 : sign);
  return [cA * k, cB * k];
}

/* ========================================================================
   3. 拘束の楕円 c_A² + c_B² + 2S c_A c_B = 2 の径数表示
   ------------------------------------------------------------------------
   主軸は (1,1)/√2 と (1,−1)/√2 の向き。そこでの半径は √(2/(1+S)), √(2/(1−S))。
   θ でぐるりと回れるようにしておく。
   ======================================================================== */
function ellipse(p, th){
  const u = Math.sqrt(2 / (1 + p.S)) * Math.cos(th);    // (1,1)/√2 方向の成分
  const v = Math.sqrt(2 / Math.max(1e-9, 1 - p.S)) * Math.sin(th);
  const r2 = Math.SQRT1_2;
  return [r2 * (u + v), r2 * (u - v)];
}
/* 楕円上で ½⟨Ψ|H|Ψ⟩ が最小になる θ を総当たり＋二分で探す（答え合わせ用） */
function minOnEllipse(p){
  let best = 0, bv = Infinity;
  for (let i = 0; i < 2000; i++){
    const th = 2 * Math.PI * i / 2000, c = ellipse(p, th), v = 0.5 * hExp(p, c[0], c[1]);
    if (v < bv){ bv = v; best = th; }
  }
  let lo = best - Math.PI / 1000, hi = best + Math.PI / 1000;
  for (let k = 0; k < 60; k++){
    const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
    const c1 = ellipse(p, m1), c2 = ellipse(p, m2);
    if (0.5 * hExp(p, c1[0], c1[1]) < 0.5 * hExp(p, c2[0], c2[1])) hi = m2; else lo = m1;
  }
  return 0.5 * (lo + hi);
}

/* ========================================================================
   4. 重なり積分から核間距離へ
   ------------------------------------------------------------------------
   1s 軌道どうしなら S(R) = e^(−R)(1 + R + R²/3)（R は Bohr 半径単位）。
   波動関数の絵を S と食い違わせないために、S から R を逆に求める。
   ======================================================================== */
function overlap1s(R){ return Math.exp(-R) * (1 + R + R * R / 3); }
function distFromS(S){
  if (S >= 1) return 0;
  if (S <= 1e-6) return 20;
  let lo = 0, hi = 30;
  for (let i = 0; i < 80; i++){
    const m = 0.5 * (lo + hi);
    if (overlap1s(m) > S) lo = m; else hi = m;
  }
  return 0.5 * (lo + hi);
}

/* ========================================================================
   5. 共有結合度とイオン結合度（講義ノート スライド 16、S = 0 の定義）
   ======================================================================== */
function bondCharacter(p){
  const dc = -p.beta;                       // 共有結合ぶんのギャップ
  const di = Math.abs(p.aA - p.aB) / 2;     // イオン結合ぶんのギャップ
  const d = Math.hypot(dc, di);
  return { dc: dc, di: di, d: d,
           cov: d > 0 ? Math.abs(dc) / d : 0,
           ion: d > 0 ? di / d : 0 };
}
/* S を含めた本当のギャップ（同種原子のとき Δε = (Sα − β)/(1 − S²)） */
function gapExact(p){
  const r = secRoots(p);
  return r.length === 2 ? r[1] - r[0] : NaN;
}

/* ========================================================================
   6. プリセット
   ------------------------------------------------------------------------
   α は「結合前の原子の電子準位」なので負。β（共鳴積分）も普通は負。
   β と S は独立ではなく、β < Sα でないと結合性・反結合性が入れ替わる。
   ======================================================================== */
const PRESETS = [
  { n:'水素分子 H₂（同種原子）',            aA:-13.6, aB:-13.6, beta:-9.0, S:0.50 },
  { n:'極性のある結合（A より B が深い）',   aA:-13.6, aB:-18.0, beta:-7.5, S:0.35 },
  { n:'重なりを無視した近似（S = 0）',       aA:-13.6, aB:-13.6, beta:-6.0, S:0.00 },
  { n:'イオン結合寄り（準位差が大きい）',    aA:-5.1,  aB:-17.4, beta:-2.5, S:0.15 },
  { n:'内殻どうし（S も β も 0 に近い）',    aA:-284,  aB:-284,  beta:-0.3, S:0.02 },
  { n:'⚠ あり得ない組み合わせ（β > Sα）',    aA:-13.6, aB:-13.6, beta:-2.0, S:0.50 }
];

const app = document.getElementById('qsim');
const sims = {};

function Sim(key, root){
  this.key = key;
  this.rootEl = root;
  this.p = { aA:-13.6, aB:-13.6, beta:-9.0, S:0.50 };
  this.pi = 0;
  this.th = 0.9;                 /* ①：楕円上の位置 */
  this.eps = -6.0;               /* ②：いま試している未定乗数 */
  this.build();
  this.setPreset(0);
}

Sim.prototype.roots = function(){ return secRoots(this.p); };

/* --------------------------------------------------------------------
   組み立て
   -------------------------------------------------------------------- */
Sim.prototype.build = function(){
  const self = this;
  const lay = el('div', 'layout');
  const main = el('div', 'col-main'), side = el('div', 'col-side');
  lay.appendChild(main); lay.appendChild(side);
  this.rootEl.appendChild(lay);

  const stage = el('div', 'stage');
  const cv = document.createElement('canvas');
  stage.appendChild(cv); main.appendChild(stage);
  this.cv = cv; this.ctx = cv.getContext('2d');

  if (this.key === 'con'){
    main.appendChild(el('div', 'legend',
      '<span><i style="background:#0f4c81"></i>⟨Ψ|H|Ψ⟩ の等高線（低いほど青）</span>' +
      '<span><i style="background:#00695c"></i>拘束条件 ⟨Ψ|Ψ⟩ = 2 の楕円</span>' +
      '<span><i style="background:#c62828"></i>いま見ている点</span>' +
      '<span><i style="background:#f9a825"></i>接する点（＝答え）</span>'));
  } else if (this.key === 'lam'){
    main.appendChild(el('div', 'legend',
      '<span><i style="background:#0f4c81"></i>F の等高線</span>' +
      '<span><i style="background:#00695c"></i>拘束条件の楕円</span>' +
      '<span><i style="background:#f9a825"></i>∇F = 0 になる谷の線</span>' +
      '<span><i style="background:#c62828"></i>永年方程式の根</span>'));
  } else {
    main.appendChild(el('div', 'legend',
      '<span><i style="background:#5c6670"></i>結合前の原子準位 α</span>' +
      '<span><i style="background:#1565c0"></i>結合性軌道</span>' +
      '<span><i style="background:#c62828"></i>反結合性軌道</span>'));
  }

  this.alert = el('div', 'alert'); this.alert.hidden = true; main.appendChild(this.alert);
  this.readout = el('div', 'readout'); main.appendChild(this.readout);
  this.eqbox = el('div', 'eq'); main.appendChild(this.eqbox);

  /* ---------------- 右カラム ---------------- */
  const ctrl = el('div', 'controls'); side.appendChild(ctrl);

  ctrl.appendChild(el('p', 'ctlhead', '系'));
  const pf = el('label', 'fld');
  pf.appendChild(el('b', null, 'プリセット'));
  const sel = el('select', 'wide');
  PRESETS.forEach(function(q, i){
    const o = document.createElement('option'); o.textContent = q.n; o.value = String(i); sel.appendChild(o);
  });
  sel.autocomplete = 'off';
  sel.addEventListener('change', function(){ self.setPreset(parseInt(this.value, 10)); });
  pf.appendChild(sel);
  ctrl.appendChild(pf);
  this.sel = sel;

  ctrl.appendChild(el('hr', 'sep'));
  ctrl.appendChild(el('p', 'ctlhead', 'パラメーター'));

  this.sl = {};
  const mk = function(k, label, min, max, step, unit){
    const row = el('label', 'ctlrow');
    const lab = el('span', null, label);
    row.appendChild(lab);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = String(min); inp.max = String(max); inp.step = String(step);
    inp.autocomplete = 'off';
    inp.addEventListener('input', function(){
      self.p[k] = Number(this.value);
      self.pi = -1; self.sel.value = '';
      self.refresh();
    });
    row.appendChild(inp);
    ctrl.appendChild(row);
    self.sl[k] = { inp: inp, lab: lab, unit: unit };
  };
  mk('aA', 'α_A', -30, -1, 0.1, ' eV');
  mk('aB', 'α_B', -30, -1, 0.1, ' eV');
  mk('beta', 'β', -20, 5, 0.1, ' eV');
  mk('S', 'S', 0, 0.95, 0.01, '');
  ctrl.appendChild(el('p', 'fld', '<span class="hint">'
    + 'α は結合前の原子の電子準位（負）、β は共鳴積分（ふつう負）、S は重なり積分（0 ≦ S ≦ 1）。'
    + '内殻のように深い準位ほど、S も β も 0 に近づきます。</span>'));

  ctrl.appendChild(el('hr', 'sep'));

  if (this.key === 'con'){
    ctrl.appendChild(el('p', 'ctlhead', '楕円の上を歩く'));
    const row = el('label', 'ctlrow');
    this.thLab = el('span', null, 'θ = 0.90');
    row.appendChild(this.thLab);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = '0'; inp.max = '6.2832'; inp.step = '0.002'; inp.value = '0.9';
    inp.autocomplete = 'off';
    inp.addEventListener('input', function(){ self.th = Number(this.value); self.refresh(); });
    row.appendChild(inp);
    ctrl.appendChild(row);
    this.thIn = inp;

    const br = el('div', 'btnrow');
    const b1 = el('button', 'act bond b-half', 'いちばん低い点へ'); b1.type = 'button';
    b1.addEventListener('click', function(){ self.th = minOnEllipse(self.p); self.refresh(); });
    const b2 = el('button', 'act anti b-half', 'いちばん高い点へ'); b2.type = 'button';
    b2.addEventListener('click', function(){
      const q = { aA:-self.p.aA, aB:-self.p.aB, beta:-self.p.beta, S:self.p.S };
      self.th = minOnEllipse(q); self.refresh();
    });
    br.appendChild(b1); br.appendChild(b2);
    ctrl.appendChild(br);
    ctrl.appendChild(el('p', 'fld', '<span class="hint">'
      + '楕円の上を一周してみてください。<b>等高線と楕円が接する</b>ところで、'
      + 'エネルギーが最小（最大）になります。</span>'));
  } else if (this.key === 'lam'){
    ctrl.appendChild(el('p', 'ctlhead', '未定乗数 ε'));
    const row = el('label', 'ctlrow');
    this.epsLab = el('span', null, 'ε = −6.00 eV');
    row.appendChild(this.epsLab);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = '0'; inp.max = '1'; inp.step = '0.001'; inp.value = '0.5';
    inp.autocomplete = 'off';
    inp.addEventListener('input', function(){
      const r = self.epsRange();
      self.eps = r[0] + (r[1] - r[0]) * Number(this.value);
      self.refresh();
    });
    row.appendChild(inp);
    ctrl.appendChild(row);
    this.epsIn = inp;

    const br = el('div', 'btnrow');
    const b1 = el('button', 'act bond b-half', 'ε_b（低い根）'); b1.type = 'button';
    b1.addEventListener('click', function(){ const r = self.roots(); if (r.length) { self.eps = r[0]; self.refresh(); } });
    const b2 = el('button', 'act anti b-half', 'ε_a（高い根）'); b2.type = 'button';
    b2.addEventListener('click', function(){ const r = self.roots(); if (r.length > 1) { self.eps = r[1]; self.refresh(); } });
    br.appendChild(b1); br.appendChild(b2);
    ctrl.appendChild(br);
    ctrl.appendChild(el('p', 'fld', '<span class="hint">'
      + 'ε を動かすと F の等高線の形が変わります。<b>ε が永年方程式の根のときだけ</b>、'
      + '等高線が平らな谷（まっすぐな線）になります。</span>'));
  } else {
    ctrl.appendChild(el('p', 'ctlhead', '見せ方'));
    const ck = el('label', 'ctlrow');
    ck.style.alignItems = 'flex-start';
    const inp = document.createElement('input');
    inp.type = 'checkbox'; inp.checked = true; inp.autocomplete = 'off';
    inp.style.accentColor = 'var(--accent)'; inp.style.marginTop = '3px';
    inp.addEventListener('change', function(){ self.showSq = this.checked; self.refresh(); });
    const sp = el('span', null, '|Ψ|² も描く');
    sp.style.minWidth = '0';
    ck.appendChild(inp); ck.appendChild(sp);
    ctrl.appendChild(ck);
    this.showSq = true;
    ctrl.appendChild(el('p', 'fld', '<span class="hint">'
      + '波動関数の絵は、重なり積分 S から核間距離を逆算して描いています'
      + '（1s 軌道なら S = e<sup>−R</sup>(1 + R + R²/3)）。S を動かすと 2 つの原子が近づきます。</span>'));
  }

  /* ---------------- 解説 ---------------- */
  const det = document.createElement('details');
  det.className = 'explain';
  const sm = document.createElement('summary');
  sm.textContent = this.key === 'con' ? 'この図で何が起きているか'
                 : this.key === 'lam' ? 'なぜ行列式を 0 と置くのか'
                 : '共有結合とイオン結合を、この式から読む';
  det.appendChild(sm);
  this.body = el('div', 'body');
  det.appendChild(this.body);
  main.appendChild(det);
};

Sim.prototype.setPreset = function(i){
  const q = PRESETS[i];
  if (!q) return;
  this.pi = i;
  this.p = { aA:q.aA, aB:q.aB, beta:q.beta, S:q.S };
  this.sel.value = String(i);
  /* α のスライダーの範囲は、内殻プリセット（−284 eV）にも届くように広げる */
  const lo = Math.min(-30, Math.floor(Math.min(q.aA, q.aB) * 1.2));
  this.sl.aA.inp.min = String(lo); this.sl.aB.inp.min = String(lo);
  this.sl.beta.inp.min = String(Math.min(-20, Math.floor(q.beta * 3)));
  const r = this.roots();
  if (this.key === 'lam' && r.length === 2) this.eps = 0.5 * (r[0] + r[1]);
  if (this.key === 'con') this.th = 0.9;
  this.refresh();
};

/* ② の ε スライダーが動く範囲。根の両側に少し余裕を持たせる。 */
Sim.prototype.epsRange = function(){
  const r = this.roots();
  if (r.length < 2){ const c = 0.5 * (this.p.aA + this.p.aB) / 2; return [c - 10, c + 10]; }
  const w = Math.max(1, r[1] - r[0]);
  return [r[0] - 0.55 * w, r[1] + 0.55 * w];
};

/* ========================================================================
   7. 描画
   ======================================================================== */
const DPR = Math.min(window.devicePixelRatio || 1, 2);

Sim.prototype.resize = function(){
  const w = Math.max(300, this.cv.parentNode.clientWidth);
  const h = Math.round(clamp(w * 0.50, 260, 420));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  this.cv.width = Math.round(w * DPR); this.cv.height = Math.round(h * DPR);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
};

/* 枠と軸の名前。横軸の名前は軸の真下に中央そろえ、
   縦軸の名前は 90 度回して軸の左に置く（グラフの基本の作法）。 */
function frame(c, x0, y0, x1, y1, xlab, ylab){
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '11px ' + CFONT;
  if (xlab){
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(xlab, (x0 + x1) / 2, y1 + 19);
  }
  if (ylab){
    const off = Math.min(46, Math.max(15, x0 - 10));
    c.save();
    c.translate(x0 - off, (y0 + y1) / 2);
    c.rotate(-Math.PI / 2);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(ylab, 0, 0);
    c.restore();
  }
}

/* 凡例。等高線の上に文字を直接置くと沈むので、白い箱で抜く。 */
function legendBox(c, x, y, items){
  c.font = 'bold 11px ' + CFONT;
  let w = 0;
  items.forEach(function(t){ w = Math.max(w, c.measureText(t[1]).width + (t[0] ? 26 : 7)); });
  const bw = w + 10, bh = items.length * 17 + 10, r = 6;
  c.fillStyle = 'rgba(255,255,255,.95)';
  c.strokeStyle = 'rgba(31,35,40,.30)'; c.lineWidth = 1;
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + bw - r, y); c.quadraticCurveTo(x + bw, y, x + bw, y + r);
  c.lineTo(x + bw, y + bh - r); c.quadraticCurveTo(x + bw, y + bh, x + bw - r, y + bh);
  c.lineTo(x + r, y + bh); c.quadraticCurveTo(x, y + bh, x, y + bh - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath(); c.fill(); c.stroke();
  items.forEach(function(t, i){
    const yy = y + 14 + i * 17;
    if (t[0]){
      c.strokeStyle = t[0]; c.fillStyle = t[0]; c.lineWidth = 2.2;
      c.beginPath(); c.moveTo(x + 7, yy); c.lineTo(x + 17, yy); c.stroke();
      c.beginPath(); c.moveTo(x + 22, yy); c.lineTo(x + 15, yy - 3.4); c.lineTo(x + 15, yy + 3.4);
      c.closePath(); c.fill();
    }
    c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT;
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(t[1], x + (t[0] ? 26 : 7), yy);
  });
}
/* 矢印 */
function arrow(c, x0, y0, x1, y1, col, w){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 1) return;
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w || 2;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  const a = Math.atan2(dy, dx), s = 7;
  c.beginPath();
  c.moveTo(x1, y1);
  c.lineTo(x1 - s * Math.cos(a - 0.4), y1 - s * Math.sin(a - 0.4));
  c.lineTo(x1 - s * Math.cos(a + 0.4), y1 - s * Math.sin(a + 0.4));
  c.closePath(); c.fill();
}

/* --------------------------------------------------------------------
   等高線つきの塗り分け。fn(cA, cB) を格子で評価して、
   色 ＝ 値、線 ＝ 段が変わったところ、として一気に描く。
   -------------------------------------------------------------------- */
Sim.prototype.field = function(x0, y0, x1, y1, L, fn, nLev){
  const c = this.ctx;
  const w = Math.max(2, Math.round(x1 - x0)), h = Math.max(2, Math.round(y1 - y0));
  const step = 2;                                   // 2 px ごとに評価（描画は塗りつぶし）
  const nx = Math.ceil(w / step), ny = Math.ceil(h / step);
  const v = new Float64Array(nx * ny);
  let vmin = Infinity, vmax = -Infinity;
  for (let j = 0; j < ny; j++){
    const cB = L - 2 * L * (j * step) / h;
    for (let i = 0; i < nx; i++){
      const cA = -L + 2 * L * (i * step) / w;
      const t = fn(cA, cB);
      v[j * nx + i] = t;
      if (isFinite(t)){ if (t < vmin) vmin = t; if (t > vmax) vmax = t; }
    }
  }
  if (!isFinite(vmin) || vmax - vmin < 1e-12){ vmin = -1; vmax = 1; }
  const lev = nLev || 16, span = vmax - vmin, dl = span / lev;
  const img = c.createImageData(nx, ny);
  const d = img.data;
  for (let j = 0; j < ny; j++){
    for (let i = 0; i < nx; i++){
      const t = clamp((v[j * nx + i] - vmin) / span, 0, 1);
      /* 低い＝青、真ん中＝白、高い＝赤 */
      let R, G, B;
      if (t < 0.5){ const u = t * 2; R = Math.round(21 + 234 * u); G = Math.round(101 + 154 * u); B = Math.round(192 + 63 * u); }
      else { const u = (t - 0.5) * 2; R = 255; G = Math.round(255 - 137 * u); B = Math.round(255 - 215 * u); }
      /* 段が変わるところを暗くして等高線にする */
      const q = Math.floor((v[j * nx + i] - vmin) / dl);
      const qr = i + 1 < nx ? Math.floor((v[j * nx + i + 1] - vmin) / dl) : q;
      const qd = j + 1 < ny ? Math.floor((v[(j + 1) * nx + i] - vmin) / dl) : q;
      const line = (q !== qr || q !== qd);
      const k = (j * nx + i) * 4;
      d[k] = line ? Math.round(R * 0.55) : R;
      d[k + 1] = line ? Math.round(G * 0.55) : G;
      d[k + 2] = line ? Math.round(B * 0.55) : B;
      d[k + 3] = 255;
    }
  }
  /* 一度オフスクリーンに置いてから拡大して貼る */
  const off = document.createElement('canvas');
  off.width = nx; off.height = ny;
  off.getContext('2d').putImageData(img, 0, 0);
  c.save();
  c.beginPath(); c.rect(x0, y0, x1 - x0, y1 - y0); c.clip();
  c.imageSmoothingEnabled = true;
  c.drawImage(off, x0, y0, x1 - x0, y1 - y0);
  c.restore();
  return { vmin: vmin, vmax: vmax };
};

/* --------------------------------------------------------------------
   ①：拘束条件つきの最小化
   -------------------------------------------------------------------- */
Sim.prototype.drawCon = function(){
  const c = this.ctx, W = this.W, H = this.H, p = this.p, self = this;
  const narrow = W < 680;
  const gap = narrow ? 28 : 40, padL = narrow ? 46 : 64, padR = 14, padT = 16, padB = 46;
  const pw = (W - padL * 2 - padR - gap) / 2;
  const A0 = padL, A1 = padL + pw, B0 = A1 + gap + padL, B1 = W - padR;
  const y0 = padT, y1 = H - padB;
  const L = Math.max(2.3, 1.18 * Math.sqrt(2 / Math.max(0.05, 1 - p.S)));
  const X = v => A0 + (v + L) / (2 * L) * (A1 - A0);
  const Y = v => y1 - (v + L) / (2 * L) * (y1 - y0);

  c.clearRect(0, 0, W, H);

  /* ---- 左：c_A–c_B 平面 ---- */
  this.field(A0, y0, A1, y1, L, function(a, b){ return hExp(p, a, b); }, 18);
  frame(c, A0, y0, A1, y1, 'c_A', 'c_B');
  c.save(); c.beginPath(); c.rect(A0, y0, A1 - A0, y1 - y0); c.clip();

  /* 座標軸 */
  c.strokeStyle = 'rgba(31,35,40,.35)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(A0, Y(0)); c.lineTo(A1, Y(0)); c.moveTo(X(0), y0); c.lineTo(X(0), y1); c.stroke();

  /* 拘束条件の楕円 */
  c.strokeStyle = '#00695c'; c.lineWidth = 2.6;
  c.beginPath();
  for (let i = 0; i <= 400; i++){
    const q = ellipse(p, 2 * Math.PI * i / 400);
    if (i === 0) c.moveTo(X(q[0]), Y(q[1])); else c.lineTo(X(q[0]), Y(q[1]));
  }
  c.closePath(); c.stroke();

  /* 停留点（永年方程式の解）＝ 等高線と楕円が接する 4 点 */
  const r = this.roots();
  r.forEach(function(eps, k){
    [1, -1].forEach(function(sg){
      const q = coefFor(p, eps, sg);
      if (!isFinite(q[0])) return;
      c.fillStyle = k === 0 ? '#f9a825' : 'rgba(249,168,37,.55)';
      c.beginPath(); c.arc(X(q[0]), Y(q[1]), 5.2, 0, 6.2832); c.fill();
      c.strokeStyle = '#8a5a00'; c.lineWidth = 1.2; c.stroke();
    });
  });

  /* いま見ている点と、2 つの勾配 */
  const cur = ellipse(p, this.th);
  const gh = gradH(p, cur[0], cur[1]), gg = gradG(p, cur[0], cur[1]);
  const sc = 0.32 * (A1 - A0) / (2 * L);
  const nh = Math.hypot(gh[0], gh[1]), ng = Math.hypot(gg[0], gg[1]);
  if (nh > 1e-9) arrow(c, X(cur[0]), Y(cur[1]),
      X(cur[0]) + gh[0] / nh * sc * 2 * L * 0.55, Y(cur[1]) - gh[1] / nh * sc * 2 * L * 0.55, '#0f4c81', 2.4);
  if (ng > 1e-9) arrow(c, X(cur[0]), Y(cur[1]),
      X(cur[0]) + gg[0] / ng * sc * 2 * L * 0.42, Y(cur[1]) - gg[1] / ng * sc * 2 * L * 0.42, '#00695c', 2.4);
  c.fillStyle = '#c62828';
  c.beginPath(); c.arc(X(cur[0]), Y(cur[1]), 5, 0, 6.2832); c.fill();
  c.restore();

  legendBox(c, A0 + 8, y0 + 8, [
    ['#0f4c81', '∇⟨Ψ|H|Ψ⟩'],
    ['#00695c', '∇⟨Ψ|Ψ⟩']
  ]);

  /* ---- 右：楕円に沿ったエネルギー ---- */
  const NP = 360;
  let elo = Infinity, ehi = -Infinity;
  const vals = [];
  for (let i = 0; i <= NP; i++){
    const q = ellipse(p, 2 * Math.PI * i / NP), v = 0.5 * hExp(p, q[0], q[1]);
    vals.push(v);
    if (v < elo) elo = v; if (v > ehi) ehi = v;
  }
  const pad = 0.12 * (ehi - elo) + 1e-9;
  elo -= pad; ehi += pad;
  const TX = t => B0 + t / (2 * Math.PI) * (B1 - B0);
  const TY = v => y1 - (v - elo) / (ehi - elo) * (y1 - y0);
  c.fillStyle = '#fff'; c.fillRect(B0, y0, B1 - B0, y1 - y0);
  c.strokeStyle = 'rgba(31,35,40,.07)'; c.lineWidth = 1; c.beginPath();
  for (let k = 0; k <= 4; k++){ c.moveTo(TX(k * Math.PI / 2), y0); c.lineTo(TX(k * Math.PI / 2), y1); }
  c.stroke();
  frame(c, B0, y0, B1, y1, '楕円の上の位置 θ', 'E = ½⟨Ψ|H|Ψ⟩ [eV]');
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'top';
  ['0', 'π/2', 'π', '3π/2', '2π'].forEach(function(s, k){ c.fillText(s, TX(k * Math.PI / 2), y1 + 4); });
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let k = 0; k <= 3; k++){
    const v = elo + (ehi - elo) * k / 3;
    c.fillText(v.toFixed(1), B0 - 4, TY(v));
  }
  c.save(); c.beginPath(); c.rect(B0, y0, B1 - B0, y1 - y0); c.clip();
  /* 根の高さに水平線 */
  r.forEach(function(eps, k){
    c.strokeStyle = k === 0 ? 'rgba(21,101,192,.55)' : 'rgba(198,40,40,.5)';
    c.lineWidth = 1.4; c.setLineDash([4, 3]);
    c.beginPath(); c.moveTo(B0, TY(2 * eps)); c.lineTo(B1, TY(2 * eps)); c.stroke(); c.setLineDash([]);
    c.fillStyle = k === 0 ? '#1565c0' : '#c62828'; c.font = '10px ' + CFONT;
    c.textAlign = 'left'; c.textBaseline = 'bottom';
    c.fillText((k === 0 ? '2ε_b = ' : '2ε_a = ') + (2 * eps).toFixed(2) + ' eV', B0 + 4, TY(2 * eps) - 2);
  });
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.4; c.beginPath();
  for (let i = 0; i <= NP; i++){
    const t = 2 * Math.PI * i / NP;
    if (i === 0) c.moveTo(TX(t), TY(vals[i])); else c.lineTo(TX(t), TY(vals[i]));
  }
  c.stroke();
  const cv0 = 0.5 * hExp(p, cur[0], cur[1]);
  c.strokeStyle = 'rgba(198,40,40,.55)'; c.lineWidth = 1; c.setLineDash([2, 2]);
  c.beginPath(); c.moveTo(TX(this.th), y0); c.lineTo(TX(this.th), y1); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#c62828';
  c.beginPath(); c.arc(TX(this.th), TY(cv0), 4.6, 0, 6.2832); c.fill();
  c.restore();
};

/* --------------------------------------------------------------------
   ②：未定乗数 ε と永年方程式
   -------------------------------------------------------------------- */
Sim.prototype.drawLam = function(){
  const c = this.ctx, W = this.W, H = this.H, p = this.p, eps = this.eps;
  const narrow = W < 680;
  const gap = narrow ? 28 : 40, padL = narrow ? 46 : 64, padR = 14, padT = 16, padB = 46;
  const pw = (W - padL * 2 - padR - gap) / 2;
  const A0 = padL, A1 = padL + pw, B0 = A1 + gap + padL, B1 = W - padR;
  const y0 = padT, y1 = H - padB;
  const L = Math.max(2.3, 1.18 * Math.sqrt(2 / Math.max(0.05, 1 - p.S)));
  const X = v => A0 + (v + L) / (2 * L) * (A1 - A0);
  const Y = v => y1 - (v + L) / (2 * L) * (y1 - y0);

  c.clearRect(0, 0, W, H);

  /* ---- 左：F の等高線 ---- */
  this.field(A0, y0, A1, y1, L, function(a, b){ return lagF(p, eps, a, b); }, 18);
  frame(c, A0, y0, A1, y1, 'c_A', 'c_B');
  c.save(); c.beginPath(); c.rect(A0, y0, A1 - A0, y1 - y0); c.clip();
  c.strokeStyle = 'rgba(31,35,40,.35)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(A0, Y(0)); c.lineTo(A1, Y(0)); c.moveTo(X(0), y0); c.lineTo(X(0), y1); c.stroke();

  /* 楕円 */
  c.strokeStyle = '#00695c'; c.lineWidth = 2.2;
  c.beginPath();
  for (let i = 0; i <= 400; i++){
    const q = ellipse(p, 2 * Math.PI * i / 400);
    if (i === 0) c.moveTo(X(q[0]), Y(q[1])); else c.lineTo(X(q[0]), Y(q[1]));
  }
  c.closePath(); c.stroke();

  /* ∂F/∂c_A = 0 と ∂F/∂c_B = 0 は、どちらも原点を通る直線。
     この 2 本が重なるとき（＝行列式が 0）だけ、原点以外の解が生まれる。 */
  const a11 = p.aA - 2 * eps, a12 = p.beta - 2 * eps * p.S, a22 = p.aB - 2 * eps;
  const drawLine = function(A, B, col, dash){
    /* A·c_A + B·c_B = 0 */
    const n = Math.hypot(A, B);
    if (n < 1e-12) return null;
    const dx = -B / n, dy = A / n;               // 方向ベクトル
    c.strokeStyle = col; c.lineWidth = 2.2; c.setLineDash(dash || []);
    c.beginPath();
    c.moveTo(X(-dx * L * 3), Y(-dy * L * 3));
    c.lineTo(X(dx * L * 3), Y(dy * L * 3));
    c.stroke(); c.setLineDash([]);
    return [dx, dy];
  };
  const d1 = drawLine(a11, a12, '#0f4c81');
  const d2 = drawLine(a12, a22, '#2e7d32', [6, 4]);
  this.lineAngle = (d1 && d2)
    ? Math.acos(clamp(Math.abs(d1[0] * d2[0] + d1[1] * d2[1]), 0, 1)) * 180 / Math.PI
    : NaN;

  /* 2 直線がほぼ重なっていれば、楕円との交点が答え */
  if (isFinite(this.lineAngle) && this.lineAngle < 3){
    const q = coefFor(p, eps, 1), q2 = coefFor(p, eps, -1);
    [q, q2].forEach(function(t){
      if (!isFinite(t[0])) return;
      c.fillStyle = '#f9a825';
      c.beginPath(); c.arc(X(t[0]), Y(t[1]), 5.4, 0, 6.2832); c.fill();
      c.strokeStyle = '#8a5a00'; c.lineWidth = 1.2; c.stroke();
    });
  }
  c.fillStyle = '#c62828';
  c.beginPath(); c.arc(X(0), Y(0), 3.6, 0, 6.2832); c.fill();
  c.restore();

  legendBox(c, A0 + 8, y0 + 8, [
    ['#0f4c81', '∂F/∂c_A = 0'],
    ['#2e7d32', '∂F/∂c_B = 0'],
    [null, '2 直線のなす角 ' + (isFinite(this.lineAngle) ? this.lineAngle.toFixed(2) + '°' : '—')]
  ]);

  /* ---- 右：永年方程式の行列式 ---- */
  const er = this.epsRange();
  let dlo = Infinity, dhi = -Infinity;
  const ds = [];
  for (let i = 0; i <= 300; i++){
    const e = er[0] + (er[1] - er[0]) * i / 300, v = secDet(p, e);
    ds.push(v); if (v < dlo) dlo = v; if (v > dhi) dhi = v;
  }
  const dp = 0.1 * (dhi - dlo) + 1e-9; dlo -= dp; dhi += dp;
  const EX = e => B0 + (e - er[0]) / (er[1] - er[0]) * (B1 - B0);
  const DY = v => y1 - (v - dlo) / (dhi - dlo) * (y1 - y0);
  c.fillStyle = '#fff'; c.fillRect(B0, y0, B1 - B0, y1 - y0);
  frame(c, B0, y0, B1, y1, '未定乗数 ε [eV]', '行列式 D(ε)');
  c.save(); c.beginPath(); c.rect(B0, y0, B1 - B0, y1 - y0); c.clip();
  c.strokeStyle = 'rgba(31,35,40,.35)'; c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(B0, DY(0)); c.lineTo(B1, DY(0)); c.stroke();
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.4; c.beginPath();
  for (let i = 0; i <= 300; i++){
    const e = er[0] + (er[1] - er[0]) * i / 300;
    if (i === 0) c.moveTo(EX(e), DY(ds[i])); else c.lineTo(EX(e), DY(ds[i]));
  }
  c.stroke();
  const r = this.roots();
  r.forEach(function(e, k){
    c.strokeStyle = k === 0 ? 'rgba(21,101,192,.8)' : 'rgba(198,40,40,.8)';
    c.lineWidth = 1.5; c.setLineDash([4, 3]);
    c.beginPath(); c.moveTo(EX(e), y0); c.lineTo(EX(e), y1); c.stroke(); c.setLineDash([]);
    c.fillStyle = k === 0 ? '#1565c0' : '#c62828';
    c.beginPath(); c.arc(EX(e), DY(0), 5, 0, 6.2832); c.fill();
    c.font = 'bold 10px ' + CFONT; c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText((k === 0 ? 'ε_b' : 'ε_a') + ' = ' + e.toFixed(2), EX(e), y0 + 3);
  });
  c.strokeStyle = 'rgba(138,90,0,.75)'; c.lineWidth = 1.4; c.setLineDash([2, 2]);
  c.beginPath(); c.moveTo(EX(eps), y0); c.lineTo(EX(eps), y1); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#8a5a00';
  c.beginPath(); c.arc(EX(eps), DY(secDet(p, eps)), 4.6, 0, 6.2832); c.fill();
  c.restore();
};

/* --------------------------------------------------------------------
   ③：エネルギー準位と波動関数
   -------------------------------------------------------------------- */
Sim.prototype.drawOrb = function(){
  const c = this.ctx, W = this.W, H = this.H, p = this.p;
  const gap = 34, padL = W < 680 ? 46 : 62, padR = 12, padT = 16, padB = 28;
  const pw = (W - padL - padR - gap) * 0.44;
  const A0 = padL, A1 = padL + pw, B0 = A1 + gap, B1 = W - padR;
  const y0 = padT, y1 = H - padB;
  const r = this.roots();
  c.clearRect(0, 0, W, H);
  if (r.length < 2) return;
  const Eb = 2 * r[0], Ea = 2 * r[1];

  /* ---- 左：エネルギー準位図 ---- */
  let lo = Math.min(Eb, p.aA, p.aB), hi = Math.max(Ea, p.aA, p.aB);
  const pad = 0.22 * (hi - lo) + 0.2;
  lo -= pad; hi += pad;
  const EY = v => y1 - (v - lo) / (hi - lo) * (y1 - y0);
  c.fillStyle = '#fff'; c.fillRect(A0, y0, A1 - A0, y1 - y0);
  frame(c, A0, y0, A1, y1, '', 'エネルギー [eV]');
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let k = 0; k <= 4; k++){
    const v = lo + (hi - lo) * k / 4;
    c.fillText(v.toFixed(1), A0 - 4, EY(v));
    c.strokeStyle = 'rgba(31,35,40,.07)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(A0, EY(v)); c.lineTo(A1, EY(v)); c.stroke();
  }
  const wL = (A1 - A0) * 0.20, xa = A0 + (A1 - A0) * 0.06, xm = A0 + (A1 - A0) * 0.40, xb = A0 + (A1 - A0) * 0.74;
  /* 点線でつなぐ。左の原子は中央の準位の「左端」へ、右の原子は「右端」へ。
     どちらも中央の準位を跨がないようにする（分子軌道ダイアグラムの作法）。 */
  c.strokeStyle = 'rgba(31,35,40,.28)'; c.lineWidth = 1; c.setLineDash([3, 3]);
  [[xa + wL, p.aA, xm], [xb, p.aB, xm + wL]].forEach(function(t){
    c.beginPath(); c.moveTo(t[0], EY(t[1])); c.lineTo(t[2], EY(Eb)); c.stroke();
    c.beginPath(); c.moveTo(t[0], EY(t[1])); c.lineTo(t[2], EY(Ea)); c.stroke();
  });
  c.setLineDash([]);
  const lvl = function(x, w, E, col, lab, elec){
    c.strokeStyle = col; c.lineWidth = 3;
    c.beginPath(); c.moveTo(x, EY(E)); c.lineTo(x + w, EY(E)); c.stroke();
    c.fillStyle = col; c.font = 'bold 10px ' + CFONT;
    c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText(lab, x + w / 2, EY(E) - 5);
    if (elec){
      c.strokeStyle = '#15202b'; c.lineWidth = 1.6;
      for (let i = 0; i < elec; i++){
        const ex = x + w * (0.34 + 0.32 * i), dir = i === 0 ? 1 : -1;
        c.beginPath(); c.moveTo(ex, EY(E) - 8 * dir); c.lineTo(ex, EY(E) + 8 * dir); c.stroke();
        c.beginPath();
        c.moveTo(ex, EY(E) - 8 * dir);
        c.lineTo(ex - 3, EY(E) - 3.5 * dir);
        c.moveTo(ex, EY(E) - 8 * dir);
        c.lineTo(ex + 3, EY(E) - 3.5 * dir);
        c.stroke();
      }
    }
  };
  lvl(xa, wL, p.aA, '#5c6670', 'α_A', 1);
  lvl(xb, wL, p.aB, '#5c6670', 'α_B', 1);
  lvl(xm, wL, Ea, '#c62828', '2ε_a', 0);
  lvl(xm, wL, Eb, '#1565c0', '2ε_b', 2);
  /* ギャップ */
  c.strokeStyle = '#8a5a00'; c.lineWidth = 1.4;
  const gx = xm + wL + 20;
  c.beginPath(); c.moveTo(gx, EY(Eb)); c.lineTo(gx, EY(Ea)); c.stroke();
  c.fillStyle = '#8a5a00'; c.font = '10px ' + CFONT;
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText('Δ = ' + (Ea - Eb).toFixed(2) + ' eV', gx + 4, (EY(Eb) + EY(Ea)) / 2);

  /* ---- 右：波動関数の断面 ---- */
  const R = distFromS(p.S);                       // 重なり積分から核間距離を逆算
  const xh = Math.max(4.5, R / 2 + 4.2);
  const PX = x => B0 + (x + xh) / (2 * xh) * (B1 - B0);
  const cb = coefFor(p, r[0], 1), ca = coefFor(p, r[1], 1);
  const psi = function(x, x0){ return Math.exp(-Math.abs(x - x0)) / Math.sqrt(Math.PI); };
  /* 上下の並びは、左のエネルギー準位図に合わせる。
     高い方の解（反結合性）を上、低い方の解（結合性）を下に置く。 */
  const rows = [
    { cc: ca, col: '#c62828', lab: '反結合性 Ψ_a（高い方の解）', y: y0, hh: (y1 - y0) / 2 - 6 },
    { cc: cb, col: '#1565c0', lab: '結合性 Ψ_b（低い方の解）', y: y0 + (y1 - y0) / 2 + 6, hh: (y1 - y0) / 2 - 6 }
  ];
  const self = this;
  rows.forEach(function(row){
    const ry0 = row.y, ry1 = row.y + row.hh, mid = (ry0 + ry1) / 2;
    c.fillStyle = '#fff'; c.fillRect(B0, ry0, B1 - B0, row.hh);
    /* 縦の目盛は共通に取る */
    let m = 0;
    for (let i = 0; i <= 200; i++){
      const x = -xh + 2 * xh * i / 200;
      m = Math.max(m, Math.abs(row.cc[0] * psi(x, -R / 2) + row.cc[1] * psi(x, R / 2)));
    }
    m = Math.max(m, 1e-6);
    const VY = v => mid - v / (m * 1.25) * (row.hh / 2 - 4);
    c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
    c.strokeRect(B0, ry0, B1 - B0, row.hh);
    c.strokeStyle = 'rgba(31,35,40,.30)';
    c.beginPath(); c.moveTo(B0, mid); c.lineTo(B1, mid); c.stroke();
    c.save(); c.beginPath(); c.rect(B0, ry0, B1 - B0, row.hh); c.clip();
    /* |Ψ|² */
    if (self.showSq){
      c.fillStyle = row.col === '#1565c0' ? 'rgba(21,101,192,.14)' : 'rgba(198,40,40,.14)';
      c.beginPath(); c.moveTo(PX(-xh), mid);
      for (let i = 0; i <= 300; i++){
        const x = -xh + 2 * xh * i / 300;
        const v = row.cc[0] * psi(x, -R / 2) + row.cc[1] * psi(x, R / 2);
        c.lineTo(PX(x), VY(v * v / m));
      }
      c.lineTo(PX(xh), mid); c.closePath(); c.fill();
    }
    /* もとの原子軌道 */
    c.strokeStyle = 'rgba(92,102,112,.65)'; c.lineWidth = 1.2; c.setLineDash([4, 3]);
    [[-R / 2, row.cc[0]], [R / 2, row.cc[1]]].forEach(function(t){
      c.beginPath();
      for (let i = 0; i <= 200; i++){
        const x = -xh + 2 * xh * i / 200, v = t[1] * psi(x, t[0]);
        if (i === 0) c.moveTo(PX(x), VY(v)); else c.lineTo(PX(x), VY(v));
      }
      c.stroke();
    });
    c.setLineDash([]);
    /* Ψ */
    c.strokeStyle = row.col; c.lineWidth = 2.4;
    c.beginPath();
    for (let i = 0; i <= 400; i++){
      const x = -xh + 2 * xh * i / 400;
      const v = row.cc[0] * psi(x, -R / 2) + row.cc[1] * psi(x, R / 2);
      if (i === 0) c.moveTo(PX(x), VY(v)); else c.lineTo(PX(x), VY(v));
    }
    c.stroke();
    /* 核 */
    [-R / 2, R / 2].forEach(function(x0, k){
      c.fillStyle = '#8a5a00';
      c.beginPath(); c.arc(PX(x0), ry1 - 6, 3.4, 0, 6.2832); c.fill();
      c.fillStyle = '#8a5a00'; c.font = '9px ' + CFONT;
      c.textAlign = 'center'; c.textBaseline = 'bottom';
      c.fillText(k ? 'B' : 'A', PX(x0), ry1 - 11);
    });
    c.restore();
    c.fillStyle = row.col; c.font = 'bold 10px ' + CFONT;
    c.textAlign = 'left'; c.textBaseline = 'top';
    c.fillText(row.lab, B0 + 6, ry0 + 4);
  });
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'right'; c.textBaseline = 'top';
  c.fillText('核間距離 R = ' + R.toFixed(2) + ' a₀（S から逆算）', B1, y1 + 4);
};

Sim.prototype.draw = function(){
  this.resize();
  if (!this.W) return;
  if (this.key === 'con') this.drawCon();
  else if (this.key === 'lam') this.drawLam();
  else this.drawOrb();
};

   8. 数式・読み取り値・解説

const EQ_ORB =
  '<math display="block"><mrow>'
  + '<msub><mi>ε</mi><mtext>b</mtext></msub><mo>=</mo>'
  + '<mfrac><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow><mrow><mn>2</mn><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>S</mi><mo stretchy="false">)</mo></mrow></mfrac>'
  + '<mo>,</mo><mspace width="1.6em"></mspace>'
  + '<msub><mi>ε</mi><mtext>a</mtext></msub><mo>=</mo>'
  + '<mfrac><mrow><mi>α</mi><mo>−</mo><mi>β</mi></mrow><mrow><mn>2</mn><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>S</mi><mo stretchy="false">)</mo></mrow></mfrac>'
  + '<mspace width="1.8em"></mspace>'
  + '<msub><mi>Ψ</mi><mtext>b,a</mtext></msub><mo>=</mo>'
  + '<mfrac><mn>1</mn><msqrt><mrow><mn>1</mn><mo>±</mo><mi>S</mi></mrow></msqrt></mfrac>'
  + '<mo stretchy="false">(</mo><msub><mi>ψ</mi><mtext>A</mtext></msub><mo>±</mo><msub><mi>ψ</mi><mtext>B</mtext></msub><mo stretchy="false">)</mo>'
  + '</mrow></math>'
  + '<span class="cmt">同種原子（<i>α</i><sub>A</sub> = <i>α</i><sub>B</sub> = <i>α</i>）のとき</span>';

/* --------------------------------------------------------------------
   読み取り値
   -------------------------------------------------------------------- */
Sim.prototype.updateReadout = function(){
  const p = this.p, r = this.roots(), R = [];

  /* β と S は独立ではない ―― 低い方の解が「同位相」でなくなったら警告する */
  let warn = null;
  if (r.length === 2){
    const cb = coefFor(p, r[0], 1);
    if (isFinite(cb[0]) && cb[0] * cb[1] < 0){
      const thr = p.S * (p.aA + p.aB) / 2;
      warn = '<b>⚠ この α, β, S の組は現実には起こりません。</b>'
        + 'いま低い方の解が <i>ψ</i><sub>A</sub> − <i>ψ</i><sub>B</sub>（節のある形）になっていて、'
        + '<b>結合性と反結合性が入れ替わって</b>います。'
        + 'β と S は独立ではなく、<i>β</i> &lt; <i>Sα</i> ―― いまの値なら <b>β &lt; '
        + thr.toFixed(2) + ' eV</b> ―― でないとこうなります。'
        + 'β をもっと負にするか、S を小さくしてください。';
    }
  }
  this.alert.innerHTML = warn || '';
  this.alert.hidden = !warn;

  if (this.key === 'con'){
    const cur = ellipse(p, this.th);
    const gh = gradH(p, cur[0], cur[1]), gg = gradG(p, cur[0], cur[1]);
    const nh = Math.hypot(gh[0], gh[1]), ng = Math.hypot(gg[0], gg[1]);
    const cosang = (nh > 1e-12 && ng > 1e-12) ? (gh[0] * gg[0] + gh[1] * gg[1]) / (nh * ng) : NaN;
    const ang = Math.acos(clamp(Math.abs(cosang), 0, 1)) * 180 / Math.PI;
    const epsHere = ng > 1e-12 ? (gh[0] * gg[0] + gh[1] * gg[1]) / (ng * ng) : NaN;
    const E = 0.5 * hExp(p, cur[0], cur[1]);
    const near = ang < 0.5;
    R.push(['楕円の上の位置 θ', this.th.toFixed(3) + ' rad']);
    R.push(['係数 (c_A, c_B)', '(' + cur[0].toFixed(4) + ' , ' + cur[1].toFixed(4) + ')']);
    R.push(['⟨Ψ|Ψ⟩（拘束条件）', norm(p, cur[0], cur[1]).toFixed(6) + '　＝ 2']);
    R.push(['⟨Ψ|H|Ψ⟩', fmt(hExp(p, cur[0], cur[1]), 4) + ' eV']);
    R.push(['E = ½⟨Ψ|H|Ψ⟩', fmt(E, 4) + ' eV']);
    R.push(['2 つの勾配のなす角', ang.toFixed(3) + '°' + (near ? '　平行！' : ''), near ? 'hi' : '']);
    R.push(['そこでの ε（勾配の比）', fmt(epsHere, 4) + ' eV']);
    if (r.length === 2){
      R.push(['いちばん低い E（＝2ε_b）', fmt(2 * r[0], 4) + ' eV', 'hi']);
      R.push(['いまの E との差', fmt(E - 2 * r[0], 4) + ' eV']);
    }
    this.eqbox.innerHTML = EQ_CON;
    this.body.innerHTML = NOTE_CON;
  } else if (this.key === 'lam'){
    const eps = this.eps, D = secDet(p, eps);
    const atRoot = isFinite(this.lineAngle) && this.lineAngle < 3;
    R.push(['いま試している ε', fmt(eps, 4) + ' eV']);
    R.push(['行列式 D(ε)', fmt(D, 4), Math.abs(D) < 1e-6 ? 'hi' : '']);
    R.push(['2 直線のなす角', isFinite(this.lineAngle) ? this.lineAngle.toFixed(3) + '°' : '—',
      atRoot ? 'hi' : 'bad']);
    R.push(['自明でない解', atRoot ? 'ある（谷ができている）' : 'ない（c = 0 だけ）', atRoot ? 'hi' : 'bad']);
    if (r.length === 2){
      R.push(['根 ε_b（低い方）', fmt(r[0], 4) + ' eV']);
      R.push(['根 ε_a（高い方）', fmt(r[1], 4) + ' eV']);
    }
    if (atRoot){
      const q = coefFor(p, eps, 1);
      R.push(['そのときの (c_A, c_B)', '(' + q[0].toFixed(4) + ' , ' + q[1].toFixed(4) + ')']);
      R.push(['E = ½⟨Ψ|H|Ψ⟩ = 2ε', fmt(0.5 * hExp(p, q[0], q[1]), 4) + ' eV']);
    } else {
      R.push(['いちばん近い根までの差',
        r.length === 2 ? fmt(Math.min(Math.abs(eps - r[0]), Math.abs(eps - r[1])), 4) + ' eV' : '—']);
      R.push(['', '']);
    }
    this.eqbox.innerHTML = EQ_LAM;
    this.body.innerHTML = NOTE_LAM;
  } else {
    if (r.length === 2){
      const Eb = 2 * r[0], Ea = 2 * r[1];
      const cb = coefFor(p, r[0], 1), ca = coefFor(p, r[1], 1);
      const bc = bondCharacter(p);
      const before = p.aA + p.aB, after = 2 * Eb;
      R.push(['ε_b（低い根）', fmt(r[0], 4) + ' eV']);
      R.push(['ε_a（高い根）', fmt(r[1], 4) + ' eV']);
      R.push(['結合性軌道の準位 2ε_b', fmt(Eb, 4) + ' eV', 'hi']);
      R.push(['反結合性軌道の準位 2ε_a', fmt(Ea, 4) + ' eV', 'bad']);
      R.push(['ギャップ 2ε_a − 2ε_b', fmt(Ea - Eb, 4) + ' eV']);
      R.push(['結合性の (c_A, c_B)', '(' + cb[0].toFixed(4) + ' , ' + cb[1].toFixed(4) + ')']);
      R.push(['反結合性の (c_A, c_B)', '(' + ca[0].toFixed(4) + ' , ' + ca[1].toFixed(4) + ')']);
      R.push(['電子は A と B のどちら寄りか',
        Math.abs(cb[0] - cb[1]) < 1e-6 ? '半々（完全な共有結合）'
          : (Math.abs(cb[1]) > Math.abs(cb[0]) ? 'B 寄り ' : 'A 寄り ')
            + (100 * Math.max(cb[0] * cb[0], cb[1] * cb[1]) / (cb[0] * cb[0] + cb[1] * cb[1])).toFixed(1) + ' %']);
      R.push(['結合前（2 電子ぶん）', fmt(before, 4) + ' eV']);
      R.push(['結合後（2 電子ぶん）', fmt(after, 4) + ' eV']);
      R.push(['安定化エネルギー', fmt(after - before, 4) + ' eV', after < before ? 'hi' : 'bad']);
      R.push(['共有結合度 Δε_c/Δε', (bc.cov * 100).toFixed(1) + ' %']);
      R.push(['イオン結合度 Δε_i/Δε', (bc.ion * 100).toFixed(1) + ' %']);
      R.push(['核間距離（S から逆算）', distFromS(p.S).toFixed(3) + ' a₀ = ' + (distFromS(p.S) * 0.5292).toFixed(3) + ' Å']);
    }
    this.eqbox.innerHTML = EQ_ORB;
    this.body.innerHTML = NOTE_ORB;
  }

  this.readout.innerHTML = R.map(function(t){
    return '<div' + (t[2] ? ' class="' + t[2] + '"' : '') + '><span>' + t[0] + '</span><span>' + t[1] + '</span></div>';
  }).join('');
};

Sim.prototype.syncCtl = function(){
  const p = this.p, U = { aA:' eV', aB:' eV', beta:' eV', S:'' };
  const NM = { aA:'α_A = ', aB:'α_B = ', beta:'β = ', S:'S = ' };
  const self = this;
  ['aA', 'aB', 'beta', 'S'].forEach(function(k){
    const s = self.sl[k];
    s.inp.value = String(p[k]);
    s.lab.innerHTML = NM[k] + (k === 'S' ? p[k].toFixed(2) : p[k].toFixed(1)) + U[k];
  });
  if (this.thLab){ this.thLab.innerHTML = 'θ = ' + this.th.toFixed(2); this.thIn.value = String(this.th); }
  if (this.epsLab){
    const r = this.epsRange();
    this.epsLab.innerHTML = 'ε = ' + this.eps.toFixed(2) + ' eV';
    this.epsIn.value = String(clamp((this.eps - r[0]) / (r[1] - r[0]), 0, 1));
  }
};

Sim.prototype.refresh = function(){
  this.syncCtl();
  this.draw();
  this.updateReadout();
  postHeight();
};

/* --------------------------------------------------------------------
   解説
   -------------------------------------------------------------------- */
const NOTE_CON =
  '<div class="note key"><b>何を探しているのか。</b>'
  + '分子軌道 Ψ = <i>c</i><sub>A</sub><i>ψ</i><sub>A</sub> + <i>c</i><sub>B</sub><i>ψ</i><sub>B</sub> の'
  + '<b>係数 2 つを決めたい</b>。決め方は「エネルギーがいちばん低くなるように」です（変分原理）。'
  + 'ただし勝手に大きくしてよいわけではなく、<b>電子は 2 個しかない</b> ―― '
  + 'これが ⟨Ψ|Ψ⟩ = 2 という拘束条件です。'
  + '左の図で、色が<b>エネルギーの高さ</b>（青いほど低い）、緑の楕円が<b>拘束条件</b>。'
  + '<b>楕円の上だけを歩いて、いちばん低いところを探す</b>のが、この問題です。</div>'
  + '<div class="note"><b>θ を動かして、楕円を一周してみてください。</b>'
  + '右のグラフがそのときのエネルギーです。山が 2 つ、谷が 2 つあります。'
  + '谷の底（＝黄色い点）で、<b>等高線が楕円にちょうど接します</b>。</div>'
  + '<div class="note key"><b>接するとき、何が起きているか。</b>'
  + '接していないうちは、楕円に沿って動くとエネルギーが変わります ―― まだ下げる余地がある。'
  + '接した瞬間、<b>楕円に沿った方向にはエネルギーが変化しなくなります</b>。'
  + 'これは「エネルギーの勾配が、楕円に垂直を向いた」ということ。'
  + '楕円に垂直な向きは ∇⟨Ψ|Ψ⟩ なので、'
  + '<b>∇(½⟨Ψ|H|Ψ⟩) = ε·∇⟨Ψ|Ψ⟩</b> ―― 2 本の矢印が平行になります。'
  + 'この<b>比例定数 ε が、Lagrange の未定乗数</b>です。'
  + '読み取り値の「2 つの勾配のなす角」が 0° になるところを探してみてください。</div>'
  + '<div class="note"><b>未定乗数は、ただの計算の道具ではありません。</b>'
  + 'あとで分かるように、この ε は<b>分子軌道のエネルギー準位そのもの</b>（の半分）です。'
  + '「拘束条件の強さ」を表す量が、そのまま物理量になっている ―― '
  + '解析力学の一般化力や、熱力学の化学ポテンシャルと同じ構図です。</div>'
  + '<div class="note"><b>山（いちばん高い点）にも意味があります。</b>'
  + '「いちばん高い点へ」を押すと、もう 1 つの停留点に行きます。'
  + 'これが<b>反結合性軌道</b>です。永年方程式が 2 次式で根が 2 つ出るのは、'
  + '<b>谷と山が 1 つずつある</b>ことに対応しています。</div>';

const NOTE_LAM =
  '<div class="note key"><b>未定乗数法の仕掛け。</b>'
  + '<i>F</i> = <i>E</i> − <i>ε</i>(⟨Ψ|Ψ⟩ − 2) と置いて、'
  + '<i>c</i><sub>A</sub>, <i>c</i><sub>B</sub>, <i>ε</i> の 3 つで偏微分して 0 と置きます。'
  + '<b>∂F/∂ε = 0 が、拘束条件そのものを吐き出してくれる</b> ―― これが仕掛けです。'
  + 'だから「拘束つきの 2 変数問題」を「拘束なしの 3 変数問題」に置き換えられます。</div>'
  + '<div class="note"><b>左の図の 2 本の直線。</b>'
  + '青が ∂F/∂c<sub>A</sub> = 0、緑が ∂F/∂c<sub>B</sub> = 0 の直線で、どちらも原点を通ります。'
  + '2 本が交わるのは<b>ふつう原点だけ</b> ―― つまり <i>c</i><sub>A</sub> = <i>c</i><sub>B</sub> = 0 で、'
  + '波動関数が消えてしまいます。それでは困ります。</div>'
  + '<div class="note key"><b>ε をゆっくり動かしてみてください。</b>'
  + '2 本の直線が回って、あるところで<b>ぴたりと重なります</b>。'
  + '重なった瞬間、交点は「原点だけ」ではなく<b>1 本の直線まるごと</b>になり、'
  + 'そこに楕円との交点（黄色い点）が生まれます。'
  + '<b>2 本の式が同じ式になってしまう ＝ 行列式が 0</b>。'
  + 'これが「行列式を 0 と置く」ことの中身で、その方程式が<b>永年方程式</b>です。'
  + '右のグラフで D(ε) が 0 を横切る点が、ちょうどそこです。</div>'
  + '<div class="note"><b>なぜ根が 2 つなのか。</b>'
  + '2×2 の行列式は ε の 2 次式なので、根は 2 つ。'
  + '低い方が<b>結合性軌道</b>、高い方が<b>反結合性軌道</b>です。'
  + '一般に、原子軌道を <i>n</i> 個並べれば <i>n</i>×<i>n</i> の永年方程式になり、'
  + '<b>分子軌道が <i>n</i> 本</b>出てきます。'
  + '（この形は「一般化固有値問題 <b>Hc = εSc</b>」そのもので、'
  + '第一原理計算のプログラムが実際に解いているのもこれです。）</div>'
  + '<div class="note warn"><b>「永年（secular）」という名前について。</b>'
  + '元は天体力学で、惑星の軌道が何世紀（saeculum）もかけてゆっくり変わる現象を'
  + '扱うときに出てきた方程式だからです。量子力学とは何の関係もないところから来た名前が、'
  + 'そのまま使われています。</div>';

const NOTE_ORB =
  '<div class="note key"><b>2 つの解の中身。</b>'
  + '低い方の解では <i>c</i><sub>A</sub> と <i>c</i><sub>B</sub> が<b>同符号</b>になり、'
  + '2 つの原子軌道が<b>足し合わさって</b>核と核の間に電子が溜まります（結合性軌道）。'
  + '高い方では<b>異符号</b>になり、核の間で波動関数が 0 になる ―― '
  + '<b>節（node）</b>ができて電子が追い出されます（反結合性軌道）。'
  + '右の図で、上下の |Ψ|² を見比べてみてください。</div>'
  + '<div class="note"><b>電子が「どちらから来たか分からない」ことが、結合の正体です。</b>'
  + '同種原子なら <i>c</i><sub>A</sub> = <i>c</i><sub>B</sub> ―― '
  + 'A から来たか B から来たか<b>まったく区別がつかない</b>状態です。'
  + 'そしてこのときに、エネルギーがいちばん下がります。'
  + '逆に α<sub>A</sub> と α<sub>B</sub> を大きく離すと係数が片方に偏り、'
  + '「電子は B にいる」とはっきりしてきます。それが<b>イオン結合</b>で、'
  + '同時に<b>安定化エネルギーが小さくなっていく</b>のが読み取り値で追えます。</div>'
  + '<div class="note"><b>極端な場合を試してみてください。</b>'
  + '<i>c</i><sub>A</sub> = 0, <i>c</i><sub>B</sub> = √2（電子が全部 B にいる）とすると、'
  + '<i>E</i> = ½·2α<sub>B</sub> = α<sub>B</sub> ―― <b>結合する前とまったく同じ</b>です。'
  + '100 % のイオン結合には<b>安定化が一切ありません</b>。'
  + '現実の「イオン結合」がそれでも安定なのは、共有結合の成分が必ず残っているからです。</div>'
  + '<div class="note key"><b>共有結合度とイオン結合度。</b>'
  + '重なりを無視（S = 0）すると、ギャップは'
  + ' Δε = √( ((α<sub>A</sub>−α<sub>B</sub>)/2)² + β² ) と、'
  + '<b>直角三角形の斜辺</b>の形になります。'
  + 'β（＝電子が行き来する効果）が共有結合ぶん Δε<sub>c</sub>、'
  + '準位差 |α<sub>A</sub>−α<sub>B</sub>|/2 がイオン結合ぶん Δε<sub>i</sub>。'
  + '<b>この 2 つは足して 100 % になるのではなく、2 乗して足すと 1 になります</b>'
  + '（Δε<sub>c</sub>² + Δε<sub>i</sub>² = Δε²）。'
  + '「共有結合 70 %・イオン結合 70 %」と出ても間違いではありません。</div>'
  + '<div class="note"><b>内殻の電子はなぜ結合に使われないのか。</b>'
  + 'プリセットの「内殻どうし」を選んでみてください。'
  + '深い準位ほど軌道が原子核に強く縛られて広がらないので、'
  + '<b>S も β も 0 に近づきます</b>。すると Δε ≒ −β ≒ 0 となり、'
  + '結合性軌道と反結合性軌道がほとんど同じ高さに並びます。'
  + '<b>両方に電子が入れば、下がった分と上がった分が打ち消し合って、得がありません</b>。'
  + '結合に効くのは価電子だけ、というのはこういうことです。</div>';

/* ========================================================================
   9. 立ち上げ
   ======================================================================== */
/* postHeight は Sim の生成中（refresh の中）から呼ばれる。let のままだと
   一時的死角（TDZ）に入るので、Sim を作る前に宣言しておく。 */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let only = null;
const mm = /[?&]only=(con|lam|orb)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');

['con', 'lam', 'orb'].forEach(function(key){
  const q = app.querySelector('[data-panel="' + key + '"]');
  if (!q) return;
  if (only && only !== key){ q.parentNode.removeChild(q); return; }
  sims[key] = new Sim(key, q);
});

let active = only || 'con';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(q){ q.hidden = (q.dataset.panel !== name); });
  sims[name].refresh();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].draw(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].refresh(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
