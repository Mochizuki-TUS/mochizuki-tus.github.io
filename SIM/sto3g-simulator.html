<body>
<div id="qsim">
  <h1>STO-nG ― Gauss 関数 3 本で，水素 1s を真似る</h1>
  <p class="lead">
    正しい形は Slater 型 e<sup>−<i>r</i></sup>，計算しやすい形は Gauss 型 e<sup>−<i>α</i><i>r</i>²</sup>．
    量子化学は「正しい形を，計算しやすい形の和で真似る」ことにしました——それが STO-<i>n</i>G 基底です（講義第 5・6 回）．
    ①で 1 本 → 2 本 → 3 本と増やして波動関数とエネルギーがどこまで良くなるかを，
    ②でその御利益の源である <b>Gauss 積の定理</b>と重なり積分 <i>S</i>(<i>R</i>) を見ます．
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="fit" role="tab">① Slater を Gauss で真似る</button>
    <button class="tab" data-tab="product" role="tab">② Gauss 積の定理と S(R)</button>
  </div>

  <section class="panel" data-panel="fit"></section>
  <section class="panel" data-panel="product" hidden></section>

  <p class="foot">
    長さは Bohr 半径 <i>a</i><sub>0</sub> 単位，Gauss 指数 <i>α</i> は <i>a</i><sub>0</sub><sup>−2</sup> 単位，エネルギーは eV です．
  </p>
</div>
<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数（講義第 5 回の STO-nG 係数）
   ------------------------------------------------------------------------
   φ^{STO-nG}(r) = Σ_i c_i (2α_i/π)^{3/4} e^{−α_i r²}（ζ = 1 の 1s へのフィット）
   ======================================================================== */
const EH = 27.211386, E1S = -13.606;
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
const STO = {
  1: [[1.0, 0.27095]],
  2: [[0.678914, 0.151623], [0.430129, 0.851819]],
  3: [[0.444635, 0.109818], [0.535328, 0.405771], [0.154329, 2.22766]]
};
const A_OVL = 0.27095;         // 重なり最大（第 5 回）
const A_EN  = 8 / (9 * Math.PI);   // エネルギー最小（第 6 回）

function slater(r){ return Math.exp(-r) / Math.sqrt(Math.PI); }
function gaussN(a){ return Math.pow(2 * a / Math.PI, 0.75); }

/* 1D 動径 Simpson 積分 */
function integ(f, rmax, N){
  let s = 0; const h = rmax / N;
  for (let i = 0; i <= N; i++){
    const r = i * h, w = (i === 0 || i === N) ? 1 : (i % 2 ? 4 : 2);
    s += w * f(r);
  }
  return s * h / 3;
}
/* 縮約 Gauss（係数列 set = [[c,α],…]）の値・重なり・エネルギー */
function phiG(set, r){
  let s = 0;
  for (let i = 0; i < set.length; i++) s += set[i][0] * gaussN(set[i][1]) * Math.exp(-set[i][1] * r * r);
  return s;
}
function propsOf(set){
  const norm = integ(function(r){ const p = phiG(set, r); return 4 * Math.PI * r * r * p * p; }, 20, 1600);
  const ovl  = integ(function(r){ return 4 * Math.PI * r * r * phiG(set, r) * slater(r); }, 20, 1600) / Math.sqrt(norm);
  const dphi = function(r){
    let s = 0;
    for (let i = 0; i < set.length; i++) s += set[i][0] * gaussN(set[i][1]) * (-2 * set[i][1] * r) * Math.exp(-set[i][1] * r * r);
    return s;
  };
  const T = 0.5 * integ(function(r){ const d = dphi(r); return 4 * Math.PI * r * r * d * d; }, 20, 1600);
  const V = -integ(function(r){ const p = phiG(set, r); return 4 * Math.PI * r * p * p; }, 20, 1600);
  return { norm: norm, ovl: ovl, E: (T + V) / norm * EH, T: T / norm * EH, V: V / norm * EH };
}
/* 規格化した s Gauss どうしの重なり（Gauss 積の定理の閉じた式） */
function Sgg(a, b, R){
  return Math.pow(4 * a * b / ((a + b) * (a + b)), 0.75) * Math.exp(-a * b * R * R / (a + b));
}
/* STO-nG の 1s–1s 重なり S(R)（規格化込み） */
function SnG(n, R){
  const set = STO[n];
  let s = 0, norm = 0;
  for (let i = 0; i < set.length; i++) for (let j = 0; j < set.length; j++){
    s += set[i][0] * set[j][0] * Sgg(set[i][1], set[j][1], R);
    norm += set[i][0] * set[j][0] * Sgg(set[i][1], set[j][1], 0);
  }
  return s / norm;
}
function Sexact(R){ return Math.exp(-R) * (1 + R + R * R / 3); }

function fmt(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  return String(Number(v.toPrecision(n)));
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

/* ========================================================================
   1. 解説
   ======================================================================== */
const FIT_NOTES =
  '<div class="note"><b>本数を増やすたびに，一桁ずつ良くなります．</b>\n' +
  'エネルギーの誤差は STO-1G：15.2 % → STO-2G：3.8 % → STO-3G：1.0 %，\n' +
  '厳密解との重なりは 0.9784 → 0.9984 → 0.9998．\n' +
  '幅の違う Gauss を重ねると，狭いものが原点近く，広いものが裾を受け持つ——\n' +
  '<b>役割分担</b>で Slater 型に近づいていきます．曲線の細い線（各成分）を見てください．</div>\n' +
  '<div class="note"><b>それでもカスプと裾は最後まで残ります．</b>\n' +
  '原点の尖り（カスプ）は何本足しても傾き 0 のままで再現できず，\n' +
  '遠方の裾も e<sup>−<i>α</i><i>r</i>²</sup> は e<sup>−<i>r</i></sup> より速く死にます．\n' +
  '幸い，エネルギーは波動関数の誤差の 2 乗でしか効かない（変分原理）ので，\n' +
  '化学結合のエネルギー差を議論する分には 3 本でもう実用になります．\n' +
  'ただし②のタブで見るように，<b>遠距離の量には裾の誤差がそのまま出ます</b>．</div>\n' +
  '<div class="note"><b>α の決め方は「何を似せたいか」で変わります．</b>\n' +
  'STO-1G の α = 0.27095 は<b>厳密解との重なりを最大</b>にした値（第 5 回），\n' +
  'エネルギーを最小にする α = 8/9π = 0.28294（第 6 回）とは少し違います．\n' +
  'STO-2G・3G の係数と指数も同じ発想の最小二乗フィットで決められた定数で，\n' +
  'Szabo–Ostlund の教科書に載っている値そのままです．</div>\n' +
  '<div class="note"><b>PySCF の STO-3G が −12.696 eV になる理由．</b>\n' +
  'このページの STO-3G（ζ = 1 の 1s へのフィット）は −13.467 eV（誤差 1.0 %）ですが，\n' +
  '講義第 6 回の PySCF 計算は −12.696 eV（誤差 6.7 %）でした．\n' +
  '実は<b>市販の STO-3G 基底は指数を ζ = 1.24 でスケール</b>（α → 1.24²α）してあります．\n' +
  '孤立原子ではなく<b>分子の中の H</b>（結合で縮んだ 1s）に合わせた既製服だからです．\n' +
  '2 つの数値の食い違いは，このスケーリングの有無でぴったり説明できます．</div>\n' +
  '<div class="note warn">⚠ <b>基底の貧しさは，時に物理を反転させます．</b>\n' +
  '講義第 10 回の glucose の例では，6-31G では構造緩和でエネルギーが 0.72 eV 下がるのに，\n' +
  '同じ構造を STO-3G で評価すると逆に 0.35 eV 上がって見えました．\n' +
  '<b>どの基底で計算したかを言わない全エネルギーには意味がない</b>——\n' +
  '第一原理計算の実務で最初に叩き込まれる教訓です．</div>';

const PRODUCT_NOTES =
  '<div class="note"><b>Gauss 積の定理：2 つの山の積は，あいだの 1 つの山．</b>\n' +
  '中心 <i>R</i><sub>A</sub>, <i>R</i><sub>B</sub> の Gauss 関数の積は，指数の平方完成だけで\n' +
  '<b>重み付き平均の位置 (αR<sub>A</sub> + βR<sub>B</sub>)/(α + β) を中心とする 1 つの Gauss 関数</b>\n' +
  '× 定数 K になります（上の図．破線がその「1 つの Gauss」——ぴったり重なります）．\n' +
  '定数 K = e<sup>−αβ(R<sub>A</sub>−R<sub>B</sub>)²/(α+β)</sup> が距離への依存をぜんぶ背負います．</div>\n' +
  '<div class="note"><b>これが量子化学の速さの源です．</b>\n' +
  'Slater 型の 2 中心積分には楕円座標という重い道具が要りました（重なり積分のページ）．\n' +
  'Gauss 型なら積の定理で<b>2 中心が 1 中心に潰れる</b>ので，重なり積分は初等積分で閉じます．\n' +
  'しかも 4 中心の電子間反発積分（分子計算の本丸）まで同じ手で 2 中心に落ちます．\n' +
  'Gaussian も PySCF も VASP 系以外の量子化学コードがほぼ Gauss 基底なのはこのためです．</div>\n' +
  '<div class="note"><b>S(R) は 3 本で R ≲ 4 a₀ ならほぼ厳密です．</b>\n' +
  '下の図で，STO-3G の曲線（青）は厳密解（緑破線）に R = 4 まで 4 桁一致します．\n' +
  '結合距離（H₂ で 1.4 a₀）のまわりの物理は完全にカバーできている，ということです．\n' +
  '一方 STO-1G は R = 4 で 40 % も足りません——1 本の Gauss の裾はそれだけ痩せています．</div>\n' +
  '<div class="note warn">⚠ <b>遠距離は Gauss の弱点のまま残ります．</b>\n' +
  'R = 6 a₀ では STO-3G でも 6 % 不足し，遠くへ行くほど（e<sup>−<i>c</i><i>R</i>²</sup> 的に）指数的に悪化します．\n' +
  'トンネル振幅・van der Waals 力・Rydberg 状態など<b>裾が主役の物理</b>には，\n' +
  '広い Gauss（diffuse 関数）を足した基底（6-31+G など）を使うのが実務の対処です．\n' +
  'タイトバインディング近似の裏付けに使う S(R) の指数減衰（重なり積分のページ）とも見比べてください．</div>';

const app = document.getElementById('qsim');

/* ========================================================================
   2. タブ①：フィット
   ======================================================================== */
function FitSim(root){
  this.root = root;
  this.n = 1;
  this.alpha = A_OVL;
  this.drag = null;
  this.build();
  this.update();
}
FitSim.prototype.set = function(){
  return this.n === 1 ? [[1.0, this.alpha]] : STO[this.n];
};
FitSim.prototype.build = function(){
  const self = this;
  const lay = el('div','layout');
  const colMain = el('div','col-main'), colSide = el('div','col-side');
  lay.appendChild(colMain); lay.appendChild(colSide);
  this.root.appendChild(lay);

  const stage = el('div','stage');
  const cv = document.createElement('canvas');
  stage.appendChild(cv); colMain.appendChild(stage);
  this.cv = cv; this.ctx = cv.getContext('2d');

  colMain.appendChild(el('div','legend',
    '<span><i style="background:#9aa4b0"></i>Slater 型（厳密な 1s）</span>' +
    '<span><i style="background:var(--accent)"></i>STO-nG（和）</span>' +
    '<span><i style="background:rgba(15,76,129,.35)"></i>各 Gauss 成分</span>'));

  this.readout = el('div','readout');
  colMain.appendChild(this.readout);

  colMain.appendChild(el('div','eq',
    '<math display="block"><mrow>' +
      '<msup><mi>φ</mi><mrow><mtext>STO-3G</mtext></mrow></msup>' +
      '<mo stretchy="false">(</mo><mi>r</mi><mo stretchy="false">)</mo><mo>=</mo>' +
      '<munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mn>3</mn></munderover>' +
      '<msub><mi>c</mi><mi>i</mi></msub>' +
      '<msup><mrow><mo>(</mo><mfrac><mrow><mn>2</mn><msub><mi>α</mi><mi>i</mi></msub></mrow><mi>π</mi></mfrac><mo>)</mo></mrow><mrow><mn>3</mn><mo>/</mo><mn>4</mn></mrow></msup>' +
      '<msup><mi>e</mi><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><msub><mi>α</mi><mi>i</mi></msub><msup><mi>r</mi><mn>2</mn></msup></mrow></msup>' +
    '</mrow></math>' +
    '<span class="cmt">(c, α) = (0.444635, 0.109818), (0.535328, 0.405771), (0.154329, 2.22766)（講義第 5 回．' +
    'ζ = 1 の 1s へのフィット）</span>'));

  const ctrl = el('div','controls');
  colSide.appendChild(ctrl);
  ctrl.appendChild(el('p','ctlhead','Gauss を何本使うか'));

FitSim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = Math.round(Math.max(400, Math.min(560, w * 0.72)));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  this.cv.width = Math.round(w * dpr);
  this.cv.height = Math.round(h * dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};

FitSim.prototype.draw = function(){
  if (!this.W) return;
  const c = this.ctx, W = this.W, H = this.H;
  c.clearRect(0, 0, W, H);
  const set = this.set();
  const gap = 8;
  const hTop = Math.round(H * 0.56);
  const hBot = H - hTop - gap;
  const yBot = hTop + gap;

  /* ---------- 上：ψ(r) ---------- */
  const rmax = 4.5;
  const x0 = 40, x1 = W - 14, y0 = 8, y1 = hTop - 22;
  const vmax = Math.max(slater(0), phiG(set, 0)) * 1.08;
  const px = function(r){ return x0 + r / rmax * (x1 - x0); };
  const py = function(v){ return y1 - v / vmax * (y1 - y0); };
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'left'; c.fillText('波動関数 ψ(r)', x0 + 5, y0 + 12);
  c.textAlign = 'right'; c.fillText('r / a₀ →', x1 - 2, y1 + 13);
  c.textAlign = 'center';
  [1, 2, 3, 4].forEach(function(r){
    c.strokeStyle = 'rgba(31,35,40,.06)';
    c.beginPath(); c.moveTo(px(r), y0); c.lineTo(px(r), y1); c.stroke();
    c.fillStyle = '#5c6670'; c.fillText(String(r), px(r), y1 + 13);
  });
  /* 各成分（薄く） */
  set.forEach(function(ca){
    c.strokeStyle = 'rgba(15,76,129,.30)'; c.lineWidth = 1.1;
    c.beginPath();
    for (let i = 0; i <= 240; i++){
      const r = rmax * i / 240;
      const v = ca[0] * gaussN(ca[1]) * Math.exp(-ca[1] * r * r);
      const X = px(r), Y = py(v);
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    }
    c.stroke();
  });
  /* 厳密解と和 */
  [[slater, '#9aa4b0', 1.6], [function(r){ return phiG(set, r); }, '#0f4c81', 2.4]].forEach(function(cf){
    c.strokeStyle = cf[1]; c.lineWidth = cf[2];
    c.beginPath();
    for (let i = 0; i <= 300; i++){
      const r = rmax * i / 300;
      const X = px(r), Y = py(cf[0](r));
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    }
    c.stroke();
  });

  /* ---------- 下：動径確率 4πr²ψ² ---------- */
  c.strokeStyle = 'rgba(31,35,40,.14)';
  c.strokeRect(0.5, yBot + 0.5, W - 1, hBot - 1);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('動径確率 4πr²ψ²（裾の違いが見えます）', 8, yBot + 14);
  const rmax2 = 6;
  const gx0 = 40, gx1 = W - 14, gy0 = yBot + 20, gy1 = yBot + hBot - 16;
  const P1 = function(r){ const v = slater(r); return 4 * Math.PI * r * r * v * v; };
  const P2 = function(r){ const v = phiG(set, r); return 4 * Math.PI * r * r * v * v; };
  let pm2 = 0;
  for (let i = 0; i <= 150; i++){ const r = rmax2 * i / 150; pm2 = Math.max(pm2, P1(r), P2(r)); }
  const gpx = function(r){ return gx0 + r / rmax2 * (gx1 - gx0); };
  const gpy = function(v){ return gy1 - v / (pm2 * 1.06) * (gy1 - gy0 - 4); };
  [[P1, '#9aa4b0', 1.6], [P2, '#0f4c81', 2.2]].forEach(function(cf){
    c.strokeStyle = cf[1]; c.lineWidth = cf[2];
    c.beginPath();
    for (let i = 0; i <= 300; i++){
      const r = rmax2 * i / 300;
      const X = gpx(r), Y = gpy(cf[0](r));
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    }
    c.stroke();
  });
  c.fillStyle = '#5c6670'; c.textAlign = 'right';
  c.fillText('r = ' + rmax2 + ' a₀', gx1 - 2, gy1 + 12);
};

FitSim.prototype.update = function(){
  const self = this;
  this.nBtns.forEach(function(b, i){ b.classList.toggle('on', i + 1 === self.n); });
  this.alab.textContent = 'α = ' + this.alpha.toFixed(3);
  this.ain.value = String(this.alpha);
  this.resize();
  this.draw();
  const set = this.set();
  const pr = propsOf(set);
  const R = [
    ['試行関数', 'STO-' + this.n + 'G' + (this.n === 1 ? '（α = ' + this.alpha.toFixed(3) + '）' : '')],
    ['厳密解との重なり ⟨1s|φ⟩', fmt(pr.ovl, 6)],
    ['⟨E⟩', fmt(pr.E, 6) + ' eV'],
    ['誤差', fmt((pr.E - E1S) / Math.abs(E1S) * 100, 3) + ' %'],
    ['⟨T⟩ / ⟨V⟩', fmt(pr.T, 4) + ' / ' + fmt(pr.V, 4) + ' eV'],
    ['厳密解', '−13.606 eV']
  ];
  if (this.n === 3){
    R.push(['参考：PySCF の標準 STO-3G', '−12.696 eV（ζ = 1.24 スケール）']);
  }
  this.readout.innerHTML = R.map(function(x){
    return '<div><span>' + x[0] + '</span><span>' + x[1] + '</span></div>';
  }).join('');
};

ProductSim.prototype.resize = FitSim.prototype.resize;

ProductSim.prototype.draw = function(){
  if (!this.W) return;
  const c = this.ctx, W = this.W, H = this.H;
  c.clearRect(0, 0, W, H);
  const a = this.a, b = this.b, R = this.R;
  const gap = 8;
  const hTop = Math.round(H * 0.46);
  const hBot = H - hTop - gap;
  const yBot = hTop + gap;

  /* ---------- 上：1 次元での積の定理 ---------- */
  const xlo = -3, xhi = 9;
  const x0 = 14, x1 = W - 14, y0 = 8, y1 = hTop - 20;
  this.scaleX = (x1 - x0) / (xhi - xlo);
  const px = function(x){ return x0 + (x - xlo) / (xhi - xlo) * (x1 - x0); };
  const gA = function(x){ return Math.exp(-a * x * x); };
  const gB = function(x){ return Math.exp(-b * (x - R) * (x - R)); };
  const K = Math.exp(-a * b * R * R / (a + b));
  const RP = (0 * a + b * R) / (a + b);
  /* 積は小さいので，見えるように 1/K 倍して描く（K は読み取り値へ） */
  const prodScaled = function(x){ return K > 1e-300 ? gA(x) * gB(x) / K : 0; };
  const py = function(v){ return y1 - v * (y1 - y0 - 14); };
  c.strokeStyle = 'rgba(31,35,40,.14)'; c.lineWidth = 1;
  c.strokeRect(0.5, 0.5, W - 1, hTop - 1);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('Gauss 積の定理（1 次元断面．積は 1/K = ' + (K > 1e-6 ? (1/K).toFixed(1) : '大') + ' 倍で表示）', 8, 14);
  c.strokeStyle = 'rgba(31,35,40,.2)';
  c.beginPath(); c.moveTo(x0, y1); c.lineTo(x1, y1); c.stroke();
  const curves = [
    [gA, '#0f4c81', 1.8, null],
    [gB, '#c62828', 1.8, null],
    [prodScaled, '#f9a825', 2.6, null],
    [function(x){ return Math.exp(-(a + b) * (x - RP) * (x - RP)); }, 'rgba(31,35,40,.55)', 1.6, [5,4]]
  ];
  curves.forEach(function(cf){
    c.strokeStyle = cf[1]; c.lineWidth = cf[2];
    if (cf[3]) c.setLineDash(cf[3]);
    c.beginPath();
    for (let i = 0; i <= 340; i++){
      const x = xlo + (xhi - xlo) * i / 340;
      const X = px(x), Y = py(cf[0](x));
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    }
    c.stroke(); c.setLineDash([]);
  });
  /* 中心マーカー */
  const mk = function(x, col, name){
    c.fillStyle = col;
    c.beginPath(); c.arc(px(x), y1, 3.2, 0, 6.2832); c.fill();
    c.font = 'bold 10px ' + CFONT; c.textAlign = 'center';
    c.fillText(name, px(x), y1 + 13);
  };
  mk(0, '#0f4c81', 'R_A');
  mk(R, '#c62828', 'R_B');
  mk(RP, '#f9a825', 'R_P');

  /* ---------- 下：S(R) 厳密 vs STO-nG ---------- */
  c.strokeStyle = 'rgba(31,35,40,.14)';
  c.strokeRect(0.5, yBot + 0.5, W - 1, hBot - 1);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'left';
  c.fillText('1s–1s の重なり積分 S(R)：厳密（緑破線）と STO-1G/2G/3G', 8, yBot + 14);
  const RM = 8;
  const gx0 = 40, gx1 = W - 14, gy0 = yBot + 22, gy1 = yBot + hBot - 18;
  const gpx = function(r){ return gx0 + r / RM * (gx1 - gx0); };
  const gpy = function(s){ return gy1 - s * (gy1 - gy0); };
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(gx0, gy0, gx1 - gx0, gy1 - gy0);
  c.fillStyle = '#5c6670'; c.textAlign = 'center';
  [2, 4, 6, 8].forEach(function(r){
    c.strokeStyle = 'rgba(31,35,40,.06)';
    c.beginPath(); c.moveTo(gpx(r), gy0); c.lineTo(gpx(r), gy1); c.stroke();
    c.fillText(String(r), gpx(r), gy1 + 12);
  });
  const CN = { 1: '#c62828', 2: '#b07800', 3: '#0f4c81' };
  [1, 2, 3].forEach(function(n){
    c.strokeStyle = CN[n]; c.lineWidth = n === 3 ? 2.2 : 1.5;
    c.beginPath();
    for (let i = 0; i <= 200; i++){
      const r = RM * i / 200;
      const X = gpx(r), Y = gpy(SnG(n, r));
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    }
    c.stroke();
  });
  c.strokeStyle = '#2e7d32'; c.lineWidth = 2; c.setLineDash([6,5]);
  c.beginPath();
  for (let i = 0; i <= 200; i++){
    const r = RM * i / 200;
    const X = gpx(r), Y = gpy(Sexact(r));
    if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
  }
  c.stroke(); c.setLineDash([]);
  c.font = 'bold 10px ' + CFONT; c.textAlign = 'left';
  c.fillStyle = '#c62828'; c.fillText('1G', gpx(1.15), gpy(SnG(1, 1.15)) - 6);
  c.fillStyle = '#b07800'; c.fillText('2G', gpx(2.2), gpy(SnG(2, 2.2)) + 14);
  c.fillStyle = '#0f4c81'; c.fillText('3G', gpx(3.1), gpy(SnG(3, 3.1)) - 8);
  c.fillStyle = '#2e7d32'; c.fillText('厳密', gpx(5.1), gpy(Sexact(5.1)) - 8);
  /* いまの R の縦線 */
  c.strokeStyle = 'rgba(249,168,37,.9)'; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(gpx(Math.min(R, RM)), gy0); c.lineTo(gpx(Math.min(R, RM)), gy1); c.stroke();
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textAlign = 'right';
  c.fillText('R / a₀ →', gx1 - 4, gy1 + 12);
};

ProductSim.prototype.update = function(){
  this.alab.textContent = 'α = ' + this.a.toFixed(2) + ' a₀⁻²';
  this.blab.textContent = 'β = ' + this.b.toFixed(2) + ' a₀⁻²';
  this.rlab.textContent = 'R = ' + this.R.toFixed(2) + ' a₀';
  this.resize();
  this.draw();
  const a = this.a, b = this.b, R = this.R;

  const Rr = [
    ['合成中心 R_P', fmt((b * R) / (a + b), 4) + ' a₀（A から ' + fmt((b / (a + b)) * 100, 3) + ' %）'],
    ['定数 K', fmt(K, 4)],
    ['合成幅 α + β', fmt(a + b, 4) + ' a₀⁻²'],
    ['S(R)：厳密', fmt(Sexact(R), 4)],
    ['S(R)：STO-1G', fmt(SnG(1, R), 4)],
    ['S(R)：STO-2G', fmt(SnG(2, R), 4)],
    ['S(R)：STO-3G', fmt(SnG(3, R), 4)]
  ];
  this.readout.innerHTML = Rr.map(function(x){
    return '<div><span>' + x[0] + '</span><span>' + x[1] + '</span></div>';
  }).join('');
};

const mm = /[?&]only=(fit|product)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');

const sims = {};
[['fit', FitSim], ['product', ProductSim]].forEach(function(kv){
  const p = app.querySelector('[data-panel="' + kv[0] + '"]');
  if (!p) return;
  if (only && only !== kv[0]){ p.parentNode.removeChild(p); return; }
  sims[kv[0]] = new kv[1](p);
});

let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let active = only || 'fit';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].update();
  postHeight();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].W = 0; sims[k].update(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].update(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
</body>
</html>
