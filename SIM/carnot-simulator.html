<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnot サイクル ― 熱から仕事が生まれる仕組みと、効率の上限</title>
<style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります。
   スタイルはすべて #qsim 配下にスコープしてあるので、
   既存ページに <div id="qsim">…</div> ごと貼り付けても衝突しません。
   （直貼りするときは、下の html,body ブロックだけ削除してください）
   ========================================================================== */
html, body { margin:0; background:#fafafa; }

#qsim{
  --bg:#fafafa;
  --panel:#ffffff;
  --panel-soft:#f4f6f9;
  --fg:#1f2328;
  --sub:#5c6670;
  --line:rgba(31,35,40,.12);
  --accent:#0f4c81;
  --accent-strong:#0a355a;
  --accent-soft:#e7eff7;
  --hot:#d84315;         /* 高温熱源・速い分子 */
  --cold:#1565c0;        /* 低温熱源・遅い分子 */
  --heat:#e65100;        /* 熱 Q */
  --work:#2e7d32;        /* 仕事 W */
  --adia:#6a1b9a;        /* 断熱膨張 */
  --adib:#00695c;        /* 断熱圧縮 */
  --insul:#78909c;       /* 断熱材 */
  --piston:#8d6e63;      /* ピストン */
  --ok:#2e7d32;
  --warn:#8a5a00;
  --warnbg:#fdf5e3;
  --shadow:0 14px 32px rgba(20,34,51,.08);
  --radius-lg:20px;
  --radius-md:14px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color:var(--fg); font-family:var(--font); line-height:1.7;
  max-width:1120px; margin:0 auto; padding:16px 18px 22px;
  -webkit-text-size-adjust:100%;
}
#qsim *{box-sizing:border-box}
#qsim h1{font-size:1.34rem; line-height:1.3; margin:0 0 4px; color:#15202b; letter-spacing:.01em}
#qsim p{margin:.3em 0}
#qsim .lead{color:var(--sub); font-size:.86rem; margin:0}

/* --- タブ --- */
#qsim .tabs{display:flex; gap:8px; margin:14px 0 14px; flex-wrap:wrap}
#qsim .tab{
  font:inherit; font-size:.92rem; font-weight:700; cursor:pointer;
  padding:8px 18px; border-radius:999px; border:1px solid var(--line);
  background:rgba(255,255,255,.7); color:#15202b;
  transition:background-color .2s ease, color .2s ease, transform .2s ease;
}
#qsim .tab:hover{background:rgba(15,76,129,.10); color:var(--accent-strong); transform:translateY(-1px)}
#qsim .tab.is-active{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .panel[hidden]{display:none}
/* 埋め込みのとき：見出しは隠す。タブは残す（埋め込み先からも ①② を押し比べられる） */
#qsim.is-embed{padding-top:6px}
#qsim.is-embed > h1,
#qsim.is-embed > .lead{display:none}
#qsim.is-embed > .tabs{margin:2px 0 12px}
#qsim.is-single > .tabs{display:none}

/* --- 2 カラム：左 = 図 / 右 = パラメーター --- */
#qsim .layout{
  display:grid; grid-template-columns:minmax(0,3fr) minmax(268px,1fr);
  gap:16px; align-items:start;
}
@media (max-width:880px){ #qsim .layout{grid-template-columns:1fr} }

/* --- 右カラム：コントロール --- */
#qsim .controls{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--shadow); padding:13px 14px;
}
#qsim .ctlhead{
  font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--sub); margin:0 0 8px;
}
#qsim .ctlhead .lc{text-transform:none; font-size:1.05em}
#qsim .hint{display:block; font-size:.71rem; color:var(--sub); line-height:1.45; margin-top:6px}
#qsim .sep{height:1px; background:var(--line); margin:13px 0 11px; border:0}
#qsim .fld{display:flex; flex-direction:column; gap:3px; font-size:.78rem; color:var(--sub); margin-top:9px}
#qsim .fld b{font-weight:700; color:var(--fg); font-size:.82rem}
#qsim .fld .hint{font-size:.71rem; color:var(--sub); line-height:1.45; margin-top:2px}

#qsim input[type=number], #qsim select{
  font:inherit; font-size:.85rem; padding:6px 8px; border-radius:9px;
  border:1px solid var(--line); background:#fff; color:var(--fg); width:100%;
  font-variant-numeric:tabular-nums;
}
#qsim select{cursor:pointer}
#qsim input[type=number]:focus, #qsim select:focus{
  outline:2px solid rgba(15,76,129,.35); outline-offset:1px; border-color:var(--accent);
}
#qsim input.bad{border-color:#c62828; background:#fff5f5}
#qsim .unit{display:flex; align-items:center; gap:6px}
#qsim .unit .u{font-size:.76rem; color:var(--sub); white-space:nowrap; min-width:2.6em}

/* --- 小さいピル --- */
#qsim .pills{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
#qsim .pill{
  font:inherit; font-size:.79rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.85); color:#15202b;
  padding:6px 12px; border-radius:999px; white-space:nowrap;
  transition:border-color .18s ease, transform .18s ease;
}
#qsim .pill:hover:not(:disabled){border-color:rgba(15,76,129,.55); transform:translateY(-1px)}
#qsim .pill.on{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .pill:disabled{opacity:.32; cursor:default}
#qsim .pill small{display:block; font-size:.66rem; font-weight:400; color:var(--sub); margin-top:1px}
#qsim .pill.on small{color:rgba(255,255,255,.78)}

/* --- ボタン --- */
#qsim .btnrow{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:10px}
#qsim button.act{
  font:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.8); color:#15202b;
  padding:7px 10px; border-radius:9px; white-space:nowrap;
  transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
#qsim button.act:hover{border-color:rgba(15,76,129,.5); box-shadow:0 8px 18px rgba(20,34,51,.10); transform:translateY(-1px)}
#qsim button.act.primary{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .ctlrow{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  font-size:.76rem; color:var(--sub); margin-top:9px;
}
#qsim .ctlrow input[type=range]{flex:1 1 84px; min-width:70px; accent-color:var(--accent)}
#qsim .ctlrow .val{font-variant-numeric:tabular-nums; font-weight:700; color:var(--fg); min-width:4.4em; text-align:right}
#qsim .chk{display:flex; align-items:flex-start; gap:6px; font-size:.75rem;
  color:var(--sub); cursor:pointer; margin-top:9px; line-height:1.45}
#qsim .chk input{accent-color:var(--accent); cursor:pointer; margin-top:3px}

/* --- 4 行程のステッパー（押すとその行程の頭へ飛ぶ） --- */
#qsim .steps{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:0 0 10px}
#qsim .step{
  position:relative; overflow:hidden; text-align:left; cursor:pointer;
  font:inherit; font-size:.76rem; font-weight:700; color:#15202b; line-height:1.35;
  border:1px solid var(--line); border-top:3px solid var(--sc,#b0bec5);

  transition:box-shadow .2s ease, transform .2s ease;
}
#qsim .step:hover{transform:translateY(-1px); box-shadow:0 8px 18px rgba(20,34,51,.10)}
#qsim .step .nm{position:relative; display:block}
#qsim .step .sb{position:relative; display:block; font-size:.66rem; font-weight:400; color:var(--sub); margin-top:1px}
#qsim .step .prog{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--sc,#b0bec5); opacity:.13}
#qsim .step.on{box-shadow:inset 0 0 0 1px var(--sc,#b0bec5)}
#qsim .step.on .nm{color:var(--sc,#15202b)}
@media (max-width:560px){ #qsim .steps{grid-template-columns:repeat(2,1fr)} }

/* --- 左カラム：キャンバス --- */
#qsim .stage{

  vertical-align:middle; margin-right:5px}
#qsim .legend i.dot{width:9px; height:9px; border-radius:50%}

/* --- 読み取り値 --- */
#qsim .readout{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(206px,1fr));
  gap:0 18px; margin-top:10px; font-size:.76rem;
}
#qsim .readout div{display:flex; justify-content:space-between; gap:10px;
  border-bottom:1px dotted var(--line); padding:3px 0}
#qsim .readout span:first-child{color:var(--sub)}
#qsim .readout span:last-child{font-variant-numeric:tabular-nums; font-weight:700}
#qsim .readout div.hi span:last-child{color:var(--accent-strong)}
#qsim .readout div.hi span:first-child{color:var(--accent-strong)}
#qsim .rohead{
  grid-column:1/-1; font-size:.68rem; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--sub); margin:11px 0 1px; border:0!important;

}
#qsim sup{font-size:.72em}
#qsim sub{font-size:.72em}

/* --- 効率の大きな表示 --- */

}
#qsim .etabox .row{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
#qsim .etabox .big{font-size:2.05rem; font-weight:700; font-variant-numeric:tabular-nums;
  color:var(--work); line-height:1.15}
#qsim .etabox .eqs{font-size:.84rem; color:var(--sub)}
#qsim .etabox .eqs b{color:var(--fg); font-variant-numeric:tabular-nums}
#qsim .gauge{position:relative; height:14px; margin:10px 0 4px;
  background:var(--panel-soft); border-radius:7px; overflow:hidden}
#qsim .gauge .fill{position:absolute; left:0; top:0; bottom:0; width:0;

#qsim .gauge .tick{position:absolute; top:0; bottom:0; width:2px; background:rgba(31,35,40,.32)}
#qsim .gscale{display:flex; justify-content:space-between; font-size:.68rem; color:var(--sub)}

/* --- 表 --- */
#qsim .tblwrap{margin-top:12px; overflow-x:auto; background:var(--panel);

  text-align:left; padding:11px 14px 7px; font-size:.8rem; font-weight:700; color:#15202b;
}
#qsim caption small{display:block; font-weight:400; font-size:.72rem; color:var(--sub); margin-top:2px}

#qsim tbody tr:last-child td{border-bottom:0}
#qsim tr.sum td{font-weight:700; background:var(--accent-soft); color:var(--accent-strong)}
#qsim tr.sum td:first-child{color:var(--accent-strong)}
#qsim td .leg{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px}
#qsim td.pos{color:#c0392b}
#qsim td.neg{color:#1565c0}
#qsim td.zero{color:var(--sub)}

/* --- 数式 --- */
#qsim .eq{
  text-align:center; padding:11px 8px; margin:10px 0 0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  overflow-x:auto;
}
#qsim math{
  font-size:1.05em;
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  line-height:normal;
}
#qsim .eq math[display="block"]{font-size:1.1rem; margin:0 auto}
#qsim .eq .cmt{color:var(--sub); font-size:.82rem; display:block; margin-top:4px}
#qsim i{
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  font-size:1.05em; font-style:italic;
}
@supports (text-transform: math-auto){
  #qsim i{font-style:normal; text-transform:math-auto}
}

/* --- 解説（折りたたみ） --- */
#qsim .explain{
  margin-top:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-md); padding:0 14px;
}
#qsim .explain > summary{
  cursor:pointer; list-style:none; padding:10px 0; font-size:.82rem; font-weight:700;
  color:var(--accent-strong);
}
#qsim .explain > summary::-webkit-details-marker{display:none}
#qsim .explain > summary::before{content:"▶ "; font-size:.72em; color:var(--sub)}
#qsim .explain[open] > summary::before{content:"▼ "}
#qsim .explain[open] > summary{border-bottom:1px solid var(--line)}
#qsim .explain .body{padding:4px 0 12px}
#qsim .explain .body p{font-size:.82rem; margin:.5em 0}
#qsim .note{
  font-size:.78rem; color:var(--sub); background:var(--panel-soft);
  border-left:3px solid var(--line); border-radius:0 8px 8px 0;
  padding:8px 12px; margin:9px 0;
}
#qsim .note.warn{color:var(--warn); background:var(--warnbg); border-left-color:currentColor}
#qsim .note.key{color:var(--accent-strong); background:var(--accent-soft); border-left-color:var(--accent)}
#qsim .note b{color:inherit}
#qsim .msg{
  font-size:.75rem; margin-top:9px; padding:7px 11px; border-radius:9px;
  color:var(--warn); background:var(--warnbg); border-left:3px solid currentColor;

#qsim .msg[hidden]{display:none}
#qsim .foot{margin-top:12px; font-size:.73rem; color:var(--sub); text-align:center}
</style>

<body>
<div id="qsim">
  <h1>Carnot サイクル ― 熱から仕事が生まれる仕組みと、効率の上限</h1>
  <p class="lead">
    シリンダーの中の気体に<b>等温膨張 → 断熱膨張 → 等温圧縮 → 断熱圧縮</b>をさせると、
    1 周してもとの状態に戻るのに<b>正味の仕事が残ります</b>。これが熱機関です。
    ①ではピストンが動くようすと <i>P</i>–<i>V</i> 図・<i>T</i>–<i>S</i> 図を並べ、
    ②では 4 行程の熱と仕事を数字で追って、効率が
    <i>η</i> = 1 − <i>T</i><sub>C</sub>/<i>T</i><sub>H</sub> になることを確かめます。
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="engine" role="tab">① エンジンを回す</button>
    <button class="tab" data-tab="ledger" role="tab">② 4 行程を数字で追う</button>
  </div>

  <section class="panel" data-panel="engine"></section>
  <section class="panel" data-panel="ledger" hidden></section>

  <p class="foot">
    状態量はすべて<b>分配関数</b>から計算しています（並進 + 回転 + 振動 + 電子縮重）。
    断熱線は <i>C<sub>V</sub></i> を定数と置かず、<b>エントロピー一定</b>の条件
    <i>S</i>(<i>T</i>, <i>V</i>) = 一定 をそのまま解いて引いています。
  </p>
</div>
<script>
(function () {
'use strict';

/* ========================================================================
   0. 定数と気体のデータ
   ------------------------------------------------------------------------
   単位はすべて SI（K, Pa, m³, J）。k_B・h・N_A は 2019 年の SI 定義値で、
   R = k_B N_A も定義値どうしの積なので厳密。
   ======================================================================== */
const KB = 1.380649e-23;             // Boltzmann 定数 [J/K]（定義値）
const HP = 6.62607015e-34;           // Planck 定数 [J s]（定義値）
const NA = 6.02214076e23;            // Avogadro 定数 [1/mol]（定義値）
const RG = KB * NA;                  // 気体定数 8.31446261815324 J/(mol K)
const C2 = 1.438776877;              // hc/k_B [K cm]（波数 → 特性温度）
const ATM = 101325;                  // 1 気圧 [Pa]
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

/* 分子データ（理想気体シミュレーターと同じ表）
     M    : モル質量 [g/mol]
     lin  : 直線分子か（回転の自由度 2）。単原子は false
     B    : 基底振動状態の回転定数 B₀ [cm⁻¹]
     w    : 基準振動の波数 [cm⁻¹] と縮重度
     sigma: 対称数、gel: 電子基底状態の縮重度（O₂ は ³Σ なので 3）
     bp   : 1 気圧で凝縮する温度 [K]（それ以下では実際には液体・固体）。
            CO₂ は三重点が 5.11 気圧なので 1 気圧では液体にならず、この値は昇華点（subl:true） */
const GAS = [
  { k:'He',  name:'ヘリウム',   sym:'He',  M:4.002602,  lin:false, sigma:1, B:0,       w:[],                                gel:1, bp:4.22 },
  { k:'Ne',  name:'ネオン',     sym:'Ne',  M:20.1797,   lin:false, sigma:1, B:0,       w:[],                                gel:1, bp:27.1 },
  { k:'Ar',  name:'アルゴン',   sym:'Ar',  M:39.948,    lin:false, sigma:1, B:0,       w:[],                                gel:1, bp:87.3 },
  { k:'H2',  name:'水素',       sym:'H₂',  M:2.01588,   lin:true,  sigma:2, B:59.322,  w:[[4161.17,1]],                     gel:1, bp:20.3 },
  { k:'N2',  name:'窒素',       sym:'N₂',  M:28.0134,   lin:true,  sigma:2, B:1.98958, w:[[2329.92,1]],                     gel:1, bp:77.4 },
  { k:'O2',  name:'酸素',       sym:'O₂',  M:31.9988,   lin:true,  sigma:2, B:1.43768, w:[[1556.23,1]],                     gel:3, bp:90.2 },
  { k:'CO2', name:'二酸化炭素', sym:'CO₂', M:44.0095,   lin:true,  sigma:2, B:0.39021, w:[[667.4,2],[1333.0,1],[2349.2,1]], gel:1, bp:194.7, subl:true }
];
GAS.forEach(function (g) {
  g.m  = g.M * 1e-3 / NA;                                     // 分子 1 個の質量 [kg]
  g.tr = g.B ? C2 * g.B : 0;                                  // 回転特性温度 θ_r [K]
  g.tv = g.w.map(function (p) { return [C2 * p[0], p[1]]; }); // 振動特性温度 θ_v [K] と縮重度
});
function gasOf(k){ for (let i = 0; i < GAS.length; i++) if (GAS[i].k === k) return GAS[i]; return GAS[4]; }

/* ========================================================================
   1. 統計力学 ― 分配関数から状態量を出す
   ------------------------------------------------------------------------
       Z = q^N / N!,  A = −N k_B T [ln(q/N) + 1],
       U = k_B T² (∂lnZ/∂T)_V,  S = N k_B [ln(q/N) + 1] + U/T
   ======================================================================== */
function qTransPerV(g, T){                       /* q_tr / V  [1/m³] */
  return Math.pow(2 * Math.PI * g.m * KB * T / (HP * HP), 1.5);
}
/* 剛体回転子（直線分子）。高温近似ではなく J について直接足すので、
   θ_r が T と同じくらいになる低温（H₂ など）でも回転が凍りはじめる様子を追える。
   ただし全 J の和を σ で割る扱いは核スピン統計（H₂ のオルト・パラ）を無視した近似なので、
   θ_r を下回る領域では厳密ではない。 */
function qRot(g, T){
  if (!g.lin) return 1;
  let s = 0;
  for (let J = 0; J < 400; J++){
    const t = (2*J + 1) * Math.exp(-J * (J + 1) * g.tr / T);
    s += t;
    if (J > 5 && t < 1e-16 * s) break;
  }
  return s / g.sigma;
}
/* 調和振動子。エネルギーの原点を v = 0 に置く（零点振動は数に入れない） */
function qVib(g, T){
  let q = 1;
  for (let i = 0; i < g.tv.length; i++) q *= Math.pow(1 / (1 - Math.exp(-g.tv[i][0] / T)), g.tv[i][1]);
  return q;
}
function uTrans(T){ return 1.5 * KB * T; }
/* 高温側は Mulholland 展開を使う。ln(σq_rot) = −ln y + y/3 + y²/90 + 8y³/2835 + …
   （y = θ_r/T）を T で微分して
       u_rot = k_B T (1 − y/3 − y²/45 − 8y³/945 − …)
   等分配の k_B T ちょうどではなく −k_B θ_r/3 だけ低い。この定数は C_V には効かないが、
   S = … + U/T と断熱線（ln V + φ(T) = 一定）には効くので、落とすと
   ∫C_V dT/T = R ln(V₃/V₂) が 0.1 % ほど破れてしまう。
   切り捨てた次の項は 0.0042 y⁴ で、乗り換え点 y = 1/12 でも 2×10⁻⁷ しかない。 */
function uRot(g, T){
  if (!g.lin) return 0;
  if (T > 12 * g.tr){
    const y = g.tr / T;
    return KB * T * (1 - y / 3 - y * y / 45 - 8 * y * y * y / 945);
  }
  const d = T * 1e-5;
  return KB * T * T * (Math.log(qRot(g, T + d)) - Math.log(qRot(g, T - d))) / (2 * d);
}
function uVib(g, T){
  let u = 0;
  for (let i = 0; i < g.tv.length; i++){
    const th = g.tv[i][0];
    u += g.tv[i][1] * KB * th / (Math.exp(th / T) - 1);
  }
  return u;
}
function uMol(g, T){ return NA * (uTrans(T) + uRot(g, T) + uVib(g, T)); }   /* J/mol */

/* 状態量。n [mol]、T [K]、V [m³] → U, H, S（全量、単位 J・J/K） */
function stateOf(g, n, T, V){
  const N = n * NA;
  const U = N * (uTrans(T) + uRot(g, T) + uVib(g, T));
  const qtrN = qTransPerV(g, T) * V / N;                    /* q_tr / N */
  const S = N * KB * (Math.log(qtrN) + 1
                    + Math.log(qRot(g, T) * qVib(g, T) * g.gel)) + U / T;
  return { U: U, H: U + n * RG * T, S: S };
}
/* モル熱容量 [J/(mol K)]。C_P − C_V = R は理想気体では厳密 */
function cvMolar(g, T){
  const d = Math.max(1e-4, T * 1e-4);
  return (uMol(g, T + d) - uMol(g, T - d)) / (2 * d);
}

/* ========================================================================
   2. 断熱線 ―― Carnot サイクルの背骨
   ------------------------------------------------------------------------
   S(T,V) = n R [ ln V + φ(T) ] + 定数  と書ける（q_tr ∝ V T^{3/2} なので）。
   したがって<b>準静的断熱＝等エントロピー</b>は

       ln V + φ(T) = 一定,      φ(T) = (3/2)ln T + ln(q_rot q_vib) + u/(k_B T)

   という 1 本の式になる。教科書の TV^{γ−1} = 一定 は
   C_V が定数のときの特別な場合で、φ(T) = (C_V/R) ln T + const にあたる。
   H₂ の低温（回転の凍結）や CO₂ の高温（振動の目覚め）では C_V が動くので、
   ここでは近似せず φ をそのまま使う。

   d φ/d ln T = C_V/R が成り立つ（数値的に 1e-9 で確認済み）。
   ======================================================================== */
function phiT(g, T){
  return 1.5 * Math.log(T) + Math.log(qRot(g, T) * qVib(g, T))
       + (uTrans(T) + uRot(g, T) + uVib(g, T)) / (KB * T);
}
/* 高温 T_H から低温 T_C へ断熱膨張したときの体積比 V(T_C)/V(T_H) */
function adiFactor(g, TH, TC){ return Math.exp(phiT(g, TH) - phiT(g, TC)); }

/* ========================================================================
   3. Carnot サイクル
   ------------------------------------------------------------------------
     ① (T_H, V₁) --等温膨張--> ② (T_H, V₂)   V₂ = r V₁
     ② --断熱膨張--> ③ (T_C, V₃)             V₃ = V₂ × ADI
     ③ --等温圧縮--> ④ (T_C, V₄)             V₄ = V₁ × ADI
     ④ --断熱圧縮--> ①                        （V₂/V₁ = V₃/V₄ が自動的に成り立つ）

   等温では ΔU = 0 なので Q = W = nRT ln(V後/V前)。
   断熱では Q = 0 なので W = −ΔU = n[u(T前) − u(T後)]。
     Q_H = nRT_H ln r,  Q_C = −nRT_C ln r,  W = nR(T_H−T_C) ln r
     η = W/Q_H = 1 − T_C/T_H          ← 気体の種類にも n にも P にも r にも依らない
   ======================================================================== */
const LEG = [
  { k:'iso-h', nm:'① 等温膨張', sub:'高温熱源から吸熱',   col:'#d84315', from:0, to:1 },
  { k:'adi-e', nm:'② 断熱膨張', sub:'熱の出入りなし',     col:'#6a1b9a', from:1, to:2 },
  { k:'iso-c', nm:'③ 等温圧縮', sub:'低温熱源へ放熱',     col:'#1565c0', from:2, to:3 },
  { k:'adi-c', nm:'④ 断熱圧縮', sub:'熱の出入りなし',     col:'#00695c', from:3, to:0 }
];

function buildCycle(g, n, TH, TC, V1, r){
  const A  = adiFactor(g, TH, TC);
  const V2 = V1 * r, V3 = V2 * A, V4 = V1 * A;
  const mk = function(T, V){
    const s = stateOf(g, n, T, V);
    return { T:T, V:V, P:n * RG * T / V, U:s.U, H:s.H, S:s.S };
  };
  const st = [mk(TH, V1), mk(TH, V2), mk(TC, V3), mk(TC, V4)];
  const dUad = n * (uMol(g, TH) - uMol(g, TC));       /* U(T_H) − U(T_C) > 0 */
  const lnr  = Math.log(r);
  const QH = n * RG * TH * lnr, QC = -n * RG * TC * lnr;
  const legs = [
    { Q:QH, W:QH,     dU:0,      dS:QH / TH },
    { Q:0,  W:dUad,   dU:-dUad,  dS:0 },
    { Q:QC, W:QC,     dU:0,      dS:QC / TC },
    { Q:0,  W:-dUad,  dU:dUad,   dS:0 }
  ];
  return {
    g:g, n:n, TH:TH, TC:TC, V1:V1, r:r, A:A, st:st, legs:legs,
    QH:QH, QC:QC, W:QH + QC, eta:1 - TC / TH,
    dS:QH / TH,                                     /* 等温膨張のエントロピー増加 */
    Vmin:V1, Vmax:V3, Pmax:st[0].P, Pmin:st[2].P,
    cvH:cvMolar(g, TH), cvC:cvMolar(g, TC)
  };
}

/* 経路上の点。leg = 0..3、u ∈ [0,1]。
   等温は ln V を、断熱は T を等間隔に刻む（どちらも dS または dT が一定になる） */
function cyclePoint(cy, leg, u){
  const g = cy.g, TH = cy.TH, TC = cy.TC;
  const V1 = cy.st[0].V, V2 = cy.st[1].V, V3 = cy.st[2].V, V4 = cy.st[3].V;
  let T, V;
  if      (leg === 0){ T = TH; V = V1 * Math.pow(V2 / V1, u); }
  else if (leg === 1){ T = TH + (TC - TH) * u; V = V2 * Math.exp(phiT(g, TH) - phiT(g, T)); }
  else if (leg === 2){ T = TC; V = V3 * Math.pow(V4 / V3, u); }
  else               { T = TC + (TH - TC) * u; V = V4 * Math.exp(phiT(g, TC) - phiT(g, T)); }
  return { T:T, V:V, P:cy.n * RG * T / V };
}
/* いまいる点までにこの行程で出入りした熱と仕事（棒グラフを伸ばすのに使う） */
function legPartial(cy, leg, u){
  const n = cy.n;
  if (leg === 0) return { Q: n*RG*cy.TH*Math.log(cy.r)*u, W: n*RG*cy.TH*Math.log(cy.r)*u };
  if (leg === 2) return { Q: -n*RG*cy.TC*Math.log(cy.r)*u, W: -n*RG*cy.TC*Math.log(cy.r)*u };
  const p = cyclePoint(cy, leg, u);
  const T0 = leg === 1 ? cy.TH : cy.TC;
  return { Q: 0, W: n * (uMol(cy.g, T0) - uMol(cy.g, p.T)) };
}

/* ========================================================================
   4. 表示のヘルパ
   ======================================================================== */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
             '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(v){ return String(v).split('').map(function(c){ return SUP[c] || c; }).join(''); }
function fmt(v, n){
  n = n || 4;
  if (v == null || !isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10' + sup(Number(p[1]));
  }
  return String(Number(v.toPrecision(n)));
}
function fmtd(v, n){
  if (v == null || !isFinite(v)) return '—';
  if (Math.abs(v) < 1e-12) return '0';
  return (v > 0 ? '+' : '') + fmt(v, n || 4);
}
/* 体積を読みやすい単位で。1 L 前後を扱うので L を主役にする */
function fmtV(V){
  if (!isFinite(V)) return '—';
  if (V >= 1) return fmt(V, 4) + ' m³';
  if (V >= 1e-4) return fmt(V * 1e3, 4) + ' L';
  return fmt(V * 1e6, 4) + ' mL';
}
function fmtP(P){
  if (!isFinite(P)) return '—';
  if (P >= 1e6) return fmt(P * 1e-6, 4) + ' MPa';
  if (P >= 1e3) return fmt(P * 1e-3, 4) + ' kPa';
  return fmt(P, 4) + ' Pa';
}
function fmtLen(L){
  if (L >= 1) return fmt(L, 3) + ' m';
  if (L >= 1e-2) return fmt(L * 100, 3) + ' cm';
  return fmt(L * 1000, 3) + ' mm';
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
/* 速さ v/v_p を 青 → 水 → 黄 → 赤 に写す。断熱膨張で気体が冷えるのが色で見える */
function speedColor(x){
  const t = Math.max(0, Math.min(1, x / 2.2));
  const stops = [[21,101,192],[38,166,214],[126,196,150],[240,190,60],[216,67,21]];
  const s = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(s)), f = s - i;
  const a = stops[i], b = stops[i+1];
  return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*f) + ',' +
                  Math.round(a[1]+(b[1]-a[1])*f) + ',' +
                  Math.round(a[2]+(b[2]-a[2])*f) + ')';
}
let _g2 = null;
function gauss(){
  if (_g2 !== null){ const v = _g2; _g2 = null; return v; }
  let u = 0;
  while (u === 0) u = Math.random();
  const v = Math.random(), r = Math.sqrt(-2 * Math.log(u));
  _g2 = r * Math.sin(2 * Math.PI * v);
  return r * Math.cos(2 * Math.PI * v);
}
/* canvas には下付き文字がないので、"Q_H"・"V_{12}" のような書き方を自分で組む。
   _ の次の 1 文字（{…} なら中身）だけ小さく下げて書く。戻り値は描いた幅 */
function richText(c, x, y, s, size, bold, align){
  const big = (bold ? 'bold ' : '') + size + 'px ' + CFONT;
  const sml = (bold ? 'bold ' : '') + Math.max(7, Math.round(size * 0.74)) + 'px ' + CFONT;
  const parts = [];
  for (let i = 0; i < s.length; i++){
    if (s.charAt(i) === '_' && i + 1 < s.length){
      let t;
      if (s.charAt(i + 1) === '{'){ const e = s.indexOf('}', i + 2); t = s.slice(i + 2, e); i = e; }
      else { t = s.charAt(i + 1); i++; }
      parts.push([t, true]);
    } else if (parts.length && !parts[parts.length - 1][1]){
      parts[parts.length - 1][0] += s.charAt(i);
    } else {
      parts.push([s.charAt(i), false]);
    }
  }
  let w = 0;
  for (let i = 0; i < parts.length; i++){
    c.font = parts[i][1] ? sml : big; w += c.measureText(parts[i][0]).width;
  }
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const ta = c.textAlign; c.textAlign = 'left';
  for (let i = 0; i < parts.length; i++){
    c.font = parts[i][1] ? sml : big;
    c.fillText(parts[i][0], cx, y + (parts[i][1] ? size * 0.21 : 0));
    cx += c.measureText(parts[i][0]).width;
  }
  c.font = big; c.textAlign = ta;
  return w;
}
/* 枠と、横軸の名前（目盛りの下・中央そろえ）。
   縦軸の名前は目盛り文字の幅が分かってからでないと置けないので、
   目盛りを描いたあとに ylabel() を呼ぶ。 */
function axes(c, x0, y0, x1, y1, xlab){
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  if (xlab){
    c.fillStyle = '#5c6670';
    richText(c, (x0 + x1) / 2, y1 + 27, xlab, 10.5, false, 'center');
  }
}
/* 縦軸の名前を 90 度回して、目盛り文字のさらに左へ置く。
   tickX は目盛り文字の右端、tickW はいちばん長い目盛り文字の幅。
   minX（枠の左端）より左には出さない。 */
function ylabel(c, tickX, tickW, y0, y1, text, minX){
  const x = Math.max(minX, tickX - tickW - 3);
  c.save();
  c.translate(x, (y0 + y1) / 2);
  c.rotate(-Math.PI / 2);
  c.fillStyle = '#5c6670';
  richText(c, 0, 0, text, 10.5, false, 'center');
  c.restore();
}
/* 目盛り文字をまとめて描いて、いちばん長いものの幅を返す（ylabel の位置決め用） */
function yTicks(c, list, x, Y, size){
  c.fillStyle = '#5c6670'; c.font = (size || 9) + 'px ' + CFONT; c.textAlign = 'right';
  let w = 0;
  for (let i = 0; i < list.length; i++){
    c.fillText(list[i][0], x, Y(list[i][1]) + 3);
    w = Math.max(w, c.measureText(list[i][0]).width);
  }
  return w;
}
/* 矢印。太さ w の軸に、先端が三角 */
function arrow(c, x0, y0, x1, y1, w, col, alpha){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 1) return;
  const ux = dx / L, uy = dy / L, px = -uy, py = ux;
  const hl = Math.min(L * 0.55, w * 2.1), hw = w * 1.85;
  const bx = x1 - ux * hl, by = y1 - uy * hl;
  c.globalAlpha = alpha == null ? 1 : alpha;
  c.fillStyle = col;
  c.beginPath();
  c.moveTo(x0 + px * w/2, y0 + py * w/2);
  c.lineTo(bx + px * w/2, by + py * w/2);
  c.lineTo(bx + px * hw,  by + py * hw);
  c.lineTo(x1, y1);
  c.lineTo(bx - px * hw,  by - py * hw);
  c.lineTo(bx - px * w/2, by - py * w/2);
  c.lineTo(x0 - px * w/2, y0 - py * w/2);
  c.closePath(); c.fill();
  c.globalAlpha = 1;
}

/* ========================================================================
   5. 分子のエンジン
   ------------------------------------------------------------------------
   位置は箱に対する割合 f ∈ [0,1]³ で持ち、速度は本物の m/s で持つ。
   こうしておくとピストンを動かすとき（Lx を変えるとき）に位置を触らずに済み、
   それがそのまま<b>準静的な膨張</b>＝ 全分子を一斉に引き伸ばす操作になる。

   温度はサイクルの式から決めた値に毎コマ合わせる（全員を同じ倍率 √(T′/T) 倍
   するだけなので Maxwell 分布の形は崩れない）。
   ―― 本当は「後ろへ逃げる壁で跳ね返ると分子が遅くなる」のが断熱膨張で
   温度が下がる仕組みだが、画面ではピストンを分子と同じくらいの速さで
   動かしているので準静的にならない。そこは熱力学の式に任せている。
   ======================================================================== */
function Gas(){
  this.N = 0;
  this.f = null;             /* 位置（箱に対する割合） [3N] */
  this.v = null;             /* 速度 [m/s]             [3N] */
  this.Lx = 1; this.Ly = 1; this.Lz = 1;
  this.mass = 4.65e-26;
  this.T = 300;
}
Gas.prototype.setBox = function(Lx, Ly, Lz){ this.Lx = Lx; this.Ly = Ly; this.Lz = Lz; };
Gas.prototype.seed = function(N, mass, T){
  this.N = N; this.mass = mass; this.T = T;
  this.f = new Float64Array(3 * N);
  this.v = new Float64Array(3 * N);
  const sig = Math.sqrt(KB * T / mass);
  for (let i = 0; i < 3 * N; i++){ this.f[i] = Math.random(); this.v[i] = gauss() * sig; }
  this.normalizeKE(T);
};
Gas.prototype.normalizeKE = function(T){
  let ke = 0;
  for (let i = 0; i < 3 * this.N; i++) ke += this.v[i] * this.v[i];
  ke *= 0.5 * this.mass;
  if (ke <= 0) return;
  const s = Math.sqrt(1.5 * this.N * KB * T / ke);
  for (let i = 0; i < 3 * this.N; i++) this.v[i] *= s;
  this.T = T;
};
/* 描く分子の数だけを変える。いまいる分子はそのまま残す */
Gas.prototype.resizeN = function(N){
  if (N === this.N || N < 1) return;
  const f = new Float64Array(3 * N), v = new Float64Array(3 * N);
  const keep = Math.min(N, this.N);
  f.set(this.f.subarray(0, 3 * keep));
  v.set(this.v.subarray(0, 3 * keep));
  const sig = Math.sqrt(KB * this.T / this.mass);
  for (let i = 3 * keep; i < 3 * N; i++){ f[i] = Math.random(); v[i] = gauss() * sig; }
  this.f = f; this.v = v; this.N = N;
  this.normalizeKE(this.T);
};
/* 熱浴の温度を変える。分布の「形」は変えず、幅だけ変える */
Gas.prototype.setT = function(T){
  if (!this.N || !(T > 0)) return;
  const s = Math.sqrt(T / this.T);
  for (let i = 0; i < 3 * this.N; i++) this.v[i] *= s;
  this.T = T;
};
Gas.prototype.step = function(dt){
  const N = this.N, f = this.f, v = this.v;
  const L = [this.Lx, this.Ly, this.Lz];
  for (let i = 0; i < N; i++){
    for (let d = 0; d < 3; d++){
      const k = 3*i + d;
      f[k] += v[k] * dt / L[d];
      if (f[k] < 0 || f[k] > 1){
        if (f[k] < 0) f[k] = Math.min(1, -f[k]); else f[k] = Math.max(0, 2 - f[k]);
        v[k] = -v[k];
      }
    }
  }
};

/* ========================================================================
   6. シリンダーの絵
   ------------------------------------------------------------------------
   シリンダーの内径（＝画面上の長さ）はサイクル中で最大の体積 V₃ に合わせて
   固定し、ピストンだけが中を往復する。本物のエンジンと同じ描き方で、
   「いまストロークのどこにいるか」がひと目で分かる。
   ======================================================================== */
function hatch(c, x, y, w, h, col, gap){
  c.save();
  c.beginPath(); c.rect(x, y, w, h); c.clip();
  c.strokeStyle = col; c.lineWidth = 1.1;
  c.beginPath();
  for (let t = -h; t < w + h; t += gap){ c.moveTo(x + t, y + h); c.lineTo(x + t + h, y); }
  c.stroke();
  c.restore();
}

/* シリンダーの寸法。Sim 側でも同じ値が要るので関数に切り出してある
   （分子の入る箱の縦横比を、画面の縦横比とそろえるため）
       topPad  … T・P・V を書く行
       labH    … シリンダーの下に ①②③④ の位置を刻む行
       AH      … 熱の矢印が飛ぶ帯
       RH      … 熱源ブロック */
function engineGeom(W, H){
  const narrow = W < 560;
  const pad = 12, RH = 32, AH = 26, labH = 17, dep = 16;
  const rod = narrow ? 30 : 48;
  const topPad = narrow ? 38 : 26;        /* 狭いときは T・P・V とストロークを 2 行に分ける */
  const RY  = H - pad - RH;
  const Y0  = topPad + dep;
  const fh  = Math.max(46, RY - AH - labH - Y0);
  const X0  = pad + 14;
  return { pad:pad, RH:RH, AH:AH, rod:rod, dep:dep, Y0:Y0, X0:X0, RY:RY, fh:fh,
           narrow:narrow,
           BORE:Math.max(60, W - X0 - pad - rod - dep) };
}
function gasWidth(gm, V, Vmax){ return Math.max(11, gm.BORE * Math.min(1, V / Vmax)); }

/* opt = { legIdx, TH, TC, T, P, V, Vmax, anim, dVdt, marks, stroke } */
function drawEngine(c, W, H, gas, opt){
  c.clearRect(0, 0, W, H);
  const gm = engineGeom(W, H);
  const pad = gm.pad, RH = gm.RH;
  const adiab = opt.legIdx === 1 || opt.legIdx === 3;
  const hot   = opt.legIdx === 0;
  const fh = gm.fh, dep = gm.dep, Y0 = gm.Y0, X0 = gm.X0, BORE = gm.BORE;
  const gw = gasWidth(gm, opt.V, opt.Vmax);        /* 気体の長さ */

  /* --- いまの状態（いちばん上）。狭いときは 2 行に折る --- */
  c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT; c.textAlign = 'left';
  const tTxt = 'T = ' + opt.T.toFixed(0) + ' K';
  c.fillText(tTxt, X0 - 2, 15);
  c.font = '11px ' + CFONT; c.fillStyle = '#37474f';
  c.fillText('P = ' + fmtP(opt.P) + '　　V = ' + fmtV(opt.V),
             X0 - 2 + c.measureText(tTxt).width + 18, 15);
  c.fillStyle = '#5c6670';
  if (gm.narrow) richText(c, X0 - 2, 29, opt.stroke || '', 9.5, false, 'left');
  else           richText(c, W - pad, 15, opt.stroke || '', 10, false, 'right');

  /* --- 断熱材（上をふさぐ）。文字は下の帯に書くので、ここは網かけだけ --- */
  if (adiab) hatch(c, X0 - 11, Y0 - dep - 8, BORE + dep + 20, 8, 'rgba(120,144,156,.6)', 7);

  /* --- シリンダー本体（奥の面と稜線） --- */
  const bx = X0 + dep, by = Y0 - dep;
  c.strokeStyle = 'rgba(55,71,79,.20)'; c.lineWidth = 1;
  c.strokeRect(bx, by, BORE, fh);
  c.beginPath();
  c.moveTo(X0, Y0);            c.lineTo(bx, by);
  c.moveTo(X0 + BORE, Y0);     c.lineTo(bx + BORE, by);
  c.moveTo(X0, Y0 + fh);       c.lineTo(bx, by + fh);
  c.moveTo(X0 + BORE, Y0 + fh);c.lineTo(bx + BORE, by + fh);
  c.stroke();
  /* ピストンより右（気体のない側） */
  c.fillStyle = 'rgba(236,239,241,.55)';
  c.fillRect(X0 + gw, Y0, BORE - gw, fh);
  /* 気体のいる側にうっすら色を敷く（温度の色） */
  c.fillStyle = opt.T > (opt.TH + opt.TC) / 2 ? 'rgba(216,67,21,.045)' : 'rgba(21,101,192,.05)';
  c.fillRect(X0, Y0, gw, fh);

  /* --- 分子。奥のものから描く --- */
  const N = gas.N, f = gas.f, v = gas.v;
  const vp = Math.sqrt(2 * KB * gas.T / gas.mass);
  const rBase = Math.max(1.35, Math.min(3.6, 0.0125 * fh * Math.cbrt(320 / Math.max(1, N))));
  const px = function(fx, fy, fz){
    return [X0 + fx * gw + fz * dep, Y0 + (1 - fy) * fh - fz * dep];
  };
  let ord = opt.order;
  if (!ord || ord.length !== N){
    ord = opt.order = new Int32Array(N);
    for (let i = 0; i < N; i++) ord[i] = i;
  }
  for (let a = 1; a < N; a++){                    /* 奥行きで並べ替え（ほぼ整列済み） */
    const key = ord[a], kz = f[3*key+2];
    let b = a - 1;
    while (b >= 0 && f[3*ord[b]+2] < kz){ ord[b+1] = ord[b]; b--; }
    ord[b+1] = key;
  }
  for (let a = 0; a < N; a++){
    const i = ord[a], fz = f[3*i+2];
    const p = px(f[3*i], f[3*i+1], fz);
    const s = Math.hypot(v[3*i], v[3*i+1], v[3*i+2]);
    c.globalAlpha = 1 - 0.42 * fz;
    c.fillStyle = speedColor(s / vp);
    c.beginPath(); c.arc(p[0], p[1], rBase * (1.12 - 0.40 * fz), 0, 6.2832); c.fill();
  }
  c.globalAlpha = 1;

  /* --- シリンダーの外枠と、閉じた左端（シリンダーヘッド） --- */
  c.strokeStyle = 'rgba(55,71,79,.5)'; c.lineWidth = 1.5;
  c.strokeRect(X0, Y0, BORE, fh);
  c.fillStyle = 'rgba(55,71,79,.72)';
  c.beginPath();
  c.moveTo(X0, Y0); c.lineTo(X0 - 7, Y0);
  c.lineTo(X0 - 7, Y0 + fh); c.lineTo(X0, Y0 + fh);
  c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(X0 - 7, Y0); c.lineTo(X0 - 7 + dep, Y0 - dep);
  c.lineTo(X0 + dep, Y0 - dep); c.lineTo(X0, Y0);
  c.closePath(); c.fill();

  /* --- ピストン --- */
  const wx = X0 + gw;
  c.fillStyle = '#8d6e63';
  c.beginPath();                                   /* 上面（奥行き） */
  c.moveTo(wx, Y0); c.lineTo(wx + dep, Y0 - dep);
  c.lineTo(wx + dep, Y0 - dep + fh); c.lineTo(wx, Y0 + fh);
  c.closePath(); c.fill();
  c.fillRect(wx - 4, Y0, 5, fh);                   /* 正面 */
  c.strokeStyle = '#6d4c41'; c.lineWidth = 2.4;    /* 軸 */
  const ry = Y0 - dep + fh / 2;
  c.beginPath(); c.moveTo(wx + dep, ry); c.lineTo(W - pad, ry); c.stroke();

  /* --- 仕事の矢印（軸の上） --- */
  const expand = opt.dVdt > 0;
  if (Math.abs(opt.dVdt) > 1e-14){
    const cxm = (wx + dep + W - pad) / 2;
    const half = Math.min(26, (W - pad - wx - dep) / 2 - 3);
    if (half > 8){
      arrow(c, cxm - (expand ? half : -half), ry - 15, cxm + (expand ? half : -half), ry - 15,
            5, expand ? '#2e7d32' : '#90a4ae', .95);
      c.fillStyle = expand ? '#2e7d32' : '#78909c';
      c.font = 'bold 9.5px ' + CFONT; c.textAlign = 'right';
      c.fillText(expand ? '気体が仕事をする' : '気体が仕事をされる', W - pad, ry - 24);
    }
  }

  /* --- シリンダーの下：①②③④ がストロークのどこかを刻む --- */
  const ly = Y0 + fh + 13;
  c.strokeStyle = 'rgba(31,35,40,.20)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(X0, ly - 8); c.lineTo(X0 + BORE, ly - 8); c.stroke();
  if (opt.marks){
    /* 体積の小さい順に見て、近すぎるものは番号を出さない
       （重なって読めなくなるだけなので）。ふつうは ①②④③ の順だが、
       膨張比 r が断熱膨張の伸び A を超えると ④ が ② より内側に来るので、毎回並べ替える */
    const seq = [0, 1, 2, 3].sort(function(a, b){ return opt.marks[a] - opt.marks[b]; });
    let lastX = -99;
    for (let s = 0; s < 4; s++){
      const i = seq[s];
      const mx = X0 + BORE * Math.min(1, opt.marks[i] / opt.Vmax);
      c.strokeStyle = LEG[i].col; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(mx, ly - 12); c.lineTo(mx, ly - 4); c.stroke();
      if (mx - lastX < 13) continue;
      lastX = mx;
      c.fillStyle = LEG[i].col; c.font = 'bold 9.5px ' + CFONT; c.textAlign = 'center';
      c.fillText('①②③④'.charAt(i), mx, ly + 5);
    }
  }

  /* --- 熱源 / 断熱材（下） --- */
  const RY = gm.RY;
  const rx0 = X0 - 8, rw = BORE + dep + 16;
  const ay0 = ly + 8, ay1 = RY - 3, span = ay1 - ay0;
  if (adiab){
    c.fillStyle = 'rgba(236,239,241,.9)';
    c.fillRect(rx0, RY, rw, RH);
    hatch(c, rx0, RY, rw, RH, 'rgba(120,144,156,.5)', 8);
    c.strokeStyle = 'rgba(120,144,156,.6)'; c.lineWidth = 1; c.strokeRect(rx0, RY, rw, RH);
    c.fillStyle = '#546e7a'; c.font = 'bold 11px ' + CFONT; c.textAlign = 'center';
    c.fillText('断熱材 ―― 熱源から切り離してある（Q = 0）', rx0 + rw / 2, RY + RH / 2 + 4);
  } else {
    const col = hot ? '#d84315' : '#1565c0';
    const g2 = c.createLinearGradient(0, RY, 0, RY + RH);
    g2.addColorStop(0, hot ? '#e8562a' : '#1c72d0');
    g2.addColorStop(1, hot ? '#b3350f' : '#0d4f96');
    c.fillStyle = g2; c.fillRect(rx0, RY, rw, RH);
    c.fillStyle = '#fff';
    richText(c, rx0 + 10, RY + RH / 2 + 4,
             (hot ? '高温熱源　T_H = ' : '低温熱源　T_C = ') +
             (hot ? opt.TH : opt.TC).toFixed(0) + ' K', 11.5, true, 'left');
    if (!gm.narrow){
      c.fillStyle = 'rgba(255,255,255,.9)'; c.font = 'bold 10px ' + CFONT; c.textAlign = 'right';
      c.fillText(hot ? '気体へ熱を渡す　Q > 0' : '気体から熱を受け取る　Q < 0',
                 rx0 + rw - 10, RY + RH / 2 + 4);
    }
    /* 熱の矢印（流れて見えるように位置をずらす） */
    const na = Math.max(3, Math.min(10, Math.round(rw / 74)));
    const ph = (opt.anim / 1.15) % 1;
    for (let i = 0; i < na; i++){
      const ax = rx0 + rw * (i + 0.5) / na;
      const t  = (ph + i * 0.13) % 1;
      const y  = hot ? ay1 - t * span : ay0 + t * span;
      arrow(c, ax, y + (hot ? 10 : -10), ax, y, 5, col, Math.sin(Math.PI * t) * 0.85 + 0.15);
    }
  }
}

/* ========================================================================
   7. P–V 図
   ------------------------------------------------------------------------
   囲む面積 ∮P dV がそのまま 1 周で取り出せる仕事になる。
   ======================================================================== */
function drawPV(c, x0, y0, W, H, cy, cur, showArea){
  const pl = 68, pr = 20, pt = 19, pb = 34;
  const ax0 = x0 + pl, ay0 = y0 + pt, ax1 = x0 + W - pr, ay1 = y0 + H - pb;
  const Vm = cy.Vmax * 1.07, Pm = cy.Pmax * 1.09;
  const X = function(V){ return ax0 + Math.max(0, Math.min(1, V / Vm)) * (ax1 - ax0); };
  const Y = function(P){ return ay1 - Math.max(0, Math.min(1, P / Pm)) * (ay1 - ay0); };

  axes(c, ax0, ay0, ax1, ay1, 'V [L]');

  /* 薄い等温線（T_H と T_C）。行程 ①③ がこの上に乗る */
  c.setLineDash([4, 3]); c.lineWidth = 1;
  [[cy.TH, 'rgba(216,67,21,.30)'], [cy.TC, 'rgba(21,101,192,.30)']].forEach(function(it){
    c.strokeStyle = it[1]; c.beginPath();
    let pen = false;
    for (let i = 0; i <= 110; i++){
      const V = Vm * (0.012 + 0.988 * i / 110), P = cy.n * RG * it[0] / V;
      if (P > Pm){ pen = false; continue; }
      if (!pen){ c.moveTo(X(V), Y(P)); pen = true; } else c.lineTo(X(V), Y(P));
    }
    c.stroke();
  });
  c.setLineDash([]);

  /* 囲む面積 ＝ 仕事 */
  let cxW = 0, cyW = 0, nW = 0;
  if (showArea){
    c.beginPath();
    for (let L = 0; L < 4; L++){
      const p = cy.path[L];
      for (let i = 0; i < p.length; i++){
        if (L === 0 && i === 0) c.moveTo(X(p[i].V), Y(p[i].P)); else c.lineTo(X(p[i].V), Y(p[i].P));
        cxW += X(p[i].V); cyW += Y(p[i].P); nW++;
      }
    }
    c.closePath();
    c.fillStyle = 'rgba(46,125,50,.22)'; c.fill();
    cxW /= nW; cyW /= nW;
  }

  /* 4 つの行程 */
  for (let L = 0; L < 4; L++){
    const p = cy.path[L];
    c.strokeStyle = LEG[L].col; c.lineWidth = 2.4; c.beginPath();
    for (let i = 0; i < p.length; i++){
      if (i === 0) c.moveTo(X(p[i].V), Y(p[i].P)); else c.lineTo(X(p[i].V), Y(p[i].P));
    }
    c.stroke();
    /* 進む向きの矢印 */
    const a = p[Math.floor(p.length * 0.5)], b = p[Math.floor(p.length * 0.5) + 1];
    if (b){
      const dx = X(b.V) - X(a.V), dy = Y(b.P) - Y(a.P), dl = Math.hypot(dx, dy);
      if (dl > 0.4){
        const ux = dx / dl, uy = dy / dl, mx = X(a.V), my = Y(a.P);
        c.fillStyle = LEG[L].col; c.beginPath();
        c.moveTo(mx + ux * 7, my + uy * 7);
        c.lineTo(mx - ux * 3 + uy * 4.6, my - uy * 3 - ux * 4.6);
        c.lineTo(mx - ux * 3 - uy * 4.6, my - uy * 3 + ux * 4.6);
        c.closePath(); c.fill();
      }
    }
  }

  /* 囲む面積が何なのかを、その真ん中に書いておく */
  if (showArea && nW){
    c.fillStyle = 'rgba(27,94,32,.92)';
    richText(c, cxW + 18, cyW + 4, 'W = ' + fmt(cy.W, 4) + ' J', 10.5, true, 'left');
  }

  /* 角の 4 状態。ラベルは 4 点の重心から外向きへ逃がすので、曲線と重ならない */
  let gx = 0, gy = 0;
  for (let i = 0; i < 4; i++){ gx += X(cy.st[i].V) / 4; gy += Y(cy.st[i].P) / 4; }
  for (let i = 0; i < 4; i++){
    const px = X(cy.st[i].V), py = Y(cy.st[i].P);
    const dx = px - gx, dy = py - gy, dl = Math.max(1e-6, Math.hypot(dx, dy));
    c.fillStyle = '#15202b';
    c.beginPath(); c.arc(px, py, 3.6, 0, 6.2832); c.fill();
    c.font = 'bold 11px ' + CFONT; c.textAlign = 'center';
    c.fillText('①②③④'.charAt(i),
      Math.max(ax0 + 8, Math.min(ax1 - 8, px + dx / dl * 14)),
      Math.max(ay0 + 12, Math.min(ay1 - 4, py + dy / dl * 14 + 4)));
  }
  /* いまいる点 */
  if (cur){
    c.fillStyle = LEG[cur.leg].col;
    c.beginPath(); c.arc(X(cur.V), Y(cur.P), 6, 0, 6.2832); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 1.8; c.stroke();
  }
  /* 目盛り */
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  for (let i = 1; i <= 3; i++) c.fillText(fmt(Vm * i / 3 * 1e3, 2), X(Vm * i / 3), ay1 + 12);
  const tw = yTicks(c, [1, 2, 3].map(function(i){ return [fmt(Pm * i / 3, 3), Pm * i / 3]; }), ax0 - 4, Y);
  ylabel(c, ax0 - 4, tw, ay0, ay1, 'P [Pa]', x0 + 11);
  c.fillStyle = '#15202b'; c.font = 'bold 10px ' + CFONT; c.textAlign = 'left';
  c.fillText('P–V 図 ― 囲む面積が 1 周の仕事', x0 + 6, y0 + 12);
}

/* ========================================================================
   8. T–S 図
   ------------------------------------------------------------------------
   Carnot サイクルは T–S 図では<b>ただの長方形</b>になる。しかも
     Q_H = T_H ΔS（柱ぜんぶ）、W = (T_H−T_C)ΔS（長方形）、|Q_C| = T_C ΔS（下の帯）
   なので、Q_H = W + |Q_C| が面積の足し算そのものとして見える。
   ======================================================================== */
function drawTS(c, x0, y0, W, H, cy, cur){
  const pl = 52, pr = 46, pt = 19, pb = 34;
  const ax0 = x0 + pl, ay0 = y0 + pt, ax1 = x0 + W - pr, ay1 = y0 + H - pb;
  const Sm = cy.dS * 1.30, Tm = cy.TH * 1.16;
  const X = function(S){ return ax0 + Math.max(0, Math.min(1, S / Sm)) * (ax1 - ax0); };
  const Y = function(T){ return ay1 - Math.max(0, Math.min(1, T / Tm)) * (ay1 - ay0); };

  axes(c, ax0, ay0, ax1, ay1, 'S − S_1 [J/K]');

  const xa = X(0), xb = X(cy.dS), yH = Y(cy.TH), yC = Y(cy.TC), y0b = Y(0);

  /* |Q_C| = T_C ΔS（下の青い帯） */
  c.fillStyle = 'rgba(21,101,192,.20)';
  c.fillRect(xa, yC, xb - xa, y0b - yC);
  /* W = (T_H − T_C) ΔS（緑の長方形） */
  c.fillStyle = 'rgba(46,125,50,.24)';
  c.fillRect(xa, yH, xb - xa, yC - yH);

  /* 4 行程の辺 */
  const seg = [[xa, yH, xb, yH, 0], [xb, yH, xb, yC, 1], [xb, yC, xa, yC, 2], [xa, yC, xa, yH, 3]];
  c.lineWidth = 2.6;
  seg.forEach(function(s){
    c.strokeStyle = LEG[s[4]].col;
    c.beginPath(); c.moveTo(s[0], s[1]); c.lineTo(s[2], s[3]); c.stroke();
  });

  /* ラベル */
  if (xb - xa > 74 && yC - yH > 22){
    c.fillStyle = '#1b5e20';
    richText(c, (xa + xb) / 2, (yH + yC) / 2 + 4, 'W = (T_H − T_C) ΔS', 11, true, 'center');
  }
  if (xb - xa > 74 && y0b - yC > 20){
    c.fillStyle = '#0d47a1';
    richText(c, (xa + xb) / 2, (yC + y0b) / 2 + 4, '|Q_C| = T_C ΔS', 11, true, 'center');
  }
  /* Q_H は柱ぜんぶ、を右に添える */
  c.strokeStyle = 'rgba(230,81,0,.85)'; c.lineWidth = 1.4; c.setLineDash([3, 3]);
  c.beginPath(); c.moveTo(xb + 6, yH); c.lineTo(xb + 6, y0b); c.stroke();
  c.setLineDash([]);
  c.save();
  c.translate(xb + 17, (yH + y0b) / 2); c.rotate(-Math.PI / 2);
  c.fillStyle = '#e65100';
  richText(c, 0, 0, 'Q_H = T_H ΔS', 10, true, 'center');
  c.restore();

  /* 角の番号。①② は長方形の上、③④ は T_C の線の下（どちらも中身と重ならない） */
  const cs = [[xa, yH, '①', 8, -7], [xb, yH, '②', -8, -7],
              [xb, yC, '③', -8, 14], [xa, yC, '④', 8, 14]];
  cs.forEach(function(p){
    c.fillStyle = '#15202b';
    c.beginPath(); c.arc(p[0], p[1], 3.6, 0, 6.2832); c.fill();
    c.font = 'bold 11px ' + CFONT; c.textAlign = 'center';
    c.fillText(p[2], p[0] + p[3], p[1] + p[4]);
  });
  if (cur){
    c.fillStyle = LEG[cur.leg].col;
    c.beginPath(); c.arc(X(cur.S), Y(cur.T), 6, 0, 6.2832); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 1.8; c.stroke();
  }
  /* 目盛り */
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
  for (let i = 1; i <= 3; i++) c.fillText(fmt(Sm * i / 3, 2), X(Sm * i / 3), ay1 + 12);
  const tw = yTicks(c, [1, 2, 3].map(function(i){
    return [String(Math.round(Tm * i / 3)), Tm * i / 3];
  }), ax0 - 4, Y);
  ylabel(c, ax0 - 4, tw, ay0, ay1, 'T [K]', x0 + 11);
  c.fillStyle = '#15202b'; c.font = 'bold 10px ' + CFONT; c.textAlign = 'left';
  c.fillText('T–S 図 ― Carnot サイクルは長方形', x0 + 6, y0 + 12);
}

/* ========================================================================
   9. エネルギーの流れ（Sankey 図）
   ------------------------------------------------------------------------
   帯の幅をエネルギーに比例させる。入った Q_H が W と |Q_C| に分かれ、
   幅が必ずつり合う（＝第一法則）。細い緑が「取り出せるぶん」。
   ======================================================================== */
function drawFlow(c, x0, y0, W, H, cy, acc, anim){
  const QH = cy.QH, WK = cy.W, QC = -cy.QC;
  const pad = 10;
  const barH = 17;
  const topY = y0 + pad + 10, botY = y0 + H - pad - barH - 12;
  const scale = Math.min(74, (botY - topY) * 0.42) / Math.max(QH, 1e-12);
  const wQH = QH * scale, wW = WK * scale, wQC = QC * scale;
  const ex = x0 + Math.max(96, W * 0.30);          /* エンジンの中心 x */
  const er = Math.max(24, Math.min(34, wQH * 0.52 + 12));
  const ey = (topY + barH + botY) / 2;

  /* 熱源のバー */
  const barW = Math.min(W - pad * 2 - 96, Math.max(150, W * 0.52));
  c.fillStyle = '#d84315'; c.fillRect(x0 + pad, topY, barW, barH);
  c.fillStyle = '#1565c0'; c.fillRect(x0 + pad, botY, barW, barH);
  c.fillStyle = '#fff';
  richText(c, x0 + pad + 8, topY + barH - 5, '高温熱源　T_H = ' + cy.TH.toFixed(0) + ' K', 10.5, true, 'left');
  richText(c, x0 + pad + 8, botY + barH - 5, '低温熱源　T_C = ' + cy.TC.toFixed(0) + ' K', 10.5, true, 'left');

  /* Q_H の帯（上から） */
  const dash = -(anim * 26) % 16;
  const band = function(cx, ya, yb, w, col, alpha){
    c.fillStyle = col; c.globalAlpha = alpha;
    c.fillRect(cx - w / 2, ya, w, yb - ya);
    c.globalAlpha = 1;
    c.save(); c.beginPath(); c.rect(cx - w / 2, ya, w, yb - ya); c.clip();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 3;
    c.setLineDash([6, 10]); c.lineDashOffset = dash;
    c.beginPath(); c.moveTo(cx, ya - 20); c.lineTo(cx, yb + 20); c.stroke();
    c.setLineDash([]); c.restore();
  };
  band(ex, topY + barH, ey - er + 4, wQH, '#e65100', .88);
  band(ex, ey + er - 4, botY, wQC, '#1565c0', .82);

  /* W の帯（右へ）。矢じりは帯の太さより少しだけ大きくする程度に留める */
  const wx1 = x0 + W - pad - 20;
  c.fillStyle = '#2e7d32'; c.globalAlpha = .9;
  c.fillRect(ex + er - 4, ey - wW / 2, wx1 - ex - er + 4, wW);
  const hh = Math.max(7, wW * 0.78);
  c.beginPath();
  c.moveTo(wx1, ey - wW / 2 - hh);
  c.lineTo(wx1 + 19, ey);
  c.lineTo(wx1, ey + wW / 2 + hh);
  c.closePath(); c.fill();
  c.globalAlpha = 1;

  /* エンジン */
  c.fillStyle = '#fff'; c.strokeStyle = '#37474f'; c.lineWidth = 2;
  c.beginPath(); c.arc(ex, ey, er, 0, 6.2832); c.fill(); c.stroke();
  c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT; c.textAlign = 'center';
  c.fillText('エンジン', ex, ey + 4);

  /* 数字 */
  c.fillStyle = '#bf360c';
  richText(c, ex + wQH / 2 + 9, (topY + barH + ey - er) / 2 + 4,
           'Q_H = ' + fmt(QH, 4) + ' J', 10.5, true, 'left');
  c.fillStyle = '#0d47a1';
  richText(c, ex + wQC / 2 + 9, (ey + er + botY) / 2 + 4,
           '|Q_C| = ' + fmt(QC, 4) + ' J', 10.5, true, 'left');
  c.fillStyle = '#1b5e20';
  richText(c, wx1 - 4, ey - Math.max(wW / 2, 7) - 6, 'W = ' + fmt(WK, 4) + ' J', 10.5, true, 'right');
  c.fillStyle = '#2e7d32'; c.font = '9.5px ' + CFONT; c.textAlign = 'right';
  c.fillText('取り出せる仕事（' + (cy.eta * 100).toFixed(1) + ' %）', wx1 - 4, ey + Math.max(wW / 2, 7) + 13);

  /* 収支の式と、回した回数。狭いときは数字を落として式だけにする */
  c.fillStyle = '#15202b';
  richText(c, x0 + pad, y0 + H - 8,
           W < 560 ? '1 周あたりの収支：  Q_H = W + |Q_C|'
                   : '1 周あたりの収支：  Q_H = W + |Q_C|   →   ' +
                     fmt(QH, 5) + ' = ' + fmt(WK, 5) + ' + ' + fmt(QC, 5) + '  [J]',
           10, true, 'left');
  if (W >= 560 && acc && acc.cycles >= 0.05){
    c.textAlign = 'right'; c.font = '10px ' + CFONT; c.fillStyle = '#5c6670';
    c.fillText(acc.cycles.toFixed(2) + ' 周ぶん回した ―― 取り出した仕事の合計 ' +
               fmt(acc.cycles * WK, 4) + ' J', x0 + W - pad, y0 + H - 8);
  }
}

/* おおよその実機の値（教科書・メーカー公表値の桁を丸めたもの） */
const REAL = [
  { nm:'蒸気機関車',        TH:473,  TC:293, eta:.08 },
  { nm:'蒸気タービン発電',  TH:873,  TC:303, eta:.45 },
  { nm:'ガソリンエンジン',  TH:2500, TC:800, eta:.30 },
  { nm:'コンバインド発電',  TH:1600, TC:300, eta:.62 }
];
function drawEtaFig(c, W, H, cy, wide){
  c.clearRect(0, 0, W, H);
  const halves = wide ? [[0, 0, W * .52, H], [W * .52, 0, W * .48, H]]
                      : [[0, 0, W, H / 2], [0, H / 2, W, H / 2]];
  if (wide){
    c.strokeStyle = 'rgba(31,35,40,.10)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(W * .52, 10); c.lineTo(W * .52, H - 10); c.stroke();
  }
  /* --- 左：η vs T_H --- */
  (function(x0, y0, w, h){
    const pl = 52, pr = 22, pt = 19, pb = 34;
    const ax0 = x0 + pl, ay0 = y0 + pt, ax1 = x0 + w - pr, ay1 = y0 + h - pb;
    const THm = Math.max(1400, cy.TH * 1.25);
    const X = function(T){ return ax0 + Math.max(0, Math.min(1, T / THm)) * (ax1 - ax0); };
    const Y = function(e){ return ay1 - Math.max(0, Math.min(1, e)) * (ay1 - ay0); };
    axes(c, ax0, ay0, ax1, ay1, 'T_H [K]');
    c.strokeStyle = '#2e7d32'; c.lineWidth = 2.4; c.beginPath();
    let pen = false;
    for (let i = 0; i <= 180; i++){
      const T = THm * i / 180;
      if (T <= cy.TC){ pen = false; continue; }
      const e = 1 - cy.TC / T;
      if (!pen){ c.moveTo(X(T), Y(e)); pen = true; } else c.lineTo(X(T), Y(e));
    }
    c.stroke();
    /* T_C の縦線（ここでは η = 0） */
    c.strokeStyle = 'rgba(21,101,192,.55)'; c.lineWidth = 1.2; c.setLineDash([4, 3]);
    c.beginPath(); c.moveTo(X(cy.TC), ay0); c.lineTo(X(cy.TC), ay1); c.stroke();
    c.setLineDash([]);
    c.fillStyle = '#1565c0';
    richText(c, X(cy.TC) + 4, ay1 - 6, 'T_H = T_C では η = 0', 9, false, 'left');
    /* いまの点 */
    c.fillStyle = '#2e7d32';
    c.beginPath(); c.arc(X(cy.TH), Y(cy.eta), 5.5, 0, 6.2832); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 1.8; c.stroke();
    c.fillStyle = '#1b5e20'; c.font = 'bold 10px ' + CFONT; c.textAlign = 'right';
    c.fillText('いま  η = ' + (cy.eta * 100).toFixed(1) + ' %',
               Math.min(ax1 - 2, X(cy.TH) + 66), Math.max(ay0 + 22, Y(cy.eta) - 8));
    c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'center';
    for (let i = 1; i <= 3; i++) c.fillText(String(Math.round(THm * i / 3)), X(THm * i / 3), ay1 + 12);
    const tw = yTicks(c, [1, 2, 3, 4].map(function(i){ return [(i * 25) + '%', i / 4]; }), ax0 - 4, Y);
    ylabel(c, ax0 - 4, tw, ay0, ay1, 'η', x0 + 11);
    c.fillStyle = '#15202b';
    richText(c, x0 + 6, y0 + 12,
             'η = 1 − T_C/T_H　（T_C = ' + cy.TC.toFixed(0) + ' K のとき）', 10, true, 'left');
  }).apply(null, halves[0]);

  /* --- 右：実機との比べ --- */
  (function(x0, y0, w, h){
    const pl = 92, pr = 42, pt = 20, pb = 18;
    const ax0 = x0 + pl, ay0 = y0 + pt, ax1 = x0 + w - pr, ay1 = y0 + h - pb;
    c.fillStyle = '#15202b'; c.font = 'bold 10px ' + CFONT; c.textAlign = 'left';
    c.fillText('現実の熱機関（おおよその値）', x0 + 8, y0 + 11);
    const rows = REAL.length;
    const bh = Math.min(13, (ay1 - ay0 - (rows - 1) * 9) / (rows * 2));
    const gap = (ay1 - ay0 - rows * bh * 2) / Math.max(1, rows - 1);
    for (let i = 0; i < rows; i++){
      const r = REAL[i], yy = ay0 + i * (bh * 2 + gap);
      const lim = 1 - r.TC / r.TH;
      c.fillStyle = '#5c6670'; c.font = '9.5px ' + CFONT; c.textAlign = 'right';
      c.fillText(r.nm, ax0 - 6, yy + bh + 2);
      c.font = '8.5px ' + CFONT; c.fillStyle = '#90a4ae';
      c.fillText(r.TH + '/' + r.TC + ' K', ax0 - 6, yy + bh + 12);
      c.fillStyle = 'rgba(46,125,50,.28)';
      c.fillRect(ax0, yy, (ax1 - ax0) * lim, bh);
      c.fillStyle = '#2e7d32';
      c.fillRect(ax0, yy + bh + 1, (ax1 - ax0) * r.eta, bh);
      c.fillStyle = '#5c6670'; c.font = '8.5px ' + CFONT; c.textAlign = 'left';
      c.fillText((lim * 100).toFixed(0) + '%', ax0 + (ax1 - ax0) * lim + 3, yy + bh - 2);
      c.fillStyle = '#1b5e20';
      c.fillText((r.eta * 100).toFixed(0) + '%', ax0 + (ax1 - ax0) * r.eta + 3, yy + bh * 2);
    }
    c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'left';
    c.fillText('薄い棒 = Carnot 限界　／　濃い棒 = 実際', x0 + 8, ay1 + 13);
  }).apply(null, halves[1]);
}

/* ========================================================================
   11. パネルの組み立て
   ======================================================================== */
const app = document.getElementById('qsim');

const SECS_PER_LEG = 3.0;   /* 1 行程にかける画面上の秒数（速さ 1 倍のとき） */
const CROSS        = 2.6;   /* v_rms(T_H) の分子が箱の高さを横切る秒数。
                               ここを固定しておくと、温度が下がったときに
                               分子が実際にゆっくりになるのが目で見える */
const DOTS_DEF     = 320;

function vRmsOf(g, T){ return Math.sqrt(3 * KB * T / g.m); }

function Sim(key, root){
  this.key   = key;                 /* 'engine' | 'ledger' */
  this.root  = root;
  this.gasKey = 'N2';
  this.TH = 600; this.TC = 300;     /* 高温・低温熱源 [K]（η = 50 % ちょうど） */
  this.P1 = 10 * ATM;               /* ①の圧力 [Pa] */
  this.V1 = 1e-3;                   /* ①の体積 [m³] = 1 L */
  this.r  = 2;                      /* 等温膨張の膨張比 V₂/V₁ */
  this.phase   = 0;                 /* 0 … 4（行程 + 行程内の進み） */
  /* 教材ページには iframe がいくつも並ぶ。全部がいっせいに動き出すと
     落ち着いて読めないので、止まった状態で開く（読む人が選んで再生する） */
  this.playing = false;
  this.speed   = 1;
  this.nDots   = DOTS_DEF;
  this.cycles  = 0;
  this.anim    = 0;
  this.gas = new Gas();
  this.opt = {};
  this.build();
  this.resize();
  this.recompute();
  if (key === 'engine') this.reseed();
}

/* PV = nRT があるので、n は 3 つから決まる */
Sim.prototype.nOf = function(){ return this.P1 * this.V1 / (RG * this.TH); };

/* ------------------------------------------------------------------------
   サイクルを組み立て直す
   ------------------------------------------------------------------------ */
Sim.prototype.recompute = function(){
  const g = gasOf(this.gasKey);
  if (!(this.TC < this.TH)) this.TC = Math.max(1, this.TH * 0.5);
  const cy = buildCycle(g, this.nOf(), this.TH, this.TC, this.V1, this.r);
  /* P–V 図の曲線は毎コマ作り直す必要がないので、ここで作っておく */
  cy.path = [];
  for (let L = 0; L < 4; L++){
    const arr = [], M = (L === 1 || L === 3) ? 60 : 44;
    for (let i = 0; i <= M; i++) arr.push(cyclePoint(cy, L, i / M));
    cy.path.push(arr);
  }
  this.cy = cy;
  this.syncInputs();
  this.checkMsg();
  if (this.key === 'ledger') this.fillTables();
};

/* いまいる点 */
Sim.prototype.cur = function(){
  const cy = this.cy;
  let ph = this.phase % 4; if (ph < 0) ph += 4;
  const leg = Math.min(3, Math.floor(ph)), u = ph - leg;
  const p = cyclePoint(cy, leg, u);
  const nR = cy.n * RG;
  let S;                                             /* S − S₁ */
  if      (leg === 0) S = nR * Math.log(p.V / cy.st[0].V);
  else if (leg === 1) S = cy.dS;
  else if (leg === 2) S = cy.dS + nR * Math.log(p.V / cy.st[2].V);
  else                S = 0;
  const e = 4e-4;
  const dV = cyclePoint(cy, leg, Math.min(1, u + e)).V - cyclePoint(cy, leg, Math.max(0, u - e)).V;
  return { leg:leg, u:u, T:p.T, P:p.P, V:p.V, S:S, dV:dV };
};

/* 分子の入る箱を、画面のシリンダーと同じ縦横比に合わせる。
   ------------------------------------------------------------------------
   画面のシリンダーは「長さ ∝ 体積・高さ一定」の模式図なので、本当の
   立体の形とは違う。ただし箱の縦横比を画面に合わせておけば
     ・分子の動きが画面上で等方に見える
     ・箱の体積 ∝ 画面の面積 ∝ V   ⇒  混み具合が本当の数密度どおり
   になる。長さの基準は「v_rms(T_H) の分子が CROSS 秒で高さを横切る」ように取る。 */
Sim.prototype.syncGas = function(cur){
  if (!this.cvEngine) return;
  const gm = engineGeom(this.cw, this.ch);
  const gw = gasWidth(gm, cur.V, this.cy.Vmax);
  const Ly = vRmsOf(gasOf(this.gasKey), this.TH) * CROSS;
  this.gas.setBox(Ly * gw / gm.fh, Ly, Ly);
  this.gas.setT(cur.T);
};
Sim.prototype.reseed = function(){
  if (!this.cvEngine) return;
  const c = this.cur();
  this.gas.seed(this.nDots, gasOf(this.gasKey).m, c.T);
  this.syncGas(c);
};

Sim.prototype.build = function(){

      b.type = 'button'; b.style.setProperty('--sc', L.col);

      '<span><i class="dot" style="background:#7ec496"></i>ふつう</span>' +
      '<span><i class="dot" style="background:#d84315"></i>速い分子</span>' +
      '<span><i style="background:#8d6e63"></i>ピストン</span>' +
      '<span><i style="background:#78909c"></i>断熱材</span>' +
      '<span><i style="background:#2e7d32"></i>仕事</span>'));

    /* --- P–V 図と T–S 図 --- */
    const st2 = el('div', 'stage');
    this.cvDiag = document.createElement('canvas');
    st2.appendChild(this.cvDiag); left.appendChild(st2);
    this.ctxD = this.cvDiag.getContext('2d');

    /* --- エネルギーの流れ --- */
    const st3 = el('div', 'stage');
    this.cvFlow = document.createElement('canvas');
    st3.appendChild(this.cvFlow); left.appendChild(st3);
    this.ctxF = this.cvFlow.getContext('2d');

    this.readout = el('div', 'readout'); left.appendChild(this.readout);
  } else {
