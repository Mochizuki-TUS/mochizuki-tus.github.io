      '<div class="row"><span class="big">—</span>' +
      '<span class="eqs"><i>η</i> = <i>W</i>/<i>Q</i><sub>H</sub> = <b class="e1">—</b>' +
      ' 　と　 1 − <i>T</i><sub>C</sub>/<i>T</i><sub>H</sub> = <b class="e2">—</b><br>' +
      '<span class="e3"></span></span></div>' +
      '<div class="gauge"><div class="fill"></div></div>' +
      '<div class="gscale"><span>0 %</span><span>50 %</span><span>100 %</span></div>';
    left.appendChild(eb);
    this.etaBig = eb.querySelector('.big');
    this.etaE1 = eb.querySelector('.e1');
    this.etaE2 = eb.querySelector('.e2');
    this.etaE3 = eb.querySelector('.e3');
    this.etaFill = eb.querySelector('.fill');

    this.tbState = this.mkTable(left, '4 つの状態',
      '<i>PV</i> = <i>nRT</i> で結ばれた 4 つの角。<i>U</i> は温度だけで決まるので ①② と ③④ で同じ値になる',
      ['状態', '<i>T</i> [K]', '<i>P</i>', '<i>V</i>',
       '<i>S</i> − <i>S</i><sub>1</sub> [J/K]', '<i>U</i> − <i>U</i><sub>1</sub> [J]']);
    this.tbLeg = this.mkTable(left, '4 つの行程の熱と仕事',
      '符号は <i>W</i> = 気体が「した」仕事（Δ<i>U</i> = <i>Q</i> − <i>W</i>）。合計の行がサイクルの正味',
      ['行程', '<i>Q</i> [J]', '<i>W</i> [J]', 'Δ<i>U</i> [J]', 'Δ<i>S</i> [J/K]']);

    const st = el('div', 'stage');
    this.cvEta = document.createElement('canvas');
    st.appendChild(this.cvEta); left.appendChild(st);
    this.ctxEta = this.cvEta.getContext('2d');

    this.tbGas = this.mkTable(left, '気体を変えても <i>η</i> は 1 桁も動かない',
      '同じ <i>n</i>・<i>T</i><sub>H</sub>・<i>T</i><sub>C</sub>・膨張比で気体だけ入れ替えた。' +
      '断熱膨張の伸び <i>V</i><sub>3</sub>/<i>V</i><sub>2</sub> は <i>C<sub>V</sub></i> で決まるので' +
      '気体ごとに違うのに、<i>Q</i><sub>H</sub> も <i>W</i> も <i>η</i> も同じ',
      ['気体', '<i>C</i><sub><i>V</i>,m</sub>(<i>T</i><sub>H</sub>)',
       '<i>γ</i> = <i>C</i><sub>P</sub>/<i>C</i><sub><i>V</i></sub>',
       '<i>V</i><sub>3</sub>/<i>V</i><sub>2</sub>', '<i>Q</i><sub>H</sub> [J]', '<i>W</i> [J]', '<i>η</i>']);
  }
  this.msg = el('div', 'msg'); this.msg.hidden = true; left.appendChild(this.msg);

  /* ==================== 右：コントロール ==================== */
  ctrl.appendChild(el('p', 'ctlhead', '気体と熱源'));

  const gf = el('label', 'fld');
  gf.appendChild(el('b', null, '気体'));
  const gsel = document.createElement('select');
  GAS.forEach(function(g){
    const o = document.createElement('option');
    o.value = g.k; o.textContent = g.sym + '（' + g.name + '）';
    gsel.appendChild(o);
  });
  gsel.value = this.gasKey;
  gsel.addEventListener('change', function(){
    self.gasKey = this.value;
    self.recompute(); self.reseed(); self.draw(); self.updateReadout(); kick();
  });
  gf.appendChild(gsel);
  gf.appendChild(el('span', 'hint',
    '効率は気体によらないが、<b>断熱膨張でどこまで伸びるか</b>は ' +
    '<i>C<sub>V</sub></i> で決まるので気体ごとに違う'));
  ctrl.appendChild(gf);

  /* 数値入力をつくる小道具 */
  const mkNum = function(label, unit, get, set, hint, step){
    const w = el('label', 'fld');
    w.appendChild(el('b', null, label));
    const row = el('div', 'unit');
    const inp = document.createElement('input');
    inp.type = 'number'; inp.autocomplete = 'off'; inp.step = step || 'any';
    inp.value = get();
    inp.addEventListener('change', function(){
      const v = Number(this.value);
      if (!isFinite(v) || v <= 0){ this.classList.add('bad'); return; }
      this.classList.remove('bad');
      set(v);
      self.recompute(); self.draw(); self.updateReadout(); kick();
      this.value = get();
    });
    row.appendChild(inp);
    row.appendChild(el('span', 'u', unit));
    w.appendChild(row);
    if (hint) w.appendChild(el('span', 'hint', hint));
    ctrl.appendChild(w);
    return inp;
  };
  const mkPills = function(items, apply){
    const row = el('div', 'pills');
    items.forEach(function(it){
      const b = el('button', 'pill', it[0]);
      b.type = 'button';
      b.addEventListener('click', function(){
        apply(it[1]);
        self.recompute(); self.draw(); self.updateReadout(); kick();
      });
      row.appendChild(b);
    });
    ctrl.appendChild(row);
    return row;
  };

  this.inTH = mkNum('高温熱源 T<sub>H</sub>', 'K', function(){ return self.TH; },
    function(v){ self.TH = Math.max(2, Math.min(6000, v));
                 if (self.TC >= self.TH) self.TC = self.TH * 0.5; }, null, 1);
  this.inTC = mkNum('低温熱源 T<sub>C</sub>', 'K', function(){ return self.TC; },
    function(v){ self.TC = Math.max(1, Math.min(self.TH - 1, v)); }, null, 1);
  mkPills([['600 / 300 K', [600, 300]], ['800 / 300 K', [800, 300]], ['400 / 300 K', [400, 300]]],
    function(v){ self.TH = v[0]; self.TC = v[1]; });
  ctrl.appendChild(el('span', 'hint',
    '<b>この 2 つだけで効率が決まります。</b>' +
    '<i>T</i><sub>H</sub> を上げるか <i>T</i><sub>C</sub> を下げるほど効率が上がり、' +
    '両者が等しくなると仕事は取り出せません'));

  ctrl.appendChild(el('hr', 'sep'));
  ctrl.appendChild(el('p', 'ctlhead', '出発点 ①<span class="lc"> と気体の量</span>'));

  this.inP1 = mkNum('圧力 P₁', 'Pa', function(){ return Number(self.P1.toPrecision(7)); },
    function(v){ self.P1 = Math.max(1e-2, Math.min(1e10, v)); });
  mkPills([['1 気圧', ATM], ['10 気圧', 10 * ATM], ['1 bar', 1e5]], function(v){ self.P1 = v; });
  this.inV1 = mkNum('体積 V₁', 'm³', function(){ return Number(self.V1.toPrecision(7)); },
    function(v){ self.V1 = Math.max(1e-9, Math.min(1e4, v)); });
  mkPills([['1 L', 1e-3], ['0.5 L', 5e-4], ['1 m³', 1]], function(v){ self.V1 = v; });
  this.inN = mkNum('物質量 n', 'mol', function(){ return Number(self.nOf().toPrecision(6)); },
    function(v){ self.V1 = Math.max(1e-9, Math.min(1e4, v * RG * self.TH / self.P1)); },
    '<i>PV</i> = <i>nRT</i> があるので、<i>P</i>₁・<i>V</i>₁・<i>T</i><sub>H</sub>・<i>n</i> ' +
    'のうち自由に決められるのは 3 つだけです。ここで <i>n</i> を変えると、' +
    '<b><i>P</i>₁ はそのままで <i>V</i>₁ が変わります</b>（同じ圧力で気体を増やす ＝ シリンダーを大きくする）');

  ctrl.appendChild(el('hr', 'sep'));
  ctrl.appendChild(el('p', 'ctlhead', '等温膨張の大きさ'));
  this.inR = mkNum('膨張比 V₂/V₁', '倍', function(){ return Number(self.r.toPrecision(4)); },
    function(v){ self.r = Math.max(1.02, Math.min(40, v)); });
  const rrow = el('div', 'ctlrow');
  const rsl = document.createElement('input');
  rsl.type = 'range'; rsl.min = '0'; rsl.max = '1000'; rsl.value = '0'; rsl.autocomplete = 'off';
  rsl.addEventListener('input', function(){
    self.r = Math.exp(Math.log(1.05) + (Math.log(20) - Math.log(1.05)) * Number(this.value) / 1000);
    self.recompute(); self.draw(); self.updateReadout(); kick();
  });
  rrow.appendChild(el('span', null, '1.05 倍'));
  rrow.appendChild(rsl);
  rrow.appendChild(el('span', null, '20 倍'));
  ctrl.appendChild(rrow);
  this.rSlider = rsl;
  ctrl.appendChild(el('span', 'hint',
    '<b>膨張比を変えても効率は動きません。</b>取り出せる仕事 <i>W</i> と吸う熱 ' +
    '<i>Q</i><sub>H</sub> が同じ割合（ln <i>r</i> に比例）で増えるからです'));

  if (isEng){
    ctrl.appendChild(el('hr', 'sep'));
    ctrl.appendChild(el('p', 'ctlhead', '動かす'));
    const br = el('div', 'btnrow');
    this.btPlay = el('button', 'act primary', '▶ 再生');
    this.btPlay.type = 'button';
    this.btPlay.addEventListener('click', function(){
      self.playing = !self.playing; self.syncPlay(); kick();
    });
    const btNext = el('button', 'act', '次の行程へ');
    btNext.type = 'button';
    btNext.addEventListener('click', function(){
      self.phase = (Math.floor(self.phase + 1e-6) + 1) % 4;
      self.playing = false; self.syncPlay();
      self.draw(); self.updateReadout(); kick();
    });
    const btReset = el('button', 'act', '①へ戻す');
    btReset.type = 'button';
    btReset.addEventListener('click', function(){
      self.phase = 0; self.cycles = 0;
      self.draw(); self.updateReadout(); kick();
    });
    br.appendChild(this.btPlay); br.appendChild(btNext); br.appendChild(btReset);
    ctrl.appendChild(br);

    /* サイクルのどこにいるかを手で動かす */
    const prow = el('div', 'ctlrow');
    prow.appendChild(el('span', null, '位置'));
    const psl = document.createElement('input');
    psl.type = 'range'; psl.min = '0'; psl.max = '1000'; psl.value = '0'; psl.autocomplete = 'off';
    psl.addEventListener('input', function(){
      self.phase = Number(this.value) / 1000 * 4;
      self.playing = false; self.syncPlay();
      self.draw(); self.updateReadout(); kick();
    });
    prow.appendChild(psl);
    ctrl.appendChild(prow);
    this.pSlider = psl;

    const srow = el('div', 'ctlrow');
    srow.appendChild(el('span', null, '速さ'));
    const ssl = document.createElement('input');
    ssl.type = 'range'; ssl.min = '0'; ssl.max = '1000'; ssl.value = '500'; ssl.autocomplete = 'off';
    const sval = el('span', 'val', '1.00×');
    ssl.addEventListener('input', function(){
      self.speed = Math.exp(Math.log(0.25) + (Math.log(4) - Math.log(0.25)) * Number(this.value) / 1000);
      sval.textContent = self.speed.toFixed(2) + '×';
      kick();
    });
    srow.appendChild(ssl); srow.appendChild(sval);
    ctrl.appendChild(srow);
    ctrl.appendChild(el('span', 'hint',
      '<b>ゆっくりにするほど「準静的」に近づきます。</b>本当の準静的過程は' +
      'ピストンが分子よりずっと遅い場合のことで、画面の速さはそこまで遅くできていません'));

    const drow = el('div', 'ctlrow');
    drow.appendChild(el('span', null, '描く分子'));
    const dsl = document.createElement('input');
    dsl.type = 'range'; dsl.min = '60'; dsl.max = '1200'; dsl.value = String(DOTS_DEF);
    dsl.autocomplete = 'off';
    const dval = el('span', 'val', DOTS_DEF + ' 個');
    dsl.addEventListener('input', function(){
      self.nDots = Number(this.value);
      dval.textContent = self.nDots + ' 個';
      self.gas.resizeN(self.nDots);
      self.draw(); kick();
    });
    drow.appendChild(dsl); drow.appendChild(dval);
    ctrl.appendChild(drow);
    ctrl.appendChild(el('span', 'hint',
      '本物の箱には 10<sup>23</sup> 個ほど入っています。画面のはあくまで<b>標本</b>で、' +
      '色は速さ（青 = 遅い、赤 = 速い）。断熱膨張で色が青へ移るのが、温度が下がるということです'));
  }

  /* --- 解説 --- */
  const ex = el('details', 'explain');
  ex.appendChild(el('summary', null, isEng ? 'なぜ 1 周すると仕事が残るのか' : '効率の式はどこから来るのか'));
  ex.appendChild(el('div', 'body', isEng ? ENGINE_NOTES : LEDGER_NOTES));
  left.appendChild(ex);
};

/* 表のひな形 */
Sim.prototype.mkTable = function(parent, cap, sub, heads){
  const w = el('div', 'tblwrap');
  const t = document.createElement('table');
  const c = document.createElement('caption');
  c.innerHTML = cap + '<small>' + sub + '</small>';
  t.appendChild(c);
  const th = document.createElement('thead'), tr = document.createElement('tr');
  heads.forEach(function(h){ const e = document.createElement('th'); e.innerHTML = h; tr.appendChild(e); });
  th.appendChild(tr); t.appendChild(th);
  const tb = document.createElement('tbody'); t.appendChild(tb);
  w.appendChild(t); parent.appendChild(w);
  return tb;
};

Sim.prototype.syncPlay = function(){
  if (this.btPlay) this.btPlay.textContent = this.playing ? '⏸ 一時停止' : '▶ 再生';
};
Sim.prototype.syncInputs = function(){
  if (this.inTH) this.inTH.value = Number(this.TH.toPrecision(6));
  if (this.inTC) this.inTC.value = Number(this.TC.toPrecision(6));
  if (this.inP1) this.inP1.value = Number(this.P1.toPrecision(7));
  if (this.inV1) this.inV1.value = Number(this.V1.toPrecision(7));
  if (this.inN)  this.inN.value  = Number(this.nOf().toPrecision(6));
  if (this.inR)  this.inR.value  = Number(this.r.toPrecision(4));
  if (this.rSlider){
    const t = (Math.log(this.r) - Math.log(1.05)) / (Math.log(20) - Math.log(1.05));
    this.rSlider.value = String(Math.round(Math.max(0, Math.min(1, t)) * 1000));
  }
};

/* 注意書き */
Sim.prototype.checkMsg = function(){
  const cy = this.cy, g = cy.g, out = [];
  if (this.TC < g.bp)
    out.push('<b>T<sub>C</sub> = ' + this.TC.toFixed(0) + ' K は ' + g.sym +
             ' の' + (g.subl ? '昇華点 ' : '沸点 ') + g.bp + ' K より低い温度です。</b>実物なら' +
             (g.subl ? '固体（ドライアイス）' : '液体（あるいは固体）') + 'になっていて、' +
             'もう理想気体ではありません。計算は理想気体のまま続けています。');
  const stroke = cy.Vmax / cy.Vmin;
  if (stroke > 40)
    out.push('ストロークが V₁ の <b>' + stroke.toFixed(0) + ' 倍</b>あります' +
             '（断熱膨張だけで ' + cy.A.toFixed(1) + ' 倍になるため）。' +
             '①の絵ではピストンが左端に寄り、気体がほとんど見えなくなります。' +
             'これは絵の都合ではなく、<b>Carnot サイクルがそのままでは機械にならない理由のひとつ</b>です ―― ' +
             'こんなに長いシリンダーは作れません。T<sub>H</sub>/T<sub>C</sub> か膨張比を下げてみてください。');
  if (this.TH / this.TC > 1.02 && cy.st[2].P < 50)
    out.push('③の圧力が ' + fmtP(cy.st[2].P) + ' まで下がっています。' +
             'ここまで薄いと実際には理想気体として扱えても、装置としては現実的ではありません。');
  this.msg.innerHTML = out.join('<br>');
  this.msg.hidden = out.length === 0;
};

/* ------------------------------------------------------------------------
   進める
   ------------------------------------------------------------------------ */
Sim.prototype.tick = function(dtWall){
  if (!this.playing) return false;
  this.anim += dtWall;
  const d = dtWall * this.speed / SECS_PER_LEG;
  this.phase += d;
  this.cycles += d / 4;
  if (this.phase >= 4) this.phase -= 4;
  if (this.cvEngine){
    const c = this.cur();
    this.syncGas(c);
    this.gas.step(dtWall);           /* 分子の速さは「速さ」つまみに引きずられない */
  }
  return true;
};

/* ------------------------------------------------------------------------
   大きさを合わせる
   ------------------------------------------------------------------------ */
Sim.prototype.fit = function(cv, ctx, h){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(240, cv.clientWidth || this.root.clientWidth || app.clientWidth || 640);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return w;
};
Sim.prototype.resize = function(){
  if (this.cvEngine){
    const w = Math.max(240, this.cvEngine.clientWidth || this.root.clientWidth || app.clientWidth || 640);
    this.cw = w;
    /* シリンダーの高さは固定。ストロークが長いほど横長になるのが正しい絵で、
       枠を縦に伸ばしても空きが増えるだけ */
    this.ch = w < 560 ? 244 : 248;
    this.fit(this.cvEngine, this.ctxE, this.ch);

    const w2 = Math.max(240, this.cvDiag.clientWidth || w);
    this.wideD = w2 >= 560;
    this.chD = this.wideD ? Math.round(Math.min(300, w2 / 2.55)) : Math.round(w2 / 1.05);
    this.cwD = this.fit(this.cvDiag, this.ctxD, this.chD);

    this.chF = 226;
    this.cwF = this.fit(this.cvFlow, this.ctxF, this.chF);
  }
  if (this.cvEta){
    const w = Math.max(240, this.cvEta.clientWidth || this.root.clientWidth || app.clientWidth || 640);
    this.wideEta = w >= 560;
    this.chEta = this.wideEta ? Math.round(Math.min(250, w / 2.7)) : Math.round(w / 1.15);
    this.cwEta = this.fit(this.cvEta, this.ctxEta, this.chEta);
  }
};

/* ------------------------------------------------------------------------
   描く
   ------------------------------------------------------------------------ */
Sim.prototype.draw = function(){
  const cy = this.cy, c = this.cur();
  if (this.cvEngine){
    /* シリンダー */
    this.opt.legIdx = c.leg; this.opt.TH = this.TH; this.opt.TC = this.TC;
    this.opt.T = c.T; this.opt.P = c.P; this.opt.V = c.V;
    this.opt.Vmax = cy.Vmax; this.opt.anim = this.anim; this.opt.dVdt = c.dV;
    this.opt.marks = [cy.st[0].V, cy.st[1].V, cy.st[2].V, cy.st[3].V];
    this.opt.stroke = 'ストローク  V_1 = ' + fmtV(cy.Vmin) + ' … V_3 = ' + fmtV(cy.Vmax) +
                      '（V_1 の ' + (cy.Vmax / cy.Vmin).toFixed(1) + ' 倍）';
    drawEngine(this.ctxE, this.cw, this.ch, this.gas, this.opt);

    /* P–V 図と T–S 図 */
    const d = this.ctxD, W2 = this.cwD, H2 = this.chD;
    d.clearRect(0, 0, W2, H2);
    const halves = this.wideD ? [[0, 0, W2 / 2, H2], [W2 / 2, 0, W2 / 2, H2]]
                              : [[0, 0, W2, H2 / 2], [0, H2 / 2, W2, H2 / 2]];
    if (this.wideD){
      d.strokeStyle = 'rgba(31,35,40,.10)'; d.lineWidth = 1;
      d.beginPath(); d.moveTo(W2 / 2, 10); d.lineTo(W2 / 2, H2 - 10); d.stroke();
    }
    drawPV(d, halves[0][0], halves[0][1], halves[0][2], halves[0][3], cy, c, true);
    drawTS(d, halves[1][0], halves[1][1], halves[1][2], halves[1][3], cy, c);

    /* エネルギーの流れ */
    this.ctxF.clearRect(0, 0, this.cwF, this.chF);
    drawFlow(this.ctxF, 0, 0, this.cwF, this.chF, cy, { cycles: this.cycles }, this.anim);

    /* ステッパー */
    if (this.stepEls) for (let i = 0; i < 4; i++){
      const on = i === c.leg;
      this.stepEls[i].classList.toggle('on', on);
      this.stepEls[i].firstChild.style.width = (on ? c.u * 100 : 0) + '%';
    }
    if (this.pSlider && this.playing)
      this.pSlider.value = String(Math.round(this.phase / 4 * 1000));
  }
  if (this.cvEta) drawEtaFig(this.ctxEta, this.cwEta, this.chEta, cy, this.wideEta);
};

/* ------------------------------------------------------------------------
   数字の書き出し
   ------------------------------------------------------------------------ */
Sim.prototype.updateReadout = function(){
  const cy = this.cy, c = this.cur(), g = cy.g;
  if (this.readout){
    const cv = cvMolar(g, this.TH), gam = (cv + RG) / cv;
    const lp = legPartial(cy, c.leg, c.u);
    this.readout.innerHTML =
      '<div class="rohead">いまの状態（' + LEG[c.leg].nm + '）</div>' +
      ro('温度 <i>T</i>', c.T.toFixed(1) + ' K') +
      ro('圧力 <i>P</i>', fmtP(c.P)) +
      ro('体積 <i>V</i>', fmtV(c.V)) +
      ro('エントロピー <i>S</i> − <i>S</i><sub>1</sub>', fmtd(c.S, 4) + ' J/K') +
      ro('この行程でここまでの <i>Q</i>', fmtd(lp.Q, 4) + ' J') +
      ro('この行程でここまでの <i>W</i>', fmtd(lp.W, 4) + ' J') +
      '<div class="rohead">1 周あたり</div>' +
      ro('吸う熱 <i>Q</i><sub>H</sub>', fmt(cy.QH, 5) + ' J', 1) +
      ro('捨てる熱 |<i>Q</i><sub>C</sub>|', fmt(-cy.QC, 5) + ' J') +
      ro('正味の仕事 <i>W</i>', fmt(cy.W, 5) + ' J', 1) +
      ro('効率 <i>η</i> = <i>W</i>/<i>Q</i><sub>H</sub>', (cy.eta * 100).toFixed(3) + ' %', 1) +
      ro('1 − <i>T</i><sub>C</sub>/<i>T</i><sub>H</sub>',
         ((1 - this.TC / this.TH) * 100).toFixed(3) + ' %') +
      ro('エントロピーの増減 Δ<i>S</i>', fmt(cy.dS, 5) + ' J/K') +
      '<div class="rohead">気体と装置</div>' +
      ro('物質量 <i>n</i>', fmt(cy.n, 5) + ' mol') +
      ro('<i>C</i><sub><i>V</i>,m</sub>（<i>T</i><sub>H</sub> で）',
         fmt(cvMolar(g, this.TH), 5) + ' J/(mol K)') +
      ro('<i>γ</i> = <i>C</i><sub>P</sub>/<i>C</i><sub><i>V</i></sub>（<i>T</i><sub>H</sub> で）',
         gam.toFixed(4)) +
      ro('断熱膨張の伸び <i>V</i><sub>3</sub>/<i>V</i><sub>2</sub>', cy.A.toFixed(4) + ' 倍') +
      ro('全ストローク <i>V</i><sub>3</sub>/<i>V</i><sub>1</sub>',
         (cy.Vmax / cy.Vmin).toFixed(3) + ' 倍') +
      ro('回した回数', this.cycles.toFixed(2) + ' 周');
  }
  if (this.etaBig){
    const e = cy.eta;
    this.etaBig.textContent = (e * 100).toFixed(4) + ' %';
    this.etaE1.textContent = (cy.W / cy.QH).toFixed(9);
    this.etaE2.textContent = (1 - this.TC / this.TH).toFixed(9);
    this.etaE3.innerHTML =
      'この 2 つは<b>どんな気体でも・どんな圧力でも・どんな膨張比でも</b>一致します。' +
      '同じ <i>T</i><sub>H</sub> と <i>T</i><sub>C</sub> のあいだで働くどんな熱機関も、' +
      'これを超えられません（Carnot の定理）。';
    this.etaFill.style.width = (e * 100).toFixed(2) + '%';
  }
};
function ro(a, b, hi){
  return '<div' + (hi ? ' class="hi"' : '') + '><span>' + a + '</span><span>' + b + '</span></div>';
}

/* 表の中身（②） */
Sim.prototype.fillTables = function(){
  if (!this.tbState) return;
  const cy = this.cy, g = cy.g;
  const cls = function(v){ return Math.abs(v) < 1e-9 ? 'zero' : (v > 0 ? 'pos' : 'neg'); };
  const NAMES = ['① はじめ（高温・小さい）', '② 等温膨張のあと', '③ 断熱膨張のあと', '④ 等温圧縮のあと'];
  let h = '';
  for (let i = 0; i < 4; i++){
    const s = cy.st[i];
    const dS = s.S - cy.st[0].S, dU = s.U - cy.st[0].U;
    h += '<tr><td><span class="leg" style="background:' + LEG[i].col + '"></span>' + NAMES[i] + '</td>' +
         '<td>' + s.T.toFixed(1) + '</td><td>' + fmtP(s.P) + '</td><td>' + fmtV(s.V) + '</td>' +
         '<td class="' + cls(dS) + '">' + fmtd(dS, 5) + '</td>' +
         '<td class="' + cls(dU) + '">' + fmtd(dU, 5) + '</td></tr>';
  }
  this.tbState.innerHTML = h;

  h = '';
  let sQ = 0, sW = 0, sU = 0, sS = 0;
  for (let i = 0; i < 4; i++){
    const L = cy.legs[i];
    sQ += L.Q; sW += L.W; sU += L.dU; sS += L.dS;
    h += '<tr><td><span class="leg" style="background:' + LEG[i].col + '"></span>' +
         LEG[i].nm + '<small style="color:#5c6670"> ' + LEG[i].sub + '</small></td>' +
         '<td class="' + cls(L.Q) + '">' + fmtd(L.Q, 5) + '</td>' +
         '<td class="' + cls(L.W) + '">' + fmtd(L.W, 5) + '</td>' +
         '<td class="' + cls(L.dU) + '">' + fmtd(L.dU, 5) + '</td>' +
         '<td class="' + cls(L.dS) + '">' + fmtd(L.dS, 5) + '</td></tr>';
  }
  h += '<tr class="sum"><td>合計（1 周して元に戻る）</td><td>' + fmtd(sQ, 5) + '</td><td>' +
       fmtd(sW, 5) + '</td><td>' + fmt0(sU) + '</td><td>' + fmt0(sS) + '</td></tr>';
  this.tbLeg.innerHTML = h;

  h = '';
  const self = this;
  GAS.forEach(function(gg){
    const c2 = buildCycle(gg, cy.n, self.TH, self.TC, self.V1, self.r);
    const cv = cvMolar(gg, self.TH);
    h += '<tr' + (gg.k === g.k ? ' class="sum"' : '') + '><td>' + gg.sym + '</td>' +
         '<td>' + cv.toFixed(3) + '</td><td>' + ((cv + RG) / cv).toFixed(4) + '</td>' +
         '<td>' + c2.A.toFixed(3) + '</td><td>' + fmt(c2.QH, 6) + '</td>' +
         '<td>' + fmt(c2.W, 6) + '</td><td>' + (c2.eta * 100).toFixed(4) + ' %</td></tr>';
  });
  this.tbGas.innerHTML = h;
};
/* 打ち消し合ってゼロになる欄。丸め残りを 0 と書くのは嘘なので、桁を出す */
function fmt0(v){
  if (v === 0) return '0（厳密に）';
  return fmt(v, 2) + '（丸め誤差）';
}

/* ========================================================================
   12. 解説（折りたたみ）
   ======================================================================== */
const ENGINE_NOTES =
  '<div class="note key"><b>熱機関とは「熱を通り抜けさせて、通行料として仕事を取る装置」です。</b>\n' +
  '高温熱源から <i>Q</i><sub>H</sub> を受け取り、低温熱源へ <i>Q</i><sub>C</sub> を捨て、\n' +
  'その差 <i>W</i> = <i>Q</i><sub>H</sub> − |<i>Q</i><sub>C</sub>| を仕事として持ち出します。\n' +
  '<b>捨てる相手（低温熱源）がなければ、熱は仕事に変わりません。</b>\n' +
  'これが「熱をぜんぶ仕事に変える機関は作れない」（第二法則・Kelvin の表現）ということです。</div>' +

  '<p><b>なぜ 4 行程が必要なのか。</b>膨らませれば気体は仕事をしてくれます。' +
  'でも 1 周して元に戻るには、いつか押し戻さなければならない。' +
  'そのとき同じ道を戻れば、もらった仕事をそっくり返すことになって差し引きゼロです。' +
  '<b>押し戻すときに圧力が低ければ、返す仕事は少なくて済みます。</b>' +
  '圧力を下げるには温度を下げればよい ―― そこで先に<b>断熱膨張で冷やしてから</b>圧縮します。' +
  'P–V 図で、行き（上の道）より帰り（下の道）が低いところを通っているのは、そういう意味です。' +
  'この 2 本の道に挟まれた面積が、取り出せる仕事です。</p>' +

  '<div class="eq"><math display="block">' +
  '<mi>W</mi><mo>=</mo><mo>∮</mo><mi>P</mi><mspace width="1px"/><mi>d</mi><mi>V</mi>' +
  '<mo>=</mo><mtext>（P–V 図で囲む面積）</mtext></math>' +
  '<span class="cmt">膨らむとき（右へ進む）は正、縮むとき（左へ進む）は負。' +
  '時計回りに 1 周すると正味が正になる</span></div>' +

  '<div class="note"><b><i>T</i>–<i>S</i> 図を見てください。ただの長方形です。</b>\n' +
  '等温では熱が入って <i>S</i> が増え（横に進む）、断熱では <i>S</i> が変わらない（縦に進む）。\n' +
  '準静的なら <i>Q</i> = ∫<i>T</i> d<i>S</i> なので、<b>面積がそのまま熱</b>です。\n' +
  '柱ぜんぶ（高さ <i>T</i><sub>H</sub>）が吸った熱、下の青い帯（高さ <i>T</i><sub>C</sub>）が捨てた熱、\n' +
  '残りの緑の長方形（高さ <i>T</i><sub>H</sub> − <i>T</i><sub>C</sub>）が仕事です。\n' +
  '効率が (<i>T</i><sub>H</sub> − <i>T</i><sub>C</sub>)/<i>T</i><sub>H</sub> になるのが、' +
  '<b>図の縦の長さの比</b>として一目で分かります。</div>' +

  '<div class="note"><b>断熱膨張で分子の色が青へ移ります。</b>\n' +
  '熱を一切もらわずに気体が仕事をするのだから、その分だけ内部エネルギーが減る ―― つまり冷えます。\n' +
  '本当の仕組みは「後ろへ逃げていく壁で跳ね返ると、分子は跳ね返る前より遅くなる」ことです\n' +
  '（壁の速さを <i>u</i> とすると <i>v</i> → −<i>v</i> + 2<i>u</i>）。逆に断熱圧縮では、\n' +
  '向かってくる壁に叩かれて速くなる。ディーゼルエンジンが火花なしで着火するのは、これで温度が上がるからです。</div>' +

  '<div class="note warn"><b>画面のピストンは、本当の準静的過程より速く動いています。</b>\n' +
  '準静的とは「各瞬間で気体が平衡にいられるほどゆっくり」という意味で、\n' +
  '実際にはピストンが分子の速さよりずっと遅い場合を指します。\n' +
  '画面では 1 行程を数秒で見せているので、そこまで遅くできていません。\n' +
  'そのため<b>各瞬間の温度は熱力学の式（<i>S</i> 一定）から決めて、分子の速さ分布をそれに合わせています</b>。\n' +
  '「速さ」つまみを下げると、より準静的に近い見え方になります。</div>' +

  '<p class="note"><b>描いている分子について。</b>本物のシリンダーには 10<sup>23</sup> 個ほど入っています。' +
  '画面のものは<b>標本</b>で、色は速さ（青 = 遅い、赤 = 速い）。' +
  '箱の縦横比は画面のシリンダーに合わせてあるので、<b>点の混み具合はいつでも本当の数密度どおり</b>です。' +
  '等温膨張で「色はそのままなのに薄くなる」＝ 圧力が下がるのは密度が下がるから、' +
  '断熱膨張で「薄くなり、かつ青くなる」＝ 密度と速さの両方が下がるから、と読み分けてください。</p>';

const LEDGER_NOTES =
  '<p><b>等温のとき。</b>理想気体の内部エネルギーは温度だけで決まるので、温度が変わらなければ Δ<i>U</i> = 0。' +
  '第一法則 Δ<i>U</i> = <i>Q</i> − <i>W</i> から <i>Q</i> = <i>W</i>、つまり<b>もらった熱をそっくり仕事にして吐き出す</b>ことになります。' +
  '準静的なら</p>' +
  '<div class="eq"><math display="block">' +
  '<msub><mi>Q</mi><mi>H</mi></msub><mo>=</mo><msub><mi>W</mi><mrow><mn>1</mn><mo>→</mo><mn>2</mn></mrow></msub>' +
  '<mo>=</mo><msubsup><mo>∫</mo><msub><mi>V</mi><mn>1</mn></msub><msub><mi>V</mi><mn>2</mn></msub></msubsup>' +
  '<mfrac><mrow><mi>n</mi><mi>R</mi><msub><mi>T</mi><mi>H</mi></msub></mrow><mi>V</mi></mfrac>' +
  '<mi>d</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><msub><mi>T</mi><mi>H</mi></msub>' +
  '<mi>ln</mi><mo>&#x2061;</mo><mfrac><msub><mi>V</mi><mn>2</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mfrac>' +
  '</math></div>' +

  '<p><b>断熱のとき。</b><i>Q</i> = 0 なので <i>W</i> = −Δ<i>U</i>。' +
  '気体は自分の内部エネルギーを削って仕事をするので、温度が下がります。' +
  '準静的断熱では <i>nC<sub>V</sub></i>d<i>T</i> = −<i>P</i>d<i>V</i> = −<i>nRT</i> d<i>V</i>/<i>V</i>、すなわち</p>' +
  '<div class="eq"><math display="block">' +
  '<msubsup><mo>∫</mo><msub><mi>T</mi><mi>C</mi></msub><msub><mi>T</mi><mi>H</mi></msub></msubsup>' +
  '<msub><mi>C</mi><mi>V</mi></msub><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mi>T</mi></mfrac>' +
  '<mo>=</mo><mi>R</mi><mi>ln</mi><mo>&#x2061;</mo>' +
  '<mfrac><msub><mi>V</mi><mn>3</mn></msub><msub><mi>V</mi><mn>2</mn></msub></mfrac>' +
  '<mspace width="14px"/><mtext>（＝</mtext><mi>S</mi><mtext>が変わらない、ということ）</mtext></math>' +
  '<span class="cmt"><i>C<sub>V</sub></i> が定数なら <i>TV</i><sup><i>γ</i>−1</sup> = 一定 という' +
  'おなじみの形になる。このページでは <i>C<sub>V</sub></i>(<i>T</i>) を定数と置かず、' +
  '<i>S</i> が一定という条件をそのまま解いている</span></div>' +

  '<div class="note key"><b>サイクルが閉じる条件。</b>\n' +
  '②→③ と ④→① は同じ 2 つの温度のあいだの断熱過程なので、上の式の右辺が同じになります。つまり\n' +
  '<i>V</i><sub>3</sub>/<i>V</i><sub>2</sub> = <i>V</i><sub>4</sub>/<i>V</i><sub>1</sub>、書き直すと\n' +
  '<b><i>V</i><sub>2</sub>/<i>V</i><sub>1</sub> = <i>V</i><sub>3</sub>/<i>V</i><sub>4</sub></b>。\n' +
  '<b>2 つの等温過程の体積比が等しくなる</b>のがミソで、これのおかげで ln の因子が\n' +
  '割り算のときに消えてくれます。</div>' +

  '<div class="eq"><math display="block"><mtable columnalign="right center left">' +
  '<mtr><mtd><mi>η</mi></mtd><mtd><mo>=</mo></mtd><mtd>' +
  '<mfrac><mi>W</mi><msub><mi>Q</mi><mi>H</mi></msub></mfrac><mo>=</mo>' +
  '<mfrac><mrow><msub><mi>Q</mi><mi>H</mi></msub><mo>+</mo><msub><mi>Q</mi><mi>C</mi></msub></mrow>' +
  '<msub><mi>Q</mi><mi>H</mi></msub></mfrac></mtd></mtr>' +
  '<mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd>' +
  '<mn>1</mn><mo>−</mo><mfrac>' +
  '<mrow><mi>n</mi><mi>R</mi><msub><mi>T</mi><mi>C</mi></msub><mi>ln</mi><mo>&#x2061;</mo>' +
  '<mo>(</mo><msub><mi>V</mi><mn>3</mn></msub><mo lspace="0em" rspace="0em">/</mo>' +
  '<msub><mi>V</mi><mn>4</mn></msub><mo>)</mo></mrow>' +
  '<mrow><mi>n</mi><mi>R</mi><msub><mi>T</mi><mi>H</mi></msub><mi>ln</mi><mo>&#x2061;</mo>' +
  '<mo>(</mo><msub><mi>V</mi><mn>2</mn></msub><mo lspace="0em" rspace="0em">/</mo>' +
  '<msub><mi>V</mi><mn>1</mn></msub><mo>)</mo></mrow></mfrac></mtd></mtr>' +
  '<mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd>' +
  '<mn>1</mn><mo>−</mo><mfrac><msub><mi>T</mi><mi>C</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac>' +
  '</mtd></mtr></mtable></math>' +
  '<span class="cmt">閉じる条件から 2 つの ln が等しいので、まるごと約分される。' +
  '<b>気体の種類・物質量・圧力・膨張比がすべて消えた</b></span></div>' +

  '<div class="note"><b>気体を変えると何が変わって、何が変わらないか。</b>\n' +
  '下の表を見てください。<i>C<sub>V</sub></i> も <i>γ</i> も気体ごとに違い、\n' +
  'その結果<b>断熱膨張でどこまで伸びるか（<i>V</i><sub>3</sub>/<i>V</i><sub>2</sub>）は大きく違います</b>。\n' +
  '単原子の He は 2.8 倍しか伸びないのに、振動まで動く CO₂ は 17 倍も伸びる。\n' +
  'ところが <i>Q</i><sub>H</sub> も <i>W</i> も <i>η</i> も、まったく同じ値になります。\n' +
  '<b>道すじは気体によるが、収支は温度だけで決まる</b> ―― これが Carnot サイクルの核心です。</div>' +

  '<div class="note key"><b>Carnot の定理と、温度という量そのもの。</b>\n' +
  '「同じ 2 つの熱源のあいだで働く熱機関のうち、可逆機関がいちばん効率がよく、\n' +
  '可逆機関どうしはすべて同じ効率をもつ」―― これを認めると、効率は熱源の温度だけの関数になります。\n' +
  'そこで <b>|<i>Q</i><sub>C</sub>|/<i>Q</i><sub>H</sub> ≡ <i>T</i><sub>C</sub>/<i>T</i><sub>H</sub> と定めたものが\n' +
  '「熱力学温度」</b>で、これは温度計の中身（水銀か、気体か）に一切依存しません。\n' +
  'いま使っているケルビンは、この目盛りそのものです。</div>' +

  '<p><b>そして、エントロピー。</b>1 周すると <i>Q</i><sub>H</sub>/<i>T</i><sub>H</sub> + ' +
  '<i>Q</i><sub>C</sub>/<i>T</i><sub>C</sub> = 0 です（表のいちばん右の列の合計）。' +
  '<i>Q</i> そのものは 1 周して 0 に戻らないのに、<b><i>Q</i> を <i>T</i> で割ってから足すと 0 に戻る</b>。' +
  '「1 周して 0 に戻る量」は状態だけで決まる量です ―― これが d<i>S</i> = d<i>Q</i><sub>可逆</sub>/<i>T</i> ' +
  'でエントロピーを定義できる理由で、Clausius はまさにこの道すじで <i>S</i> にたどり着きました。</p>' +

  '<div class="note warn"><b>現実の熱機関が Carnot に届かない理由。</b>\n' +
  '摩擦、有限の速さで起きる膨張・圧縮（＝ 準静的でない）、熱源との温度差をつけないと熱が流れないこと、\n' +
  '配管からの熱漏れ ―― どれもエントロピーを生む不可逆過程です。\n' +
  '上のグラフで、実機の効率が Carnot 限界のおよそ 2 割から 8 割にとどまっているのはそのためです。\n' +
  'それでも「<b>この線を超えることは絶対にできない</b>」と言い切れるのが、熱力学の強さです。</div>';

/* ========================================================================
   13. 動かす
   ======================================================================== */
let rafId = null, last = 0;
const sims = {};
function loop(now){
  /* dt には下限 0 が要る。rAF に渡ってくる時刻が last より前に戻ることがあり
     （kick() の performance.now() とフレーム開始時刻のずれ、スリープからの復帰など）、
     dt が負になると粒子が逆走して端で clamp され、縦一列に積み上がってしまう */
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  let busy = false;
  Object.keys(sims).forEach(function(k){
    const s = sims[k];
    if (s.root.hidden) return;
    if (!s.tick(dt)) return;
    s.draw();
    s.roAcc = (s.roAcc || 0) + dt;
    if (s.roAcc > 0.20){ s.roAcc = 0; s.updateReadout(); }   /* 毎コマ書き換えない */
    busy = true;
  });
  rafId = busy ? requestAnimationFrame(loop) : null;
}
function kick(){
  if (rafId === null){ last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ========================================================================
   14. 立ち上げ
   ======================================================================== */
let only = null;
const mm = /[?&]only=(engine|ledger)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');

['engine', 'ledger'].forEach(function(key){
  const p = app.querySelector('[data-panel="' + key + '"]');
  if (!p) return;
  if (only && only !== key){ p.parentNode.removeChild(p); return; }
  sims[key] = new Sim(key, p);
});

/* iframe に埋め込まれたとき、親ページへ必要な高さを知らせる */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let active = only || 'engine';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].resize(); sims[name].draw(); sims[name].updateReadout();
  kick();
  postHeight();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].resize(); sims[k].draw(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].recompute(); sims[k].draw(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

kick();

})();
</script>
</body>
</html>
