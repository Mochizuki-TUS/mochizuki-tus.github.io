<body>
<div id="qsim">
  <h1>行列の対角化 ― 見やすい基底に取り替える</h1>
  <p class="lead">
    行列は「数の表」ではなく、<b>基底を 1 組決めたときの、演算子の顔つき</b>です。
    基底を取り替えれば顔つきも変わり、うまく選べば<b>非対角成分が全部消えます</b>。
    それが<b>対角化</b>で、そのとき対角に並ぶ数が<b>固有値 ＝ 測れば出てくる値</b>です。
    ここでは 3 つの例で、非対角成分が消える瞬間を見ます。
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="sph" role="tab">① 球面調和関数 ― 複素と実</button>
    <button class="tab" data-tab="pauli" role="tab">② パウリ行列 ― 量子化軸を変える</button>
    <button class="tab" data-tab="mode" role="tab">③ 連成振動 ― 基準振動に分ける</button>
  </div>

  <section class="panel" data-panel="sph"></section>
  <section class="panel" data-panel="pauli" hidden></section>
  <section class="panel" data-panel="mode" hidden></section>

  <p class="foot">
    東京理科大学 望月研究室 ／ 講義ノート「(14) スピン行列における基底変換」より。
    「なぜ観測できる量を得るのに対角化が要るのか」は
    <a href="diagonalization-derivation.html">こちらのページ</a>にあります。
  </p>
</div>

<script>
(function () {
'use strict';
/* ========================================================================
   0. 共通の道具
   ======================================================================== */
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
const DEG = 180 / Math.PI;

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
             '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(v){ return String(v).split('').map(function(c){ return SUP[c] || c; }).join(''); }
function fmt(v, n){
  n = n || 4;
  if (!isFinite(v)) return '—';
  if (Math.abs(v) < 5e-13) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3){
    const p = v.toExponential(n - 1).split('e');
    return p[0] + '×10' + sup(Number(p[1]));
  }
  return String(Number(v.toPrecision(n)));
}
/* 行列の成分は、桁をそろえて出したい */
function f3(v){ return (Math.abs(v) < 5e-4 ? 0 : v).toFixed(3); }

/* ========================================================================
   1a. 球面調和関数（タブ①）
   ------------------------------------------------------------------------
   流儀は hydrogen-simulator.html と同じ。付随 Legendre に Condon–Shortley 位相
   (−1)^m を付けないので、実軌道が講義ノート (16) の表（p_x = ½√(3/π) sinθ cosφ
   など）とそのまま一致する。
   ======================================================================== */
function fact(n){ let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

function plm(l, m, x){
  m = Math.abs(m);
  if (m > l) return 0;
  let pmm = 1;
  if (m > 0){
    const s = Math.sqrt(Math.max(0, 1 - x * x));
    let f = 1;
    for (let i = 1; i <= m; i++){ pmm *= f * s; f += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2*m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++){
    pll = ((2*ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}
function Nlm(l, m){
  const am = Math.abs(m);
  return Math.sqrt((2*l + 1) / (4 * Math.PI) * fact(l - am) / fact(l + am));
}
/* 動径部分（原子単位、a_B = 1）。hydrogen-simulator.html と同じ式 */
function Rnl(n, l, r){
  if (r <= 0) return 0;
  const A = Math.sqrt(fact(n - l - 1) / (n * n * Math.pow(fact(n + l), 3)));
  let s = 0;
  for (let k = 2*l + 1; k <= n + l; k++){
    s += Math.pow(-1, k) * Math.pow(fact(n + l), 2)
       / (fact(k - 2*l - 1) * fact(k) * fact(n + l - k))
       * Math.pow(2 * r / n, k - l);
  }
  return -A * Math.exp(-r / n) / r * s;
}

/* 赤道面（θ = π/2）で使う軌道。P_l^m(0) = 0 になる組（l − m が奇数）は
   面まるごとが節になって何も見えないので、l − m が偶数のものだけ並べる。 */
const ORBS = [
  { k:'2p（l = 1, |m| = 1）', n:2, l:1, m:1, c:'p_x',        s:'p_y' },
  { k:'3d（l = 2, |m| = 2）', n:3, l:2, m:2, c:'d_x²−y²',    s:'d_xy' },
  { k:'4f（l = 3, |m| = 1）', n:4, l:3, m:1, c:'f_xz²',      s:'f_yz²' },
  { k:'4f（l = 3, |m| = 3）', n:4, l:3, m:3, c:'f_x(x²−3y²)', s:'f_y(3x²−y²)' }
];
/* 赤道面での角度部分の振幅 √2 N_lm P_l^m(0)。実軌道 C, S に共通の前係数 */
function eqAmp(o){ return Math.SQRT2 * Nlm(o.l, o.m) * plm(o.l, o.m, 0); }

/* 状態 ψ(β) = cos β · C + i sin β · S
     β = 0    → C（実、cos 型）      ⟨L_z⟩ = 0、確率流 0
     β = 45°  → (C + iS)/√2 = Y_l^{+m}（複素）   ⟨L_z⟩ = +mℏ、確率流 最大
     β = 90°  → iS（実、sin 型）     ⟨L_z⟩ = 0
     β = 135° → −Y_l^{−m}（複素）    ⟨L_z⟩ = −mℏ
   赤道面では ψ = A(r)·[cos β cos mφ + i sin β sin mφ]。 */
function psiEq(o, beta, r, phi){
  const A = Rnl(o.n, o.l, r) * eqAmp(o);
  const m = o.m;
  return [A * Math.cos(beta) * Math.cos(m * phi),
          A * Math.sin(beta) * Math.sin(m * phi)];
}
/* 確率流の φ 成分（原子単位、ħ = m_e = 1）。
   j_φ = (1/r) Im(ψ* ∂_φ ψ) = A(r)² · m sin2β / (2r)。φ に依らない。 */
function jPhi(o, beta, r){
  const A = Rnl(o.n, o.l, r) * eqAmp(o);
  return A * A * o.m * Math.sin(2 * beta) / (2 * r);
}
/* 複素基底での重み。a± = (cos β ± sin β)/√2、⟨L_z⟩ = mℏ sin2β */
function coefPM(beta){
  return [(Math.cos(beta) + Math.sin(beta)) / Math.SQRT2,
          (Math.cos(beta) - Math.sin(beta)) / Math.SQRT2];
}
/* 描く半径。|R|² r² が最大の 0.6 % まで落ちるところ */
function rMaxOf(o){
  let mx = 0;
  for (let i = 1; i <= 4000; i++){
    const r = i * 0.02, v = Math.pow(Rnl(o.n, o.l, r) * r, 2);
    if (v > mx) mx = v;
  }
  for (let i = 4000; i >= 1; i--){
    const r = i * 0.02;
    if (Math.pow(Rnl(o.n, o.l, r) * r, 2) > 0.006 * mx) return r * 1.05;
  }
  return 20;
}

/* ========================================================================
   1b. 2×2 の実対称行列（3 つのタブで共通に使う）
   ======================================================================== */
/* 基底を角度 γ だけ回したときの表現 M' = R(γ)ᵀ M R(γ) */
function rotM(M, g){
  const c = Math.cos(g), s = Math.sin(g);
  const a = M[0][0], b = M[0][1], d = M[1][1];
  return [[a*c*c + 2*b*c*s + d*s*s,  (d - a)*c*s + b*(c*c - s*s)],
          [(d - a)*c*s + b*(c*c - s*s), a*s*s - 2*b*c*s + d*c*c]];
}
/* 実対称行列 [[a,b],[b,d]] を対角化する角度と固有値。
   λ± = (a+d)/2 ± √{((a−d)/2)² + b²}、γ = ½ atan2(2b, a−d) */
function diagAngle(M){
  const a = M[0][0], b = M[0][1], d = M[1][1];
  const g = 0.5 * Math.atan2(2 * b, a - d);
  const R = Math.sqrt(Math.pow((a - d) / 2, 2) + b * b);
  return { g: g, lo: (a + d) / 2 - R, hi: (a + d) / 2 + R };
}
/* 非対角成分の残り具合（0 なら対角化できている） */
function offAmount(M){
  const n = Math.max(1e-12, Math.abs(M[0][0]) + Math.abs(M[1][1]) + 2 * Math.abs(M[0][1]));
  return 2 * Math.abs(M[0][1]) / n;
}

/* ========================================================================
   1c. 連成振動（タブ③）
   ------------------------------------------------------------------------
   質量はどちらも 1。 m ẍ₁ = −k₁x₁ − κ(x₁−x₂),  m ẍ₂ = −k₂x₂ − κ(x₂−x₁)
   まとめて ẍ = −D x、  D = [[k₁+κ, −κ], [−κ, k₂+κ]]（実対称）。
   D の固有値が ω²、固有ベクトルが基準振動。
   ======================================================================== */
function dynMat(k1, k2, kc){ return [[k1 + kc, -kc], [-kc, k2 + kc]]; }
/* 静かに（速度 0 で）x₀ から放したときの運動 */
function motion(D, x0, t){
  const e = diagAngle(D);
  const c = Math.cos(e.g), s = Math.sin(e.g);
  /* 固有ベクトル：v₁ = (c, s)、v₂ = (−s, c) */
  const q1 = c * x0[0] + s * x0[1], q2 = -s * x0[0] + c * x0[1];
  const w1 = Math.sqrt(Math.max(0, e.hi)), w2 = Math.sqrt(Math.max(0, e.lo));
  /* diagAngle の hi が v₁ 側、lo が v₂ 側の固有値 */
  const a1 = q1 * Math.cos(w1 * t), a2 = q2 * Math.cos(w2 * t);
  return [c * a1 - s * a2, s * a1 + c * a2];
}

/* ========================================================================
   2. シミュレーター本体
   ======================================================================== */
const app = document.getElementById('qsim');

function Sim(key, root){
  this.key = key;
  this.root = root;
  /* ① 球面調和関数 */
  this.oi = 0;
  this.beta = 0;                       // 混合角 [rad]
  this.showJ = true;
  /* ② パウリ行列 */
  this.alpha = 0;                      // 基底の回転角 [rad]
  this.thS = Math.PI / 2;              // 状態の向き（Bloch 円、z から測る）
  /* ③ 連成振動 */
  this.k1 = 1.0; this.k2 = 1.8; this.kc = 0.6;
  this.gam = 0;                        // 基底の回転角 [rad]
  this.x0 = [1, 0];
  this.t = 0;
  /* 教材ページには iframe がいくつも並ぶので、止まった状態で開く */
  this.playing = false;
  this.speed = 1;
  this.build();
  this.refresh();
}

Sim.prototype.build = function(){
  const self = this;
  const lay = el('div','layout');
  const colMain = el('div','col-main'), colSide = el('div','col-side');
  lay.appendChild(colMain); lay.appendChild(colSide);
  this.root.appendChild(lay);

  const stage = el('div','stage');
  const cv = document.createElement('canvas');
  stage.appendChild(cv); colMain.appendChild(stage);
  this.cv = cv; this.ctx = cv.getContext('2d');

  /* 凡例 */
  colMain.appendChild(el('div','legend',
    this.key === 'sph'
      ? '<span>色は波動関数の<b>位相</b>、濃さは |ψ|²</span>' +
        '<span><i style="background:var(--cur)"></i>確率流 j（位相が回っていると生じる）</span>' +
        '<span>行列は<b style="color:var(--diag)">青が対角</b>（＝測れば出てくる値）、' +
        '<b style="color:var(--off)">赤が非対角</b>（＝混ざり）</span>'
      : this.key === 'pauli'
      ? '<span><i style="background:var(--axz)"></i>もとの座標軸（z を上に取った表示）</span>' +
        '<span><i style="background:var(--cplx)"></i>いま選んでいる基底の軸 e₁, e₂</span>' +
        '<span><i style="background:var(--cur)"></i>スピンの状態 |χ⟩</span>' +
        '<span>行列は<b style="color:var(--diag)">青が対角</b>、<b style="color:var(--off)">赤が非対角</b></span>'
      : '<span><i style="background:var(--rcos)"></i>質点 1 ／ 成分 y₁</span>' +
        '<span><i style="background:var(--rsin)"></i>質点 2 ／ 成分 y₂</span>' +
        '<span>行列は<b style="color:var(--diag)">青が対角</b>、' +
        '<b style="color:var(--off)">赤が非対角</b>（＝ばねによる連成）</span>'));

  const readout = el('div','readout');
  colMain.appendChild(readout);
  this.readout = readout;

  colMain.appendChild(el('div','eq',
    this.key === 'sph' ? EQ_SPH : this.key === 'pauli' ? EQ_PAULI : EQ_MODE));

  this.msgEl = el('div','msg');
  colMain.appendChild(this.msgEl);

  /* ---------------- 右カラム ---------------- */
  const ctrl = el('div','controls');
  colSide.appendChild(ctrl);

  const mkSlider = function(label, min, max, val, fn){
    const row = el('label','ctlrow');
    const lab = el('span', null, label);
    row.appendChild(lab);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = String(min); inp.max = String(max); inp.value = String(val);
    inp.autocomplete = 'off';
    inp.addEventListener('input', function(){ fn(Number(this.value)); });
    row.appendChild(inp);
    ctrl.appendChild(row);
    return { lab: lab, inp: inp };
  };
  const mkBtn = function(text, cls, fn){
    const b = el('button', 'act' + (cls ? ' ' + cls : ''), text);
    b.type = 'button';
    b.addEventListener('click', fn);
    return b;
  };

  if (this.key === 'sph'){
    ctrl.appendChild(el('p','ctlhead','軌道'));
    const sel = el('select','wide');
    ORBS.forEach(function(o, i){
      const op = document.createElement('option');
      op.textContent = o.k + '　' + o.c + ' / ' + o.s;
      op.value = String(i); sel.appendChild(op);
    });
    sel.autocomplete = 'off';
    sel.addEventListener('change', function(){ self.oi = parseInt(this.value, 10); self.refresh(); });
    ctrl.appendChild(sel);
    ctrl.appendChild(el('p','hint2','赤道面（xy 平面）で切った断面を描きます。'
      + 'l − |m| が奇数の軌道は面ぜんぶが節になるので外してあります'));

    ctrl.appendChild(el('hr','sep'));
    ctrl.appendChild(el('p','ctlhead','基底の混ぜぐあい'));
    const sB = mkSlider('β = 0°', 0, 180, 0, function(v){ self.beta = v / DEG; self.refresh(); });
    this.sB = sB;
    const r1 = el('div','btnrow');
    [['実 C（cos 型）', 0], ['複素 Y⁺', 45], ['実 S（sin 型）', 90], ['複素 Y⁻', 135]]
      .forEach(function(b){
        r1.appendChild(mkBtn(b[0], 'b-half', function(){
          self.beta = b[1] / DEG; self.sB.inp.value = String(b[1]); self.refresh();
        }));
      });
    ctrl.appendChild(r1);

    const ck = el('label','chk');
    const ci = document.createElement('input');
    ci.type = 'checkbox'; ci.checked = true; ci.autocomplete = 'off';
    ci.addEventListener('change', function(){ self.showJ = this.checked; self.refresh(); });
    ck.appendChild(ci);
    ck.appendChild(el('span', null, '確率流の矢印を重ねる'));
    ctrl.appendChild(ck);

  } else if (this.key === 'pauli'){
    ctrl.appendChild(el('p','ctlhead','基底の回転角'));
    const sA = mkSlider('α = 0°', 0, 90, 0, function(v){ self.alpha = v / DEG; self.refresh(); });
    this.sA = sA;
    ctrl.appendChild(mkBtn('α = 45° に合わせる（対角化）', 'primary b-full', function(){
      self.alpha = Math.PI / 4; self.sA.inp.value = '45'; self.refresh();
    }));
    ctrl.appendChild(el('p','hint2','α = 45° で U = (1/√2)[[1,1],[1,−1]]。'
      + 'ノート (14) の基底変換そのものです'));

    ctrl.appendChild(el('hr','sep'));
    ctrl.appendChild(el('p','ctlhead','スピンの状態'));
    const sT = mkSlider('θ = 90°', 0, 180, 90, function(v){ self.thS = v / DEG; self.refresh(); });
    this.sT = sT;
    const r2 = el('div','btnrow');
    [['|↑z⟩', 0], ['|↑x⟩', 90], ['|↓z⟩', 180]].forEach(function(b){
      r2.appendChild(mkBtn(b[0], null, function(){
        self.thS = b[1] / DEG; self.sT.inp.value = String(b[1]); self.refresh();
      }));
    });
    ctrl.appendChild(r2);
    ctrl.appendChild(el('p','hint2','θ は Bloch 円で z 軸から測った角度。'
      + '|χ⟩ = (cos θ/2, sin θ/2)'));

  } else {
    ctrl.appendChild(el('p','ctlhead','ばね定数'));
    this.sK1 = mkSlider('k₁ = 1.00', 20, 300, 100, function(v){ self.k1 = v / 100; self.reset(); });
    this.sK2 = mkSlider('k₂ = 1.80', 20, 300, 180, function(v){ self.k2 = v / 100; self.reset(); });
    this.sKc = mkSlider('κ = 0.60',   0, 200,  60, function(v){ self.kc = v / 100; self.reset(); });
    ctrl.appendChild(el('p','hint2','κ が 2 つの質点をつなぐばね。'
      + 'これが 0 でなければ行列に非対角成分が出ます'));

    ctrl.appendChild(el('hr','sep'));
    ctrl.appendChild(el('p','ctlhead','基底の回転角'));
    this.sG = mkSlider('γ = 0°', -90, 90, 0, function(v){ self.gam = v / DEG; self.refresh(); });
    ctrl.appendChild(mkBtn('対角化する角度に合わせる', 'primary b-full', function(){
      const g = diagAngle(dynMat(self.k1, self.k2, self.kc)).g;
      self.gam = g; self.sG.inp.value = String(Math.round(g * DEG)); self.refresh();
    }));

    ctrl.appendChild(el('hr','sep'));
    ctrl.appendChild(el('p','ctlhead','はじめの引っぱり方'));
    const r3 = el('div','btnrow');
    r3.appendChild(mkBtn('質点 1 だけ引く', 'b-full', function(){ self.x0 = [1, 0]; self.reset(); }));
    r3.appendChild(mkBtn('基準振動 1 だけ', 'b-half', function(){
      const g = diagAngle(dynMat(self.k1, self.k2, self.kc)).g;
      self.x0 = [Math.cos(g), Math.sin(g)]; self.reset();
    }));
    r3.appendChild(mkBtn('基準振動 2 だけ', 'b-half', function(){
      const g = diagAngle(dynMat(self.k1, self.k2, self.kc)).g;
      self.x0 = [-Math.sin(g), Math.cos(g)]; self.reset();
    }));
    ctrl.appendChild(r3);

    ctrl.appendChild(el('hr','sep'));
    ctrl.appendChild(el('p','ctlhead','アニメーション'));
    const pb = mkBtn('▶ 動かす', 'primary b-full', function(){
      self.playing = !self.playing;
      this.innerHTML = self.playing ? '❚❚ 止める' : '▶ 動かす';
      if (self.playing) kick();
    });
    ctrl.appendChild(pb);
    this.sSp = mkSlider('速さ', -100, 100, 0, function(v){ self.speed = Math.pow(4, v / 100); });
    ctrl.appendChild(mkBtn('t = 0 に戻す', 'b-full', function(){ self.t = 0; self.refresh(); }));
  }

  /* ---------------- 折りたたみ解説 ---------------- */
  const det = el('details','explain');
  det.appendChild(el('summary', null,
    this.key === 'sph'  ? 'なぜ実の軌道では確率流が止まるのか' :
    this.key === 'pauli' ? '「量子化軸が変わる」とはどういうことか' :
                           'なぜ基準振動に分けたいのか'));
  const body = el('div','body');
  det.appendChild(body);
  this.root.appendChild(det);
  body.innerHTML = this.key === 'sph' ? SPH_NOTES
                 : this.key === 'pauli' ? PAULI_NOTES : MODE_NOTES;
};

Sim.prototype.reset = function(){ this.t = 0; this.refresh(); };

/* ========================================================================
   3. 描画の共通部品
   ======================================================================== */
Sim.prototype.resize = function(){
  const w = Math.max(320, this.cv.parentNode.clientWidth);
  const h = this.key === 'sph'   ? Math.round(Math.max(360, Math.min(520, w * 0.60)))
          : this.key === 'pauli' ? Math.round(Math.max(320, Math.min(440, w * 0.50)))
          :                        Math.round(Math.max(380, Math.min(520, w * 0.62)));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  this.cv.width = Math.round(w * dpr);
  this.cv.height = Math.round(h * dpr);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};

/* 枠と軸の名前。横軸の名前は軸の真下に中央そろえ、
   縦軸の名前は 90 度回して軸の左に置く（グラフの基本の作法）。 */
function frameL(c, x0, y0, x1, y1, xlab, ylab){
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '11px ' + CFONT;
  if (xlab){
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(xlab, (x0 + x1) / 2, y1 + 17);
  }
  if (ylab){
    const off = Math.min(40, Math.max(13, x0 - 9));
    c.save(); c.translate(x0 - off, (y0 + y1) / 2); c.rotate(-Math.PI / 2);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(ylab, 0, 0); c.restore();
  }
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
}

/* 2×2 の行列を、成分の大きさで塗り分けて描く。
   非対角は赤、対角は青。対角化できていれば赤が白く抜ける。 */
function drawMatrix(c, cx, cy, s, M, scale, cap, room){
  const x0 = cx - s, y0 = cy - s;
  for (let i = 0; i < 2; i++){
    for (let j = 0; j < 2; j++){
      const v = M[i][j], t = Math.min(1, Math.abs(v) / scale);
      const col = (i === j) ? '15,76,129' : '198,40,40';
      const x = x0 + j * s, y = y0 + i * s;
      c.fillStyle = 'rgba(' + col + ',' + (0.06 + 0.72 * Math.pow(t, 0.75)) + ')';
      c.fillRect(x + 1.5, y + 1.5, s - 3, s - 3);
      c.strokeStyle = 'rgba(31,35,40,.14)'; c.lineWidth = 1;
      c.strokeRect(x + 1.5, y + 1.5, s - 3, s - 3);
      c.fillStyle = t > 0.45 ? '#fff' : '#15202b';
      /* 数字がマスからはみ出さないよう、幅を測って縮める */
      const txt = f3(v);
      let fs = Math.round(s * 0.30);
      c.font = 'bold ' + fs + 'px ' + CFONT;
      while (fs > 8 && c.measureText(txt).width > s - 11){
        fs -= 1; c.font = 'bold ' + fs + 'px ' + CFONT;
      }
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(txt, x + s / 2, y + s / 2);
    }
  }
  /* 大かっこ */
  const b = 7, X0 = x0 - 6, X1 = x0 + 2 * s + 6;
  c.strokeStyle = 'rgba(31,35,40,.55)'; c.lineWidth = 1.6;
  c.beginPath();
  c.moveTo(X0 + b, y0 - 3); c.lineTo(X0, y0 - 3); c.lineTo(X0, y0 + 2*s + 3); c.lineTo(X0 + b, y0 + 2*s + 3);
  c.moveTo(X1 - b, y0 - 3); c.lineTo(X1, y0 - 3); c.lineTo(X1, y0 + 2*s + 3); c.lineTo(X1 - b, y0 + 2*s + 3);
  c.stroke();
  if (cap){
    /* 説明は 2 通り渡せる。入りきらないときは短いほうにする */
    c.fillStyle = '#5c6670'; c.font = '11px ' + CFONT;
    let txt = Array.isArray(cap) ? cap[0] : cap;
    if (room && Array.isArray(cap) && c.measureText(txt).width > room) txt = cap[1];
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(txt, cx, y0 + 2 * s + 12);
  }
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
}

/* HSL → RGB（位相の色に使う） */
function hsl2rgb(h, s, l){
  h = ((h % 1) + 1) % 1;
  const a = s * Math.min(l, 1 - l);
  const f = function(n){
    const k = (n + h * 12) % 12;
    return l - a * Math.max(-1, Math.min(Math.min(k - 3, 9 - k), 1));
  };
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}

Sim.prototype.draw = function(){
  if (!this.W) return;
  const c = this.ctx;
  c.clearRect(0, 0, this.W, this.H);
  if (this.key === 'sph') this.drawSph();
  else if (this.key === 'pauli') this.drawPauli();
  else this.drawMode();
};

/* ========================================================================
   3a. タブ①：球面調和関数
   ======================================================================== */
Sim.prototype.drawSph = function(){
  const c = this.ctx, W = this.W, H = this.H;
  const o = ORBS[this.oi], beta = this.beta;
  if (this.rmaxFor !== this.oi){ this.rmax = rMaxOf(o); this.rmaxFor = this.oi; }
  const rmax = this.rmax;

  const yT = 14, yB = H - 34;
  const mS = Math.min(yB - yT, Math.round((W - 46) * 0.46));
  const mx0 = 14, my0 = yT + (yB - yT - mS) / 2;
  const B0 = mx0 + mS + 46, B1 = W - 14;

  /* ---- 左：赤道面の断面（色 = 位相、濃さ = |ψ|²） ---- */
  const N = 200;
  if (!this.off){ this.off = document.createElement('canvas'); this.off.width = this.off.height = N; }
  const oc = this.off.getContext('2d');
  const img = oc.createImageData(N, N);
  const A0 = eqAmp(o);
  /* 濃さの基準：|ψ|² の最大値 */
  let vmax = 1e-12;
  for (let i = 1; i <= 400; i++){
    const r = rmax * i / 400, a = Rnl(o.n, o.l, r) * A0;
    vmax = Math.max(vmax, a * a);
  }
  const cb = Math.cos(beta), sb = Math.sin(beta);
  for (let iy = 0; iy < N; iy++){
    for (let ix = 0; ix < N; ix++){
      const X = ((ix + 0.5) / N * 2 - 1) * rmax;
      const Y = (1 - (iy + 0.5) / N * 2) * rmax;
      const r = Math.sqrt(X * X + Y * Y);
      const k = (iy * N + ix) * 4;
      if (r > rmax || r < 1e-6){ img.data[k + 3] = 0; continue; }
      const phi = Math.atan2(Y, X);
      const a = Rnl(o.n, o.l, r) * A0;
      const re = a * cb * Math.cos(o.m * phi), im = a * sb * Math.sin(o.m * phi);
      const v = (re * re + im * im) / vmax;
      const t = Math.pow(Math.min(1, v), 0.42);
      const hue = (Math.atan2(im, re) / (2 * Math.PI) + 1) % 1;
      const rgb = hsl2rgb(hue, 0.72, 1 - 0.58 * t);
      img.data[k] = rgb[0]; img.data[k+1] = rgb[1]; img.data[k+2] = rgb[2];
      img.data[k+3] = 255;
    }
  }
  oc.putImageData(img, 0, 0);
  c.save();
  c.beginPath(); c.arc(mx0 + mS/2, my0 + mS/2, mS/2, 0, 6.2832); c.clip();
  c.imageSmoothingEnabled = true;
  c.drawImage(this.off, mx0, my0, mS, mS);
  c.restore();
  c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
  c.beginPath(); c.arc(mx0 + mS/2, my0 + mS/2, mS/2, 0, 6.2832); c.stroke();

  /* 座標軸 */
  const cx = mx0 + mS/2, cy = my0 + mS/2, Rp = mS/2;
  c.strokeStyle = 'rgba(31,35,40,.30)'; c.setLineDash([3,3]);
  c.beginPath();
  c.moveTo(cx - Rp, cy); c.lineTo(cx + Rp, cy);
  c.moveTo(cx, cy - Rp); c.lineTo(cx, cy + Rp);
  c.stroke(); c.setLineDash([]);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'right'; c.textBaseline = 'bottom';
  c.fillText('x', cx + Rp - 3, cy - 3);
  c.textAlign = 'left';
  c.fillText('y', cx + 3, cy - Rp + 12);

  /* 確率流。j_φ は φ に依らないので、いくつかの半径に等間隔で矢印を置く */
  if (this.showJ){
    const rr = [0.42, 0.62, 0.82].map(function(f){ return f * rmax; });
    let jm = 1e-12;
    for (let i = 1; i <= 300; i++) jm = Math.max(jm, Math.abs(jPhi(o, Math.PI/4, rmax * i/300)));
    rr.forEach(function(r, ri){
      const j = jPhi(o, beta, r);
      if (Math.abs(j) < jm * 0.012) return;
      const L = clamp(Math.abs(j) / jm, 0, 1) * Rp * 0.17 + 3;
      const sg = j > 0 ? 1 : -1;
      const nA = 8;
      for (let i = 0; i < nA; i++){
        /* 半径ごとに少しずらす。そろえると放射状の筋に見えてしまう */
        const ph = 2 * Math.PI * (i + ri / 3) / nA;
        const px = cx + r / rmax * Rp * Math.cos(ph), py = cy - r / rmax * Rp * Math.sin(ph);
        /* 接線方向（φ が増える向き＝反時計回り、画面では上向きに y 反転済み） */
        const tx = -Math.sin(ph) * sg, ty = -Math.cos(ph) * sg;
        c.strokeStyle = 'rgba(198,40,40,.85)'; c.lineWidth = 1.8;
        c.beginPath();
        c.moveTo(px - tx * L / 2, py - ty * L / 2);
        c.lineTo(px + tx * L / 2, py + ty * L / 2);
        c.stroke();
        c.fillStyle = 'rgba(198,40,40,.9)';
        c.beginPath();
        const hx = px + tx * L / 2, hy = py + ty * L / 2;
        c.moveTo(hx + tx * 4, hy + ty * 4);
        c.lineTo(hx - ty * 2.6 - tx * 1, hy + tx * 2.6 - ty * 1);
        c.lineTo(hx + ty * 2.6 - tx * 1, hy - tx * 2.6 - ty * 1);
        c.closePath(); c.fill();
      }
    });
  }
  /* 見出し */
  c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT;
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText('赤道面での ψ（色 = 位相、濃さ = |ψ|²）', mx0, my0 - 13 < yT ? yT : my0 - 13);

  /* ---- 右上：L̂_z の行列 ---- */
  const M = rotM([[0, o.m], [o.m, 0]], beta);
  const s = Math.min(58, Math.round((B1 - B0) * 0.22), Math.round((yB - yT) * 0.20));
  const mcx = (B0 + B1) / 2, mcy = yT + s + 22;
  c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText('いまの基底で見た L̂_z ／ ℏ', mcx, yT);
  drawMatrix(c, mcx, mcy, s, M, o.m, offAmount(M) < 1e-6
    ? ['非対角がゼロ ―― 対角化できています', '非対角がゼロ']
    : ['赤い非対角が残っている ―― まだ混ざっています', '非対角が残っている'],
    B1 - B0 - 4);

  /* ---- 右下：Re ψ と Im ψ（半径は |R| が最大のところ） ---- */
  const gy0 = mcy + s + 40, gy1 = yB;
  if (gy1 - gy0 > 40){
    frameL(c, B0, gy0, B1, gy1, '方位角 φ', 'ψ');
    let rBest = rmax * 0.4, best = 0;
    for (let i = 1; i <= 300; i++){
      const r = rmax * i / 300, a = Math.abs(Rnl(o.n, o.l, r));
      if (a > best){ best = a; rBest = r; }
    }
    const aB = Rnl(o.n, o.l, rBest) * A0;
    const px = function(ph){ return B0 + ph / (2 * Math.PI) * (B1 - B0); };
    const py = function(v){ return (gy0 + gy1) / 2 - v / (Math.abs(aB) * 1.18) * (gy1 - gy0) / 2; };
    c.strokeStyle = 'rgba(31,35,40,.30)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(B0, py(0)); c.lineTo(B1, py(0)); c.stroke();
    [['Re', cb, Math.cos, '#0f4c81', 2.4, []], ['Im', sb, Math.sin, '#c62828', 2.0, [5,4]]]
      .forEach(function(q){
        c.strokeStyle = q[3]; c.lineWidth = q[4]; c.setLineDash(q[5]);
        c.beginPath();
        for (let i = 0; i <= 300; i++){
          const ph = 2 * Math.PI * i / 300;
          const Y = py(aB * q[1] * q[2](o.m * ph));
          if (i === 0) c.moveTo(px(ph), Y); else c.lineTo(px(ph), Y);
        }
        c.stroke(); c.setLineDash([]);
      });
    c.font = '10px ' + CFONT; c.textAlign = 'right'; c.textBaseline = 'top';
    c.fillStyle = '#0f4c81'; c.fillText('Re ψ', B1 - 6, gy0 + 4);
    c.fillStyle = '#c62828'; c.fillText('Im ψ', B1 - 6, gy0 + 17);
    c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT;
    c.textAlign = 'center'; c.textBaseline = 'top';
    ['0', 'π/2', 'π', '3π/2', '2π'].forEach(function(t, i){
      const X = B0 + i / 4 * (B1 - B0);
      c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(X, gy1); c.lineTo(X, gy1 + 4); c.stroke();
      c.fillText(t, X, gy1 + 5);
    });
  }
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
};

/* ========================================================================
   3b. タブ②：パウリ行列
   ======================================================================== */
Sim.prototype.drawPauli = function(){
  const c = this.ctx, W = this.W, H = this.H;
  const al = this.alpha, th = this.thS;
  const yT = 30, yB = H - 30;
  const bS = Math.min(yB - yT, Math.round((W - 46) * 0.44));
  const cx = 14 + bS / 2, cy = yT + (yB - yT) / 2, Rb = bS / 2 - 8;
  const B0 = 14 + bS + 34, B1 = W - 14;

  /* ---- 左：Bloch 円（xz 面） ---- */
  c.strokeStyle = 'rgba(31,35,40,.20)'; c.lineWidth = 1;
  c.beginPath(); c.arc(cx, cy, Rb, 0, 6.2832); c.stroke();
  /* もとの座標軸。名前は円の内側に置く（外に出すと枠から切れる） */
  c.strokeStyle = 'rgba(92,102,112,.55)'; c.setLineDash([3,3]);
  c.beginPath();
  c.moveTo(cx, cy - Rb); c.lineTo(cx, cy + Rb);
  c.moveTo(cx - Rb, cy); c.lineTo(cx + Rb, cy);
  c.stroke(); c.setLineDash([]);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText('|↑z⟩', cx, cy - Rb + 4);
  c.textBaseline = 'bottom';
  c.fillText('|↓z⟩', cx, cy + Rb - 4);
  c.textAlign = 'right'; c.textBaseline = 'bottom';
  c.fillText('|↑x⟩', cx + Rb - 4, cy - 4);
  c.textAlign = 'left';
  c.fillText('|↓x⟩', cx - Rb + 4, cy - 4);

  /* いま選んでいる基底の軸（Bloch 円では 2α だけ回る） */
  const ux = Math.sin(2 * al), uz = Math.cos(2 * al);
  c.strokeStyle = '#6a3d9a'; c.lineWidth = 2.6;
  c.beginPath();
  c.moveTo(cx - ux * Rb, cy + uz * Rb); c.lineTo(cx + ux * Rb, cy - uz * Rb);
  c.stroke();
  c.fillStyle = '#6a3d9a';
  [[1, 'e₁'], [-1, 'e₂']].forEach(function(q){
    const px = cx + q[0] * ux * Rb, py = cy - q[0] * uz * Rb;
    c.beginPath(); c.arc(px, py, 4.5, 0, 6.2832); c.fill();
    c.font = 'bold 11px ' + CFONT;
    /* 名前は円の内側へ 15 px 引き込む */
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(q[1], cx + q[0] * ux * (Rb - 15) + q[0] * uz * 11,
                     cy - q[0] * uz * (Rb - 15) + q[0] * ux * 11);
  });
  c.font = '10px ' + CFONT; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText('e₁ = 基底の「上」、e₂ = 基底の「下」', 14, yB + 4);

  /* 状態 |χ⟩ */
  const sx = Math.sin(th), sz = Math.cos(th);
  c.strokeStyle = '#c62828'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + sx * Rb, cy - sz * Rb); c.stroke();
  c.fillStyle = '#c62828';
  const hx = cx + sx * Rb, hy = cy - sz * Rb;
  c.beginPath();
  c.moveTo(hx + sx * 8, hy - sz * 8);
  c.lineTo(hx - sz * 5 - sx * 2, hy - sx * 5 + sz * 2);
  c.lineTo(hx + sz * 5 - sx * 2, hy + sx * 5 + sz * 2);
  c.closePath(); c.fill();
  c.font = 'bold 11px ' + CFONT;
  c.textAlign = sx > 0.2 ? 'right' : sx < -0.2 ? 'left' : 'center';
  c.textBaseline = sz > 0 ? 'top' : 'bottom';
  c.fillText('|χ⟩', hx - sx * 8, hy + sz * 10);

  /* 2α の弧 */
  if (al > 0.01){
    c.strokeStyle = 'rgba(106,61,154,.55)'; c.lineWidth = 1.4;
    c.beginPath();
    c.arc(cx, cy, Rb * 0.30, -Math.PI/2, -Math.PI/2 + 2*al, false);
    c.stroke();
    c.fillStyle = '#6a3d9a'; c.font = '10px ' + CFONT;
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText('2α = ' + Math.round(2*al*DEG) + '°',
               cx + Rb * 0.34 * Math.sin(al) + 3, cy - Rb * 0.34 * Math.cos(al));
  }
  c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'bottom';
  c.fillText('Bloch 円（xz 面）', cx, yT - 6);

  /* ---- 右上：σ_x の行列 ---- */
  const M = rotM([[0,1],[1,0]], al);
  const s = Math.min(58, Math.round((B1 - B0) * 0.24), Math.round((yB - yT) * 0.23));
  const mcx = (B0 + B1) / 2, mcy = yT + s + 16;
  c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'bottom';
  c.fillText('いまの基底で見た σ_x', mcx, yT - 6);
  drawMatrix(c, mcx, mcy, s, M, 1, offAmount(M) < 1e-6
    ? ['σ_z の形になりました ―― 対角化完了', 'σ_z になりました']
    : ['赤い非対角が残っている', '非対角が残っている'], B1 - B0 - 4);

  /* ---- 右下：基底での重み ---- */
  const gy0 = mcy + s + 46, gy1 = yB;
  if (gy1 - gy0 > 36){
    const d = th - 2 * al;
    const p1 = Math.pow(Math.cos(d / 2), 2), p2 = Math.pow(Math.sin(d / 2), 2);
    const bw = (B1 - B0 - 26) / 2;
    [[p1, '|c₁|²', '#6a3d9a', 0], [p2, '|c₂|²', '#8a94a6', 1]].forEach(function(q){
      const x = B0 + q[3] * (bw + 26);
      const hgt = (gy1 - gy0 - 20) * q[0];
      c.fillStyle = q[2];
      c.fillRect(x, gy1 - 16 - hgt, bw, hgt);
      c.strokeStyle = 'rgba(31,35,40,.18)'; c.lineWidth = 1;
      c.strokeRect(x, gy1 - 16 - hgt, bw, hgt);
      c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT;
      c.textAlign = 'center'; c.textBaseline = 'bottom';
      c.fillText((q[0] * 100).toFixed(1) + ' %', x + bw / 2, gy1 - 19 - hgt);
      c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT; c.textBaseline = 'top';
      c.fillText(q[1], x + bw / 2, gy1 - 14);
    });
    c.strokeStyle = 'rgba(31,35,40,.25)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(B0, gy1 - 16); c.lineTo(B1, gy1 - 16); c.stroke();
    c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
    c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText('いまの基底で見たときの重み', (B0 + B1) / 2, gy0 - 2);
  }
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
};

/* ========================================================================
   3c. タブ③：連成振動
   ======================================================================== */
Sim.prototype.drawMode = function(){
  const c = this.ctx, W = this.W, H = this.H;
  const D = dynMat(this.k1, this.k2, this.kc);
  const e = diagAngle(D);
  const w1 = Math.sqrt(Math.max(1e-9, e.hi)), w2 = Math.sqrt(Math.max(1e-9, e.lo));
  const x = motion(D, this.x0, this.t);

  const yT = 12, yB = H - 34;
  const hA = Math.round((yB - yT) * 0.30);
  const Ay0 = yT, Ay1 = yT + hA;
  const By0 = Ay1 + 30, By1 = yB;

  /* ---- 上：ばねと質点 ---- */
  const padL = 16, padR = 14;
  const X0 = padL, X1 = W - padR;
  const ym = (Ay0 + Ay1) / 2 + 4;
  const seg = (X1 - X0) / 3;
  const amp = Math.min(seg * 0.30, 34);
  const bw = 20, bh = 24;
  const p1 = X0 + seg + x[0] * amp, p2 = X0 + 2 * seg + x[1] * amp;
  const spring = function(xa, xb, coils){
    const lead = 6, a = xa + lead, b = xb - lead;
    const st = (b - a) / (coils * 2);
    c.beginPath(); c.moveTo(xa, ym); c.lineTo(a, ym);
    for (let i = 0; i < coils * 2; i++) c.lineTo(a + st * (i + 0.5), ym + (i % 2 ? 6 : -6));
    c.lineTo(b, ym); c.lineTo(xb, ym); c.stroke();
  };
  c.strokeStyle = '#5c6670'; c.lineWidth = 2.2;
  [X0, X1].forEach(function(xw){
    c.beginPath(); c.moveTo(xw, ym - 20); c.lineTo(xw, ym + 20); c.stroke();
  });
  c.lineWidth = 1.5;
  spring(X0, p1 - bw/2, 8);
  spring(p1 + bw/2, p2 - bw/2, 8);
  spring(p2 + bw/2, X1, 8);
  /* つり合いの位置 */
  c.strokeStyle = 'rgba(31,35,40,.20)'; c.setLineDash([2,3]); c.lineWidth = 1;
  [X0 + seg, X0 + 2*seg].forEach(function(xx){
    c.beginPath(); c.moveTo(xx, ym - 26); c.lineTo(xx, ym + 26); c.stroke();
  });
  c.setLineDash([]);
  [[p1, '#1565c0', '1'], [p2, '#00695c', '2']].forEach(function(q){
    c.fillStyle = q[1];
    c.fillRect(q[0] - bw/2, ym - bh/2, bw, bh);
    c.fillStyle = '#fff'; c.font = 'bold 11px ' + CFONT;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(q[2], q[0], ym);
  });
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText('k₁', X0 + seg / 2, ym + 22);
  c.fillText('κ', X0 + 1.5 * seg, ym + 22);
  c.fillText('k₂', X0 + 2.5 * seg, ym + 22);

  /* ---- 下：左＝時間変化、右＝行列 ---- */
  const s = Math.min(56, Math.round((W - 60) * 0.13));
  const mW = 2 * s + 30;
  const G0 = 46, G1 = W - mW - 26;
  const M = rotM(D, this.gam);

  /* 時間の窓。うなりが 1 周期は入る幅に取る。
     いまの時刻が窓の右端に来たら、窓のほうを一緒に動かす（オシロスコープと同じ）。
     窓を固定したまま t を Tw で折り返すと、赤いカーソルだけが左端へ飛んで
     曲線が切り替わり、上の質点の絵と食い違ってしまう。 */
  const dw = Math.abs(w1 - w2);
  const Tw = clamp(dw > 1e-6 ? 2.2 * 2 * Math.PI / dw : 120, 24, 150);
  const t0 = Math.max(0, this.t - Tw);
  if (G1 - G0 > 60){
    frameL(c, G0, By0, G1, By1, '時刻 t', 'その基底で見た成分');
    const cg = Math.cos(this.gam), sg = Math.sin(this.gam);
    /* 縦の目盛りは窓の中身から決めない。窓が動くたびに伸び縮みして、
       やはり絵と食い違って見えるため。どの基底で見ても |y| ≤ |x₀| なので、
       それを目安に固定する。 */
    const ymax = Math.max(1e-9, Math.sqrt(this.x0[0]*this.x0[0] + this.x0[1]*this.x0[1])) * 1.15;
    const NP = 500;
    const pts = [[], []];
    for (let i = 0; i <= NP; i++){
      const t = t0 + Tw * i / NP, xx = motion(D, this.x0, t);
      pts[0].push(cg * xx[0] + sg * xx[1]);
      pts[1].push(-sg * xx[0] + cg * xx[1]);
    }
    const gx = function(t){ return G0 + (t - t0) / Tw * (G1 - G0); };
    const gy = function(v){ return (By0 + By1) / 2 - v / ymax * (By1 - By0) / 2; };
    c.strokeStyle = 'rgba(31,35,40,.28)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(G0, gy(0)); c.lineTo(G1, gy(0)); c.stroke();

    /* 横軸の目盛り。窓が動いていることが分かるように、実際の時刻を書く */
    c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT;
    c.textAlign = 'center'; c.textBaseline = 'top';
    for (let k = 0; k <= 4; k++){
      const tt = t0 + Tw * k / 4, X = gx(tt);
      c.strokeStyle = 'rgba(31,35,40,.22)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(X, By1); c.lineTo(X, By1 + 4); c.stroke();
      c.fillText(tt.toFixed(0), X, By1 + 5);
    }

    ['#1565c0', '#00695c'].forEach(function(col, k){
      c.strokeStyle = col; c.lineWidth = k ? 1.8 : 2.2;
      c.beginPath();
      for (let i = 0; i <= NP; i++){
        const Y = gy(pts[k][i]);
        if (i === 0) c.moveTo(gx(t0 + Tw * i / NP), Y);
        else c.lineTo(gx(t0 + Tw * i / NP), Y);
      }
      c.stroke();
    });

    /* いまの時刻。窓が動き出したあとは、いつも右端に来る。
       曲線の上に丸を置いて、上の質点の位置と同じ値であることを示す。 */
    const tNow = this.t;
    const yNow = [cg * x[0] + sg * x[1], -sg * x[0] + cg * x[1]];
    c.strokeStyle = 'rgba(198,40,40,.6)'; c.setLineDash([2,3]); c.lineWidth = 1;
    c.beginPath(); c.moveTo(gx(this.t), By0); c.lineTo(gx(this.t), By1); c.stroke();
    c.setLineDash([]);
    ['#1565c0', '#00695c'].forEach(function(col, k){
      c.fillStyle = col;
      c.beginPath(); c.arc(gx(tNow), gy(yNow[k]), 3.6, 0, 6.2832); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 1.2; c.stroke();
    });

    const pure = Math.abs(this.gam - e.g) < 0.5 / DEG;
    c.fillStyle = pure ? '#0f4c81' : '#5c6670';
    c.font = (pure ? 'bold ' : '') + '10px ' + CFONT;
    c.textAlign = 'right'; c.textBaseline = 'top';
    c.fillText(pure ? 'どちらも純粋な正弦波 ―― 連成が解けています'
                    : 'うなっている ―― まだ 2 つの振動が混ざっています', G1 - 5, By0 + 4);
  }

  const mcx = W - 14 - mW / 2, mcy = By0 + s + 20;
  c.fillStyle = '#15202b'; c.font = 'bold 11px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText('いまの基底で見た D', mcx, By0);
  drawMatrix(c, mcx, mcy, s, M, Math.max(Math.abs(e.hi), Math.abs(e.lo)),
    offAmount(M) < 1e-6 ? ['対角 ―― ω² が並ぶ', '対角'] : ['非対角が残っている', '非対角あり'],
    mW + 12);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
};

/* ========================================================================
   4. 数式の箱（ブラウザ標準の MathML。外部ライブラリは使わない）
   ======================================================================== */
function mtx2(a, b, c, d){
  return '<mrow><mo>[</mo><mtable rowspacing="2pt" columnspacing="12pt">' +
         '<mtr><mtd>' + a + '</mtd><mtd>' + b + '</mtd></mtr>' +
         '<mtr><mtd>' + c + '</mtd><mtd>' + d + '</mtd></mtr>' +
         '</mtable><mo>]</mo></mrow>';
}
const N1 = '<mn>1</mn>', N0 = '<mn>0</mn>', NM1 = '<mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mn>1</mn></mrow>';
const MI = '<mi>m</mi>', MMI = '<mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mi>m</mi></mrow>';
const OSQ2 = '<mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac>';

const EQ_SPH =
  '<math display="block"><mrow>' +
    '<mi>ψ</mi><mo stretchy="false">(</mo><mi>β</mi><mo stretchy="false">)</mo><mo>=</mo>' +
    '<mi>cos</mi><mo>&#x2061;</mo><mi>β</mi><mo>&#x22C5;</mo><mi>C</mi><mo>+</mo>' +
    '<mi>i</mi><mspace width="0.12em"></mspace><mi>sin</mi><mo>&#x2061;</mo><mi>β</mi><mo>&#x22C5;</mo><mi>S</mi>' +
    '<mo>,</mo><mspace width="1.6em"></mspace>' +
    '<mrow><mo stretchy="false">⟨</mo><msub><mover accent="true"><mi>L</mi><mo>&#x2C6;</mo></mover><mi>z</mi></msub><mo stretchy="false">⟩</mo></mrow>' +
    '<mo>=</mo><mi>m</mi><mi>ℏ</mi><mspace width="0.1em"></mspace><mi>sin</mi><mo>&#x2061;</mo><mn>2</mn><mi>β</mi>' +
  '</mrow></math>' +
  '<math display="block"><mrow>' +
    '<msub><mi>j</mi><mi>φ</mi></msub><mo>∝</mo>' +
    '<mi>Im</mi><mo>&#x2061;</mo><mo stretchy="false">(</mo><msup><mi>ψ</mi><mo lspace="0em" rspace="0em">∗</mo></msup>' +
    '<msub><mo>∂</mo><mi>φ</mi></msub><mi>ψ</mi><mo stretchy="false">)</mo>' +
    '<mo>=</mo><mfrac><mi>m</mi><mn>2</mn></mfrac><mi>sin</mi><mo>&#x2061;</mo><mn>2</mn><mi>β</mi>' +
    '<mo>&#x22C5;</mo><msup><mrow><mo stretchy="false">|</mo><mi>ψ</mi><mo stretchy="false">|</mo></mrow><mn>2</mn></msup>' +

  '<span class="cmt">実の基底（<i>β</i> = 0°, 90°）では <i>ψ</i> が実数なので Im がゼロ ―― ' +
  '<b>確率流が止まります</b>。そのかわり <i>L̂</i><sub>z</sub> の行列は非対角になります</span>';

const EQ_PAULI =
  '<math display="block"><mrow>' +
    '<msub><mi>σ</mi><mi>x</mi></msub><mo>=</mo>' + mtx2(N0, N1, N1, N0) +
    '<mo>,</mo><mspace width="1.6em"></mspace>' +
    '<mi>U</mi><mo>=</mo>' + OSQ2 + mtx2(N1, N1, N1, NM1) +
    '<mo>,</mo><mspace width="1.6em"></mspace>' +
    '<msup><mi>U</mi><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mn>1</mn></mrow></msup>' +
    '<mo>=</mo><mi>U</mi>' +
  '</mrow></math>' +
  '<math display="block"><mrow>' +
    '<msup><mi>U</mi><mrow><mo form="prefix" lspace="0em" rspace="0em">−</mo><mn>1</mn></mrow></msup>' +
    '<msub><mi>σ</mi><mi>x</mi></msub><mi>U</mi><mo>=</mo>' + mtx2(N1, N0, N0, NM1) +
    '<mo>=</mo><msub><mi>σ</mi><mi>z</mi></msub>' +
    '<mo>,</mo><mspace width="1.6em"></mspace>' +
    '<mi>U</mi><msub><mi>χ</mi><mo>↑</mo></msub><mo>=</mo>' +
    '<mrow><mo>[</mo><mtable rowspacing="2pt"><mtr><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd></mtr></mtable><mo>]</mo></mrow>' +
  '</mrow></math>' +
  '<span class="cmt">講義ノート (14) そのものです。<b><i>U</i> の列は <i>σ</i><sub>x</sub> の固有ベクトル</b>。' +
  'それで挟むと <i>σ</i><sub>x</sub> が <i>σ</i><sub>z</sub> の顔になる ―― <b>量子化軸が x から z へ移った</b></span>';

/* ========================================================================
   6. 読み取り値
   ======================================================================== */
Sim.prototype.updateReadout = function(){
  const R = [];
  let msg = '', cls = '';
  if (this.key === 'sph'){
    const o = ORBS[this.oi], b = this.beta, bd = b * DEG;
    const a = coefPM(b);
    const M = rotM([[0, o.m], [o.m, 0]], b);
    let jm = 0;
    for (let i = 1; i <= 300; i++) jm = Math.max(jm, Math.abs(jPhi(o, b, this.rmax * i / 300)));
    const isReal = Math.abs(Math.sin(2 * b)) < 1e-9;
    const isCplx = Math.abs(Math.abs(Math.sin(2 * b)) - 1) < 1e-9;
    R.push(['混合角 β', Math.round(bd) + '°']);
    R.push(['いまの状態', isReal ? '実 ' + (Math.abs(Math.cos(b)) > 0.5 ? o.c : o.s)
                        : isCplx ? '複素 Y' + (Math.sin(2*b) > 0 ? '⁺' : '⁻') + '（m = ' + (Math.sin(2*b) > 0 ? '+' : '−') + o.m + '）'
                        : '混ざった状態']);
    R.push(['⟨L̂_z⟩ = mℏ sin2β', f3(o.m * Math.sin(2 * b)) + ' ℏ']);
    R.push(['Y⁺ の重み |a₊|²', (a[0]*a[0]*100).toFixed(1) + ' %']);
    R.push(['Y⁻ の重み |a₋|²', (a[1]*a[1]*100).toFixed(1) + ' %']);
    R.push(['Im ψ の割合 sin²β', (Math.pow(Math.sin(b), 2) * 100).toFixed(1) + ' %']);
    R.push(['確率流の強さ（複素 = 1）', f3(Math.abs(Math.sin(2 * b)))]);
    R.push(['確率流の最大値', fmt(jm, 3)]);
    R.push(['L̂_z の対角成分', f3(M[0][0]) + ' ／ ' + f3(M[1][1]) + ' ℏ']);
    R.push(['L̂_z の非対角成分', f3(M[0][1]) + ' ℏ']);
    R.push(['|ψ|² の花びらの数', isCplx ? '0（ドーナツ）' : String(2 * o.m)]);
    msg = isCplx
      ? '<b>複素の基底です。</b>L̂_z の行列は対角で、対角成分 ' + f3(M[0][0]) +
        ' ℏ と ' + f3(M[1][1]) + ' ℏ が、そのまま <b>L̂_z を測って出てくる値</b>です。' +
        'そのかわり位相が回っているので、確率流が流れています。'
      : isReal
      ? '<b>実の基底です。</b>ψ が実数なので確率流はゼロ、⟨L̂_z⟩ もゼロ。' +
        'そのかわり L̂_z の行列は非対角 ' + f3(M[0][1]) + ' ℏ だけ残り、<b>L̂_z は確定値をもちません</b>。' +
        '教科書の軌道の絵はこちら側です。'
      : 'β を 0°・45°・90°・135° に合わせてみてください。'
        + '<b>45° と 135° で非対角がゼロ</b>（＝対角化）になります。';
    cls = isCplx || isReal ? 'key' : '';

  } else if (this.key === 'pauli'){
    const al = this.alpha, th = this.thS;
    const M = rotM([[0,1],[1,0]], al);
    const d = th - 2 * al;
    const p1 = Math.pow(Math.cos(d / 2), 2), p2 = Math.pow(Math.sin(d / 2), 2);
    const exact = Math.sin(th);
    const diagOnly = M[0][0] * p1 + M[1][1] * p2;
    const done = Math.abs(al - Math.PI/4) < 1e-9;
    R.push(['基底の回転角 α', Math.round(al * DEG) + '°']);
    R.push(['Bloch 円での回転', Math.round(2 * al * DEG) + '°']);
    R.push(['U の第 1 列 e₁', '(' + f3(Math.cos(al)) + ', ' + f3(Math.sin(al)) + ')']);
    R.push(['U の第 2 列 e₂', '(' + f3(-Math.sin(al)) + ', ' + f3(Math.cos(al)) + ')']);
    R.push(['σ_x の対角成分', f3(M[0][0]) + ' ／ ' + f3(M[1][1])]);
    R.push(['σ_x の非対角成分', f3(M[0][1])]);
    R.push(['状態 |χ⟩ の向き θ', Math.round(th * DEG) + '°']);
    R.push(['基底での重み |c₁|²', (p1*100).toFixed(1) + ' %']);
    R.push(['基底での重み |c₂|²', (p2*100).toFixed(1) + ' %']);
    R.push(['⟨σ_x⟩（正しい値）', f3(exact)]);
    R.push(['対角成分だけで数えた値', f3(diagOnly)]);
    R.push(['非対角の寄与（取りこぼし）', f3(exact - diagOnly)]);
    msg = done
      ? '<b>対角化できました。</b>行列は [[1,0],[0,−1]] = σ_z。'
        + '対角に並んだ +1 と −1 が<b>測れば出てくる値（固有値）</b>で、'
        + '左の棒がそのまま<b>その値が出る確率</b>になります。'
        + '「対角成分だけで数えた値」が ⟨σ_x⟩ と一致しているのを確かめてください。'
      : '<b>まだ非対角が ' + f3(M[0][1]) + ' 残っています。</b>'
        + 'このとき「Σ λ|c|²」で計算すると ' + f3(diagOnly) + ' となり、'
        + '正しい ⟨σ_x⟩ = ' + f3(exact) + ' と <b>' + f3(exact - diagOnly) + ' だけずれます</b>。'
        + '取りこぼしているのが、非対角成分の寄与です。';
    cls = done ? 'key' : '';

  } else {
    const D = dynMat(this.k1, this.k2, this.kc);
    const e = diagAngle(D);
    const M = rotM(D, this.gam);
    const w1 = Math.sqrt(Math.max(0, e.hi)), w2 = Math.sqrt(Math.max(0, e.lo));
    const x = motion(D, this.x0, this.t);
    const done = Math.abs(this.gam - e.g) < 0.5 / DEG;
    R.push(['ばね定数 k₁ / k₂ / κ', fmt(this.k1,3) + ' / ' + fmt(this.k2,3) + ' / ' + fmt(this.kc,3)]);
    R.push(['固有値 ω₁² ／ ω₂²', f3(e.hi) + ' ／ ' + f3(e.lo)]);
    R.push(['固有振動数 ω₁ ／ ω₂', f3(w1) + ' ／ ' + f3(w2)]);
    R.push(['対角化する角度 γ*', (e.g * DEG).toFixed(1) + '°']);
    R.push(['基準振動 1（速い）', '(' + f3(Math.cos(e.g)) + ', ' + f3(Math.sin(e.g)) + ')']);
    R.push(['基準振動 2（遅い）', '(' + f3(-Math.sin(e.g)) + ', ' + f3(Math.cos(e.g)) + ')']);
    R.push(['いまの γ', Math.round(this.gam * DEG) + '°']);
    R.push(['D の非対角成分', f3(M[0][1])]);
    R.push(['うなりの周期', Math.abs(w1 - w2) > 1e-6
      ? fmt(2 * Math.PI / Math.abs(w1 - w2), 4) : '—（振動数が同じ）']);
    const cg2 = Math.cos(this.gam), sg2 = Math.sin(this.gam);
    R.push(['いまの時刻 t', this.t.toFixed(2)]);
    R.push(['いまの変位 x₁ ／ x₂', f3(x[0]) + ' ／ ' + f3(x[1])]);
    R.push(['いまの成分 y₁ ／ y₂', f3(cg2*x[0] + sg2*x[1]) + ' ／ ' + f3(-sg2*x[0] + cg2*x[1])]);
    msg = done
      ? '<b>対角化できました。</b>非対角がゼロなので、下のグラフの 2 本は'
        + '<b>それぞれ独立な単振動</b>（ω₁ = ' + f3(w1) + '、ω₂ = ' + f3(w2) + '）。'
        + 'これが<b>基準振動</b>で、結晶ならフォノンにあたります。'
      : '<b>非対角が ' + f3(M[0][1]) + ' 残っています。</b>'
        + '2 つの振動数が混ざるので、下のグラフは<b>うなり</b>ます。'
        + '「対角化する角度に合わせる」を押してみてください。';
    cls = done ? 'key' : '';
  }
  this.readout.innerHTML = R.map(function(r){
    return '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
  this.msgEl.className = 'msg' + (cls ? ' ' + cls : '');
  this.msgEl.innerHTML = msg;
  /* スライダーの札 */
  if (this.sB)  this.sB.lab.innerHTML  = 'β = ' + Math.round(this.beta * DEG) + '°';
  if (this.sA)  this.sA.lab.innerHTML  = 'α = ' + Math.round(this.alpha * DEG) + '°';
  if (this.sT)  this.sT.lab.innerHTML  = 'θ = ' + Math.round(this.thS * DEG) + '°';
  if (this.sK1) this.sK1.lab.innerHTML = 'k₁ = ' + this.k1.toFixed(2);
  if (this.sK2) this.sK2.lab.innerHTML = 'k₂ = ' + this.k2.toFixed(2);
  if (this.sKc) this.sKc.lab.innerHTML = 'κ = ' + this.kc.toFixed(2);
  if (this.sG)  this.sG.lab.innerHTML  = 'γ = ' + Math.round(this.gam * DEG) + '°';
};

Sim.prototype.refresh = function(){
  this.resize();
  this.draw();
  this.updateReadout();
  postHeight();
};

/* ========================================================================
   7. アニメーション（タブ③だけ）
   ======================================================================== */
const sims = {};
let rafId = null, last = 0;
function loop(now){
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  let busy = false;
  Object.keys(sims).forEach(function(k){
    const s = sims[k];
    if (s.key !== 'mode' || !s.playing || s.root.hidden) return;
    s.t += dt * 2.4 * s.speed;
    if (s.t > 1e6) s.t = 0;
    s.draw(); s.updateReadout();
    busy = true;
  });
  rafId = busy ? requestAnimationFrame(loop) : null;
}
function kick(){
  if (rafId === null){ last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ========================================================================
   8. 立ち上げ
   ======================================================================== */
/* iframe に埋め込まれたとき、親ページへ必要な高さを知らせる。
   Sim の立ち上げから呼ぶので、先に置いておく（let の巻き上げ対策）。 */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let only = null;
const mm = /[?&]only=(sph|pauli|mode)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');

['sph', 'pauli', 'mode'].forEach(function(key){
  const p = app.querySelector('[data-panel="' + key + '"]');
  if (!p) return;
  if (only && only !== key){ p.parentNode.removeChild(p); return; }
  sims[key] = new Sim(key, p);
});

let active = only || 'sph';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].refresh();
  kick();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].refresh(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].refresh(); });
});
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
</body>
</html>
