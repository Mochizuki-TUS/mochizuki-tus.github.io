<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taylor 展開 ― 次数を上げると，どこまで関数に近づくか</title>
<meta name="description" content="sin x, cos x, e^x を Maclaurin 展開で 1 次・2 次・3 次…と近似していくと，原点から離れた場所でもどこまで合ってくるかをグラフで見るシミュレーター．剰余項と収束半径，物理での使いどころも．東京理科大学 望月研究室．">
<style>
/* ==========================================================================
   配色・角丸・フォントは望月研究室サイト (style.css) に合わせてあります．
   スタイルはすべて #qsim 配下にスコープしてあるので，
   既存ページに <div id="qsim">…</div> ごと貼り付けても衝突しません．
   （直貼りするときは，下の html,body ブロックだけ削除してください）
   ========================================================================== */
html, body { margin:0; background:#fafafa; }

#qsim{
  --bg:#fafafa;
  --panel:#ffffff;
  --panel-soft:#f4f6f9;
  --fg:#1f2328;
  --sub:#5c6670;
  --line:rgba(31,35,40,.12);
  --accent:#0f4c81;
  --accent-strong:#0a355a;
  --accent-soft:#e7eff7;
  --exact:#15202b;       /* もとの関数 f(x) */
  --appr:#0f4c81;        /* いま選んでいる次数の Tₙ(x) */
  --ghost:#9db6cd;       /* 途中の次数 */
  --good:#2e7d32;        /* 誤差が許容内の範囲 */
  --goodbg:rgba(46,125,50,.10);
  --err:#c62828;         /* 誤差・発散 */
  --bnd:#f9a825;         /* Lagrange の上界 */
  --pole:#8a5a00;        /* 特異点 */
  --warn:#8a5a00;
  --warnbg:#fdf5e3;
  --shadow:0 14px 32px rgba(20,34,51,.08);
  --radius-lg:20px;
  --radius-md:14px;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color:var(--fg); font-family:var(--font); line-height:1.7;
  max-width:1120px; margin:0 auto; padding:16px 18px 22px;
  -webkit-text-size-adjust:100%;
}
#qsim *{box-sizing:border-box}
#qsim h1{font-size:1.34rem; line-height:1.3; margin:0 0 4px; color:#15202b; letter-spacing:.01em}
#qsim p{margin:.3em 0}
#qsim .lead{color:var(--sub); font-size:.86rem; margin:0}

/* --- タブ --- */
#qsim .tabs{display:flex; gap:8px; margin:14px 0 14px; flex-wrap:wrap}
#qsim .tab{
  font:inherit; font-size:.92rem; font-weight:700; cursor:pointer;
  padding:8px 18px; border-radius:999px; border:1px solid var(--line);
  background:rgba(255,255,255,.7); color:#15202b;
  transition:background-color .2s ease, color .2s ease, transform .2s ease;
}
#qsim .tab:hover{background:rgba(15,76,129,.10); color:var(--accent-strong); transform:translateY(-1px)}
#qsim .tab.is-active{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .panel[hidden]{display:none}
/* 埋め込みのとき：見出しは隠す．
   タブは残す ―― 埋め込み先からでも ①②③ を押し比べられるようにするため．
   ?only=… で 1 枚だけ埋め込んだときは，押せるタブが 1 つもないので隠す． */
#qsim.is-embed{padding-top:6px}
#qsim.is-embed > h1,
#qsim.is-embed > .lead{display:none}
#qsim.is-embed > .tabs{margin:2px 0 12px}
#qsim.is-single > .tabs{display:none}

/* --- 2 カラム：左 = 図 / 右 = パラメーター --- */
#qsim .layout{
  display:grid; grid-template-columns:minmax(0,3fr) minmax(244px,1fr);
  gap:16px; align-items:start;
}
@media (max-width:760px){ #qsim .layout{grid-template-columns:1fr} }

/* --- 右カラム：コントロール --- */
#qsim .controls{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--shadow); padding:13px 14px;
}
#qsim .ctlhead{
  font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--sub); margin:0 0 8px;
}
#qsim .sep{height:1px; background:var(--line); margin:13px 0 11px; border:0}
#qsim .fld{display:flex; flex-direction:column; gap:3px; font-size:.78rem; color:var(--sub)}
#qsim .fld b{font-weight:700; color:var(--fg); font-size:.82rem}
#qsim .fld .hint{font-size:.71rem; color:var(--sub); line-height:1.45}
#qsim select.wide{
  font:inherit; font-size:.84rem; width:100%; padding:6px 8px; border-radius:9px;
  border:1px solid var(--line); background:#fff; color:var(--fg); cursor:pointer;
}
#qsim .ctlrow{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  font-size:.76rem; color:var(--sub); margin-top:9px;
}
#qsim .ctlrow > span:first-child{flex:0 0 auto; min-width:74px; font-variant-numeric:tabular-nums}
#qsim .ctlrow input[type=range]{flex:1 1 96px; min-width:80px; accent-color:var(--accent)}
#qsim .chk{display:flex; align-items:flex-start; gap:6px; font-size:.75rem;
  color:var(--sub); cursor:pointer; margin-top:10px; line-height:1.45}
#qsim .chk input{accent-color:var(--accent); cursor:pointer; margin-top:3px}

/* --- ボタン --- */
#qsim .btnrow{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:9px}
#qsim button.act{
  font:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  border:1px solid rgba(15,76,129,.20); background:rgba(255,255,255,.8); color:#15202b;
  padding:7px 10px; border-radius:9px; white-space:nowrap;
  transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}
#qsim button.act:hover{border-color:rgba(15,76,129,.5); box-shadow:0 8px 18px rgba(20,34,51,.10); transform:translateY(-1px)}
#qsim button.act.primary{background:var(--accent); border-color:var(--accent); color:#fff}
#qsim .b-full{flex:1 1 100%}
/* 横幅いっぱいのボタンは，ラベルが長いと枠をはみ出すので折り返させる */
#qsim button.act.b-full{white-space:normal; line-height:1.45; text-align:center}
#qsim .b-half{flex:1 1 calc(50% - 4px)}

/* --- 左カラム：キャンバス --- */
#qsim .stage{
  border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;
  background:var(--panel); box-shadow:var(--shadow);
}
#qsim canvas{display:block; width:100%; height:auto}
#qsim .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.75rem;
  color:var(--sub); margin:8px 2px 0}
#qsim .legend i{display:inline-block; width:15px; height:3px; border-radius:2px;
  vertical-align:middle; margin-right:5px}
#qsim .legend i.dash{background:none !important;
  border-top:3px dotted var(--sub); height:0; border-radius:0}

/* --- いま描いている多項式 --- */
#qsim .poly{
  margin-top:10px; padding:10px 12px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius-md);
  font-size:.86rem; line-height:2.0; overflow-x:auto;
}
#qsim .poly .lb{display:block; font-size:.71rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--sub); margin-bottom:2px; line-height:1.4}
#qsim .poly .t{white-space:nowrap}
#qsim .poly .t.new{background:var(--accent-soft); border-radius:5px; padding:1px 3px}
#qsim .poly .frac{display:inline-flex; flex-direction:column; vertical-align:-0.55em;
  text-align:center; line-height:1.15; margin:0 .12em}
#qsim .poly .frac > span:first-child{border-bottom:1px solid currentColor; padding:0 .18em}
#qsim .poly .cut{color:var(--sub); font-size:.8em}

/* --- 読み取り値 --- */
#qsim .readout{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:0 18px; margin-top:10px; font-size:.76rem;
}
#qsim .readout div{display:flex; justify-content:space-between; gap:10px;
  border-bottom:1px dotted var(--line); padding:3px 0}
#qsim .readout span:first-child{color:var(--sub)}
#qsim .readout span:last-child{font-variant-numeric:tabular-nums; font-weight:700}
#qsim .readout div.hi span:last-child{color:var(--good)}
#qsim .readout div.bad span:last-child{color:var(--err)}
#qsim sup{font-size:.72em}
#qsim sub{font-size:.72em}

/* --- 数式 --- */
#qsim .eq{
  text-align:center; padding:11px 8px; margin:10px 0 0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  overflow-x:auto;
}
/* 数式はブラウザ標準の MathML．数式フォントを明示しないと根号や括弧が
   中身の高さに伸びない（macOS は STIX Two Math，Windows は Cambria Math が標準） */
#qsim math{
  font-size:1.05em;
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  line-height:normal;
}
#qsim .eq math[display="block"]{font-size:1.12rem; margin:0 auto}
#qsim .eq .cmt{color:var(--sub); font-size:.82rem; display:block; margin-top:4px}
/* 本文中の変数．text-transform:math-auto で 1 文字を数式イタリック
   （Unicode の Mathematical Italic）へ写像すると，MathML の <mi> と
   まったく同じ字形になる．未対応ブラウザ用に素の italic を残す． */
#qsim i{
  font-family:"STIX Two Math","Latin Modern Math","Cambria Math","XITS Math",
              "TeX Gyre Termes Math","DejaVu Math TeX Gyre","Noto Sans Math",serif;
  font-size:1.05em; font-style:italic;
}
@supports (text-transform: math-auto){
  #qsim i{font-style:normal; text-transform:math-auto}
}

/* --- 解説（折りたたみ） --- */
#qsim .explain{
  margin-top:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius-md); padding:0 14px;
}
#qsim .explain > summary{
  cursor:pointer; list-style:none; padding:10px 0; font-size:.82rem; font-weight:700;
  color:var(--accent-strong);
}
#qsim .explain > summary::-webkit-details-marker{display:none}
#qsim .explain > summary::before{content:"▶ "; font-size:.72em; color:var(--sub)}
#qsim .explain[open] > summary::before{content:"▼ "}
#qsim .explain[open] > summary{border-bottom:1px solid var(--line)}
#qsim .explain .body{padding:4px 0 12px}
#qsim .note{
  font-size:.78rem; color:var(--sub); background:var(--panel-soft);
  border-left:3px solid var(--line); border-radius:0 8px 8px 0;
  padding:8px 12px; margin:9px 0;
}
#qsim .note.warn{color:var(--warn); background:var(--warnbg); border-left-color:currentColor}
#qsim .note.key{color:var(--accent-strong); background:var(--accent-soft); border-left-color:var(--accent)}
#qsim .note b{color:inherit}
#qsim .foot{margin-top:12px; font-size:.73rem; color:var(--sub); text-align:center}
#qsim .foot a{color:var(--accent); text-decoration:none}
#qsim .foot a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="qsim">
  <h1>Taylor 展開 ― 次数を上げると，どこまで関数に近づくか</h1>
  <p class="lead">
    <i>y</i> = sin&#8201;<i>x</i> を，原点のまわりで 1 次・2 次・3 次…と近似していきます．
    次数を上げるほど，<b><i>x</i> = 0 から離れた場所でも重なってくる</b>のが見えます．
    どこまで離れても大丈夫なのか，そして<b>いくら次数を上げても近づけない関数</b>があるのはなぜか，まで見ます．
  </p>

  <div class="tabs" role="tablist">
    <button class="tab is-active" data-tab="grow" role="tab">① 次数を上げていく</button>
    <button class="tab" data-tab="err" role="tab">② 誤差の正体 ― 剰余項と収束半径</button>
    <button class="tab" data-tab="phys" role="tab">③ 物理での使いどころ</button>
  </div>

  <section class="panel" data-panel="grow"></section>
  <section class="panel" data-panel="err" hidden></section>
  <section class="panel" data-panel="phys" hidden></section>

  <p class="foot">
    東京理科大学 望月研究室 ／ 講義ノート「Taylor's theorem（テイラーの定理）」より．
    導出は <a href="taylor-derivation.html">こちらのページ</a>にあります．
  </p>
</div>

<script>
(function () {
'use strict';
/* ========================================================================
   0. 共通の道具
   ======================================================================== */
const CFONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
const PI = Math.PI;

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }
function fmt(v, d){
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-4 || a >= 1e6)){
    const s = v.toExponential(d === undefined ? 3 : d);
    const m = /^(-?[\d.]+)e([+-]\d+)$/.exec(s);
    return m ? m[1] + '×10<sup>' + Number(m[2]) + '</sup>' : s;
  }
  return v.toFixed(d === undefined ? 3 : d);
}
function sup(n){ return '<sup>' + n + '</sup>'; }
/* 式として自然に読めるように，x¹ は x，x⁰ は 1，1! は書かない． */
function xp(n){ return n === 0 ? '1' : n === 1 ? 'x' : 'x' + sup(n); }

/* sin(θ + mπ/2) と cos(θ + mπ/2)．mπ/2 の部分を m mod 4 で厳密に処理する．
   Math.sin(x + m*PI/2) と書くと，m が大きいところで引数の丸めのせいで
   「厳密に 0 のはずの微分係数」が 10⁻¹⁴ 程度の値になってしまう． */
function sinPh(th, m){
  const q = ((m % 4) + 4) % 4;
  return q === 0 ? Math.sin(th) : q === 1 ? Math.cos(th)
       : q === 2 ? -Math.sin(th) : -Math.cos(th);
}
function cosPh(th, m){
  const q = ((m % 4) + 4) % 4;
  return q === 0 ? Math.cos(th) : q === 1 ? -Math.sin(th)
       : q === 2 ? -Math.cos(th) : Math.sin(th);
}
/* sin(m(θ + π/2)) ＝ sin(mθ + mπ/2)．arctan 系の微分係数に使う． */
function sinMPh(m, th){ return sinPh(m * th, m); }
function fct(n){ return n <= 1 ? null : n + '!'; }

/* 有理数（√(1+x) の係数を 5/128 のような分数のまま出すためだけに使う）．
   n ≦ 20 くらいまでなら分母は 2^40 程度で，double の整数範囲に収まる． */
function gcd(a, b){ a = Math.abs(a); b = Math.abs(b); while (b){ const t = a % b; a = b; b = t; } return a; }
function rat(n, d){
  if (d < 0){ n = -n; d = -d; }
  const g = gcd(n, d) || 1;
  return { n: n / g, d: d / g };
}
function ratMul(p, q){ return rat(p.n * q.n, p.d * q.d); }

/* ========================================================================
   1. 関数のカタログ
   ------------------------------------------------------------------------
   d(n, x) は n 階の微分係数 f⁽ⁿ⁾(x)（n = 0 は f そのもの）．
   Taylor 係数は f⁽ⁿ⁾(a)/n! なので，必要なのはこれだけ．
   R は収束半径（Maclaurin 展開のとき）．sing は複素平面上の特異点．
   ======================================================================== */

/* exp(−1/x²) の n 階微分．f⁽ⁿ⁾(x) = Pₙ(1/x)·e^(−1/x²) という形になり，
   P₀ = 1，P_{n+1}(t) = −t²Pₙ′(t) + 2t³Pₙ(t)（t = 1/x）で漸化する．
   t が大きいと t^60 が発散し e^(−t²) が 0 に落ちるので，対数で足す． */
const FLAT_P = [[1]];                       // 係数配列（添字＝t の次数）
function flatPoly(n){
  while (FLAT_P.length <= n){
    const p = FLAT_P[FLAT_P.length - 1], q = [];
    for (let k = 0; k < p.length + 3; k++) q.push(0);
    for (let k = 0; k < p.length; k++){
      if (!p[k]) continue;
      if (k >= 1) q[k + 1] -= k * p[k];      // −t²·(k t^{k−1}) = −k t^{k+1}
      q[k + 3] += 2 * p[k];                  // +2t³·t^k
    }
    FLAT_P.push(q);
  }
  return FLAT_P[n];
}
function flatDeriv(n, x){
  if (x === 0) return 0;                     // 0 では全ての微分係数が 0（これが要点）
  const t = 1 / x, at = Math.abs(t), lt = Math.log(at), q = flatPoly(n);
  let s = 0;
  for (let k = 0; k < q.length; k++){
    if (!q[k]) continue;
    const lg = Math.log(Math.abs(q[k])) + k * lt - t * t;
    if (lg < -745) continue;                 // double のアンダーフロー
    s += Math.sign(q[k]) * Math.pow(Math.sign(t), k) * Math.exp(lg);
  }
  return s;
}

const FUNCS = [
  {
    k:'sin', label:'y = sin x', tex:'sin&#8201;x', grp:'どこまでも収束する',
    f: Math.sin,
    d: function(n, x){ return sinPh(x, n); },
    /* |f⁽ⁿ⁾| ≦ 1 なので，剰余項の上界に使う最大値も 1 */
    R: Infinity, sing: [], xdef: 2 * PI, ylim: [-2.2, 2.2], piAxis: true,
    term: function(n){ return (n % 2 === 0) ? null : { sgn: (n % 4 === 1 ? 1 : -1), num: xp(n), den: fct(n) }; },
    why:'すべての階の微分が sin か cos なので |f⁽ⁿ⁾| ≦ 1．剰余項は |x|ⁿ⁺¹/(n+1)! で，n を上げれば<b>どんな x でも</b> 0 へ落ちる．'
  },
  {
    k:'cos', label:'y = cos x', tex:'cos&#8201;x', grp:'どこまでも収束する',
    f: Math.cos,
    d: function(n, x){ return cosPh(x, n); },
    R: Infinity, sing: [], xdef: 2 * PI, ylim: [-2.2, 2.2], piAxis: true,
    term: function(n){ return (n % 2) ? null : { sgn: (n % 4 === 0 ? 1 : -1), num: xp(n), den: fct(n) }; },
    why:'sin x と同じ理由．偶数次だけが残るので，cos は偶関数のまま近似される．'
  },
  {
    k:'exp', label:'y = e<sup>x</sup>', tex:'e<sup>x</sup>', grp:'どこまでも収束する',
    f: Math.exp,
    d: function(n, x){ return Math.exp(x); },
    R: Infinity, sing: [], xdef: 4, ylim: [-6, 22],
    term: function(n){ return { sgn: 1, num: xp(n), den: fct(n) }; },
    why:'何回微分しても e<sup>x</sup> のまま．区間の右端の値で押さえられるので，やはり (n+1)! が勝って 0 へ落ちる．'
  },
  {
    k:'sinh', label:'y = sinh x', tex:'sinh&#8201;x', grp:'どこまでも収束する',
    f: Math.sinh,
    d: function(n, x){ return (n % 2) ? Math.cosh(x) : Math.sinh(x); },
    R: Infinity, sing: [], xdef: 3.4, ylim: [-14, 14],
    term: function(n){ return (n % 2 === 0) ? null : { sgn: 1, num: xp(n), den: fct(n) }; },
    why:'sin x から符号の交替だけを取り去った形．項がすべて同符号なので，打ち消し合いが起きない．'
  },
  {
    k:'geo', label:'y = 1/(1 − x)', tex:'1/(1&#8722;x)', grp:'|x| &lt; 1 でしか収束しない',
    f: function(x){ return 1 / (1 - x); },
    d: function(n, x){ let v = 1; for (let i = 1; i <= n; i++) v *= i; return v / Math.pow(1 - x, n + 1); },
    R: 1, sing: [[1, 0]], xdef: 1.6, ylim: [-6, 8], pole: [1],
    term: function(n){ return { sgn: 1, num: xp(n), den: null }; },
    why:'x = 1 で関数そのものが発散する．等比級数 1 + x + x² + … が |x| &lt; 1 でしか収束しないのと同じこと．'
  },
  {
    k:'log', label:'y = ln(1 + x)', tex:'ln(1+x)', grp:'|x| &lt; 1 でしか収束しない',
    f: function(x){ return Math.log(1 + x); },
    d: function(n, x){
      if (n === 0) return Math.log(1 + x);
      let v = 1; for (let i = 1; i <= n - 1; i++) v *= i;      // (n−1)!
      return ((n % 2) ? 1 : -1) * v / Math.pow(1 + x, n);
    },
    R: 1, sing: [[-1, 0]], xdef: 1.6, ylim: [-4, 2.2], pole: [-1],
    term: function(n){ return n === 0 ? null : { sgn: (n % 2 ? 1 : -1), num: xp(n), den: n === 1 ? null : String(n) }; },
    why:'x = −1 で −∞ に落ちる．だから 0 からそこまでの距離 1 が収束半径になる．x = 1 ではぎりぎり収束して ln&#8201;2 を与える．'

/* ========================================================================
   2. Taylor 多項式
   ------------------------------------------------------------------------
   Tₙ(x) = Σ f⁽ᵏ⁾(a)/k! · (x−a)^k．
   (x−a)^k/k! を漸化式 p ← p·(x−a)/k で作る．こうすると k が大きいところで
   分子も分母も暴れず，桁落ち以外の破綻が起きない．
   ======================================================================== */
function taylor(fn, a, N, x){
  let s = fn.d(0, a), p = 1;
  for (let k = 1; k <= N; k++){
    p *= (x - a) / k;
    s += fn.d(k, a) * p;
  }
  return s;
}
/* T₀ … T_N をまとめて返す（途中の次数を薄く重ねて描くため） */
function taylorAll(fn, a, N, x){
  const out = []; let s = fn.d(0, a), p = 1;
  out.push(s);
  for (let k = 1; k <= N; k++){
    p *= (x - a) / k;
    s += fn.d(k, a) * p;
    out.push(s);
  }
  return out;
}
/* Lagrange の剰余項の上界 |R| ≦ max|f⁽ⁿ⁺¹⁾|·|x−a|ⁿ⁺¹/(n+1)!
   max は a と x の間を 200 点刻んで実際に探す（式で押さえるより素直で確実） */
function lagrangeBound(fn, a, N, x){
  const n1 = N + 1;
  let M = 0;
  for (let i = 0; i <= 200; i++){
    const c = a + (x - a) * i / 200;
    const v = Math.abs(fn.d(n1, c));
    if (isFinite(v) && v > M) M = v;
  }
  let p = 1;
  for (let k = 1; k <= n1; k++) p *= Math.abs(x - a) / k;
  return M * p;
}
/* Lagrange の定理が「存在する」と言っている c を実際に 1 つ見つける．
   f(x) − T_N(x) = f⁽ᴺ⁺¹⁾(c)/(N+1)!·(x−a)^{N+1} を c について解く． */
function findC(fn, a, N, x){
  if (Math.abs(x - a) < 1e-9) return null;
  const n1 = N + 1;
  let p = 1;
  for (let k = 1; k <= n1; k++) p *= (x - a) / k;
  if (!isFinite(p) || p === 0) return null;
  const want = (fn.f(x) - taylor(fn, a, N, x)) / p;    // これに等しい f⁽ᴺ⁺¹⁾(c) を探す
  const g = function(c){ return fn.d(n1, c) - want; };
  const S = 400;
  let c0 = a, g0 = g(a + (x - a) * 1e-6);
  for (let i = 1; i <= S; i++){
    const c1 = a + (x - a) * i / S, g1 = g(c1);
    if (isFinite(g0) && isFinite(g1) && g0 * g1 <= 0 && i > 0){
      let lo = c0, hi = c1;
      for (let j = 0; j < 60; j++){
        const mid = 0.5 * (lo + hi);
        if (g(lo) * g(mid) <= 0) hi = mid; else lo = mid;
      }
      return 0.5 * (lo + hi);
    }
    c0 = c1; g0 = g1;
  }
  return null;
}
/* 「誤差が tol 以内に収まる範囲」．a から左右へ別々に伸ばして探す．
   相対誤差ではなく，その関数の縦のスケール（scale）に対する割合で測る． */
function goodRange(fn, a, N, tol, scale, lim){
  const test = function(x){
    const e = Math.abs(fn.f(x) - taylor(fn, a, N, x));
    return isFinite(e) && e <= tol * scale;
  };
  const walk = function(dir){
    const step = lim / 400;
    let r = 0;
    for (let i = 1; i <= 400; i++){
      if (!test(a + dir * i * step)) break;
      r = i * step;
    }
    if (r === 0 || r >= lim - 1e-12) return r;
    let lo = r, hi = r + step;                 // 端を二分法で詰める
    for (let j = 0; j < 40; j++){
      const mid = 0.5 * (lo + hi);
      if (test(a + dir * mid)) lo = mid; else hi = mid;
    }
    return lo;
  };
  return [walk(-1), walk(1)];
}

   ここでは展開の中心 a が問題ごとに決まっているので，微分係数ではなく
   Taylor 係数 cₙ（(x−a)ⁿ の係数）を直接与える．Tₙ(x) = Σ cₙ (x−a)ⁿ．
   ======================================================================== */
const DEG = 180 / PI;

/* 冪級数の逆数 1/(Σ aₖ xᵏ)（a₀ = 1）．x/(eˣ−1) の係数に使う． */
function seriesInv(a, N){
  const c = [1 / a[0]];
  for (let n = 1; n <= N; n++){
    let s = 0;
    for (let k = 1; k <= n; k++) s += a[k] * c[n - k];
    c.push(-s / a[0]);
  }
  return c;
}
const PLANCK_C = (function(){
  /* (eˣ−1)/x = Σ xᵏ/(k+1)! なので，その逆数が x/(eˣ−1) */
  const a = []; let fk = 1;
  for (let k = 0; k <= 40; k++){ fk = k === 0 ? 1 : fk * (k + 1); a.push(1 / fk); }
  return seriesInv(a, 40);
})();

/* 算術幾何平均．単振り子の厳密な周期（第 1 種完全楕円積分）に使う． */
function agm(a, b){
  for (let i = 0; i < 60; i++){
    const na = 0.5 * (a + b), nb = Math.sqrt(a * b);
    if (Math.abs(na - nb) < 1e-16 * na) break;
    a = na; b = nb;
  }
  return 0.5 * (a + b);
}

/* Lennard-Jones．ε = σ = 1 の単位で置く（形は同じで，目盛だけが変わる）． */
const LJ_R0 = Math.pow(2, 1 / 6);
function ljV(r){ const u = 1 / r, u6 = Math.pow(u, 6); return 4 * (u6 * u6 - u6); }
function ljD(n, r){
  /* dⁿ/drⁿ r^(−p) = (−1)ⁿ p(p+1)…(p+n−1) r^(−p−n) */
  const ris = function(p){ let v = 1; for (let i = 0; i < n; i++) v *= (p + i); return v; };
  const s = (n % 2) ? -1 : 1;
  return 4 * s * (ris(12) * Math.pow(r, -12 - n) - ris(6) * Math.pow(r, -6 - n));
}

      + '熱膨張・屈折率・遮蔽・摂動 ―― 「小さい量で割る／掛ける」場面はほぼすべてこの形に帰着します．'
      + '<i>α</i> が 0 以上の整数のときだけ級数が有限項で終わり（二項定理），それ以外では無限級数で，'

      + '収束したりしなかったりします）．',

        ['1 次近似の誤差', (ex === 0 ? 0 : (ap - ex) / ex * 100).toFixed(3) + ' %'],
        ['収束半径', Number.isInteger(al) && al >= 0 ? '∞（有限項で終わる）' : '1（x = −1 が特異点）']

];
function appOf(k){ for (let i = 0; i < APPS.length; i++) if (APPS[i].k === k) return APPS[i]; return APPS[0]; }

/* Tₙ(x) = Σ cₙ(x−a)ⁿ．係数を直接持っている側の Taylor 多項式． */
function taylorApp(app, N, x){
  let s = app.coef(0), p = 1;
  for (let k = 1; k <= N; k++){ p *= (x - app.a); s += app.coef(k) * p; }
  return s;
}
function goodRangeApp(app, N, tol, scale, lo, hi){
  const test = function(x){
    const e = Math.abs(app.f(x) - taylorApp(app, N, x));
    return isFinite(e) && e <= tol * scale;
  };
  const walk = function(dir, lim){
    if (lim <= 0) return 0;
    const step = lim / 400;
    let r = 0;
    for (let i = 1; i <= 400; i++){ if (!test(app.a + dir * i * step)) break; r = i * step; }
    if (r === 0 || r >= lim - 1e-12) return r;
    let a0 = r, b0 = r + step;
    for (let j = 0; j < 40; j++){ const m = 0.5 * (a0 + b0); if (test(app.a + dir * m)) a0 = m; else b0 = m; }
    return a0;
  };
  return [walk(-1, app.a - lo), walk(1, hi - app.a)];
}

/* ========================================================================
   2. Sim ―― タブ 1 枚ぶん
   ======================================================================== */
const app = document.getElementById('qsim');
const sims = {};

function Sim(key, root){
  this.key = key;
  this.root = root;
  this.fkey = 'sin';                 // ①② で選んでいる関数
  this.akey = 'pend';                // ③ で選んでいる応用
  this.a = 0;                        // 展開の中心
  this.N = key === 'grow' ? 1 : 5;   // 次数
  this.span = funcOf('sin').xdef;    // 横の表示範囲（±span）
  this.tol = 0.01;                   // 「合っている」とみなす誤差
  this.ghost = true;                 // 途中の次数を薄く重ねる
  this.band = true;                  // 合っている範囲を塗る
  this.probe = 2.0;                  // ② ③ で調べる点 x*
  this.alpha = 0.5;                  // ③ 二項近似の α
  /* 教材ページには iframe がいくつも並ぶ．全部がいっせいに動き出すと
     落ち着いて読めないので，止まった状態で開く（読む人が選んで再生する） */
  this.playing = false;
  this.acc = 0;                      // 次数を上げるアニメーションの時計
  this.build();
}

Sim.prototype.fn  = function(){ return funcOf(this.fkey); };
Sim.prototype.ap  = function(){ const a = appOf(this.akey); a.al = this.alpha; return a; };
Sim.prototype.nmax = function(){ return this.key === 'phys' ? this.ap().nmax : 40; };

/* --------------------------------------------------------------------
   組み立て
   -------------------------------------------------------------------- */
Sim.prototype.build = function(){
  const self = this;
  const lay = el('div', 'layout');
  const main = el('div', 'col-main'), side = el('div', 'col-side');
  lay.appendChild(main); lay.appendChild(side);
  this.root.appendChild(lay);

  const stage = el('div', 'stage');

      '<span><i style="background:var(--exact)"></i>厳密な式</span>' +
      '<span><i style="background:var(--appr)"></i>N 次まで取った近似</span>' +
      '<span><i style="background:var(--ghost)"></i>それより低い次数</span>' +
      '<span><i style="background:var(--good)"></i>誤差が許容内の範囲</span>'));
  }

  this.poly = el('div', 'poly'); main.appendChild(this.poly);
  this.readout = el('div', 'readout'); main.appendChild(this.readout);

  if (this.key === 'phys'){

    sel.value = this.akey; sel.autocomplete = 'off';
    sel.addEventListener('change', function(){
      self.akey = this.value;
      const a = self.ap();
      self.N = Math.min(self.N, a.nmax);
      self.probe = a.a + 0.55 * ((a.xhi !== undefined ? a.xhi : 1) - a.a);
      self.syncCtl(); self.refresh();

    ctrl.appendChild(f1);
    this.selApp = sel;

    /* α（二項近似のときだけ出す） */
    this.alRow = el('label', 'ctlrow');
    this.alLab = el('span', null, 'α = 0.50');
    this.alRow.appendChild(this.alLab);
    const ain = document.createElement('input');
    ain.type = 'range'; ain.min = '-2'; ain.max = '3'; ain.step = '0.05'; ain.value = '0.5';
    ain.autocomplete = 'off';
    ain.addEventListener('input', function(){ self.alpha = Number(this.value); self.refresh(); });
    this.alRow.appendChild(ain);
    ctrl.appendChild(this.alRow);
    this.alIn = ain;
  } else {
    ctrl.appendChild(el('p', 'ctlhead', '関数'));
    const f1 = el('label', 'fld');
    f1.appendChild(el('b', null, 'f(x)'));
    const sel = el('select', 'wide');

    });
    sel.value = this.fkey; sel.autocomplete = 'off';
    sel.addEventListener('change', function(){
      self.fkey = this.value;
      const fn = self.fn();
      self.span = fn.xdef;
      self.a = 0;
      self.probe = Math.min(self.probe, fn.xdef * 0.8);
      self.syncCtl(); self.refresh();
    });
    f1.appendChild(sel);
    f1.appendChild(el('span', 'hint', 'いちばん上の 3 つが，講義でよく使う sin・cos・e<sup>x</sup>'));
    ctrl.appendChild(f1);
    this.selFn = sel;
  }

  ctrl.appendChild(el('hr', 'sep'));
  ctrl.appendChild(el('p', 'ctlhead', '近似の次数'));

  const nrow = el('label', 'ctlrow');
  this.nLab = el('span', null, 'N = 1');
  nrow.appendChild(this.nLab);
  const nin = document.createElement('input');
  nin.type = 'range'; nin.min = '0'; nin.max = String(this.nmax()); nin.step = '1'; nin.value = String(this.N);
  nin.autocomplete = 'off';
  nin.addEventListener('input', function(){ self.N = Number(this.value); self.stop(); self.refresh(); });
  nrow.appendChild(nin);
  ctrl.appendChild(nrow);
  this.nIn = nin;

  const brow = el('div', 'btnrow');
  [['1 次', 1], ['2 次', 2], ['3 次', 3], ['10 次', 10]].forEach(function(b){
    const btn = el('button', 'act', b[0]); btn.type = 'button';

  ctrl.appendChild(brow);

  const prow = el('div', 'btnrow');
  const bp = el('button', 'act primary b-full', '▶ 次数を 1 つずつ上げる');

  if (this.key !== 'phys'){

    ain.type = 'range'; ain.min = '-1'; ain.max = '1'; ain.step = '0.005'; ain.value = '0';
    ain.autocomplete = 'off';
    ain.addEventListener('input', function(){
      self.a = Number(this.value) * self.span * 0.8;
      self.refresh();
    });
    arow.appendChild(ain);
    ctrl.appendChild(arow);
    this.aIn = ain;
    const ab = el('button', 'act b-full', 'a = 0 に戻す（Maclaurin 展開）');
    ab.type = 'button';
    ab.addEventListener('click', function(){ self.a = 0; self.aIn.value = '0'; self.refresh(); });
    const abr = el('div', 'btnrow'); abr.appendChild(ab); ctrl.appendChild(abr);
    ctrl.appendChild(el('p', 'fld', '<span class="hint">a = 0 が Maclaurin 展開．a を動かすと，'
      + '近似が<b>その点に貼りつく</b>のが見えます．</span>'));
  }

  ctrl.appendChild(el('hr', 'sep'));

  if (this.key === 'grow'){
    ctrl.appendChild(el('p', 'ctlhead', '見え方'));
    const srow = el('label', 'ctlrow');
    this.sLab = el('span', null, '横 ±6.3');
    srow.appendChild(this.sLab);
    const sin_ = document.createElement('input');
    sin_.type = 'range'; sin_.min = '0.15'; sin_.max = '2.6'; sin_.step = '0.01'; sin_.value = '1';
    sin_.autocomplete = 'off';
    sin_.addEventListener('input', function(){
      self.span = self.fn().xdef * Number(this.value);
      self.a = clamp(self.a, -self.span * 0.8, self.span * 0.8);

    });
    srow.appendChild(sin_);
    ctrl.appendChild(srow);
    this.sIn = sin_;

    const tf = el('label', 'fld'); tf.style.marginTop = '9px';
    tf.appendChild(el('b', null, '「合っている」とみなす誤差'));
    const tsel = el('select', 'wide');
    [['0.1 %', 0.001], ['1 %', 0.01], ['5 %', 0.05]].forEach(function(t){
      const o = document.createElement('option'); o.textContent = t[0]; o.value = String(t[1]); tsel.appendChild(o);

    tsel.value = '0.01'; tsel.autocomplete = 'off';
    tsel.addEventListener('change', function(){ self.tol = Number(this.value); self.refresh(); });
    tf.appendChild(tsel);
    tf.appendChild(el('span', 'hint', '画面に見えている f の縦の最大値に対する割合で測ります'));
    ctrl.appendChild(tf);

    const c1 = el('label', 'chk');
    const i1 = document.createElement('input'); i1.type = 'checkbox'; i1.checked = true; i1.autocomplete = 'off';
    i1.addEventListener('change', function(){ self.ghost = this.checked; self.refresh(); });
    c1.appendChild(i1); c1.appendChild(el('span', null, '低い次数も薄く重ねる'));

    const c2 = el('label', 'chk');

    ctrl.appendChild(c2);
  } else {
    /* 見出しは uppercase 表示なので記号を入れない（θ* が Θ* になってしまう）．

/* --------------------------------------------------------------------
   再生（次数を 1 つずつ上げる）
   -------------------------------------------------------------------- */
Sim.prototype.toggle = function(){
  if (this.playing){ this.stop(); return; }
  if (this.N >= this.nmax()) this.N = 0;
  this.playing = true; this.acc = 0;
  this.syncPlay(); this.syncCtl(); this.refresh(); kick();
};
Sim.prototype.stop = function(){ this.playing = false; this.syncPlay(); };
Sim.prototype.syncPlay = function(){
  if (this.bPlay) this.bPlay.textContent = this.playing ? '⏸ 止める' : '▶ 次数を 1 つずつ上げる';
};
Sim.prototype.step = function(dt){
  if (!this.playing) return;
  this.acc += dt;
  if (this.acc < 0.62) return;
  this.acc = 0;
  this.N++;
  if (this.N >= this.nmax()){ this.N = this.nmax(); this.stop(); }
  this.syncCtl(); this.refresh();
};

/* ========================================================================
   3. 座標まわりの道具
   ======================================================================== */
function niceTicks(lo, hi, want){
  const raw = (hi - lo) / Math.max(1, want);
  const m = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / m;
  const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * m;
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(v);
  return { step: step, list: out };
}
function tickLab(v, step){
  if (Math.abs(v) < step * 1e-6) return '0';
  const d = Math.max(0, Math.min(4, Math.ceil(-Math.log10(step) + 0.3)));
  return v.toFixed(d);
}
/* π を単位にした目盛（sin, cos 用）．0, π/2, π, 3π/2 … と出す． */
function piTicks(lo, hi){
  const step = PI / 2, out = [];
  for (let k = Math.ceil(lo / step - 1e-9); k * step <= hi + 1e-9; k++){
    const v = k * step;
    let s;
    if (k === 0) s = '0';
    else {
      const sg = k < 0 ? '−' : '', m = Math.abs(k);
      s = (m % 2 === 0) ? (m === 2 ? 'π' : (m / 2) + 'π') : (m === 1 ? 'π/2' : m + 'π/2');
      s = sg + s;
    }
    out.push([v, s]);
  }
  return out;
}
/* 縦は符号つきの対数（誤差が 10⁻¹⁶ から 10⁺⁴ まで振れるため） */
function logY(v, lo, hi){
  const a = Math.max(Math.abs(v), lo);
  return Math.log10(a / lo) / Math.log10(hi / lo);
}

Sim.prototype.xrange = function(){
  if (this.key === 'phys'){
    const p = this.ap();
    return [p.xlo !== undefined ? p.xlo : -p.xhi, p.xhi];
  }
  return [-this.span, this.span];
};
Sim.prototype.yrange = function(){
  return this.key === 'phys' ? this.ap().ylim : this.fn().ylim;
};
/* 「誤差 1 %」を測るときの縦のスケール．画面に見えている f の |値| の最大． */
Sim.prototype.scale = function(){
  const r = this.xrange(), yl = this.yrange();
  const f = this.key === 'phys' ? (x => this.ap().f(x)) : this.fn().f;
  let m = 0;
  for (let i = 0; i <= 400; i++){
    const x = r[0] + (r[1] - r[0]) * i / 400, v = f(x);
    if (isFinite(v) && v >= yl[0] && v <= yl[1]) m = Math.max(m, Math.abs(v));
  }
  return m > 0 ? m : 1;
};
Sim.prototype.val = function(N, x){
  return this.key === 'phys' ? taylorApp(this.ap(), N, x) : taylor(this.fn(), this.a, N, x);
};
Sim.prototype.exact = function(x){
  return this.key === 'phys' ? this.ap().f(x) : this.fn().f(x);
};
Sim.prototype.centre = function(){ return this.key === 'phys' ? this.ap().a : this.a; };
/* 調べる点の書き方．タブ③は場面ごとの変数記号（θ, r, β …）で軸ラベルや
   多項式と揃えないと，同じ画面に θ と x* が混ざって読み手が迷う */
Sim.prototype.vsym = function(){
  return (this.key === 'phys' && this.ap().vsym) ? this.ap().vsym : 'x';
};

/* --------------------------------------------------------------------
   いま描いている多項式を式として出す
   -------------------------------------------------------------------- */
function fracHTML(num, den){
  if (!den) return num;
  return '<span class="frac"><span>' + num + '</span><span>' + den + '</span></span>';
}
function sigHTML(v, k){
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a < 1e-4 || a >= 1e5) return a.toExponential(2).replace(/e([+-])(\d+)/, '×10<sup>$1$2</sup>').replace('+', '');
  const d = Math.max(0, (k || 4) - 1 - Math.floor(Math.log10(a)));
  return a.toFixed(Math.min(6, d));
}
/* (x − a)ⁿ の書き方．a = 0 なら x，n = 1 なら指数を省く．
   タブ③では変数が θ・r・β なので，記号 v を軸ラベルに合わせて差し替える． */
function varHTML(cen, n, v){
  const s = v || 'x';
  const base = Math.abs(cen) < 1e-12 ? s
    : '(' + s + ' ' + (cen < 0 ? '+ ' : '− ') + sigHTML(Math.abs(cen), 3) + ')';
  return n === 0 ? '' : (n === 1 ? base : base + '<sup>' + n + '</sup>');
}
/* 係数つきの 1 項．係数が ±1 のときは 1 を書かない． */
function termHTML(c, cen, n, v){
  if (n === 0) return sigHTML(c, 4);
  const one = Math.abs(Math.abs(c) - 1) < 1e-12;
  return (one ? '' : sigHTML(c, 4)) + varHTML(cen, n, v);
}
Sim.prototype.polyHTML = function(){
  const N = this.N, MAXT = 9;
  const sym = (this.key !== 'phys') && Math.abs(this.a) < 1e-12;
  const fn = this.fn(), pa = this.key === 'phys' ? this.ap() : null;
  const c0 = this.centre();
  const vs = (pa && pa.vsym) ? pa.vsym : 'x';    // 軸ラベルと同じ変数記号で書く
  const out = []; let cut = false;
  for (let n = 0; n <= N; n++){
    let sgn, body;
    if (sym){
      const t = fn.term(n);
      if (t === null) continue;
      sgn = t.sgn;
      body = fracHTML(t.num, t.den);
    } else {
      const c = pa ? pa.coef(n) : (function(){ let fk = 1; for (let i = 2; i <= n; i++) fk *= i; return fn.d(n, c0) / fk; })();
      if (!isFinite(c) || Math.abs(c) < 1e-12) continue;
      sgn = c < 0 ? -1 : 1;
      body = termHTML(c, c0, n, vs);
    }
    if (out.length >= MAXT){ cut = true; break; }
    out.push({ sgn: sgn, body: body, n: n });
  }
  if (!out.length) return '<span class="lb">いま描いている多項式</span><span class="t">T<sub>'
    + N + '</sub>(' + vs + ') = 0<span class="cut">（すべての係数が 0）</span></span>';
  let s = '<span class="lb">いま描いている多項式</span><span class="t">T<sub>' + N + '</sub>(' + vs + ') = ';
  out.forEach(function(t, i){
    const isNew = (t.n === N) || (i === out.length - 1 && !cut && t.n <= N);
    const sign = i === 0 ? (t.sgn < 0 ? '− ' : '') : (t.sgn < 0 ? ' − ' : ' + ');
    s += sign + '<span class="t' + (t.n === N && N > 0 ? ' new' : '') + '">' + t.body + '</span>';
  });
  if (cut) s += ' <span class="cut">+ …（' + (N + 1) + ' 項のうち先頭の ' + MAXT + ' 項）</span>';
  s += '</span>';
  return s;
};

/* --------------------------------------------------------------------
   コントロールの表示を状態に合わせる
   -------------------------------------------------------------------- */
Sim.prototype.syncCtl = function(){
  this.nIn.max = String(this.nmax());
  this.nIn.value = String(this.N);
  this.nLab.innerHTML = 'N = ' + this.N;
  if (this.aIn){
    this.aLab.innerHTML = 'a = ' + this.a.toFixed(2);
    this.aIn.value = String(this.span > 0 ? clamp(this.a / (this.span * 0.8), -1, 1) : 0);
  }
  if (this.sIn) this.sLab.innerHTML = '横 ±' + this.span.toFixed(1);
  if (this.xIn){
    const r = this.xrange();
    this.xLab.innerHTML = this.vsym() + '* = ' + this.probe.toFixed(3);
    this.xIn.value = String(clamp((this.probe - r[0]) / (r[1] - r[0]), 0.02, 1));
  }
  if (this.selFn) this.selFn.value = this.fkey;
  if (this.selApp) this.selApp.value = this.akey;
  if (this.alRow) this.alRow.style.display = this.ap().alpha ? '' : 'none';
  if (this.alLab) this.alLab.innerHTML = 'α = ' + this.alpha.toFixed(2);
  this.syncPlay();
};

Sim.prototype.refresh = function(){
  this.syncCtl();
  this.draw();
  this.updateReadout();
  postHeight();
};

/* ========================================================================
   4. 描画
   ======================================================================== */
const DPR = Math.min(window.devicePixelRatio || 1, 2);

Sim.prototype.resize = function(){
  const w = Math.max(300, this.cv.parentNode.clientWidth);
  const h = Math.round(clamp(w * (this.key === 'err' ? 0.44 : 0.54), 250, 430));
  if (this.W === w && this.H === h) return;
  this.W = w; this.H = h;
  this.cv.width = Math.round(w * DPR); this.cv.height = Math.round(h * DPR);
  this.cv.style.height = h + 'px';
  this.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
};

/* 枠と目盛．tx は x 目盛の [値, ラベル] の配列． */
Sim.prototype.box = function(x0, y0, x1, y1, tx, ty, xlab, ylab){
  const c = this.ctx;
  c.fillStyle = '#fff'; c.fillRect(x0, y0, x1 - x0, y1 - y0);
  c.strokeStyle = 'rgba(31,35,40,.07)'; c.lineWidth = 1;
  c.beginPath();
  tx.forEach(function(t){ c.moveTo(t[2], y0); c.lineTo(t[2], y1); });
  ty.forEach(function(t){ c.moveTo(x0, t[2]); c.lineTo(x1, t[2]); });
  c.stroke();
  c.strokeStyle = 'rgba(31,35,40,.22)';
  c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.fillStyle = '#5c6670'; c.font = '10px ' + CFONT;
  c.textAlign = 'center'; c.textBaseline = 'top';
  tx.forEach(function(t){ if (t[1]) c.fillText(t[1], t[2], y1 + 4); });
  c.textAlign = 'right'; c.textBaseline = 'middle';
  ty.forEach(function(t){ if (t[1]) c.fillText(t[1], x0 - 5, t[2]); });
  c.textAlign = 'right'; c.textBaseline = 'top';
  c.fillText(xlab, x1, y1 + 15);
  c.textAlign = 'left'; c.textBaseline = 'bottom';
  c.fillText(ylab, x0, y0 - 3);
};

/* 1 本の曲線．極や発散で線がつながらないよう，外れたらペンを上げる． */
function curve(c, x0, x1, px, py, f, lo, hi){
  const H = hi - lo, BIG = 6 * H;
  c.beginPath();
  let down = false;
  const M = Math.max(200, Math.round(x1 - x0));
  for (let i = 0; i <= M; i++){
    const X = x0 + (x1 - x0) * i / M, v = f(px(X));
    if (!isFinite(v) || v > hi + BIG || v < lo - BIG){ down = false; continue; }
    const Y = py(v);
    if (!down){ c.moveTo(X, Y); down = true; } else c.lineTo(X, Y);
  }
  c.stroke();
}

/* --------------------------------------------------------------------
   ①③：f と Tₙ を重ねる
   -------------------------------------------------------------------- */
Sim.prototype.drawGraph = function(){
  const c = this.ctx, W = this.W, H = this.H;
  const isP = this.key === 'phys', pa = isP ? this.ap() : null, fn = this.fn();
  const r = this.xrange(), yl = this.yrange();
  const padL = 50, padR = 16, padT = 18, padB = 32;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
  const X = v => x0 + (v - r[0]) / (r[1] - r[0]) * (x1 - x0);
  const Y = v => y1 - (v - yl[0]) / (yl[1] - yl[0]) * (y1 - y0);
  const px = p => r[0] + (p - x0) / (x1 - x0) * (r[1] - r[0]);
  const self = this;

  c.clearRect(0, 0, W, H);

  /* --- 目盛 --- */
  let tx;
  if (!isP && fn.piAxis){
    tx = piTicks(r[0], r[1]).map(t => [t[0], t[1], X(t[0])]);
  } else if (isP && pa.deg){
    tx = [];
    for (let d = -180; d <= 180; d += 30){
      const v = d / DEG;
      if (v >= r[0] - 1e-9 && v <= r[1] + 1e-9) tx.push([v, d + '°', X(v)]);
    }
  } else {
    const t = niceTicks(r[0], r[1], 8);
    tx = t.list.map(v => [v, tickLab(v, t.step), X(v)]);
  }
  const tyR = niceTicks(yl[0], yl[1], 6);
  const ty = tyR.list.map(v => [v, tickLab(v, tyR.step), Y(v)]);
  this.box(x0, y0, x1, y1, tx, ty,
    isP ? pa.xlab + ' →' : 'x →',
    isP ? pa.ylab : 'y');

  c.save();
  c.beginPath(); c.rect(x0, y0, x1 - x0, y1 - y0); c.clip();

  /* --- 合っている範囲の帯 --- */
  const cen = this.centre();
  if (this.band){
    const g = isP ? goodRangeApp(pa, this.N, this.tol, this.scale(), r[0], r[1])
                  : goodRange(fn, cen, this.N, this.tol, this.scale(), this.span * 1.02);
    this.good = g;
    if (g[0] + g[1] > 0){
      c.fillStyle = 'rgba(46,125,50,.10)';
      c.fillRect(X(cen - g[0]), y0, X(cen + g[1]) - X(cen - g[0]), y1 - y0);
      c.strokeStyle = 'rgba(46,125,50,.55)'; c.lineWidth = 1; c.setLineDash([4, 3]);
      c.beginPath();
      c.moveTo(X(cen - g[0]), y0); c.lineTo(X(cen - g[0]), y1);
      c.moveTo(X(cen + g[1]), y0); c.lineTo(X(cen + g[1]), y1);
      c.stroke(); c.setLineDash([]);
    }
  } else {
    this.good = isP ? goodRangeApp(pa, this.N, this.tol, this.scale(), r[0], r[1])
                    : goodRange(fn, cen, this.N, this.tol, this.scale(), this.span * 1.02);
  }

  /* --- 0 の線 --- */
  if (yl[0] < 0 && yl[1] > 0){
    c.strokeStyle = 'rgba(31,35,40,.30)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x0, Y(0)); c.lineTo(x1, Y(0)); c.stroke();
  }

  /* --- 低い次数（薄く） --- */
  if (this.ghost && this.N > 0){
    const list = [];
    for (let n = 0; n < this.N; n++) list.push(n);
    const keep = list.length <= 8 ? list : list.filter((n, i) => i % Math.ceil(list.length / 8) === 0 || n === this.N - 1);
    keep.forEach(function(n, i){
      c.strokeStyle = 'rgba(157,182,205,' + (0.30 + 0.45 * (i + 1) / keep.length).toFixed(3) + ')';
      c.lineWidth = 1.3;
      curve(c, x0, x1, px, Y, function(x){ return self.val(n, x); }, yl[0], yl[1]);
    });
  }

  /* --- もとの関数 --- */
  c.strokeStyle = '#15202b'; c.lineWidth = 2.5;
  curve(c, x0, x1, px, Y, function(x){ return self.exact(x); }, yl[0], yl[1]);

  /* --- N 次の近似 --- */
  c.strokeStyle = '#0f4c81'; c.lineWidth = 2.6;
  curve(c, x0, x1, px, Y, function(x){ return self.val(self.N, x); }, yl[0], yl[1]);

  /* --- 特異点（グラフが壊れる場所） --- */
  const poles = isP ? [] : (fn.pole || []);
  poles.forEach(function(p){
    if (p < r[0] || p > r[1]) return;
    c.strokeStyle = 'rgba(138,90,0,.55)'; c.lineWidth = 1.4; c.setLineDash([2, 3]);
    c.beginPath(); c.moveTo(X(p), y0); c.lineTo(X(p), y1); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#8a5a00'; c.font = '10px ' + CFONT; c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText('特異点', X(p), y0 + 2);
  });

  /* --- 展開の中心 --- */
  const fa = this.exact(cen);
  if (isFinite(fa)){
    c.fillStyle = '#c62828';
    c.beginPath(); c.arc(X(cen), Y(fa), 4.2, 0, 6.2832); c.fill();
    c.fillStyle = '#c62828'; c.font = '11px ' + CFONT; c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText(isP ? 'ここで展開' : 'a = ' + cen.toFixed(2), X(cen), Y(fa) - 7);
  }
  c.restore();

  /* --- 次数を大きく --- */
  c.fillStyle = 'rgba(15,76,129,.92)'; c.font = 'bold 15px ' + CFONT;
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText(this.N + ' 次まで', x0 + 8, y0 + 6);
  if (this.good && (this.good[0] + this.good[1]) > 0){
    c.fillStyle = 'rgba(46,125,50,.95)'; c.font = 'bold 11px ' + CFONT;
    c.fillText('合っている幅 ' + (this.good[0] + this.good[1]).toFixed(2), x0 + 8, y0 + 25);
  }
};

/* --------------------------------------------------------------------
   ②：誤差そのものを見る
   -------------------------------------------------------------------- */
Sim.prototype.drawErr = function(){
  const c = this.ctx, W = this.W, H = this.H, fn = this.fn(), self = this;
  const r = this.xrange(), a = this.a;
  const gap = 46, padL = 46, padR = 12, padT = 18, padB = 32;
  const pw = (W - padL * 2 - padR - gap) / 2;
  const A0 = padL, A1 = padL + pw, B0 = A1 + gap + padL, B1 = W - padR;
  const y0 = padT, y1 = H - padB;
  const ELO = 1e-16, EHI = 1e4;
  const EY = v => y1 - logY(v, ELO, EHI) * (y1 - y0);

  c.clearRect(0, 0, W, H);

  /* ---------- 左：誤差 |f − Tₙ| を x の関数として ---------- */
  const X = v => A0 + (v - r[0]) / (r[1] - r[0]) * (A1 - A0);
  const px = p => r[0] + (p - A0) / (A1 - A0) * (r[1] - r[0]);
  let tx;
  if (fn.piAxis) tx = piTicks(r[0], r[1]).map(t => [t[0], t[1], X(t[0])]);
  else { const t = niceTicks(r[0], r[1], 6); tx = t.list.map(v => [v, tickLab(v, t.step), X(v)]); }
  const ty = [];
  for (let e = -16; e <= 4; e += 4) ty.push([e, '10' + (e < 0 ? '⁻' : '') + String(Math.abs(e)).split('').map(d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]).join(''), EY(Math.pow(10, e))]);
  this.box(A0, y0, A1, y1, tx, ty, 'x →', '誤差');

  c.save(); c.beginPath(); c.rect(A0, y0, A1 - A0, y1 - y0); c.clip();

  const NS = [1, 2, 4, 8, 16, 32].filter(n => n <= 40);
  NS.forEach(function(n, i){
    c.strokeStyle = 'rgba(157,182,205,' + (0.35 + 0.5 * i / NS.length).toFixed(3) + ')';
    c.lineWidth = 1.4;
    curve(c, A0, A1, px, EY, function(x){ return Math.abs(fn.f(x) - taylor(fn, a, n, x)); }, 0, 1e30);
  });
  c.strokeStyle = '#c62828'; c.lineWidth = 2.4;
  curve(c, A0, A1, px, EY, function(x){ return Math.abs(fn.f(x) - taylor(fn, a, self.N, x)); }, 0, 1e30);

  /* 収束半径 */
  if (isFinite(fn.R)){
    let Rmin = 1e9;
    fn.sing.forEach(function(z){ Rmin = Math.min(Rmin, Math.hypot(z[0] - a, z[1])); });
    [a - Rmin, a + Rmin].forEach(function(p){
      if (p < r[0] || p > r[1]) return;
      c.strokeStyle = 'rgba(138,90,0,.7)'; c.lineWidth = 1.5; c.setLineDash([5, 3]);
      c.beginPath(); c.moveTo(X(p), y0); c.lineTo(X(p), y1); c.stroke(); c.setLineDash([]);
    });
    c.fillStyle = '#8a5a00'; c.font = '10px ' + CFONT; c.textAlign = 'center'; c.textBaseline = 'top';
    if (a + Rmin <= r[1]) c.fillText('収束半径', X(a + Rmin), y0 + 2);
    this.Rmin = Rmin;
  } else this.Rmin = Infinity;

  /* いま調べている点 */
  c.strokeStyle = 'rgba(31,35,40,.55)'; c.lineWidth = 1.2; c.setLineDash([2, 3]);
  c.beginPath(); c.moveTo(X(this.probe), y0); c.lineTo(X(this.probe), y1); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#15202b'; c.font = '10px ' + CFONT; c.textAlign = 'center'; c.textBaseline = 'bottom';
  c.fillText('x*', X(this.probe), y1 - 3);
  c.restore();
  c.fillStyle = 'rgba(198,40,40,.95)'; c.font = 'bold 11px ' + CFONT;
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText('N = ' + this.N, A0 + 7, y0 + 5);
  c.fillStyle = 'rgba(92,102,112,.9)'; c.font = '10px ' + CFONT;
  c.fillText('薄い線は N = 1, 2, 4, 8, 16, 32', A0 + 7, y0 + 21);

  /* ---------- 右：x* を固定して，次数 n の関数として ---------- */
  const NMAX = 40;
  const NX = n => B0 + n / NMAX * (B1 - B0);
  const tnx = [];
  for (let n = 0; n <= NMAX; n += 10) tnx.push([n, String(n), NX(n)]);
  this.box(B0, y0, B1, y1, tnx, ty.map(t => [t[0], t[1], t[2]]), '次数 n →', '誤差');

  c.save(); c.beginPath(); c.rect(B0, y0, B1 - B0, y1 - y0); c.clip();

  /* Lagrange の上界 */
  c.strokeStyle = '#f9a825'; c.lineWidth = 2; c.setLineDash([4, 3]);
  c.beginPath();
  let down = false;
  for (let n = 0; n <= NMAX; n++){
    const b = lagrangeBound(fn, a, n, this.probe);
    if (!isFinite(b) || b <= 0){ down = false; continue; }
    const Yv = EY(b);
    if (!down){ c.moveTo(NX(n), Yv); down = true; } else c.lineTo(NX(n), Yv);
  }
  c.stroke(); c.setLineDash([]);

  /* 実際の誤差 */
  c.strokeStyle = '#c62828'; c.lineWidth = 2.4;
  c.beginPath(); down = false;
  const errs = [];
  for (let n = 0; n <= NMAX; n++){
    const e = Math.abs(fn.f(this.probe) - taylor(fn, a, n, this.probe));
    errs.push(e);
    if (!isFinite(e)){ down = false; continue; }
    const Yv = EY(Math.max(e, ELO));
    if (!down){ c.moveTo(NX(n), Yv); down = true; } else c.lineTo(NX(n), Yv);
  }
  c.stroke();

  /* 倍精度の限界 */
  c.strokeStyle = 'rgba(31,35,40,.28)'; c.lineWidth = 1; c.setLineDash([1, 3]);
  c.beginPath(); c.moveTo(B0, EY(2.2e-16)); c.lineTo(B1, EY(2.2e-16)); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#5c6670'; c.font = '9px ' + CFONT; c.textAlign = 'right'; c.textBaseline = 'bottom';
  c.fillText('倍精度の限界', B1 - 3, EY(2.2e-16) - 2);

  /* いまの N */
  const eN = Math.max(errs[this.N] || ELO, ELO);
  c.strokeStyle = 'rgba(198,40,40,.45)'; c.lineWidth = 1; c.setLineDash([2, 2]);
  c.beginPath(); c.moveTo(NX(this.N), y0); c.lineTo(NX(this.N), y1); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#c62828';
  c.beginPath(); c.arc(NX(this.N), EY(eN), 4, 0, 6.2832); c.fill();
  c.restore();

  c.fillStyle = 'rgba(31,35,40,.85)'; c.font = '10px ' + CFONT;
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText('x* = ' + this.probe.toFixed(3) + ' に固定', B0 + 7, y0 + 5);
};

Sim.prototype.draw = function(){
  this.resize();
  if (!this.W) return;
  if (this.key === 'err') this.drawErr(); else this.drawGraph();
};

/* ========================================================================
   5. 読み取り値・数式・解説
   ======================================================================== */
const EQ_TAYLOR =
  '<math display="block"><mrow>'
  + '<msub><mi>T</mi><mi>N</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo>'
  + '<munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mi>N</mi></munderover>'
  + '<mfrac><mrow><msup><mi>f</mi><mrow><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo></mrow></msup>'
  + '<mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo></mrow><mrow><mi>n</mi><mo>!</mo></mrow></mfrac>'
  + '<msup><mrow><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mi>a</mi><mo stretchy="false">)</mo></mrow><mi>n</mi></msup>'
  + '</mrow></math>'
  + '<span class="cmt"><i>a</i> = 0 のときが <b>Maclaurin 展開</b>．'
  + '「<i>a</i> で <i>N</i> 階までの微分係数がぴったり一致する多項式」がこれ 1 つに決まる</span>';

const EQ_REM =
  '<math display="block"><mrow>'
  + '<mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo>'
  + '<msub><mi>T</mi><mi>N</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>+</mo>'
  + '<munder><munder><mrow><mfrac><mrow><msup><mi>f</mi><mrow><mo stretchy="false">(</mo><mi>N</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></msup>'
  + '<mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mi>N</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mo>!</mo></mrow></mfrac>'
  + '<msup><mrow><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mi>a</mi><mo stretchy="false">)</mo></mrow><mrow><mi>N</mi><mo>+</mo><mn>1</mn></mrow></msup></mrow>'
  + '<mo>&#x23DF;</mo></munder><mtext>剰余項 R</mtext></munder>'
  + '<mo>,</mo><mspace width="1em"></mspace><mi>a</mi><mo>&lt;</mo><mi>c</mi><mo>&lt;</mo><mi>x</mi>'
  + '</mrow></math>'
  + '<span class="cmt">「ある <i>c</i> が<b>存在する</b>」としか言えないが，その <i>c</i> は下の読み取り値で実際に探してあります</span>';

Sim.prototype.lastTermHTML = function(){
  const N = this.N;
  if (N === 0) return '定数項 f(a)';
  if (this.key === 'phys'){
    const pa = this.ap(), c = pa.coef(N);
    if (Math.abs(c) < 1e-14) return '0（この次数の項は無い）';
    return (c < 0 ? '−' : '+') + ' ' + termHTML(Math.abs(c), pa.a, N, pa.vsym);
  }
  if (Math.abs(this.a) < 1e-12){
    const t = this.fn().term(N);
    if (t === null) return '0（この次数の項は無い）';
    return (t.sgn < 0 ? '−' : '+') + ' ' + fracHTML(t.num, t.den);
  }
  let fk = 1; for (let i = 2; i <= N; i++) fk *= i;
  const c = this.fn().d(N, this.a) / fk;
  if (!isFinite(c)) return '—';
  if (Math.abs(c) < 1e-14) return '0（この次数の項は無い）';
  return (c < 0 ? '−' : '+') + ' ' + termHTML(Math.abs(c), this.a, N);
};

Sim.prototype.updateReadout = function(){
  const R = [];
  const cen = this.centre();

  if (this.key === 'grow' || this.key === 'phys'){
    const g = this.good || [0, 0], sc = this.scale();
    const wide = (g[0] + g[1]) > 0;
    R.push(['近似の次数 N', String(this.N)]);
    if (this.key === 'phys'){
      const pa = this.ap();
      pa.extra(this.probe, this.N).forEach(function(row){ R.push(row); });
      const e = Math.abs(pa.f(this.probe) - taylorApp(pa, this.N, this.probe));
      R.push([this.vsym() + '* での N 次の誤差', fmt(e, 6)]);
    }
    R.push(['合っている範囲', wide
      ? (cen - g[0]).toFixed(3) + ' … ' + (cen + g[1]).toFixed(3)
      : 'まだ帯が生まれていない', wide ? 'hi' : 'bad']);
    R.push(['その幅', (g[0] + g[1]).toFixed(3), wide ? 'hi' : 'bad']);
    R.push(['許容している誤差', '±' + fmt(this.tol * sc, 4) + '（縦の最大値の ' + (this.tol * 100) + ' %）']);
    R.push(['最後に足した項', this.lastTermHTML()]);
    if (this.key === 'grow'){
      const fn = this.fn();
      let Rr = Infinity;
      fn.sing.forEach(function(z){ Rr = Math.min(Rr, Math.hypot(z[0] - cen, z[1])); });
      R.push(['この a での収束半径', isFinite(Rr) ? Rr.toFixed(4) : '∞（どこまでも収束する）',
        isFinite(Rr) ? '' : 'hi']);
    }
  } else {
    const fn = this.fn(), a = this.a, x = this.probe, N = this.N;
    const ex = fn.f(x), ap = taylor(fn, a, N, x);
    const err = Math.abs(ex - ap);
    const bnd = lagrangeBound(fn, a, N, x);
    const cc = findC(fn, a, N, x);
    const Rr = this.Rmin === undefined ? Infinity : this.Rmin;
    const q = isFinite(Rr) ? Math.abs(x - a) / Rr : 0;
    R.push(['調べる点 x*', x.toFixed(4)]);
    R.push(['厳密な f(x*)', fmt(ex, 6)]);
    R.push(['N 次の近似 T<sub>N</sub>(x*)', fmt(ap, 6)]);
    R.push(['実際の誤差 |R|', fmt(err, 6), err < 1e-6 ? 'hi' : '']);
    R.push(['Lagrange の上界', fmt(bnd, 6)]);
    R.push(['上界 ÷ 実際', bnd > 0 && err > 0 ? (bnd / err).toFixed(3) + ' 倍' : '—']);
    R.push(['等式を満たす c', cc === null ? '（この次数では見つからず）' : cc.toFixed(6) + '（a と x* の間）']);
    R.push(['収束半径 R', isFinite(Rr) ? Rr.toFixed(4) : '∞']);
    R.push(['|x* − a| ÷ R', isFinite(Rr) ? q.toFixed(4) + (q < 1 ? '　< 1 ⇒ 収束する' : '　> 1 ⇒ 発散する') : '0　⇒ 必ず収束する',
      (!isFinite(Rr) || q < 1) ? 'hi' : 'bad']);
  }

  this.readout.innerHTML = R.map(function(r){
    return '<div' + (r[2] ? ' class="' + r[2] + '"' : '') + '><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');

  /* 数式ボックスと解説 */
  if (this.key === 'phys'){
    const pa = this.ap();
    this.eqbox.innerHTML = pa.eq;
    this.body.innerHTML = '<div class="note key">' + pa.story + '</div>' + PHYS_NOTE;
  } else if (this.key === 'err'){
    this.eqbox.innerHTML = EQ_REM;
    this.body.innerHTML = ERR_NOTE + '<div class="note"><b>いま選んでいる関数について．</b>' + this.fn().why + '</div>';
  } else {
    this.eqbox.innerHTML = EQ_TAYLOR;
    this.body.innerHTML = GROW_NOTE + '<div class="note"><b>いま選んでいる関数について．</b>' + this.fn().why + '</div>';
  }
  this.poly.innerHTML = this.polyHTML();
};

/* ------------------------------------------------------------------ */
const GROW_NOTE =
  '<div class="note key"><b>何を作っているのか．</b>'
  + '<i>T<sub>N</sub></i>(<i>x</i>) は「点 <i>a</i> において，値も，傾きも，曲がり方も…<b><i>N</i> 階微分まで全部 <i>f</i> と一致する多項式</b>」です．'
  + 'そういう多項式はただ 1 つに決まって，それが <i>f</i><sup>(<i>n</i>)</sup>(<i>a</i>)/<i>n</i>! を係数に持つ Taylor 多項式になります．'
  + '<i>a</i> でぴったり貼りついた線が，次数を上げるほど<b>両側へ伸びていく</b>のが上の図です．</div>'
  + '<div class="note"><b>まず sin <i>x</i> で「▶ 次数を 1 つずつ上げる」を押してみてください．</b>'
  + '1 次では原点のごく近くしか合いませんが（これが sin <i>θ</i> ≒ <i>θ</i>），'
  + '3 次で <i>x</i> ≒ 1.0，5 次で ≒ 1.8，9 次では ≒ 3.2 まで，緑の帯がぐんぐん広がります．'
  + '<b>奇数次でしか帯が広がらない</b>のは，sin が奇関数で偶数次の係数が全部 0 だからです'
  + '（cos なら逆に偶数次だけ）．</div>'
  + '<div class="note"><b>次に 1/(1−<i>x</i>) を選んでみてください．</b>'
  + 'いくら次数を上げても，帯は <b><i>x</i> = 1 の手前で必ず止まります</b>．'
  + '関数そのものがそこで発散しているので，多項式が追いつけるはずがありません．'
  + 'この「どこまで伸びられるか」の限界が<b>収束半径</b>です．</div>'
  + '<div class="note warn"><b>ところが 1/(1+<i>x</i>²) も，まったく同じ <i>x</i> = ±1 で止まります．</b>'
  + 'この関数は実軸のどこにも壊れる場所が無く，どこまでも滑らかなのに，です．'
  + '理由は<b>複素平面</b>にあって，<i>x</i> = ±<i>i</i> で分母が 0 になる．'
  + '原点からそこまでの距離がちょうど 1 なので，収束半径も 1 になります．'
  + '実数しか見ていないと絶対に説明のつかない現象で，'
  + 'Taylor 展開が本当は複素関数論の話だということが，ここで顔を出します．</div>'
  + '<div class="note"><b><i>a</i> を動かすと，帯が <i>a</i> について行きます．</b>'
  + '緑の帯はいつも展開の中心に貼りついています．'
  + '「<i>x</i> = 0 のまわりでしか使えない」のではなく，'
  + '<b>どこで展開するかは自分で選べる</b>のです．'
  + 'ポテンシャルの底のまわりで展開する（タブ③）のがその代表例です．</div>'
  + '<div class="note"><b>最後に e<sup>−1/x²</sup> を選んでみてください．</b>'
  + '「▶ 次数を 1 つずつ上げる」を押しても，<b>緑の帯がまったく広がりません</b>．'
  + '<i>x</i> = 0 では全ての階の微分係数が 0 なので，Taylor 多項式が '
  + '<i>T<sub>N</sub></i> ≡ 0 のまま<b>いつまでも動かない</b>からです'
  + '（原点のごく近くだけは，<i>f</i> 自身がほとんど 0 なので「合って」しまいます）．'
  + '級数はどんな <i>x</i> でも収束しますが，収束先は 0 で，<b>もとの関数ではありません</b>．'
  + '「級数を作れば元の関数に戻る」は<b>証明が要る主張</b>で，それをやるのが剰余項です（タブ②）．</div>';

const ERR_NOTE =
  '<div class="note key"><b>剰余項とは，切り捨てた残り全部のことです．</b>'
  + '講義ノートの <i>R</i><sub><i>n</i>+1</sub> がこれで，Lagrange の形では'
  + '<i>f</i><sup>(<i>N</i>+1)</sup>(<i>c</i>)/(<i>N</i>+1)!·(<i>x</i>−<i>a</i>)<sup><i>N</i>+1</sup>．'
  + '定理が言うのは「そういう <i>c</i> が <i>a</i> と <i>x</i> の間に<b>存在する</b>」ということだけですが，'
  + 'ここでは実際に数値で探して表示しています．</div>'
  + '<div class="note"><b>右のグラフの読み方．</b>'
  + '赤が実際の誤差，橙の破線が Lagrange の上界です．'
  + '<b>赤は必ず橙の下にいます</b>（それが定理の主張）．'
  + '上界がどれだけ実際に近いかは「上界 ÷ 実際」で読めます ―― 数倍以内なら，かなり良い見積りです．</div>'
  + '<div class="note"><b>なぜ誤差が 10<sup>−16</sup> で止まるのか．</b>'
  + '倍精度の実数は 16 桁ぶんしか持てないので，そこから下は計算機の丸め誤差に埋もれます．'
  + '数学的な誤差が消えたわけではなく，<b>この道具では見えなくなった</b>だけです．'
  + '（sin <i>x</i> の <i>x</i> = 0 まわりの級数を <i>x</i> = 12 で使うと途中の項が 10<sup>4</sup> まで大きくなるので，'
  + '桁落ちで床がもう少し上がります．）</div>'
  + '<div class="note"><b>|x − a| ÷ R が 1 を越えると，増やすほど悪くなります．</b>'
  + '左のグラフで，収束半径の外側では薄い線（低い次数）より赤い線（高い次数）の方が<b>上に</b>来ます．'
  + '「項を増やせば良くなる」は，収束半径の内側でだけ正しい話です．</div>'
  + '<div class="note warn"><b>e<sup>−1/x²</sup> ではこの図が使えません．</b>'
  + '<i>T<sub>N</sub></i> ≡ 0 なので誤差は <i>f</i>(<i>x</i>) そのもの ―― <b>次数を上げても一切減りません</b>．'
  + '級数はどこでも収束する（収束半径 ∞）のに，収束先が元の関数ではない．'
  + '「収束する」と「元の関数に戻る」は別のことだ，と教えてくれる例です．</div>';

const PHYS_NOTE =
  '<div class="note"><b>物理の式のほとんどは，どこかで Taylor 展開を切ったものです．</b>'
  + '正確な式は大抵は解けません．そこで「小さい量」を見つけて，その 1 次か 2 次で切る．'
  + '出てきた式が扱いやすいのは，<b>多項式だから</b>です．'
  + '大事なのは，<b>いつその近似が壊れるかを知っておくこと</b> ―― それが上の緑の帯です．</div>'
  + '<div class="note"><b>「小さい量」は無次元でなければいけません．</b>'
  + '<i>β</i> = <i>v</i>/<i>c</i>，<i>x</i> = <i>hν</i>/<i>k</i><sub>B</sub><i>T</i>，<i>θ</i>［rad］．'
  + 'どれも単位を持たない量です．「<i>v</i> が小さい」には意味がありませんが（何に比べて？），'
  + '「<i>v</i>/<i>c</i> が小さい」には意味があります．'
  + '<b>何に比べて小さいのかを言えたとき，初めて展開できる</b>のです．</div>';

/* ========================================================================
   6. アニメーション
   ======================================================================== */
let rafId = null, last = 0;
function loop(now){
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  let busy = false;
  Object.keys(sims).forEach(function(k){
    const s = sims[k];
    if (!s.playing || s.root.hidden) return;
    s.step(dt); busy = true;
  });
  rafId = busy ? requestAnimationFrame(loop) : null;
}
function kick(){
  if (rafId === null){ last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ========================================================================
   7. 立ち上げ
   ======================================================================== */
let only = null;
const mm = /[?&]only=(grow|err|phys)/.exec(location.search);
if (mm) only = mm[1];
if (only || /[?&]embed=/.test(location.search)) app.classList.add('is-embed');
if (only) app.classList.add('is-single');   /* 1 枚だけ ⇒ タブを隠す */

['grow', 'err', 'phys'].forEach(function(key){
  const p = app.querySelector('[data-panel="' + key + '"]');
  if (!p) return;
  if (only && only !== key){ p.parentNode.removeChild(p); return; }
  sims[key] = new Sim(key, p);
});

/* iframe に埋め込まれたとき，親ページへ必要な高さを知らせる． */
let lastPosted = 0;
function postHeight(){
  if (window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height) + 8;
  if (Math.abs(h - lastPosted) < 2) return;
  lastPosted = h;
  try { window.parent.postMessage({ qsim: 'height', height: h }, '*'); } catch (e) {}
}

let active = only || 'grow';
const tabs = app.querySelectorAll('.tab');
function selectTab(name){
  if (!sims[name]) return;
  active = name;
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle('is-active', tabs[i].dataset.tab === name);
  app.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
  sims[name].refresh();
  kick();
}
for (let i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    selectTab(this.dataset.tab);
    if (history.replaceState) history.replaceState(null, '', '#' + active);
  });
}
Object.keys(sims).forEach(function(k){
  const s = sims[k];
  if (k === 'err'){ s.probe = 2.0; }
  if (k === 'phys'){ const a = s.ap(); s.probe = a.a + 0.55 * (a.xhi - a.a); s.N = 1; }
  s.refresh();
});
selectTab(active);
function fromHash(){
  const h = location.hash.replace('#', '');
  if (sims[h]) selectTab(h);
}
if (!only){ window.addEventListener('hashchange', fromHash); fromHash(); }

window.addEventListener('resize', function(){
  Object.keys(sims).forEach(function(k){ sims[k].draw(); });
});
window.addEventListener('pageshow', function(){
  Object.keys(sims).forEach(function(k){ sims[k].refresh(); });
});

window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
app.addEventListener('toggle', postHeight, true);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
setTimeout(postHeight, 60);

})();
</script>
