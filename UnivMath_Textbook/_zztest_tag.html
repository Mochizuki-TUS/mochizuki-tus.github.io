<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>test tag</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    tags: 'ams',
    macros: {
      bm: ["\\boldsymbol{#1}", 1]
    }
  },
  chtml: { scale: 1.02 }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<script src="assets/mathwrap.js" defer></script>
</head>
<body>
<p>test A: bare label, no tag</p>
$$
a+b=c
\label{eq:A}
$$
<p>ref to A: \eqref{eq:A}</p>

<p>test B: with explicit \tag</p>
$$
x+y=z
\tag{19.1}
\label{eq:B}
$$
<p>ref to B: \eqref{eq:B}</p>
</body>
</html>
